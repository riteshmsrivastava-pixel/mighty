<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mighty Events · Organizer</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:Schibsted;src:url("../assets/schibsted.woff2") format("woff2");font-weight:400 800;font-display:swap}
:root{
 color-scheme:dark;
 --paper:#121017; --card:rgba(255,255,255,.04); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.06);
 --ink:#F5F1FB; --sub:#B3ADBF; --mute:#8A849C;
 --brand:#B4A4FF; --brand-ink:#B4A4FF; --brand-soft:rgba(180,164,255,.12); --brand-line:rgba(180,164,255,.35);
 --peach:#E87A56; --green:#4EDEA3; --green-soft:rgba(78,222,163,.12); --red:#FFB4AB;
 --inp-bg:rgba(0,0,0,.25); --inp-border:rgba(255,255,255,.12);
 --f:Schibsted,Arial,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
 --r:8px; --pill:999px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.btn{display:inline-block}
.wrap{max-width:640px;margin:0 auto;padding:32px 20px 100px}
.h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
.h3{font-size:16px;font-weight:600;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
.sub{font-size:14.5px;color:var(--sub);line-height:1.5}
.meta{font-family:var(--f-mono);font-size:11.5px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center}
.btn{padding:12px 20px;border-radius:var(--pill);background:linear-gradient(90deg,var(--brand),var(--peach));color:#0B0620;font-size:14.5px;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:9px 16px;font-size:13.5px}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.inp{width:100%;padding:12px 14px;border-radius:6px;border:1px solid var(--inp-border);background:var(--inp-bg);color:var(--ink);font-size:15px}
.inp::placeholder{color:var(--mute)}
.lbl{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);margin-bottom:7px;display:block}
.qrbox{background:#fff;padding:16px;border-radius:12px;width:fit-content}
.spin{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#0B0620;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef} = React;
const sb = window.supabase.createClient(
  'https://hplyyywdftnvjajyncvj.supabase.co',
  'sb_publishable_e_oCwuz3Qlko5N3Xl8ZwxA_zQijz_u8'
);
const clean = (s)=> (s||'').trim();
const csv = (s)=> clean(s).split(',').map(x=>clean(x)).filter(Boolean);

/* Renders a real, scannable QR code entirely client-side (qrcodejs draws to
   a canvas) - no third-party API call carrying the event link out to
   another server just to render a square of pixels. */
function QR({url}){
  const ref = useRef(null);
  useEffect(()=>{
    if(!ref.current) return;
    ref.current.innerHTML = '';
    new QRCode(ref.current, {text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M});
  },[url]);
  return <div className="qrbox"><div ref={ref}/></div>;
}

function EventRow({ev}){
  const [open,setOpen] = useState(false);
  const link = location.origin + location.pathname.replace(/organizer\.html$/, '') + '?e=' + ev.qr_token;
  const ended = new Date(ev.ends_at) < new Date();
  const [copied,setCopied] = useState(false);
  return (
    <div className="card stack">
      <div className="row" style={{justifyContent:'space-between'}}>
        <div>
          <div className="h3">{ev.name}</div>
          <div className="meta" style={{marginTop:3}}>
            {ended ? 'Ended' : 'Open'} · {new Date(ev.starts_at).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}
            {' → '}{new Date(ev.ends_at).toLocaleString([], {hour:'numeric', minute:'2-digit'})}
          </div>
        </div>
        <button className="btn g sm" onClick={()=>setOpen(o=>!o)}>{open ? 'Hide QR' : 'Show QR'}</button>
      </div>
      {open && <div className="stack" style={{alignItems:'flex-start',paddingTop:6}}>
        <QR url={link}/>
        <div className="row" style={{gap:8,width:'100%'}}>
          <input className="inp" readOnly value={link} style={{fontSize:13}}/>
          <button className="btn sm" onClick={async()=>{ await navigator.clipboard.writeText(link); setCopied(true); setTimeout(()=>setCopied(false),1600); }}>
            {copied ? 'Copied' : 'Copy'}
          </button>
        </div>
        <div className="sub">Print this or display it at the door. Anyone who scans it checks in with no account needed.</div>
      </div>}
    </div>
  );
}

function NewEventForm({onCreated}){
  const [name,setName] = useState(''); const [hours,setHours] = useState(4);
  const [lookingFor,setLookingFor] = useState('Investors, Co-founders, Mentors, Customers, Hiring, New role, Just meeting people');
  const [offering,setOffering] = useState('Founder, Investor, Alum, Student, Operator, Advisor');
  const [busy,setBusy] = useState(false); const [err,setErr] = useState(null);

  const submit = async ()=>{
    if(!clean(name)) return setErr('Name the event so attendees recognise it on the check-in screen.');
    setBusy(true); setErr(null);
    try{
      const {data:{session}} = await sb.auth.getSession();
      const starts = new Date(); const ends = new Date(Date.now() + hours*3600e3);
      const {data, error} = await sb.from('event_sessions').insert({
        organizer_id: session.user.id, name: clean(name),
        looking_for_tags: csv(lookingFor), offering_tags: csv(offering),
        starts_at: starts.toISOString(), ends_at: ends.toISOString(),
      }).select().single();
      if(error) throw error;
      setName(''); onCreated(data);
    }catch(e){ setErr(e.message || String(e)); }
    setBusy(false);
  };

  return (
    <div className="card stack">
      <div className="h3">New event</div>
      <div>
        <div className="lbl">Name</div>
        <input className="inp" value={name} onChange={e=>setName(e.target.value)} placeholder="MIT Sloan Alumni Mixer"/>
      </div>
      <div>
        <div className="lbl">Open for how long, starting now</div>
        <div className="row" style={{gap:8}}>
          {[2,4,6,8].map(h=>(
            <button key={h} className="btn g sm" style={h===hours?{borderColor:'var(--brand-line)',color:'var(--brand-ink)'}:{}}
              onClick={()=>setHours(h)}>{h}h</button>
          ))}
        </div>
      </div>
      <div>
        <div className="lbl">What attendees say they're here for (comma-separated)</div>
        <input className="inp" value={lookingFor} onChange={e=>setLookingFor(e.target.value)}/>
      </div>
      <div>
        <div className="lbl">Who attendees are (comma-separated)</div>
        <input className="inp" value={offering} onChange={e=>setOffering(e.target.value)}/>
      </div>
      {err && <div className="sub" style={{color:'var(--red)'}}>{err}</div>}
      <button className="btn" disabled={busy} onClick={submit} style={{alignSelf:'flex-start'}}>
        {busy ? <span className="spin"/> : 'Create event'}
      </button>
    </div>
  );
}

function App(){
  const [state,setState] = useState('loading'); // loading | signedout | notorganizer | ready
  const [events,setEvents] = useState([]);

  const load = async (uid)=>{
    const {data} = await sb.from('event_sessions').select('*').eq('organizer_id', uid).order('starts_at', {ascending:false});
    setEvents(data||[]);
  };

  useEffect(()=>{
    (async ()=>{
      const {data:{session}} = await sb.auth.getSession();
      if(!session || session.user.is_anonymous){ setState('signedout'); return; }
      const {data: isOrg} = await sb.rpc('is_event_organizer', {p_user_id: session.user.id});
      if(!isOrg){ setState('notorganizer'); return; }
      await load(session.user.id);
      setState('ready');
    })();
  },[]);

  if(state==='loading') return <div className="wrap"><div className="sub" style={{paddingTop:60,textAlign:'center'}}><span className="spin"/> Loading...</div></div>;
  if(state==='signedout') return <div className="wrap"><div className="stack" style={{paddingTop:60,textAlign:'center'}}>
    <div className="h1">Sign in first</div>
    <p className="sub">Log into Mighty in this same browser, then reload this page.</p>
    <a className="btn" href="../app/">Open Mighty</a>
  </div></div>;
  if(state==='notorganizer') return <div className="wrap"><div className="stack" style={{paddingTop:60,textAlign:'center'}}>
    <div className="h1">Not an organizer account</div>
    <p className="sub">Event creation is hand-granted. Ask for access, or run the grant yourself:<br/><span className="meta">insert into event_organizers(user_id) values ('...');</span></p>
  </div></div>;

  return (
    <div className="wrap stack">
      <div>
        <div className="eyebrow">Mighty Events</div>
        <div className="h1" style={{marginTop:6}}>Your events</div>
      </div>
      {events.map(ev=> <EventRow key={ev.id} ev={ev}/>)}
      <NewEventForm onCreated={(ev)=> setEvents(prev=>[ev, ...prev])}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
