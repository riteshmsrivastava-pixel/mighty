// Reads the AI Gateway's own ledger (RLS-scoped to the signed-in user) to show
// how many assists they've used today/this month and the estimated spend. All
// queries fail soft — if the gateway tables aren't deployed yet, it just shows
// a hint instead of an error.
// Loads pdf.js on demand (only when the student picks a PDF) so the app stays
// light for everyone else.
function loadPdfJs(){
  return new Promise((resolve,reject)=>{
    if(window.pdfjsLib) return resolve(window.pdfjsLib);
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; resolve(window.pdfjsLib); }catch(e){ reject(e); } };
    sc.onerror=()=>reject(new Error('Could not load the PDF reader.'));
    document.head.appendChild(sc);
  });
}
async function pdfToText(file){
  const lib=await loadPdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:buf}).promise;
  let out='';
  for(let i=1;i<=Math.min(pdf.numPages,8);i++){
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    out += tc.items.map(it=>it.str).join(' ')+'\n';
  }
  return out;
}
const mergeArr=(a,b)=>{ const seen=new Set((a||[]).map(x=>x.toLowerCase())); return [...(a||[]), ...(b||[]).filter(x=>x&&!seen.has(x.toLowerCase()))]; };

// Fills most of the profile from a resume. Reads the text (PDF via pdf.js, or a
// pasted paste), asks the gateway to extract structured facts, shows them for
// the student to confirm, then MERGES into settings — never overwriting what's
// already there. This is the "AI extracts, you confirm" step.
function ResumeImport({sb, auth, db, patch, onApply}){
  const [text,setText]=useState(''); const [busy,setBusy]=useState(false);
  const [ex,setEx]=useState(null); const [err,setErr]=useState(null); const [done,setDone]=useState(false);
  const mode=llmMode(sb,auth);
  async function onFile(e){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    setErr(null); setDone(false);
    try{
      if(/pdf$/i.test(f.name)||f.type==='application/pdf'){ setBusy(true); setText(await pdfToText(f)); setBusy(false); }
      else { setText(await f.text()); }
    }catch(e2){ setBusy(false); setErr('Could not read that file. Paste the text below instead.'); }
  }
  async function extract(){
    if(!text.trim()||mode==='none'||busy) return;
    setBusy(true); setErr(null); setDone(false);
    try{
      const r=await llmJSON(sb, auth, 'resume_extract',
        'Extract structured facts from this resume for a professional-networking app. Use ONLY what the resume states - never infer or invent. Keep list items short (a few words each).',
        `Resume text:\n${text.slice(0,9000)}\n\nReturn JSON: {"currentRole":string,"currentCompany":string,"yearsExperience":string,"skills":string[],"schools":string[],"industries":string[]}. Use "" or [] when unknown.`);
      setEx({ currentRole:r.currentRole||'', currentCompany:r.currentCompany||'', yearsExperience:r.yearsExperience||'',
        skills:(r.skills||[]).slice(0,12), schools:(r.schools||[]).slice(0,6), industries:(r.industries||[]).slice(0,6) });
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(false);
  }
  function apply(){
    const e=ex; if(!e) return;
    if(onApply){ onApply(e); }
    else patch('settings', s=>({...s,
      currentRole: s.currentRole||e.currentRole,
      currentCompany: s.currentCompany||e.currentCompany,
      yearsExperience: s.yearsExperience||e.yearsExperience,
      skills: mergeArr(s.skills, e.skills),
      schools: mergeArr(s.schools, e.schools),
      industries: mergeArr(s.industries, e.industries) }));
    setEx(null); setText(''); setDone(true);
  }
  if(mode==='none') return <div className="panel pad"><div className="note">Sign in to import your resume.</div></div>;
  return <div className="panel pad">
    <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>

      <div style={{flex:1}}/>
      <label className="btn ghost sm" style={{cursor:'pointer'}}>Upload PDF<input type="file" accept=".pdf,.txt,application/pdf,text/plain" style={{display:'none'}} onChange={onFile}/></label>
    </div>
    <div className="note" style={{margin:'6px 0 10px',fontSize:12.5}}>Upload a PDF or paste the text - Mighty fills in your skills, schools, industries, and current role for you to confirm. Nothing is stored except what you keep.</div>
    <textarea className="inp" rows={4} value={text} onChange={e=>setText(e.target.value)} placeholder="…or paste your resume text here"/>
    <div style={{display:'flex',gap:10,alignItems:'center',marginTop:10}}>
      <button className="btn" onClick={extract} disabled={busy||!text.trim()}>{busy?<Dots/>:'Extract with AI'}</button>
      {done && <span className="note" style={{color:'var(--green2)'}}>✓ Added to your profile below.</span>}
    </div>
    {err && <div className="warnbox" style={{marginTop:10}}>{err}</div>}
    {ex && <div style={{marginTop:14,borderTop:'1px solid var(--line)',paddingTop:12}}>
      <div className="tag" style={{marginBottom:8}}>Found in your resume - confirm to add</div>
      <div style={{display:'flex',flexDirection:'column',gap:6,fontSize:13}}>
        {ex.currentRole && <div><span className="note">Current role: </span>{ex.currentRole}{ex.currentCompany?` at ${ex.currentCompany}`:''}{ex.yearsExperience?` · ${ex.yearsExperience}`:''}</div>}
        {ex.skills.length>0 && <div><span className="note">Skills: </span>{ex.skills.join(', ')}</div>}
        {ex.schools.length>0 && <div><span className="note">Schools: </span>{ex.schools.join(', ')}</div>}
        {ex.industries.length>0 && <div><span className="note">Industries: </span>{ex.industries.join(', ')}</div>}
      </div>
      <div style={{display:'flex',gap:10,marginTop:12}}>
        <button className="btn" onClick={apply}>Add to my profile</button>
        <a className="note" style={{cursor:'pointer'}} onClick={()=>setEx(null)}>Discard</a>
      </div>
    </div>}
  </div>;
}

      else { setSyncMsg({ok:false, text:data.message||data.error}); patch('settings', s=>({...s, sheets:{...s.sheets, lastError:data.message||data.error}})); }

        <input className="inp" defaultValue={(db.settings[key]||[]).join(', ')}

        {arrField('Why you\'re networking','networkingReasons','Get a job, Find mentors, Raise funding')}
        {arrField('Dream companies','targetCompanies','McKinsey, Bain, Amazon')}

        {arrField('Places you want to network in','targetLocations','New York, London')}
        {arrField('Schools','schools','MIT Sloan, IIM Bangalore')}
        {arrField('Industries','industries','Healthcare, Climate, AI')}
        {arrField('Skills','skills','Strategy, Python, Operations')}
        {arrField('Personal interests (for conversation starters)','interests','Running, Chess, Formula 1')}
        {arrField('Preferred networking style','networkingStyle','Warm introductions, Coffee chats')}

        <div><label className="fld">Follow-up reminder after (days)</label>

    <div className="tag" style={{margin:'26px 0 10px'}}>Your pipeline</div>

            style={{cursor:'pointer',padding:'14px 16px',borderRadius:14,border:'1px solid '+(on?'var(--brand)':'var(--line)'),background:on?'var(--bsoft)':'var(--card2)'}}>

            onBlur={e=>{ const v=e.target.value.trim();
              patch('settings', s=>{ const sl={...(s.stageLabels||{})};
                const base=(PIPELINE_TEMPLATES[s.pipeline||'job_search']||{}).stages||{};
                if(!v || v===base[st]) delete sl[st]; else sl[st]=v;

    <div className="tag" style={{margin:'26px 0 10px'}}>Community insights</div>
    <div className="panel pad">
      <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}>

}

/* ============================ Templates (sub-view) ============================ */
function Templates({db,patch,sb,auth,setTab}){
  const [editing,setEditing]=useState(null);
  const [name,setName]=useState(''); const [body,setBody]=useState('');
  const [polishing,setPolishing]=useState(false);
  const mode = llmMode(sb,auth);

  function startNew(){ setEditing('new'); setName(''); setBody(''); }
  function startEdit(t){ setEditing(t.id); setName(t.name); setBody(t.body); }
  function save(){
    if(!name.trim()||!body.trim()) return;
    patch('templates', list=>{
      if(editing==='new') return [...list, {id:uid(), name:name.trim(), body:body.trim()}];
      return list.map(t=>t.id===editing?{...t,name:name.trim(),body:body.trim()}:t);
    });
    setEditing(null);
  }
  function remove(id){ patch('templates', list=>list.filter(t=>t.id!==id)); }
  async function polish(){
    if(mode==='none'||!body.trim()) return;
    setPolishing(true);
    try{ const out = await llm(sb, auth, 'draft_message', 'Tighten this LinkedIn outreach message: warm, specific, under 400 characters, keep any {{firstName}}/{{company}} placeholders exactly as written. Return only the revised message, no preamble.', body); setBody(out.trim()); }
    catch(e){} setPolishing(false);
  }

  return <div className="page">
    <button className="iconbtn" style={{marginBottom:14}} onClick={()=>setTab('settings')}>← Settings</button>
    <div className="panel pad">
      <div className="ph"><div><h2>Templates</h2><div className="sub">Use <span className="mono">{'{{firstName}}'}</span> and <span className="mono">{'{{company}}'}</span> — filled in per profile.</div></div>
        {editing===null && <button className="btn sm" onClick={startNew}>＋ New template</button>}</div>
      {editing!==null && <div className="row" style={{flexDirection:'column',alignItems:'stretch',gap:10,marginBottom:14}}>
        <label className="fld">Name</label>
        <input className="inp" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Intro — alumni outreach"/>
        <label className="fld">Message</label>
        <textarea className="inp" rows={4} value={body} onChange={e=>setBody(e.target.value)} placeholder="Hi {{firstName}}, ..."/>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button className="btn sm" onClick={save} disabled={!name.trim()||!body.trim()}>Save</button>
          <button className="btn ghost sm" onClick={()=>setEditing(null)}>Cancel</button>
          {mode!=='none' && <button className="iconbtn" onClick={polish} disabled={polishing||!body.trim()}>{polishing?<Dots/>:'✨ AI polish'}</button>}
        </div>
      </div>}
      {db.templates.length===0 && editing===null
        ? <div className="empty"><div className="big">✉</div>No templates yet.</div>
        : <div className="list">{db.templates.map(t=><div key={t.id} className="row">
            <div className="grow"><div className="t">{t.name}</div><div className="m">{t.body}</div></div>
            <button className="iconbtn" onClick={()=>startEdit(t)}>edit</button>
            <button className="iconbtn" onClick={()=>remove(t.id)}>✕</button>
          </div>)}</div>}
    </div>
  </div>;
}

/* ============================ PersonDrawer ============================ */
// Anonymous cohort signal for this person's company — the hardest-to-copy moat.
// Reads the already-loaded community_stats (which the cron only writes once
// >=3 students have contributed, so a row existing already means k>=3). Every
// absolute number is bucketed; only the response *rate* is shown as a figure,
// and only because it's a ratio over >=3 people, never an individual.
function CohortInsight({company, communityStats}){
  if(!company) return null;
  const c = (communityStats||[]).find(x=>x.company && x.company.trim().toLowerCase()===company.trim().toLowerCase());
  if(!c) return null;
  const rate = c.outreach_count>0 ? Math.round(100*c.reply_count/c.outreach_count) : null;
  return <div className="panel pad" style={{background:'var(--card2)',marginBottom:16}}>
    <div className="tag" style={{color:'var(--brand)'}}>🌐 Cohort insight · {company}</div>
    {rate!=null && <div style={{margin:'8px 0 4px'}}><span style={{fontWeight:700,fontSize:20}}>{rate}%</span> <span className="note">avg response rate across your cohort</span></div>}
    <div className="note" style={{fontSize:12.5,lineHeight:1.55}}>
      {bucketCount(c.contributor_count)} students reached out · {bucketCount(c.reply_count)} got replies · {bucketCount(c.coffee_chat_count)} coffee chats · {bucketCount(c.interview_count)} interviews
    </div>
    <div className="note" style={{fontSize:11,marginTop:8,color:'var(--mute2)'}}>Anonymous and aggregated across opted-in Sloan Fellows. Shown only once at least 3 students have contributed.</div>
  </div>;
}
function PersonDrawer({row,rowEvents,db,sb,auth,communityStats,drawerTab,setDrawerTab,onClose,updateRow,logEvent,changeStage,openDraft}){
  const [notes,setNotes]=useState(row.notes||'');
  const notesTimer = useRef(null);
  useEffect(()=>{ setNotes(row.notes||''); },[row.id]);
  function onNotesChange(v){ setNotes(v); clearTimeout(notesTimer.current); notesTimer.current=setTimeout(()=>updateRow(row,{notes:v}),900); }

  const [editingName,setEditingName]=useState(false);
  const [nameDraft,setNameDraft]=useState(row.name||'');
  useEffect(()=>{ setNameDraft(row.name||''); setEditingName(false); },[row.id]);
  function saveName(){ setEditingName(false); const v=nameDraft.trim(); if(v!==(row.name||'')) updateRow(row,{name:v||null}); }

  const na = suggestedNextAction(row, rowEvents, db.settings.followUpDays);
  const briefing = row.briefing || {};

  const [noteType,setNoteType]=useState(null); const [noteText,setNoteText]=useState(''); const [busy,setBusy]=useState(false); const [extractErr,setExtractErr]=useState(null);
  const [addingMem,setAddingMem]=useState(false); const [memDraft,setMemDraft]=useState(''); const [editMemId,setEditMemId]=useState(null);
  const mode = llmMode(sb,auth);
  async function add(eventType, note, extra){ setBusy(true); await logEvent(row, eventType, note, extra); setBusy(false); setNoteType(null); setNoteText(''); }
  async function addCoffeeChatWithExtraction(){
    if(mode==='none'){ await add('coffee_chat', noteText.trim()); return; }
    setBusy(true); setExtractErr(null);
    try{
      const r = await llmJSON(sb, auth, 'coffee_extract',
        'You are helping an MIT Sloan Fellows MBA student capture structured memory right after a real coffee chat. Extract only what the notes state or clearly imply — never invent. For each memory give a type and a confidence 0-1 (how clearly the note supports it). Separate promises the STUDENT made from promises the OTHER PERSON made. Suggest a next-touch timing as a relative offset, not a calendar date.',
        `Contact: ${displayName(row)}, ${row.title||''} at ${row.company||''}.\nStudent's notes:\n${noteText.trim()}\n\nReturn JSON: {"memories": [{"type": "interest"|"personal"|"preference"|"fact"|"event", "value": string, "confidence": number}], "yourPromises": string[], "theirPromises": string[], "nextTouch": {"amount": number, "unit": "days"|"weeks"|"months", "justification": string}}`);
      const yourP = r.yourPromises||r.promises||[];
      const theirP = r.theirPromises||[];
      const mems = Array.isArray(r.memories)?r.memories:[];
      // Timeline event keeps the flat shape (surfaced Tasks + timeline read it).
      const extracted = { personalDetails:mems.map(m=>m.value), promises:yourP, theirPromises:theirP, nextTouchJustification:r.nextTouch?.justification||'' };
      const suggested_next_touch = r.nextTouch ? addOffset(now(), r.nextTouch.amount, r.nextTouch.unit) : null;
      await logEvent(row, 'coffee_chat', noteText.trim(), { extracted, suggested_next_touch });
      // First-class memory records, with type + confidence + source. Confidence
      // gates commit vs suggest vs drop — an uncertain guess becomes a suggestion
      // the user confirms, never a silent fact. Promises are explicit acts, so
      // they commit directly.
      const src = `Coffee chat, ${fmtDate(now())}`;
      const gated = mems.map(m=>({m, g:memGate(m.confidence)})).filter(x=>x.g!=='drop')
        .map(x=>newMemory({type:x.m.type||'personal', value:x.m.value, confidence:x.m.confidence, sourceLabel:src, sourceKind:'coffee_chat', status:x.g==='commit'?'confirmed':'suggested'}));
      const fresh = [
        ...gated,
        ...yourP.map(p=>newMemory({type:'promise', value:p, confidence:0.9, sourceLabel:src, sourceKind:'coffee_chat'})),
        ...theirP.map(p=>newMemory({type:'their_promise', value:p, confidence:0.9, sourceLabel:src, sourceKind:'coffee_chat'})),
      ].filter(m=>m.value);
      if(fresh.length){ const existing=memList(row); const seen=new Set(existing.map(m=>m.value.trim().toLowerCase()));
        await writeMemories(row, updateRow, [...existing, ...fresh.filter(m=>!seen.has(m.value.trim().toLowerCase()))]); }
      setNoteType(null); setNoteText('');
    }catch(e){ setExtractErr(e.message||String(e)); }
    setBusy(false);
  }

  const EVENT_TYPES = [['connection_request','Connection request'],['first_message','First message'],['reply','Reply'],['coffee_chat','Coffee chat'],['referral','Referral'],['interview','Interview'],['note','Note']];

  // Per-contact reasoning context for Meeting Prep + Relationship Health — built
  // from what's actually on file (profile, briefing, notes, real timeline).
  function personDigest(){
    const ctx = row.context||{};
    const evLines = rowEvents.slice().sort((a,b)=>new Date(a.occurred_at)-new Date(b.occurred_at))
      .map(e=>`${fmtDate(new Date(e.occurred_at).getTime())} · ${e.event_type}${e.note?': '+e.note:''}`);
    return [
      `Contact: ${displayName(row)}${row.title?', '+row.title:''}${row.company?' at '+row.company:''}`,
      `Status: ${row.status.replace(/_/g,' ')}`,
      row.contacted_at?`First contacted: ${fmtDate(new Date(row.contacted_at).getTime())}`:'',
      ctx.aboutText?`Profile: ${String(ctx.aboutText).slice(0,1500)}`:'',
      ctx.mutualConnectionsRaw?`Mutual connections: ${ctx.mutualConnectionsRaw}`:'',
      briefing.careerSummary?`Briefing: ${briefing.careerSummary}`:'',
      row.notes?`My notes: ${row.notes}`:'',
      evLines.length?`Interaction history:\n${evLines.join('\n')}`:'No logged interactions yet.'
    ].filter(Boolean).join('\n');
  }
  const [prep,setPrep]=useState(null); const [prepBusy,setPrepBusy]=useState(false);
  const [health,setHealth]=useState(null); const [healthBusy,setHealthBusy]=useState(false);
  const [prepErr,setPrepErr]=useState(null);
  useEffect(()=>{ setPrep(null); setHealth(null); setPrepErr(null); },[row.id]);
  async function genPrep(){
    setPrepBusy(true); setPrepErr(null);
    try{
      const pctx = profileContext(db.settings);
      const r = await llmJSON(sb, auth, 'meeting_prep',
        'You are prepping an MIT Sloan Fellows MBA student for an upcoming conversation with this person. Use ONLY the provided context; never invent facts. Tie talking points and questions to the student\'s goal where it fits. Be specific, practical, and warm.',
        `${pctx?pctx+'\n\n':''}${personDigest()}\n\nReturn JSON: {"talkingPoints": string[], "questions": string[], "reminders": string[], "risks": string[]}. 2 to 4 concise items in each array; use [] if nothing applies.`);
      setPrep(r);
    }catch(e){ setPrepErr(e.message||String(e)); }
    setPrepBusy(false);
  }
  async function genHealth(){
    setHealthBusy(true); setPrepErr(null);
    try{
      const r = await llmJSON(sb, auth, 'relationship_health',
        'Assess the health of this professional relationship for an MIT Sloan Fellows MBA student. Base it ONLY on the interaction history, status, and timing provided — never invent. Classify into exactly one of: growing, warm, fading, dormant.',
        `${personDigest()}\n\nToday is ${new Date().toISOString().slice(0,10)}.\nReturn JSON: {"status": "growing"|"warm"|"fading"|"dormant", "reason": string (under 20 words), "nextMove": string (under 15 words)}`);
      setHealth(r);
    }catch(e){ setPrepErr(e.message||String(e)); }
    setHealthBusy(false);
  }
  const HEALTH_META={growing:{label:'Growing',c:'#ec3013',bg:'#fff2ef'},warm:{label:'Warm',c:'#ae1800',bg:'#ffe0d9'},fading:{label:'Fading',c:'var(--sub)',bg:'var(--chip)'},dormant:{label:'Dormant',c:'var(--mute)',bg:'var(--bg2)'}};

  return <>
    <div className="overlay" onClick={onClose}/>
    <div className="drawer">
      <div style={{padding:'22px 24px 0',flex:'none'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:14}}>
          <Avatar row={row} size={52}/>
          <div style={{flex:1,minWidth:0}}>
            {editingName
              ? <input className="inp" autoFocus value={nameDraft} placeholder="Full name"
                  onChange={e=>setNameDraft(e.target.value)}
                  onBlur={saveName}
                  onKeyDown={e=>{ if(e.key==='Enter') e.target.blur(); if(e.key==='Escape'){ setNameDraft(row.name||''); setEditingName(false); } }}
                  style={{fontSize:17,fontWeight:700,padding:'5px 9px'}}/>
              : <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{fontSize:19,fontWeight:700}}>{displayName(row)}</div>
                  <span className="iconbtn" style={{cursor:'pointer',fontSize:11,padding:'3px 7px'}} onClick={()=>setEditingName(true)}>✎ Edit</span>
                </div>}
            {(()=>{ const rw=relationshipWords(row,rowEvents); return <div style={{display:'flex',alignItems:'center',gap:8,marginTop:4}}>
              <span style={{fontWeight:600,fontSize:14,color:'var(--brand2)'}}>{rw.icon} {rw.label}</span>
              {rw.sub && <span className="note">· {rw.sub}</span>}
            </div>; })()}
            <div className="note" style={{marginTop:3,fontSize:12.5,color:'var(--mute)',maxHeight:34,overflow:'hidden'}}>{row.title||''}{row.company?` · ${row.company}`:''}</div>
            {row.profile_url && <a className="linkurl" href={row.profile_url} target="_blank" rel="noopener noreferrer" style={{display:'inline-block',marginTop:4}}>View on LinkedIn ↗</a>}
          </div>
          <div className="iconbtn" onClick={onClose} style={{cursor:'pointer'}}>✕</div>
        </div>
        {(()=>{ const why=(computeScore(row, db.settings.targetCompanies, profileKeywords(db.settings)).reasons||[]).slice(0,3);
          if(!why.length) return null;
          return <div style={{marginTop:12}}>
            <div className="tag" style={{marginBottom:5}}>Recommended because</div>
            {why.map((w,i)=><div key={i} style={{fontSize:13,color:'var(--sub)',lineHeight:1.55}}>• {w}</div>)}
          </div>; })()}
        {na && <div className="bluebox" style={{display:'flex',alignItems:'center',gap:12,marginTop:14}}>
          <div style={{flex:1}}><div className="tag">Next best action</div><div style={{fontWeight:600,fontSize:14,marginTop:3}}>{na.label}</div>
            <div className="note" style={{marginTop:2,fontSize:12}}>About 5 minutes</div></div>
          <button className="btn sm" onClick={openDraft}>Draft it</button>
        </div>}
        <div style={{display:'flex',gap:8,marginTop:14,flexWrap:'wrap'}}>
          <button className="btn ghost sm" onClick={openDraft}>Draft message</button>
          <button className="btn ghost sm" onClick={()=>changeStage(row,'coffee_chat')}>{`Mark ${stageLabel('coffee_chat').toLowerCase()}`}</button>
          <button className="btn ghost sm" onClick={openDraft}>Follow up</button>
          <button className="btn ghost sm" onClick={()=>setDrawerTab('notes')}>Add note</button>
        </div>
        <div className="drawer-tabs">
          {['profile','prep','timeline','notes'].map(t=><div key={t} className={'drawer-tab'+(drawerTab===t?' on':'')} onClick={()=>setDrawerTab(t)}>{t==='prep'?'AI Brief':t==='profile'?'Brief':t[0].toUpperCase()+t.slice(1)}</div>)}
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'18px 24px 36px'}}>
        {drawerTab==='profile' && (()=>{
          const rs = relationshipScore(row, rowEvents);
          const memories = personMemories(row, rowEvents);
          const trail = ['prospect','contacted','replied','coffee_chat','referral','interview','offer'];
          const hereIdx = Math.max(0, trail.indexOf(row.status==='ready_to_contact'?'prospect':row.status));
          const recent = rowEvents.slice().sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at)).slice(0,4).reverse();
          return <>
            {/* Relationship — in words. The score stays internal for ranking. */}
            {(()=>{ const rw=relationshipWords(row,rowEvents); return <div style={{background:'linear-gradient(150deg, var(--bsoft), var(--psoft))',borderRadius:'var(--radius)',padding:'18px 22px'}}>
              <div className="tag" style={{color:'var(--brand2)'}}>Relationship</div>
              <div style={{fontFamily:'var(--fh)',fontWeight:600,fontSize:24,letterSpacing:'-.03em',marginTop:4}}>{rw.icon} {rw.label}</div>
              <div className="note" style={{marginTop:2,color:'var(--sub)'}}>{rw.sub}</div>
            </div>; })()}

            {/* Relationship trail */}
            <div className="tag" style={{margin:'20px 0 8px'}}>Journey</div>
            <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
              {trail.map((st,i)=>{ const m=STAGE_META[st]; const on=i<=hereIdx; const here=i===hereIdx;
                return <React.Fragment key={st}>
                  {i>0 && <span style={{color:'var(--mute2)',fontSize:12}}>→</span>}
                  <span className="pill" style={{background:here?'var(--brand)':on?m.bg:'transparent',color:here?'#fff':on?m.fg:'var(--mute2)',border:on?'none':'1px dashed var(--line)'}}>{stageLabel(st)}</span>
                </React.Fragment>; })}
            </div>

            {/* Suggested memories — amber, awaiting confirmation. Not yet facts. */}
            {(()=>{ const sugg=suggestedMemories(row); if(!sugg.length) return null;
              return <>
                <div className="tag" style={{margin:'22px 0 8px',color:'var(--amber)'}}>Did I get this right?</div>
                <div className="list">{sugg.map(m=>{ const meta=MEM_TYPES[m.type]||MEM_TYPES.personal;
                  return <div key={m.id} className="row" style={{background:'var(--asoft)',border:'1px dashed rgba(140,122,80,.4)',alignItems:'center'}}>
                    <div className="grow" style={{minWidth:0}}>
                      <div style={{fontSize:11,fontWeight:500,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--amber)'}}>{meta.t} · unsure</div>
                      <div style={{fontSize:13.5,marginTop:3}}>{m.value}</div>
                    </div>
                    <button className="btn sm" onClick={()=>writeMemories(row, updateRow, memList(row).map(x=>x.id===m.id?{...x,status:'confirmed',confidence:Math.max(0.8,x.confidence),updatedAt:Date.now()}:x))}>Confirm</button>
                    <span className="iconbtn" style={{cursor:'pointer',fontSize:12}} onClick={()=>writeMemories(row, updateRow, memList(row).filter(x=>x.id!==m.id))}>✕</span>
                  </div>; })}</div>
              </>; })()}

            {/* What Mighty knows — confirmed, first-class memory records */}
            <div style={{display:'flex',alignItems:'center',margin:'22px 0 8px'}}>
              <div className="tag">Mighty knows</div><div style={{flex:1}}/>
              <span className="iconbtn" style={{cursor:'pointer',fontSize:11.5,padding:'4px 9px'}} onClick={()=>setAddingMem(v=>!v)}>＋ Add</span>
            </div>
            {addingMem && <div style={{display:'flex',gap:8,marginBottom:10}}>
              <input className="inp" autoFocus placeholder="Something you know about them…" value={memDraft}
                onChange={e=>setMemDraft(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter'&&memDraft.trim()){ writeMemories(row, updateRow, [...memList(row), newMemory({type:'personal', value:memDraft.trim(), confidence:1, sourceLabel:'You', sourceKind:'user'})]); setMemDraft(''); setAddingMem(false);} if(e.key==='Escape'){setMemDraft('');setAddingMem(false);} }}/>
            </div>}
            {memories.length===0 && !addingMem
              ? <div style={{background:'var(--card2)',border:'1px solid var(--line)',borderRadius:14,padding:'14px 16px'}}>
                  <div className="note" style={{marginBottom:8}}>After your first real conversation, I'll remember:</div>
                  {['What they care about','Promises you made — and promises they made you','Follow-up dates','Mutual interests','Introductions they offered','Their career goals','Personal details worth remembering']
                    .map(x=><div key={x} style={{fontSize:13,color:'var(--sub)',lineHeight:1.7}}>✓ {x}</div>)}
                </div>
              : <div className="list">{memories.map(m=>{ const meta=MEM_TYPES[m.type]||MEM_TYPES.personal;
                  const bg={promise:'var(--tsoft)',their:'var(--gsoft)',detail:'var(--bsoft)',starter:'var(--gsoft)',shared:'var(--bsoft)'}[meta.bucket]||'var(--bsoft)';
                  const conf=memConfidence(m.confidence); const editing=editMemId===m.id;
                  return <div key={m.id} className="row" style={{background:bg,border:'none',alignItems:'flex-start'}}>
                    <span title={conf.label} style={{width:8,height:8,marginTop:6,flex:'none',borderRadius:99,background:conf.color}}/>
                    <div className="grow" style={{minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <span style={{fontSize:11,fontWeight:500,letterSpacing:'.07em',textTransform:'uppercase',color:conf.color}}>{meta.t}</span>
                        {m.pinned && <span style={{fontSize:10}}>📌</span>}
                      </div>
                      {editing
                        ? <input className="inp" autoFocus defaultValue={m.value} style={{marginTop:4,fontSize:13.5,padding:'6px 9px'}}
                            onKeyDown={e=>{ if(e.key==='Enter'){ const v=e.target.value.trim();
                              writeMemories(row, updateRow, memList(row).map(x=>x.id===m.id?{...x,value:v,confidence:1,sourceKind:'user',sourceLabel:'You',updatedAt:Date.now()}:x)); setEditMemId(null);
                            } if(e.key==='Escape') setEditMemId(null); }}/>
                        : <div style={{fontSize:13.5,marginTop:3}}>{m.value}</div>}
                      <div style={{display:'flex',alignItems:'center',gap:8,marginTop:5}}>
                        <span className="note" style={{fontSize:11}}>{m.sourceLabel||'Unknown source'}</span>
                        {!m.legacy && <>
                          <span style={{color:'var(--mute2)'}}>·</span>
                          <span style={{fontSize:11,color:'var(--brand2)',cursor:'pointer'}} onClick={()=>setEditMemId(editing?null:m.id)}>Edit</span>
                          <span style={{fontSize:11,color:'var(--brand2)',cursor:'pointer'}} onClick={()=>writeMemories(row, updateRow, memList(row).map(x=>x.id===m.id?{...x,pinned:!x.pinned,permanent:!x.pinned||x.permanent}:x))}>{m.pinned?'Unpin':'Pin'}</span>
                          <span style={{fontSize:11,color:'var(--mute)',cursor:'pointer'}} onClick={()=>writeMemories(row, updateRow, memList(row).filter(x=>x.id!==m.id))}>Delete</span>
                        </>}
                      </div>
                    </div>
                  </div>; })}</div>}

            {/* Open questions — what to learn next */}
            {(()=>{ const qs=openQuestions(row,rowEvents); if(!qs.length) return null;
              return <>
                <div className="tag" style={{margin:'22px 0 8px'}}>Still don't know</div>
                <div style={{display:'flex',flexDirection:'column',gap:2}}>
                  {qs.map(q=><div key={q} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 0'}}>
                    <span style={{width:15,height:15,flex:'none',borderRadius:5,border:'1.5px solid var(--line)'}}/>
                    <span style={{fontSize:13.5,color:'var(--sub)'}}>{q}</span>
                  </div>)}
                </div>
              </>; })()}

            {(()=>{ const c=row.context||{};
              const rowsD=[['Location',c.location],['Education',c.education],['Experience',c.experience],['Reach',c.followers?c.followers+' followers':(c.connections?c.connections+' connections':'')]].filter(x=>x[1]);
              if(!rowsD.length) return null;
              return <>
                <div className="tag" style={{margin:'22px 0 8px'}}>Details</div>
                <div style={{display:'flex',flexDirection:'column',gap:7}}>
                  {rowsD.map(([k,v])=><div key={k} style={{display:'flex',justifyContent:'space-between',gap:12,fontSize:13.5}}>
                    <span className="note">{k}</span><span style={{fontWeight:500,textAlign:'right',maxWidth:280}}>{v}</span></div>)}
                </div>
              </>; })()}

            {/* Briefing summary, if generated */}
            {briefing.careerSummary && <>
              <div className="tag" style={{margin:'22px 0 6px'}}>Background</div>
              <div className="note" style={{fontSize:13.5,color:'var(--ink)'}}>{briefing.careerSummary}</div>
              {briefing.whyContactReasons?.length>0 && <div className="note" style={{marginTop:6}}>{briefing.whyContactReasons.join(' · ')}</div>}
            </>}

            {/* Recent history at a glance */}
            {recent.length>0 && <>
              <div className="tag" style={{margin:'22px 0 8px'}}>Recent history</div>
              <div style={{display:'flex',flexDirection:'column',gap:2}}>
                {recent.map(e=><div key={e.id} style={{display:'grid',gridTemplateColumns:'14px 1fr auto',gap:12,alignItems:'center',padding:'7px 0'}}>
                  <span style={{justifySelf:'center',width:8,height:8,borderRadius:99,background:'var(--brand)'}}/>
                  <span style={{fontSize:13.5}}>{EVENT_LABEL[e.event_type]||e.event_type}{e.note?` — ${String(e.note).slice(0,60)}`:''}</span>
                  <span className="note">{rel(new Date(e.occurred_at).getTime())}</span>
                </div>)}
              </div>
            </>}

            {/* Ask Mighty — an input, not a row of pills */}
            <div className="tag" style={{margin:'22px 0 8px'}}>Ask Mighty</div>
            <input className="inp" placeholder={`Ask anything about ${displayName(row).split(' ')[0]}…`}
              onKeyDown={e=>{ if(e.key==='Enter' && e.target.value.trim()) setDrawerTab('prep'); }}/>
            <div className="note" style={{margin:'10px 0 6px',fontSize:12.5}}>Suggested</div>
            <div style={{display:'flex',flexDirection:'column',gap:2}}>
              {[['Draft a first message', openDraft],
                ['Prepare for a coffee chat', ()=>setDrawerTab('prep')],
                ['What should I ask them?', ()=>setDrawerTab('prep')],
                [`How could ${displayName(row).split(' ')[0]} help me?`, ()=>setDrawerTab('prep')],
                [`How could I help ${displayName(row).split(' ')[0]}?`, ()=>setDrawerTab('prep')]].map(([t,fn])=>
                <div key={t} onClick={fn} style={{fontSize:13.5,color:'var(--brand2)',cursor:'pointer',padding:'6px 0'}}>• {t}</div>)}
            </div>

            <div style={{marginTop:20}}><CohortInsight company={row.company} communityStats={communityStats}/></div>
          </>;
        })()}
        {drawerTab==='prep' && <>
          {mode==='none'
            ? <div className="empty"><div className="big">✨</div>Sign in to use AI prep.</div>
            : <>
              {/* Relationship health */}
              <div className="ph" style={{marginBottom:8}}><div><h2 style={{fontSize:15}}>Relationship health</h2><div className="sub">How this connection is trending, from your real history.</div></div>
                <button className="btn ghost sm" onClick={genHealth} disabled={healthBusy}>{healthBusy?<Dots/>:health?'Re-check':'Check'}</button></div>
              {health && (()=>{ const m=HEALTH_META[health.status]||HEALTH_META.warm; return <div className="panel pad" style={{marginBottom:20}}>
                <span className="pill" style={{background:m.bg,color:m.c,fontSize:12.5}}>{m.label}</span>
                <div className="note" style={{fontSize:13.5,color:'var(--ink)',marginTop:8}}>{health.reason}</div>
                {health.nextMove && <div style={{marginTop:8,display:'flex',gap:8,alignItems:'baseline'}}><span className="tag">Next move</span><span style={{fontSize:13,fontWeight:600,color:'var(--brand2)'}}>{health.nextMove}</span></div>}
              </div>; })()}

              {/* Meeting prep */}
              <div className="ph" style={{marginBottom:8}}><div><h2 style={{fontSize:15}}>Meeting prep</h2><div className="sub">Talking points and questions for your next conversation.</div></div>
                <button className="btn sm" onClick={genPrep} disabled={prepBusy}>{prepBusy?<Dots/>:prep?'Regenerate':'Prep me'}</button></div>
              {prepErr && <div className="warnbox" style={{marginBottom:12}}>{prepErr}</div>}
              {prep
                ? <div style={{display:'flex',flexDirection:'column',gap:16}}>
                    {[['Talking points',prep.talkingPoints],['Questions to ask',prep.questions],['Reminders',prep.reminders],['Watch out for',prep.risks]].map(([label,arr])=>
                      (arr&&arr.length>0) ? <div key={label}>
                        <div className="tag" style={{marginBottom:7}}>{label}</div>
                        <div className="list">{arr.map((s,i)=><div key={i} className="row" style={{background:'var(--card2)',alignItems:'flex-start'}}><div className="m" style={{color:'var(--ink)'}}>{s}</div></div>)}</div>
                      </div> : null)}
                  </div>
                : !prepBusy && <div className="note" style={{fontSize:13}}>Click <b>Prep me</b> for talking points, smart questions, and reminders grounded in this person's profile and your history together.</div>}
            </>}
        </>}
        {drawerTab==='timeline' && <>
          {rowEvents.length===0
            ? <div className="empty"><div className="big">◷</div>No history yet.</div>
            : <div style={{display:'flex',flexDirection:'column'}}>{rowEvents.map((e,i)=><div key={e.id} style={{display:'flex',gap:14}}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',flex:'none',width:10}}>
                  <div style={{width:9,height:9,borderRadius:99,background:i===rowEvents.length-1?'var(--brand)':'var(--chip)',marginTop:4}}></div>
                  {i<rowEvents.length-1 && <div style={{width:2,flex:1,background:'var(--line)',marginTop:4}}></div>}
                </div>
                <div style={{paddingBottom:18,flex:1}}>
                  <div style={{display:'flex',alignItems:'baseline',gap:10}}><div style={{fontWeight:600,fontSize:13.5}}>{EVENT_TYPES.find(t=>t[0]===e.event_type)?.[1]||e.event_type}</div><div className="note">{fmtDate(new Date(e.occurred_at).getTime())}</div></div>
                  {e.note && !e.extracted && <div className="note" style={{marginTop:3}}>{e.note}</div>}
                  {e.extracted && <div className="note" style={{marginTop:3}}>
                    {e.extracted.personalDetails?.length>0 && <div><b>Mentioned:</b> {e.extracted.personalDetails.join(' · ')}</div>}
                    {e.extracted.promises?.length>0 && <div><b>Promised:</b> {e.extracted.promises.join(' · ')}</div>}
                    {e.suggested_next_touch && <div><b>Next touch:</b> {fmtDate(new Date(e.suggested_next_touch).getTime())}</div>}
                  </div>}
                </div>
              </div>)}</div>}
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:14}}>
            {EVENT_TYPES.map(([k,l])=> (k==='note'||k==='coffee_chat')
              ? <button key={k} className="iconbtn" onClick={()=>setNoteType(noteType===k?null:k)} disabled={busy}>+ {l}</button>
              : <button key={k} className="iconbtn" onClick={()=>add(k)} disabled={busy}>+ {l}</button>)}
          </div>
          {noteType==='note' && <div style={{display:'flex',gap:8,marginTop:8}}>
            <input className="inp" value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Quick note…"/>
            <button className="btn sm" onClick={()=>add('note',noteText.trim())} disabled={!noteText.trim()||busy}>Save</button>
          </div>}
          {noteType==='coffee_chat' && <div style={{marginTop:8}}>
            <textarea className="inp" rows={3} value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="What did you talk about?"/>
            <div style={{display:'flex',gap:8,marginTop:8}}>
              {mode!=='none' && <button className="btn sm" onClick={addCoffeeChatWithExtraction} disabled={!noteText.trim()||busy}>{busy?<Dots/>:'✨ Extract details & save'}</button>}
              <button className="btn ghost sm" onClick={()=>add('coffee_chat',noteText.trim())} disabled={!noteText.trim()||busy}>Save note only</button>
            </div>
            {extractErr && <div className="warnbox" style={{marginTop:8}}>{extractErr}</div>}
          </div>}
        </>}
        {drawerTab==='notes' && <>
          <textarea className="inp" style={{minHeight:220,lineHeight:1.6}} value={notes} onChange={e=>onNotesChange(e.target.value)} placeholder="Jot anything — it's just for you."/>
          <div className="note" style={{marginTop:8}}>Saved automatically. Feeds future briefings and drafts.</div>
        </>}
      </div>
    </div>
  </>;
}

/* ============================ DraftModal ============================ */
function DraftModal({row,db,sb,auth,updateRow,changeStage,onClose}){
  const [objective,setObjective]=useState('coffee_chat');
  const [tone,setTone]=useState('Friendly');
  const [shorter,setShorter]=useState(false);
  const [personal,setPersonal]=useState(false);
  const [text,setText]=useState(row.ai_draft||'');
  const [busy,setBusy]=useState(false); const [err,setErr]=useState(null); const [copied,setCopied]=useState(false);
  const mode = llmMode(sb,auth);

  async function generate(){
    if(mode==='none') return;
    setBusy(true); setErr(null);
    try{
      const ctx = row.context||{}; const br = row.briefing||{};
      const pctx = profileContext(db.settings);
      const result = await llmJSON(sb, auth, 'draft_message',
        'You are helping an MIT Sloan Fellows MBA student write a real LinkedIn outreach message. Ground it in the given context — never invent facts not present in it. Reflect the student\'s goal and preferred voice when natural. Follow the objective, tone, and length instructions exactly.',
        `${pctx?pctx+'\n\n':''}Objective: ${objective}. Tone: ${tone}. Length: ${shorter?'under 60 words':'under 120 words'}. Personalization: ${personal?'heavily reference specific shared details from the context':'lightly reference context'}.\nContact: ${row.name||''}, ${row.title||''} at ${row.company||''}\nContext — About: ${ctx.aboutText||''} Experience: ${ctx.experienceText||''} Education: ${ctx.educationText||''} Mutual: ${ctx.mutualConnectionsRaw||''}\nExisting briefing — Summary: ${br.careerSummary||''} Shared: ${br.sharedConnectionNote||''}\n\nReturn JSON: {"draftMessage": string}`);
      setText(result.draftMessage||''); await updateRow(row, {ai_draft: result.draftMessage||'', status: row.status==='prospect'?'ready_to_contact':row.status});
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(false);
  }
  async function copyAndOpen(){
    try{ await navigator.clipboard.writeText(text); }catch(e){}
    await updateRow(row, {message_sent:text});
    window.open(row.profile_url,'_blank','noopener');
    setCopied(true); setTimeout(()=>setCopied(false),1500);
  }
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;

  return <div className="modal-overlay" onClick={onClose}>
    <div className="modal" onClick={e=>e.stopPropagation()}>
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'18px 22px 0'}}>
        <div><span style={{fontWeight:700,fontSize:16}}>Draft message</span><span className="note"> · to {displayName(row)}{row.company?`, ${row.company}`:''}</span></div>
        <div style={{flex:1}}/><div className="iconbtn" style={{cursor:'pointer'}} onClick={onClose}>✕</div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'14px 22px 0',flexWrap:'wrap'}}>
        <select className="inp" style={{width:'auto'}} value={objective} onChange={e=>setObjective(e.target.value)}>
          {OBJECTIVES.map(([k,l])=><option key={k} value={k}>{l}</option>)}
        </select>
        <div style={{width:1,height:20,background:'var(--line)'}}></div>
        {TONES.map(t=><button key={t} className="btn sm" style={{background:tone===t?'var(--ink)':'var(--card)',color:tone===t?'#fff':'var(--sub)',border:'1px solid '+(tone===t?'var(--ink)':'rgba(0,0,0,.12)')}} onClick={()=>setTone(t)}>{t}</button>)}
      </div>
      <div style={{padding:'14px 22px 0'}}>
        <textarea className="inp" style={{minHeight:220,lineHeight:1.6}} value={text} onChange={e=>setText(e.target.value)} placeholder={mode==='none'?'Sign in to generate a draft, or write one yourself.':'Click Regenerate to draft with AI…'}/>
        <div className="note" style={{marginTop:6}}>{words} words · nothing is sent until you click — you're always in control</div>
        {err && <div className="warnbox" style={{marginTop:8}}>{err}</div>}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'16px 22px 18px',flexWrap:'wrap'}}>
        {mode!=='none' && <button className="btn ghost sm" onClick={generate} disabled={busy}>{busy?<Dots/>:'↻ Regenerate'}</button>}
        <button className="btn sm" style={{background:shorter?'var(--ink)':'var(--card)',color:shorter?'#fff':'var(--ink)',border:'1px solid '+(shorter?'var(--ink)':'rgba(0,0,0,.13)')}} onClick={()=>{setShorter(s=>!s);}}>Shorter</button>
        <button className="btn sm" style={{background:personal?'var(--ink)':'var(--card)',color:personal?'#fff':'var(--ink)',border:'1px solid '+(personal?'var(--ink)':'rgba(0,0,0,.13)')}} onClick={()=>{setPersonal(p=>!p);}}>More personal</button>
        <div style={{flex:1}}/>
        <button className="btn sm" onClick={copyAndOpen} disabled={!text.trim()}>{copied?'Copied ✓':'Copy & open LinkedIn'}</button>
      </div>
    </div>
  </div>;
}

            <div style={{display:'flex',alignItems:'baseline',gap:8}}><div style={{fontSize:22,fontWeight:700,color:'var(--brand)'}}>Strong match</div></div>

              <div style={{display:'flex',justifyContent:'space-between',fontSize:12}}><span className="note">Last interaction</span><span>Message sent</span></div>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:12}}><span className="note">Next action</span><span style={{color:'var(--brand)'}}>Follow up today</span></div>
            </div>
            <div style={{marginTop:12,background:'var(--card2)',border:'1px solid var(--line)',borderRadius:9,padding:'10px 11px'}}>

          <div style={{maxWidth:600,margin:'0 auto'}}>
            <div className="note" style={{marginBottom:10}}>412 results · <b>MIT Sloan</b> · <b>Bain &amp; Company</b></div>

              {[['Grace Liu','Consultant at Bain & Company · MIT Sloan ’23','92%'],['Omar Sheikh','Sr. Associate Consultant at Bain · MIT Sloan ’22','88%'],['Jenna Wolfe','Consultant at Bain & Company · MIT Sloan ’24','84%']].map(([n,l,s])=>
                <div key={n} className="row" style={{background:'#fff'}}>
                  <input type="checkbox" defaultChecked/>
                  <Avatar row={{id:1,name:n}} size={34}/>
                  <div className="grow"><div className="t">{n}</div><div className="m">{l}</div></div>
                  <div style={{textAlign:'right'}}><div style={{fontWeight:700,color:'var(--brand)'}}>{s}</div><div className="note">Strong alumni match</div></div>
                </div>)}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:12,background:'var(--ink)',color:'#fff',borderRadius:10,padding:'10px 14px',marginTop:12}}>
              <Logo size={18}/><div style={{flex:1,fontSize:13}}>3 people selected</div>
              <button className="btn sm">Save to Mighty</button>

          </div>
        </div>}
      </div>
    </div>}
  </div>;
}

    ['Download & unzip Mighty', 'Click the button below to download the extension, then double-click the .zip file to unzip it.'],
    ['Click "Load unpacked"', 'Back on chrome://extensions, click "Load unpacked" and select the unzipped mighty-extension folder.'],
    ['Sign in', 'Click the Mighty icon in your toolbar (pin it for easy access) and sign in with your @mit.edu email — same account as the web app.'],
  ];
  return <div style={{maxWidth:640,margin:'0 auto'}}>
    <div className="panel pad">
      <div className="ph"><div><h2>Install the Mighty extension</h2><div className="sub">About a minute, one time per device.</div></div></div>

        {steps.map(([title,body],i)=><div key={i} className="row" style={{alignItems:'flex-start'}}>

        </div>)}

      <div style={{marginTop:16,display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
        <a className="btn" href="../install/mighty-extension.zip" download style={{textDecoration:'none'}}>⬇ Download Mighty extension (.zip)</a>

}
