  function onNotesChange(v){ setNotes(v); clearTimeout(notesTimer.current); notesTimer.current=setTimeout(()=>updateRow(row,{notes:v}),900); }

  const [editingName,setEditingName]=useState(false);
  const [nameDraft,setNameDraft]=useState(row.name||'');
  useEffect(()=>{ setNameDraft(row.name||''); setEditingName(false); },[row.id]);
  function saveName(){ setEditingName(false); const v=nameDraft.trim(); if(v!==(row.name||'')) updateRow(row,{name:v||null}); }

  const na = suggestedNextAction(row, rowEvents, db.settings.followUpDays);
  const briefing = row.briefing || {};

  const [noteType,setNoteType]=useState(null); const [noteText,setNoteText]=useState(''); const [busy,setBusy]=useState(false); const [extractErr,setExtractErr]=useState(null);
  const mode = llmMode(sb,auth);
  async function add(eventType, note, extra){ setBusy(true); await logEvent(row, eventType, note, extra); setBusy(false); setNoteType(null); setNoteText(''); }
  async function addCoffeeChatWithExtraction(){
    if(mode==='none'){ await add('coffee_chat', noteText.trim()); return; }
    setBusy(true); setExtractErr(null);
    try{
      const r = await llmJSON(sb, auth, 'coffee_extract',
        'You are helping an MIT Sloan Fellows MBA student capture structured notes right after a real coffee chat. Extract only what the notes actually state or clearly imply — never invent. Suggest a next-touch timing as a relative offset, not a calendar date.',
        `Contact: ${displayName(row)}, ${row.title||''} at ${row.company||''}.\nStudent's notes:\n${noteText.trim()}\n\nReturn JSON: {"personalDetails": string[], "promises": string[], "nextTouch": {"amount": number, "unit": "days"|"weeks"|"months", "justification": string}}`);
      const extracted = { personalDetails:r.personalDetails||[], promises:r.promises||[], nextTouchJustification:r.nextTouch?.justification||'' };
      const suggested_next_touch = r.nextTouch ? addOffset(now(), r.nextTouch.amount, r.nextTouch.unit) : null;
      await logEvent(row, 'coffee_chat', noteText.trim(), { extracted, suggested_next_touch });
      setNoteType(null); setNoteText('');
    }catch(e){ setExtractErr(e.message||String(e)); }
    setBusy(false);
  }

  const EVENT_TYPES = [['connection_request','Connection request'],['first_message','First message'],['reply','Reply'],['coffee_chat','Coffee chat'],['referral','Referral'],['interview','Interview'],['note','Note']];

  // Per-contact reasoning context for Meeting Prep + Relationship Health — built
  // from what's actually on file (profile, briefing, notes, real timeline).
  function personDigest(){
    const ctx = row.context||{};
    const evLines = rowEvents.slice().sort((a,b)=>new Date(a.occurred_at)-new Date(b.occurred_at))
      .map(e=>`${fmtDate(new Date(e.occurred_at).getTime())} · ${e.event_type}${e.note?': '+e.note:''}`);
    return [
      `Contact: ${displayName(row)}${row.title?', '+row.title:''}${row.company?' at '+row.company:''}`,
      `Status: ${row.status.replace(/_/g,' ')}`,
      row.contacted_at?`First contacted: ${fmtDate(new Date(row.contacted_at).getTime())}`:'',
      ctx.aboutText?`Profile: ${String(ctx.aboutText).slice(0,1500)}`:'',
      ctx.mutualConnectionsRaw?`Mutual connections: ${ctx.mutualConnectionsRaw}`:'',
      briefing.careerSummary?`Briefing: ${briefing.careerSummary}`:'',
      row.notes?`My notes: ${row.notes}`:'',
      evLines.length?`Interaction history:\n${evLines.join('\n')}`:'No logged interactions yet.'
    ].filter(Boolean).join('\n');
  }
  const [prep,setPrep]=useState(null); const [prepBusy,setPrepBusy]=useState(false);
  const [health,setHealth]=useState(null); const [healthBusy,setHealthBusy]=useState(false);
  const [prepErr,setPrepErr]=useState(null);
  useEffect(()=>{ setPrep(null); setHealth(null); setPrepErr(null); },[row.id]);
  async function genPrep(){
    setPrepBusy(true); setPrepErr(null);
    try{
      const r = await llmJSON(sb, auth, 'meeting_prep',
        'You are prepping an MIT Sloan Fellows MBA student for an upcoming conversation with this person. Use ONLY the provided context; never invent facts. Be specific, practical, and warm.',
        `${personDigest()}\n\nReturn JSON: {"talkingPoints": string[], "questions": string[], "reminders": string[], "risks": string[]}. 2 to 4 concise items in each array; use [] if nothing applies.`);
      setPrep(r);
    }catch(e){ setPrepErr(e.message||String(e)); }
    setPrepBusy(false);
  }
  async function genHealth(){
    setHealthBusy(true); setPrepErr(null);
    try{
      const r = await llmJSON(sb, auth, 'relationship_health',
        'Assess the health of this professional relationship for an MIT Sloan Fellows MBA student. Base it ONLY on the interaction history, status, and timing provided — never invent. Classify into exactly one of: growing, warm, fading, dormant.',
        `${personDigest()}\n\nToday is ${new Date().toISOString().slice(0,10)}.\nReturn JSON: {"status": "growing"|"warm"|"fading"|"dormant", "reason": string (under 20 words), "nextMove": string (under 15 words)}`);
      setHealth(r);
    }catch(e){ setPrepErr(e.message||String(e)); }
    setHealthBusy(false);
  }
  const HEALTH_META={growing:{label:'Growing',c:'#ec3013',bg:'#fff2ef'},warm:{label:'Warm',c:'#ae1800',bg:'#ffe0d9'},fading:{label:'Fading',c:'var(--sub)',bg:'var(--chip)'},dormant:{label:'Dormant',c:'var(--mute)',bg:'var(--bg2)'}};

  return <>
    <div className="overlay" onClick={onClose}/>
    <div className="drawer">
      <div style={{padding:'22px 24px 0',flex:'none'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:14}}>
          <Avatar row={row} size={52}/>
          <div style={{flex:1,minWidth:0}}>
            {editingName
              ? <input className="inp" autoFocus value={nameDraft} placeholder="Full name"
                  onChange={e=>setNameDraft(e.target.value)}
                  onBlur={saveName}
                  onKeyDown={e=>{ if(e.key==='Enter') e.target.blur(); if(e.key==='Escape'){ setNameDraft(row.name||''); setEditingName(false); } }}
                  style={{fontSize:17,fontWeight:700,padding:'5px 9px'}}/>
              : <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{fontSize:19,fontWeight:700}}>{displayName(row)}</div>
                  <span className="iconbtn" style={{cursor:'pointer',fontSize:11,padding:'3px 7px'}} onClick={()=>setEditingName(true)}>✎ Edit</span>
                </div>}
            <div className="note" style={{marginTop:2}}>{row.title||''}{row.company?` · ${row.company}`:''}</div>
            {briefing.school && <div className="note">{briefing.school}{briefing.gradYear?` MBA ${briefing.gradYear}`:''}</div>}
            {row.profile_url && <a className="linkurl" href={row.profile_url} target="_blank" rel="noopener noreferrer" style={{display:'inline-block',marginTop:4}}>View on LinkedIn ↗</a>}
          </div>
          <div className="iconbtn" onClick={onClose} style={{cursor:'pointer'}}>✕</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginTop:12}}>
          <StagePill status={row.status}/><PriorityDot priority={row.priority}/>
        </div>
        {na && <div className="bluebox" style={{display:'flex',alignItems:'center',gap:12,marginTop:14}}>
          <div style={{flex:1}}><div className="tag">Suggested next step</div><div style={{fontWeight:600,fontSize:13.5,marginTop:3}}>{na.label}</div></div>
          <button className="btn sm" onClick={openDraft}>Draft it</button>
        </div>}
        <div style={{display:'flex',gap:8,marginTop:14,flexWrap:'wrap'}}>
          <button className="btn ghost sm" onClick={openDraft}>Draft message</button>
          <button className="btn ghost sm" onClick={()=>changeStage(row,'coffee_chat')}>Mark coffee chat</button>
          <button className="btn ghost sm" onClick={openDraft}>Follow up</button>
          <button className="btn ghost sm" onClick={()=>setDrawerTab('notes')}>Add note</button>
        </div>
        <div className="drawer-tabs">
          {['briefing','prep','timeline','notes'].map(t=><div key={t} className={'drawer-tab'+(drawerTab===t?' on':'')} onClick={()=>setDrawerTab(t)}>{t==='prep'?'AI Prep':t[0].toUpperCase()+t.slice(1)}</div>)}
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'18px 24px 36px'}}>
        {drawerTab==='briefing' && <>
          {!briefing.careerSummary
            ? <div className="empty"><div className="big">✨</div>No briefing yet. Open <span className="mono">Draft message</span> to generate one from this profile's context.</div>
            : <>
              <div className="tag" style={{color:'var(--brand)'}}>✦ AI briefing · always editable via Draft message</div>
              <div className="tag" style={{margin:'16px 0 6px'}}>Summary</div>
              <div className="note" style={{fontSize:13.5,color:'var(--ink)'}}>{briefing.careerSummary}</div>
              {briefing.sharedConnectionNote && <><div className="tag" style={{margin:'14px 0 6px'}}>Shared connection</div><div className="note" style={{fontSize:13.5,color:'var(--ink)'}}>{briefing.sharedConnectionNote}</div></>}
              {briefing.conversationStarters?.length>0 && <><div className="tag" style={{margin:'14px 0 8px'}}>Conversation starters</div>
                <div className="list">{briefing.conversationStarters.map((s,i)=><div key={i} className="row" style={{background:'var(--card2)'}}><div className="m">{s}</div></div>)}</div></>}
              {briefing.whyContactReasons?.length>0 && <><div className="tag" style={{margin:'14px 0 6px'}}>Why contact</div><div className="note" style={{fontSize:13.5,color:'var(--ink)'}}>{briefing.whyContactReasons.join(' · ')}</div></>}
            </>}
        </>}
        {drawerTab==='prep' && <>
          {mode==='none'
            ? <div className="empty"><div className="big">✨</div>Sign in to use AI prep.</div>
            : <>
              {/* Relationship health */}
              <div className="ph" style={{marginBottom:8}}><div><h2 style={{fontSize:15}}>Relationship health</h2><div className="sub">How this connection is trending, from your real history.</div></div>
                <button className="btn ghost sm" onClick={genHealth} disabled={healthBusy}>{healthBusy?<Dots/>:health?'Re-check':'Check'}</button></div>
              {health && (()=>{ const m=HEALTH_META[health.status]||HEALTH_META.warm; return <div className="panel pad" style={{marginBottom:20}}>
                <span className="pill" style={{background:m.bg,color:m.c,fontSize:12.5}}>{m.label}</span>
                <div className="note" style={{fontSize:13.5,color:'var(--ink)',marginTop:8}}>{health.reason}</div>
                {health.nextMove && <div style={{marginTop:8,display:'flex',gap:8,alignItems:'baseline'}}><span className="tag">Next move</span><span style={{fontSize:13,fontWeight:600,color:'var(--brand2)'}}>{health.nextMove}</span></div>}
              </div>; })()}

              {/* Meeting prep */}
              <div className="ph" style={{marginBottom:8}}><div><h2 style={{fontSize:15}}>Meeting prep</h2><div className="sub">Talking points and questions for your next conversation.</div></div>
                <button className="btn sm" onClick={genPrep} disabled={prepBusy}>{prepBusy?<Dots/>:prep?'Regenerate':'Prep me'}</button></div>
              {prepErr && <div className="warnbox" style={{marginBottom:12}}>{prepErr}</div>}
              {prep
                ? <div style={{display:'flex',flexDirection:'column',gap:16}}>
                    {[['Talking points',prep.talkingPoints],['Questions to ask',prep.questions],['Reminders',prep.reminders],['Watch out for',prep.risks]].map(([label,arr])=>
                      (arr&&arr.length>0) ? <div key={label}>
                        <div className="tag" style={{marginBottom:7}}>{label}</div>
                        <div className="list">{arr.map((s,i)=><div key={i} className="row" style={{background:'var(--card2)',alignItems:'flex-start'}}><div className="m" style={{color:'var(--ink)'}}>{s}</div></div>)}</div>
                      </div> : null)}
                  </div>
                : !prepBusy && <div className="note" style={{fontSize:13}}>Click <b>Prep me</b> for talking points, smart questions, and reminders grounded in this person's profile and your history together.</div>}
            </>}
        </>}
        {drawerTab==='timeline' && <>
          {rowEvents.length===0
            ? <div className="empty"><div className="big">◷</div>No history yet.</div>
            : <div style={{display:'flex',flexDirection:'column'}}>{rowEvents.map((e,i)=><div key={e.id} style={{display:'flex',gap:14}}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',flex:'none',width:10}}>
                  <div style={{width:9,height:9,borderRadius:99,background:i===rowEvents.length-1?'var(--brand)':'var(--chip)',marginTop:4}}></div>
                  {i<rowEvents.length-1 && <div style={{width:2,flex:1,background:'var(--line)',marginTop:4}}></div>}
                </div>
                <div style={{paddingBottom:18,flex:1}}>
                  <div style={{display:'flex',alignItems:'baseline',gap:10}}><div style={{fontWeight:600,fontSize:13.5}}>{EVENT_TYPES.find(t=>t[0]===e.event_type)?.[1]||e.event_type}</div><div className="note">{fmtDate(new Date(e.occurred_at).getTime())}</div></div>
                  {e.note && !e.extracted && <div className="note" style={{marginTop:3}}>{e.note}</div>}
                  {e.extracted && <div className="note" style={{marginTop:3}}>
                    {e.extracted.personalDetails?.length>0 && <div><b>Mentioned:</b> {e.extracted.personalDetails.join(' · ')}</div>}
                    {e.extracted.promises?.length>0 && <div><b>Promised:</b> {e.extracted.promises.join(' · ')}</div>}
                    {e.suggested_next_touch && <div><b>Next touch:</b> {fmtDate(new Date(e.suggested_next_touch).getTime())}</div>}
                  </div>}
                </div>
              </div>)}</div>}
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:14}}>
            {EVENT_TYPES.map(([k,l])=> (k==='note'||k==='coffee_chat')
              ? <button key={k} className="iconbtn" onClick={()=>setNoteType(noteType===k?null:k)} disabled={busy}>+ {l}</button>
              : <button key={k} className="iconbtn" onClick={()=>add(k)} disabled={busy}>+ {l}</button>)}
          </div>
          {noteType==='note' && <div style={{display:'flex',gap:8,marginTop:8}}>
            <input className="inp" value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Quick note…"/>
            <button className="btn sm" onClick={()=>add('note',noteText.trim())} disabled={!noteText.trim()||busy}>Save</button>
          </div>}
          {noteType==='coffee_chat' && <div style={{marginTop:8}}>
            <textarea className="inp" rows={3} value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="What did you talk about?"/>
            <div style={{display:'flex',gap:8,marginTop:8}}>
              {mode!=='none' && <button className="btn sm" onClick={addCoffeeChatWithExtraction} disabled={!noteText.trim()||busy}>{busy?<Dots/>:'✨ Extract details & save'}</button>}
              <button className="btn ghost sm" onClick={()=>add('coffee_chat',noteText.trim())} disabled={!noteText.trim()||busy}>Save note only</button>
            </div>
            {extractErr && <div className="warnbox" style={{marginTop:8}}>{extractErr}</div>}
          </div>}
        </>}
        {drawerTab==='notes' && <>
          <textarea className="inp" style={{minHeight:220,lineHeight:1.6}} value={notes} onChange={e=>onNotesChange(e.target.value)} placeholder="Jot anything — it's just for you."/>
          <div className="note" style={{marginTop:8}}>Saved automatically. Feeds future briefings and drafts.</div>
        </>}
      </div>
    </div>
  </>;
}

/* ============================ DraftModal ============================ */
function DraftModal({row,sb,auth,updateRow,changeStage,onClose}){
  const [objective,setObjective]=useState('coffee_chat');
  const [tone,setTone]=useState('Friendly');
  const [shorter,setShorter]=useState(false);
  const [personal,setPersonal]=useState(false);
  const [text,setText]=useState(row.ai_draft||'');
  const [busy,setBusy]=useState(false); const [err,setErr]=useState(null); const [copied,setCopied]=useState(false);
  const mode = llmMode(sb,auth);

  async function generate(){
    if(mode==='none') return;
    setBusy(true); setErr(null);
    try{
      const ctx = row.context||{}; const br = row.briefing||{};
      const result = await llmJSON(sb, auth, 'draft_message',
        'You are helping an MIT Sloan Fellows MBA student write a real LinkedIn outreach message. Ground it in the given context — never invent facts not present in it. Follow the objective, tone, and length instructions exactly.',
        `Objective: ${objective}. Tone: ${tone}. Length: ${shorter?'under 60 words':'under 120 words'}. Personalization: ${personal?'heavily reference specific shared details from the context':'lightly reference context'}.\nContact: ${row.name||''}, ${row.title||''} at ${row.company||''}\nContext — About: ${ctx.aboutText||''} Experience: ${ctx.experienceText||''} Education: ${ctx.educationText||''} Mutual: ${ctx.mutualConnectionsRaw||''}\nExisting briefing — Summary: ${br.careerSummary||''} Shared: ${br.sharedConnectionNote||''}\n\nReturn JSON: {"draftMessage": string}`);
      setText(result.draftMessage||''); await updateRow(row, {ai_draft: result.draftMessage||'', status: row.status==='prospect'?'ready_to_contact':row.status});
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(false);
  }
  async function copyAndOpen(){
    try{ await navigator.clipboard.writeText(text); }catch(e){}
    await updateRow(row, {message_sent:text});
    window.open(row.profile_url,'_blank','noopener');
    setCopied(true); setTimeout(()=>setCopied(false),1500);
  }
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;

  return <div className="modal-overlay" onClick={onClose}>
    <div className="modal" onClick={e=>e.stopPropagation()}>
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'18px 22px 0'}}>
        <div><span style={{fontWeight:700,fontSize:16}}>Draft message</span><span className="note"> · to {displayName(row)}{row.company?`, ${row.company}`:''}</span></div>
        <div style={{flex:1}}/><div className="iconbtn" style={{cursor:'pointer'}} onClick={onClose}>✕</div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'14px 22px 0',flexWrap:'wrap'}}>
        <select className="inp" style={{width:'auto'}} value={objective} onChange={e=>setObjective(e.target.value)}>
          {OBJECTIVES.map(([k,l])=><option key={k} value={k}>{l}</option>)}
        </select>
        <div style={{width:1,height:20,background:'var(--line)'}}></div>
        {TONES.map(t=><button key={t} className="btn sm" style={{background:tone===t?'var(--ink)':'var(--card)',color:tone===t?'#fff':'var(--sub)',border:'1px solid '+(tone===t?'var(--ink)':'rgba(0,0,0,.12)')}} onClick={()=>setTone(t)}>{t}</button>)}
      </div>
      <div style={{padding:'14px 22px 0'}}>
        <textarea className="inp" style={{minHeight:220,lineHeight:1.6}} value={text} onChange={e=>setText(e.target.value)} placeholder={mode==='none'?'Sign in to generate a draft, or write one yourself.':'Click Regenerate to draft with AI…'}/>
        <div className="note" style={{marginTop:6}}>{words} words · nothing is sent until you click — you're always in control</div>
        {err && <div className="warnbox" style={{marginTop:8}}>{err}</div>}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'16px 22px 18px',flexWrap:'wrap'}}>
        {mode!=='none' && <button className="btn ghost sm" onClick={generate} disabled={busy}>{busy?<Dots/>:'↻ Regenerate'}</button>}
        <button className="btn sm" style={{background:shorter?'var(--ink)':'var(--card)',color:shorter?'#fff':'var(--ink)',border:'1px solid '+(shorter?'var(--ink)':'rgba(0,0,0,.13)')}} onClick={()=>{setShorter(s=>!s);}}>Shorter</button>
        <button className="btn sm" style={{background:personal?'var(--ink)':'var(--card)',color:personal?'#fff':'var(--ink)',border:'1px solid '+(personal?'var(--ink)':'rgba(0,0,0,.13)')}} onClick={()=>{setPersonal(p=>!p);}}>More personal</button>
        <div style={{flex:1}}/>
        <button className="btn sm" onClick={copyAndOpen} disabled={!text.trim()}>{copied?'Copied ✓':'Copy & open LinkedIn'}</button>
      </div>
    </div>
  </div>;
}

                <div key={n} className="row" style={{background:'#fff'}}>

                  <Avatar row={{id:1,name:n}} size={34}/>
                  <div className="grow"><div className="t">{n}</div><div className="m">{l}</div></div>
                  <div style={{textAlign:'right'}}><div style={{fontWeight:700,color:'var(--brand)'}}>{s}</div><div className="note">Strong alumni match</div></div>
                </div>)}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:12,background:'var(--ink)',color:'#fff',borderRadius:10,padding:'10px 14px',marginTop:12}}>
              <div className="rail-logo" style={{width:16,height:16,fontSize:9}}>M</div><div style={{flex:1,fontSize:13}}>3 people selected</div>
              <button className="btn sm">Save to MIghTy</button>
            </div>
          </div>
        </div>}
      </div>
    </div>}
  </div>;
}
