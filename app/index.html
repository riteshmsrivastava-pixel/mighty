/* ===================== Your Network, Decoded =====================
   Reads kb.decoded back out - never recomputes from a raw archive, never
   calls an AI, every number here is one buildDecoded() already produced.
   First visit after an import plays the seven stored chapters plus a live
   eighth as a slow reveal, one card at a time; every later visit collapses
   to the same cards stacked and readable at a glance, with "Read it again"
   to replay. No counting animations anywhere - a number that ticks upward
   implies a precision the underlying export cannot back. */
function Sparkline({years}){
  if(!years || !years.length) return null;
  const max = Math.max(1, ...years.map(y=>y.count));
  return (
    <div className="row" style={{alignItems:'flex-end',gap:3,height:56,marginTop:18}}>
      {years.map(y=>(
        <div key={y.year} title={y.year+': '+y.count}
          style={{flex:1,minWidth:3,height:Math.max(3,Math.round(y.count/max*56)),
            background:'var(--brand)',borderRadius:2,opacity:y.count?0.85:0.15}}/>
      ))}
    </div>
  );
}
/* Reveals a chapter once it scrolls into view, on the first reading only -
   compact/replay-off mode renders everything shown immediately. */
function Reveal({firstRead, children}){
  const ref = useRef(null);
  const [shown,setShown] = useState(!firstRead);
  useEffect(()=>{
    if(!firstRead || shown) return;
    const el = ref.current; if(!el) return;
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting) setShown(true); });
    }, {threshold:0.3});
    io.observe(el);
    return ()=>io.disconnect();
    // eslint-disable-next-line
  },[firstRead]);
  return (
    <div ref={ref} style={{opacity:shown?1:0, transform:shown?'translateY(0)':'translateY(18px)',
      transition:'opacity .5s ease, transform .5s ease'}}>{children}</div>
  );
}
function ChapterShell({n, eyebrow, firstRead, children}){
  return (
    <Reveal firstRead={firstRead}>
      <div className="card" style={{padding: firstRead ? '52px 44px' : '24px 26px',
        marginTop: firstRead ? 20 : 12,
        minHeight: firstRead ? 'calc(100vh - 200px)' : 'auto',
        display:'flex', flexDirection:'column', justifyContent:'center'}}>
        <div className="eyebrow b" style={{color:'var(--brand-ink)'}}>{n}. {eyebrow}</div>
        <div style={{marginTop:14}}>{children}</div>
      </div>
    </Reveal>
  );
}
const GAP = {fontSize:16,color:'var(--body)',marginTop:14,lineHeight:1.65};
const HEADLINE = {fontSize:'clamp(22px,3.6vw,34px)',fontWeight:800,letterSpacing:'-.03em',lineHeight:1.25,textWrap:'pretty'};
const SUBHEAD = {fontSize:'clamp(19px,3.2vw,27px)',fontWeight:700,letterSpacing:'-.02em',lineHeight:1.45,textWrap:'pretty'};

function ChapterFrame({data}){
  if(!data) return null;

      <div style={{...HEADLINE, marginTop:10}}>

        in {data.positionCount.toLocaleString()} different roles.

}
function ChapterEras({data}){
  if(!data) return null;
  if(!data.years.length) return <div style={GAP}>Not enough dated connections to find your eras yet.</div>;
  const parts = [];
  if(data.hasEras && data.topEra) parts.push(`Your ${data.topEra.label} years brought ${data.topEra.count.toLocaleString()} people.`);
  if(data.fastestYear) parts.push(`${data.fastestYear.year} was the fastest your network ever grew - ${data.fastestYear.count.toLocaleString()} in a single year.`);
  if(data.quietestYear && (!data.fastestYear || data.quietestYear.year!==data.fastestYear.year))
    parts.push(`The quietest year was ${data.quietestYear.year}: ${data.quietestYear.count.toLocaleString()}.`);

    <div>
      <div style={SUBHEAD}>{parts.length ? parts.join(' ') : 'Here is every year, in order.'}</div>

}
function ChapterSleep({data, messagesPresent}){
  if(!messagesPresent) return <div style={GAP}>Your export did not include messages, so Mighty cannot see which connections ever became conversations.</div>;
  if(!data) return <div style={GAP}>Mighty could not tell which messages were yours in this export, so it cannot show which connections ever became conversations.</div>;

  const quietYears = data.medianQuietDays!=null ? Math.round(data.medianQuietDays/365*10)/10 : null;
  return (
    <div>
      <div style={HEADLINE}>

        <div style={GAP}>
          Another {data.quiet.toLocaleString()} did once, then the thread went quiet
          {quietYears!=null ? ` - the median silence is now ${quietYears} year${quietYears===1?'':'s'}.` : '.'}
          {' '}Relationships do not fail loudly.
        </div>}
    </div>
  );
}
function ChapterShowUp({data}){
  if(!data) return <div style={GAP}>Not enough dated conversations in this export to see how you show up.</div>;
  const fmtGap = (ms)=>{
    if(ms==null) return null;
    const hrs = ms/3600000;
    return hrs<48 ? Math.round(hrs)+' hours' : Math.round(hrs/24)+' days';
  };
  const mine = fmtGap(data.myMedianReplyMs), theirs = fmtGap(data.theirMedianReplyMs);
  return (
    <div>
      <div style={HEADLINE}>
        Across {data.totalThreads.toLocaleString()} conversations, the other person wrote first {data.theyWroteFirstPct}% of the time.
      </div>
      <div style={GAP}>
        {data.iWroteFirstReplyPct!=null && `When you do write first, you get a reply ${data.iWroteFirstReplyPct}% of the time. `}

}
function ChapterCircle({data, savedMap, onOpen, onSave}){
  const [savingUrls,setSavingUrls] = useState(()=>new Set());

              </div>

                    onClick={async(e)=>{ e.stopPropagation(); setSavingUrls(s=>new Set(s).add(p.profileUrl));
                      try{ await onSave({profileUrl:p.profileUrl, name:p.name, why:'One of the people you talk with most'}, 'decoded'); }
                      finally{ setSavingUrls(s=>{ const n=new Set(s); n.delete(p.profileUrl); return n; }); } }}>

const DECODED_FUNCTION_LABEL = {founder:'Founders', engineering:'Engineering', product:'Product',

/* Chapter 8 is the one chapter never stored - it is filtered through the
   goal on file today, not the goal on file at import time, and it reuses
   the exact ranking (connections_match) Explore and Ask already run, so
   this is where the reading hands off into the product's real loop. */
const DECODED_GOAL_SEARCH = {
  job_search:    {terms:['hiring manager','recruiter','talent acquisition','head of talent'], functionKey:'talent',    toward:'a new job'},
  raise_funding: {terms:['investor','venture partner','angel investor','venture capital'],     functionKey:'investing',toward:'raising investment'},
  sales:         {terms:['vp','director','head of','chief'],                                    functionKey:null,       toward:'new customers'},
  mentors:       {terms:['founder','operator','advisor','ceo'],                                 functionKey:'founder',  toward:'the right mentors'},
  networking:    {terms:[],                                                                      functionKey:null,       toward:'a stronger network'},
};
function ChapterTurn({sb, settings, shape, onSave}){
  const goal = goalTypeList(settings)[0] || 'networking';

  const ownCos = useMemo(()=>ownCompanies(settings),[settings]);

  useEffect(()=>{
    let dead=false;
    if(!cfg.terms.length){ setRows([]); return ()=>{}; }
    (async()=>{
      try{ const r = await matchConnections(sb, cfg.terms, ownCos, 5); if(!dead) setRows(r||[]); }
      catch(e){ if(!dead) setRows([]); }
    })();
    return ()=>{ dead=true; };
    // eslint-disable-next-line
  },[sb, goal]);
  const functionCount = cfg.functionKey && shape ? (shape.functions.find(f=>f.key===cfg.functionKey)||{}).count : null;
  return (

      </div>
      {rows===null && <div className="sub" style={{marginTop:16}}><span className="spin"/> Ranking your network…</div>}

              </div>
              <button className="btn g sm" style={{flex:'none'}} disabled={savingUrls.has(c.profile_url)}
                onClick={async()=>{ setSavingUrls(s=>new Set(s).add(c.profile_url));

                  finally{ setSavingUrls(s=>{ const n=new Set(s); n.delete(c.profile_url); return n; }); } }}>
                {savingUrls.has(c.profile_url) ? 'Adding…' : 'Add'}
              </button>
            </div>))}

function Decoded({sb, settings, people, onSaveSettings, onSave, onOpen, onEdit}){
  const decoded = (settings.knowledge||{}).decoded || null;
  const [replay,setReplay] = useState(false);
  /* Locked in at mount, not read from settings on every render - the
     mark-as-seen write below updates settings.decodedSeen a moment after
     mount, and re-deriving firstRead from that live value would collapse
     someone's very first reveal into the compact stack mid-scroll. Which
     visit this is gets decided once, when the visit starts. */
  const [firstVisit] = useState(()=>!settings.decodedSeen);
  const firstRead = replay || firstVisit;

  /* "Seen" flips the moment the reading is opened with data present - there
     is no scroll-completion event to key off, and the spec's own rule is
     visit-based ("every later visit"), not completion-based. */
  useEffect(()=>{
    if(decoded && !settings.decodedSeen && onSaveSettings) onSaveSettings({decodedSeen:true});
    // eslint-disable-next-line
  },[!!decoded]);

  if(!decoded){
    /* decoded is computed once, at import time, from the raw archive - an
       account whose archive predates that computation (or whose import
       otherwise never produced it) has positions/connectionCount/etc. in its
       Knowledge Base already, but no decoded reading, and used to be told to
       "import your LinkedIn export" as if nothing had ever been imported at
       all. Distinguishing the two cases, and giving the second one a button
       that actually does something, beats one static sentence for both. */
    const kb = settings.knowledge||{};
    const hasArchive = !!(kb.positions||[]).length || !!kb.connectionCount;
    return (
      <div className="card" style={{padding:'34px 30px',marginTop:24}}>
        <div className="h3">Your Network, Decoded</div>
        <div className="sub" style={{marginTop:7,lineHeight:1.55,maxWidth:520}}>
          {hasArchive
            ? 'Mighty already has your archive, but this reading was never built from it - reimporting the same export builds it, without losing anything else already saved.'
            : 'Import your LinkedIn export in Mirror, and Mighty reads back the shape of everything you have built - told honestly, once.'}
        </div>
        {onEdit &&
          <button className="btn sm" style={{marginTop:16}} onClick={()=>onEdit(1)}>
            {hasArchive ? 'Rebuild from my archive' : 'Import my history'}
          </button>}
      </div>);
  }

  const c = decoded.chapters;
  const savedMap = (()=>{
    const byUrl={}, byName={};
    people.forEach(r=>{
      if(r.profile_url) byUrl[r.profile_url.replace(/\/$/,'').toLowerCase()] = r;
      if(r.name) byName[r.name.toLowerCase()] = r;
    });
    return {byUrl, byName};
  })();

  return (
    <div style={{marginTop:24}}>
      <div className="row" style={{justifyContent:'space-between',alignItems:'baseline'}}>
        <div className="eyebrow b" style={{color:'var(--brand-ink)'}}>Your Network, Decoded</div>
        {!firstRead && <button className="btn q" style={{fontSize:13}} onClick={()=>setReplay(true)}>Read it again</button>}
      </div>
      <div>
        <ChapterShell n={1} eyebrow="The opening frame" firstRead={firstRead}><ChapterFrame data={c.frame}/></ChapterShell>
        <ChapterShell n={2} eyebrow="The eras" firstRead={firstRead}><ChapterEras data={c.eras}/></ChapterShell>
        <ChapterShell n={3} eyebrow="The sleep" firstRead={firstRead}><ChapterSleep data={c.sleep} messagesPresent={decoded.messagesPresent}/></ChapterShell>
        <ChapterShell n={4} eyebrow="How you actually show up" firstRead={firstRead}><ChapterShowUp data={c.showUp}/></ChapterShell>
        <ChapterShell n={5} eyebrow="The ones who kept showing up" firstRead={firstRead}>
          <ChapterCircle data={c.circle} savedMap={savedMap} onOpen={onOpen} onSave={onSave}/>
        </ChapterShell>
        <ChapterShell n={6} eyebrow="The shape of the room" firstRead={firstRead}><ChapterShape data={c.shape}/></ChapterShell>
        <ChapterShell n={7} eyebrow="The doors you knocked on" firstRead={firstRead}><ChapterDoors data={c.doors}/></ChapterShell>
        <ChapterShell n={8} eyebrow="Where this points" firstRead={firstRead}>
          <ChapterTurn sb={sb} settings={settings} shape={c.shape} onSave={onSave}/>
        </ChapterShell>
      </div>
    </div>
  );
}

/* ===================== Patterns =====================
   The wow of a first-day dashboard fades - a page that shows the same numbers
   every visit stops earning the visit. So this reads two ways at once: real
   findings, computed fresh from what has actually happened rather than
   guessed, and - when there is one - a "since your last visit" line, which is
   the part that changes and is the reason to come back. A snapshot of the
   counts at the last visit lives in the user's own settings; no server table,
   no new schema, and it costs one write per visit through the same
   saveSettings path everything else already uses. */
function Patterns({sb, settings, people, onSaveSettings, onSave, onOpen, onEdit}){
  const reached = people.filter(r=>REACHED.includes(r.status)).length;
  const talked  = people.filter(r=>['replied','coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length;
  const quiet   = people.filter(r=>r.status==='contacted' && days(r.contacted_at)>=10).length;

  const prev = settings.patternsSnapshot;
  const seenBefore = !!(prev && prev.at);
  const sinceVisit = seenBefore ? {
    added:   people.length - (prev.added||0),
    reached: reached - (prev.reached||0),
    talked:  talked - (prev.talked||0),
  } : null;
  const hasDelta = sinceVisit && (sinceVisit.added>0 || sinceVisit.reached>0 || sinceVisit.talked>0);

  useEffect(()=>{
    if(!onSaveSettings) return;
    onSaveSettings({patternsSnapshot:{at:new Date().toISOString(), added:people.length, reached, talked}});
    // eslint-disable-next-line
  },[]);

  /* Every finding here is a real computed number or it does not appear. No
     invented seniority shifts, no percentages the underlying data cannot
     support - the candidates below are the ones the schema actually backs
     today. How you show up in messages lives in the Decoded reading below,
     not here, now that chapter 4 covers it with the fuller reply-time story. */
  const findings = [];
  if(reached>=3){
    const rate = Math.round(talked/reached*100);
    findings.push({big:rate+'%', body:'of the people you have reached out to have written back. '
      + (rate>=50 ? 'Whatever you are opening with is working.'
                  : 'Most first messages never hear back - that is normal, not a sign to change everything.')});
  }
  if(quiet>0){
    findings.push({big:String(quiet),
      body:(quiet===1?'relationship has':'relationships have')+' gone quiet - reached out, nothing since.'});
  }

  return (
    <div style={{maxWidth:780}}>
      <div className="eyebrow b">What your data says</div>
      <h1 className="h1" style={{marginTop:8}}>Patterns</h1>
      <div className="sub" style={{marginTop:8,maxWidth:'60ch'}}>
        Computed from what has actually happened, not guessed. Nothing here moves until you do something new.
      </div>

      {hasDelta &&
        <div className="card" style={{marginTop:24,padding:'18px 24px',background:'var(--brand-soft2)'}}>
          <div className="eyebrow b" style={{color:'var(--brand-ink)'}}>Since your last visit</div>
          <div style={{marginTop:8,fontSize:15,color:'var(--brand-ink)',lineHeight:1.6}}>
            {[sinceVisit.added>0 && sinceVisit.added+' added', sinceVisit.reached>0 && sinceVisit.reached+' reached out',
              sinceVisit.talked>0 && sinceVisit.talked+' started talking'].filter(Boolean).join(', ')}.
          </div>
        </div>}

      {findings.length===0 &&
        <div className="card" style={{marginTop:24,padding:'26px'}}>
          <div className="h4">Not enough happening yet to find a pattern.</div>
          <div className="sub" style={{marginTop:6,maxWidth:'56ch'}}>
            Reach out to a few people, and Mighty starts noticing what is actually true about how it goes.
          </div>
        </div>}

      {findings.length>0 &&
        <div className="stack" style={{gap:14,marginTop:24}}>
          {findings.map((f,i)=>(
            <div key={i} className="card" style={{padding:'22px 24px',display:'flex',gap:20,alignItems:'baseline',flexWrap:'wrap'}}>
              <div style={{fontSize:32,fontWeight:800,letterSpacing:'-.03em',flex:'none',
                fontVariantNumeric:'tabular-nums',color:'var(--brand-ink)'}}>{f.big}</div>
              <div style={{fontSize:15,lineHeight:1.55,color:'var(--body)',flex:'1 1 300px'}}>{f.body}</div>
            </div>))}
        </div>}

      <Decoded sb={sb} settings={settings} people={people} onSaveSettings={onSaveSettings} onSave={onSave} onOpen={onOpen} onEdit={onEdit}/>
    </div>
  );
}

/* ===================== auth ===================== */
function Gate({sb}){
  const [mode,setMode] = useState('in');
  const [email,setEmail] = useState(''); const [pw,setPw] = useState('');
  const [busy,setBusy] = useState(false); const [msg,setMsg] = useState(null); const [err,setErr] = useState(null);
  async function go(){
    setErr(null); setMsg(null);
    /* Signup is open. The MIT check that used to live here was browser-side
       only, so it excluded the founders, recruiters and investors this is for
       while stopping nobody who opened devtools. Abuse is handled where it
       actually costs money instead: assists are granted only once a LinkedIn
       profile is claimed, and a profile can be claimed by one account. */
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(clean(email))){ setErr('That does not look like an email address.'); return; }
    setBusy(true);
    try{
      if(mode==='up'){
        const {error} = await sb.auth.signUp({email:clean(email), password:pw});
        if(error) throw error;
        setMsg('Account created. Check your inbox for the confirmation link, then sign in.'); setMode('in');
      } else if(mode==='in'){
        const {error} = await sb.auth.signInWithPassword({email:clean(email), password:pw});
        if(error) throw error;
      } else {
        const {error} = await sb.auth.resetPasswordForEmail(clean(email), {redirectTo:location.href});
        if(error) throw error; setMsg('Password reset link sent.');
      }
    }catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{width:'100%',maxWidth:400}}>
        <div className="row" style={{gap:10,marginBottom:26}}>
          <Logo/><span style={{fontSize:20,fontWeight:700,letterSpacing:'-.02em'}}>Mighty</span>
        </div>
        <h2 className="h2">{mode==='up'?'Create your account':mode==='in'?'Welcome back':'Reset your password'}</h2>
        <div className="sub" style={{marginTop:6}}>The memory behind lasting professional relationships.</div>
        <div className="card" style={{marginTop:22,padding:'22px 24px'}}>
          <div className="lbl">Email</div>
          <input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)}
            placeholder="you@work.com" autoComplete="email"/>
          {mode!=='reset' &&
            <div style={{marginTop:14}}>
              <div className="lbl">Password</div>
              <input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter') go(); }}
                autoComplete={mode==='up'?'new-password':'current-password'}/>
            </div>}
          {err && <div className="banner err" style={{marginTop:14}}>{err}</div>}
          {msg && <div className="banner ok" style={{marginTop:14}}>{msg}</div>}
          <button className="btn" style={{width:'100%',marginTop:18}} onClick={go} disabled={busy}>
            {busy?<span><span className="spin"/> Working…</span>:mode==='up'?'Create account':mode==='in'?'Sign in':'Send reset link'}
          </button>
          <div className="row" style={{justifyContent:'space-between',marginTop:14}}>
            <button className="btn q" style={{fontSize:13.5,padding:0}}
              onClick={()=>{ setMode(mode==='in'?'up':'in'); setErr(null); setMsg(null); }}>
              {mode==='in'?'Create an account':'I already have an account'}
            </button>
            {mode!=='reset' &&
              <button className="btn q" style={{fontSize:13.5,padding:0}} onClick={()=>{ setMode('reset'); setErr(null); }}>Forgot password</button>}
          </div>
        </div>
      </div>
    </div>
  );
}
