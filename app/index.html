<!-- ============================================================
     Mighty v2 - the relationship operating system.
     Governed by docs/PRODUCT-BIBLE-v2.md. Visual spec: the Claude Design
     bundle (app-redesign-with-new-principles).

     Navigation is the user's questions, not features:
       Today - what deserves my attention?
       Strategy - why am I networking?
       Discover - who should I know?
       Relationships- where am I with everyone?
       Ask Mighty - what should I do?
       Settings - how does Mighty work for me?

     Permanent rules enforced here:
       · You always click Send. Nothing is ever sent automatically.
       · Explain before you score - no numeric match scores in the UI.
       · Save is the only way a person enters Mighty; 'prospect' IS Saved.
       · Navigation is always visible; only depth unlocks, on data not time.
       · Never "Mighty knows" - always "Things you've learned".
       · No empty dashboards: every panel hides until it has real data.

     Same Supabase project, tables and settings keys as app/v1.html, so both
     apps read and write one account.
     ============================================================ -->

/* Primary-goal vocabulary is v1's goalType enum so both apps score alike. */
const GOALS = [

/* outreach_log.status is the ONE stage field. 'prospect' IS Saved. */
const STAGE = {

  ready_to_contact:{label:'Ready to reach out', bg:'#EFEBFE', fg:'#5540D8', dot:'#5B46E5'},

/* Board columns follow the Bible's default pipeline; the late statuses share
   one "Growing" column so the board stays readable. */
const COLUMNS = [
  {key:'prospect',         statuses:['prospect']},
  {key:'ready_to_contact', statuses:['ready_to_contact']},
  {key:'contacted',        statuses:['contacted']},
  {key:'replied',          statuses:['replied']},
  {key:'coffee_chat',      statuses:['coffee_chat']},
  {key:'growing',          statuses:['referral','interview','offer'], label:'Growing'},
];
const ORDER = ['prospect','ready_to_contact','contacted','replied','coffee_chat','referral','interview','offer'];
const REACHED = ['contacted','replied','coffee_chat','referral','interview','offer'];
const EVENT_LABEL = {connection_request:'Connection request', first_message:'First message sent',
  reply:'They replied', coffee_chat:'Met', note:'Note captured', referral:'Referral',
  interview:'Interview', stage_change:'Stage changed'};

/* ===================== progressive disclosure =====================
   Navigation is always visible. Only depth unlocks, and only on data. */
const UNLOCKS = {
  board:    {test:(p)=>p.length>=5,       hint:'The board opens once five people are saved - before that a list says more.'},
  timeline: {test:(p,e)=>e.length>=3,     hint:'The timeline fills in once three things have happened.'},

             hint:'Reach out to three people and Mighty can start showing what is working.'},
  progress: {test:(p)=>p.length>=3,       hint:'Progress appears once you have saved three people.'},
};
const canSee = (k,p,e)=>{ try{ return !!UNLOCKS[k].test(p,e); }catch(err){ return false; } };

/* ===================== helpers ===================== */
const clean = (s)=>String(s==null?'':s).trim();
const initials = (n)=>clean(n).split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
const firstName = (n)=>clean(n).split(/\s+/)[0] || '';
const DAY = 86400000;
const days = (iso)=> iso ? Math.floor((Date.now()-new Date(iso).getTime())/DAY) : null;
const ago = (iso)=>{ const d=days(iso); if(d==null) return ''; return d<=0?'today':d===1?'yesterday':d<30?d+' days ago':d<365?Math.round(d/30)+' months ago':Math.round(d/365)+'y ago'; };
const dateShort = (iso)=>{ if(!iso) return ''; const d=new Date(iso);
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); };
const greetWord = ()=>{ const h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; };

}
function Empty({title, body, cta, onCta}){

}
function ChipInput({value, onChange, placeholder}){
  const [t,setT] = useState('');
  const add = ()=>{
    const parts = t.split(',').map(clean).filter(Boolean);
    if(!parts.length) return;

}

/* ===================== AI (shared ai-proxy - no key ever reaches the client) ===================== */
/* ---- Instrumentation --------------------------------------------------------
   Our own table, not a third-party service, because we tell people that nothing
   they write about someone leaves their account. Sending behavioural data to a
   vendor a week after saying that would make it untrue in spirit.

   Counts and categories only. safeProps() enforces that structurally rather than
   by convention: a value survives only if it is a finite number, a boolean, or a
   short enum-shaped string. A name has a space and a capital, an email has an @,
   a URL has a colon and a slash - all three are dropped by the same rule, so a
   leak requires defeating the sanitizer rather than merely forgetting the rule.

   Fire and forget. Analytics must never break a feature or make the user wait,
   so every failure here is swallowed on purpose. */
const ENUMISH = /^[a-z0-9_]{1,32}$/;
/* Must agree with app_events.event's check constraint (2 to 40 chars). A name
   the client accepts and Postgres rejects is an event that vanishes silently. */
const EVENT_NAME = /^[a-z0-9_]{2,40}$/;
function safeProps(props){
  const out = {};
  if(!props || typeof props!=='object') return out;
  for(const k of Object.keys(props).slice(0,8)){
    if(!ENUMISH.test(k)) continue;
    const v = props[k];
    if(typeof v==='number' && Number.isFinite(v)) out[k] = v;
    else if(typeof v==='boolean') out[k] = v;
    else if(typeof v==='string' && ENUMISH.test(v)) out[k] = v;
    // anything else - names, emails, URLs, note text, objects - is dropped
  }
  return out;
}
/* App binds these once it has a client and a session. Kept module-level rather
   than threaded through six components as a prop: call sites stay readable, and
   an unbound tracker is a silent no-op rather than a crash. */
let _trkSb = null, _trkUser = null;
function bindTracking(sb, user){ _trkSb = sb; _trkUser = user; }
function track(event, props){
  try{
    if(!_trkSb || !_trkUser || !EVENT_NAME.test(String(event||''))) return;
    _trkSb.from('app_events').insert({user_id:_trkUser.id, event, props:safeProps(props)})
      .then(()=>{}, ()=>{});   // never surface an analytics failure
  }catch(e){}
}

/* ---- Extension bridge -------------------------------------------------------
   The extension can read a search results page that this page cannot: CORS
   blocks the app, but the background worker holds host permission. It parses
   location, education, experience and follower counts out of the same response,
   which the API path does not return at all. Ported from v1, which used it and
   which v2 stopped calling.

   Request/response over postMessage. With no extension installed every call
   times out and resolves {ok:false, error:'no_extension'}, so callers fall back
   rather than hang. Nothing here navigates or opens a tab. */
const extBridge = (()=>{
  let seq=0; const pending=new Map(); let ready=false;
  if(typeof window!=='undefined'){
    window.addEventListener('message', ev=>{
      if(ev.source!==window) return;
      const d=ev.data; if(!d || d.source!=='mighty-ext') return;
      if(d.ready){ ready=true; return; }
      const cb=pending.get(d.id); if(cb){ pending.delete(d.id); cb(d); }
    });
  }
  function call(kind, extra, timeoutMs){
    return new Promise(resolve=>{
      const id='m'+(++seq)+'-'+Date.now();
      const t=setTimeout(()=>{ pending.delete(id); resolve({ok:false,error:'no_extension'}); }, timeoutMs||25000);
      pending.set(id, d=>{ clearTimeout(t); resolve(d); });
      window.postMessage({source:'mighty-app', id, kind, ...extra}, window.location.origin);
    });
  }
  return {
    isReady: ()=>ready,
    search: (query)=>call('search',{query}),
    photo: (profileUrl)=>call('photo',{profileUrl}, 30000),
  };
})();

/* The proxy already tells us the plan and how much of the monthly allowance is
   left; llm() used to return data.text and throw the rest away, so the number the
   whole model is metered on was invisible in the app. It is reported here and the
   App renders it. Reported on refusal too - that is exactly when it matters. */
let _onAiMeta = null;
function onAiMeta(fn){ _onAiMeta = fn; }
function reportMeta(meta){ try{ if(_onAiMeta && meta) _onAiMeta(meta); }catch(e){} }

/* `exchangeKey` is how one assist buys ten takes. It identifies a single
   outbound conversation with one person - 'ex:<log_id>:<n>' - and the gateway
   charges the first call carrying it and nothing after. It contains no name and
   no profile URL, so the ledger stays free of anyone who is not a user. */
async function llm(sb, feature, system, user, maxTokens, exchangeKey){
  const {data, error} = await sb.functions.invoke('ai-proxy',
    {body:{feature, system, user, maxTokens:maxTokens||700, exchangeKey:exchangeKey||null}});
  if(error) throw error;
  if(data && data.meta) reportMeta(data.meta);
  if(!data || data.ok===false){
    if(data && data.error==='rate_limited') reportMeta({plan:data.plan, assistsLeftMonth:0, exhausted:true});
    throw new Error((data && (data.message||data.error)) || 'AI request failed.');
  }
  return data.text;
}
async function llmJSON(sb, feature, system, user, maxTokens, exchangeKey){
  const text = await llm(sb, feature, system+'\n\nRespond with ONLY valid JSON, no prose, no markdown fences.', user, maxTokens||900, exchangeKey);
  return JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}')+1));
}
function strategyBrief(st){

    'Primary goal: ' + (GOAL_LABEL[st.goalType] || 'building a professional network'),
    st.goal ? 'In their words: ' + st.goal : '',
    (st.targetRoles||[]).length ? 'Wants to meet: ' + st.targetRoles.join(', ') : '',
    (st.targetCompanies||[]).length ? 'Target organizations: ' + st.targetCompanies.join(', ') : '',
    (st.targetLocations||[]).length ? 'Places that matter: ' + st.targetLocations.join(', ') : '',
    (st.currentRole||st.currentCompany) ? 'Currently: ' + [st.currentRole, st.currentCompany].filter(Boolean).join(' at ') : '',
    (st.schools||[]).length ? 'Schools: ' + st.schools.join(', ') : '',
    (st.successMetrics||[]).length ? 'Success looks like: ' + st.successMetrics.join(', ') : '',
    (st.networkingStyle||[]).length ? 'Prefers: ' + st.networkingStyle.join(', ') : '',
  ].filter(Boolean).join('\n');
}
function localKeywords(sentence, st){
  const stop = /\b(find|show|me|people|person|who|that|which|are|is|a|an|the|and|or|of|in|at|to|for|with|from|working|works|based|i|want|meet|looking|like|some)\b/gi;
  let s = clean(sentence).replace(stop,' ').replace(/\s+/g,' ').trim();
  if(!s) s = [(st.targetRoles||[])[0], (st.targetCompanies||[])[0], (st.targetLocations||[])[0]].filter(Boolean).join(' ');
  return s.slice(0,180);
}
async function toKeywords(sb, sentence, st){
  const home = (st.targetLocations||[])[0] || st.homeLocation;
  const near = /\bnear me\b/i.test(sentence) && home ? clean(sentence).replace(/\bnear me\b/i, home) : clean(sentence);
  try{
    const out = await llm(sb, 'tagging',
      'You turn a sentence describing people someone wants to meet into a short keyword query for a LinkedIn profile search. Output ONLY the keywords, space separated, no punctuation, no explanation, no quotes. Keep job titles, companies, schools, industries and places. Drop filler words. Maximum 12 words.',
      near, 60);
    const k = clean(out).replace(/^["']|["']$/g,'').replace(/\s+/g,' ');
    return k || localKeywords(near, st);
  }catch(e){ return localKeywords(near, st); }
}
/* One match ladder across the whole product - app, extension panel and
   marketing all say the same three things. Keep in sync with
   mightyMatchLabel() in extension/scoring.js. */
const VERDICT = {
  excellent:{label:'Excellent match', dot:'#5B46E5'},
  strong:   {label:'Strong match',    dot:'#22916A'},
  potential:{label:'Potential match', dot:'#D9971C'},
  low:      {label:'Low potential',   dot:'#B0A9A0'},
};
const VERDICT_KEYS = ['excellent','strong','potential','low'];
async function evaluate(sb, people, st){
  const list = people.map((p,i)=>`${i+1}. ${p.name} - ${p.title||'(no headline)'}${p.company?' - '+p.company:''}`).join('\n');
  const out = await llmJSON(sb, 'profile_briefing',
    'You help a professional decide who is worth building a relationship with. For each candidate, judge relevance to THEIR stated goal and explain it in plain language. Never output a numeric score. Ground every claim only in the given headline text - if the headline does not support a claim, do not make it. Be honest: never inflate a weak fit, and when nothing about someone matches the goal, say so outright rather than implying promise that is not there. Common ground must be real overlap between the two people; "both in tech" is not common ground. Never use em dashes; write a spaced hyphen instead.',
    `The person doing the networking:\n${strategyBrief(st)}\n\nCandidates:\n${list}\n\nReturn JSON exactly like {"matches":[{"n":1,"verdict":"excellent"|"strong"|"potential"|"low","why":"one or two sentences, starts with the reason, no score","common":["short shared-ground phrase"]}]}. Use "excellent" only when they match the goal squarely, "strong" for a clear fit, "potential" when the connection is real but loose, and "low" when nothing about them lines up with the goal. Include every candidate by its number n. "common" may be empty.`,
    1500);
  const byN = {};
  (out.matches||[]).forEach(m=>{ if(m && m.n) byN[Number(m.n)]=m; });
  return people.map((p,i)=>{
    const m = byN[i+1]||{};
    const raw = String(m.verdict||'').toLowerCase();
    const v = VERDICT_KEYS.indexOf(raw)>=0 ? raw : 'potential';
    return {...p, verdict:v, why:clean(m.why), common:Array.isArray(m.common)?m.common.filter(Boolean).slice(0,4):[]};
  });
}

/* ===================== The Knowledge Base, on screen =====================
   Everything Mighty holds about the user, in the place where they can correct
   it. Two things earn their space here.

   First, it is auditable. "Where did Mighty learn that" has an answer, and the
   answer is a row you can look at and change.

   Second, and rarer: it states what it does NOT know. That is close to free to

   that gets corrected and one that gets quietly distrusted. */

  const kb = settings.knowledge || {};

    !(kb.answers||[]).length && 'anything you have told it in your own words',

    (kb.honors||[]).length        && [(kb.honors||[]).length, 'honours'],
    (kb.publications||[]).length  && [(kb.publications||[]).length, 'publications'],
    kb.connectionCount            && [kb.connectionCount, 'connections'],
    (msg && msg.styleSamples||[]).length && [(msg.styleSamples||[]).length, 'writing samples'],
    (kb.answers||[]).length       && [(kb.answers||[]).length, 'answers you gave'],

/* Actions are derived from real relationship data. Nothing is invented - if
   there is nothing real to do, Today says so and points at Discover. */
function buildPlan(people, events, tasks){
  const byLog = {};
  events.forEach(e=>{ (byLog[e.log_id] = byLog[e.log_id]||[]).push(e); });
  const lastOf = (r, types)=>{
    const list = (byLog[r.id]||[]).filter(e=>!types || types.indexOf(e.event_type)>=0);
    return list.length ? list[list.length-1] : null;
  };
  const out = [];

  people.filter(r=>r.status==='replied').forEach(r=>{
    const reply = lastOf(r,['reply']);
    const mine  = lastOf(r,['first_message','note']);
    const stale = !mine || !reply || new Date(reply.occurred_at) > new Date(mine.occurred_at);
    if(stale) out.push({id:'reply-'+r.id, tone:'red', title:'Reply to '+(r.name||'them'),
      sub: reply ? 'They replied '+ago(reply.occurred_at)+'.' : 'They are waiting on you.',
      min:5, cta:'Reply', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  people.filter(r=>r.status==='ready_to_contact').forEach(r=>{
    out.push({id:'send-'+r.id, tone:'amber',
      title:(r.ai_draft?'Send your first message to ':'Write to ')+(r.name||'them'),
      sub: r.ai_draft ? 'Draft is written and waiting for your review.' : 'You marked them ready. Mighty can draft it.',
      min: r.ai_draft?4:8, cta: r.ai_draft?'Review & send':'Draft it', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  tasks.filter(t=>!t.done).forEach(t=>{
    const overdue = t.due_date && new Date(t.due_date).getTime() < Date.now()-DAY;
    const person = people.find(p=>p.id===t.log_id);
    out.push({id:'task-'+t.id, tone:overdue?'red':'amber', title:t.label,
      sub:(t.sub || (person? person.name : '')) + (t.due_date? (overdue?' · overdue':' · due '+dateShort(t.due_date)) : ''),
      min:5, cta:'Open', taskId:t.id,
      go: person ? {screen:'profile', id:person.id, tab:'notes'} : {screen:'people'}});
  });

  people.filter(r=>['coffee_chat','replied'].indexOf(r.status)>=0).forEach(r=>{
    const met = lastOf(r,['coffee_chat']);
    const note = lastOf(r,['note']);
    if(met && (!note || new Date(note.occurred_at) < new Date(met.occurred_at)) && days(met.occurred_at)<=5)
      out.push({id:'cap-'+r.id, tone:'green', title:'Capture your conversation with '+(r.name||'them'),
        sub:'You met '+ago(met.occurred_at)+' and nothing is written down yet.', min:5, cta:'Add notes',
        go:{screen:'profile', id:r.id, tab:'notes'}});
  });

  people.filter(r=>r.status==='prospect' && !(r.briefing&&r.briefing.careerSummary)).slice(0,2).forEach(r=>{
    out.push({id:'brief-'+r.id, tone:'purple', title:'Understand '+(r.name||'them')+' before you reach out',
      sub:(r.context&&r.context.whySaved) ? r.context.whySaved.slice(0,90) : 'Saved '+(ago(r.shortlisted_at)||'recently')+'. No brief yet.',
      min:6, cta:'Prepare me', go:{screen:'profile', id:r.id, tab:'brief'}});
  });

  const rank = {red:0, amber:1, green:2, purple:3, grey:4};
  out.sort((a,b)=>(rank[a.tone]-rank[b.tone]));
  const plan = out.slice(0,5);
  if(plan.length<5) plan.push({id:'discover', tone:'grey', title:'Find one person worth knowing',
    sub:'Five good people beat fifty saved profiles.', min:3, cta:'Discover', go:{screen:'discover'}});
  return plan;
}
const TONE = {red:'#B5675A', amber:'#D9971C', green:'#22916A', purple:'#5B46E5', grey:'#C4BDB2'};

function Today({people, events, tasks, settings, email, go, onToggleTask, doneToday}){

    return t[0]||null;

        <div className="row" style={{alignItems:'baseline',justifyContent:'space-between',gap:16,

          <div className="h3">Today's plan</div>

        </div>

        {plan.map(t=>(
          <div key={t.id} className="row lift" style={{gap:16,padding:'18px 26px',borderBottom:'1px solid var(--line2)'}}>
            <span className="dot" style={{background:TONE[t.tone]}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:16,fontWeight:700,letterSpacing:'-.01em',textWrap:'pretty'}}>{t.title}</div>
              <div className="sub" style={{fontSize:14,marginTop:3,textWrap:'pretty'}}>{t.sub}</div>
            </div>
            <div className="meta" style={{flex:'none'}}>{t.min} min</div>
            <button className="btn g sm" style={{flex:'none'}} onClick={()=>go(t.go)}>{t.cta}</button>
          </div>))}

        {allDone &&
          <div style={{padding:'34px 26px 38px'}}>
            <div className="h3">You're all caught up.</div>
            <div className="sub" style={{marginTop:6}}>You've done today's recommended actions.</div>
            <button className="btn" style={{marginTop:20}} onClick={()=>go({screen:'discover'})}>Discover someone new</button>
          </div>}

        {doneToday.map(t=>(
          <div key={'d'+t.id} className="row" style={{gap:16,padding:'15px 26px',borderBottom:'1px solid var(--line2)',background:'var(--card2)'}}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#14805A" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" style={{flex:'none'}}><path d="m4 12.5 5 5L20 6.5"/></svg>
            <div style={{flex:1,minWidth:0,fontSize:15,fontWeight:600,color:'#8E887F'}}>{t.label}</div>
            <div className="meta">Completed {ago(t.completed_at)||'today'}</div>
            <button className="btn q" style={{fontSize:13,padding:0}} onClick={()=>onToggleTask(t,false)}>Undo</button>
          </div>))}

        <div className="meta" style={{padding:'16px 26px'}}>
          {people.length===0
            ? 'Your plan is built from real relationships - save someone and it fills in.'
            : plan.length + (plan.length===1?' action':' actions') + ' · ' + mins + ' minutes'}
        </div>
      </div>

      {nextMeeting &&
        <div className="fade" style={{marginTop:38}}>
          <div className="eyebrow">Upcoming</div>
          <div className="card row" style={{marginTop:12,padding:'18px 22px',gap:16}}>
            <div style={{flex:1,minWidth:0}}>
              <div className="h4">{nextMeeting.label}</div>
              <div className="sub" style={{fontSize:14,marginTop:3}}>{dateShort(nextMeeting.due_date)}</div>
            </div>
            <button className="btn g sm" onClick={()=>{
              const p = people.find(x=>x.id===nextMeeting.log_id);
              go(p ? {screen:'profile', id:p.id, tab:'brief'} : {screen:'people'});
            }}>Open brief</button>
          </div>
        </div>}
    </div>
  );
}

/* ===================== Discover =====================
   Three ways in, in the order they are actually useful.

   1. An open box over the user's OWN connections. This is not a name search:
      "folks from Boston investing in idea-stage sustainable companies" is the
      real shape of the query. It costs nothing - no keyword extraction, no
      evaluation, no model call at all - because the answer is already in the
      database. That is why it goes first.
   2. LinkedIn, for people the user is not connected to. This is the expensive
      path (two model calls) and it is now explicitly the second choice.
   3. The ranking nobody asked for: dormancy, goal fit, shared history.

   A row only appears if something matched. Discover never pads the list with
   people it has no reason to suggest - that is the whole difference between
   this and scrolling LinkedIn. */

/* Words that carry no retrieval signal.
   Two-letter terms are KEPT, because AI, VC, ML and PM are the shortest and most
   important words anyone will type here. That means the stop list has to carry
   the short function words itself rather than leaning on a length cut-off: an
   earlier version filtered anything under three characters, which threw away AI
   and VC while happily keeping "and". */
const Q_STOP = new Set([
  // function words, including the short ones a length filter used to catch
  'a','an','the','and','or','of','in','on','at','to','is','it','as','by','be','if','so','do','my','me',
  'we','us','he','so','no','up','all','any','are','was','has','had','can','not','but','for','you','your',
  'yours','who','whom','what','when','where','which','while','with','from','that','this','these','those',
  'they','them','their','there','then','than','been','into','also','over','under','after','before','more',
  'most','much','many','some','such','only','just','very','ever','even','same','other','others','would',
  'could','should','will','here','out','how','why','get','got','give','given','take','taken','make','made',
  'use','used','using','per','via','yet','far','now','off','own','see','say','set','due','one','two',
  // words about the search rather than the person
  'anyone','anybody','people','folks','person','someone','somebody','looking','look','find','found',
  'about','like','want','wants','need','needs','know','knows','help','helps','best','good','ones',
  'companies','company','working','works','work','worked']);

function queryTerms(text){
  /* Alphanumeric only, deliberately. Terms go into a Postgres regex on the other
     side, and a stray + or * there is either a syntax error or a silent wrong
     match. Stripping the characters here is safer than escaping them there. */
  const seen = {}, out = [];
  String(text||'').toLowerCase().split(/[^a-z0-9]+/).forEach(w=>{
    if(w.length < 2 || Q_STOP.has(w) || seen[w]) return;
    seen[w] = 1; out.push(w);
  });
  return out.slice(0, 10);
}

/* The terms the ranking searches on when the user has not asked anything. Roles
   and companies and places the user named in their strategy come first because
   they were stated rather than inferred; words from the goal sentence fill in. */
function goalTerms(settings){
  const s = settings || {};
  const named = [].concat(s.targetRoles||[], s.targetCompanies||[], s.targetLocations||[])
    .join(' ');
  return queryTerms(named + ' ' + (s.goal||''));
}

/* Every employer the user has had, so "was there while you were" is checkable.
   Reads the Knowledge Base the archive filled in, and falls back to whatever the
   strategy form knows if there is no archive. */
function ownCompanies(settings){
  const s = settings || {}, kb = s.knowledge || {};
  const fromKb = (kb.positions||[]).map(p=>p && p.company).filter(Boolean);
  const all = fromKb.concat([s.currentCompany].filter(Boolean));
  const seen = {}, out = [];
  all.forEach(c=>{ const k = String(c).toLowerCase().trim();
    if(k && !seen[k]){ seen[k]=1; out.push(String(c).trim()); } });
  return out.slice(0, 25);
}

function connName(c){
  return clean([c.first_name, c.last_name].filter(Boolean).join(' ')) || 'Unnamed connection';
}

/* Why this person is in front of you, in words, from the three signals the
   database can actually support. Never more than two clauses: a reason nobody
   reads is the same as no reason. */
function connReason(c){
  const bits = [];
  if(c.shared_company) bits.push('Was at ' + c.shared_company + ' while you were');
  if(c.hits && c.hits.length) bits.push('Matched on ' + c.hits.slice(0,3).join(', '));
  const yrs = Number(c.years_silent || 0);
  if(bits.length < 2 && c.connected_on && yrs >= 2){
    bits.push('Connected ' + String(c.connected_on).slice(0,4) + ', nothing since');
  }
  return bits.slice(0,2).join('. ') + (bits.length ? '.' : '');
}

/* Turn a connections row into the shape savePerson already understands, so
   adding from your own network and adding from a search write the same row. */
function connToPerson(c){
  return {
    profileUrl: c.profile_url,
    name: connName(c),
    title: clean(c.position) || null,
    company: clean(c.company) || null,
    why: connReason(c),
    common: (c.hits||[]).slice(0,4),
    connectedOn: c.connected_on || null,
  };
}

/* Relationship caps per plan. The database is authoritative (ai_config), these
   are the same defaults so the number can be shown without a round trip. */
const PLAN_CAPS = {trial:50, starter:100, plus:200, pro:500, explorer:100, builder:200, leader:500};

async function matchConnections(sb, terms, ownCos, limit){
  const {data, error} = await sb.rpc('connections_match', {
    p_terms: terms || [], p_own_companies: ownCos || [], p_limit: limit || 12});
  if(error) throw error;
  return data || [];
}

function Discover({sb, settings, people, plan, onSave, onOpen, go}){
  /* --- your own network --- */
  const [total,setTotal]   = useState(null);   // how many connections were imported
  const [mineQ,setMineQ]   = useState('');
  const [mine,setMine]     = useState(null);   // null = not searched yet
  const [mineBusy,setMB]   = useState(false);
  const [mineErr,setME]    = useState(null);
  const [sugg,setSugg]     = useState(null);
  const [suggBusy,setSB]   = useState(true);

  /* --- LinkedIn, the expensive path --- */
  const [q,setQ]         = useState('');
  const [phase,setPhase] = useState('idle');
  const [results,setRes] = useState([]);
  const [err,setErr]     = useState(null);
  const [notice,setNote] = useState(null);
  const [skipped,setSkip]= useState({});
  const [savingUrl,setSaving] = useState(null);
  const [lastQuery,setLastQ]  = useState('');
  const [noExt,setNoExt] = useState(false);
  const [webOpen,setWebOpen]  = useState(false);

  const savedUrls = useMemo(()=>{
    const m = {}; people.forEach(r=>{ if(r.profile_url) m[r.profile_url.toLowerCase()]=r; }); return m;
  },[people]);
  const cap = PLAN_CAPS[plan||'trial'] || 50;
  const atCap = people.length >= cap;

  const terms = useMemo(()=>goalTerms(settings),[settings]);
  const ownCos = useMemo(()=>ownCompanies(settings),[settings]);

  /* The ranking loads on arrival, because a screen that asks you to press a
     button before it shows you anything has not answered its own question. */
  useEffect(()=>{
    let dead = false;
    (async()=>{
      setSB(true);
      try{
        const {data:n} = await sb.rpc('connections_count');
        if(!dead) setTotal(Number(n||0));
        const rows = await matchConnections(sb, terms, ownCos, 8);
        if(!dead){ setSugg(rows); track('discover_ranked', {returned:rows.length, terms:terms.length}); }
      }catch(e){ if(!dead) setSugg([]); }
      if(!dead) setSB(false);
    })();
    return ()=>{ dead = true; };
  },[sb, terms.join(' '), ownCos.join(' ')]);

  async function searchMine(text){
    const sentence = clean(text!=null?text:mineQ);
    if(!sentence || mineBusy) return;
    setME(null); setMB(true);
    const t = queryTerms(sentence);
    try{
      const rows = await matchConnections(sb, t, [], 5);
      setMine({q:sentence, terms:t, rows});
      track('discover_own_search', {terms:t.length, results:rows.length});
    }catch(e){ setME(e.message||String(e)); }
    setMB(false);
  }

  const examples = useMemo(()=>{
    const role=(settings.targetRoles||[])[0], loc=(settings.targetLocations||[])[0];
    return [
      role&&loc ? role+'s in '+loc : 'Investors in Boston backing idea-stage companies',
      ownCos[1] ? 'Anyone I overlapped with at '+ownCos[1] : 'Anyone I worked with before',
      'Founders who have raised a seed round',
    ];
  },[settings, ownCos.join(' ')]);

  async function run(text){
    const sentence = clean(text!=null?text:q);
    if(!sentence || phase==='searching' || phase==='thinking') return;
    setErr(null); setNote(null); setNoExt(false); setRes([]); setSkip({}); setPhase('searching'); setLastQ(sentence);
    try{
      const kw = await toKeywords(sb, sentence, settings);

      /* Ask the extension first. It reads the results page itself, so it comes
         back with location, education, experience and follower counts - the API
         path returns a title and a link and nothing else. Fall back to the edge
         function only when the extension is not installed. */
      let found = [], via = 'ext';
      const bridged = await extBridge.search(kw);
      if(bridged && bridged.ok){
        found = (bridged.people||[]).filter(p=>p && p.profileUrl);
      } else if(bridged && bridged.error==='blocked'){
        track('search_blocked', {});
        setErr('Search is rate limited right now, so results would be incomplete rather than wrong. Give it a few minutes, or find them on LinkedIn and save from there.');
        setPhase('idle'); return;
      } else {
        const {data, error} = await sb.functions.invoke('people-search', {body:{query:kw}});
        if(error) throw error;
        if(!data || data.ok===false){
          if(data && data.error==='not_configured') setNoExt(true);
          else setErr((data && (data.message||data.error)) || 'Search failed.');
          setPhase('idle'); return;
        }
        found = (data.people||[]).filter(p=>p && p.profileUrl);
        via = 'api';
      }
      /* `via` is the whole point of instrumenting this: it tells us whether the
         extension search path actually works against live Google, which cannot
         be established from a test harness. */
      track('search_run', {via, results:found.length,
        with_facts: found.filter(p=>p.location||p.education).length});

      if(!found.length){
        setNote('Nothing came back for that one. Naming a role and a place works best - "product leaders in Boston" beats "smart people in AI".');
        setPhase('idle'); return;
      }
      setRes(found); setPhase('thinking');
      try{ setRes(await evaluate(sb, found, settings)); }
      catch(e){ setNote('Found these, but Mighty could not explain the matches just now: '+(e.message||'AI unavailable')+'.'); }
      setPhase('done');
    }catch(e){ setErr(e.message||String(e)); setPhase('idle'); }
  }

  const visible = results.filter(r=>!skipped[r.profileUrl]);
  const busy = phase==='searching' || phase==='thinking';

  /* One row, used by both the query results and the ranking, so a person you
     found and a person Mighty suggested cannot drift apart visually. */
  function ConnRow({c}){
    const saved = savedUrls[(c.profile_url||'').toLowerCase()];
    const reason = connReason(c);
    return (
      <div className="row" style={{alignItems:'flex-start',gap:13,padding:'14px 0',borderBottom:'1px solid var(--line2)'}}>
        <Avatar name={connName(c)} size={34}/>
        <div style={{flex:'1 1 200px',minWidth:0}}>
          <div style={{fontSize:15,fontWeight:700}}>{connName(c)}</div>
          <div className="sub" style={{fontSize:13.5,marginTop:1}}>
            {[clean(c.position), clean(c.company)].filter(Boolean).join(' · ') || 'No role on the export'}
          </div>
          {reason && <div style={{fontSize:13,color:'var(--brand-ink)',marginTop:4,lineHeight:1.5}}>{reason}</div>}
        </div>
        <div style={{display:'flex',gap:8,flex:'none',alignItems:'center'}}>
          {saved
            ? <button className="btn g sm" onClick={()=>onOpen(saved.id)}>Open</button>
            : <F>
                <button className="btn sm" disabled={atCap || savingUrl===c.profile_url}
                  onClick={async()=>{ setSaving(c.profile_url); await onSave(connToPerson(c), 'own_network'); setSaving(null); }}>
                  {savingUrl===c.profile_url ? <span><span className="spin"/> Adding</span> : 'Add'}
                </button>
                <button className="btn q" style={{fontSize:13}}
                  onClick={()=>setSugg(s=>(s||[]).filter(x=>x.profile_url!==c.profile_url))}>Skip</button>
              </F>}
        </div>
      </div>
    );
  }

  const haveConnections = total===null || total>0;

  return (
    <div className="pad fade" style={{maxWidth:860}}>
      <div className="row" style={{gap:12,flexWrap:'wrap'}}>
        <span className="eyebrow b">Your focus</span>
        <span style={{fontSize:15,fontWeight:600,color:'var(--ink2)'}}>
          {settings.goal || GOAL_LABEL[settings.goalType] || 'Build your network'}
        </span>
        <button className="btn q" style={{fontSize:13,padding:0}} onClick={()=>go({screen:'strategy'})}>Edit</button>
      </div>

      {atCap &&
        <div className="banner warn" style={{marginTop:18}}>
          You are at {cap} relationships, which is the cap on your plan. Mighty would rather stop you here
          than watch a list of five hundred names go stale. Close one out, or move up a plan.
        </div>}

      {/* ---- 1. your own network, free and instant ---- */}
      <div className="card" style={{marginTop:22,padding:'28px 28px 26px'}}>
        <div className="row" style={{justifyContent:'space-between',alignItems:'baseline',gap:14,flexWrap:'wrap'}}>
          <h2 className="h2">Describe who you are looking for.</h2>
          <span className="meta">
            {total===null ? '' : total>0 ? 'across your '+total.toLocaleString()+' connections' : 'no connections imported'}
          </span>
        </div>
        <div className="sub" style={{marginTop:6}}>
          Not a name search. Say it however you would say it out loud.
        </div>
        {haveConnections ? <F>
          <div style={{display:'flex',gap:12,marginTop:20,alignItems:'stretch',flexWrap:'wrap'}}>
            <input className="inp" style={{flex:'1 1 260px',minWidth:0}} value={mineQ}
              placeholder="Folks from Boston who are investing in idea-stage sustainable companies"
              onChange={e=>setMineQ(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') searchMine(); }}/>
            <button className="btn" style={{flex:'none',padding:'0 26px',borderRadius:'var(--rsm)'}}
              onClick={()=>searchMine()} disabled={mineBusy||!clean(mineQ)}>
              {mineBusy ? <span><span className="spin"/> Looking</span> : 'Find them'}
            </button>
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:9,marginTop:15}}>
            {examples.map(x=><button key={x} className="chip" disabled={mineBusy}
              onClick={()=>{ setMineQ(x); searchMine(x); }}>{x}</button>)}
          </div>
          {mineErr && <div className="banner err" style={{marginTop:16}}>{mineErr}</div>}

          {mine && mine.rows.length>0 &&
            <div style={{marginTop:20,borderTop:'1px solid var(--line)',paddingTop:6}}>
              {mine.rows.map(c=><ConnRow key={c.profile_url} c={c}/>)}
              <div className="meta" style={{marginTop:12}}>
                {mine.rows.length} of {(total||0).toLocaleString()} match. Five per search is the cap, so this is
                the best five rather than all of them.
              </div>
            </div>}

          {mine && mine.rows.length===0 &&
            <div style={{marginTop:20,borderTop:'1px solid var(--line)',paddingTop:16}}>
              <div className="h4">Nobody in your network matches that.</div>
              <div className="sub" style={{marginTop:6,maxWidth:'60ch'}}>
                Not one of your {(total||0).toLocaleString()} connections reads as
                {' '}{mine.terms.slice(0,3).join(' plus ')}. That is a real answer, and it beats five
                near-misses. Search LinkedIn for it instead.
              </div>
              <div className="row" style={{gap:10,marginTop:16,flexWrap:'wrap'}}>
                <button className="btn sm" onClick={()=>{ setWebOpen(true); setQ(mine.q); run(mine.q); }}>
                  Search LinkedIn for this
                </button>
              </div>
            </div>}

          <div className="meta" style={{marginTop:16,lineHeight:1.55}}>
            This matches words, not meaning: it will find Boston and investing, and it does not understand
            idea-stage. There is deliberately no browsable list of everyone you know, because that is a
            slower LinkedIn.
          </div>
        </F> : (
          <div style={{marginTop:18}}>
            <div className="sub" style={{maxWidth:'58ch'}}>
              Your LinkedIn archive has not been imported, so there is nothing of your own to search yet.
              It takes one upload and Mighty stops guessing.
            </div>
            <div className="row" style={{gap:10,marginTop:16,flexWrap:'wrap'}}>
              <button className="btn sm" onClick={()=>go({screen:'strategy'})}>Import my history</button>
            </div>
          </div>
        )}
      </div>

      {/* ---- 2. outside your network ---- */}
      <div className="card" style={{marginTop:16,padding:'24px 26px'}}>
        <div className="row" style={{justifyContent:'space-between',alignItems:'baseline',gap:14,flexWrap:'wrap'}}>
          <div className="h3">Someone not in your network</div>
          {!webOpen &&
            <button className="btn g sm" onClick={()=>setWebOpen(true)}>Search LinkedIn</button>}
        </div>
        <div className="sub" style={{marginTop:6,maxWidth:'62ch'}}>
          Mighty searches LinkedIn through the extension and can list up to five people per search.
          It cannot brief you on any of them until their profile has been opened once, because that is
          where the detail lives.
        </div>

        {webOpen && <F>
          <div style={{display:'flex',gap:12,marginTop:18,alignItems:'stretch',flexWrap:'wrap'}}>
            <input className="inp" style={{flex:'1 1 240px',minWidth:0}} value={q} placeholder={examples[0]}
              onChange={e=>setQ(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') run(); }}/>
            <button className="btn" style={{flex:'none',padding:'0 26px',borderRadius:'var(--rsm)'}}
              onClick={()=>run()} disabled={busy||!clean(q)}>
              {phase==='searching' ? <span><span className="spin"/> Searching</span>
                : phase==='thinking' ? <span><span className="spin"/> Reading</span> : 'Search'}
            </button>
          </div>

          {err && <div className="banner err" style={{marginTop:16}}>{err}</div>}
          {notice && <div className="banner warn" style={{marginTop:16}}>{notice}</div>}

          {noExt &&
            <div className="fade" style={{marginTop:16,paddingTop:16,borderTop:'1px solid var(--line)'}}>
              <div className="h4">Search isn't switched on for this account yet.</div>
              <div className="sub" style={{marginTop:7,lineHeight:1.55,maxWidth:560}}>
                Searching outside your network needs either the extension or the web-search backend.
                Browsing LinkedIn and saving from the extension panel works today.
              </div>
              <div className="row" style={{gap:10,marginTop:16,flexWrap:'wrap'}}>
                <button className="btn sm" onClick={()=>go({screen:'extension'})}>Set up the extension</button>
                <a className="btn g sm" href="https://www.linkedin.com/search/results/people/" target="_blank" rel="noopener noreferrer">
                  Open LinkedIn search
                </a>
              </div>
            </div>}

          {results.length>0 &&
            <div>
              <div className="row" style={{marginTop:22,alignItems:'baseline',justifyContent:'space-between',gap:16}}>
                <div className="h4">{visible.length} {visible.length===1?'person':'people'} for "{lastQuery}"</div>
                <div className="meta">Add now, decide later</div>
              </div>
              {phase==='thinking' &&
                <div className="meta" style={{marginTop:10}}><span className="spin"/> Working out why each of these matters to you…</div>}

              {visible.map(r=>{
                const savedRow = savedUrls[(r.profileUrl||'').toLowerCase()];
                const v = VERDICT[r.verdict]||VERDICT.potential;
                return (
                  <div key={r.profileUrl} className="fade" style={{marginTop:14,paddingTop:14,borderTop:'1px solid var(--line2)'}}>
                    <div style={{display:'flex',alignItems:'flex-start',gap:14,flexWrap:'wrap'}}>
                      <Avatar name={r.name}/>
                      <div style={{flex:'1 1 200px',minWidth:0}}>
                        <div style={{fontSize:17,fontWeight:700,letterSpacing:'-.015em'}}>{r.name}</div>
                        <div className="sub" style={{fontSize:14,marginTop:2}}>{r.title||'No headline on the profile'}</div>
                        {/* The search results page carries more than a headline. These are facts
                            read off it, not a judgement, so they show before any match reasoning
                            and stay visible whether or not the AI managed to explain anything. */}
                        {[r.location, r.education, r.followers && r.followers+' followers'].filter(Boolean).length>0 &&
                          <div className="meta" style={{marginTop:4}}>
                            {[r.location, r.education, r.followers && r.followers+' followers'].filter(Boolean).join(' · ')}
                          </div>}
                        <a href={r.profileUrl} target="_blank" rel="noopener noreferrer"
                          style={{fontSize:13,fontWeight:600,marginTop:4,display:'inline-block'}}>View on LinkedIn</a>
                      </div>
                      <div style={{display:'flex',gap:9,flex:'none'}}>
                        {savedRow
                          ? <button className="btn g sm" onClick={()=>onOpen(savedRow.id)}>Open profile</button>
                          : <F>
                              <button className="btn g sm" style={{color:'var(--sub)'}}
                                onClick={()=>setSkip(s=>({...s,[r.profileUrl]:true}))}>Skip</button>
                              <button className="btn sm" disabled={atCap || savingUrl===r.profileUrl}
                                onClick={async()=>{ setSaving(r.profileUrl); await onSave(r, lastQuery); setSaving(null); }}>
                                {savingUrl===r.profileUrl ? <span><span className="spin"/> Adding</span> : 'Add'}
                              </button>
                            </F>}
                      </div>
                    </div>
                    {r.why &&
                      <div className="why" style={{marginTop:14,padding:'14px 16px'}}>
                        <div className="eyebrow b">{v.label}</div>
                        <div style={{fontSize:14.5,lineHeight:1.55,color:'var(--body)',marginTop:6,textWrap:'pretty'}}>{r.why}</div>
                      </div>}
                    {r.common && r.common.length>0 &&
                      <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:12}}>
                        {r.common.map((c,i)=><span key={i} className="tag">{c}</span>)}
                      </div>}
                  </div>);
              })}

              {visible.length===0 &&
                <div className="meta" style={{marginTop:14}}>Nothing left in this batch. Try another description.</div>}
            </div>}
        </F>}
      </div>

      {/* ---- 3. the ranking nobody asked for ---- */}
      <div className="card" style={{marginTop:16,padding:'24px 26px'}}>
        <div className="row" style={{justifyContent:'space-between',alignItems:'baseline',gap:14,flexWrap:'wrap'}}>
          <div className="h3">People you should add</div>
          <span className="meta">{people.length} of {cap} added</span>
        </div>
        <div className="sub" style={{marginTop:6,maxWidth:'62ch'}}>
          From your own history, ranked against your goal. Three signals: how long you have been silent,
          whether their work matches what you are trying to do, and where you overlap.
        </div>

        {suggBusy &&
          <div className="meta" style={{marginTop:16}}><span className="spin"/> Reading your history…</div>}

        {!suggBusy && sugg && sugg.length>0 &&
          <div style={{marginTop:14,borderTop:'1px solid var(--line)',paddingTop:6}}>
            {sugg.map(c=><ConnRow key={c.profile_url} c={c}/>)}
          </div>}

        {!suggBusy && sugg && sugg.length===0 &&
          <div style={{marginTop:16}}>
            <div className="sub" style={{maxWidth:'60ch'}}>
              {total ? <F>Mighty has nothing to suggest yet. Nothing in your {total.toLocaleString()} connections
                lines up with your goal well enough to be worth interrupting you over, which usually means the
                goal is written too broadly to match on. Naming a role or a place in it changes this
                immediately.</F>
              : <F>There is nothing to rank until your LinkedIn history is imported.</F>}
            </div>
            <div className="row" style={{gap:10,marginTop:16,flexWrap:'wrap'}}>
              <button className="btn sm" onClick={()=>go({screen:'strategy'})}>
                {total ? 'Sharpen my goal' : 'Import my history'}
              </button>
            </div>
          </div>}
      </div>
    </div>
  );
}

/* ===================== Relationships ===================== */
function nextAction(r){
  switch(r.status){
    case 'prospect':         return (r.briefing&&r.briefing.careerSummary) ? 'Draft a message' : 'Prepare me';
    case 'ready_to_contact': return r.ai_draft ? 'Review draft' : 'Draft a message';
    case 'contacted':        return days(r.contacted_at)>=7 ? 'Follow up' : 'Waiting on them';
    case 'replied':          return 'Reply';
    case 'coffee_chat':      return 'Capture notes';
    case 'do_not_contact':   return ' - ';
    default:                 return 'Keep in touch';
  }
}
function Relationships({people, events, view, setView, onOpen, onStage, go}){

  const timeOK  = canSee('timeline', people, events);

  if(!people.length)
    return <div className="pad fade" style={{maxWidth:720}}>
      <Empty title="No one here yet."
        body="Everyone you save lands here, however you found them - search, the extension, a conference, a referral. Start with one person you genuinely want to know."
        cta="Discover someone" onCta={()=>go({screen:'discover'})}/>

  const feed = events.slice().sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at)).slice(0,60);

        </div>
        <div className="sub" style={{fontSize:14}}>{people.length} {people.length===1?'relationship':'relationships'}</div>
      </div>

      {view==='board' && !boardOK && <div className="hint" style={{marginTop:12}}>{UNLOCKS.board.hint}</div>}
      {view==='timeline' && !timeOK && <div className="hint" style={{marginTop:12}}>{UNLOCKS.timeline.hint}</div>}

      {(view==='list' || (view==='board'&&!boardOK) || (view==='timeline'&&!timeOK)) &&
        <div className="card" style={{marginTop:20,overflow:'hidden'}}>
          <div style={{display:'grid',gridTemplateColumns:'1.5fr 1fr .9fr 1fr',gap:20,padding:'14px 24px',
            borderBottom:'1px solid var(--line4)',background:'var(--card2)'}}>
            {['Person','Stage','Last activity','Next best action'].map(h=><div key={h} className="eyebrow">{h}</div>)}

          {people.map(r=>{
            const st = stageOf(r);
            return (
              <div key={r.id} onClick={()=>onOpen(r.id)} className="lift"

                <div className="row" style={{gap:12,minWidth:0}}>
                  <Avatar name={r.name} size={34}/>
                  <div style={{minWidth:0}}>
                    <div style={{fontSize:15.5,fontWeight:700,letterSpacing:'-.01em',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.name||'Unnamed'}</div>
                    <div style={{fontSize:13,color:'var(--mute)',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.title||(r.context||{}).whySaved||'Saved profile'}</div>
                  </div>
                </div>
                <div><span className="pill" style={{background:st.bg,color:st.fg}}>{st.label}</span></div>
                <div className="meta">{ago(r.updated_at||r.shortlisted_at)}</div>

      {view==='board' && boardOK &&
        <div style={{marginTop:20,display:'flex',gap:14,overflowX:'auto',paddingBottom:12}}>
          {COLUMNS.map(col=>{
            const items = people.filter(r=>col.statuses.indexOf(r.status)>=0);
            const meta = STAGE[col.statuses[0]];
            return (
              <div key={col.key} style={{width:250,flex:'none'}}
                onDragOver={e=>{ e.preventDefault(); setOver(col.key); }}
                onDragLeave={()=>setOver(o=>o===col.key?null:o)}
                onDrop={e=>{ e.preventDefault(); setOver(null);
                  if(dragId!=null) onStage(people.find(r=>r.id===dragId), col.statuses[0]); setDrag(null); }}>
                <div className="row" style={{gap:8,padding:'0 4px 10px'}}>
                  <span className="dot" style={{background:meta.dot}}/>
                  <span style={{fontSize:13,fontWeight:700}}>{col.label||meta.label}</span>
                  <span className="meta">{items.length}</span>
                </div>
                <div className={'stack'+(overCol===col.key?' drop':'')} style={{gap:10,minHeight:60}}>
                  {items.map(r=>(
                    <div key={r.id} className="colcard" draggable
                      onDragStart={()=>setDrag(r.id)} onDragEnd={()=>setDrag(null)}
                      onClick={()=>onOpen(r.id)}>
                      <div className="row" style={{gap:10}}>
                        <Avatar name={r.name} size={28}/>
                        <div style={{minWidth:0}}>
                          <div style={{fontSize:14.5,fontWeight:700,letterSpacing:'-.01em',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.name||'Unnamed'}</div>
                          <div style={{fontSize:12.5,color:'var(--mute)',marginTop:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.title||''}</div>
                        </div>
                      </div>
                      <div style={{fontSize:13,fontWeight:700,color:'var(--brand-ink)',marginTop:11}}>{nextAction(r)}</div>
                    </div>))}
                </div>
              </div>);
          })}
        </div>}

      {view==='timeline' && timeOK &&
        <div className="card" style={{marginTop:20,padding:'8px 26px 22px',maxWidth:720}}>
          {feed.map(e=>(
            <div key={e.id} style={{display:'grid',gridTemplateColumns:'78px 1fr',gap:18,padding:'16px 0',borderBottom:'1px solid var(--line2)'}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--mute)',paddingTop:1}}>{dateShort(e.occurred_at)}</div>
              <div>
                <div style={{fontSize:15,fontWeight:600,color:'var(--ink2)'}}>
                  {EVENT_LABEL[e.event_type]||e.event_type}
                  {e.event_type==='stage_change' && e.extracted && e.extracted.to
                    ? ' → '+(STAGE[e.extracted.to]||{label:e.extracted.to}).label : ''}
                </div>
                <div className="meta" style={{marginTop:2}}>{nameOf(e.log_id)}{e.note?' · '+e.note.slice(0,90):''}</div>
              </div>
            </div>))}
        </div>}
    </div>
  );
}

/* ===================== Profile ===================== */
const APPROACHES = [
  {id:'warm',      label:'Warm introduction', brief:'built around a shared connection'},
  {id:'curiosity', label:'Curiosity',         brief:'asks about something specific in their work'},
  {id:'shared',    label:'Shared experience', brief:'built on common background'},
  {id:'value',     label:'Value first',       brief:'offers something useful before asking'},
  {id:'coffee',    label:'Coffee chat',       brief:'a short, concrete request to talk'},
];
function Profile({sb, row, events, tasks, settings, people, onBack, onUpdate, onStage, onEvent, onTask, tab, setTab, go}){
  const ctx = row.context||{};
  /* An exchange is one outbound conversation: the brief, the draft, and every
     take of that draft. It costs one assist. When they reply, answering them is
     a new exchange and a new assist, because it is new work. The counter lives
     in context so it survives a reload and needs no schema change. */
  const exchangeNo = Math.max(1, Number(ctx.exchange || 1));
  const exchangeKey = 'ex:' + row.id + ':' + exchangeNo;
  const takes = Math.max(0, Number(ctx.takes || 0));
  const TAKE_LIMIT = 10;
  const takesLeft = Math.max(0, TAKE_LIMIT - takes);

  /* Has anyone actually read this person's profile?
     A search result is a name and a headline. A connection row out of the
     archive is a name, an employer and a date. Neither is enough to brief on,
     and briefing anyway produces the confident-sounding paragraph that makes
     people stop trusting a product. The extension fills these fields in the
     first time the profile is opened, so their presence is the evidence. */
  const profileRead = !!(clean(ctx.aboutText) || clean(ctx.education) || clean(ctx.location)
    || clean(ctx.skillsText) || (Array.isArray(ctx.timingSignals) && ctx.timingSignals.length));
  const br  = row.briefing||{};
  const st  = stageOf(row);
  const [busy,setBusy]   = useState(null);
  const [toast,setToast] = useState(null);
  const [err,setErr]     = useState(null);
  const [approach,setApproach] = useState('curiosity');
  const [draft,setDraft] = useState(row.ai_draft||'');
  const [noteS,setNoteS] = useState(''); const [noteC,setNoteC] = useState(''); const [noteP,setNoteP] = useState('');
  const [justReplied,setJustReplied] = useState(false);
  const mine = events.filter(e=>e.log_id===row.id);
  const memories = Array.isArray(ctx.memories)?ctx.memories:[];
  const myTasks = tasks.filter(t=>t.log_id===row.id && !t.done);

  useEffect(()=>{ setDraft(row.ai_draft||''); }, [row.id]);
  const flash = (m)=>{ setToast(m); setTimeout(()=>setToast(null), 2600); };

  /* Everything the extension read off the rendered profile, in one place so the
     brief and the draft cannot disagree about it. timingSignals matters most:
     "just moved into this role" changes what is worth writing more than any
     other single fact, and it exists nowhere else. */
  const captured = [
    ctx.skillsText && ('Skills listed: '+clean(ctx.skillsText).slice(0,300)),
    ctx.certificationsText && ('Certifications: '+clean(ctx.certificationsText).slice(0,200)),
    ctx.languagesText && ('Languages: '+clean(ctx.languagesText).slice(0,120)),
    (Array.isArray(ctx.timingSignals)&&ctx.timingSignals.length) && ('Timing: '+ctx.timingSignals.join('; ')),
  ].filter(Boolean).join('\n');

  async function makeBrief(){
    if(!profileRead){
      setErr('Mighty has not read this profile yet, so a brief would be guesswork dressed up as research. '
        + 'Open their LinkedIn profile once with the extension running, then come back.');
      return;
    }
    setBusy('brief'); setErr(null);
    try{
      const out = await llmJSON(sb, 'profile_briefing',
        'You prepare someone for a first conversation. Use ONLY the facts given - never invent employers, dates, achievements or posts. If you do not know something, leave that field out. Plain language, no scores, no flattery. Never use em dashes; write a spaced hyphen instead.',
        `About the person doing the outreach:\n${strategyBrief(settings)}\n\nThe person they want to understand:\nName: ${row.name||''}\nHeadline: ${row.title||''}\nCompany: ${row.company||''}\nLocation: ${ctx.location||'unknown'}\nEducation: ${ctx.education||'unknown'}\nProfile text captured: ${clean(ctx.aboutText||ctx.snippet||'').slice(0,900)}\n${captured||''}\nWhy they were saved: ${ctx.whySaved||'unknown'}\nShared ground noted at save time: ${(ctx.common||[]).join('; ')||'none noted'}\n\nReturn JSON {"careerSummary":"2-3 sentences","whyMatters":"1-2 sentences on why this person matters to THIS user's goal","shared":["real overlap"],"starters":["specific opening, grounded in the facts above"],"avoid":"one thing not to lead with, or omit"}`,
        1000, exchangeKey);
      const briefing = {...br, careerSummary:clean(out.careerSummary), whyMatters:clean(out.whyMatters),
        shared:Array.isArray(out.shared)?out.shared:[], conversationStarters:Array.isArray(out.starters)?out.starters:[],
        avoid:clean(out.avoid), builtAt:new Date().toISOString()};
      await onUpdate(row, {briefing});
      track('brief_built', {shared:(briefing.shared||[]).length, starters:(briefing.conversationStarters||[]).length});
      flash('Brief ready');
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(null);
  }

  /* Verbatim samples of how this user actually writes, from their own sent
     messages in the archive. Six is enough to establish a voice and few enough
     to keep the prompt honest about length. Without this, reading the message
     archive would be the fourth time in this codebase that data was fetched,
     parsed and then dropped at the last step. */
  const voice = (((settings.knowledge||{}).messages||{}).styleSamples||[]).slice(0, 6);

  async function makeDraft(){
    if(takesLeft <= 0){
      setErr('That is ten takes on this message, which is the limit on one assist. Send one of them, or edit '
        + 'the last one yourself - at this point the drafts are not getting better, they are getting different.');
      return;
    }
    setBusy('draft'); setErr(null);
    const a = APPROACHES.find(x=>x.id===approach)||APPROACHES[1];
    try{
      const out = await llmJSON(sb, 'draft_message',
        "You write a real first outreach message for a professional. Ground it ONLY in the given context - never invent shared history, mutual friends, articles or events. Sound like a person, not a template. No flattery, no buzzwords, no 'I hope this finds you well'. Under 110 words. Ask for one specific, easy thing. Never use em dashes; write a spaced hyphen instead.",
        `The sender:\n${strategyBrief(settings)}\n\nThe recipient:\nName: ${row.name||''}\nHeadline: ${row.title||''}\nCompany: ${row.company||''}\nWhy the sender saved them: ${ctx.whySaved||'unknown'}\nShared ground: ${((br.shared&&br.shared.length?br.shared:ctx.common)||[]).join('; ')||'none confirmed'}\nBrief: ${br.careerSummary||'none'}\nThings the sender has learned about them: ${memories.map(m=>m.value).join('; ')||'nothing captured yet'}\n${captured||''}\n\nApproach: ${a.label} - ${a.brief}.${voice.length ? '\n\nHOW THIS SENDER ACTUALLY WRITES. These are verbatim messages they have sent before. Match their rhythm, sentence length, level of formality and habits of greeting and sign-off. Do not copy phrases from them and do not reuse their content:\n' + voice.map((v,i)=>(i+1)+'. '+v).join('\n') : ''}\n\nReturn JSON {"subject":"short subject line for email use","message":"the message body"}`,
        800, exchangeKey);
      setDraft(clean(out.message));
      await onUpdate(row, {ai_draft:clean(out.message),
        status: row.status==='prospect'?'ready_to_contact':row.status,
        context: {...ctx, exchange: exchangeNo, takes: takes + 1}});
      track('draft_written', {approach, had_brief: !!br.careerSummary, memories: memories.length,
        take: takes + 1, exchange: exchangeNo});
      flash(takes === 0 ? 'Draft written. One assist covers all ten takes.'
                        : 'Take ' + (takes+1) + ' of ' + TAKE_LIMIT + '. Same assist.');
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(null);
  }

  async function copyAndOpen(){
    try{ await navigator.clipboard.writeText(draft); }catch(e){}
    window.open(row.profile_url, '_blank', 'noopener');
    if(row.status!=='contacted' && REACHED.indexOf(row.status)<0){
      await onStage(row, 'contacted');
      await onEvent(row, 'first_message', draft.slice(0,400));
    }
    track('draft_copied', {stage: row.status});
    flash('Copied. Paste it, read it once more, then click Send yourself.');
  }

  async function saveCapture(){
    const text = [noteS && noteS, noteC && ('Promises: '+noteC), noteP && ('Worth remembering: '+noteP)]
      .filter(Boolean).join('\n');
    if(!clean(text)) return;
    setBusy('note'); setErr(null);
    try{
      await onEvent(row, 'note', text);
      // Extract memories and promises so capture pays off later. Best effort:
      // a failed extraction must never lose the user's words.
      try{
        const out = await llmJSON(sb, 'coffee_extract',
          'You turn a short note about a professional conversation into structured memory. Extract only what the note actually says. No inference beyond the text.',
          `Note about a conversation with ${row.name||'them'}:\n${text}\n\nReturn JSON {"memories":[{"type":"interest"|"personal"|"fact"|"preference"|"event"|"context"|"shared","value":"short phrase"}],"promises":["something the user owes them"],"followUpDays":number}`,
          800);
        const add = (Array.isArray(out.memories)?out.memories:[]).filter(m=>m&&clean(m.value)).map(m=>({
          id:'m'+Math.random().toString(36).slice(2,9)+Date.now().toString(36),
          type:m.type||'personal', value:clean(m.value), confidence:0.8, status:'confirmed',
          sourceLabel:'Your notes', sourceKind:'user', createdAt:Date.now(), updatedAt:Date.now()}));
        if(add.length) await onUpdate(row, {context:{...ctx, memories:memories.concat(add)}});
        const promises = (Array.isArray(out.promises)?out.promises:[]).filter(Boolean).slice(0,3);
        const dueDays = Number(out.followUpDays)>0 ? Number(out.followUpDays) : 7;
        for(const p of promises)
          await onTask({label:clean(p), sub:'You promised '+(row.name||'them'), log_id:row.id,
            due_date:new Date(Date.now()+dueDays*DAY).toISOString().slice(0,10)});
      }catch(e){}
      track('capture_saved', {after_reply: justReplied, fields:[noteS,noteC,noteP].filter(x=>clean(x)).length});
      setNoteS(''); setNoteC(''); setNoteP('');
      setJustReplied(false);
      flash('Captured');
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(null);
  }

  /* The reply signal. Two things happen and only the first one is required:
     the stage moves and a real 'reply' event lands, which is what Today,
     buildPlan and every later pattern read. Then capture is offered, because
     a reply just arrived is the one moment the words are still to hand. If she
     ignores the capture the signal is already saved - never make the cheap,
     valuable half wait on the expensive, optional half. */
  async function markReplied(){
    setBusy('reply'); setErr(null);
    try{
      await onEvent(row, 'reply', null);
      if(row.status!=='replied') await onStage(row, 'replied');
      /* Their answer starts a new exchange: writing back is new work, so the
         take counter resets and the next draft costs a fresh assist. The event
         is written first, above, so a failure here cannot lose the signal. */
      await onUpdate(row, {context: {...ctx, exchange: exchangeNo + 1, takes: 0}});
      track('reply_logged', {days_since_sent: Math.max(0, Math.round(days(row.contacted_at)||0)),
        exchange: exchangeNo + 1});
      setJustReplied(true);
      setTab('notes');
      flash('Logged. What did they say?');
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(null);
  }

  const TABS = [['overview','Overview'],['brief','AI Brief'],['draft','Draft message'],['timeline','Timeline'],['notes','Notes']];
  const nextStage = ORDER[Math.min(ORDER.indexOf(row.status)+1, ORDER.length-1)];
  /* Only asked once a message has actually gone out, and only until they answer. */
  const askedReplied = row.status==='contacted';

  return (
    <div className="pad fade" style={{maxWidth:820,paddingTop:28}}>
      <button className="btn q" style={{padding:'6px 0',display:'flex',alignItems:'center',gap:7}} onClick={onBack}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
        <span>Relationships</span>
      </button>

      <div style={{marginTop:18,display:'flex',alignItems:'flex-start',gap:16,flexWrap:'wrap'}}>
        <Avatar name={row.name} size={52}/>
        <div style={{flex:'1 1 200px',minWidth:0}}>
          <h2 className="h2">{row.name||'Unnamed'}</h2>
          <div className="sub" style={{marginTop:2}}>{row.title||'No headline captured'}</div>
        </div>
        <span className="pill" style={{background:st.bg,color:st.fg,padding:'7px 15px',fontSize:13}}>{st.label}</span>
      </div>

      <div className="row" style={{marginTop:18,gap:10,flexWrap:'wrap'}}>
        <button className="btn sm" onClick={()=>setTab('draft')}>Draft a message</button>
        {/* Does not offer to prepare a brief it cannot write. When the profile
            has never been read this takes you to the tab that explains why,
            rather than firing a request that fails. */}
        <button className="btn g sm"
          onClick={()=>{ setTab('brief'); if(profileRead && !br.careerSummary) makeBrief(); }}>
          {busy==='brief' ? <span><span className="spin"/> Preparing</span>
            : profileRead ? 'Prepare me' : 'Why no brief yet'}
        </button>
        <a className="btn g sm" href={row.profile_url} target="_blank" rel="noopener noreferrer">LinkedIn</a>
        {row.status!=='offer' && row.status!=='do_not_contact' &&
          <button className="btn g sm" onClick={()=>onStage(row, nextStage)}>
            Move to {(STAGE[nextStage]||{}).label}
          </button>}
        {toast && <span style={{fontSize:13.5,fontWeight:600,color:'var(--green)'}}>{toast}</span>}
      </div>
      {err && <div className="banner err" style={{marginTop:14}}>{err}</div>}

      {askedReplied &&
        <div className="card" style={{marginTop:16,padding:'16px 20px',display:'flex',gap:14,
             alignItems:'center',flexWrap:'wrap',background:'var(--brand-soft)',borderColor:'var(--brand-line)'}}>
          <div style={{flex:'1 1 260px',minWidth:0}}>
            <div style={{fontSize:15,fontWeight:700,color:'var(--ink)'}}>Did they reply?</div>
            <div className="sub" style={{fontSize:13.5,marginTop:2}}>
              You wrote to them {ago(row.contacted_at)||'recently'}. Telling Mighty is how it learns what works.
            </div>
          </div>
          <button className="btn sm" onClick={markReplied} disabled={busy==='reply'}>
            {busy==='reply' ? <span><span className="spin"/> Saving</span> : 'They replied'}

/* ===================== Ask Mighty ===================== */
function Ask({sb, people, events, tasks, settings, onOpen}){
  const [q,setQ] = useState('');
  const [log,setLog] = useState([]);
  const [busy,setBusy] = useState(false);
  const PROMPTS = ['Who should I reach out to today?','Who have I forgotten?',
    'Which follow-ups are due?','Who is worth a coffee chat?'];

  function digest(){
    const byLog = {};
    events.forEach(e=>{ (byLog[e.log_id]=byLog[e.log_id]||[]).push(e); });
    return people.slice(0,60).map((r,i)=>{
      const ev = byLog[r.id]||[];
      const last = ev.length?ev[ev.length-1]:null;
      const mem = (Array.isArray((r.context||{}).memories)?r.context.memories:[]).map(m=>m.value).slice(0,4);
      return [
        `${i+1}. ${r.name||'Unnamed'} - ${r.title||'no headline'}${r.company?' at '+r.company:''}`,
        `   stage: ${stageOf(r).label}; saved ${ago(r.shortlisted_at)||'recently'}${r.contacted_at?'; contacted '+ago(r.contacted_at):''}`,
        `   why saved: ${(r.context||{}).whySaved || 'not recorded'}`,
        last ? `   last activity: ${EVENT_LABEL[last.event_type]||last.event_type} ${ago(last.occurred_at)}` : '   last activity: nothing yet',
        mem.length ? `   things learned: ${mem.join('; ')}` : '',
      ].filter(Boolean).join('\n');
    }).join('\n');
  }

  async function run(text){
    const question = clean(text!=null?text:q);
    if(!question || busy) return;
    setQ(''); setBusy(true);
    const entry = {q:question, a:null, people:[]};
    setLog(l=>l.concat([entry]));
    const settle = (a, ppl)=>setLog(l=>l.map(x=>x===entry?{...x, a, people:ppl||[]}:x));

    if(!people.length){
      settle("I don't know yet - there's nobody in your network here. Save a few relationships and I'll start recognizing patterns: who has gone quiet, who to reach out to, who to prepare for.");
      setBusy(false); return;
    }
    try{
      const openTasks = tasks.filter(t=>!t.done).map(t=>`- ${t.label}${t.due_date?' (due '+t.due_date+')':''}`).join('\n');
      const out = await llmJSON(sb, 'network_search',
        "You are the user's relationship strategist. Answer ONLY from the network data provided. Never invent people, facts or events. If the data cannot answer the question, say so plainly and say what would make it answerable. Be specific and brief - 2 to 4 sentences. Refer to people by name. Never suggest sending anything automatically; the user always writes and sends. Never use em dashes; write a spaced hyphen instead.",
        `The user's strategy:\n${strategyBrief(settings)}\n\nToday: ${new Date().toDateString()}\n\nTheir network (${people.length} people):\n${digest()}\n\nOpen commitments:\n${openTasks||'(none)'}\n\nQuestion: ${question}\n\nReturn JSON {"answer":"your answer","people":[{"n":number,"note":"why you named them","action":"the next best action, 2-4 words"}]}. Include people only when naming them helps; at most 5.`,
        1100);
      const refs = (Array.isArray(out.people)?out.people:[]).map(p=>{
        const r = people[Number(p.n)-1];
        return r ? {row:r, note:clean(p.note), action:clean(p.action)} : null;
      }).filter(Boolean);
      settle(clean(out.answer) || "I could not put that into words. Try asking it another way.", refs);
    }catch(e){
      settle('I could not answer that just now: ' + (e.message||String(e)));
    }
    setBusy(false);
  }

  return (
    <div className="pad fade" style={{maxWidth:780,display:'flex',flexDirection:'column',minHeight:'calc(100vh - 66px)',paddingBottom:24}}>
      {log.length===0 &&
        <div>
          <h2 className="h2">Ask anything about your network.</h2>
          <div className="sub" style={{marginTop:6}}>Every answer uses what you've captured about your relationships. Nothing else.</div>
          {people.length===0 &&
            <div className="banner warn" style={{marginTop:20}}>
              There's nobody here yet, so there's nothing honest to answer from. Save a few people first.
            </div>}
        </div>}

      <div className="stack" style={{flex:1,gap:26,marginTop:26}}>
        {log.map((m,i)=>(
          <div key={i} className="fade">
            <div style={{fontSize:18,fontWeight:700,letterSpacing:'-.015em',textWrap:'pretty'}}>{m.q}</div>
            <div className="card" style={{marginTop:12,padding:'20px 22px'}}>
              {m.a===null
                ? <div className="sub"><span className="spin"/> Reading your network…</div>
                : <div style={{fontSize:15.5,lineHeight:1.6,color:'var(--ink2)',textWrap:'pretty'}}>{m.a}</div>}
              {m.people && m.people.length>0 &&
                <div className="stack" style={{gap:2,marginTop:14}}>
                  {m.people.map((p,j)=>(
                    <div key={j} onClick={()=>onOpen(p.row.id)} className="row"
                      style={{gap:13,padding:'11px 0',borderTop:'1px solid var(--line4)',cursor:'pointer'}}>
                      <Avatar name={p.row.name} size={32}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:14.5,fontWeight:700}}>{p.row.name||'Unnamed'}</div>
                        <div className="sub" style={{fontSize:13}}>{p.note}</div>
                      </div>
                      <span style={{fontSize:13.5,fontWeight:700,color:'var(--brand-ink)',flex:'none'}}>{p.action}</span>
                    </div>))}
                </div>}
            </div>
          </div>))}
      </div>

      <div style={{position:'sticky',bottom:0,padding:'20px 0 4px',
        background:'linear-gradient(180deg,rgba(250,249,247,0) 0%,#FAF9F7 26%)'}}>
        <div style={{display:'flex',gap:10}}>
          <input className="inp" style={{flex:1,minWidth:0,background:'#fff'}} value={q}
            placeholder="Who should I reconnect with?"
            onChange={e=>setQ(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') run(); }}/>
          <button className="btn" style={{flex:'none',padding:'0 24px',borderRadius:'var(--rsm)'}}
            onClick={()=>run()} disabled={busy||!clean(q)}>Ask</button>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:12}}>
          {PROMPTS.map(p=><button key={p} className="chip" onClick={()=>run(p)} disabled={busy}>{p}</button>)}
        </div>
      </div>
    </div>
  );
}

/* ===================== auth ===================== */
function Gate({sb}){
  const [mode,setMode] = useState('in');
  const [email,setEmail] = useState(''); const [pw,setPw] = useState('');
  const [busy,setBusy] = useState(false); const [msg,setMsg] = useState(null); const [err,setErr] = useState(null);
  async function go(){
    setErr(null); setMsg(null);
    /* Signup is open. The MIT check that used to live here was browser-side
       only, so it excluded the founders, recruiters and investors this is for
       while stopping nobody who opened devtools. Abuse is handled where it
       actually costs money instead: assists are granted only once a LinkedIn
       profile is claimed, and a profile can be claimed by one account. */
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(clean(email))){ setErr('That does not look like an email address.'); return; }
    setBusy(true);
    try{
      if(mode==='up'){
        const {error} = await sb.auth.signUp({email:clean(email), password:pw});
        if(error) throw error;
        setMsg('Account created. Check your inbox for the confirmation link, then sign in.'); setMode('in');
      } else if(mode==='in'){
        const {error} = await sb.auth.signInWithPassword({email:clean(email), password:pw});
        if(error) throw error;
      } else {
        const {error} = await sb.auth.resetPasswordForEmail(clean(email), {redirectTo:location.href});
        if(error) throw error; setMsg('Password reset link sent.');
      }
    }catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{width:'100%',maxWidth:400}}>
        <div className="row" style={{gap:10,marginBottom:26}}>
          <Logo/><span style={{fontSize:20,fontWeight:700,letterSpacing:'-.02em'}}>Mighty</span>
        </div>
        <h2 className="h2">{mode==='up'?'Create your account':mode==='in'?'Welcome back':'Reset your password'}</h2>
        <div className="sub" style={{marginTop:6}}>The operating system for professional relationships.</div>
        <div className="card" style={{marginTop:22,padding:'22px 24px'}}>
          <div className="lbl">Email</div>
          <input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)}
            placeholder="you@work.com" autoComplete="email"/>
          {mode!=='reset' &&
            <div style={{marginTop:14}}>
              <div className="lbl">Password</div>
              <input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter') go(); }}
                autoComplete={mode==='up'?'new-password':'current-password'}/>
            </div>}
          {err && <div className="banner err" style={{marginTop:14}}>{err}</div>}
          {msg && <div className="banner ok" style={{marginTop:14}}>{msg}</div>}
          <button className="btn" style={{width:'100%',marginTop:18}} onClick={go} disabled={busy}>
            {busy?<span><span className="spin"/> Working…</span>:mode==='up'?'Create account':mode==='in'?'Sign in':'Send reset link'}
          </button>
          <div className="row" style={{justifyContent:'space-between',marginTop:14}}>
            <button className="btn q" style={{fontSize:13.5,padding:0}}
              onClick={()=>{ setMode(mode==='in'?'up':'in'); setErr(null); setMsg(null); }}>
              {mode==='in'?'Create an account':'I already have an account'}
            </button>
            {mode!=='reset' &&
              <button className="btn q" style={{fontSize:13.5,padding:0}} onClick={()=>{ setMode('reset'); setErr(null); }}>Forgot password</button>}
          </div>
        </div>
      </div>
    </div>
  );
}
