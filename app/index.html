     Mighty v2 - the relationship operating system.
     Governed by docs/PRODUCT-BIBLE-v2.md. Visual spec: the Claude Design
     bundle (app-redesign-with-new-principles).

     Navigation is the user's questions, not features:
       Today - what deserves my attention?
       Relationships - where am I with everyone, and who is worth adding?
       You - how does this work for me? (Mirror, Patterns, Goal, Account)
       Ask Mighty - what should I do?

     Permanent rules enforced here:
       · You always click Send. Nothing is ever sent automatically.
       · Explain before you score - no numeric match scores in the UI.
       · Save is the only way a person enters Mighty; 'prospect' IS Saved.
       · Navigation is always visible; only depth unlocks, on data not time.
       · Never "Mighty knows" - always "Things you have learned".
       · No empty dashboards: every panel hides until it has real data.

     Same Supabase project, tables and settings keys as app/v1.html, so both
     apps read and write one account.

    --muted #B3ADBF, --line #38313F, --surface #1C1822, --raised #25202D,
    --action #6747D9). card/line stay translucent-white overlays rather
    than switching to the site's solid surface/raised hexes - they compose
    over dozens of different backgrounds across this file, and translucent
    overlays already read correctly on the new, more purple-tinted --paper
    with no per-component changes needed. */
 --paper:#121017; --rail:#1C1822; --card:rgba(255,255,255,.04); --card2:rgba(255,255,255,.03);
 --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.06); --line3:rgba(255,255,255,.08); --line4:rgba(255,255,255,.06);
 --ink:#F5F1FB; --ink2:#EDE7F8; --body:#C9C2DA; --sub:#B3ADBF; --mute:#8A849C; --mute2:#948EA6;
 --brand:#B4A4FF; --brand-h:#C9BDFF; --brand-ink:#B4A4FF;
 --brand-soft:rgba(180,164,255,.12); --brand-soft2:rgba(180,164,255,.18); --brand-line:rgba(180,164,255,.35); --brand-nav:rgba(180,164,255,.15);
 --peach:#E87A56;
 --green:#4EDEA3; --green2:#4EDEA3; --green-soft:rgba(78,222,163,.12);
 --amber:#E0BE63; --amber-soft:rgba(224,190,99,.12); --amber-dot:#E0BE63;
 --red:#FFB4AB; --red-soft:rgba(255,180,171,.12);
 --inp-bg:rgba(0,0,0,.25); --inp-border:rgba(255,255,255,.12);
 --f:Schibsted,Arial,sans-serif;
 --f-head:Schibsted,Arial,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
 --r:8px; --rsm:6px; --pill:4px; --sh:0 4px 24px rgba(0,0,0,.35);
  }
  /* Light is the pre-Prism design exactly as it was, recovered from the commit
     before the Phase 1 token swap (8750508~1) rather than redesigned - every
     value here is what :root used to hold. Same token names as the dark block
     above by construction, so every var(--x) reference in the file repaints
     with zero logic change, same as the original Prism swap did in reverse.
     Typeface is deliberately NOT reverted to Schibsted Grotesk: that font's
     stylesheet link was removed when Prism landed, and a theme toggle
     changing colors AND swapping in a fourth font family is a bigger, more
     jarring switch than "light or dark" should be - Sora/Hanken/JetBrains
     stay the type system for both. */
  :root[data-theme="light"]{
 color-scheme:light;
 --paper:#FBFAF8; --rail:#FFFFFF; --card:#FFFFFF; --card2:#FBFAF8;
 --line:#ECEAE4; --line2:#F1EFE9; --line3:#EFEDE7; --line4:#F1EFE9;
 --ink:#1D1B26; --ink2:#2A2833; --body:#33313D; --sub:#8A8896; --mute:#B4B1BC; --mute2:#A39FA8;
 --brand:#5B4FE9; --brand-h:#4A3FD1; --brand-ink:#4A3FD1;
 --brand-soft:#F5F3FD; --brand-soft2:#EFEDFD; --brand-line:#E4E0F7; --brand-nav:#EFEDFD;
 --peach:#E87A56;
 --green:#2E8B5F; --green2:#2E8B5F; --green-soft:#E6F4EC;
 --amber:#B0641F; --amber-soft:#FBF1E2; --amber-dot:#E3A23C;
 --red:#C75B33; --red-soft:#FBEFE9;
 --inp-bg:#FFFFFF; --inp-border:var(--line);
 --r:16px; --rsm:14px; --pill:999px; --sh:0 1px 3px rgba(29,27,38,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
  a{color:var(--brand-ink);text-decoration:none}
  a:hover{color:var(--brand-h)}
  button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
  input,textarea,select{font-family:inherit;color:inherit}
  input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}
  ::selection{background:rgba(208,188,255,.28)}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#3A3842;border-radius:99px;border:3px solid var(--paper)}
  ::-webkit-scrollbar-track{background:transparent}

  .h1{font-family:var(--f-head);font-size:32px;font-weight:700;letter-spacing:-.03em;text-wrap:pretty;margin:0}
  .h2{font-family:var(--f-head);font-size:26px;font-weight:700;letter-spacing:-.03em;text-wrap:pretty;margin:0}
  .h3{font-family:var(--f-head);font-size:19px;font-weight:600;letter-spacing:-.02em}
  .h4{font-family:var(--f-head);font-size:16px;font-weight:600;letter-spacing:-.01em}
  .eyebrow{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--sub)}
  .eyebrow.b{color:var(--peach)}
  .sub{font-size:15px;color:var(--sub)}
  .meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--mute2)}
  .pad{padding:40px 48px 90px}

  /* "Refractive Cards" (DESIGN.md Level 1): translucent white over the
     obsidian ground, blurred so whatever sits behind still reads through it,
     with a hairline border rather than a shadow doing the separating. */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .why{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:12px}

  /* "Spectral Buttons": the primary action is the violet-to-cyan flow, and a
     hover brightens the gradient rather than swapping to a flat darker fill -
     the one rule DESIGN.md is explicit about ("increase luminance, don't
     change the color"). rounded-md per spec: sharp small-radius rectangles,
     not the pill shape the cream theme used. */
  .btn{padding:11px 20px;border-radius:var(--pill);background:linear-gradient(90deg,var(--brand),var(--peach));color:#0B0620;font-size:14.5px;font-weight:700;transition:filter .15s;white-space:nowrap}
  .btn:hover:not(:disabled){filter:brightness(1.15)}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn.g{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
  .btn.g:hover:not(:disabled){border-color:var(--brand-line);color:var(--brand-ink);background:transparent}
  .btn.sm{padding:9px 17px;font-size:14px}
  .btn.xs{padding:7px 14px;font-size:13px}
  .btn.q{background:none;color:var(--sub);font-weight:600;padding:12px 8px}
  /* Restating the background is not redundant: .btn:hover above matches these
     too and would otherwise paint a brand-coloured pill behind what is meant to
     read as plain text. .btn.g:hover does the same thing for the same reason. */
  .btn.q:hover:not(:disabled){color:var(--ink);background:rgba(255,255,255,.05)}
  .btn.soft{background:rgba(255,255,255,.06);color:var(--body);font-weight:600}
  .btn.soft:hover{background:rgba(255,255,255,.09)}

  /* "Intelligence Inputs": no filled background, a hairline that glows cyan
     on focus rather than a border that just changes colour. */
  .inp{width:100%;padding:14px 16px;border-radius:var(--rsm);border:1px solid var(--inp-border);background:var(--inp-bg);color:var(--ink);font-size:15.5px}
  .inp:focus{background:rgba(0,0,0,.35);border-color:var(--peach);box-shadow:0 0 0 3px rgba(76,215,246,.15)}
  .inp::placeholder{color:var(--mute)}
  textarea.inp{min-height:74px;resize:vertical;line-height:1.55;padding:13px 15px;border-radius:8px;font-size:15px}
  .lbl{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin-bottom:8px}

  /* "Monospace Chips": low-profile dark chips with mono text and a thin
     border - used everywhere the old cream theme used a soft lavender pill. */
  .chip{font-family:var(--f-mono);padding:7px 14px;border-radius:var(--pill);border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12.5px;letter-spacing:.03em;color:var(--body);font-weight:500;white-space:nowrap}
  .chip:hover:not(:disabled){border-color:var(--brand-line);color:var(--brand-ink)}
  .chip.on{background:var(--brand-soft2);border-color:var(--brand-line);color:var(--brand-ink);font-weight:700}
  .tag{font-family:var(--f-mono);padding:5px 11px;border-radius:var(--pill);background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:11px;letter-spacing:.03em;color:var(--body);font-weight:500;white-space:nowrap}
  .tagx{display:inline-flex;align-items:center;gap:7px;padding:6px 8px 6px 13px;border-radius:var(--pill);background:var(--brand-soft2);color:var(--brand-ink);font-size:13px;font-weight:600}
  .tagx button{color:var(--brand-ink);font-size:15px;line-height:1;padding:0 4px;opacity:.7}
  .tagx button:hover{opacity:1}
  .seg{display:flex;gap:3px;padding:3px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;width:fit-content}
  .seg button{padding:8px 16px;border-radius:5px;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap}
  .seg button.on{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none}

  .av{border-radius:50%;background:linear-gradient(135deg,var(--peach),var(--brand));color:#0B0620;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-family:var(--f-mono)}
  .pill{display:inline-block;font-family:var(--f-mono);padding:4px 11px;border-radius:var(--pill);font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
  /* Status LEDs (DESIGN.md "Glow States"): a coloured dot with a matching
     bloom, not a flat circle - .dot's own box-shadow is set per-instance
     from the same colour already passed in as background, everywhere it's
     used, so no other rule needs to change for this. */
  .dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
  .row{display:flex;align-items:center;gap:16px}
  .stack{display:flex;flex-direction:column}
  .tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs button{padding:11px 0;font-size:14.5px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--brand-ink);font-weight:700}

  .spin{width:15px;height:15px;border:2px solid rgba(208,188,255,.25);border-top-color:var(--brand-ink);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .fade{animation:fi .22s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .banner{border-radius:8px;padding:13px 16px;font-size:14px;font-weight:500;line-height:1.5}
  .banner.warn{background:var(--amber-soft);color:var(--amber);border:1px solid rgba(224,190,99,.3)}
  .banner.err{background:var(--red-soft);color:var(--red);border:1px solid rgba(255,180,171,.3)}
  .banner.ok{background:var(--green-soft);color:var(--green);border:1px solid rgba(78,222,163,.3)}
  /* Neutral: nothing is wrong, there is just nothing here yet. warn/err/ok
     were the only three banner tones, which meant every plain empty state
     had to borrow the amber "something needs attention" color whether or
     not anything actually did. */
  .banner.info{background:var(--card2);color:var(--sub);border:1px solid var(--line)}
  .hint{font-size:13px;color:var(--mute2);line-height:1.5}
  .lift:hover{background:var(--card2)}
  /* Today's cards carry a status-tinted background (see TONE_BG), which as an
     inline style outranks .lift:hover's plain background swap - this keeps a
     hover cue (a lift + soft shadow, neither set inline) instead of losing it. */
  .todaycard{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .todaycard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4);border-color:rgba(255,255,255,.14)}
  .colcard{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--rsm);padding:15px 16px;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .colcard:hover{border-color:var(--brand-line);transform:translateY(-2px);box-shadow:0 8px 24px rgba(160,120,255,.14)}
  .drop{outline:2px dashed var(--brand-line);outline-offset:-4px;border-radius:12px}

  @media (max-width:900px){
    .h1{font-size:26px} .h2{font-size:22px}
    .pad{padding:26px 20px 90px!important}
    /* the rail carries an inline display:flex, so this needs to win */
    .railwrap{display:none!important}
    .mobnav{display:flex!important}
    .hdr{padding:14px 20px!important}
    .hdr h1{font-size:17px!important}
  }
  .mobnav{display:none}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script>
  // Classic JSX runtime - the automatic runtime emits an ES import that fails without a bundler.
  Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] });
</script>
<script type="text/babel" data-presets="react-classic">
const {useState, useEffect, useRef, useMemo} = React;
const F = React.Fragment;

/* ===================== platform config (same project as app/v1.html) ===================== */
const SUPABASE_URL      = 'https://hplyyywdftnvjajyncvj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_e_oCwuz3Qlko5N3Xl8ZwxA_zQijz_u8';


/* Primary-goal vocabulary is v1's goalType enum so both apps score alike. */
const GOALS = [
  {id:'job_search',    label:'Find a new job',         hint:'Hiring managers, alumni, people already in the role'},
  {id:'raise_funding', label:'Raise investment',       hint:'Investors, angels, founders who have raised'},
  {id:'sales',         label:'Find customers',         hint:'Buyers, executives, decision makers'},
  {id:'mentors',       label:'Find mentors & advisors', hint:'Operators and experts a step ahead of you'},
  {id:'networking',    label:'Build my network',       hint:'Broad, deliberate, long-term relationships'},
];
const GOAL_LABEL = GOALS.reduce((a,g)=>{a[g.id]=g.label;return a;},{});
/* One goal can now be several. goalTypes is the source of truth when it
   exists; goalType (singular) survives on old accounts that saved before
   this changed. */
const goalTypeList = (st)=>{
  const s = st||{};
  return (s.goalTypes&&s.goalTypes.length) ? s.goalTypes : (s.goalType ? [s.goalType] : []);
};
const goalLine = (st)=>{
  const s = st||{};
  if(clean(s.goal)) return s.goal;
  const labels = goalTypeList(s).map(t=>GOAL_LABEL[t]).filter(Boolean);
  return labels.join(' and ') || 'Build your network';
};
/* A two-or-three-word version of the goal, for the one place a full sentence
   would not fit - "One step closer to funding," not "...to Raise a seed
   round for an AI-native venture studio, from investors who..." */
const GOAL_SHORT = {job_search:'a new job', raise_funding:'funding', sales:'new customers',
  mentors:'the right mentors', networking:'a stronger network'};
const goalShort = (st)=> GOAL_SHORT[goalTypeList(st)[0]] || 'your goal';
/* What to call a saved person, in the goal's own words - "12 investors" says
   more than "12 people" the moment the goal is raising money. */
const GOAL_NOUN = {job_search:'contacts', raise_funding:'investors', sales:'prospects',
  mentors:'mentors', networking:'people'};
const goalNoun = (st)=> GOAL_NOUN[goalTypeList(st)[0]] || 'people';

/* Everything above this line (goalTypeList, goalLine, StrategyForm/View, Today's
   GoalStrip, the app-gating hasIntent check, and every Patterns card) is about
   the ONE primary goal and stays exactly as it was - none of that changes
   shape, and none of it needs to know secondary goals exist. Secondary goals
   are a strictly additive list, same storage idiom Rooms and Organiser Hub
   already use (settings.knowledge.<key>, read-modify-write through
   onSaveSettings), so a user with zero of them sees literally the same app.
   Each one only widens what strategyBrief() tells the AI - "also relevant to
   this person" - which is the actual value: better search ranking and better
   drafts when someone fits more than one of your goals at once. */
const secondaryGoals = (st)=> ((st && st.knowledge && st.knowledge.goals) || []);

/* The funnel a goal actually moves through, in real counts only - never a
   fabricated "68% there," which nothing here can honestly know. Do-not-contact
   is excluded throughout: someone you closed out is not still in play toward
   anything. */
function goalFunnel(people){
  const active = people.filter(r=>r.status!=='do_not_contact');
  return {
    saved:     active.length,
    reachedOut:active.filter(r=>REACHED.includes(r.status)).length,
    talking:   active.filter(r=>['replied','coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length,
    advanced:  active.filter(r=>['referral','interview','offer'].indexOf(r.status)>=0).length,
  };
}

/* outreach_log.status is the ONE stage field. 'prospect' IS Saved.
   bg/fg are supplied as a pair for a filled, opaque pill, so a light-cream
   bg with dark-ink fg was never actually unreadable the way Today's hero or
   the Goal chips were - both colours travelled together. What it was is
   wrong for Prism: a bright opaque pill sitting on an obsidian glass card
   reads as a mistake, not a colour choice. These are translucent-on-dark
   "Monospace Chip" pairs instead, one per semantic family (neutral / brand
   / waiting-amber / active-green), matching how every other status pill in
   the app has been restyled. */
const STAGE = {
  prospect:        {label:'Saved',              bg:'rgba(255,255,255,.06)', fg:'var(--sub)', dot:'var(--mute)'},
  ready_to_contact:{label:'Ready to reach out', bg:'var(--brand-soft2)', fg:'var(--brand-ink)', dot:'var(--brand)'},
  contacted:       {label:'Reached out', bg:'var(--amber-soft)', fg:'var(--amber)', dot:'var(--amber)'},
  replied:         {label:'In conversation',bg:'var(--green-soft)', fg:'var(--green)', dot:'var(--green)'},
  coffee_chat:     {label:'Met',                bg:'var(--green-soft)', fg:'var(--green)', dot:'var(--green)'},
  referral:        {label:'Opportunity in motion',bg:'var(--green-soft)', fg:'var(--green)', dot:'var(--green)'},
  interview:       {label:'Opportunity in motion',bg:'var(--green-soft)', fg:'var(--green)', dot:'var(--green)'},
  offer:           {label:'Growing',              bg:'var(--green-soft)', fg:'var(--green)', dot:'var(--green)'},
  do_not_contact:  {label:'Closed out',     bg:'rgba(255,255,255,.06)', fg:'var(--mute)', dot:'var(--mute)'},
};
const stageOf = (r)=>STAGE[(r||{}).status] || STAGE.prospect;
/* Node Capacity Management's honest version of "dormant": the handoff mockup
   showed a fabricated "Vitality 12/100" score and invented reasons ("goal
   alignment shifted"). Mighty has no such measurement - what it actually has
   is a status and a real elapsed-time fact, so that is what this returns,
   deliberately conservative about who even qualifies. Explicit do_not_contact
   is the safest candidate (the user already ended it themselves); a prospect
   never acted on, or a contact gone quiet a long time with no reply, are the
   next safest. Anyone who ever replied, met or moved further is left out
   entirely - a relationship that got that far is not this feature's call to
   make even if it has since gone quiet, since going-cold nudges (Today) exist
   for exactly that case and removal is a much bigger step than a nudge. */
function capacityCandidates(people){
  return people
    .map(r=>{
      let reason = null, since = null;
      if(r.status==='do_not_contact'){ reason = 'Marked do not contact'; since = r.updated_at; }
      else if(r.status==='prospect' && days(r.shortlisted_at)>=60){ reason = 'Saved, never reached out'; since = r.shortlisted_at; }
      else if(r.status==='contacted' && days(r.contacted_at)>=30){ reason = 'Reached out, no reply since'; since = r.contacted_at; }
      if(!reason) return null;
      return {row:r, reason, sinceDays:days(since)||0, sinceLabel:ago(since)};
    })
    .filter(Boolean)
    .sort((a,b)=>b.sinceDays-a.sinceDays);
}
/* Mounted once, globally (App renders it the same way it renders the Ask
   drawer), because hitting the plan cap can happen from several different
   screens - Explore, Rooms, Organiser Hub - and all of them should open the
   same reviewer rather than each growing its own copy. */
function CapacityReview({people, cap, onDelete, onClose}){
  const candidates = useMemo(()=>capacityCandidates(people),[people]);
  const [checked, setChecked] = useState(()=>new Set());
  const [busy, setBusy] = useState(false);
  const toggle = (id)=>setChecked(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });
  async function removeSelected(){
    if(!checked.size || busy) return;
    const n = checked.size;
    if(!window.confirm('Permanently remove '+n+' '+(n===1?'person':'people')
      +' from Mighty? Their notes, drafts and timeline go with them. This cannot be undone.')) return;
    setBusy(true);
    try{ await onDelete(Array.from(checked)); onClose(); }
    finally{ setBusy(false); }
  }
  return (
    <div style={{position:'fixed',inset:0,zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(29,27,38,.5)'}}/>
      <div className="card" style={{position:'relative',maxWidth:560,width:'100%',maxHeight:'85vh',overflowY:'auto',padding:'26px 28px'}}>
        <div className="row" style={{justifyContent:'space-between',alignItems:'flex-start',gap:12}}>
          <div>
            <div className="h3">Free up space</div>
            <div className="sub" style={{marginTop:4}}>You're at {people.length} of {cap} on your plan. Remove a few to make room for someone new.</div>
          </div>
          <button onClick={onClose} aria-label="Close" style={{background:'none',border:'none',cursor:'pointer',fontSize:20,lineHeight:1,color:'var(--sub)',padding:4,flex:'none'}}>&times;</button>
        </div>

        {candidates.length===0 ? (
          <div className="banner warn" style={{marginTop:18}}>
            Nothing obviously stale to clear - everyone left has either been reached out to recently, or has already replied, met or moved further. Remove someone by hand from the List view, or upgrade your plan.
          </div>
        ) : (
          <div className="stack" style={{gap:0,marginTop:18,border:'1px solid var(--line2)',borderRadius:'var(--rsm)',overflow:'hidden'}}>
            {candidates.map(c=>(

const _photoInFlight = new Set();

/* ===================== AI (shared ai-proxy - no key ever reaches the client) ===================== */
/* ---- Instrumentation --------------------------------------------------------
   Our own table, not a third-party service, because we tell people that nothing
   they write about someone leaves their account. Sending behavioural data to a
   vendor a week after saying that would make it untrue in spirit.

   Counts and categories only. safeProps() enforces that structurally rather than
   by convention: a value survives only if it is a finite number, a boolean, or a
   short enum-shaped string. A name has a space and a capital, an email has an @,
   a URL has a colon and a slash - all three are dropped by the same rule, so a
   leak requires defeating the sanitizer rather than merely forgetting the rule.

   Fire and forget. Analytics must never break a feature or make the user wait,
   so every failure here is swallowed on purpose. */
const ENUMISH = /^[a-z0-9_]{1,32}$/;
/* Must agree with app_events.event's check constraint (2 to 40 chars). A name
   the client accepts and Postgres rejects is an event that vanishes silently. */
const EVENT_NAME = /^[a-z0-9_]{2,40}$/;
function safeProps(props){
  const out = {};
  if(!props || typeof props!=='object') return out;
  for(const k of Object.keys(props).slice(0,8)){
    if(!ENUMISH.test(k)) continue;
    const v = props[k];
    if(typeof v==='number' && Number.isFinite(v)) out[k] = v;
    else if(typeof v==='boolean') out[k] = v;
    else if(typeof v==='string' && ENUMISH.test(v)) out[k] = v;
    // anything else - names, emails, URLs, note text, objects - is dropped
  }
  return out;
}
/* App binds these once it has a client and a session. Kept module-level rather
   than threaded through six components as a prop: call sites stay readable, and
   an unbound tracker is a silent no-op rather than a crash. */
let _trkSb = null, _trkUser = null;
function bindTracking(sb, user){ _trkSb = sb; _trkUser = user; }
function track(event, props){
  try{
    if(!_trkSb || !_trkUser || !EVENT_NAME.test(String(event||''))) return;
    _trkSb.from('app_events').insert({user_id:_trkUser.id, event, props:safeProps(props)})
      .then(()=>{}, ()=>{});   // never surface an analytics failure
  }catch(e){}
}

/* ---- Extension bridge -------------------------------------------------------
   The extension can read a search results page that this page cannot: CORS
   blocks the app, but the background worker holds host permission. It parses
   location, education, experience and follower counts out of the same response,
   which the API path does not return at all. Ported from v1, which used it and
   which v2 stopped calling.

   Request/response over postMessage. With no extension installed every call
   times out and resolves {ok:false, error:'no_extension'}, so callers fall back
   rather than hang. Nothing here navigates or opens a tab. */
const extBridge = (()=>{
  let seq=0; const pending=new Map(); let ready=false;
  if(typeof window!=='undefined'){
    window.addEventListener('message', ev=>{
      if(ev.source!==window) return;
      const d=ev.data; if(!d || d.source!=='mighty-ext') return;
      ready = true;                              // any reply at all proves it's connected
      if(d.ready) return;
      const cb=pending.get(d.id); if(cb){ pending.delete(d.id); cb(d); }
    });
    /* bridge.js's content script runs at document_start and announces itself
       exactly once, synchronously, right then - which is routinely before
       this file (350kb of JSX the browser is still Babel-transforming) has
       reached this line and attached the listener above. Miss that single
       broadcast and isReady() reports false for the rest of the session even
       though the extension is fully installed and connected - which is
       exactly what made photos silently never fetch. Ping instead of only
       listening passively: bridge.js answers 'ping' any time, so a handful
       of retries over the first few seconds catches it whenever its own
       listener is actually up, no matter which side won the race. */
    let pingTries=0;
    const pingUntilReady = ()=>{
      if(ready || pingTries>=6) return;
      pingTries++;
      window.postMessage({source:'mighty-app', id:'boot-ping-'+pingTries, kind:'ping'}, window.location.origin);
      setTimeout(pingUntilReady, pingTries*600);
    };
    pingUntilReady();
  }
  function call(kind, extra, timeoutMs){
    return new Promise(resolve=>{
      const id='m'+(++seq)+'-'+Date.now();
      const t=setTimeout(()=>{ pending.delete(id); resolve({ok:false,error:'no_extension'}); }, timeoutMs||25000);
      pending.set(id, d=>{ clearTimeout(t); resolve(d); });
      window.postMessage({source:'mighty-app', id, kind, ...extra}, window.location.origin);
    });
  }
  return {
    isReady: ()=>ready,
    search: (query)=>call('search',{query}),
    photo: (profileUrl)=>call('photo',{profileUrl}, 30000),
    webSearch: (query)=>call('webSearch',{query}, 20000),
    eventSearch: (query)=>call('eventSearch',{query}, 25000),
  };
})();

/* The proxy already tells us the plan and how much of the monthly allowance is
   left; llm() used to return data.text and throw the rest away, so the number the
   whole model is metered on was invisible in the app. It is reported here and the
   App renders it. Reported on refusal too - that is exactly when it matters. */
let _onAiMeta = null;
function onAiMeta(fn){ _onAiMeta = fn; }
function reportMeta(meta){ try{ if(_onAiMeta && meta) _onAiMeta(meta); }catch(e){} }

/* `exchangeKey` is how one assist buys ten takes. It identifies a single
   outbound conversation with one person - 'ex:<log_id>:<n>' - and the gateway
   charges the first call carrying it and nothing after. It contains no name and
   no profile URL, so the ledger stays free of anyone who is not a user. */
async function llm(sb, feature, system, user, maxTokens, exchangeKey){
  let data, error;
  try{
    ({data, error} = await sb.functions.invoke('ai-proxy',
      {body:{feature, system, user, maxTokens:maxTokens||700, exchangeKey:exchangeKey||null}}));
  }catch(e){
    /* A transport-level failure (offline, CORS, the function itself down) is
       not the same as ai-proxy answering with a real error - console.error
       keeps the raw detail for debugging without putting "Failed to fetch"
       or a stack trace in front of the user. */
    console.error('ai-proxy transport error', e);
    throw new Error("Could not reach Mighty's AI right now. Check your connection and try again.");
  }
  if(error){
    console.error('ai-proxy error', error);
    /* supabase-js throws FunctionsHttpError for any non-2xx response, whose
       own .message is a hardcoded "Edge Function returned a non-2xx status
       code" - the real, useful message ai-proxy sent (e.g. an expired
       session, or why the request failed server-side) lives in the actual
       response body on error.context, and was being discarded entirely. */
    let curated = null;
    try{
      if(error.context && typeof error.context.json==='function'){
        const body = await error.context.json();
        if(body && body.message) curated = body.message;
      }
    }catch(e2){ /* body wasn't readable JSON - fall through to the generic message */ }
    throw new Error(curated || "Could not reach Mighty's AI right now. Check your connection and try again.");
  }
  if(data && data.meta) reportMeta(data.meta);
  if(!data || data.ok===false){
    if(data && data.error==='rate_limited') reportMeta({plan:data.plan, assistsLeftMonth:0, exhausted:true});
    throw new Error((data && (data.message||data.error)) || 'AI request failed.');
  }
  return data.text;
}
/* A model reply that is empty, cut off mid-object, or wrapped in prose despite
   instructions is a real, occasional failure mode - not a bug in the caller.
   Surfacing JSON.parse's own error ("Unexpected end of JSON input") to the
   user reads as broken software, so it is retried once - free, since the
   exchange is already paid for by exchangeKey - before giving up with a
   message that says what actually happened. */
function extractJSON(text){
  const s = String(text||'').indexOf('{'), e = String(text||'').lastIndexOf('}');
  if(s===-1 || e===-1 || e<s) throw new Error('Mighty came back without an answer that parsed.');
  return JSON.parse(text.slice(s, e+1));
}
async function llmJSON(sb, feature, system, user, maxTokens, exchangeKey){
  const sys = system+'\n\nRespond with ONLY valid JSON, no prose, no markdown fences.';
  const text = await llm(sb, feature, sys, user, maxTokens||900, exchangeKey);
  try{ return extractJSON(text); }
  catch(e){

  const toggleGoal = (id)=>setGoalTypes(g => g.includes(id) ? g.filter(x=>x!==id) : g.concat(id));
  const [goal,setGoal]     = useState(settings.goal||'');
  const [roles,setRoles]   = useState(settings.targetRoles||[]);
  const [cos,setCos]       = useState(settings.targetCompanies||[]);
  const [locs,setLocs]     = useState(settings.targetLocations||[]);
  const [more,setMore]     = useState(!firstRun);
  const [schools,setSchools] = useState(settings.schools||[]);
  const [style,setStyle]   = useState(settings.networkingStyle||[]);
  const [metrics,setMetrics] = useState(settings.successMetrics||[]);
  const STYLES = ['Coffee chats','Warm introductions','LinkedIn','Email','Conferences','Alumni events'];
  const ready = goalTypes.length>0;

  /* currentRole/currentCompany used to have their own input fields right
     here, a second editing surface for exactly the fields Account already
     edits - change it in one place and the other looked stale until you
     happened to open it. This form now only shows them, read-only, with a
     link to the one place that actually edits them. Same fix for
     homeLocation: it used to get overwritten by the first target location
     on every save, even when a real home location was already on file -
     targetLocations is who you want to find, not where you live, and the
     two should never silently clobber each other. */
  const submit = ()=>onSave({
    goalType: goalTypes[0]||'', goalTypes, goal:clean(goal), targetRoles:roles, targetCompanies:cos, targetLocations:locs,
    homeLocation: settings.homeLocation || locs[0] || '',
    schools, networkingStyle:style,
    successMetrics:metrics, strategyUpdatedAt:new Date().toISOString(),
  });

  return (
    <div className="pad fade" style={{maxWidth:720,margin:firstRun?'0 auto':'0',paddingTop:firstRun?56:36}}>
      <div className="eyebrow b">Your goal</div>
      <h1 className="h1" style={{marginTop:10}}>
        {firstRun ? "Let's build your relationship strategy." : 'Why are you networking?'}
      </h1>
      <p className="sub" style={{marginTop:8,lineHeight:1.55,textWrap:'pretty'}}>
        {firstRun
          ? 'Four questions, about a minute. It drives every recommendation Mighty makes.'
          : 'Change it whenever your goals change. Everything follows from it.'}
      </p>

      <div className="card" style={{marginTop:30,padding:'24px 26px'}}>
        <div className="h4">Why are you here?</div>
        <div className="sub" style={{marginTop:4,fontSize:14}}>Pick as many as are true.</div>
        <div className="stack" style={{gap:8,marginTop:16}}>
          {GOALS.map(g=>{
            const on = goalTypes.includes(g.id);
            return (
              <button key={g.id} onClick={()=>toggleGoal(g.id)} style={{textAlign:'left',padding:'14px 16px',borderRadius:12,
                border:'1px solid '+(on?'var(--brand-line)':'var(--line)'), background:on?'var(--brand-soft2)':'var(--card2)'}}>
                <div style={{fontSize:15.5,fontWeight:700,letterSpacing:'-.01em',color:on?'var(--brand-ink)':'var(--ink)'}}>{g.label}</div>
                <div style={{fontSize:13.5,color:on?'var(--brand-ink)':'var(--sub)',marginTop:2}}>{g.hint}</div>
              </button>);
          })}
        </div>
        <div style={{marginTop:16}}>
          <div className="lbl">In your own words (optional)</div>
          <input className="inp" value={goal} onChange={e=>setGoal(e.target.value)} placeholder="Land a product role in AI by December"/>
        </div>
      </div>

      <div className="card" style={{marginTop:16,padding:'24px 26px'}}>
        <div className="h4">Who do you want to meet?</div>
        <div className="sub" style={{marginTop:4,fontSize:14}}>Add roles or types of people.</div>
        <div style={{marginTop:14}}><ChipInput value={roles} onChange={setRoles} placeholder="Product Manager, Founder, Hiring Manager…"/></div>
      </div>

      <div className="card" style={{marginTop:16,padding:'24px 26px'}}>
        <div className="h4">Where do they work?</div>
        <div className="sub" style={{marginTop:4,fontSize:14}}>Companies, schools or funds you care about.</div>
        <div style={{marginTop:14}}><ChipInput value={cos} onChange={setCos} placeholder="OpenAI, Anthropic, Stripe, MIT…"/></div>
      </div>

      <div className="card" style={{marginTop:16,padding:'24px 26px'}}>
        <div className="h4">Which places matter?</div>
        <div className="sub" style={{marginTop:4,fontSize:14}}>Your first location is used for 'near me'.</div>
        <div style={{marginTop:14}}><ChipInput value={locs} onChange={setLocs} placeholder="Boston, San Francisco, Bengaluru…"/></div>
      </div>

      {!more &&
        <button className="btn q" style={{marginTop:16,padding:0,color:'var(--brand-ink)'}} onClick={()=>setMore(true)}>
          Add your own background and what success looks like →
        </button>}

      {more &&
        <F>
          <div className="card fade" style={{marginTop:16,padding:'24px 26px'}}>
            <div className="row" style={{justifyContent:'space-between',alignItems:'baseline'}}>
              <div className="h4">You</div>
              {go && <button className="btn q" style={{fontSize:13}} onClick={()=>go({screen:'you', tab:'settings'})}>Edit in Account</button>}
            </div>
            <div className="sub" style={{marginTop:4,fontSize:14}}>Shared ground is how good first messages get written.</div>
            <div style={{display:'flex',gap:12,marginTop:14,flexWrap:'wrap'}}>
              <div style={{flex:'1 1 200px'}}><div className="lbl">Your role</div>
                <div className="sub" style={{fontSize:14.5,marginTop:2}}>{settings.currentRole || 'Not set - add it in Account'}</div></div>
              <div style={{flex:'1 1 200px'}}><div className="lbl">Your company</div>
                <div className="sub" style={{fontSize:14.5,marginTop:2}}>{settings.currentCompany || 'Not set - add it in Account'}</div></div>
            </div>
            <div style={{marginTop:14}}><div className="lbl">Schools</div>
              <ChipInput value={schools} onChange={setSchools} placeholder="MIT Sloan…"/></div>
          </div>

          <div className="card fade" style={{marginTop:16,padding:'24px 26px'}}>
            <div className="h4">How do you build relationships?</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:9,marginTop:14}}>
              {STYLES.map(s=>{
                const on = style.indexOf(s)>=0;
                return <button key={s} className={'chip'+(on?' on':'')}
                  onClick={()=>setStyle(on?style.filter(x=>x!==s):style.concat([s]))}>{s}</button>;
              })}
            </div>
          </div>

          <div className="card fade" style={{marginTop:16,padding:'24px 26px'}}>
            <div className="h4">What does success look like?</div>
            <div className="sub" style={{marginTop:4,fontSize:14}}>Add an outcome, then press Enter.</div>
            <div style={{marginTop:14}}><ChipInput value={metrics} onChange={setMetrics} placeholder="40 coffee chats, 10 introductions, 1 signed term sheet…"/></div>
          </div>
        </F>}

      <div className="row" style={{marginTop:26,gap:10,flexWrap:'wrap'}}>
        <button className="btn" disabled={!ready||busy} onClick={submit}>
          {busy ? <span><span className="spin"/> Saving…</span> : (firstRun ? 'Start discovering' : 'Save goal')}
        </button>
        {onCancel && <button className="btn g" onClick={onCancel} disabled={busy}>Cancel</button>}
        {!ready && <span className="meta">Pick why you're here to continue.</span>}
      </div>
    </div>
  );
}

/* Real counts through real pipeline stages, never a fabricated "68% there" -
   nothing here can honestly know how close a raise or a job search actually
   is. What it CAN say, truthfully, is how many are moving and how far. Shared
   between Today and the Goal tab so "goal progress" means the same thing
   wherever it appears. */
function GoalFunnel({people, settings}){
  if(!canSee('progress', people)) return null;
  const f = goalFunnel(people);
  const stages = [['Saved',f.saved], ['Reached out',f.reachedOut], ['In conversation',f.talking], ['Advanced',f.advanced]];
  return (
    <div className="card" style={{padding:'20px 24px'}}>
      <div className="row" style={{gap:10,flexWrap:'wrap',alignItems:'baseline'}}>
        <span className="eyebrow b">Goal progress</span>
        <span className="meta">{f.saved} {goalNoun(settings)} in play toward {goalShort(settings)}</span>
      </div>
      <div style={{marginTop:16,display:'flex',alignItems:'center',flexWrap:'wrap'}}>
        {stages.map(([label,n],i)=>(
          <F key={label}>
            <div style={{textAlign:'center',minWidth:78}}>
              <div style={{fontSize:24,fontWeight:800,letterSpacing:'-.03em',fontVariantNumeric:'tabular-nums',
                color:n>0?'var(--brand-ink)':'var(--mute)'}}>{n}</div>
              <div className="sub" style={{fontSize:12,marginTop:4}}>{label}</div>
            </div>
            {i<stages.length-1 &&
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--mute)" strokeWidth="2"
                strokeLinecap="round" strokeLinejoin="round" style={{flex:'none',margin:'0 2px'}}><path d="M9 6l6 6-6 6"/></svg>}
          </F>))}
      </div>
    </div>
  );
}

/* A second (or third) goal, tracked independently of the primary one above -
   its own type(s), its own free-text elaboration, its own target roles and
   companies. Lives at settings.knowledge.goals, same list-in-knowledge idiom
   Rooms and Organiser Hub already use: local state mirrors the array, every
   edit computes the whole next array and persists it in one onSaveSettings
   call. Deliberately does not duplicate the primary goal's "more" section
   (schools, networking style, success metrics) - those describe the person,
   not the goal, and stay a single shared, account-level answer in the
   primary goal's own form. */
function SecondaryGoals({settings, onSaveSettings}){
  const [goals, setGoals] = useState(()=>secondaryGoals(settings));
  const persist = (next)=>{ setGoals(next); onSaveSettings({knowledge:{...(settings.knowledge||{}), goals:next}}); };

  const [editingId, setEditingId] = useState(null);
  const editing = editingId===null ? null : goals.find(g=>g.id===editingId);

  function addGoal(){
    const g = {id:'g'+Date.now(), types:[], goal:'', targetRoles:[], targetCompanies:[], targetLocations:[]};
    persist(goals.concat(g));
    setEditingId(g.id);
  }
  function removeGoal(id){
    persist(goals.filter(g=>g.id!==id));
    if(editingId===id) setEditingId(null);
  }
  function saveGoal(id, patch){
    persist(goals.map(g=>g.id===id ? {...g, ...patch, updatedAt:new Date().toISOString()} : g));
    setEditingId(null);
  }

  return (
    <div style={{marginTop:36,maxWidth:780}}>
      <div className="row" style={{justifyContent:'space-between',alignItems:'baseline',flexWrap:'wrap',gap:10}}>
        <div>
          <div className="eyebrow b">Other goals</div>
        </div>
        {!editing && <button className="btn g sm" onClick={addGoal}>+ Add a goal</button>}
      </div>

      <div className="stack" style={{gap:12,marginTop:16}}>
        {goals.map(g=>
          editing && editing.id===g.id
            ? <SecondaryGoalForm key={g.id} goal={g} onSave={p=>saveGoal(g.id,p)} onCancel={()=>setEditingId(null)}/>
            : <SecondaryGoalCard key={g.id} goal={g} onEdit={()=>setEditingId(g.id)} onRemove={()=>removeGoal(g.id)}/>)}
        {!editing && goals.length===0 &&
          <div className="hint">No second goal yet - most people only need one. Add one if you are genuinely working two tracks at once, like raising and hiring.</div>}
      </div>
    </div>
  );
}

/* ===================== The Knowledge Base, on screen =====================
   Everything Mighty holds about the user, in the place where they can correct
   it. Two things earn their space here.

   First, it is auditable. "Where did Mighty learn that" has an answer, and the
   answer is a row you can look at and change.

   Second, and rarer: it states what it does NOT know. That is close to free to
   build and almost nobody ships it, and it is the difference between a product
   that gets corrected and one that gets quietly distrusted. */
function yearOf(s){
  const m = String(s||'').match(/(\d{4})/);
  return m ? parseInt(m[1],10) : null;
}

/* One color per employer/school, cycled in order of first appearance, reused
   for both its pills and its legend dot - the only way to tell two
   same-width pills apart once the label itself is too clipped to read. */
const TIMELINE_PALETTE = ['#5B4FE9','#C75B33','#2E8B57','#B9862F','#3E7CB1','#8A4FA6','#4A9B8E','#B0507A'];
function KbTimeline({positions, education}){
  const rows = [
    ...(positions||[]).map((p,i)=>({key:'p'+i, kind:'role', title:p.title||'Role', co:p.company||'', from:p.from, to:p.to})),
    ...(education||[]).map((e,i)=>({key:'e'+i, kind:'edu', title:e.degree||'Education', co:e.school||'', from:e.from, to:e.to})),
  ].map(r=>({...r, fy:yearOf(r.from), ty: r.to ? (yearOf(r.to)||new Date().getFullYear()) : new Date().getFullYear()}))
   .filter(r=>r.fy).sort((a,b)=>a.fy-b.fy);
  if(!rows.length) return null;
  const minY = Math.min(...rows.map(r=>r.fy));
  const maxY = Math.max(new Date().getFullYear(), ...rows.map(r=>r.ty));
  const span = Math.max(1, maxY-minY);
  const pct = y => Math.min(100, Math.max(0, ((y-minY)/span)*100));

  const colorOf = (()=>{ const map={}; let n=0;
    return (name)=>{ const k=name||'—'; if(!(k in map)){ map[k]=TIMELINE_PALETTE[n%TIMELINE_PALETTE.length]; n++; } return map[k]; };
  })();

  /* Two roles that overlap in time cannot share one lane without their pills
     colliding - greedily push each into the first lane whose last pill has
     already ended, opening a new lane only when every existing one is still
     occupied. Ordinary non-overlapping careers stay on a single lane. */
  const laneEnds = [];
  const placed = rows.map(r=>{
    const startPct = pct(r.fy), widthPct = Math.min(100-startPct, Math.max(9, pct(r.ty)-pct(r.fy)));
    let lane = laneEnds.findIndex(end=>startPct >= end);
    if(lane===-1){ lane = laneEnds.length; laneEnds.push(0); }
    laneEnds[lane] = startPct+widthPct+2;
    return {...r, startPct, widthPct, lane, color:colorOf(r.co)};
  });
  const laneCount = Math.max(1, ...placed.map(r=>r.lane+1));
  const rowH = 24;

  const step = Math.max(1, Math.round(span/5));
  const gridYears = []; for(let y=minY; y<maxY; y+=step) gridYears.push(y);
  if(gridYears.length && maxY-gridYears[gridYears.length-1] < step/2) gridYears.pop();
  gridYears.push(maxY);

  const legend = []; const seen = new Set();
  placed.forEach(r=>{ if(!seen.has(r.co)){ seen.add(r.co); legend.push({name:r.co||'—', color:r.color, kind:r.kind}); } });

  return (
    <div>
      <div className="row" style={{gap:10,flexWrap:'wrap',alignItems:'baseline'}}>
        <span className="eyebrow b">The career as read</span>
        <span className="meta">{(positions||[]).length} role{(positions||[]).length===1?'':'s'}, {(education||[]).length} school{(education||[]).length===1?'':'s'}</span>
      </div>
      <div style={{marginTop:12,position:'relative',height:laneCount*rowH+2}}>
        {placed.map(r=>{
          const tip = [r.title,r.co].filter(Boolean).join(', ')+' · '+(r.from||'?')+' - '+(r.to||'now');
          return (
            <div key={r.key} title={tip} style={{position:'absolute',left:r.startPct+'%',
              width:r.widthPct+'%', top:r.lane*rowH, height:19, borderRadius:5,
              boxSizing:'border-box',display:'flex',alignItems:'center',padding:'0 8px',
              fontSize:10.5,fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',
              background: r.kind==='edu' ? 'transparent' : r.color+'1f',
              border: r.kind==='edu' ? '1.5px dashed '+r.color : '1px solid '+r.color+'55',
              color:r.color}}>
              {r.title}
            </div>);
        })}
      </div>
      <div style={{position:'relative',height:14,marginTop:4}}>
        {gridYears.map(y=>(
          <span key={y} style={{position:'absolute',left:pct(y)+'%',fontSize:10.5,color:'var(--mute)',
            transform: y===minY?'none':(y===maxY?'translateX(-100%)':'translateX(-50%)')}}>{y}</span>))}
      </div>
      <div style={{display:'flex',flexWrap:'wrap',rowGap:10,columnGap:16,marginTop:12}}>
        {legend.map((l,i)=>(
          <div key={i} className="row" style={{gap:7,alignItems:'center'}}>
            <CompanyLogo name={l.name} size={18} color={l.color}/>
            <span className="meta">{l.name}</span>
          </div>))}
      </div>
    </div>
  );
}

/* skills/honors/publications/languages and the resume's raw text are all
   read and used (they feed every AI prompt via strategyBrief) but none of
   it was ever actually shown to the user - only counted, in the "WHAT IT
   HOLDS" stat circles on Profile. That left no way to see, at a glance,
   whether what got pulled from a LinkedIn export or a resume was even
   right. This is that view: exactly what is on file, nothing summarized
   or reinterpreted. */
function KbChipRow({label, items}){
  if(!items || !items.length) return null;
  return (
    <div style={{marginTop:16}}>

/* Bring-your-own-contact-list: paste rows or drop a CSV/Excel file, preview

function ImportPeoplePanel({onSave, people, onClose}){
  const fileRef = useRef(null);
  const [pasted, setPasted] = useState('');
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [savedCount, setSavedCount] = useState(0);
  const [done, setDone] = useState(false);

  const existingUrls = useMemo(()=> new Set(
    people.map(p=>(p.profile_url||'').toLowerCase()).filter(Boolean)), [people]);
  const existingNames = useMemo(()=> new Set(
    people.map(p=>(p.name||'').toLowerCase().trim()).filter(Boolean)), [people]);
  const slug = (s)=> String(s||'person').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'person';

  function preview(parsed){
    if(!parsed.length){
      setErr('No names found. Needs a Name column (or First name / Last name), or plain "Name, Title, Company" rows.');
      setRows(null); return;
    }
    setErr(null);
    setRows(parsed.map(r=>({...r,
      dupe: r.profileUrl ? existingUrls.has(r.profileUrl.toLowerCase()) : existingNames.has(r.name.toLowerCase().trim())})));
  }

  async function onFile(file){
    if(!file) return;
    setBusy(true); setErr(null);
    try{ preview(await rowsFromFile(file)); }
    catch(e){ setErr(e.message||'Could not read that file.'); }
    setBusy(false);
    if(fileRef.current) fileRef.current.value = '';
  }

  const freshCount = rows ? rows.filter(r=>!r.dupe).length : 0;

  async function commit(){
    if(!rows || !freshCount || busy) return;
    setBusy(true); setSavedCount(0);
    for(const r of rows.filter(r=>!r.dupe)){
      const profileUrl = r.profileUrl || ('contact-import:'+slug(r.name)+'-'+Math.random().toString(36).slice(2,7));
      await onSave({profileUrl, name:r.name, title:r.title, company:r.company, email:r.email||undefined,
        location:r.location||undefined}, 'Imported list', 'contact_import');
      setSavedCount(n=>n+1);
    }
    setBusy(false); setDone(true);
  }

  return (
    <div style={{position:'fixed',inset:0,zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(29,27,38,.5)'}}/>
      <div className="card" style={{position:'relative',maxWidth:620,width:'100%',maxHeight:'85vh',overflowY:'auto',padding:'26px 28px'}}>
        <div className="row" style={{justifyContent:'space-between',alignItems:'flex-start',gap:12}}>
          <div>
            <div className="h3">Add people from a list</div>
            <div className="sub" style={{marginTop:4}}>CSV, Excel, or paste rows straight from a spreadsheet or a table. A Name column is all it needs; Title, Company, LinkedIn URL, Email and Location are used when present.</div>
          </div>
          <button onClick={onClose} aria-label="Close" style={{background:'none',border:'none',cursor:'pointer',fontSize:20,lineHeight:1,color:'var(--sub)',padding:4,flex:'none'}}>&times;</button>
        </div>

        {done ? (
          <div className="banner" style={{marginTop:18,borderColor:'var(--green)',color:'var(--green)'}}>
            Saved {savedCount} {savedCount===1?'person':'people'} to Relationships.
          </div>
        ) : !rows ? (
          <F>
            <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" style={{display:'none'}}
              onChange={e=>onFile(e.target.files && e.target.files[0])}/>
            <div onClick={()=>fileRef.current && fileRef.current.click()}
              style={{marginTop:18,border:'1.5px dashed var(--line)',borderRadius:16,padding:'22px 20px',
                cursor:'pointer',background:'var(--card2)',textAlign:'center'}}>
              <div className="eyebrow">{busy ? 'Reading…' : 'Drop a CSV or Excel file here, or click to browse'}</div>
            </div>
            <div style={{marginTop:18}}>
              <div className="lbl">Or paste rows</div>
              <textarea className="inp" style={{minHeight:110}} value={pasted} onChange={e=>setPasted(e.target.value)}
                placeholder={"Name\tTitle\tCompany\nJordan Lee\tPartner\tEarly-stage Capital"}/>
              <button className="btn g sm" style={{marginTop:10}} disabled={!clean(pasted)}
                onClick={()=>preview(rowsFromPastedText(pasted))}>Preview</button>
            </div>
            {err && <div className="banner warn" style={{marginTop:16}}>{err}</div>}
          </F>
        ) : (
          <F>
            <div className="sub" style={{marginTop:16}}>
              {rows.length} found{rows.length-freshCount>0 ? ', '+(rows.length-freshCount)+' already saved' : ''}.
              {freshCount>0 ? ' '+freshCount+' new.' : ' Nothing new to add.'}
            </div>
            <div className="stack" style={{gap:0,marginTop:12,border:'1px solid var(--line2)',borderRadius:'var(--rsm)',overflow:'hidden',maxHeight:280,overflowY:'auto'}}>
              {rows.map((r,i)=>(
                <div key={i} className="row" style={{gap:12,padding:'10px 14px',borderTop:i===0?'none':'1px solid var(--line2)',opacity:r.dupe?.5:1}}>
                  <Avatar name={r.name} size={26}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13.5,fontWeight:700}}>{r.name}</div>
                    <div className="meta" style={{marginTop:1}}>{[r.title,r.company].filter(Boolean).join(' · ')||'—'}</div>
                  </div>
                  {r.dupe && <span className="meta">Already saved</span>}
                </div>))}
            </div>
            <div className="row" style={{justifyContent:'flex-end',gap:10,marginTop:20}}>
              <button className="btn g" onClick={()=>{ setRows(null); setPasted(''); }} disabled={busy}>Start over</button>
              <button className="btn" onClick={commit} disabled={busy || !freshCount}>
                {busy ? <span><span className="spin"/> Saving</span> : 'Save '+freshCount+' '+(freshCount===1?'person':'people')}
              </button>
            </div>
          </F>
        )}
      </div>
    </div>
  );
}

/* ===================== Today ===================== */
/* Actions are derived from real relationship data. Nothing is invented - if
   there is nothing real to do, Today says so and points at Discover. */
function buildPlan(people, events, tasks){
  const byLog = {};
  events.forEach(e=>{ (byLog[e.log_id] = byLog[e.log_id]||[]).push(e); });
  const lastOf = (r, types)=>{
    const list = (byLog[r.id]||[]).filter(e=>!types || types.indexOf(e.event_type)>=0);
    return list.length ? list[list.length-1] : null;
  };
  const out = [];

  people.filter(r=>r.status==='replied').forEach(r=>{
    const reply = lastOf(r,['reply']);
    const mine  = lastOf(r,['first_message','note']);
    const stale = !mine || !reply || new Date(reply.occurred_at) > new Date(mine.occurred_at);
    if(stale) out.push({id:'reply-'+r.id, tone:'red', title:'Reply to '+(r.name||'them'),
      sub: reply ? 'They replied '+ago(reply.occurred_at)+'.' : 'They are waiting on you.',
      cta:'Reply', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  /* Capped like the brief- block below, so a long backlog in any one
     category cannot fill all 5 slots and crowd out the others - Today is
     meant to show a few things of different kinds, not the most numerous
     kind. */
  people.filter(r=>r.status==='ready_to_contact').slice(0,2).forEach(r=>{
    out.push({id:'send-'+r.id, tone:'amber',
      title: r.ai_draft ? 'Review '+(r.name||'their')+"'s draft" : 'Draft a message to '+(r.name||'them'),
      sub: r.ai_draft ? 'Draft is written and waiting for your review.' : 'You marked them ready. Mighty can draft it.',
      cta: r.ai_draft?'Review & send':'Draft it', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  /* Matches the "gone quiet" count buildSnapshot shows in Today's summary
     sentence and the "Follow up" cta nextAction() already uses elsewhere -
     without this, the summary could say "3 gone quiet" with zero matching
     cards below it. */
  people.filter(r=>r.status==='contacted' && days(r.contacted_at)>=10).slice(0,2).forEach(r=>{
    out.push({id:'quiet-'+r.id, tone:'amber', title:'Follow up with '+(r.name||'them'),
      sub:'You reached out '+(ago(r.contacted_at)||'a while ago')+' with nothing back yet.',
      cta:'Follow up', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  tasks.filter(t=>!t.done).forEach(t=>{
    const overdue = t.due_date && new Date(t.due_date).getTime() < Date.now()-DAY;
    const person = people.find(p=>p.id===t.log_id);
    out.push({id:'task-'+t.id, tone:overdue?'red':'amber', title:t.label,
      sub:(t.sub || (person? person.name : '')) + (t.due_date? (overdue?' · overdue':' · due '+dateShort(t.due_date)) : ''),
      cta:'Open', taskId:t.id,
      go: person ? {screen:'profile', id:person.id, tab:'notes'} : {screen:'relationships'}});
  });

  people.filter(r=>['coffee_chat','replied'].indexOf(r.status)>=0).forEach(r=>{
    const met = lastOf(r,['coffee_chat']);
    const note = lastOf(r,['note']);
    if(met && (!note || new Date(note.occurred_at) < new Date(met.occurred_at)) && days(met.occurred_at)<=5)
      out.push({id:'cap-'+r.id, tone:'green', title:'Capture your conversation with '+(r.name||'them'),
        sub:'You met '+ago(met.occurred_at)+' and nothing is written down yet.', cta:'Add notes',
        go:{screen:'profile', id:r.id, tab:'notes'}});
  });

  /* The 'quiet-' rule above only watches 'contacted' - a relationship that
     already got a reply, a coffee chat, or a referral and then had no event
     of any kind for three weeks goes cold in a way that rule never catches.
     Capped like every other rule here so a long backlog can't crowd out the
     rest of Today. Excludes anyone the 'cap-' rule above already covers this
     week (a fresh coffee chat isn't cold, it's just uncaptured yet). */
  /* 'offer' belongs here too - it was omitted, which meant the one stage you
     least want going silent was the only active stage this rule ignored. */
  people.filter(r=>['replied','coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).slice(0,2).forEach(r=>{
    const last = lastOf(r);
    const lastAt = (last && last.occurred_at) || r.updated_at || r.shortlisted_at;
    if(lastAt && days(lastAt)>=21)
      out.push({id:'cold-'+r.id, tone:'amber', title:(r.name||'They')+' is going quiet',
        sub:'Nothing since '+ago(lastAt)+'. A short nudge keeps the thread alive.',
        cta:'Follow up', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  people.filter(r=>r.status==='prospect' && !(r.briefing&&r.briefing.insights&&r.briefing.insights.length)).slice(0,2).forEach(r=>{
    out.push({id:'brief-'+r.id, tone:'purple', title:'Prepare for '+(r.name||'them'),
      sub:(r.context&&r.context.whySaved) ? r.context.whySaved.slice(0,90) : 'Saved '+(ago(r.shortlisted_at)||'recently')+'. No brief yet.',
      cta:'Prepare', go:{screen:'profile', id:r.id, tab:'brief'}});
  });

  const rank = {red:0, amber:1, green:2, purple:3, grey:4};
  out.sort((a,b)=>(rank[a.tone]-rank[b.tone]));
  const plan = out.slice(0,5);
  if(plan.length<5) plan.push({id:'discover', tone:'grey', title:'Find one person worth knowing',
    sub:'Five good people beat fifty saved profiles.', cta:'Find someone', go:{screen:'relationships'}});
  return plan;
}
/* The single sentence under the greeting - built from the exact literal
   templates buildPlan itself writes (title/sub), so this is string surgery
   on text this same file already produced, not free-floating fabrication.
   Never invents a fact buildPlan did not already compute. */
/* LinkedIn sometimes truncates a connection's name to a trailing initial and
   period ("Alexander C."). Appending a sentence-ending period unconditionally
   produced "Alexander C.." - this only adds one when the text doesn't already
   end with one. */
const addPeriod = (s)=> /\.$/.test(s) ? '' : '.';
/* webSearch() sometimes returns a redirect or error page's own boilerplate
   instead of a failure, since the fetch itself succeeds - a real research
   result never contains this kind of navigation chrome. Rejecting it here is
   the "classify the state before choosing copy" fix: a page like this is a
   failed extraction, not color about the person. */
const isUnusableResearchText = (s)=> /skip to main content|accessibility help|if you are not redirected|something went wrong|page not found|enable javascript to (continue|view)/i.test(s||'');
function heroLine(t, peopleLen){
  if(!t) return peopleLen>0 ? "Nothing urgent right now. A good day to find someone new."
    : "Nothing real to act on yet. Save someone and this fills in.";
  if(t.id.startsWith('reply-')){
    const name = t.title.replace(/^Reply to /,'');
    const when = t.sub.replace('They replied ','').replace(/\.$/,'');
    return name+' replied '+when+'.';
  }
  if(t.id.startsWith('send-')){
    const name = t.title.replace(/^Review /,'').replace(/'s draft$/,'').replace(/^Draft a message to /,'');
    return t.cta==='Review & send' ? name+"'s draft is ready. Sending it keeps things moving."
      : 'Time to reach out to '+name+addPeriod(name);
  }
  if(t.id.startsWith('quiet-')){
    const name = t.title.replace(/^Follow up with /,'');
    return name+' has gone quiet. A short nudge beats losing the thread.';
  }
  if(t.id.startsWith('cap-')){
    const name = t.title.replace(/^Capture your conversation with /,'');
    return 'You met '+name+' recently. Write it down before it fades.';
  }
  if(t.id.startsWith('brief-')){
    const name = t.title.replace(/^Prepare for /,'');
    return name+' is saved and ready for a closer look before you reach out.';
  }
  if(t.id.startsWith('task-')) return t.title+addPeriod(t.title);
  return "Five good people beat fifty saved profiles - worth a look today.";
}
const HERO_VERB = {Reply:'Reply now', 'Review & send':'Review & send', 'Draft it':'Draft it',
  'Follow up':'Follow up', 'Add notes':'Add notes', 'Prepare':'Prepare',
  'Find someone':'Find someone', 'Open':'Open'};
/* Each card's badge names the real event that put it on the list - never a
   guessed urgency judgment. Falls back to the cta itself if a card type
   doesn't have a more specific reason. */
const ACTION_REASON = {'reply-':'Reply recorded', 'send-':null, 'quiet-':'Follow-up due',
  'task-':'Task due', 'cap-':'Notes needed', 'cold-':'Follow-up due', 'brief-':'Brief needed'};
function actionReason(t){
  if(t.id.startsWith('send-')) return t.cta==='Review & send' ? 'Draft ready' : 'Marked ready';
  const prefix = Object.keys(ACTION_REASON).find(p=>t.id.startsWith(p));
  return (prefix && ACTION_REASON[prefix]) || t.cta;
}

/* Real counts, not a fabricated "68% there" - see GoalFunnel's own note on
   why. This is the compact, goal-specific version for Today: identified,
   waiting-on-you, and a weekly meeting target with a dot tracker. The Goal
   tab shows the fuller stage-by-stage funnel instead. */
function GoalStrip({people, events, settings}){
  if(!canSee('progress', people)) return null;
  const byLog = {};
  events.forEach(e=>{ (byLog[e.log_id]=byLog[e.log_id]||[]).push(e); });
  const f = goalFunnel(people);
  const waiting = people.filter(r=>needsReply(r, byLog)).length;
  /* weeklyMeetingTarget was never settable anywhere - "Need 3 meetings this
     week" and its dot tracker were a hard-coded fallback wearing a
     personal-target costume. Removed rather than kept with fabricated
     numbers; comes back once there's a real place in Goal to set it. */
  return (
    <div className="card" style={{padding:'18px 22px'}}>
      <div className="eyebrow b">Toward</div>
      <div style={{fontSize:15.5,fontWeight:800,marginTop:3,lineHeight:1.3,letterSpacing:'-.01em'}}>{goalLine(settings)}</div>
      <div className="sub" style={{fontSize:13.5,marginTop:6}}>
        {f.saved} saved · {waiting} replies to review
      </div>
    </div>
  );
}

/* Both maps route through the same tokens the rest of the app repainted for
   Prism in one pass, rather than a second independent set of hex that could
   drift from it - a literal '#C75B33' here would have been exactly the kind
   of hardcoded escape that went invisible-on-dark everywhere else it showed
   up before this file got audited for it. */
const TONE = {red:'var(--red)', amber:'var(--amber)', green:'var(--green)', purple:'var(--brand-ink)', grey:'var(--mute)'};
/* A flat card with only a small colored dot reads as one undifferentiated
   list - the dot is easy to miss entirely at a glance. A soft wash of the same
   tone across the whole card makes urgency visible before you've read a word. */
const TONE_BG = {red:'var(--red-soft)', amber:'var(--amber-soft)', green:'var(--green-soft)', purple:'var(--brand-soft)', grey:'var(--card2)'};

/* Does r need a reply from the user right now? Same test buildPlan uses for
   its 'reply-' item: the last thing that happened was them, not us. */
function needsReply(r, byLog){
  if(r.status!=='replied') return false;
  const list = byLog[r.id]||[];
  const reply = list.filter(e=>e.event_type==='reply').slice(-1)[0];
  const mine  = list.filter(e=>e.event_type==='first_message'||e.event_type==='note').slice(-1)[0];
  return !mine || !reply || new Date(reply.occurred_at) > new Date(mine.occurred_at);
}

/* What an executive gets in the morning: a few sentences that vary with what
   is actually true today, not a fixed panel of numbers repeated forever.
   Every clause here is a real count, and a clause is dropped entirely rather
   than shown at zero - that is the whole difference between this and a
   dashboard. No bar, no percentage, no score: see docs on the product's one
   hard rule. */
function buildSnapshot(people, events, tasks, settings, plan){
  const byLog = {};
  events.forEach(e=>{ (byLog[e.log_id] = byLog[e.log_id]||[]).push(e); });
  const added = people.length;
  const contactedOrBeyond = people.filter(r=>REACHED.includes(r.status)).length;
  const talking = people.filter(r=>['replied','coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length;
  const met = people.filter(r=>['coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length;
  const waiting = people.filter(r=>needsReply(r, byLog)).length;
  const quiet = people.filter(r=>r.status==='contacted' && days(r.contacted_at)>=10).length;

  const cap = PLAN_CAPS[(plan)||'trial'] || 50;
  const nearCap = added >= cap*0.8;

  const prev = settings.todaySnapshot;
  const prevAgeDays = prev && prev.at ? Math.floor((Date.now()-new Date(prev.at).getTime())/DAY) : null;
  let delta = null;
  if(prev && prevAgeDays!=null && prevAgeDays>=6){
    const addedSince = added - (prev.added||0);
    const metSince = met - (prev.met||0);
    const bits = [];
    if(addedSince>0) bits.push(addedSince+' new since last week');
    if(metSince>0) bits.push(metSince+' met since then');
    if(bits.length) delta = bits.join(', ');
  }
  const shouldResnapshot = !prev || prevAgeDays==null || prevAgeDays>=6;

  return {added, contactedOrBeyond, talking, met, waiting, quiet, nearCap, cap, delta, shouldResnapshot};
}

/* ===================== Relationships =====================
   One list, one question: where am I with everyone. It used to be two
   screens - Discover for people not yet saved, Relationships for people who
   were - and that split forced a user to decide which kind of person they
   were thinking about before they could even look. They rarely know; a name
   that comes to mind is just a name, saved or not.

   So one search box now does both jobs. Empty, it groups everyone already
   saved by what is true about them right now - reply needed first, because
   nothing else is more urgent than a person who took the time to answer -
   and closes with the people Mighty thinks are worth adding, ranked the same
   way Discover used to rank them. Typed into, it filters the saved list AND
   searches the user's own connections at once, because "who is Priya" should
   not care whether Priya was already added.

   Three ways in, in the order they are actually useful, survive from the old
   Discover:
   1. An open box over the user's OWN connections - no keyword extraction, no
      model call, because the answer is already in the database.
   2. LinkedIn, for people the user is not connected to - the expensive path,
      and the explicit second choice, offered only once the first comes up
      empty.
   3. The ranking nobody asked for: dormancy, goal fit, shared history. */

/* Words that carry no retrieval signal.
   Two-letter terms are KEPT, because AI, VC, ML and PM are the shortest and most
   important words anyone will type here. That means the stop list has to carry
   the short function words itself rather than leaning on a length cut-off: an
   earlier version filtered anything under three characters, which threw away AI
   and VC while happily keeping "and". */
const Q_STOP = new Set([
  // function words, including the short ones a length filter used to catch
  'a','an','the','and','or','of','in','on','at','to','is','it','as','by','be','if','so','do','my','me',
  'we','us','he','so','no','up','all','any','are','was','has','had','can','not','but','for','you','your',
  'yours','who','whom','what','when','where','which','while','with','from','that','this','these','those',
  'they','them','their','there','then','than','been','into','also','over','under','after','before','more',
  'most','much','many','some','such','only','just','very','ever','even','same','other','others','would',
  'could','should','will','here','out','how','why','get','got','give','given','take','taken','make','made',
  'use','used','using','per','via','yet','far','now','off','own','see','say','set','due','one','two',
  // words about the search rather than the person
  'anyone','anybody','people','folks','person','someone','somebody','looking','look','find','found',
  'about','like','want','wants','need','needs','know','knows','help','helps','best','good','ones',
  'companies','company','working','works','work','worked']);

function queryTerms(text){
  /* Alphanumeric only, deliberately. Terms go into a Postgres regex on the other
     side, and a stray + or * there is either a syntax error or a silent wrong
     match. Stripping the characters here is safer than escaping them there. */
  const seen = {}, out = [];
  String(text||'').toLowerCase().split(/[^a-z0-9]+/).forEach(w=>{
    if(w.length < 2 || Q_STOP.has(w) || seen[w]) return;
    seen[w] = 1; out.push(w);
  });
  return out.slice(0, 10);
}

/* The terms the ranking searches on when the user has not asked anything. Roles
   and companies and places the user named in their strategy come first because
   they were stated rather than inferred; words from the goal sentence fill in. */
function goalTerms(settings){
  const s = settings || {};
  const named = [].concat(s.targetRoles||[], s.targetCompanies||[], s.targetLocations||[])
    .join(' ');
  return queryTerms(named + ' ' + (s.goal||''));
}

/* Every employer the user has had, so "was there while you were" is checkable.
   Reads the Knowledge Base the archive filled in, and falls back to whatever the
   strategy form knows if there is no archive. */
function ownCompanies(settings){
  const s = settings || {}, kb = s.knowledge || {};
  const fromKb = (kb.positions||[]).map(p=>p && p.company).filter(Boolean);
  const all = fromKb.concat([s.currentCompany].filter(Boolean));
  const seen = {}, out = [];
  all.forEach(c=>{ const k = String(c).toLowerCase().trim();
    if(k && !seen[k]){ seen[k]=1; out.push(String(c).trim()); } });
  return out.slice(0, 25);
}

function connName(c){
  return clean([c.first_name, c.last_name].filter(Boolean).join(' ')) || 'Unnamed connection';
}

/* Why this person is in front of you, in words, from the three signals the
   database can actually support. Never more than two clauses: a reason nobody
   reads is the same as no reason. Reports the connection year as a fact, not
   as "nothing since" - years_silent only counts logged messages, so a real
   conversation Mighty never captured would read as silence it can't back up. */
function connReason(c){
  const bits = [];
  if(c.shared_company) bits.push('Was at ' + c.shared_company + ' while you were');
  if(c.hits && c.hits.length) bits.push('Matched terms: ' + c.hits.slice(0,3).join(', '));
  if(bits.length < 2 && c.connected_on){
    bits.push('Connection recorded: ' + String(c.connected_on).slice(0,4));
  }
  return bits.slice(0,2).join('. ') + (bits.length ? '.' : '');
}

/* Turn a connections row into the shape savePerson already understands, so
   adding from your own network and adding from a search write the same row. */
function connToPerson(c){
  return {
    profileUrl: c.profile_url,
    name: connName(c),
    title: clean(c.position) || null,
    company: clean(c.company) || null,
    why: connReason(c),
    common: (c.hits||[]).slice(0,4),
    connectedOn: c.connected_on || null,
    avatarUrl: c.avatar_url || null,
  };
}

/* Relationship caps per plan. The database is authoritative (ai_config), these
   are the same defaults so the number can be shown without a round trip. */
const PLAN_CAPS = {trial:50, starter:100, plus:200, pro:500, explorer:100, builder:200, leader:500};

async function matchConnections(sb, terms, ownCos, limit){
  const {data, error} = await sb.rpc('connections_match', {
    p_terms: terms || [], p_own_companies: ownCos || [], p_limit: limit || 12});
  if(error) throw error;
  return data || [];
}

function nextAction(r){
  switch(r.status){
    case 'prospect':         return (r.briefing&&r.briefing.insights&&r.briefing.insights.length) ? 'Draft a message' : 'Prepare';
    case 'ready_to_contact': return r.ai_draft ? 'Review draft' : 'Draft a message';
    case 'contacted':        return days(r.contacted_at)>=10 ? 'Follow up' : 'Waiting on them';
    case 'replied':          return 'Reply';
    case 'coffee_chat':      return 'Capture notes';
    /* referral/interview/offer are merged into one Board column ("Growing")
       but fell through to the same 'Keep in touch' default as a dormant
       contact, making an active interview or open offer visually
       indistinguishable from someone gone quiet. Capture notes is a real
       action that already exists (the Notes tab), not an invented one. */
    case 'referral': case 'interview': case 'offer': return 'Capture notes';
    case 'do_not_contact':   return ' - ';
    default:                 return 'Keep in touch';
  }
}

/* Decision Memory: the reason behind a save or a pass is worth more than the
   save or pass itself - it is judgment, not activity. Kept deliberately
   optional (a dismissible chip row, never a gate in front of the action) and
   deliberately small (one enum choice, no free text) so it costs nothing to
   answer and nothing to skip. */
const SAVE_REASONS = [
  {id:'customer',   label:'Potential customer'},
  {id:'investor',   label:'Investor'},
  {id:'mentor',     label:'Mentor'},
  {id:'recruiter',  label:'Recruiter'},
  {id:'partner',    label:'Partner'},
  {id:'friend',     label:'Friend'},
  {id:'other',      label:'Other'},
];
const SKIP_REASONS = [
  {id:'too_junior',      label:'Too junior'},
  {id:'wrong_industry',  label:'Wrong industry'},
  {id:'no_overlap',      label:'No overlap'},
  {id:'not_now',         label:'Not now'},
  {id:'already_know',    label:'Already know them'},
];
function ReasonChips({prompt, options, onPick, onDismiss}){

    <div className="row" style={{gap:6,flexWrap:'wrap',alignItems:'center'}}>

        <button key={o.id} className="chip" style={{fontSize:12,padding:'4px 10px'}} onClick={()=>onPick(o.id)}>{o.label}</button>))}
