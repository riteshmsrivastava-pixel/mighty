<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mighty</title>
<!-- ============================================================
     Mighty v2 - the relationship operating system.
     Governed by docs/PRODUCT-BIBLE-v2.md. Visual spec: the Claude Design
     bundle (app-redesign-with-new-principles).

     Navigation is the user's questions, not features:
       Today - what deserves my attention?
       Relationships - where am I with everyone, and who is worth adding?
       You - how does this work for me? (Mirror, Patterns, Goal, Account)
       Ask Mighty - what should I do?

     Permanent rules enforced here:
       · You always click Send. Nothing is ever sent automatically.
       · Explain before you score - no numeric match scores in the UI.
       · Save is the only way a person enters Mighty; 'prospect' IS Saved.
       · Navigation is always visible; only depth unlocks, on data not time.
       · Never "Mighty knows" - always "Things you have learned".
       · No empty dashboards: every panel hides until it has real data.

     Same Supabase project, tables and settings keys as app/v1.html, so both
     apps read and write one account.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="icon" href="../favicon.ico?v=2" sizes="any">

<style>
  :root{
 --paper:#FBFAF8; --rail:#FFFFFF; --card:#FFFFFF; --card2:#FBFAF8;
 --line:#ECEAE4; --line2:#F1EFE9; --line3:#EFEDE7; --line4:#F1EFE9;
 --ink:#1D1B26; --ink2:#2A2833; --body:#33313D; --sub:#8A8896; --mute:#B4B1BC; --mute2:#A39FA8;
 --brand:#5B4FE9; --brand-h:#4A3FD1; --brand-ink:#4A3FD1;
 --brand-soft:#F5F3FD; --brand-soft2:#EFEDFD; --brand-line:#E4E0F7; --brand-nav:#EFEDFD;
 --peach:#E87A56;
 --green:#2E8B5F; --green2:#2E8B5F; --green-soft:#E6F4EC;
 --amber:#B0641F; --amber-soft:#FBF1E2; --amber-dot:#E3A23C;
 --red:#C75B33; --red-soft:#FBEFE9;
 --f:'Schibsted Grotesk',system-ui,-apple-system,sans-serif;
 --r:16px; --rsm:14px; --pill:999px; --sh:0 1px 3px rgba(29,27,38,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
  a{color:var(--brand);text-decoration:none}
  button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
  input,textarea,select{font-family:inherit;color:inherit}
  input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  ::selection{background:#E4DEFC}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#E2DED7;border-radius:99px;border:3px solid var(--paper)}
  ::-webkit-scrollbar-track{background:transparent}

  .h1{font-size:32px;font-weight:700;letter-spacing:-.025em;text-wrap:pretty;margin:0}
  .h2{font-size:26px;font-weight:700;letter-spacing:-.025em;text-wrap:pretty;margin:0}
  .h3{font-size:19px;font-weight:700;letter-spacing:-.015em}
  .h4{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
  .eyebrow.b{color:var(--brand)}
  .sub{font-size:15px;color:var(--sub)}
  .meta{font-size:13px;color:var(--mute2)}
  .pad{padding:40px 48px 90px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
  .why{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:12px}

  .btn{padding:11px 20px;border-radius:var(--pill);background:var(--brand);color:#fff;font-size:14.5px;font-weight:700;transition:background .15s;white-space:nowrap}
  .btn:hover:not(:disabled){background:var(--brand-h)}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn.g{background:#fff;border:1px solid #E2DDD6;color:var(--ink);font-weight:600}
  .btn.g:hover:not(:disabled){border-color:var(--brand);color:var(--brand-ink);background:#fff}
  .btn.sm{padding:9px 17px;font-size:14px}
  .btn.xs{padding:7px 14px;font-size:13px}
  .btn.q{background:none;color:var(--sub);font-weight:600;padding:8px 12px}
  .btn.q:hover{color:var(--ink)}
  .btn.soft{background:#F4F2EE;color:#5B554D;font-weight:600}
  .btn.soft:hover{background:#EDEAE4}

  .inp{width:100%;padding:14px 16px;border-radius:var(--rsm);border:1px solid #E4E0D9;background:var(--card2);font-size:15.5px}
  .inp:focus{background:#fff}
  .inp::placeholder{color:#B8B1A8}
  textarea.inp{min-height:74px;resize:vertical;line-height:1.55;padding:13px 15px;border-radius:12px;font-size:15px}
  .lbl{font-size:12.5px;font-weight:700;color:#6B655C;margin-bottom:6px}

  .chip{padding:8px 15px;border-radius:var(--pill);border:1px solid var(--line);background:var(--card2);font-size:13.5px;color:#5B554D;font-weight:500;white-space:nowrap}
  .chip:hover:not(:disabled){border-color:#C9BFF7;color:var(--brand-ink)}
  .chip.on{background:var(--brand-soft2);border-color:#CFC4F9;color:var(--brand-ink);font-weight:700}
  .tag{padding:6px 12px;border-radius:var(--pill);background:#F4F2EE;font-size:12.5px;color:#6B655C;font-weight:500;white-space:nowrap}
  .tagx{display:inline-flex;align-items:center;gap:7px;padding:7px 8px 7px 14px;border-radius:var(--pill);background:var(--brand-soft2);color:var(--brand-ink);font-size:13.5px;font-weight:600}
  .tagx button{color:#8C7BE8;font-size:15px;line-height:1;padding:0 4px}
  .tagx button:hover{color:var(--brand-ink)}
  .seg{display:flex;gap:3px;padding:3px;background:#F0EDE8;border-radius:12px;width:fit-content}
  .seg button{padding:8px 16px;border-radius:9px;font-size:14px;font-weight:600;color:#6B655C;white-space:nowrap}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}

  .av{border-radius:50%;background:#E6E1FB;color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
  .pill{display:inline-block;padding:5px 12px;border-radius:var(--pill);font-size:12.5px;font-weight:700;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .row{display:flex;align-items:center;gap:16px}
  .stack{display:flex;flex-direction:column}
  .tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs button{padding:11px 0;font-size:14.5px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:700}

  .spin{width:15px;height:15px;border:2px solid #DED8F7;border-top-color:var(--brand);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .fade{animation:fi .22s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .banner{border-radius:12px;padding:13px 16px;font-size:14px;font-weight:500;line-height:1.5}
  .banner.warn{background:var(--amber-soft);color:#6E5F3D;border:1px solid #F0E4C6}
  .banner.err{background:var(--red-soft);color:#8E4238;border:1px solid #F6D9D4}
  .banner.ok{background:var(--green-soft);color:var(--green);border:1px solid #CFE5D8}
  .hint{font-size:13px;color:var(--mute2);line-height:1.5}
  .lift:hover{background:var(--card2)}
  /* Today's cards carry a status-tinted background (see TONE_BG), which as an
     inline style outranks .lift:hover's plain background swap - this keeps a
     hover cue (a lift + soft shadow, neither set inline) instead of losing it. */
  .todaycard{transition:transform .15s ease,box-shadow .15s ease}
  .todaycard:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(38,32,14,.06)}
  .colcard{background:#fff;border:1px solid var(--line);border-radius:var(--rsm);padding:15px 16px;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .colcard:hover{border-color:#D6CFF8;transform:translateY(-2px);box-shadow:0 8px 18px rgba(91,79,233,.10)}
  .drop{outline:2px dashed #CFC4F9;outline-offset:-4px;border-radius:12px}

  @media (max-width:900px){
    .h1{font-size:26px} .h2{font-size:22px}
    .pad{padding:26px 20px 90px!important}
    /* the rail carries an inline display:flex, so this needs to win */
    .railwrap{display:none!important}
    .mobnav{display:flex!important}
    .hdr{padding:14px 20px!important}
    .hdr h1{font-size:17px!important}
  }
  .mobnav{display:none}
</style>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
  // Classic JSX runtime - the automatic runtime emits an ES import that fails without a bundler.
  Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] });

<script type="text/babel" data-presets="react-classic">
const {useState, useEffect, useRef, useMemo} = React;
const F = React.Fragment;

/* ===================== platform config (same project as app/v1.html) ===================== */
const SUPABASE_URL      = 'https://hplyyywdftnvjajyncvj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_e_oCwuz3Qlko5N3Xl8ZwxA_zQijz_u8';


/* Primary-goal vocabulary is v1's goalType enum so both apps score alike. */
const GOALS = [
  {id:'job_search',    label:'Find a new job',         hint:'Hiring managers, alumni, people already in the role'},
  {id:'raise_funding', label:'Raise investment',       hint:'Investors, angels, founders who have raised'},
  {id:'sales',         label:'Find customers',         hint:'Buyers, executives, decision makers'},
  {id:'mentors',       label:'Find mentors & advisors', hint:'Operators and experts a step ahead of you'},
  {id:'networking',    label:'Build my network',       hint:'Broad, deliberate, long-term relationships'},
];
const GOAL_LABEL = GOALS.reduce((a,g)=>{a[g.id]=g.label;return a;},{});
/* One goal can now be several. goalTypes is the source of truth when it
   exists; goalType (singular) survives on old accounts that saved before
   this changed. */
const goalTypeList = (st)=>{
  const s = st||{};
  return (s.goalTypes&&s.goalTypes.length) ? s.goalTypes : (s.goalType ? [s.goalType] : []);
};
const goalLine = (st)=>{
  const s = st||{};
  if(clean(s.goal)) return s.goal;
  const labels = goalTypeList(s).map(t=>GOAL_LABEL[t]).filter(Boolean);
  return labels.join(' and ') || 'Build your network';
};
/* A two-or-three-word version of the goal, for the one place a full sentence
   would not fit - "One step closer to funding," not "...to Raise a seed
   round for an AI-native venture studio, from investors who..." */
const GOAL_SHORT = {job_search:'a new job', raise_funding:'funding', sales:'new customers',
  mentors:'the right mentors', networking:'a stronger network'};
const goalShort = (st)=> GOAL_SHORT[goalTypeList(st)[0]] || 'your goal';
/* What to call a saved person, in the goal's own words - "12 investors" says
   more than "12 people" the moment the goal is raising money. */
const GOAL_NOUN = {job_search:'contacts', raise_funding:'investors', sales:'prospects',
  mentors:'mentors', networking:'people'};
const goalNoun = (st)=> GOAL_NOUN[goalTypeList(st)[0]] || 'people';

/* The funnel a goal actually moves through, in real counts only - never a
   fabricated "68% there," which nothing here can honestly know. Do-not-contact
   is excluded throughout: someone you closed out is not still in play toward
   anything. */
function goalFunnel(people){
  const active = people.filter(r=>r.status!=='do_not_contact');
  return {
    saved:     active.length,
    reachedOut:active.filter(r=>REACHED.includes(r.status)).length,
    talking:   active.filter(r=>['replied','coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length,
    advanced:  active.filter(r=>['referral','interview','offer'].indexOf(r.status)>=0).length,
  };
}

/* outreach_log.status is the ONE stage field. 'prospect' IS Saved. */
const STAGE = {
  prospect:        {label:'Saved',              bg:'#F1EFEA', fg:'#5A5766', dot:'#C9C6BF'},
  ready_to_contact:{label:'Ready to reach out', bg:'#EFEDFD', fg:'#4A3FD1', dot:'#5B4FE9'},
  contacted:       {label:'Reached out', bg:'#FBF1E2', fg:'#B0641F', dot:'#E3A23C'},
  replied:         {label:'In conversation',bg:'#E6F4EC', fg:'#2E8B5F', dot:'#2E8B5F'},
  coffee_chat:     {label:'Met',                bg:'#E6F4EC', fg:'#2E8B5F', dot:'#2E8B5F'},
  referral:        {label:'Opportunity in motion',bg:'#E6F4EC', fg:'#2E8B5F', dot:'#2E8B5F'},
  interview:       {label:'Opportunity in motion',bg:'#E6F4EC', fg:'#2E8B5F', dot:'#2E8B5F'},
  offer:           {label:'Growing',              bg:'#E6F4EC', fg:'#2E8B5F', dot:'#2E8B5F'},
  do_not_contact:  {label:'Closed out',     bg:'#F1EFEA', fg:'#8A8896', dot:'#DDD9D1'},
};
const stageOf = (r)=>STAGE[(r||{}).status] || STAGE.prospect;
/* Board columns follow the Bible's default pipeline; the late statuses share
   one "Growing" column so the board stays readable. */
/* Four columns, not six - the handoff merges everything from a first reply
   onward (replied/coffee_chat/referral/interview/offer) into one "Active"
   column, since past that point the meaningful question is just "is this
   relationship moving," not which of five sub-stages it is technically in. */
const COLUMNS = [
  {key:'prospect',         statuses:['prospect'],         label:'Potential'},
  {key:'ready_to_contact', statuses:['ready_to_contact'], label:'Prepared'},
  {key:'contacted',        statuses:['contacted'],        label:'Waiting'},
  {key:'active',           statuses:['replied','coffee_chat','referral','interview','offer'], label:'Active'},
];
const ORDER = ['prospect','ready_to_contact','contacted','replied','coffee_chat','referral','interview','offer'];
const REACHED = ['contacted','replied','coffee_chat','referral','interview','offer'];
const EVENT_LABEL = {connection_request:'Connection request', first_message:'Reached out',
  reply:'They replied', coffee_chat:'Met', note:'Note captured', referral:'Introduction made',
  interview:'Meeting', stage_change:'Stage changed'};

/* ===================== progressive disclosure =====================
   Navigation is always visible. Only depth unlocks, and only on data. */
const UNLOCKS = {
  board:    {test:(p)=>p.length>=5,       hint:'The board opens once five people are saved. Before that, a list says more.'},
  timeline: {test:(p,e)=>e.length>=3,     hint:'The timeline fills in once three things have happened.'},
  health:   {test:(p)=>p.filter(r=>REACHED.includes(r.status)).length>=3,
             hint:'Reach out to three people and Mighty can start showing what is working.'},
  progress: {test:(p)=>p.length>=3,       hint:'Progress appears once you have saved three people.'},
};
const canSee = (k,p,e)=>{ try{ return !!UNLOCKS[k].test(p,e); }catch(err){ return false; } };

/* ===================== helpers ===================== */
const clean = (s)=>String(s==null?'':s).trim();
const initials = (n)=>clean(n).split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
const firstName = (n)=>clean(n).split(/\s+/)[0] || '';
const DAY = 86400000;
const days = (iso)=> iso ? Math.floor((Date.now()-new Date(iso).getTime())/DAY) : null;
const ago = (iso)=>{ const d=days(iso); if(d==null) return ''; return d<=0?'today':d===1?'yesterday':d<30?d+' days ago':d<365?Math.round(d/30)+' months ago':Math.round(d/365)+'y ago'; };
const dateShort = (iso)=>{ if(!iso) return ''; const d=new Date(iso);
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); };
const greetWord = ()=>{ const h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; };

/* Real photo when one exists - the extension captures it the moment someone
   is saved from a search result or from their own profile - falling back to
   initials the moment the image 404s (a stale or since-privated LinkedIn
   photo URL) rather than showing a broken-image icon. */
/* One shape out of the several a "person" arrives in across the app - a
   saved outreach_log row, a connections_match row, a raw search result -
   read for whatever it actually has, so the hover preview works the same
   everywhere instead of needing a different card per source. */
function personPreview(p){
  if(!p) return null;
  const name = clean(p.name) || (p.first_name!=null ? connName(p) : '');
  if(!name) return null;
  const ctx = p.context || {};
  const why = clean(ctx.whySaved) || clean(p.why) || connReason(p);
  const common = (p.briefing && p.briefing.shared && p.briefing.shared.length) ? p.briefing.shared
    : (ctx.common || p.common || []);
  return {
    name, title: p.title || p.position || '', company: p.company || '',
    location: ctx.location || p.location || '', education: ctx.education || p.education || '',
    why, common, summary: (p.briefing && clean(p.briefing.careerSummary)) || '', status: p.status,
  };
}
function Avatar({name, size, src, hover}){
  const s = size||38;
  const [broken,setBroken] = useState(false);
  const [show,setShow] = useState(false);
  const [rect,setRect] = useState(null);
  const ref = useRef(null);
  const core = (src && !broken)
    ? <img ref={ref} src={src} alt="" width={s} height={s} onError={()=>setBroken(true)}
        style={{width:s,height:s,borderRadius:'50%',objectFit:'cover',flex:'none',background:'var(--card2)'}}/>
    : <div ref={ref} className="av" style={{width:s,height:s,fontSize:Math.round(s*0.36)}}>{initials(name)}</div>;
  const p = hover && personPreview(hover);
  if(!p) return core;
  const open = ()=>{ if(ref.current) setRect(ref.current.getBoundingClientRect()); setShow(true); };
  const close = ()=> setShow(false);
  const st = p.status ? stageOf({status:p.status}) : null;
  /* Portalled to the body and positioned from the real avatar's bounding
     box, rather than an absolutely-positioned sibling, so it is never
     clipped by a card's overflow:hidden - which several of the lists this
     shows up in rely on for their own rounded corners. */
  return (
    <span onMouseEnter={open} onMouseLeave={close} style={{display:'inline-flex',flex:'none'}}>
      {core}
      {show && rect && (()=>{
        /* Card height is content-dependent (location/education/summary/tags
           all vary), so clamping only the top edge left it rendering off the
           bottom of the viewport for avatars low in a long list - exactly
           where hovering to preview is most likely. Flip above the avatar
           when there isn't enough room below, and cap height either way as
           a backstop. */
        const spaceBelow = window.innerHeight - rect.bottom;
        const openAbove = spaceBelow < 340 && rect.top > spaceBelow;
        /* maxHeight must fit the actual room in whichever direction was
           chosen, not a flat 420px guess - a card that size could still
           clip past either edge whenever available space fell short of it
           but still passed the flip threshold above. */
        const room = openAbove ? rect.top - 20 : spaceBelow - 20;
        const cardMax = Math.max(120, Math.min(420, room));
        return ReactDOM.createPortal(
        <div onMouseEnter={open} onMouseLeave={close} className="fade"
          style={{position:'fixed', left:Math.max(12,Math.min(rect.left, window.innerWidth-308)),
            ...(openAbove ? {bottom:Math.max(12,window.innerHeight-rect.top+8)} : {top:rect.bottom+8}),
            maxHeight:cardMax, overflowY:'auto',
            zIndex:200, width:280,
            background:'#fff', border:'1px solid var(--line)', borderRadius:16,
            boxShadow:'0 12px 32px rgba(26,25,23,.16)', padding:18}}>
          <div className="row" style={{gap:12}}>
            {src && !broken
              ? <img src={src} alt="" width={40} height={40} style={{width:40,height:40,borderRadius:'50%',objectFit:'cover',flex:'none'}}/>
              : <div className="av" style={{width:40,height:40,fontSize:15}}>{initials(p.name)}</div>}
            <div style={{minWidth:0}}>
              <div style={{fontWeight:700,fontSize:15,letterSpacing:'-.01em'}}>{p.name}</div>
              <div className="sub" style={{fontSize:12.5,marginTop:1}}>{[p.title,p.company].filter(Boolean).join(' · ')||'No headline captured'}</div>
            </div>
          </div>
          {st && <div style={{marginTop:10}}><span className="pill" style={{background:st.bg,color:st.fg,fontSize:11,padding:'4px 11px'}}>{st.label}</span></div>}
          {(p.location||p.education) &&
            <div className="meta" style={{marginTop:10}}>{[p.location,p.education].filter(Boolean).join(' · ')}</div>}
          {p.summary &&
            <div style={{marginTop:10,fontSize:13,lineHeight:1.5,color:'var(--body)'}}>{p.summary}</div>}
          {!p.summary && p.why &&
            <div style={{marginTop:10,fontSize:13,lineHeight:1.5,color:'var(--brand-ink)'}}>{p.why}</div>}
          {p.common && p.common.length>0 &&
            <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:10}}>
              {p.common.slice(0,4).map((c,i)=><span key={i} className="tag" style={{fontSize:11,padding:'4px 10px'}}>{c}</span>)}
            </div>}
        </div>, document.body);
      })()}
    </span>
  );
}
/* A guessed .com for a company name - stripping the legal-entity noise
   ("Inc", "Ltd", "Pvt", "Group"...) that would otherwise never match a real
   domain. Wrong often enough that this is a best-effort guess, not a lookup -
   CompanyLogo below always has an initials fallback for when it misses. */
const companyDomainGuess = (name)=>{
  const s = clean(name).toLowerCase()
    .replace(/\(.*?\)/g,'')
    .replace(/[.,'']/g,'')
    .replace(/&/g,' and ')

    .trim().replace(/\s+/g,'');
  return s || null;
};

/* ===================== AI (shared ai-proxy - no key ever reaches the client) ===================== */
/* ---- Instrumentation --------------------------------------------------------
   Our own table, not a third-party service, because we tell people that nothing
   they write about someone leaves their account. Sending behavioural data to a
   vendor a week after saying that would make it untrue in spirit.

   Counts and categories only. safeProps() enforces that structurally rather than
   by convention: a value survives only if it is a finite number, a boolean, or a
   short enum-shaped string. A name has a space and a capital, an email has an @,
   a URL has a colon and a slash - all three are dropped by the same rule, so a
   leak requires defeating the sanitizer rather than merely forgetting the rule.

   Fire and forget. Analytics must never break a feature or make the user wait,
   so every failure here is swallowed on purpose. */
const ENUMISH = /^[a-z0-9_]{1,32}$/;
/* Must agree with app_events.event's check constraint (2 to 40 chars). A name
   the client accepts and Postgres rejects is an event that vanishes silently. */
const EVENT_NAME = /^[a-z0-9_]{2,40}$/;
function safeProps(props){
  const out = {};
  if(!props || typeof props!=='object') return out;
  for(const k of Object.keys(props).slice(0,8)){
    if(!ENUMISH.test(k)) continue;
    const v = props[k];
    if(typeof v==='number' && Number.isFinite(v)) out[k] = v;
    else if(typeof v==='boolean') out[k] = v;
    else if(typeof v==='string' && ENUMISH.test(v)) out[k] = v;
    // anything else - names, emails, URLs, note text, objects - is dropped
  }
  return out;
}
/* App binds these once it has a client and a session. Kept module-level rather
   than threaded through six components as a prop: call sites stay readable, and
   an unbound tracker is a silent no-op rather than a crash. */
let _trkSb = null, _trkUser = null;
function bindTracking(sb, user){ _trkSb = sb; _trkUser = user; }
function track(event, props){
  try{
    if(!_trkSb || !_trkUser || !EVENT_NAME.test(String(event||''))) return;
    _trkSb.from('app_events').insert({user_id:_trkUser.id, event, props:safeProps(props)})
      .then(()=>{}, ()=>{});   // never surface an analytics failure
  }catch(e){}
}

/* ---- Extension bridge -------------------------------------------------------
   The extension can read a search results page that this page cannot: CORS
   blocks the app, but the background worker holds host permission. It parses
   location, education, experience and follower counts out of the same response,
   which the API path does not return at all. Ported from v1, which used it and
   which v2 stopped calling.

   Request/response over postMessage. With no extension installed every call
   times out and resolves {ok:false, error:'no_extension'}, so callers fall back
   rather than hang. Nothing here navigates or opens a tab. */
const extBridge = (()=>{
  let seq=0; const pending=new Map(); let ready=false;
  if(typeof window!=='undefined'){
    window.addEventListener('message', ev=>{
      if(ev.source!==window) return;
      const d=ev.data; if(!d || d.source!=='mighty-ext') return;
      if(d.ready){ ready=true; return; }
      const cb=pending.get(d.id); if(cb){ pending.delete(d.id); cb(d); }
    });
  }
  function call(kind, extra, timeoutMs){
    return new Promise(resolve=>{
      const id='m'+(++seq)+'-'+Date.now();
      const t=setTimeout(()=>{ pending.delete(id); resolve({ok:false,error:'no_extension'}); }, timeoutMs||25000);
      pending.set(id, d=>{ clearTimeout(t); resolve(d); });
      window.postMessage({source:'mighty-app', id, kind, ...extra}, window.location.origin);
    });
  }
  return {
    isReady: ()=>ready,
    search: (query)=>call('search',{query}),
    photo: (profileUrl)=>call('photo',{profileUrl}, 30000),
  };
})();

/* The proxy already tells us the plan and how much of the monthly allowance is
   left; llm() used to return data.text and throw the rest away, so the number the
   whole model is metered on was invisible in the app. It is reported here and the
   App renders it. Reported on refusal too - that is exactly when it matters. */
let _onAiMeta = null;
function onAiMeta(fn){ _onAiMeta = fn; }
function reportMeta(meta){ try{ if(_onAiMeta && meta) _onAiMeta(meta); }catch(e){} }

/* `exchangeKey` is how one assist buys ten takes. It identifies a single
   outbound conversation with one person - 'ex:<log_id>:<n>' - and the gateway
   charges the first call carrying it and nothing after. It contains no name and
   no profile URL, so the ledger stays free of anyone who is not a user. */
async function llm(sb, feature, system, user, maxTokens, exchangeKey){
  let data, error;
  try{
    ({data, error} = await sb.functions.invoke('ai-proxy',
      {body:{feature, system, user, maxTokens:maxTokens||700, exchangeKey:exchangeKey||null}}));
  }catch(e){
    /* A transport-level failure (offline, CORS, the function itself down) is
       not the same as ai-proxy answering with a real error - console.error
       keeps the raw detail for debugging without putting "Failed to fetch"
       or a stack trace in front of the user. */
    console.error('ai-proxy transport error', e);
    throw new Error("Could not reach Mighty's AI right now. Check your connection and try again.");
  }
  if(error){
    console.error('ai-proxy error', error);
    /* supabase-js throws FunctionsHttpError for any non-2xx response, whose
       own .message is a hardcoded "Edge Function returned a non-2xx status
       code" - the real, useful message ai-proxy sent (e.g. an expired
       session, or why the request failed server-side) lives in the actual
       response body on error.context, and was being discarded entirely. */
    let curated = null;
    try{
      if(error.context && typeof error.context.json==='function'){
        const body = await error.context.json();
        if(body && body.message) curated = body.message;
      }
    }catch(e2){ /* body wasn't readable JSON - fall through to the generic message */ }
    throw new Error(curated || "Could not reach Mighty's AI right now. Check your connection and try again.");
  }
  if(data && data.meta) reportMeta(data.meta);
  if(!data || data.ok===false){
    if(data && data.error==='rate_limited') reportMeta({plan:data.plan, assistsLeftMonth:0, exhausted:true});
    throw new Error((data && (data.message||data.error)) || 'AI request failed.');
  }
  return data.text;
}
/* A model reply that is empty, cut off mid-object, or wrapped in prose despite
   instructions is a real, occasional failure mode - not a bug in the caller.
   Surfacing JSON.parse's own error ("Unexpected end of JSON input") to the
   user reads as broken software, so it is retried once - free, since the
   exchange is already paid for by exchangeKey - before giving up with a
   message that says what actually happened. */
function extractJSON(text){
  const s = String(text||'').indexOf('{'), e = String(text||'').lastIndexOf('}');
  if(s===-1 || e===-1 || e<s) throw new Error('Mighty came back without an answer that parsed.');
  return JSON.parse(text.slice(s, e+1));
}
async function llmJSON(sb, feature, system, user, maxTokens, exchangeKey){
  const sys = system+'\n\nRespond with ONLY valid JSON, no prose, no markdown fences.';
  const text = await llm(sb, feature, sys, user, maxTokens||900, exchangeKey);
  try{ return extractJSON(text); }
  catch(e){
    const retryText = await llm(sb, feature,
      sys+' Keep the whole reply under '+(maxTokens||900)+' tokens so it is never cut off mid-object.',
      user, maxTokens||900, exchangeKey);
    try{ return extractJSON(retryText); }
    catch(e2){ throw new Error("Mighty's answer did not come back in the right shape. Try again in a moment."); }
  }
}
function strategyBrief(st){
  return [
    'Goal: ' + (goalTypeList(st).map(t=>GOAL_LABEL[t]).filter(Boolean).join(' and ') || 'building a professional network'),
    st.goal ? 'In their words: ' + st.goal : '',
    (st.targetRoles||[]).length ? 'Wants to meet: ' + st.targetRoles.join(', ') : '',
    (st.targetCompanies||[]).length ? 'Target organizations: ' + st.targetCompanies.join(', ') : '',
    (st.targetLocations||[]).length ? 'Places that matter: ' + st.targetLocations.join(', ') : '',
    (st.currentRole||st.currentCompany) ? 'Currently: ' + [st.currentRole, st.currentCompany].filter(Boolean).join(' at ') : '',
    (st.schools||[]).length ? 'Schools: ' + st.schools.join(', ') : '',
    (st.successMetrics||[]).length ? 'Success looks like: ' + st.successMetrics.join(', ') : '',
    (st.networkingStyle||[]).length ? 'Prefers: ' + st.networkingStyle.join(', ') : '',
  ].filter(Boolean).join('\n');
}
function localKeywords(sentence, st){
  const stop = /\b(find|show|me|people|person|who|that|which|are|is|a|an|the|and|or|of|in|at|to|for|with|from|working|works|based|i|want|meet|looking|like|some)\b/gi;
  let s = clean(sentence).replace(stop,' ').replace(/\s+/g,' ').trim();
  if(!s) s = [(st.targetRoles||[])[0], (st.targetCompanies||[])[0], (st.targetLocations||[])[0]].filter(Boolean).join(' ');
  return s.slice(0,180);
}
async function toKeywords(sb, sentence, st){
  const home = (st.targetLocations||[])[0] || st.homeLocation;
  const near = /\bnear me\b/i.test(sentence) && home ? clean(sentence).replace(/\bnear me\b/i, home) : clean(sentence);
  try{
    const out = await llm(sb, 'tagging',
      'You turn a sentence describing people someone wants to meet into a short keyword query for a LinkedIn profile search. Output ONLY the keywords, space separated, no punctuation, no explanation, no quotes. Keep job titles, companies, schools, industries and places. Drop filler words. Maximum 12 words.',
      near, 60);
    const k = clean(out).replace(/^["']|["']$/g,'').replace(/\s+/g,' ');
    return k || localKeywords(near, st);
  }catch(e){ return localKeywords(near, st); }
}
/* One match ladder across the whole product - app, extension panel and
   marketing all say the same three things. Keep in sync with
   mightyMatchLabel() in extension/scoring.js. */
const VERDICT = {
  excellent:{label:'Strong fit for your goal', dot:'#5B4FE9'},
  strong:   {label:'Good fit',    dot:'#2E8B5F'},
  potential:{label:'Worth a look', dot:'#E3A23C'},
  low:      {label:'Outside your goal',   dot:'#B4B1BC'},
};
const VERDICT_KEYS = ['excellent','strong','potential','low'];
async function evaluate(sb, people, st){
  const list = people.map((p,i)=>`${i+1}. ${p.name} - ${p.title||'(no headline)'}${p.company?' - '+p.company:''}`).join('\n');
  const out = await llmJSON(sb, 'profile_briefing',
    'You help a professional decide who is worth building a relationship with. For each candidate, judge relevance to THEIR stated goal and explain it in plain language. Never output a numeric score. Ground every claim only in the given headline text - if the headline does not support a claim, do not make it. Be honest: never inflate a weak fit, and when nothing about someone matches the goal, say so outright rather than implying promise that is not there. Common ground must be real overlap between the two people; "both in tech" is not common ground. Never use em dashes; write a spaced hyphen instead.',
    `The person doing the networking:\n${strategyBrief(st)}\n\nCandidates:\n${list}\n\nReturn JSON exactly like {"matches":[{"n":1,"verdict":"excellent"|"strong"|"potential"|"low","why":"one or two sentences, starts with the reason, no score","common":["short shared-ground phrase"]}]}. Use "excellent" only when they match the goal squarely, "strong" for a clear fit, "potential" when the connection is real but loose, and "low" when nothing about them lines up with the goal. Include every candidate by its number n. "common" may be empty.`,
    1500);
  const byN = {};
  (out.matches||[]).forEach(m=>{ if(m && m.n) byN[Number(m.n)]=m; });
  return people.map((p,i)=>{
    const m = byN[i+1]||{};
    const raw = String(m.verdict||'').toLowerCase();
    const v = VERDICT_KEYS.indexOf(raw)>=0 ? raw : 'potential';
    return {...p, verdict:v, why:clean(m.why), common:Array.isArray(m.common)?m.common.filter(Boolean).slice(0,4):[]};
  });
}

/* ===================== The Knowledge Base, on screen =====================
   Everything Mighty holds about the user, in the place where they can correct
   it. Two things earn their space here.

   First, it is auditable. "Where did Mighty learn that" has an answer, and the
   answer is a row you can look at and change.

   Second, and rarer: it states what it does NOT know. That is close to free to
   build and almost nobody ships it, and it is the difference between a product
   that gets corrected and one that gets quietly distrusted. */
function yearOf(s){
  const m = String(s||'').match(/(\d{4})/);
  return m ? parseInt(m[1],10) : null;
}

/* One color per employer/school, cycled in order of first appearance, reused
   for both its pills and its legend dot - the only way to tell two
   same-width pills apart once the label itself is too clipped to read. */
const TIMELINE_PALETTE = ['#5B4FE9','#C75B33','#2E8B57','#B9862F','#3E7CB1','#8A4FA6','#4A9B8E','#B0507A'];
function KbTimeline({positions, education}){
  const rows = [
    ...(positions||[]).map((p,i)=>({key:'p'+i, kind:'role', title:p.title||'Role', co:p.company||'', from:p.from, to:p.to})),
    ...(education||[]).map((e,i)=>({key:'e'+i, kind:'edu', title:e.degree||'Education', co:e.school||'', from:e.from, to:e.to})),
  ].map(r=>({...r, fy:yearOf(r.from), ty: r.to ? (yearOf(r.to)||new Date().getFullYear()) : new Date().getFullYear()}))
   .filter(r=>r.fy).sort((a,b)=>a.fy-b.fy);
  if(!rows.length) return null;
  const minY = Math.min(...rows.map(r=>r.fy));
  const maxY = Math.max(new Date().getFullYear(), ...rows.map(r=>r.ty));
  const span = Math.max(1, maxY-minY);
  const pct = y => Math.min(100, Math.max(0, ((y-minY)/span)*100));

  const colorOf = (()=>{ const map={}; let n=0;
    return (name)=>{ const k=name||'—'; if(!(k in map)){ map[k]=TIMELINE_PALETTE[n%TIMELINE_PALETTE.length]; n++; } return map[k]; };
  })();

  /* Two roles that overlap in time cannot share one lane without their pills
     colliding - greedily push each into the first lane whose last pill has
     already ended, opening a new lane only when every existing one is still
     occupied. Ordinary non-overlapping careers stay on a single lane. */
  const laneEnds = [];
  const placed = rows.map(r=>{
    const startPct = pct(r.fy), widthPct = Math.min(100-startPct, Math.max(9, pct(r.ty)-pct(r.fy)));
    let lane = laneEnds.findIndex(end=>startPct >= end);
    if(lane===-1){ lane = laneEnds.length; laneEnds.push(0); }
    laneEnds[lane] = startPct+widthPct+2;
    return {...r, startPct, widthPct, lane, color:colorOf(r.co)};
  });
  const laneCount = Math.max(1, ...placed.map(r=>r.lane+1));
  const rowH = 24;

  const step = Math.max(1, Math.round(span/5));
  const gridYears = []; for(let y=minY; y<maxY; y+=step) gridYears.push(y);
  if(gridYears.length && maxY-gridYears[gridYears.length-1] < step/2) gridYears.pop();
  gridYears.push(maxY);

  const legend = []; const seen = new Set();
  placed.forEach(r=>{ if(!seen.has(r.co)){ seen.add(r.co); legend.push({name:r.co||'—', color:r.color, kind:r.kind}); } });

  return (
    <div>
      <div className="row" style={{gap:10,flexWrap:'wrap',alignItems:'baseline'}}>
        <span className="eyebrow b">The career as read</span>
        <span className="meta">{(positions||[]).length} role{(positions||[]).length===1?'':'s'}, {(education||[]).length} school{(education||[]).length===1?'':'s'}</span>
      </div>
      <div style={{marginTop:12,position:'relative',height:laneCount*rowH+2}}>
        {placed.map(r=>{
          const tip = [r.title,r.co].filter(Boolean).join(', ')+' · '+(r.from||'?')+' - '+(r.to||'now');
          return (
            <div key={r.key} title={tip} style={{position:'absolute',left:r.startPct+'%',
              width:r.widthPct+'%', top:r.lane*rowH, height:19, borderRadius:5,
              boxSizing:'border-box',display:'flex',alignItems:'center',padding:'0 8px',
              fontSize:10.5,fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',
              background: r.kind==='edu' ? 'transparent' : r.color+'1f',
              border: r.kind==='edu' ? '1.5px dashed '+r.color : '1px solid '+r.color+'55',
              color:r.color}}>
              {r.title}
            </div>);
        })}
      </div>
      <div style={{position:'relative',height:14,marginTop:4}}>
        {gridYears.map(y=>(
          <span key={y} style={{position:'absolute',left:pct(y)+'%',fontSize:10.5,color:'var(--mute)',
            transform: y===minY?'none':(y===maxY?'translateX(-100%)':'translateX(-50%)')}}>{y}</span>))}
      </div>
      <div style={{display:'flex',flexWrap:'wrap',rowGap:10,columnGap:16,marginTop:12}}>
        {legend.map((l,i)=>(
          <div key={i} className="row" style={{gap:7,alignItems:'center'}}>
            <CompanyLogo name={l.name} size={18} color={l.color}/>
            <span className="meta">{l.name}</span>
          </div>))}
      </div>
    </div>
  );
}

/* ===================== Today ===================== */
/* Actions are derived from real relationship data. Nothing is invented - if
   there is nothing real to do, Today says so and points at Discover. */
function buildPlan(people, events, tasks){
  const byLog = {};
  events.forEach(e=>{ (byLog[e.log_id] = byLog[e.log_id]||[]).push(e); });
  const lastOf = (r, types)=>{
    const list = (byLog[r.id]||[]).filter(e=>!types || types.indexOf(e.event_type)>=0);
    return list.length ? list[list.length-1] : null;
  };
  const out = [];

  people.filter(r=>r.status==='replied').forEach(r=>{
    const reply = lastOf(r,['reply']);
    const mine  = lastOf(r,['first_message','note']);
    const stale = !mine || !reply || new Date(reply.occurred_at) > new Date(mine.occurred_at);
    if(stale) out.push({id:'reply-'+r.id, tone:'red', title:'Reply to '+(r.name||'them'),
      sub: reply ? 'They replied '+ago(reply.occurred_at)+'.' : 'They are waiting on you.',
      min:5, cta:'Reply', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  /* Capped like the brief- block below, so a long backlog in any one
     category cannot fill all 5 slots and crowd out the others - Today is
     meant to show a few things of different kinds, not the most numerous
     kind. */
  people.filter(r=>r.status==='ready_to_contact').slice(0,2).forEach(r=>{
    out.push({id:'send-'+r.id, tone:'amber',
      title:(r.ai_draft?'Send your first message to ':'Write to ')+(r.name||'them'),
      sub: r.ai_draft ? 'Draft is written and waiting for your review.' : 'You marked them ready. Mighty can draft it.',
      min: r.ai_draft?4:8, cta: r.ai_draft?'Review & send':'Draft it', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  /* Matches the "gone quiet" count buildSnapshot shows in Today's summary
     sentence and the "Follow up" cta nextAction() already uses elsewhere -
     without this, the summary could say "3 gone quiet" with zero matching
     cards below it. */
  people.filter(r=>r.status==='contacted' && days(r.contacted_at)>=10).slice(0,2).forEach(r=>{
    out.push({id:'quiet-'+r.id, tone:'amber', title:'Follow up with '+(r.name||'them'),
      sub:'You reached out '+(ago(r.contacted_at)||'a while ago')+' with nothing back yet.',
      min:5, cta:'Follow up', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  tasks.filter(t=>!t.done).forEach(t=>{
    const overdue = t.due_date && new Date(t.due_date).getTime() < Date.now()-DAY;
    const person = people.find(p=>p.id===t.log_id);
    out.push({id:'task-'+t.id, tone:overdue?'red':'amber', title:t.label,
      sub:(t.sub || (person? person.name : '')) + (t.due_date? (overdue?' · overdue':' · due '+dateShort(t.due_date)) : ''),
      min:5, cta:'Open', taskId:t.id,
      go: person ? {screen:'profile', id:person.id, tab:'notes'} : {screen:'relationships'}});
  });

  people.filter(r=>['coffee_chat','replied'].indexOf(r.status)>=0).forEach(r=>{
    const met = lastOf(r,['coffee_chat']);
    const note = lastOf(r,['note']);
    if(met && (!note || new Date(note.occurred_at) < new Date(met.occurred_at)) && days(met.occurred_at)<=5)
      out.push({id:'cap-'+r.id, tone:'green', title:'Capture your conversation with '+(r.name||'them'),
        sub:'You met '+ago(met.occurred_at)+' and nothing is written down yet.', min:5, cta:'Add notes',
        go:{screen:'profile', id:r.id, tab:'notes'}});
  });

  people.filter(r=>r.status==='prospect' && !(r.briefing&&r.briefing.careerSummary)).slice(0,2).forEach(r=>{
    out.push({id:'brief-'+r.id, tone:'purple', title:'Understand '+(r.name||'them')+' before you reach out',
      sub:(r.context&&r.context.whySaved) ? r.context.whySaved.slice(0,90) : 'Saved '+(ago(r.shortlisted_at)||'recently')+'. No brief yet.',
      min:6, cta:'Prepare me', go:{screen:'profile', id:r.id, tab:'brief'}});
  });

  const rank = {red:0, amber:1, green:2, purple:3, grey:4};
  out.sort((a,b)=>(rank[a.tone]-rank[b.tone]));
  const plan = out.slice(0,5);
  if(plan.length<5) plan.push({id:'discover', tone:'grey', title:'Find one person worth knowing',
    sub:'Five good people beat fifty saved profiles.', min:3, cta:'Find someone', go:{screen:'relationships'}});
  return plan;
}
/* The single sentence under the greeting - built from the exact literal
   templates buildPlan itself writes (title/sub), so this is string surgery
   on text this same file already produced, not free-floating fabrication.
   Never invents a fact buildPlan did not already compute. */
function heroLine(t, peopleLen){
  if(!t) return peopleLen>0 ? "Nothing urgent right now. A good day to find someone new."
    : "Nothing real to act on yet. Save someone and this fills in.";
  if(t.id.startsWith('reply-')){
    const name = t.title.replace(/^Reply to /,'');
    const when = t.sub.replace('They replied ','').replace(/\.$/,'');
    return name+' replied '+when+". Momentum is back, don't let it stall.";
  }
  if(t.id.startsWith('send-')){
    const name = t.title.replace(/^(Send your first message to |Write to )/,'');
    return t.cta==='Review & send' ? name+"'s draft is ready. Sending it keeps things moving."
      : 'Time to reach out to '+name+'.';
  }
  if(t.id.startsWith('quiet-')){
    const name = t.title.replace(/^Follow up with /,'');
    return name+' has gone quiet. A short nudge beats losing the thread.';
  }
  if(t.id.startsWith('cap-')){
    const name = t.title.replace(/^Capture your conversation with /,'');
    return 'You met '+name+' recently. Write it down before it fades.';
  }
  if(t.id.startsWith('brief-')){
    const name = t.title.replace(/ before you reach out$/,'').replace(/^Understand /,'');
    return name+' is saved and ready for a closer look before you reach out.';
  }
  if(t.id.startsWith('task-')) return t.title+'.';
  return "Five good people beat fifty saved profiles - worth a look today.";
}
const HERO_VERB = {Reply:'Reply now', 'Review & send':'Review & send', 'Draft it':'Draft it',
  'Follow up':'Follow up', 'Add notes':'Add notes', 'Prepare me':'Prepare me',
  'Find someone':'Find someone', 'Open':'Open'};
/* Only a real signal earns HIGH IMPACT - urgent by tone, or a draft that is
   already written and one click from sending. Everything else is GOOD NEXT,
   never invented per-item drama the underlying data cannot back. */
const isHighImpact = (t)=> t.tone==='red' || t.cta==='Review & send';

/* Real counts, not a fabricated "68% there" - see GoalFunnel's own note on
   why. This is the compact, goal-specific version for Today: identified,
   waiting-on-you, and a weekly meeting target with a dot tracker. The Goal
   tab shows the fuller stage-by-stage funnel instead. */
function GoalStrip({people, events, settings}){
  if(!canSee('progress', people)) return null;
  const byLog = {};
  events.forEach(e=>{ (byLog[e.log_id]=byLog[e.log_id]||[]).push(e); });
  const f = goalFunnel(people);
  const waiting = people.filter(r=>needsReply(r, byLog)).length;
  const target = settings.weeklyMeetingTarget || 3;
  const metThisWeek = events.filter(e=>e.event_type==='stage_change' &&
    ['coffee_chat','referral','interview','offer'].indexOf((e.extracted||{}).to)>=0 && days(e.occurred_at)<=7).length;
  const metCapped = Math.min(metThisWeek, target);
  const goalKey = goalTypeList(settings)[0];
  return (
    <div className="card" style={{padding:'18px 22px',display:'flex',justifyContent:'space-between',
      alignItems:'center',gap:16,flexWrap:'wrap'}}>

        <div className="sub" style={{fontSize:13.5,marginTop:5}}>
          {f.saved} identified · {waiting} replied, waiting on you · {metCapped} of {target} meetings
        </div>
      </div>

        <div className="row" style={{gap:6,marginTop:8,justifyContent:'flex-end'}}>
          {Array.from({length:target}).map((_,i)=>(
            <span key={i} style={{width:13,height:13,borderRadius:999,boxSizing:'border-box',

const TONE = {red:'#C75B33', amber:'#E3A23C', green:'#2E8B5F', purple:'#5B4FE9', grey:'#C9C6BF'};
/* A flat white card with only a small colored dot reads as one undifferentiated
   list - the dot is easy to miss entirely at a glance. A soft wash of the same
   tone across the whole card makes urgency visible before you've read a word. */
const TONE_BG = {red:'#FBEFE9', amber:'#FDF3E4', green:'#EDF6EF', purple:'var(--brand-soft)', grey:'var(--card2)'};

/* Does r need a reply from the user right now? Same test buildPlan uses for
   its 'reply-' item: the last thing that happened was them, not us. */
function needsReply(r, byLog){
  if(r.status!=='replied') return false;
  const list = byLog[r.id]||[];
  const reply = list.filter(e=>e.event_type==='reply').slice(-1)[0];
  const mine  = list.filter(e=>e.event_type==='first_message'||e.event_type==='note').slice(-1)[0];
  return !mine || !reply || new Date(reply.occurred_at) > new Date(mine.occurred_at);
}

/* What an executive gets in the morning: a few sentences that vary with what
   is actually true today, not a fixed panel of numbers repeated forever.
   Every clause here is a real count, and a clause is dropped entirely rather
   than shown at zero - that is the whole difference between this and a
   dashboard. No bar, no percentage, no score: see docs on the product's one
   hard rule. */
function buildSnapshot(people, events, tasks, settings, plan){
  const byLog = {};
  events.forEach(e=>{ (byLog[e.log_id] = byLog[e.log_id]||[]).push(e); });
  const added = people.length;
  const contactedOrBeyond = people.filter(r=>REACHED.includes(r.status)).length;
  const talking = people.filter(r=>['replied','coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length;
  const met = people.filter(r=>['coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length;
  const waiting = people.filter(r=>needsReply(r, byLog)).length;
  const quiet = people.filter(r=>r.status==='contacted' && days(r.contacted_at)>=10).length;

  const cap = PLAN_CAPS[(plan)||'trial'] || 50;
  const nearCap = added >= cap*0.8;

  const prev = settings.todaySnapshot;
  const prevAgeDays = prev && prev.at ? Math.floor((Date.now()-new Date(prev.at).getTime())/DAY) : null;
  let delta = null;
  if(prev && prevAgeDays!=null && prevAgeDays>=6){
    const addedSince = added - (prev.added||0);
    const metSince = met - (prev.met||0);
    const bits = [];
    if(addedSince>0) bits.push(addedSince+' new since last week');
    if(metSince>0) bits.push(metSince+' met since then');
    if(bits.length) delta = bits.join(', ');
  }
  const shouldResnapshot = !prev || prevAgeDays==null || prevAgeDays>=6;

  return {added, contactedOrBeyond, talking, met, waiting, quiet, nearCap, cap, delta, shouldResnapshot};
}

     don't already say, so these are phrased as real questions, grounded in

/* ===================== Relationships =====================
   One list, one question: where am I with everyone. It used to be two
   screens - Discover for people not yet saved, Relationships for people who
   were - and that split forced a user to decide which kind of person they
   were thinking about before they could even look. They rarely know; a name
   that comes to mind is just a name, saved or not.

   So one search box now does both jobs. Empty, it groups everyone already
   saved by what is true about them right now - reply needed first, because
   nothing else is more urgent than a person who took the time to answer -
   and closes with the people Mighty thinks are worth adding, ranked the same
   way Discover used to rank them. Typed into, it filters the saved list AND
   searches the user's own connections at once, because "who is Priya" should
   not care whether Priya was already added.

   Three ways in, in the order they are actually useful, survive from the old
   Discover:
   1. An open box over the user's OWN connections - no keyword extraction, no
      model call, because the answer is already in the database.
   2. LinkedIn, for people the user is not connected to - the expensive path,
      and the explicit second choice, offered only once the first comes up
      empty.
   3. The ranking nobody asked for: dormancy, goal fit, shared history. */

/* Words that carry no retrieval signal.
   Two-letter terms are KEPT, because AI, VC, ML and PM are the shortest and most
   important words anyone will type here. That means the stop list has to carry
   the short function words itself rather than leaning on a length cut-off: an
   earlier version filtered anything under three characters, which threw away AI
   and VC while happily keeping "and". */
const Q_STOP = new Set([
  // function words, including the short ones a length filter used to catch
  'a','an','the','and','or','of','in','on','at','to','is','it','as','by','be','if','so','do','my','me',
  'we','us','he','so','no','up','all','any','are','was','has','had','can','not','but','for','you','your',
  'yours','who','whom','what','when','where','which','while','with','from','that','this','these','those',
  'they','them','their','there','then','than','been','into','also','over','under','after','before','more',
  'most','much','many','some','such','only','just','very','ever','even','same','other','others','would',
  'could','should','will','here','out','how','why','get','got','give','given','take','taken','make','made',
  'use','used','using','per','via','yet','far','now','off','own','see','say','set','due','one','two',
  // words about the search rather than the person
  'anyone','anybody','people','folks','person','someone','somebody','looking','look','find','found',
  'about','like','want','wants','need','needs','know','knows','help','helps','best','good','ones',
  'companies','company','working','works','work','worked']);

function queryTerms(text){
  /* Alphanumeric only, deliberately. Terms go into a Postgres regex on the other
     side, and a stray + or * there is either a syntax error or a silent wrong
     match. Stripping the characters here is safer than escaping them there. */
  const seen = {}, out = [];
  String(text||'').toLowerCase().split(/[^a-z0-9]+/).forEach(w=>{
    if(w.length < 2 || Q_STOP.has(w) || seen[w]) return;
    seen[w] = 1; out.push(w);
  });
  return out.slice(0, 10);
}

/* The terms the ranking searches on when the user has not asked anything. Roles
   and companies and places the user named in their strategy come first because
   they were stated rather than inferred; words from the goal sentence fill in. */
function goalTerms(settings){
  const s = settings || {};
  const named = [].concat(s.targetRoles||[], s.targetCompanies||[], s.targetLocations||[])
    .join(' ');
  return queryTerms(named + ' ' + (s.goal||''));
}

/* Every employer the user has had, so "was there while you were" is checkable.
   Reads the Knowledge Base the archive filled in, and falls back to whatever the
   strategy form knows if there is no archive. */
function ownCompanies(settings){
  const s = settings || {}, kb = s.knowledge || {};
  const fromKb = (kb.positions||[]).map(p=>p && p.company).filter(Boolean);
  const all = fromKb.concat([s.currentCompany].filter(Boolean));
  const seen = {}, out = [];
  all.forEach(c=>{ const k = String(c).toLowerCase().trim();
    if(k && !seen[k]){ seen[k]=1; out.push(String(c).trim()); } });
  return out.slice(0, 25);
}

function connName(c){
  return clean([c.first_name, c.last_name].filter(Boolean).join(' ')) || 'Unnamed connection';
}

/* Why this person is in front of you, in words, from the three signals the
   database can actually support. Never more than two clauses: a reason nobody
   reads is the same as no reason. */
function connReason(c){
  const bits = [];
  if(c.shared_company) bits.push('Was at ' + c.shared_company + ' while you were');
  if(c.hits && c.hits.length) bits.push('Matched on ' + c.hits.slice(0,3).join(', '));
  const yrs = Number(c.years_silent || 0);
  if(bits.length < 2 && c.connected_on && yrs >= 2){
    bits.push('Connected ' + String(c.connected_on).slice(0,4) + ', nothing since');
  }
  return bits.slice(0,2).join('. ') + (bits.length ? '.' : '');
}

/* Turn a connections row into the shape savePerson already understands, so
   adding from your own network and adding from a search write the same row. */
function connToPerson(c){
  return {
    profileUrl: c.profile_url,
    name: connName(c),
    title: clean(c.position) || null,
    company: clean(c.company) || null,
    why: connReason(c),
    common: (c.hits||[]).slice(0,4),
    connectedOn: c.connected_on || null,
    avatarUrl: c.avatar_url || null,
  };
}

/* Relationship caps per plan. The database is authoritative (ai_config), these
   are the same defaults so the number can be shown without a round trip. */
const PLAN_CAPS = {trial:50, starter:100, plus:200, pro:500, explorer:100, builder:200, leader:500};

async function matchConnections(sb, terms, ownCos, limit){
  const {data, error} = await sb.rpc('connections_match', {
    p_terms: terms || [], p_own_companies: ownCos || [], p_limit: limit || 12});
  if(error) throw error;
  return data || [];
}

function nextAction(r){
  switch(r.status){
    case 'prospect':         return (r.briefing&&r.briefing.careerSummary) ? 'Draft a message' : 'Prepare me';
    case 'ready_to_contact': return r.ai_draft ? 'Review draft' : 'Draft a message';
    case 'contacted':        return days(r.contacted_at)>=10 ? 'Follow up' : 'Waiting on them';
    case 'replied':          return 'Reply';
    case 'coffee_chat':      return 'Capture notes';
    /* referral/interview/offer are merged into one Board column ("Growing")
       but fell through to the same 'Keep in touch' default as a dormant
       contact, making an active interview or open offer visually
       indistinguishable from someone gone quiet. Capture notes is a real
       action that already exists (the Notes tab), not an invented one. */
    case 'referral': case 'interview': case 'offer': return 'Capture notes';
    case 'do_not_contact':   return ' - ';
    default:                 return 'Keep in touch';
  }
}

/* Decision Memory: the reason behind a save or a pass is worth more than the
   save or pass itself - it is judgment, not activity. Kept deliberately
   optional (a dismissible chip row, never a gate in front of the action) and
   deliberately small (one enum choice, no free text) so it costs nothing to
   answer and nothing to skip. */
const SAVE_REASONS = [
  {id:'customer',   label:'Potential customer'},
  {id:'investor',   label:'Investor'},
  {id:'mentor',     label:'Mentor'},
  {id:'recruiter',  label:'Recruiter'},
  {id:'partner',    label:'Partner'},
  {id:'friend',     label:'Friend'},
  {id:'other',      label:'Other'},
];
const SKIP_REASONS = [
  {id:'too_junior',      label:'Too junior'},
  {id:'wrong_industry',  label:'Wrong industry'},
  {id:'no_overlap',      label:'No overlap'},
  {id:'not_now',         label:'Not now'},
  {id:'already_know',    label:'Already know them'},
];
function ReasonChips({prompt, options, onPick, onDismiss}){
  return (
    <div className="row" style={{gap:6,flexWrap:'wrap',alignItems:'center'}}>
      <span className="meta" style={{marginRight:2,flex:'none'}}>{prompt}</span>
      {options.map(o=>(
        <button key={o.id} className="chip" style={{fontSize:12,padding:'4px 10px'}} onClick={()=>onPick(o.id)}>{o.label}</button>))}
      <button className="btn q" style={{fontSize:12,padding:0,color:'var(--mute)'}} onClick={onDismiss}>Skip this</button>
    </div>
  );
}
function Relationships({sb, settings, people, events, tasks, view, setView, plan, onSave, onOpen, onStage, onDelete, onUpdate, go}){
  const boardOK = canSee('board', people, events);
  const timeOK  = canSee('timeline', people, events);
  const [dragId,setDrag] = useState(null);
  const [overCol,setOver] = useState(null);
  /* List's select/delete - a Set so toggling one row's checkbox never has to
     rebuild an array, and membership checks (is this row selected) stay O(1)
     while the list re-renders on every keystroke of the search box above. */
  const [selected,setSelected] = useState(()=>new Set());
  const toggleSelect = (id)=>setSelected(s=>{ const n=new Set(s); if(n.has(id)) n.delete(id); else n.add(id); return n; });

  /* ---- the search box: filters who is saved, and finds who is not ---- */
  const [q,setQ]           = useState('');
  const [total,setTotal]   = useState(null);
  const [sugg,setSugg]     = useState(null);
  const [suggBusy,setSB]   = useState(true);
  const [mine,setMine]     = useState(null);
  const [mineBusy,setMB]   = useState(false);
  /* A Set, not a single value - saving is a shared state across every row
     on screen (worth-adding + web search results can both be visible at
     once), and one scalar meant starting a second save cleared the first
     row's in-flight flag early, re-enabling its Add button mid-request. */
  const [savingUrls,setSavingUrls] = useState(()=>new Set());
  const startSaving = (url)=>setSavingUrls(s=>new Set(s).add(url));
  const stopSaving = (url)=>setSavingUrls(s=>{ const n=new Set(s); n.delete(url); return n; });

  /* ---- LinkedIn, the fallback for someone not in the user's own network ---- */
  const [webOpen,setWebOpen] = useState(false);
  const [webQ,setWebQ]     = useState('');
  const [phase,setPhase]   = useState('idle');
  const [results,setRes]   = useState([]);
  const [webErr,setWebErr] = useState(null);
  const [notice,setNote]   = useState(null);
  const [skipped,setSkip]  = useState({});
  /* {profileUrl, kind:'save'|'skip', rowId} of whichever row is currently
     showing its optional reason chips - one at a time is plenty, and it
     collapses to null (no prompt shown) the moment a choice is made or
     dismissed. */
  const [reasonPrompt,setReasonPrompt] = useState(null);
  /* Saving already best-effort-fetches a photo the moment someone is added,
     but that call needs the extension live in this exact tab at that exact
     moment - miss it (bulk-added while the extension wasn't connected, added
     from a device without it, etc.) and the row is stuck on initials with no
     retry. This sweeps every saved person still missing one, one request at
     a time - the same extBridge.photo() the per-person "Add photo" button
     already uses - rather than making it a per-person chore. */
  const [photoBackfill,setPhotoBackfill] = useState(null);
  async function bulkFetchPhotos(){
    const targets = people.filter(p=>!p.avatar_url && p.profile_url);
    if(!targets.length) return;
    if(!extBridge.isReady()){
      alert("The Mighty extension isn't connected in this tab right now - photos are read live from LinkedIn through it, so nothing can be fetched until it's active. Open a LinkedIn tab with the extension on, then try again.");
      return;
    }
    setPhotoBackfill({done:0, total:targets.length});
    for(let i=0;i<targets.length;i++){
      try{
        const r = await extBridge.photo(targets[i].profile_url);
        if(r && r.ok && r.dataUrl) await onUpdate(targets[i], {avatar_url:r.dataUrl});
      }catch(e){}
      setPhotoBackfill({done:i+1, total:targets.length});
      await new Promise(res=>setTimeout(res, 350));
    }
    setPhotoBackfill(null);
  }
  function finishSkip(profileUrl, reasonId){
    if(reasonId) track('candidate_skipped', {reason:reasonId});
    setSkip(s=>({...s,[profileUrl]:true}));
    setReasonPrompt(null);
  }
  async function finishSaveReason(row, reasonId){
    if(row && reasonId){
      try{ await onUpdate(row, {context:{...(row.context||{}), saveReason:reasonId}}); }catch(e){}
      track('save_reason_picked', {reason:reasonId});
    }
    setReasonPrompt(null);
  }
  const [lastQuery,setLastQ] = useState('');
  const [noExt,setNoExt]   = useState(false);

  const savedUrls = useMemo(()=>{
    const m = {}; people.forEach(r=>{ if(r.profile_url) m[r.profile_url.toLowerCase()]=r; }); return m;
  },[people]);
  const cap = PLAN_CAPS[plan||'trial'] || 50;
  const atCap = people.length >= cap;
  const terms = useMemo(()=>goalTerms(settings),[settings]);
  const ownCos = useMemo(()=>ownCompanies(settings),[settings]);
  const byLog = useMemo(()=>{
    const m = {}; events.forEach(e=>{ (m[e.log_id]=m[e.log_id]||[]).push(e); }); return m;
  },[events]);

  /* The ranking loads on arrival, because a screen that asks you to press a
     button before it shows you anything has not answered its own question. */
  useEffect(()=>{
    let dead = false;
    (async()=>{
      setSB(true);
      try{
        const {data:n} = await sb.rpc('connections_count');
        if(!dead) setTotal(Number(n||0));
        const rows = await matchConnections(sb, terms, ownCos, 8);
        if(!dead){ setSugg(rows); track('discover_ranked', {returned:rows.length, terms:terms.length}); }
      }catch(e){ if(!dead) setSugg([]); }
      if(!dead) setSB(false);
    })();
    return ()=>{ dead = true; };
  },[sb, terms.join(' '), ownCos.join(' ')]);

  /* Typing searches the user's own connections as they go, debounced so every
     keystroke does not round-trip. */
  useEffect(()=>{
    const sentence = clean(q);
    if(sentence.length<2){ setMine(null); return; }
    let dead = false; setMB(true);
    const t = setTimeout(async()=>{
      try{
        const qt = queryTerms(sentence);
        const rows = await matchConnections(sb, qt, [], 8);
        if(!dead){
          setMine({q:sentence, terms:qt, rows}); track('discover_own_search', {terms:qt.length, results:rows.length});
          /* The LinkedIn export this table is built from has no photo column
             at all, so every connection starts as initials - not just the
             ones surfaced by a search. Same fill-in as the wider search
             results below: one profile read per person, through the
             extension's own globally-throttled queue (3s apart, capped at
             25/session), patched in as each resolves. */
          rows.forEach(c=>{
            extBridge.photo(c.profile_url).then(r=>{
              if(dead || !r || !r.ok || !r.dataUrl) return;
              setMine(prev=>prev && prev.q===sentence
                ? {...prev, rows:prev.rows.map(x=>x.profile_url===c.profile_url?{...x, avatar_url:r.dataUrl}:x)}
                : prev);
            }).catch(()=>{});
          });
        }
      }catch(e){ if(!dead) setMine({q:sentence, terms:[], rows:[]}); }
      if(!dead) setMB(false);
    }, 380);
    return ()=>{ dead = true; clearTimeout(t); };
  },[q, sb]);

  /* "Who do I already know" and "who don't I know yet" used to be two
     separate questions - the second only ran if you noticed a button and
     clicked it again. They are one question with two answers, so once the
     sentence settles, both run. A longer pause than the local match above
     (900ms vs 380ms) keeps a sentence that is still being typed from firing
     three overlapping Google searches. autoRun tracks the exact sentence
     already sent, so re-settling on an unchanged query does not search
     twice, and so an explicit click on "Search LinkedIn for this" is not
     redone by this effect a moment later. */
  const autoRun = useRef('');
  useEffect(()=>{
    const sentence = clean(q);
    if(sentence.length<3) return;
    const t = setTimeout(()=>{
      if(autoRun.current===sentence) return;
      if(phase==='searching' || phase==='thinking') return;
      autoRun.current = sentence;
      run(sentence);
    }, 900);
    return ()=>clearTimeout(t);
  },[q]);

  async function run(text){
    const sentence = clean(text!=null?text:webQ);
    if(!sentence || phase==='searching' || phase==='thinking') return;
    setWebErr(null); setNote(null); setNoExt(false); setRes([]); setSkip({});
    setPhase('searching'); setLastQ(sentence); setWebQ(sentence); setWebOpen(true);
    try{
      const kw = await toKeywords(sb, sentence, settings);

      /* Ask the extension first. It reads the results page itself, so it comes
         back with location, education, experience and follower counts - the API
         path returns a title and a link and nothing else. Fall back to the edge
         function only when the extension is not installed. */
      let found = [], via = 'ext';
      const bridged = await extBridge.search(kw);
      if(bridged && bridged.ok){
        found = (bridged.people||[]).filter(p=>p && p.profileUrl);
      } else if(bridged && bridged.error==='blocked'){
        track('search_blocked', {});
        setWebErr('Search is rate limited right now, so results would be incomplete. Try again in a few minutes.');
        setPhase('idle'); return;
      } else {
        const {data, error} = await sb.functions.invoke('people-search', {body:{query:kw}});
        if(error) throw error;
        if(!data || data.ok===false){
          if(data && data.error==='not_configured') setNoExt(true);
          else setWebErr((data && (data.message||data.error)) || 'Search failed.');
          setPhase('idle'); return;
        }
        found = (data.people||[]).filter(p=>p && p.profileUrl);
        via = 'api';
      }
      track('search_run', {via, results:found.length,
        with_facts: found.filter(p=>p.location||p.education).length});

      if(!found.length){
        setNote('Nothing for that one. A role and a place works best: "product leaders in Boston" beats "smart people in AI".');
        setPhase('idle'); return;
      }
      setRes(found); setPhase('thinking');
      try{ setRes(await evaluate(sb, found, settings)); }
      catch(e){ setNote('Found these, but Mighty could not explain the matches just now: '+(e.message||'AI unavailable')+'.'); }
      setPhase('done');

      /* Google never returns a photo for a site:linkedin.com/in query - only
         a name and a link - so every fresh result starts as initials. Filling
         them in means reading each profile once, which is exactly what the
         extension's photo fetch already exists for. It is fired here for the
         whole batch, but it queues through the extension's own single global
         chain (fetchProfilePhotoInner in background.js), so this is still one
         photo every 3 seconds and still capped at 25 for the session - the
         same guard that already protects the Profile page's manual button,
         just aimed at a batch instead of one click at a time. Started only
         after evaluate() above has already settled results, so an early
         photo cannot be wiped out by evaluate()'s own setRes(...) landing
         later. Best-effort and silent: a slow or missing photo just stays
         initials, never an error the person has to see. */
      found.forEach(person=>{
        extBridge.photo(person.profileUrl).then(r=>{
          if(r && r.ok && r.dataUrl){
            setRes(prev=>prev.map(x=>x.profileUrl===person.profileUrl?{...x, avatarUrl:r.dataUrl}:x));
          }
        }).catch(()=>{});
      });
    }catch(e){ setWebErr(e.message||String(e)); setPhase('idle'); }
  }

  const visible = results.filter(r=>!skipped[r.profileUrl]);
  const webBusy = phase==='searching' || phase==='thinking';

  /* One row, used by the search results and the ranking, so a person you
     found and a person Mighty suggested cannot drift apart visually. */
  function ConnRow({c}){
    const saved = savedUrls[(c.profile_url||'').toLowerCase()];
    const reason = connReason(c);
    return (
      <div className="row" style={{alignItems:'flex-start',gap:13,padding:'14px 0',borderBottom:'1px solid var(--line2)'}}>
        <Avatar name={connName(c)} size={34} src={c.avatar_url} hover={c}/>
        <div style={{flex:'1 1 200px',minWidth:0}}>
          <div style={{fontSize:15,fontWeight:700}}>{connName(c)}</div>
          <div className="sub" style={{fontSize:13.5,marginTop:1}}>
            {[clean(c.position), clean(c.company)].filter(Boolean).join(' · ') || 'No role on the export'}
          </div>
          {reason && <div style={{fontSize:13,color:'var(--brand-ink)',marginTop:4,lineHeight:1.5}}>{reason}</div>}
        </div>
        <div style={{display:'flex',gap:8,flex:'none',alignItems:'center'}}>
          {saved
            ? <button className="btn g sm" onClick={()=>onOpen(saved.id)}>Open</button>
            : <F>
                <button className="btn sm" disabled={atCap || savingUrls.has(c.profile_url)}
                  onClick={async()=>{ startSaving(c.profile_url); try{ await onSave(connToPerson(c), 'own_network'); }finally{ stopSaving(c.profile_url); } }}>
                  {savingUrls.has(c.profile_url) ? <span><span className="spin"/> Adding</span> : 'Add'}
                </button>
                <button className="btn q" style={{fontSize:13}}
                  onClick={()=>setSugg(s=>(s||[]).filter(x=>x.profile_url!==c.profile_url))}>Skip</button>
              </F>}
        </div>
      </div>
    );
  }

  /* One row for someone already saved, used by every stage group below. Reply
     needed is the one case that gets a warmer background - the whole point of
     grouping is that this row should never be mistaken for a quiet one. */
  function Row({r, hot}){
    const label = nextAction(r);
    const statusOnly = label==='Waiting on them' || label==='Keep in touch' || label===' - ';
    const checked = selected.has(r.id);
    return (
      <div onClick={()=>onOpen(r.id)} className="lift"
        style={{display:'flex',alignItems:'center',gap:16,padding:'15px 24px',
          borderBottom:'1px solid var(--line2)',cursor:'pointer',
          background: checked ? 'var(--brand-soft)' : (hot ? '#FBEFE9' : 'none')}}>
        <input type="checkbox" checked={checked} onClick={e=>e.stopPropagation()}
          onChange={()=>toggleSelect(r.id)} style={{flex:'none',width:16,height:16,cursor:'pointer'}}/>
        <Avatar name={r.name} size={34} src={r.avatar_url} hover={r}/>
        <div style={{flex:'1 1 220px',minWidth:0}}>
          <div className="row" style={{gap:7}}>
            <div style={{fontSize:15.5,fontWeight:700,letterSpacing:'-.01em',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.name||'Unnamed'}</div>
            <ConnectedBadge r={r} size="sm"/>
          </div>
          <div style={{fontSize:13,color:'var(--mute)',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.title||(r.context||{}).whySaved||'Saved profile'}</div>
        </div>
        <div className="meta" style={{flex:'none'}}>{ago(r.updated_at||r.shortlisted_at)}</div>
        <span style={{fontSize:12.5,fontWeight:700,flex:'none',borderRadius:999,whiteSpace:'nowrap',
          padding: statusOnly ? '5px 12px' : '6px 13px',
          color: statusOnly ? 'var(--mute)' : '#fff',
          background: statusOnly ? 'var(--line2)' : (hot?'#C75B33':'var(--brand)')}}>{label}</span>
      </div>);
  }

  const searching = clean(q).length>=2;
  const needle = clean(q).toLowerCase();
  const filtered = useMemo(()=>{
    if(!searching) return people;
    return people.filter(r=>[r.name,r.title,r.company].filter(Boolean).join(' ').toLowerCase().indexOf(needle)>=0);
  },[people, searching, needle]);

  /* Three tiers, not six stage-groups: one single top recommendation (the
     same ranking Today's hero uses), everyone who needs a reply from you
     right now, and everything else in one flat list. A person appears in
     exactly one tier - top pick first, then reply-needed, then the rest -
     so nobody is counted twice. */
  const todayPlan = useMemo(()=>buildPlan(people, events, tasks||[]), [people, events, tasks]);
  const topPick = todayPlan[0] && todayPlan[0].id!=='discover' ? todayPlan[0] : null;
  const topPickId = topPick && topPick.go && topPick.go.screen==='profile' ? topPick.go.id : null;
  const closed = filtered.filter(r=>r.status==='do_not_contact').length;
  const replyRows = filtered.filter(r=>r.status!=='do_not_contact' && r.id!==topPickId && needsReply(r, byLog));
  const restRows  = filtered.filter(r=>r.status!=='do_not_contact' && r.id!==topPickId && !needsReply(r, byLog));

  const nameOf = (id)=>{ const p=people.find(x=>x.id===id); return p?(p.name||'Unnamed'):' - '; };
  const personOf = (id)=>people.find(x=>x.id===id)||null;

  /* One honest description per stage transition, since the from/to pair is
     all a stage_change event actually carries - no invented narrative, just
     the plain reason each transition happens in this product. */
  const STAGE_WHY = {
    contacted: 'You reviewed the draft and sent it', replied: 'Updated automatically from their reply',
    ready_to_contact: 'Marked ready to reach out', coffee_chat: 'Logged after you met',
    do_not_contact: 'Closed out', prospect: 'Saved',
  };
  const sameDay = (a,b)=> a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const dateGroupLabel = (iso)=>{
    const d = new Date(iso), now = new Date();
    const y = new Date(now); y.setDate(now.getDate()-1);
    const long = d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
    if(sameDay(d,now)) return 'TODAY · '+long.toUpperCase();
    if(sameDay(d,y)) return 'YESTERDAY · '+long.toUpperCase();
    return long.toUpperCase();
  };
  /* hour12 forced explicitly - without it, toLocaleTimeString's 12-vs-24-hour
     choice follows the viewer's browser locale rather than a deliberate
     design decision, so the same row read "2:48 PM" for one visitor and
     "14:48" for another. */
  const timeOfDay = (iso)=> new Date(iso).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',hour12:true});

  /* The feed merges two kinds of history: real outreach_events, and a
     synthetic "saved" entry per day - shortlisted_at is real data, it just
     never got written to outreach_events, so it is grouped here at display
     time rather than invented. */
  const rawFeed = useMemo(()=>{
    const evItems = events.map(e=>({
      id:'e'+e.id, kind: e.event_type==='stage_change' ? 'stage_change' : e.event_type,
      occurred_at:e.occurred_at, personId:e.log_id, extracted:e.extracted, note:e.note,
    }));
    const byDay = {};
    people.forEach(r=>{
      if(!r.shortlisted_at) return;
      const key = new Date(r.shortlisted_at).toDateString();
      (byDay[key]=byDay[key]||[]).push(r);
    });
    const savedItems = Object.keys(byDay).map(key=>{
      const rows = byDay[key];
      const latest = rows.reduce((a,r)=>new Date(r.shortlisted_at)>new Date(a.shortlisted_at)?r:a, rows[0]);
      return {id:'saved-'+key, kind:'saved', occurred_at:latest.shortlisted_at, people:rows};
    });
    return evItems.concat(savedItems).sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at)).slice(0,80);
  },[events, people]);

  const TIME_CATS = [
    {key:'all',   label:'All',            test:()=>true},
    {key:'stage', label:'Stage changes',  test:e=>e.kind==='stage_change'},
    {key:'reply', label:'Replies',        test:e=>e.kind==='reply'},
    {key:'note',  label:'Notes',          test:e=>e.kind==='note'},
    {key:'saved', label:'Saved',          test:e=>e.kind==='saved'},
  ].filter(c=>c.key==='all' || rawFeed.some(c.test));
  const [feedCat,setFeedCat] = useState('all');
  const activeCat = TIME_CATS.find(c=>c.key===feedCat) || TIME_CATS[0];
  const feed = rawFeed.filter(activeCat.test);

  const feedGroups = [];
  feed.forEach(item=>{
    const label = dateGroupLabel(item.occurred_at);
    let g = feedGroups.find(x=>x.label===label);
    if(!g){ g = {label, items:[]}; feedGroups.push(g); }
    g.items.push(item);
  });

  function feedEntry(item){
    if(item.kind==='saved'){
      const names = item.people.map(r=>firstName(r.name)||'Unnamed');
      const shown = names.length<=8 ? names : names.slice(0,7).concat(['+'+(names.length-7)+' more']);
      const label = item.people.length===1 ? 'You saved '+item.people[0].name
        : 'You saved '+item.people.length+' people';
      return {title:label,
        sub: shown.length>1 ? shown.slice(0,-1).join(', ')+' and '+shown.slice(-1) : shown[0],
        cta:'See list', onCta:()=>go({screen:'relationships', view:'list'})};
    }
    const person = personOf(item.personId);
    const name = person ? person.name||'Unnamed' : nameOf(item.personId);
    if(item.kind==='stage_change'){
      const to = item.extracted && item.extracted.to;
      return {title:name+' moved to '+((STAGE[to]||{label:to||''}).label),
        sub: STAGE_WHY[to] || 'Stage updated',
        cta:'Open profile', onCta:()=>person&&onOpen(person.id)};
    }
    if(item.kind==='reply')
      return {title:name+' replied', sub:(person&&person.title)||'They wrote back',
        cta:'Open profile', onCta:()=>person&&onOpen(person.id)};
    if(item.kind==='first_message')
      return {title:'You reached out to '+name, sub:item.note?item.note.slice(0,90):'Message sent',
        cta:'View message', onCta:()=>person&&onOpen(person.id,'draft')};
    if(item.kind==='note')
