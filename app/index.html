// "Who is this?" — the most recent real interaction, so a row reads like a
// relationship, not a database record.
const EVENT_LABEL = {reply:'They replied', coffee_chat:'Coffee chat', referral:'Referral', interview:'Interview', offer:'Offer', first_message:'Message sent', connection_request:'Connection request', note:'Note added', stage_change:'Moved forward'};
// Relationship score — deterministic, explainable, computed from real history
// only (depth of stage, reciprocity, momentum, recency). No AI, no invention.
const STAGE_DEPTH = {prospect:0, ready_to_contact:5, contacted:18, replied:34, coffee_chat:50, referral:60, interview:66, offer:72, do_not_contact:0};
function relationshipScore(row, evs){
  evs = evs||[];
  const factors = [];
  let score = STAGE_DEPTH[row.status] ?? 0;
  if(score) factors.push({label:stageLabel(row.status), pts:score});
  const replies = evs.filter(e=>e.event_type==='reply').length;
  if(replies){ const p=Math.min(14, replies*7); score+=p; factors.push({label:`${replies} repl${replies===1?'y':'ies'}`, pts:p}); }
  const chats = evs.filter(e=>e.event_type==='coffee_chat').length;
  if(chats){ const p=Math.min(12, chats*6); score+=p; factors.push({label:`${chats} coffee chat${chats===1?'':'s'}`, pts:p}); }
  const touches = evs.length;
  if(touches>2){ const p=Math.min(8, (touches-2)*2); score+=p; factors.push({label:`${touches} interactions`, pts:p}); }
  const lastT = evs.length ? Math.max(...evs.map(e=>new Date(e.occurred_at).getTime()))
    : new Date(row.contacted_at||row.shortlisted_at||row.updated_at).getTime();
  const days = Math.max(0,(now()-lastT)/864e5);
  const decay = days>180?-22:days>90?-14:days>60?-8:days>30?-3:0;
  if(decay){ score+=decay; factors.push({label:`Quiet ${Math.round(days)}d`, pts:decay}); }
  else if(days<=14){ score+=4; factors.push({label:'Recently active', pts:4}); }
  score = Math.max(0, Math.min(100, Math.round(score)));
  const label = score>=75?'Strong':score>=50?'Growing':score>=28?'Warm':score>0?'Early':'New';
  return {score, label, factors};
}
/* ---- Memory records ---------------------------------------------------------
   A memory is a single durable, typed, SOURCED, confidence-scored fact about a
   person. This is the product's moat, so it's first-class: every memory carries
   where it came from and how sure we are, a user can correct it (which pins it
   at 100% and permanently outranks the model), and it can expire. Stored as an array on
   outreach_log.context.memories — per-person, no migration, RLS already covers
   it; promote to its own table only if cross-person memory search is needed. */
const MEM_TYPES = {
  interest:  {bucket:'detail',  t:'Cares about'},
  personal:  {bucket:'detail',  t:'About them'},
  fact:      {bucket:'detail',  t:'Fact'},
  preference:{bucket:'detail',  t:'Prefers'},
  event:     {bucket:'detail',  t:'Happening'},
  context:   {bucket:'detail',  t:'Context'},
  promise:   {bucket:'promise', t:'You promised'},
  their_promise:{bucket:'their',t:'They promised'},
  starter:   {bucket:'starter', t:'Talk about'},
  shared:    {bucket:'shared',  t:'Shared ground'},
};
function memConfidence(c){
  c = (c==null?0.7:c);
  if(c>=0.75) return {level:'green', color:'#4B7A5E', label:'Confident'};
  if(c>=0.5)  return {level:'amber', color:'#8C7A50', label:'Likely'};
  return {level:'red', color:'#B5675A', label:'Unsure'};
}
function memList(row){ const m=(row.context||{}).memories; return Array.isArray(m)?m:[]; }
// Persist the memory array back onto the person, merging into context.
function writeMemories(row, updateRow, arr){
  return updateRow(row, { context: { ...(row.context||{}), memories: arr } });
}
function newMemory(o){
  return { id:'m'+Math.random().toString(36).slice(2,9)+Date.now().toString(36),
    type:o.type||'personal', value:String(o.value||'').trim(),
    confidence:o.confidence==null?0.7:o.confidence,
    // Gate: green commits, amber is a suggestion the user must confirm, red is
    // dropped before it ever reaches here. Suggestions never feed drafts or
    // briefings until confirmed — an uncertain guess must not become a "fact".
    status:o.status||'confirmed',
    sourceLabel:o.sourceLabel||'You', sourceKind:o.sourceKind||'user',
    visibility:o.visibility||'normal', permanent:!!o.permanent, expiresAt:o.expiresAt||null,
    pinned:!!o.pinned, createdAt:Date.now(), updatedAt:Date.now() };
}
// Confidence → gate decision. Callers drop 'red', suggest 'amber', commit 'green'.
function memGate(c){ c=(c==null?0.7:c); return c>=0.75?'commit':c>=0.5?'suggest':'drop'; }
// Unified read: real memory records first, then legacy coffee-chat extractions
// and briefing hints that predate the memory model — shown but not editable, so
// nothing already captured disappears. New writes always go to real records.
// Amber memories awaiting the user's yes/no. Never used anywhere but the
// confirm UI — structurally excluded from drafts, briefings and reasoning.
function suggestedMemories(row){
  return memList(row).filter(m=>m.status==='suggested' && !(m.expiresAt && new Date(m.expiresAt).getTime()<now() && !m.permanent));
}
function personMemories(row, evs){
  const out = [], seen = new Set();
  const push = m => { const k=(m.value||'').trim().toLowerCase(); if(!k||seen.has(k)) return; seen.add(k); out.push(m); };
  // 1. Real records — confirmed only (suggestions live in their own tray), skip expired
  memList(row).forEach(m=>{ if(m.status==='suggested') return; if(m.expiresAt && new Date(m.expiresAt).getTime()<now() && !m.permanent) return; push(m); });
  // 2. Legacy extractions from the timeline
  (evs||[]).slice().sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at)).forEach(e=>{
    const x=e.extracted||{}; const src=`Coffee chat, ${fmtDate(new Date(e.occurred_at).getTime())}`;
    (x.personalDetails||[]).forEach(d=>push({id:'ev'+e.id+d, type:'personal', value:d, confidence:0.7, sourceLabel:src, sourceKind:'coffee_chat', legacy:true}));
    (x.promises||[]).forEach(p=>push({id:'evp'+e.id+p, type:'promise', value:p, confidence:0.7, sourceLabel:src, sourceKind:'coffee_chat', legacy:true}));
  });
  // 3. Briefing hints
  const br=row.briefing||{};
  (br.conversationStarters||[]).slice(0,2).forEach(s=>push({id:'br'+s, type:'starter', value:s, confidence:0.6, sourceLabel:'AI briefing', sourceKind:'briefing', legacy:true}));
  if(br.sharedConnectionNote) push({id:'brs', type:'shared', value:br.sharedConnectionNote, confidence:0.6, sourceLabel:'AI briefing', sourceKind:'briefing', legacy:true});
  // pinned first, then by confidence
  return out.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || (b.confidence||0)-(a.confidence||0));
}
// Back-compat shim: older callers want {kind,text}.
function mightyKnows(row, evs){
  return personMemories(row, evs).map(m=>({kind:(MEM_TYPES[m.type]||{}).bucket||'detail', text:m.value})).slice(0,9);
}
function lastInteraction(row, evs){
  const ev = (evs||[]).slice().sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at))[0];
  if(ev) return {label: EVENT_LABEL[ev.event_type]||'Updated', when: rel(new Date(ev.occurred_at).getTime())};
  if(row.contacted_at) return {label:'Message sent', when: rel(new Date(row.contacted_at).getTime())};
  return {label:'Saved', when: rel(new Date(row.shortlisted_at||row.updated_at).getTime())};
}

/* ============================ App shell ============================ */
function App(){
  const [db,setDb] = useState(loadDB);
  const [tab,setTab] = useState('dashboard');
  const [sb,setSb] = useState(null);
  const [auth,setAuth] = useState({status:'loading', user:null});
  const [log,setLog] = useState([]);
  const [events,setEvents] = useState([]);
  const [tasks,setTasks] = useState([]);
  const [communityStats,setCommunityStats] = useState([]);
  const [drawerId,setDrawerId] = useState(null);
  const [drawerTab,setDrawerTab] = useState('profile');
  const [draftFor,setDraftFor] = useState(null); // row id, or null
  const lastSync = useRef(null);
  const saveTimer = useRef(null);

  const patch = (slice, val) => setDb(d=>({...d,[slice]: typeof val==='function'? val(d[slice]):{...d[slice],...val}}));
  // Keep the stage-label resolver in step with settings before anything renders.
  setActivePipeline(db.settings.pipeline, db.settings.stageLabels);

  useEffect(()=>{
    if(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase){
      try{ setSb(window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)); }catch(e){ setSb(null); }
    }
  },[]);

  useEffect(()=>{
    if(!sb){ setAuth({status:'unconfigured',user:null}); return; }
    let sub;
    const onUser = (u)=>{ setAuth({status:u?'in':'out', user:u}); if(u) pull(sb,u); else { setLog([]); setEvents([]); setTasks([]); } };
    sb.auth.getSession().then(({data})=>onUser(data.session?.user||null));
    const r = sb.auth.onAuthStateChange((_e,session)=>onUser(session?.user||null));
    sub = r.data?.subscription;
    return ()=>{ sub&&sub.unsubscribe(); };
  },[sb]);

  useEffect(()=>{
    if(!sb) { setCommunityStats([]); return; }
    sb.from('community_stats').select('*').order('outreach_count',{ascending:false}).then(({data})=>setCommunityStats(data||[]),()=>{});
  },[sb]);

  async function pull(client, u){
    try{
      const {data} = await client.from('user_data').select('data').eq('user_id',u.id).maybeSingle();
      if(data && data.data){ const s=shape(data.data); lastSync.current=JSON.stringify(s); setDb(s); }
      else { const s=loadDB(); lastSync.current=JSON.stringify(s);
        await client.from('user_data').upsert({user_id:u.id, data:s, updated_at:new Date().toISOString()}); }
    }catch(e){}
    await ingest(client,u);
    await refreshLog(client,u);
    await refreshEvents(client,u);
    await refreshTasks(client,u);
  }
  async function refreshLog(client,u){ try{ const {data} = await client.from('outreach_log').select('*').eq('user_id',u.id).order('updated_at',{ascending:false}); setLog(data||[]); }catch(e){} }
  async function refreshEvents(client,u){ try{ const {data} = await client.from('outreach_events').select('*').eq('user_id',u.id).order('occurred_at',{ascending:true}); setEvents(data||[]); }catch(e){} }
  async function refreshTasks(client,u){ try{ const {data} = await client.from('tasks').select('*').eq('user_id',u.id).order('created_at',{ascending:false}); setTasks(data||[]); }catch(e){} }

  // Drain whatever the extension pushed. profile_context is discarded unless a
  // matching row already exists — the privacy boundary: nothing is retained
  // for a profile the student didn't deliberately shortlist.
  async function ingest(client, u){
    try{
      const {data,error} = await client.from('outreach_inbox').select('id,kind,payload').eq('user_id',u.id).order('created_at',{ascending:true});
      if(error || !data || !data.length) return 0;
      const consumed=[];
      for(const row of data){
        const p = row.payload || {};
        if(!p.profileUrl){ consumed.push(row.id); continue; }
        try{
          if(row.kind==='sent_confirmation'){
            const {data:existing} = await client.from('outreach_log').select('id,status').eq('user_id',u.id).eq('profile_url',p.profileUrl).maybeSingle();
            const nowIso = new Date().toISOString();
            if(existing){
              await client.from('outreach_log').update({status:'contacted', contacted_at:nowIso, updated_at:nowIso}).eq('id',existing.id);
              await client.from('outreach_events').insert({user_id:u.id, log_id:existing.id, event_type:'stage_change', note:`Moved from ${existing.status} to contacted`, extracted:{from:existing.status,to:'contacted'}});
            } else {
              await client.from('outreach_log').upsert({user_id:u.id, profile_url:p.profileUrl, status:'contacted', contacted_at:nowIso, updated_at:nowIso}, {onConflict:'user_id,profile_url'});
            }
          } else if(row.kind==='profile_context'){
            const {data:existing} = await client.from('outreach_log').select('id,context').eq('user_id',u.id).eq('profile_url',p.profileUrl).maybeSingle();
            if(existing){
              // MERGE rather than replace — this row may already carry location,
              // education and reach captured from the search snippet, and a blind
              // overwrite would silently throw all of that away.
              const prev = existing.context || {};
              const next = { ...prev,
                aboutText:p.aboutText||prev.aboutText||'',
                experienceText:p.experienceText||prev.experienceText||'',
                educationText:p.educationText||prev.educationText||'',
                mutualConnectionsRaw:p.mutualConnectionsRaw||prev.mutualConnectionsRaw||'',
                capturedAt:new Date().toISOString() };
              if(p.location) next.location = p.location;  // only the rendered page has this
              await client.from('outreach_log').update({ context: next, updated_at:new Date().toISOString() }).eq('id', existing.id);
            }
          } else {
            await client.from('outreach_log').upsert({
              user_id:u.id, profile_url:p.profileUrl, name:p.name||null, title:p.title||null, company:p.company||null, avatar_url:p.avatarUrl||null, updated_at:new Date().toISOString(),
            }, {onConflict:'user_id,profile_url'});
          }
          consumed.push(row.id);
        }catch(e){ /* likely the weekly-cap trigger — leave unconsumed, retried next ingest */ }
      }
      if(consumed.length) await client.from('outreach_inbox').delete().in('id', consumed);
      return consumed.length;
    }catch(e){ return 0; }
  }
  const doIngest = async () => { if(auth.status==='in' && sb){ await ingest(sb, auth.user); await refreshLog(sb, auth.user); } };

  async function updateRow(row, fields){
    if(!sb || auth.status!=='in') return {ok:false, error:'Not signed in'};
    try{ await sb.from('outreach_log').update({...fields, updated_at:new Date().toISOString()}).eq('id',row.id); await refreshLog(sb, auth.user); return {ok:true}; }
    catch(e){ return {ok:false, error:e.message||String(e)}; }
  }
  // Permanently remove people from the pipeline. Deletes their events first
  // (outreach_events has no cascade), then the log rows. RLS scopes to the user.
  async function deletePeople(ids){
    if(!sb || auth.status!=='in' || !ids || !ids.length) return {ok:false};
    try{
      await sb.from('outreach_events').delete().in('log_id', ids);
      await sb.from('outreach_log').delete().in('id', ids);
      await refreshLog(sb, auth.user); await refreshEvents(sb, auth.user);
      return {ok:true};
    }catch(e){ return {ok:false, error:e.message||String(e)}; }
  }
  // Import people discovered via web search straight into the pipeline as
  // prospects (upsert, so re-importing someone is a no-op). RLS scopes to the user.
  async function addPeople(people){
    if(!sb || auth.status!=='in' || !people || !people.length) return {added:0};
    let added=0;
    for(const p of people){
      try{
        // Location / education / reach come from the search snippet — keep them
        // in the existing context jsonb so no schema migration is needed.
        const ctx = {};
        ['location','education','experience','followers','connections','snippet'].forEach(k=>{ if(p[k]) ctx[k]=p[k]; });
        const rowIns = { user_id:auth.user.id, profile_url:p.profileUrl, name:p.name||null, title:p.title||null, company:p.company||null, updated_at:new Date().toISOString() };
        if(Object.keys(ctx).length) rowIns.context = {...ctx, source:'search'};
        await sb.from('outreach_log').upsert(rowIns, {onConflict:'user_id,profile_url'});
        added++;
      }catch(e){ /* likely the weekly-cap trigger or a dup — skip */ }
    }
    await refreshLog(sb, auth.user);
    return {added};
  }
  async function logEvent(row, eventType, note, extra={}){
    if(!sb || auth.status!=='in') return {ok:false, error:'Not signed in'};
    try{
      await sb.from('outreach_events').insert({user_id:auth.user.id, log_id:row.id, event_type:eventType, note:note||null, ...extra});
      if(eventType==='reply') await updateRow(row, {status:'replied'});
      await refreshEvents(sb, auth.user);
      return {ok:true};
    }catch(e){ return {ok:false, error:e.message||String(e)}; }
  }
  async function changeStage(row, toStatus){
    const fields = {status:toStatus};
    if(toStatus==='contacted' && !row.contacted_at) fields.contacted_at = new Date().toISOString();
    const r = await updateRow(row, fields);
    if(r.ok) await logEvent(row, 'stage_change', `Moved from ${row.status} to ${toStatus}`, {extracted:{from:row.status,to:toStatus}});
    return r;
  }
  async function addTask(label, due_date, log_id){
    if(!sb || auth.status!=='in') return;
    await sb.from('tasks').insert({user_id:auth.user.id, label, due_date:due_date||null, log_id:log_id||null});
    await refreshTasks(sb, auth.user);
  }
  async function toggleTask(t){
    if(!sb || auth.status!=='in') return;
    await sb.from('tasks').update({done:!t.done, completed_at: !t.done? new Date().toISOString(): null}).eq('id',t.id);
    await refreshTasks(sb, auth.user);
  }
  async function deleteTask(t){
    if(!sb || auth.status!=='in') return;
    await sb.from('tasks').delete().eq('id',t.id);
    await refreshTasks(sb, auth.user);
  }

  useEffect(()=>{
    const s = JSON.stringify(db);
    localStorage.setItem(DB_KEY, s);
    if(auth.status==='in' && sb && s!==lastSync.current){
      lastSync.current = s;
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(()=>{ sb.from('user_data').upsert({user_id:auth.user.id, data:db, updated_at:new Date().toISOString()}).then(()=>{},()=>{}); },1200);
    }
  },[db]);

  useEffect(()=>{
    if(auth.status!=='in'||!sb) return;
    const f=()=>pull(sb,auth.user); window.addEventListener('focus',f); return ()=>window.removeEventListener('focus',f);
  },[auth.status, sb]);

  async function signOut(){ if(sb){ await sb.auth.signOut(); } window.location.href = '../'; }

  const RAIL = [
    ['dashboard','home','Home'],['people','people','Relationships'],['pipeline','pipeline','Pipeline'],
    ['tasks','tasks','Tasks'],['insights','intelligence','Intelligence'],['settings','settings','Settings'],
  ];
  const TITLES = {dashboard:'Home',people:'Relationships',pipeline:'Pipeline',tasks:'Tasks',insights:'Intelligence',settings:'Settings',templates:'Message templates',extpreview:'Extension preview'};
  const SUBTITLES = {dashboard:'What should I do today?',people:'Everyone you know',pipeline:'Where everyone is in your journey',tasks:"What you've promised",insights:'What you might be missing',settings:'How Mighty works for you'};
  const drawerRow = drawerId!=null ? log.find(r=>r.id===drawerId) : null;
  const draftRow = draftFor!=null ? log.find(r=>r.id===draftFor) : null;

  if(auth.status==='loading') return <div style={{display:'grid',placeItems:'center',height:'100vh'}}><div className="empty"><div className="big">⏳</div>Loading…</div></div>;
  if(auth.status==='unconfigured') return <div style={{display:'grid',placeItems:'center',height:'100vh',padding:24}}>
    <div className="panel pad" style={{maxWidth:420,textAlign:'center'}}><h2>Mighty isn't set up yet</h2>
      <p className="note" style={{marginTop:10}}>The deployer needs to add a Supabase project URL + anon key to <span className="mono">index.html</span> — see SETUP.md.</p></div></div>;
  if(auth.status!=='in') return <Gate sb={sb}/>;
  if(!db.settings.onboardedAt) return <Onboarding sb={sb} db={db} patch={patch} auth={auth} setTab={setTab}/>;

  return <div className="app">
    <div className="rail">
      <div className="rail-brand"><Logo size={24}/><div className="rail-name">Mighty</div></div>
      <div className="rail-nav">
        {RAIL.map(([id,ic,lb])=><div key={id} className={'rail-item'+(tab===id?' on':'')} onClick={()=>setTab(id)}><NavIcon name={ic}/>{lb}</div>)}
      </div>
      <div className="rail-sp"/>
      <div className={'rail-item'+(tab==='extpreview'?' on':'')} onClick={()=>setTab('extpreview')}><NavIcon name="extension"/>Extension</div>
      <div className="rail-acct">
        <div className="rail-avatar">{(auth.user.email||'?')[0].toUpperCase()}</div>
        <div style={{minWidth:0}}><div style={{fontWeight:600,fontSize:12.5,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{auth.user.email}</div>
          <div onClick={signOut} style={{fontSize:11,color:'var(--mute)',cursor:'pointer'}}>sign out</div></div>
      </div>
    </div>

    <div className="main">
      <div className="topbar"><h2>{TITLES[tab]}</h2>{SUBTITLES[tab] && <span className="note" style={{color:'var(--mute2)',fontSize:13.5}}>{SUBTITLES[tab]}</span>}</div>
      <div className="content">
        {tab==='dashboard' && <Dashboard db={db} patch={patch} log={log} events={events} tasks={tasks} communityStats={communityStats} sb={sb} auth={auth} addPeople={addPeople} setTab={setTab} setDrawerId={setDrawerId} setDraftFor={setDraftFor}/>}
        {tab==='people' && <People db={db} log={log} events={events} doIngest={doIngest} setDrawerId={setDrawerId} sb={sb} auth={auth} deletePeople={deletePeople} updateRow={updateRow}/>}
        {tab==='pipeline' && <Pipeline log={log} events={events} followUpDays={db.settings.followUpDays} changeStage={changeStage}/>}
        {tab==='tasks' && <Tasks tasks={tasks} log={log} events={events} db={db} addTask={addTask} toggleTask={toggleTask} deleteTask={deleteTask} setDrawerId={setDrawerId}/>}
        {tab==='insights' && <Insights log={log} events={events} tasks={tasks} db={db} communityStats={communityStats} setDrawerId={setDrawerId}/>}
        {tab==='settings' && <Settings db={db} patch={patch} auth={auth} sb={sb} signOut={signOut} setTab={setTab}/>}
        {tab==='templates' && <Templates db={db} patch={patch} sb={sb} auth={auth} setTab={setTab}/>}
        {tab==='extpreview' && <ExtensionPreview/>}
      </div>
    </div>

    {drawerRow && <PersonDrawer row={drawerRow} rowEvents={events.filter(e=>e.log_id===drawerRow.id)} db={db} sb={sb} auth={auth} communityStats={communityStats}
      drawerTab={drawerTab} setDrawerTab={setDrawerTab} onClose={()=>setDrawerId(null)}
      updateRow={updateRow} logEvent={logEvent} changeStage={changeStage} openDraft={()=>setDraftFor(drawerRow.id)}/>}
    {draftRow && <DraftModal row={draftRow} db={db} sb={sb} auth={auth} updateRow={updateRow} changeStage={changeStage} onClose={()=>setDraftFor(null)}/>}
  </div>;
}

/* ============================ Login gate ============================ */
function Gate({sb}){
  const [mode,setMode]=useState('in');
  const [email,setEmail]=useState(''); const [pw,setPw]=useState('');
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState(null); const [err,setErr]=useState(null);
  async function go(){
    setErr(null); setMsg(null);
    if(!MIT_RE.test(email.trim())){ setErr('Use your @mit.edu email address.'); return; }
    setBusy(true);
    try{
      if(mode==='up'){
        const {error}=await sb.auth.signUp({email:email.trim(),password:pw});
        if(error) throw error;
        setMsg('Account created. Check your @mit.edu inbox for a confirmation link, then sign in.'); setMode('in');
      } else if(mode==='in'){
        const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
        if(error) throw error;
      } else {
        const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.href});
        if(error) throw error; setMsg('Password reset link sent to your inbox.');
      }
    }catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  const heading = mode==='up'?'Create your account':mode==='reset'?'Reset password':'Welcome back.';
  return <div style={{minHeight:'100vh',display:'grid',placeItems:'center',background:'var(--bg)',padding:'40px 24px',position:'relative',overflow:'hidden'}}>
    <div style={{position:'absolute',top:-180,left:'50%',transform:'translateX(-50%)',width:1000,height:560,borderRadius:'50%',background:'radial-gradient(closest-side, var(--bsoft), rgba(250,249,247,0))',pointerEvents:'none'}}/>
    <div style={{position:'absolute',bottom:-140,right:'6%',width:420,height:420,borderRadius:'50%',background:'radial-gradient(closest-side, var(--psoft), rgba(250,249,247,0))',pointerEvents:'none'}}/>
    <div style={{position:'relative',width:430,maxWidth:'100%',background:'var(--card)',border:'1px solid var(--line)',borderRadius:26,padding:'38px 38px 32px',boxShadow:'0 30px 70px -34px rgba(27,26,31,0.22)'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:26}}>
        <Logo size={26}/><div style={{fontFamily:'var(--fh)',fontWeight:600,fontSize:19,letterSpacing:'-.03em'}}>Mighty</div>
      </div>
      <h1 style={{fontSize:32,marginBottom:8}}>{heading}</h1>
      <div className="note" style={{marginBottom:26,fontSize:15.5,color:'var(--sub2)'}}>Sign in with your <span className="mono">@mit.edu</span> email to pick up where you left off.</div>
      <label className="fld">Email</label>
      <input className="inp" value={email} onChange={e=>setEmail(e.target.value)} placeholder="kerberos@mit.edu" autoFocus/>
      {mode!=='reset' && <><div style={{height:16}}/><label className="fld">Password</label>
        <input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')go();}} placeholder="••••••••"/></>}
      <div style={{marginTop:24}}><button className="btn" style={{width:'100%',padding:15}} onClick={go} disabled={busy}>
        {busy?<Dots/>:mode==='up'?'Create account':mode==='reset'?'Send reset link':'Sign in'}</button></div>
      {msg && <div className="okbox" style={{marginTop:12}}>{msg}</div>}
      {err && <div className="warnbox" style={{marginTop:12}}>{err}</div>}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:16,marginTop:22,paddingTop:20,borderTop:'1px solid var(--line)',fontSize:14}}>
        {mode==='in' ? <><a style={{cursor:'pointer'}} onClick={()=>setMode('up')}>Create an account</a><a style={{cursor:'pointer',color:'var(--mute)'}} onClick={()=>setMode('reset')}>Forgot password?</a></>
          : <a style={{cursor:'pointer'}} onClick={()=>setMode('in')}>← Back to sign in</a>}
      </div>
    </div>
  </div>;
}

/* ============================ Onboarding (first run) ============================ */
function MultiSelect({label, hint, options, value, onChange}){
  const toggle=v=>onChange((value||[]).includes(v)?value.filter(x=>x!==v):[...(value||[]),v]);
  return <div>
    {label && <label className="fld">{label}</label>}
    {hint && <div className="note" style={{margin:'-2px 0 8px'}}>{hint}</div>}
    <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
      {options.map(o=>{ const on=(value||[]).includes(o); return <span key={o} onClick={()=>toggle(o)} style={{cursor:'pointer',padding:'7px 12px',fontSize:12.5,fontWeight:600,background:on?'var(--brand)':'var(--card)',color:on?'#fff':'var(--sub)',border:'1px solid '+(on?'var(--brand)':'var(--line)')}}>{on?'✓ ':''}{o}</span>; })}
    </div>
  </div>;
}
function RadioSelect({label, options, value, onChange}){
  return <div>
    {label && <label className="fld">{label}</label>}
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      {options.map(o=>{ const on=value===o; return <div key={o} onClick={()=>onChange(o)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',border:'1px solid '+(on?'var(--brand)':'var(--line)'),background:on?'var(--bsoft)':'var(--card2)',cursor:'pointer'}}>
        <span style={{width:16,height:16,flex:'none',borderRadius:99,border:'1.5px solid '+(on?'var(--brand)':'rgba(0,0,0,.3)'),background:on?'var(--brand)':'transparent'}}></span>
        <span style={{fontSize:13.5,fontWeight:on?600:400}}>{o}</span></div>; })}
    </div>
  </div>;
}
function ChipInput({label, hint, placeholder, value, onChange, suggestions}){
  const [text,setText]=useState('');
  const add=(v)=>{ v=(v||'').trim(); if(!v) return; if(!value.some(x=>x.toLowerCase()===v.toLowerCase())) onChange([...value,v]); setText(''); };
  const remove=(v)=>onChange(value.filter(x=>x!==v));
  return <div>
    <label className="fld">{label}</label>
    {hint && <div className="note" style={{margin:'-2px 0 8px'}}>{hint}</div>}
    <div style={{display:'flex',gap:8}}>
      <input className="inp" value={text} placeholder={placeholder}
        onChange={e=>setText(e.target.value)}
        onKeyDown={e=>{ if(e.key==='Enter'){e.preventDefault(); add(text);} if(e.key==='Backspace'&&!text&&value.length) remove(value[value.length-1]); }}/>
      <button className="btn ghost" type="button" onClick={()=>add(text)}>Add</button>
    </div>
    {value.length>0 && <div style={{display:'flex',flexWrap:'wrap',gap:7,marginTop:10}}>
      {value.map(v=><span key={v} className="chip" style={{gap:7}}>{v}<span onClick={()=>remove(v)} style={{cursor:'pointer',fontWeight:700,color:'var(--mute)'}}>✕</span></span>)}
    </div>}
    {suggestions && suggestions.length>0 && <div style={{marginTop:10}}>
      <div className="tag" style={{marginBottom:6}}>Popular</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
        {suggestions.filter(s=>!value.some(x=>x.toLowerCase()===s.toLowerCase())).map(s=>
          <span key={s} onClick={()=>add(s)} className="chip" style={{cursor:'pointer',background:'var(--card)',border:'1px solid var(--line)'}}>+ {s}</span>)}
      </div>
    </div>}
  </div>;
}
function Onboarding({sb, db, patch, auth, setTab}){
  const [step,setStep]=useState(0);
  const S=db.settings;
  const [goal,setGoal]=useState(S.goal||'');
  const [reasons,setReasons]=useState(S.networkingReasons||[]);
  const [companies,setCompanies]=useState(S.targetCompanies||[]);
  const [roles,setRoles]=useState(S.targetRoles||[]);
  const [homeLoc,setHomeLoc]=useState(S.homeLocation||'');
  const [targetLocs,setTargetLocs]=useState(S.targetLocations||[]);
  const [schools,setSchools]=useState(S.schools||[]);
  const [industries,setIndustries]=useState(S.industries||[]);
  const [skills,setSkills]=useState(S.skills||[]);
  const [currentRole,setCurrentRole]=useState(S.currentRole||'');
  const [currentCompany,setCurrentCompany]=useState(S.currentCompany||'');
  const [yearsExperience,setYearsExperience]=useState(S.yearsExperience||'');
  const [style,setStyle]=useState(S.networkingStyle||[]);
  const [hardest,setHardest]=useState(S.hardestPart||'');
  const first=(auth.user.email||'').split('@')[0];
  const finish=()=>patch('settings',{ goal:goal.trim(), networkingReasons:reasons, targetCompanies:companies, targetRoles:roles,
    homeLocation:homeLoc.trim(), targetLocations:targetLocs, schools, industries, skills, currentRole:currentRole.trim(), currentCompany:currentCompany.trim(), yearsExperience:yearsExperience.trim(),
    networkingStyle:style, hardestPart:hardest, onboardedAt:Date.now() });
  // Resume extraction fills the local onboarding state (which finish() saves) —
  // never patches settings directly, so nothing here is lost when finish() runs.
  const onResume=e=>{
    if(e.currentRole && !currentRole) setCurrentRole(e.currentRole);
    if(e.currentCompany && !currentCompany) setCurrentCompany(e.currentCompany);
    if(e.yearsExperience && !yearsExperience) setYearsExperience(e.yearsExperience);
    setSkills(v=>mergeArr(v, e.skills));
    setSchools(v=>mergeArr(v, e.schools));
    setIndustries(v=>mergeArr(v, e.industries));
  };

  const REASONS=['Get a job','Change careers','Raise funding','Find customers','Build partnerships','Find mentors','Hire talent','Build my brand','Grow my network'];
  const STYLES=['Warm introductions','Coffee chats','Cold outreach','Events','Email','LinkedIn'];
  const HARDEST=["I don't know who to reach out to","I forget to follow up","I hate cold outreach","I don't know what to say","I don't stay organized"];
  const STEPS = [
    { key:'welcome', title:`Welcome, ${first}`, sub:'Mighty helps you build real relationships on LinkedIn, not just connections. A few quick questions, then you\'re set.' },
    { key:'goal', title:'What do you want to accomplish in the next 6-12 months?', sub:'This is the most important one. It becomes the lens Mighty uses to rank people, draft messages, and plan your day.' },
    { key:'resume', title:'Import your resume', sub:'Optional, but it fills in most of your profile in seconds. Upload a PDF or paste the text - Mighty pulls out your skills, schools, and current role for you to confirm.' },
    { key:'reason', title:'Why are you networking?', sub:'Pick all that apply - it shapes the advice you get.' },
    { key:'targets', title:'Who are you targeting?', sub:'Dream companies and the roles you\'re after. Mighty scores people against these. Optional, editable anytime.' },
    { key:'places', title:'Where?', sub:'Your city (so "near me" searches work) and any places you want to build a network.' },
    { key:'background', title:'Your background', sub:'Schools and industries help Mighty spot shared ground and prioritise the right people.' },
    { key:'style', title:'How you like to network', sub:'So Mighty suggests moves that actually feel like you - and solves your hardest part.' },
    { key:'extension', title:'Add the Chrome extension', sub:'This is what lets Mighty read LinkedIn pages you\'re viewing and save people with one click. It never sends or connects for you.' },
    { key:'tour', title:'Here\'s the flow', sub:'Four moves, and Mighty does the remembering.' },
  ];
  const s=STEPS[step];
  const last=step===STEPS.length-1;
  const COMPANY_SUGGESTIONS=['McKinsey','BCG','Bain & Company','Amazon','Google','Stripe','OpenAI','Goldman Sachs','Deloitte'];
  const ROLE_SUGGESTIONS=['Product Manager','Consultant','Investor / VC','Founder','Chief of Staff','Strategy','Data Scientist'];
  const INDUSTRY_SUGGESTIONS=['Healthcare','Climate','Fintech','AI','Consumer','VC','Consulting','Defense'];

  return <div style={{minHeight:'100vh',background:'var(--bg)',display:'grid',placeItems:'center',padding:24}}>
    <div className="panel" style={{width:540,maxWidth:'100%'}}>
      <div style={{display:'flex',alignItems:'center',gap:9,padding:'18px 22px',borderBottom:'1px solid var(--line)'}}>
        <Logo size={24}/>
        <div style={{fontFamily:'var(--fh)',fontWeight:600}}>Set up Mighty</div>
        <div style={{flex:1}}/>
        <div className="tag">Step {step+1} of {STEPS.length}</div>
      </div>
      {/* progress */}
      <div style={{display:'flex',gap:4,padding:'12px 22px 0'}}>
        {STEPS.map((_,i)=><div key={i} style={{flex:1,height:4,background:i<=step?'var(--brand)':'var(--chip)'}}/>)}
      </div>
      <div className="pad" style={{minHeight:220}}>
        <h2 style={{fontSize:22}}>{s.title}</h2>
        <div className="note" style={{marginTop:6,fontSize:13.5,lineHeight:1.55}}>{s.sub}</div>
        <div style={{marginTop:18}}>
          {s.key==='goal' && <div>
            <label className="fld">Your goal</label>
            <textarea className="inp" rows={3} value={goal} onChange={e=>setGoal(e.target.value)} placeholder="e.g. Break into climate-tech VC in Europe · Land a PM role at a Series B startup · Meet Sloan alumni working in AI"/>
            <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:10}}>
              {['Break into climate-tech VC','Land a PM role at a startup','Meet alumni in AI','Find a technical co-founder','Explore healthcare investing'].map(ex=>
                <span key={ex} onClick={()=>setGoal(ex)} className="chip" style={{cursor:'pointer',background:'var(--card)',border:'1px solid var(--line)'}}>{ex}</span>)}
            </div>
          </div>}
          {s.key==='resume' && <div>
            <ResumeImport sb={sb} auth={auth} onApply={onResume}/>
            {(skills.length>0||currentRole||schools.length>0) && <div className="okbox" style={{marginTop:12}}>
              Added so far:{currentRole?` ${currentRole}${currentCompany?` at ${currentCompany}`:''};`:''}{skills.length>0?` ${skills.length} skills;`:''}{schools.length>0?` ${schools.length} schools;`:''}{industries.length>0?` ${industries.length} industries.`:''} You can edit all of this later in Settings.
            </div>}
          </div>}
          {s.key==='reason' &&
            <MultiSelect value={reasons} onChange={setReasons} options={REASONS}/>}
          {s.key==='targets' && <div style={{display:'flex',flexDirection:'column',gap:18}}>
            <ChipInput label="Dream companies" placeholder="Type a company, press Enter" value={companies} onChange={setCompanies} suggestions={COMPANY_SUGGESTIONS}/>
            <ChipInput label="Target roles" placeholder="Type a role, press Enter" value={roles} onChange={setRoles} suggestions={ROLE_SUGGESTIONS}/>
          </div>}
          {s.key==='places' && <div style={{display:'flex',flexDirection:'column',gap:18}}>
            <div><label className="fld">Your city</label><input className="inp" value={homeLoc} onChange={e=>setHomeLoc(e.target.value)} placeholder="Boston" style={{maxWidth:300}}/></div>
            <ChipInput label="Places you want to network in (optional)" placeholder="Type a city, press Enter" value={targetLocs} onChange={setTargetLocs} suggestions={['Boston','New York','San Francisco','London','Bangalore']}/>
          </div>}
          {s.key==='background' && <div style={{display:'flex',flexDirection:'column',gap:18}}>
            <ChipInput label="Schools" placeholder="Type a school, press Enter" value={schools} onChange={setSchools} suggestions={['MIT Sloan','Harvard','Stanford','IIM Bangalore','Wharton']}/>
            <ChipInput label="Industries you care about" placeholder="Type an industry, press Enter" value={industries} onChange={setIndustries} suggestions={INDUSTRY_SUGGESTIONS}/>
          </div>}
          {s.key==='style' && <div style={{display:'flex',flexDirection:'column',gap:18}}>
            <MultiSelect label="You prefer" value={style} onChange={setStyle} options={STYLES}/>
            <RadioSelect label="Networking is hardest because…" value={hardest} onChange={setHardest} options={HARDEST}/>
          </div>}
          {s.key==='extension' &&
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              <a className="btn" href="../install/" target="_blank" rel="noopener noreferrer" style={{alignSelf:'flex-start',textDecoration:'none'}}>Open install guide ↗</a>
              <div className="okbox">You can finish setup now and add the extension later - the web app works on its own. The extension just makes saving from LinkedIn one click.</div>
            </div>}
          {s.key==='welcome' &&
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {[['◔','Decide who\'s worth your time'],['✍','Draft grounded first messages'],['↗','Remember every relationship']].map(([em,t])=>
                <div key={t} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 12px',border:'1px solid var(--line)',background:'var(--card2)'}}>
                  <div style={{width:26,height:26,flex:'none',background:'var(--brand)',color:'#fff',display:'grid',placeItems:'center',fontSize:13}}>{em}</div>
                  <div style={{fontWeight:600,fontSize:13.5}}>{t}</div></div>)}
            </div>}
          {s.key==='tour' &&
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {[['1','Save people','From LinkedIn search or a profile, save anyone interesting.'],
                ['2','See the match','Mighty scores each person and tells you why.'],
                ['3','Draft & send','Get a grounded first draft. You always click Send yourself.'],
                ['4','Track it','Log coffee chats and follow-ups; Mighty resurfaces them.']].map(([n,t,d])=>
                <div key={n} style={{display:'flex',gap:12,alignItems:'flex-start'}}>
                  <div style={{width:26,height:26,flex:'none',background:'var(--brand)',color:'#fff',display:'grid',placeItems:'center',fontWeight:700,fontSize:13}}>{n}</div>
                  <div><div style={{fontWeight:600,fontSize:13.5}}>{t}</div><div className="note" style={{fontSize:12.5}}>{d}</div></div></div>)}
            </div>}
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'14px 22px',borderTop:'1px solid var(--line)'}}>
        {step>0 ? <button className="btn ghost" onClick={()=>setStep(step-1)}>← Back</button> : <span/>}
        <div style={{flex:1}}/>
        {!last && step>0 && <a onClick={finish} style={{fontSize:12.5,color:'var(--mute)',cursor:'pointer'}}>Skip setup</a>}
        {last
          ? <button className="btn" onClick={()=>{ finish(); setTab('people'); }}>Finish - start with People</button>
          : <button className="btn" onClick={()=>setStep(step+1)}>Continue</button>}
      </div>
    </div>
  </div>;
}

/* ============================ Daily Copilot ============================
   The "if I had 30 minutes today, what should I do?" feature. Reasons only over
   the student's real pipeline (never invents), routed through the AI Gateway's
   daily_plan feature (Sonnet, cached, budget-governed). We assemble a compact,
   factual digest client-side — SQL/JS does the counting; Claude does the
   prioritising (Rule #1: AI thinks, it doesn't calculate). */
function buildDailyDigest(log, events, tasks, settings){
  const followUpDays = settings.followUpDays||7;
  const repliedIds = new Set(events.filter(e=>e.event_type==='reply').map(e=>e.log_id));
  const lines = [];
  const push = (h, arr) => { if(arr.length) lines.push(`${h}: ${arr.slice(0,8).join('; ')}`); };
  const nm = r => `${displayName(r)}${r.company?` (${r.company})`:''}`;

  const waitingReply = log.filter(r=>r.status==='contacted' && !repliedIds.has(r.id) && r.contacted_at)
    .map(r=>({r, days:Math.round((now()-new Date(r.contacted_at).getTime())/864e5)}));
  push('Overdue follow-ups (no reply)', waitingReply.filter(x=>x.days>followUpDays).map(x=>`${nm(x.r)} ${x.days}d`));
  push('Recently contacted, still waiting', waitingReply.filter(x=>x.days<=followUpDays).map(x=>`${nm(x.r)} ${x.days}d`));
  push('Replied — propose a coffee chat', log.filter(r=>r.status==='replied').map(nm));
  push('Coffee chat done — send thanks / next touch', log.filter(r=>r.status==='coffee_chat').map(nm));
  push('Referral / interview in progress', log.filter(r=>r.status==='referral'||r.status==='interview').map(r=>`${nm(r)} [${r.status}]`));
  const fresh = log.filter(r=>r.status==='prospect'||r.status==='ready_to_contact')
    .map(r=>({r, ...computeScore(r, settings.targetCompanies, profileKeywords(settings))})).sort((a,b)=>b.score-a.score);
  push('Top new people to message first', fresh.slice(0,6).map(x=>`${nm(x.r)} score ${x.score}`));
  const todayStr = new Date().toISOString().slice(0,10);
  push('Tasks due', (tasks||[]).filter(t=>!t.done && t.due_date && t.due_date<=todayStr).map(t=>t.label));
  if((settings.targetCompanies||[]).length) lines.push(`Target companies: ${settings.targetCompanies.join(', ')}`);
  if((settings.targetRoles||[]).length) lines.push(`Target roles: ${settings.targetRoles.join(', ')}`);
  return lines.join('\n');
}
function DailyCopilot({db, log, events, tasks, sb, auth, setDrawerId}){
  const [plan,setPlan]=useState(null); const [busy,setBusy]=useState(false); const [err,setErr]=useState(null);
  const mode = llmMode(sb,auth);
  const digest = buildDailyDigest(log, events, tasks, db.settings);
  const hasWork = digest.trim().length>0 && log.length>0;
  async function generate(){
    setBusy(true); setErr(null);
    try{
      const pctx = profileContext(db.settings);
      const r = await llmJSON(sb, auth, 'daily_plan',
        `You are Mighty's daily networking copilot for an MIT Sloan Fellows MBA student. Given their real outreach pipeline below, recommend the best use of about 30 minutes today. Use ONLY the people and facts provided — never invent anyone. Prioritise time-sensitive, high-leverage moves (overdue follow-ups, replies waiting, coffee-chat thank-yous, warm high-score intros) AND moves that advance the student's stated goal. Be specific and concise.`,
        `${pctx?pctx+'\n\n':''}Pipeline:\n${digest}\n\nReturn JSON: {"headline": string (one short motivating line, reference the goal if relevant), "actions": [{"title": string (imperative, <8 words), "who": string (person name or "—"), "why": string (<15 words, tie to the goal when it applies), "minutes": number}]}. 3 to 4 actions, ordered by priority, total ~30 minutes.`,
        900);
      setPlan(r);
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(false);
  }
  const findRow = who => log.find(r=>who && displayName(r).toLowerCase()===String(who).toLowerCase().replace(/\s*\(.*\)$/,'').trim());

  return <div className="panel pad" style={{background:'linear-gradient(150deg, var(--bsoft), var(--psoft))',color:'var(--ink)',border:'none'}}>
    <div style={{display:'flex',alignItems:'center',gap:10}}>
      <div className="tag" style={{fontSize:11.5}}>Your 30 minutes today</div>
      <div style={{flex:1}}/>
      {mode!=='none' && <button className="btn sm dark" onClick={generate} disabled={busy||!hasWork}
        style={{padding:'11px 22px'}}>{busy?'Thinking…':plan?'Re-plan':'Plan my 30 minutes'}</button>}
    </div>
    {mode==='none'
      ? <div style={{fontSize:13,opacity:.85,marginTop:8}}>Sign in to get an AI plan for your day.</div>
      : !hasWork
        ? <div style={{fontSize:13,opacity:.85,marginTop:8}}>Save a few people first, then Mighty can plan your day around them.</div>
        : busy
          ? <div style={{marginTop:12}}><Dots/></div>
          : err
            ? <div style={{fontSize:12.5,marginTop:10,color:'#ffb3a6'}}>{err}</div>
            : plan
              ? <div style={{marginTop:12}}>
                  {plan.headline && <div style={{fontSize:13.5,opacity:.9,marginBottom:12}}>{plan.headline}</div>}
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    {(plan.actions||[]).map((a,i)=>{ const row=findRow(a.who);
                      return <div key={i} style={{display:'flex',gap:12,alignItems:'flex-start',paddingBottom:10,borderBottom:i<plan.actions.length-1?'1px solid rgba(255,255,255,.14)':'none'}}>
                        <div style={{width:24,height:24,flex:'none',background:'var(--brand)',color:'#fff',display:'grid',placeItems:'center',fontWeight:700,fontSize:12}}>{i+1}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:600,fontSize:14}}>{a.title}{a.minutes?<span style={{opacity:.6,fontWeight:400}}> · {a.minutes} min</span>:null}</div>
                          <div style={{fontSize:12.5,opacity:.82,marginTop:2}}>{a.who&&a.who!=='—'?`${a.who} — `:''}{a.why}</div>
                        </div>
                        {row && <button className="btn ghost sm" onClick={()=>setDrawerId(row.id)} style={{background:'transparent',color:'#fff',borderColor:'rgba(255,255,255,.3)'}}>Open</button>}
                      </div>; })}
                  </div>
                </div>
              : <div style={{fontSize:13,opacity:.85,marginTop:8}}>Ask Mighty what's worth doing in the next half hour.</div>}
  </div>;
}

/* ============================ Find people (Discover) ============================
   You type a natural request ("strategy tech companies near me"); Mighty resolves
   "near me" to your city, rewrites it into tight keywords via the AI gateway, and
   runs an official Google Programmable Search (server-side, quota'd, never HTML
   scraping) scoped to public LinkedIn profiles. Results come back INTO the app as
   a selectable list you import into your pipeline with one click. If web search
   isn't configured, it falls back to opening Google for the extension to capture. */
function FindPeople({sb, auth, db, patch, addPeople, setTab}){
  const [q,setQ]=useState(''); const [busy,setBusy]=useState(false);
  const [results,setResults]=useState(null); const [sel,setSel]=useState(new Set());
  const [msg,setMsg]=useState(null); const [lastKw,setLastKw]=useState('');
  const [prog,setProg]=useState(0); const [phase,setPhase]=useState('');
  const mode = llmMode(sb,auth);
  const EX=['strategy tech companies near me','MIT Sloan alumni in AI','healthcare VCs in New York','product managers at Stripe','climate startup founders in Europe'];
  const NEARME=/\b(near|around|close to)\s+me\b|\bnearby\b|\bmy area\b/i;
  const tracked = new Set(); // filled from db? we compare on import
  function localClean(query){ const kw=goalKeywords(query); return kw.length ? kw.join(' ') : query; }
  function resolveLocation(query){
    if(!NEARME.test(query)) return query;
    let loc = (db && db.settings.homeLocation || '').trim();
    if(!loc && patch){
      loc = (window.prompt('Which city are you based in? Leave blank to search across the USA.')||'').trim();
      if(loc) patch('settings', s=>({...s, homeLocation:loc}));
    }
    if(!loc) loc = 'United States';
    return query.replace(NEARME,'').replace(/\s+/g,' ').trim()+' '+loc;
  }
  async function keywords(raw){
    const located = resolveLocation(raw);
    if(mode==='none') return localClean(located);
    try{
      const kw = await llm(sb, auth, 'tagging',
        'You turn a natural-language request to find people into a short set of LinkedIn profile search keywords: role/title, company, industry, and location. Keep real company and place names exactly. Convert phrases like "tech companies" to "technology". Output ONLY the keywords on one line - no punctuation, quotes, or explanation.',
        located, 60);
      const clean=(kw||'').trim().replace(/[\n"]/g,' ').replace(/\s+/g,' ');
      return clean.length>1 ? clean : localClean(located);
    }catch(e){ return localClean(located); }
  }
  // Open Google for the extension to capture — the free path (a normal Google
  // search in the student's own browser; the MIghTy extension reads the page).
  // Ask the extension to run the search and hand back the profiles, so results
  // appear here rather than sending the student off to another site. Falls back
  // to opening a tab only if the extension isn't installed.
  async function viaExtension(kw){
    setProg(55); setPhase('Reading results');
    const r = await extBridge.search(kw);
    setProg(85); setPhase('Building your list');
    if(r && r.ok && (r.people||[]).length){
      setResults(r.people); setSel(new Set(r.people.map(p=>p.profileUrl))); setMsg(null); return;
    }
    if(r && r.error==='no_extension'){ openForExtension(kw); return; }
    setMsg({t:'No profiles found for that search. Try different words.', err:true});
  }

  // Last resort — only when the extension isn't installed.
  // Points at LinkedIn's own people search rather than Google: the extension
  // captures real photos and headlines there, so imports arrive complete.
  function openForExtension(kw){
    window.open('https://www.linkedin.com/search/results/people/?keywords='+encodeURIComponent(kw),'_blank','noopener');
    setMsg({t:'Opened LinkedIn search in a new tab - tick the profiles in the Mighty panel there and hit Send. They\'ll land in your People list, photos and all.'});
  }
  async function go(){
    const raw=q.trim(); if(!raw || busy) return;
    setBusy(true); setMsg(null); setResults(null); setSel(new Set());
    // Real phases, not a fake timer: each step below moves the bar when it
    // actually completes, so the number always means something.
    setProg(8); setPhase('Understanding your search');
    const kw = await keywords(raw); setLastKw(kw);
    setProg(30); setPhase('Searching profiles');
    try{
      // Try the optional in-app search API; if it isn't set up, use the free
      // extension flow rather than treating it as an error.
      const {data,error} = await sb.functions.invoke('people-search', {body:{query:kw}});
      if(error){ openForExtension(kw); }
      else if(data && data.ok){
        setResults(data.people||[]);
        setSel(new Set((data.people||[]).map(p=>p.profileUrl)));
      } else if(data && data.error==='not_configured'){
        await viaExtension(kw);
      } else { setMsg({t:(data&&data.message)||'Search failed.', err:true}); }
    }catch(e){ await viaExtension(kw); }
    setProg(100); setPhase('');
    setBusy(false);
    setTimeout(()=>setProg(0), 600);
  }
  const toggle=url=>setSel(s=>{ const n=new Set(s); n.has(url)?n.delete(url):n.add(url); return n; });
  async function importSel(){
    if(!results) return;
    const chosen=results.filter(p=>sel.has(p.profileUrl));
    if(!chosen.length) return;
    setBusy(true);
    const {added}=await addPeople(chosen);
    setBusy(false); setResults(null); setSel(new Set());
    setMsg({t:`Added ${added} ${added===1?'person':'people'} to your pipeline.`, go:true});
  }

  return <div className="panel pad">
    <div style={{fontFamily:'var(--fh)',fontWeight:600,fontSize:17,letterSpacing:'-.02em',marginBottom:4}}>Find people anywhere</div>
    <div className="note" style={{marginBottom:12,fontSize:13,lineHeight:1.5}}>Describe who you're looking for in plain words — Mighty finds matching profiles for you to add.</div>
    <div style={{display:'flex',gap:8}}>
      <input className="inp" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') go(); }} placeholder="e.g. strategy people at tech companies near me"/>
      <button className="btn" onClick={go} disabled={busy||!q.trim()}>{busy?<Dots/>:'✨ Search'}</button>
    </div>

    {(busy||prog>0) && <div style={{marginTop:12}}>
      <div style={{display:'flex',alignItems:'baseline',gap:10,marginBottom:6}}>
        <span className="note" style={{fontWeight:500,color:'var(--brand2)'}}>{phase||'Done'}</span>
        <span className="note" style={{marginLeft:'auto'}}>{prog}%</span>
      </div>
      <div className="scorebar"><i style={{width:prog+'%',transition:'width .45s cubic-bezier(.22,.61,.36,1)'}}/></div>
    </div>}

    {msg && <div className={msg.err?'warnbox':'okbox'} style={{marginTop:10}}>{msg.t}{msg.go && <> <a style={{cursor:'pointer',fontWeight:700}} onClick={()=>setTab('people')}>View in People →</a></>}</div>}

    {results && <div style={{marginTop:12}}>
      {lastKw && <div className="note" style={{fontSize:12,marginBottom:8}}>Results for <b style={{color:'var(--ink)'}}>{lastKw}</b></div>}
      {results.length===0
        ? <div className="note">No LinkedIn profiles matched. Try different words.</div>
        : <>
          <div className="list">{results.map(p=>{ const on=sel.has(p.profileUrl);
            return <label key={p.profileUrl} className="row" style={{cursor:'pointer',alignItems:'flex-start'}}>
              <input type="checkbox" checked={on} onChange={()=>toggle(p.profileUrl)} style={{marginTop:3}}/>
              <div className="grow" style={{minWidth:0}}>
                <div className="t">{p.name}</div>
                <div className="m">{p.title||p.company||'LinkedIn profile'}</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:5}}>
                  {p.company &&   <span className="chip" style={{fontSize:11.5}}>🏢 {p.company}</span>}
                  {p.location &&  <span className="chip" style={{fontSize:11.5}}>📍 {p.location}</span>}
                  {p.education && <span className="chip" style={{fontSize:11.5}}>🎓 {p.education}</span>}
                  {p.followers && <span className="chip" style={{fontSize:11.5}}>{p.followers} followers</span>}
                </div>
              </div>
              <a className="linkurl" href={p.profileUrl} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()}>↗</a>
            </label>; })}</div>

    {!results && <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:10}}>

/* ---- Extension bridge -------------------------------------------------------
   A web page can't read a cross-origin search page or a signed LinkedIn photo
   URL — the browser blocks both. The extension can, so the app asks it and
   renders the answer in place: the student never gets sent to Google or
   LinkedIn. Request/response over postMessage; with no extension installed the
   calls time out and every caller falls back gracefully. */
const extBridge = (()=>{
  let seq=0; const pending=new Map(); let ready=false;
  if(typeof window!=='undefined'){
    window.addEventListener('message', ev=>{
      if(ev.source!==window) return;
      const d=ev.data; if(!d || d.source!=='mighty-ext') return;
      if(d.ready){ ready=true; return; }
      const cb=pending.get(d.id); if(cb){ pending.delete(d.id); cb(d); }
    });
  }
  function call(kind, extra, timeoutMs=25000){
    return new Promise(resolve=>{
      const id='m'+(++seq)+'-'+Date.now();
      const t=setTimeout(()=>{ pending.delete(id); resolve({ok:false,error:'no_extension'}); }, timeoutMs);
      pending.set(id, d=>{ clearTimeout(t); resolve(d); });
      window.postMessage({source:'mighty-app', id, kind, ...extra}, window.location.origin);
    });
  }
  return {
    isReady: ()=>ready,
    search: (query)=>call('search',{query}),
    photo: (profileUrl)=>call('photo',{profileUrl}, 30000),
  };
})();

/* ---- Guided enrichment ------------------------------------------------------
   People found via search arrive with a URL and little else — search results
   carry no profile photos. The extension can recover them one at a time (it is
   throttled and capped on its side); we show honest progress while it works,
   and the student can stop at any point. Nothing opens in their face. */
function EnrichStrip({log, updateRow}){
  const missing = (log||[]).filter(r=>r.profile_url && (!r.avatar_url || !/^data:/.test(r.avatar_url)));
  const [dismissed,setDismissed] = useState(false);
  const [running,setRunning] = useState(false);
  const [done,setDone] = useState(0);
  const [failed,setFailed] = useState(0);
  const [current,setCurrent] = useState(null);
  const stopRef = useRef(false);
  if(dismissed || missing.length===0) return null;
  const total = missing.length;
  const pct = total ? Math.round(100*(done+failed)/total) : 0;

  async function run(){
    setRunning(true); stopRef.current=false; setDone(0); setFailed(0);
    for(const r of missing){
      if(stopRef.current) break;
      setCurrent(displayName(r));
      const res = await extBridge.photo(r.profile_url);
      if(res && res.ok && res.dataUrl){ await updateRow(r, {avatar_url: res.dataUrl}); setDone(d=>d+1); }
      else { setFailed(f=>f+1); if(res && res.error==='no_extension') break; }
    }
    setCurrent(null); setRunning(false);
  }

  return <div className="panel" style={{padding:'14px 18px',marginBottom:12,display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
    <div style={{minWidth:0,flex:1}}>
      <div style={{fontWeight:600,fontSize:14}}>
        {running ? `Adding details… ${done+failed} of ${total}`
                 : `${total} ${total===1?'person is':'people are'} missing a photo`}
      </div>
      <div className="note" style={{marginTop:2}}>
        {running
          ? <>Fetching {current?<strong>{current}</strong>:'profiles'} in the background — you can keep working.</>
          : 'Mighty can pull their photo and headline in the background, a few seconds apart.'}
      </div>
      <div className="scorebar" style={{marginTop:9,maxWidth:320}}><i style={{width:`${pct}%`}}/></div>
      {failed>0 && !running && <div className="note" style={{marginTop:5,color:'var(--terra2)'}}>{failed} couldn't be fetched — open those profiles yourself and they'll fill in.</div>}
    </div>
    <div style={{display:'flex',gap:8,alignItems:'center'}}>
      <span className="note">{done}/{total}</span>
      {running
        ? <button className="btn ghost sm" onClick={()=>{stopRef.current=true;}}>Stop</button>
        : <button className="btn sm" onClick={run}>Add details</button>}
      {!running && <button className="iconbtn" onClick={()=>setDismissed(true)}>Later</button>}
    </div>
  </div>;
}

function People({db,log,events,doIngest,setDrawerId,sb,auth,deletePeople,updateRow}){

  const [ai,setAi]=useState(null); const [aiBusy,setAiBusy]=useState(false); const [aiErr,setAiErr]=useState(null);
  const [sel,setSel]=useState(()=>new Set()); const [delBusy,setDelBusy]=useState(false);
  const mode = llmMode(sb,auth);
  const toggleOne=(id)=>setSel(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });
  const ql = q.toLowerCase();
  // When an AI answer is showing, the query is a question (not a name filter),
  // so keep the full table below instead of filtering it to nothing.
  const rows = ai ? log : log.filter(r=>!ql || `${r.name} ${r.company} ${r.title}`.toLowerCase().includes(ql));

  // Semantic "ask your network" — Claude reasons over a compact index of the
  // student's own contacts (name/role/company/notes/briefing/profile snippets)
  // and returns which ones match a natural-language question, with why. Grounded
  // strictly in the index; no fabricated people. Routed through the gateway's
  // network_search feature.
  async function askNetwork(query){
    const question = (typeof query==='string' ? query : q).trim();
    if(mode==='none' || !question) return;
    setAiBusy(true); setAiErr(null); setAi(null);
    try{
      const index = log.slice(0,120).map(r=>{
        const ctx=r.context||{}, br=r.briefing||{};
        const bits=[`#${r.id} ${displayName(r)}`, r.title, r.company, r.status];
        if(br.careerSummary) bits.push('brief:'+String(br.careerSummary).slice(0,160));
        if(r.notes) bits.push('notes:'+String(r.notes).slice(0,160));
        if(ctx.aboutText) bits.push('profile:'+String(ctx.aboutText).slice(0,220));
        return bits.filter(Boolean).join(' | ');
      }).join('\n');
      const r = await llmJSON(sb, auth, 'network_search',
        'You are a semantic search over an MIT Sloan Fellows MBA student\'s own saved contacts. Given a question and an indexed list of contacts, return the contacts that genuinely match. Use ONLY the provided index — never invent people or facts. If nothing matches, return an empty list.',
        `Question: ${question}\n\nContacts (one per line, prefixed with #id):\n${index}\n\nReturn JSON: {"matches": [{"id": number, "why": string (under 15 words)}]}. Ranked best-first, at most 12.`);
      setAi(r.matches||[]);
    }catch(e){ setAiErr(e.message||String(e)); }
    setAiBusy(false);
  }
  const aiRows = ai ? ai.map(m=>({m, r:log.find(x=>x.id===m.id)})).filter(x=>x.r) : null;

  const visibleIds = rows.map(r=>r.id);
  const allSel = visibleIds.length>0 && visibleIds.every(id=>sel.has(id));

    if(!sel.size) return;
    if(!window.confirm(`Delete ${sel.size} ${sel.size===1?'person':'people'} from your pipeline? This also removes their logged history and cannot be undone.`)) return;

      <div className="note">{rows.length} of {log.length} people</div>
      <div style={{flex:1}}/>
      <button className="btn ghost sm" onClick={async()=>{setChecking(true); await doIngest(); setChecking(false);}} disabled={checking}>{checking?<Dots/>:'↻ Check for new profiles'}</button>
    </div>

    <EnrichStrip log={log} updateRow={updateRow}/>

    {mode!=='none' && !ai && log.length>0 && <div style={{display:'flex',flexWrap:'wrap',gap:8,alignItems:'center',marginTop:-2,marginBottom:2}}>
      <span className="note" style={{color:'var(--mute2)'}}>Ask Mighty:</span>
      {['Who works in healthcare?','Who knows climate VC?','Who have I met from Bain?','Who have I ignored for 6 months?'].map(qq=>
        <span key={qq} className="chip" style={{cursor:'pointer',background:'var(--bsoft)',color:'var(--brand2)'}} onClick={()=>{ setQ(qq); askNetwork(qq); }}>{qq}</span>)}
    </div>}

    {sel.size>0 && <div className="panel" style={{display:'flex',alignItems:'center',gap:12,marginBottom:12,padding:'10px 16px'}}>
      <div style={{fontWeight:600,fontSize:13}}>{sel.size} selected</div>
      <div style={{flex:1}}/>
      <button className="btn ghost sm" onClick={()=>setSel(new Set())}>Clear</button>
      <button className="btn sm" onClick={doDelete} disabled={delBusy} style={{background:'var(--brand)',color:'#fff',border:'none'}}>{delBusy?<Dots/>:`Delete ${sel.size}`}</button>
    </div>}

    {aiErr && <div className="warnbox" style={{marginBottom:12}}>{aiErr}</div>}
    {aiRows && <div className="panel pad" style={{marginBottom:14}}>
      <div className="ph" style={{marginBottom:aiRows.length?12:0}}>
        <div><h2 style={{fontSize:15}}>✨ Answering: "{q.trim()}"</h2><div className="sub">{aiRows.length} match{aiRows.length===1?'':'es'} from your network</div></div>

      </div>
      {aiRows.length===0
        ? <div className="note">No one in your saved contacts matches that. Try saving more people, or rephrasing.</div>
        : <div className="list">{aiRows.map(({m,r})=><div key={r.id} className="row" style={{cursor:'pointer'}} onClick={()=>setDrawerId(r.id)}>
            <PersonHover row={r} evs={events.filter(e=>e.log_id===r.id)} followUpDays={db.settings.followUpDays} style={{display:'flex',alignItems:'center',gap:12,flex:1,minWidth:0}}>
              <Avatar row={r} size={34}/>
              <div className="grow"><div className="t">{displayName(r)}</div><div className="m">{r.title||''}{r.company?` · ${r.company}`:''}</div></div>
            </PersonHover>
            <div style={{maxWidth:260,textAlign:'right',fontSize:12.5,color:'var(--brand2)'}}>{m.why}</div>
          </div>)}</div>}

    <div className="panel" style={{overflow:'auto'}}>
      {log.length===0
        ? <div className="empty"><div className="big">◔</div>Nobody yet. Shortlist profiles with the extension, then hit "Check for new profiles."</div>

            <th style={{width:34,paddingRight:0}}><input type="checkbox" checked={allSel} onChange={toggleAll} aria-label="Select all" style={{cursor:'pointer'}}/></th>
            <th>Name</th><th>Company</th><th>Location</th><th>Last interaction</th><th>Relationship</th><th>Next</th></tr></thead>
          <tbody>{rows.map(r=>{
            const evs = events.filter(e=>e.log_id===r.id);

              <td onClick={e=>e.stopPropagation()} style={{width:34,paddingRight:0}}><input type="checkbox" checked={sel.has(r.id)} onChange={()=>toggleOne(r.id)} aria-label="Select" style={{cursor:'pointer'}}/></td>
              <td><PersonHover row={r} evs={evs} followUpDays={db.settings.followUpDays} style={{display:'flex',alignItems:'center',gap:11,width:'100%'}}>

                  <div style={{fontWeight:600,fontSize:14,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{displayName(r)}</div>
                  {r.title && <div style={{fontSize:12.5,color:'var(--mute)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:230}}>{r.title}</div>}
                </div>
              </PersonHover></td>
              <td style={{maxWidth:150}}><div style={{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.company||'—'}</div></td>
              <td style={{maxWidth:150,color:'var(--sub)'}}><div style={{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{ctx.location||'—'}</div></td>
              <td><div style={{fontSize:13.5}}>{last.label}</div><div style={{fontSize:12.5,color:'var(--mute)'}}>{last.when}</div></td>
              <td><StagePill status={r.status}/></td>
              <td style={{color:'var(--brand2)',fontWeight:500,fontSize:13}}>{na?na.label:'—'}</td>

        </table>}
    </div>
  </div>;

/* ============================ Tasks ============================ */
// Tasks — what you've committed to. Most of this list should NOT be typed by
// hand: promises you made in a coffee chat, follow-ups that have gone quiet and
// next-touch dates you agreed to are already sitting in your timeline, so Mighty
// surfaces them and you just accept. Everything here traces to a real record.
function surfacedTasks(log, events, tasks, followUpDays){
  const out = [];
  const taken = new Set((tasks||[]).map(t=>String(t.label||'').trim().toLowerCase()));
  const byId = new Map(log.map(r=>[r.id,r]));
  const repliedIds = new Set(events.filter(e=>e.event_type==='reply').map(e=>e.log_id));
  const push = o => { if(!taken.has(o.label.trim().toLowerCase())) out.push(o); };

  // 1. Promises you made, extracted from coffee-chat notes.
  events.forEach(e=>{
    const person = byId.get(e.log_id); if(!person) return;
    ((e.extracted||{}).promises||[]).forEach(p=>{
      if(!p) return;
      push({key:'p'+e.id+p, label:String(p), why:`You promised ${displayName(person)}`, person, when:new Date(e.occurred_at).getTime(), kind:'promise'});
    });
  });
  // 2. Next touch you agreed to, now due.
  events.forEach(e=>{
    if(!e.suggested_next_touch) return;
    const person = byId.get(e.log_id); if(!person) return;
    if(new Date(e.suggested_next_touch).getTime() > now()) return;
    push({key:'n'+e.id, label:`Reconnect with ${displayName(person)}`, why:'Next touch you planned is due', person, when:new Date(e.suggested_next_touch).getTime(), kind:'touch'});
  });
  // 3. Follow-ups that have gone quiet.
  log.forEach(r=>{
    if(r.status!=='contacted' || repliedIds.has(r.id) || !r.contacted_at) return;
    const days = Math.round((now()-new Date(r.contacted_at).getTime())/864e5);
    if(days <= followUpDays) return;
    push({key:'f'+r.id, label:`Follow up with ${displayName(r)}`, why:`No reply in ${days} days`, person:r, when:new Date(r.contacted_at).getTime(), kind:'followup'});
  });
  // 4. Thank-you after a recent coffee chat.
  log.forEach(r=>{
    if(r.status!=='coffee_chat') return;
    const chat = events.filter(e=>e.log_id===r.id && e.event_type==='coffee_chat').sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at))[0];
    if(!chat) return;
    const days = Math.round((now()-new Date(chat.occurred_at).getTime())/864e5);
    if(days > 14) return;
    push({key:'t'+r.id, label:`Send ${displayName(r)} a thank-you note`, why:`Coffee chat ${days===0?'today':days+'d ago'}`, person:r, when:new Date(chat.occurred_at).getTime(), kind:'thanks'});
  });
  const rank = {promise:0, followup:1, touch:2, thanks:3};
  return out.sort((a,b)=> (rank[a.kind]-rank[b.kind]) || (a.when-b.when));
}

function Tasks({tasks,log,events,db,addTask,toggleTask,deleteTask,setDrawerId}){
  const [newTask,setNewTask]=useState('');
  const [adding,setAdding]=useState(null);
  const todayStr = new Date().toISOString().slice(0,10);
  function submit(e){
    if(e.key==='Enter' && newTask.trim()){ addTask(newTask.trim(), todayStr, null); setNewTask(''); }
  }
  const surfaced = surfacedTasks(log, events||[], tasks, db?.settings?.followUpDays||7);
  const KIND = {promise:{t:'Promise', c:'var(--terra2)', bg:'var(--tsoft)'}, followup:{t:'Follow-up', c:'var(--brand2)', bg:'var(--bsoft)'},
                touch:{t:'Reconnect', c:'var(--brand2)', bg:'var(--bsoft)'}, thanks:{t:'Thank-you', c:'var(--green2)', bg:'var(--gsoft)'}};
  async function accept(s){
    setAdding(s.key);

// Intelligence — patterns you'd otherwise miss, not analytics. Everything is
// derived from your own contacts + timeline; nothing is invented.
function Insights({log,events,tasks,db,communityStats,setDrawerId}){
  const active = log.filter(r=>r.status!=='do_not_contact');
  const lastTouch = r => { const evs=events.filter(e=>e.log_id===r.id); const ev=evs.slice().sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at))[0];
    return ev?new Date(ev.occurred_at).getTime() : (r.contacted_at?new Date(r.contacted_at).getTime() : new Date(r.shortlisted_at||r.updated_at).getTime()); };
  const everContacted = log.filter(r=>r.status!=='prospect'&&r.status!=='ready_to_contact'&&r.status!=='do_not_contact').length;
  const replied = log.filter(r=>['replied','coffee_chat','referral','interview','offer'].includes(r.status)).length;
  const responseRate = everContacted ? Math.round(100*replied/everContacted) : 0;
  const followUpDays = db?.settings?.followUpDays||7;
  const repliedIds = new Set(events.filter(e=>e.event_type==='reply').map(e=>e.log_id));

  // Risks: overdue promises + follow-ups that have gone quiet.
  const overduePromises = (tasks||[]).filter(t=>!t.done && t.due_date && new Date(t.due_date).getTime() < now());
  const overdueFollowups = active.filter(r=>r.status==='contacted' && !repliedIds.has(r.id) && r.contacted_at && (now()-new Date(r.contacted_at).getTime())>followUpDays*864e5);
  const riskCount = overduePromises.length + overdueFollowups.length;

  // Network Health — a single honest score from activity, responsiveness, risk.
  const staleRatio = active.length ? active.filter(r=>now()-lastTouch(r)>60*864e5).length/active.length : 0;
  const health = active.length===0 ? 0 : Math.max(0, Math.min(100, Math.round(62 + responseRate*0.3 - riskCount*4 - staleRatio*28)));
  const healthLabel = health>=80?'Excellent':health>=62?'Healthy':health>=42?'Needs attention':'At risk';

  // Companies you're strongest in.
  const companyMap = {};
  active.forEach(r=>{ if(!r.company) return; const c=companyMap[r.company]=companyMap[r.company]||{contacts:0,replies:0}; c.contacts++; if(['replied','coffee_chat','referral','interview','offer'].includes(r.status)) c.replies++; });
  const strongest = Object.entries(companyMap).sort((a,b)=>b[1].contacts-a[1].contacts).slice(0,5);
  const responsive = Object.entries(companyMap).filter(([,c])=>c.contacts>=2).map(([n,c])=>[n, Math.round(100*c.replies/c.contacts), c]).sort((a,b)=>b[1]-a[1])[0];

  // People who've gone quiet the longest.
  const reconnect = active.filter(r=>r.status!=='prospect').map(r=>({r, t:lastTouch(r)})).sort((a,b)=>a.t-b.t).slice(0,4);
  const monthOf = t => new Date(t).toLocaleDateString(undefined,{month:'long', year:'numeric'});

  // Introductions you've generated.
  const intros = log.filter(r=>['referral','interview','offer'].includes(r.status)).length
    + events.filter(e=>e.event_type==='referral').length;

  const card = {background:'var(--card)',border:'1px solid var(--line)',borderRadius:'var(--radius)',padding:'24px 26px'};
  const kicker = {fontSize:11.5,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--mute2)'};

  return <div className="page">
    {active.length===0 && <div className="panel pad"><div className="empty"><div className="big">🧠</div>Save a few people and log an interaction — Mighty starts spotting patterns once there's history.</div></div>}
    {active.length>0 && <>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1.3fr',gap:18,alignItems:'stretch'}}>
      <div style={{...card,background:'linear-gradient(150deg, var(--bsoft), var(--psoft))',border:'none',display:'flex',flexDirection:'column',gap:4,justifyContent:'center'}}>
        <span style={kicker}>Network health</span>
        <div style={{fontFamily:'var(--fh)',fontWeight:600,fontSize:60,lineHeight:1,letterSpacing:'-.04em'}}>{health}</div>
        <div style={{fontWeight:600,fontSize:18,color:'var(--brand2)'}}>{healthLabel}</div>
        <div className="note" style={{marginTop:4}}>{responseRate}% reply rate · {Math.round(staleRatio*100)}% of relationships gone quiet</div>
      </div>
      <div style={{...card,display:'flex',flexDirection:'column',gap:12}}>
        <div style={{display:'flex',alignItems:'baseline',gap:10}}><span style={kicker}>Relationship risks</span><span style={{marginLeft:'auto',fontFamily:'var(--fh)',fontWeight:600,fontSize:22,color:riskCount?'var(--terra2)':'var(--green2)'}}>{riskCount}</span></div>
        {riskCount===0 ? <div className="note">Nothing slipping. Every promise is on track.</div>
          : <div className="list">
            {overduePromises.slice(0,3).map(t=><div key={'t'+t.id} className="row" style={{borderColor:'var(--line)'}}><span style={{width:7,height:7,borderRadius:99,background:'var(--terra)',flex:'none'}}/><div className="grow"><div className="t" style={{fontWeight:500}}>{t.label}</div><div className="m">Promise overdue</div></div></div>)}
            {overdueFollowups.slice(0,Math.max(0,3-overduePromises.length)).map(r=><div key={'f'+r.id} className="row" style={{borderColor:'var(--line)',cursor:'pointer'}} onClick={()=>setDrawerId&&setDrawerId(r.id)}><span style={{width:7,height:7,borderRadius:99,background:'var(--terra)',flex:'none'}}/><div className="grow"><div className="t" style={{fontWeight:500}}>{displayName(r)}</div><div className="m">No reply — follow up</div></div></div>)}
          </div>}
      </div>
    </div>

    <div className="grid3" style={{marginTop:18}}>
      <div style={card}>
        <span style={kicker}>Strongest with</span>
        <div style={{marginTop:12,display:'flex',flexDirection:'column',gap:9}}>
          {strongest.length===0 ? <div className="note">No company data yet.</div>
            : strongest.map(([n,c])=><div key={n} style={{display:'flex',alignItems:'center',gap:10}}><span style={{fontWeight:500,fontSize:14.5}}>{n}</span><span style={{marginLeft:'auto'}} className="note">{c.contacts}</span></div>)}
        </div>
      </div>
      <div style={card}>
        <span style={kicker}>Most responsive</span>
        {responsive ? <><div style={{fontFamily:'var(--fh)',fontWeight:600,fontSize:24,marginTop:10,letterSpacing:'-.02em'}}>{responsive[0]}</div><div className="note" style={{marginTop:4}}>{responsive[1]}% reply rate across {responsive[2].contacts} contacts</div></>
          : <div className="note" style={{marginTop:10}}>Not enough replies yet to tell.</div>}
      </div>
      <div style={card}>
        <span style={kicker}>Introductions generated</span>
        <div style={{fontFamily:'var(--fh)',fontWeight:600,fontSize:36,marginTop:10,letterSpacing:'-.03em'}}>{intros}</div>
        <div className="note" style={{marginTop:2}}>Referrals, interviews and offers your network opened.</div>
      </div>
    </div>

    <div style={{...card,marginTop:18}}>
      <span style={kicker}>You haven't talked to</span>
      <div style={{marginTop:12,display:'flex',flexDirection:'column',gap:2}}>
        {reconnect.length===0 ? <div className="note">Everyone's fresh — nice.</div>
          : reconnect.map(({r,t})=><div key={r.id} className="row" style={{border:'none',background:'transparent',padding:'10px 4px',cursor:'pointer'}} onClick={()=>setDrawerId&&setDrawerId(r.id)}>
              <PersonHover row={r} evs={events.filter(e=>e.log_id===r.id)} followUpDays={followUpDays} style={{display:'flex',alignItems:'center',gap:12,flex:1,minWidth:0}}>
                <Avatar row={r} size={32}/>
                <div className="grow"><div className="t" style={{fontWeight:500}}>{displayName(r)}</div><div className="m">{[r.title,r.company].filter(Boolean).join(' · ')}</div></div>
              </PersonHover>
              <div className="note">since {monthOf(t)}</div>
            </div>)}
      </div>
    </div>

    <div style={{marginTop:18}}><CommunityInsights communityStats={communityStats}/></div>
    </>}
  </div>;
}
