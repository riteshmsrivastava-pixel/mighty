<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mighty</title>
<!-- ============================================================
     Mighty v2 - the relationship operating system.
     Governed by docs/PRODUCT-BIBLE-v2.md. Visual spec: the Claude Design
     bundle (app-redesign-with-new-principles).

     Navigation is the user's questions, not features:
       Today - what deserves my attention?
       Relationships - where am I with everyone, and who is worth adding?
       You - how does this work for me? (Mirror, Patterns, Goal, Account)
       Ask Mighty - what should I do?

     Permanent rules enforced here:
       · You always click Send. Nothing is ever sent automatically.
       · Explain before you score - no numeric match scores in the UI.
       · Save is the only way a person enters Mighty; 'prospect' IS Saved.
       · Navigation is always visible; only depth unlocks, on data not time.
       · Never "Mighty knows" - always "Things you have learned".
       · No empty dashboards: every panel hides until it has real data.

     Same Supabase project, tables and settings keys as app/v1.html, so both
     apps read and write one account.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="icon" href="../favicon.ico?v=2" sizes="any">

<style>
  :root{
 --paper:#FBFAF8; --rail:#FFFFFF; --card:#FFFFFF; --card2:#FBFAF8;
 --line:#ECEAE4; --line2:#F1EFE9; --line3:#EFEDE7; --line4:#F1EFE9;
 --ink:#1D1B26; --ink2:#2A2833; --body:#33313D; --sub:#8A8896; --mute:#B4B1BC; --mute2:#A39FA8;
 --brand:#5B4FE9; --brand-h:#4A3FD1; --brand-ink:#4A3FD1;
 --brand-soft:#F5F3FD; --brand-soft2:#EFEDFD; --brand-line:#E4E0F7; --brand-nav:#EFEDFD;
 --peach:#E87A56;
 --green:#2E8B5F; --green2:#2E8B5F; --green-soft:#E6F4EC;
 --amber:#B0641F; --amber-soft:#FBF1E2; --amber-dot:#E3A23C;
 --red:#C75B33; --red-soft:#FBEFE9;
 --f:'Schibsted Grotesk',system-ui,-apple-system,sans-serif;
 --r:16px; --rsm:14px; --pill:999px; --sh:0 1px 3px rgba(29,27,38,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
  a{color:var(--brand);text-decoration:none}
  button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
  input,textarea,select{font-family:inherit;color:inherit}
  input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  ::selection{background:#E4DEFC}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#E2DED7;border-radius:99px;border:3px solid var(--paper)}
  ::-webkit-scrollbar-track{background:transparent}

  .h1{font-size:32px;font-weight:700;letter-spacing:-.025em;text-wrap:pretty;margin:0}
  .h2{font-size:26px;font-weight:700;letter-spacing:-.025em;text-wrap:pretty;margin:0}
  .h3{font-size:19px;font-weight:700;letter-spacing:-.015em}
  .h4{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
  .eyebrow.b{color:var(--brand)}
  .sub{font-size:15px;color:var(--sub)}
  .meta{font-size:13px;color:var(--mute2)}
  .pad{padding:40px 48px 90px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
  .why{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:12px}

  .btn{padding:11px 20px;border-radius:var(--pill);background:var(--brand);color:#fff;font-size:14.5px;font-weight:700;transition:background .15s;white-space:nowrap}
  .btn:hover:not(:disabled){background:var(--brand-h)}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn.g{background:#fff;border:1px solid #E2DDD6;color:var(--ink);font-weight:600}
  .btn.g:hover:not(:disabled){border-color:var(--brand);color:var(--brand-ink);background:#fff}
  .btn.sm{padding:9px 17px;font-size:14px}
  .btn.xs{padding:7px 14px;font-size:13px}
  .btn.q{background:none;color:var(--sub);font-weight:600;padding:8px 12px}
  .btn.q:hover{color:var(--ink)}
  .btn.soft{background:#F4F2EE;color:#5B554D;font-weight:600}
  .btn.soft:hover{background:#EDEAE4}

  .inp{width:100%;padding:14px 16px;border-radius:var(--rsm);border:1px solid #E4E0D9;background:var(--card2);font-size:15.5px}
  .inp:focus{background:#fff}
  .inp::placeholder{color:#B8B1A8}
  textarea.inp{min-height:74px;resize:vertical;line-height:1.55;padding:13px 15px;border-radius:12px;font-size:15px}
  .lbl{font-size:12.5px;font-weight:700;color:#6B655C;margin-bottom:6px}

  .chip{padding:8px 15px;border-radius:var(--pill);border:1px solid var(--line);background:var(--card2);font-size:13.5px;color:#5B554D;font-weight:500;white-space:nowrap}
  .chip:hover:not(:disabled){border-color:#C9BFF7;color:var(--brand-ink)}
  .chip.on{background:var(--brand-soft2);border-color:#CFC4F9;color:var(--brand-ink);font-weight:700}
  .tag{padding:6px 12px;border-radius:var(--pill);background:#F4F2EE;font-size:12.5px;color:#6B655C;font-weight:500;white-space:nowrap}
  .tagx{display:inline-flex;align-items:center;gap:7px;padding:7px 8px 7px 14px;border-radius:var(--pill);background:var(--brand-soft2);color:var(--brand-ink);font-size:13.5px;font-weight:600}
  .tagx button{color:#8C7BE8;font-size:15px;line-height:1;padding:0 4px}
  .tagx button:hover{color:var(--brand-ink)}
  .seg{display:flex;gap:3px;padding:3px;background:#F0EDE8;border-radius:12px;width:fit-content}
  .seg button{padding:8px 16px;border-radius:9px;font-size:14px;font-weight:600;color:#6B655C;white-space:nowrap}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}

  .av{border-radius:50%;background:#E6E1FB;color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
  .pill{display:inline-block;padding:5px 12px;border-radius:var(--pill);font-size:12.5px;font-weight:700;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .row{display:flex;align-items:center;gap:16px}
  .stack{display:flex;flex-direction:column}
  .tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs button{padding:11px 0;font-size:14.5px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:700}

  .spin{width:15px;height:15px;border:2px solid #DED8F7;border-top-color:var(--brand);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .fade{animation:fi .22s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .banner{border-radius:12px;padding:13px 16px;font-size:14px;font-weight:500;line-height:1.5}
  .banner.warn{background:var(--amber-soft);color:#6E5F3D;border:1px solid #F0E4C6}
  .banner.err{background:var(--red-soft);color:#8E4238;border:1px solid #F6D9D4}
  .banner.ok{background:var(--green-soft);color:var(--green);border:1px solid #CFE5D8}
  .hint{font-size:13px;color:var(--mute2);line-height:1.5}
  .lift:hover{background:var(--card2)}
  /* Today's cards carry a status-tinted background (see TONE_BG), which as an
     inline style outranks .lift:hover's plain background swap - this keeps a
     hover cue (a lift + soft shadow, neither set inline) instead of losing it. */
  .todaycard{transition:transform .15s ease,box-shadow .15s ease}
  .todaycard:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(38,32,14,.06)}
  .colcard{background:#fff;border:1px solid var(--line);border-radius:var(--rsm);padding:15px 16px;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .colcard:hover{border-color:#D6CFF8;transform:translateY(-2px);box-shadow:0 8px 18px rgba(91,79,233,.10)}
  .drop{outline:2px dashed #CFC4F9;outline-offset:-4px;border-radius:12px}

  @media (max-width:900px){
    .h1{font-size:26px} .h2{font-size:22px}
    .pad{padding:26px 20px 90px!important}
    /* the rail carries an inline display:flex, so this needs to win */
    .railwrap{display:none!important}
    .mobnav{display:flex!important}
    .hdr{padding:14px 20px!important}
    .hdr h1{font-size:17px!important}
  }
  .mobnav{display:none}
</style>

<script>

<script type="text/babel" data-presets="react-classic">
const {useState, useEffect, useRef, useMemo} = React;
const F = React.Fragment;

/* ===================== platform config (same project as app/v1.html) ===================== */
const SUPABASE_URL      = 'https://hplyyywdftnvjajyncvj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_e_oCwuz3Qlko5N3Xl8ZwxA_zQijz_u8';


/* Primary-goal vocabulary is v1's goalType enum so both apps score alike. */
const GOALS = [
  {id:'job_search',    label:'Find a new job',         hint:'Hiring managers, alumni, people already in the role'},
  {id:'raise_funding', label:'Raise investment',       hint:'Investors, angels, founders who have raised'},
  {id:'sales',         label:'Find customers',         hint:'Buyers, executives, decision makers'},
  {id:'mentors',       label:'Find mentors & advisors', hint:'Operators and experts a step ahead of you'},
  {id:'networking',    label:'Build my network',       hint:'Broad, deliberate, long-term relationships'},
];
const GOAL_LABEL = GOALS.reduce((a,g)=>{a[g.id]=g.label;return a;},{});
/* One goal can now be several. goalTypes is the source of truth when it
   exists; goalType (singular) survives on old accounts that saved before
   this changed. */
const goalTypeList = (st)=>{
  const s = st||{};
  return (s.goalTypes&&s.goalTypes.length) ? s.goalTypes : (s.goalType ? [s.goalType] : []);
};
const goalLine = (st)=>{
  const s = st||{};
  if(clean(s.goal)) return s.goal;
  const labels = goalTypeList(s).map(t=>GOAL_LABEL[t]).filter(Boolean);
  return labels.join(' and ') || 'Build your network';
};
/* A two-or-three-word version of the goal, for the one place a full sentence
   would not fit - "One step closer to funding," not "...to Raise a seed
   round for an AI-native venture studio, from investors who..." */
const GOAL_SHORT = {job_search:'a new job', raise_funding:'funding', sales:'new customers',
  mentors:'the right mentors', networking:'a stronger network'};
const goalShort = (st)=> GOAL_SHORT[goalTypeList(st)[0]] || 'your goal';

/* outreach_log.status is the ONE stage field. 'prospect' IS Saved. */
const STAGE = {
  prospect:        {label:'Saved',              bg:'#F1EFEA', fg:'#5A5766', dot:'#C9C6BF'},
  ready_to_contact:{label:'Ready to reach out', bg:'#EFEDFD', fg:'#4A3FD1', dot:'#5B4FE9'},
  contacted:       {label:'Reached out', bg:'#FBF1E2', fg:'#B0641F', dot:'#E3A23C'},
  replied:         {label:'In conversation',bg:'#E6F4EC', fg:'#2E8B5F', dot:'#2E8B5F'},
  coffee_chat:     {label:'Met',                bg:'#E6F4EC', fg:'#2E8B5F', dot:'#2E8B5F'},
  referral:        {label:'Opportunity in motion',bg:'#E6F4EC', fg:'#2E8B5F', dot:'#2E8B5F'},
  interview:       {label:'Opportunity in motion',bg:'#E6F4EC', fg:'#2E8B5F', dot:'#2E8B5F'},
  offer:           {label:'Growing',              bg:'#E6F4EC', fg:'#2E8B5F', dot:'#2E8B5F'},
  do_not_contact:  {label:'Closed out',     bg:'#F1EFEA', fg:'#8A8896', dot:'#DDD9D1'},
};
const stageOf = (r)=>STAGE[(r||{}).status] || STAGE.prospect;
/* Board columns follow the Bible's default pipeline; the late statuses share
   one "Growing" column so the board stays readable. */
const COLUMNS = [
  {key:'prospect',         statuses:['prospect']},
  {key:'ready_to_contact', statuses:['ready_to_contact']},
  {key:'contacted',        statuses:['contacted']},
  {key:'replied',          statuses:['replied']},
  {key:'coffee_chat',      statuses:['coffee_chat']},
  {key:'growing',          statuses:['referral','interview','offer'], label:'Growing'},
];
const ORDER = ['prospect','ready_to_contact','contacted','replied','coffee_chat','referral','interview','offer'];
const REACHED = ['contacted','replied','coffee_chat','referral','interview','offer'];
const EVENT_LABEL = {connection_request:'Connection request', first_message:'Reached out',
  reply:'They replied', coffee_chat:'Met', note:'Note captured', referral:'Introduction made',
  interview:'Meeting', stage_change:'Stage changed'};

/* ===================== progressive disclosure =====================
   Navigation is always visible. Only depth unlocks, and only on data. */
const UNLOCKS = {
  board:    {test:(p)=>p.length>=5,       hint:'The board opens once five people are saved. Before that, a list says more.'},
  timeline: {test:(p,e)=>e.length>=3,     hint:'The timeline fills in once three things have happened.'},
  health:   {test:(p)=>p.filter(r=>REACHED.includes(r.status)).length>=3,
             hint:'Reach out to three people and Mighty can start showing what is working.'},
  progress: {test:(p)=>p.length>=3,       hint:'Progress appears once you have saved three people.'},
};
const canSee = (k,p,e)=>{ try{ return !!UNLOCKS[k].test(p,e); }catch(err){ return false; } };

/* ===================== helpers ===================== */
const clean = (s)=>String(s==null?'':s).trim();
const initials = (n)=>clean(n).split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
const firstName = (n)=>clean(n).split(/\s+/)[0] || '';
const DAY = 86400000;
const days = (iso)=> iso ? Math.floor((Date.now()-new Date(iso).getTime())/DAY) : null;
const ago = (iso)=>{ const d=days(iso); if(d==null) return ''; return d<=0?'today':d===1?'yesterday':d<30?d+' days ago':d<365?Math.round(d/30)+' months ago':Math.round(d/365)+'y ago'; };
const dateShort = (iso)=>{ if(!iso) return ''; const d=new Date(iso);
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); };
const greetWord = ()=>{ const h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; };

/* Real photo when one exists - the extension captures it the moment someone
   is saved from a search result or from their own profile - falling back to
   initials the moment the image 404s (a stale or since-privated LinkedIn
   photo URL) rather than showing a broken-image icon. */
/* One shape out of the several a "person" arrives in across the app - a
   saved outreach_log row, a connections_match row, a raw search result -
   read for whatever it actually has, so the hover preview works the same
   everywhere instead of needing a different card per source. */
function personPreview(p){
  if(!p) return null;
  const name = clean(p.name) || (p.first_name!=null ? connName(p) : '');
  if(!name) return null;
  const ctx = p.context || {};
  const why = clean(ctx.whySaved) || clean(p.why) || connReason(p);
  const common = (p.briefing && p.briefing.shared && p.briefing.shared.length) ? p.briefing.shared
    : (ctx.common || p.common || []);
  return {
    name, title: p.title || p.position || '', company: p.company || '',
    location: ctx.location || p.location || '', education: ctx.education || p.education || '',
    why, common, summary: (p.briefing && clean(p.briefing.careerSummary)) || '', status: p.status,
  };
}
function Avatar({name, size, src, hover}){
  const s = size||38;
  const [broken,setBroken] = useState(false);
  const [show,setShow] = useState(false);
  const [rect,setRect] = useState(null);
  const ref = useRef(null);
  const core = (src && !broken)
    ? <img ref={ref} src={src} alt="" width={s} height={s} onError={()=>setBroken(true)}
        style={{width:s,height:s,borderRadius:'50%',objectFit:'cover',flex:'none',background:'var(--card2)'}}/>
    : <div ref={ref} className="av" style={{width:s,height:s,fontSize:Math.round(s*0.36)}}>{initials(name)}</div>;
  const p = hover && personPreview(hover);
  if(!p) return core;
  const open = ()=>{ if(ref.current) setRect(ref.current.getBoundingClientRect()); setShow(true); };
  const close = ()=> setShow(false);
  const st = p.status ? stageOf({status:p.status}) : null;
  /* Portalled to the body and positioned from the real avatar's bounding
     box, rather than an absolutely-positioned sibling, so it is never
     clipped by a card's overflow:hidden - which several of the lists this
     shows up in rely on for their own rounded corners. */
  return (
    <span onMouseEnter={open} onMouseLeave={close} style={{display:'inline-flex',flex:'none'}}>
      {core}
      {show && rect && (()=>{
        /* Card height is content-dependent (location/education/summary/tags
           all vary), so clamping only the top edge left it rendering off the
           bottom of the viewport for avatars low in a long list - exactly
           where hovering to preview is most likely. Flip above the avatar
           when there isn't enough room below, and cap height either way as
           a backstop. */
        const spaceBelow = window.innerHeight - rect.bottom;
        const openAbove = spaceBelow < 340 && rect.top > spaceBelow;
        /* maxHeight must fit the actual room in whichever direction was
           chosen, not a flat 420px guess - a card that size could still
           clip past either edge whenever available space fell short of it
           but still passed the flip threshold above. */
        const room = openAbove ? rect.top - 20 : spaceBelow - 20;
        const cardMax = Math.max(120, Math.min(420, room));
        return ReactDOM.createPortal(
        <div onMouseEnter={open} onMouseLeave={close} className="fade"
          style={{position:'fixed', left:Math.max(12,Math.min(rect.left, window.innerWidth-308)),
            ...(openAbove ? {bottom:Math.max(12,window.innerHeight-rect.top+8)} : {top:rect.bottom+8}),
            maxHeight:cardMax, overflowY:'auto',
            zIndex:200, width:280,
            background:'#fff', border:'1px solid var(--line)', borderRadius:16,
            boxShadow:'0 12px 32px rgba(26,25,23,.16)', padding:18}}>
          <div className="row" style={{gap:12}}>
            {src && !broken
              ? <img src={src} alt="" width={40} height={40} style={{width:40,height:40,borderRadius:'50%',objectFit:'cover',flex:'none'}}/>
              : <div className="av" style={{width:40,height:40,fontSize:15}}>{initials(p.name)}</div>}
            <div style={{minWidth:0}}>
              <div style={{fontWeight:700,fontSize:15,letterSpacing:'-.01em'}}>{p.name}</div>
              <div className="sub" style={{fontSize:12.5,marginTop:1}}>{[p.title,p.company].filter(Boolean).join(' · ')||'No headline captured'}</div>
            </div>
          </div>
          {st && <div style={{marginTop:10}}><span className="pill" style={{background:st.bg,color:st.fg,fontSize:11,padding:'4px 11px'}}>{st.label}</span></div>}
          {(p.location||p.education) &&
            <div className="meta" style={{marginTop:10}}>{[p.location,p.education].filter(Boolean).join(' · ')}</div>}
          {p.summary &&
            <div style={{marginTop:10,fontSize:13,lineHeight:1.5,color:'var(--body)'}}>{p.summary}</div>}
          {!p.summary && p.why &&
            <div style={{marginTop:10,fontSize:13,lineHeight:1.5,color:'var(--brand-ink)'}}>{p.why}</div>}
          {p.common && p.common.length>0 &&
            <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:10}}>
              {p.common.slice(0,4).map((c,i)=><span key={i} className="tag" style={{fontSize:11,padding:'4px 10px'}}>{c}</span>)}
            </div>}
        </div>, document.body);
      })()}
    </span>
  );
}
/* Real, visible movement for an accepted connection request without a new pipeline stage - the
   spec's own decided design. Reads context.connectionAccepted, set by ingest()'s reply_detected/
   connection_accepted branch (or resolveAmbiguousActivity) once the extension's own match on
   LinkedIn's notifications feed came back certain. */
function ConnectedBadge({r, size}){
  if(!r || !(r.context||{}).connectionAccepted) return null;
  const sm = size==='sm';
  return (
    <span title="Accepted your connection request" style={{display:'inline-flex',alignItems:'center',gap:3,
      background:'var(--green-soft)',color:'var(--green)',fontWeight:700,borderRadius:999,flex:'none',
      fontSize:sm?10:11,padding:sm?'2px 7px':'3px 9px'}}>
      <svg width={sm?8:9} height={sm?8:9} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5"
        strokeLinecap="round" strokeLinejoin="round"><path d="m4 12.5 5 5L20 6.5"/></svg>
      Connected
    </span>
  );
}
function Empty({title, body, cta, onCta, disabled}){
  return (
    <div className="card" style={{padding:'34px 30px'}}>
      <div className="h3">{title}</div>
      <div className="sub" style={{marginTop:7,lineHeight:1.55,maxWidth:520,textWrap:'pretty'}}>{body}</div>
      {cta && <button className="btn" style={{marginTop:20}} onClick={onCta} disabled={!!disabled}>{cta}</button>}
    </div>
  );
}
function ChipInput({value, onChange, placeholder}){
  const [t,setT] = useState('');
  const add = ()=>{
    const parts = t.split(',').map(clean).filter(Boolean);
    if(!parts.length) return;
    const next = value.slice();
    parts.forEach(p=>{ if(!next.some(v=>v.toLowerCase()===p.toLowerCase())) next.push(p); });
    onChange(next); setT('');
  };
  return (
    <div>
      {value.length>0 &&
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:10}}>
          {value.map((v,i)=>(
            <span key={v+i} className="tagx">{v}
              <button onClick={()=>onChange(value.filter((_,j)=>j!==i))} aria-label={'Remove '+v}>×</button>
            </span>))}
        </div>}
      <input className="inp" value={t} placeholder={placeholder}
        onChange={e=>setT(e.target.value)}
        onKeyDown={e=>{ if(e.key==='Enter'||e.key===','){ e.preventDefault(); add(); } }}
        onBlur={add}/>
    </div>
  );
}

/* ===================== AI (shared ai-proxy - no key ever reaches the client) ===================== */
/* ---- Instrumentation --------------------------------------------------------
   Our own table, not a third-party service, because we tell people that nothing
   they write about someone leaves their account. Sending behavioural data to a
   vendor a week after saying that would make it untrue in spirit.

   Counts and categories only. safeProps() enforces that structurally rather than
   by convention: a value survives only if it is a finite number, a boolean, or a
   short enum-shaped string. A name has a space and a capital, an email has an @,
   a URL has a colon and a slash - all three are dropped by the same rule, so a
   leak requires defeating the sanitizer rather than merely forgetting the rule.

   Fire and forget. Analytics must never break a feature or make the user wait,
   so every failure here is swallowed on purpose. */
const ENUMISH = /^[a-z0-9_]{1,32}$/;
/* Must agree with app_events.event's check constraint (2 to 40 chars). A name
   the client accepts and Postgres rejects is an event that vanishes silently. */
const EVENT_NAME = /^[a-z0-9_]{2,40}$/;
function safeProps(props){
  const out = {};
  if(!props || typeof props!=='object') return out;
  for(const k of Object.keys(props).slice(0,8)){
    if(!ENUMISH.test(k)) continue;
    const v = props[k];
    if(typeof v==='number' && Number.isFinite(v)) out[k] = v;
    else if(typeof v==='boolean') out[k] = v;
    else if(typeof v==='string' && ENUMISH.test(v)) out[k] = v;
    // anything else - names, emails, URLs, note text, objects - is dropped
  }
  return out;
}
/* App binds these once it has a client and a session. Kept module-level rather
   than threaded through six components as a prop: call sites stay readable, and
   an unbound tracker is a silent no-op rather than a crash. */
let _trkSb = null, _trkUser = null;
function bindTracking(sb, user){ _trkSb = sb; _trkUser = user; }
function track(event, props){
  try{
    if(!_trkSb || !_trkUser || !EVENT_NAME.test(String(event||''))) return;
    _trkSb.from('app_events').insert({user_id:_trkUser.id, event, props:safeProps(props)})
      .then(()=>{}, ()=>{});   // never surface an analytics failure
  }catch(e){}
}

/* ---- Extension bridge -------------------------------------------------------
   The extension can read a search results page that this page cannot: CORS
   blocks the app, but the background worker holds host permission. It parses
   location, education, experience and follower counts out of the same response,
   which the API path does not return at all. Ported from v1, which used it and
   which v2 stopped calling.

   Request/response over postMessage. With no extension installed every call
   times out and resolves {ok:false, error:'no_extension'}, so callers fall back
   rather than hang. Nothing here navigates or opens a tab. */
const extBridge = (()=>{
  let seq=0; const pending=new Map(); let ready=false;
  if(typeof window!=='undefined'){
    window.addEventListener('message', ev=>{
      if(ev.source!==window) return;
      const d=ev.data; if(!d || d.source!=='mighty-ext') return;
      if(d.ready){ ready=true; return; }
      const cb=pending.get(d.id); if(cb){ pending.delete(d.id); cb(d); }
    });
  }
  function call(kind, extra, timeoutMs){
    return new Promise(resolve=>{
      const id='m'+(++seq)+'-'+Date.now();
      const t=setTimeout(()=>{ pending.delete(id); resolve({ok:false,error:'no_extension'}); }, timeoutMs||25000);
      pending.set(id, d=>{ clearTimeout(t); resolve(d); });
      window.postMessage({source:'mighty-app', id, kind, ...extra}, window.location.origin);
    });
  }
  return {
    isReady: ()=>ready,
    search: (query)=>call('search',{query}),
    photo: (profileUrl)=>call('photo',{profileUrl}, 30000),
  };
})();

/* The proxy already tells us the plan and how much of the monthly allowance is
   left; llm() used to return data.text and throw the rest away, so the number the
   whole model is metered on was invisible in the app. It is reported here and the
   App renders it. Reported on refusal too - that is exactly when it matters. */
let _onAiMeta = null;
function onAiMeta(fn){ _onAiMeta = fn; }
function reportMeta(meta){ try{ if(_onAiMeta && meta) _onAiMeta(meta); }catch(e){} }

/* `exchangeKey` is how one assist buys ten takes. It identifies a single
   outbound conversation with one person - 'ex:<log_id>:<n>' - and the gateway
   charges the first call carrying it and nothing after. It contains no name and
   no profile URL, so the ledger stays free of anyone who is not a user. */
async function llm(sb, feature, system, user, maxTokens, exchangeKey){
  let data, error;
  try{
    ({data, error} = await sb.functions.invoke('ai-proxy',
      {body:{feature, system, user, maxTokens:maxTokens||700, exchangeKey:exchangeKey||null}}));
  }catch(e){
    /* A transport-level failure (offline, CORS, the function itself down) is
       not the same as ai-proxy answering with a real error - console.error
       keeps the raw detail for debugging without putting "Failed to fetch"
       or a stack trace in front of the user. */
    console.error('ai-proxy transport error', e);
    throw new Error("Could not reach Mighty's AI right now. Check your connection and try again.");
  }
  if(error){
    console.error('ai-proxy error', error);
    /* supabase-js throws FunctionsHttpError for any non-2xx response, whose
       own .message is a hardcoded "Edge Function returned a non-2xx status
       code" - the real, useful message ai-proxy sent (e.g. an expired
       session, or why the request failed server-side) lives in the actual
       response body on error.context, and was being discarded entirely. */
    let curated = null;
    try{
      if(error.context && typeof error.context.json==='function'){
        const body = await error.context.json();
        if(body && body.message) curated = body.message;
      }
    }catch(e2){ /* body wasn't readable JSON - fall through to the generic message */ }
    throw new Error(curated || "Could not reach Mighty's AI right now. Check your connection and try again.");
  }
  if(data && data.meta) reportMeta(data.meta);
  if(!data || data.ok===false){
    if(data && data.error==='rate_limited') reportMeta({plan:data.plan, assistsLeftMonth:0, exhausted:true});
    throw new Error((data && (data.message||data.error)) || 'AI request failed.');
  }
  return data.text;
}
/* A model reply that is empty, cut off mid-object, or wrapped in prose despite
   instructions is a real, occasional failure mode - not a bug in the caller.
   Surfacing JSON.parse's own error ("Unexpected end of JSON input") to the
   user reads as broken software, so it is retried once - free, since the
   exchange is already paid for by exchangeKey - before giving up with a
   message that says what actually happened. */
function extractJSON(text){
  const s = String(text||'').indexOf('{'), e = String(text||'').lastIndexOf('}');
  if(s===-1 || e===-1 || e<s) throw new Error('Mighty came back without an answer that parsed.');
  return JSON.parse(text.slice(s, e+1));
}
async function llmJSON(sb, feature, system, user, maxTokens, exchangeKey){
  const sys = system+'\n\nRespond with ONLY valid JSON, no prose, no markdown fences.';
  const text = await llm(sb, feature, sys, user, maxTokens||900, exchangeKey);
  try{ return extractJSON(text); }
  catch(e){
    const retryText = await llm(sb, feature,
      sys+' Keep the whole reply under '+(maxTokens||900)+' tokens so it is never cut off mid-object.',
      user, maxTokens||900, exchangeKey);
    try{ return extractJSON(retryText); }
    catch(e2){ throw new Error("Mighty's answer did not come back in the right shape. Try again in a moment."); }
  }
}
function strategyBrief(st){
  return [
    'Goal: ' + (goalTypeList(st).map(t=>GOAL_LABEL[t]).filter(Boolean).join(' and ') || 'building a professional network'),
    st.goal ? 'In their words: ' + st.goal : '',
    (st.targetRoles||[]).length ? 'Wants to meet: ' + st.targetRoles.join(', ') : '',
    (st.targetCompanies||[]).length ? 'Target organizations: ' + st.targetCompanies.join(', ') : '',
    (st.targetLocations||[]).length ? 'Places that matter: ' + st.targetLocations.join(', ') : '',
    (st.currentRole||st.currentCompany) ? 'Currently: ' + [st.currentRole, st.currentCompany].filter(Boolean).join(' at ') : '',
    (st.schools||[]).length ? 'Schools: ' + st.schools.join(', ') : '',
    (st.successMetrics||[]).length ? 'Success looks like: ' + st.successMetrics.join(', ') : '',
    (st.networkingStyle||[]).length ? 'Prefers: ' + st.networkingStyle.join(', ') : '',
  ].filter(Boolean).join('\n');
}
function localKeywords(sentence, st){
  const stop = /\b(find|show|me|people|person|who|that|which|are|is|a|an|the|and|or|of|in|at|to|for|with|from|working|works|based|i|want|meet|looking|like|some)\b/gi;
  let s = clean(sentence).replace(stop,' ').replace(/\s+/g,' ').trim();
  if(!s) s = [(st.targetRoles||[])[0], (st.targetCompanies||[])[0], (st.targetLocations||[])[0]].filter(Boolean).join(' ');
  return s.slice(0,180);
}
async function toKeywords(sb, sentence, st){
  const home = (st.targetLocations||[])[0] || st.homeLocation;
  const near = /\bnear me\b/i.test(sentence) && home ? clean(sentence).replace(/\bnear me\b/i, home) : clean(sentence);
  try{
    const out = await llm(sb, 'tagging',
      'You turn a sentence describing people someone wants to meet into a short keyword query for a LinkedIn profile search. Output ONLY the keywords, space separated, no punctuation, no explanation, no quotes. Keep job titles, companies, schools, industries and places. Drop filler words. Maximum 12 words.',
      near, 60);
    const k = clean(out).replace(/^["']|["']$/g,'').replace(/\s+/g,' ');
    return k || localKeywords(near, st);
  }catch(e){ return localKeywords(near, st); }
}
/* One match ladder across the whole product - app, extension panel and
   marketing all say the same three things. Keep in sync with
   mightyMatchLabel() in extension/scoring.js. */
const VERDICT = {
  excellent:{label:'Strong fit for your goal', dot:'#5B4FE9'},
  strong:   {label:'Good fit',    dot:'#2E8B5F'},
  potential:{label:'Worth a look', dot:'#E3A23C'},
  low:      {label:'Outside your goal',   dot:'#B4B1BC'},
};
const VERDICT_KEYS = ['excellent','strong','potential','low'];
async function evaluate(sb, people, st){
  const list = people.map((p,i)=>`${i+1}. ${p.name} - ${p.title||'(no headline)'}${p.company?' - '+p.company:''}`).join('\n');
  const out = await llmJSON(sb, 'profile_briefing',
    'You help a professional decide who is worth building a relationship with. For each candidate, judge relevance to THEIR stated goal and explain it in plain language. Never output a numeric score. Ground every claim only in the given headline text - if the headline does not support a claim, do not make it. Be honest: never inflate a weak fit, and when nothing about someone matches the goal, say so outright rather than implying promise that is not there. Common ground must be real overlap between the two people; "both in tech" is not common ground. Never use em dashes; write a spaced hyphen instead.',
    `The person doing the networking:\n${strategyBrief(st)}\n\nCandidates:\n${list}\n\nReturn JSON exactly like {"matches":[{"n":1,"verdict":"excellent"|"strong"|"potential"|"low","why":"one or two sentences, starts with the reason, no score","common":["short shared-ground phrase"]}]}. Use "excellent" only when they match the goal squarely, "strong" for a clear fit, "potential" when the connection is real but loose, and "low" when nothing about them lines up with the goal. Include every candidate by its number n. "common" may be empty.`,
    1500);
  const byN = {};
  (out.matches||[]).forEach(m=>{ if(m && m.n) byN[Number(m.n)]=m; });
  return people.map((p,i)=>{
    const m = byN[i+1]||{};
    const raw = String(m.verdict||'').toLowerCase();
    const v = VERDICT_KEYS.indexOf(raw)>=0 ? raw : 'potential';
    return {...p, verdict:v, why:clean(m.why), common:Array.isArray(m.common)?m.common.filter(Boolean).slice(0,4):[]};
  });
}

   Everything Mighty holds about the user, in the place where they can correct
   it. Two things earn their space here.

   First, it is auditable. "Where did Mighty learn that" has an answer, and the
   answer is a row you can look at and change.

   Second, and rarer: it states what it does NOT know. That is close to free to
   build and almost nobody ships it, and it is the difference between a product
   that gets corrected and one that gets quietly distrusted. */
function yearOf(s){
  const m = String(s||'').match(/(\d{4})/);
  return m ? parseInt(m[1],10) : null;
}

/* Every number here traces to a real archive field - connectionCount, or the
   length of a real array. Used to be a bubble chart sized by sqrt(count),
   which sounded right but was not: connections outweighs every other count
   here by two to three orders of magnitude, so sqrt-scaling clamped seven
   of the eight bubbles to the same minimum size and the chart could not
   actually do the one thing a bubble chart is for - comparing sizes. A
   stat grid says the same numbers honestly, in a third of the height, with
   the largest one still visually featured. */
function KbBubbles({counts, capturedAt}){
  if(!counts.length) return null;
  const sorted = [...counts].sort((a,b)=>b[0]-a[0]).slice(0,8);
  return (
    <div>
      <div className="row" style={{gap:10,flexWrap:'wrap',alignItems:'baseline'}}>
        <span className="eyebrow b">What it holds</span>
        <span className="meta">{capturedAt?'read '+ago(capturedAt):''}</span>
      </div>
      <div style={{marginTop:14,display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(112px,1fr))',gap:10}}>
        {sorted.map(([n,label],i)=>{
          const text = Number(n).toLocaleString();
          /* A connection count is easily 5-6 digits where every other count
             here is 1-2 - one fixed size for the lead bubble meant "19,433"
             ran past the box's own edge instead of shrinking to fit it. */
          const big = i===0;
          const size = big ? (text.length>=6?23:text.length>=5?27:30) : (text.length>=4?17:21);
          return (
          <div key={label} style={{padding:'16px 15px',borderRadius:12,minWidth:0,
            background: big ? 'var(--brand)' : '#fff',
            border: big ? 'none' : '1px solid #E4E0F7'}}>
            <div style={{fontSize:size,fontWeight:800,letterSpacing:'-.03em',lineHeight:1,
              fontVariantNumeric:'tabular-nums', color: big ? '#fff' : 'var(--brand-ink)',
              whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
              {text}
            </div>
            <div style={{marginTop:6,fontSize:12.5,fontWeight:600,
              color: big ? 'rgba(255,255,255,.82)' : 'var(--sub)'}}>{label}</div>
          </div>);})}
      </div>
    </div>
  );
}

/* One row per role or degree, on a shared year axis built from real from/to
   dates. No stacked-lane collision handling - real data can overlap in time,
   and giving every item its own row is the simpler, honest way to show that
   rather than guessing which lane it belongs in. */
function KbTimeline({positions, education}){
  const rows = [
    ...(positions||[]).map((p,i)=>({key:'p'+i, kind:'role', title:p.title||p.company||'Role', sub:p.company||'', from:p.from, to:p.to})),
    ...(education||[]).map((e,i)=>({key:'e'+i, kind:'edu', title:e.degree||e.school||'Education', sub:e.degree?e.school:'', from:e.from, to:e.to})),
  ].map(r=>({...r, fy:yearOf(r.from), ty: r.to ? (yearOf(r.to)||new Date().getFullYear()) : new Date().getFullYear()}))
   .filter(r=>r.fy).sort((a,b)=>b.fy-a.fy);
  if(!rows.length) return null;
  const minY = Math.min(...rows.map(r=>r.fy));
  const maxY = Math.max(new Date().getFullYear(), ...rows.map(r=>r.ty));
  const span = Math.max(1, maxY-minY);
  const pct = y => Math.min(100, Math.max(0, ((y-minY)/span)*100));
  const step = Math.max(1, Math.round(span/5));
  const gridYears = []; for(let y=minY; y<maxY; y+=step) gridYears.push(y);
  if(gridYears.length && maxY-gridYears[gridYears.length-1] < step/2) gridYears.pop();
  gridYears.push(maxY);
  return (
    <div>
      <div className="row" style={{gap:10,flexWrap:'wrap',alignItems:'baseline'}}>
        <span className="eyebrow b">The career as read</span>
        <span className="meta">{(positions||[]).length} role{(positions||[]).length===1?'':'s'}, {(education||[]).length} school{(education||[]).length===1?'':'s'}</span>
      </div>
      <div style={{marginTop:14,display:'grid',gridTemplateColumns:'140px 1fr',rowGap:6,columnGap:14}}>
        {rows.map(r=>{
          /* Wide enough to register as a real mark at typical card widths -
             2.5% used to render as a sliver a couple of pixels wide, which
             read as no bar at all rather than a short one. */
          const w = Math.max(4, pct(r.ty)-pct(r.fy));
          /* A short role/degree gets a narrow bar - too narrow to hold its
             own label without clipping into unreadable fragments ("Fou",
             "Ser"). Below this width the label moves outside the bar
             instead of being crammed and cut off inside it. */
          const narrow = w < 14;
          const tip = [r.title,r.sub].filter(Boolean).join(', ')+' · '+(r.from||'?')+' - '+(r.to||'now');
          return (
          <F key={r.key}>
            <div style={{fontSize:12.5,color:'var(--sub)',alignSelf:'center',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}
              title={[r.title,r.sub].filter(Boolean).join(', ')}>{r.sub||r.title}</div>
            <div style={{position:'relative',height:26}}>
              <div title={tip}
                style={{position:'absolute',left:pct(r.fy)+'%',width:w+'%',
                  top:2,height:22,borderRadius:6,boxSizing:'border-box',
                  display: narrow ? 'block' : 'flex',alignItems:'center',padding: narrow?0:'0 8px',
                  fontSize:10.5,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',
                  /* Education used to be a transparent fill behind a pale
                     dashed border - on this card's own lavender-tinted
                     background that combination was barely visible at any
                     width. A faint solid tint keeps the dashed border as the
                     work/school signal while giving the bar itself a shape
                     you can actually see. */
                  background: r.kind==='edu' ? 'rgba(91,79,233,.07)' : 'var(--brand-soft2)',
                  border: r.kind==='edu' ? '1.5px dashed #B9AEE8' : '1px solid #E4E0F7',
                  color:'var(--brand-ink)'}}>{narrow?'':r.title}</div>
              {/* An anchor mark at the bar's start, always solid regardless of
                 width or fill - so even the thinnest bar reads as a point on
                 the timeline rather than a gap. */}
              <div style={{position:'absolute',left:pct(r.fy)+'%',top:11,width:4,height:4,borderRadius:999,
                background:'var(--brand)',transform:'translateX(-1px)'}}/>
              {narrow &&
                <div title={tip} style={{position:'absolute',left:'calc('+(pct(r.fy)+w)+'% + 6px)',top:2,
                  height:22,display:'flex',alignItems:'center',fontSize:10.5,fontWeight:600,
                  whiteSpace:'nowrap',overflow:'hidden',maxWidth:'55%',color:'var(--brand-ink)'}}>{r.title}</div>}
            </div>
          </F>);})}
        <div/>
        <div style={{position:'relative',height:16}}>
          {gridYears.map(y=>(
            <span key={y} style={{position:'absolute',left:pct(y)+'%',fontSize:10.5,color:'var(--mute)',
              transform: y===minY?'none':(y===maxY?'translateX(-100%)':'translateX(-50%)')}}>{y}</span>))}
        </div>
      </div>
    </div>
  );
}

function KnowledgeBase({settings, onEdit, go}){
  const kb = settings.knowledge || {};
  const has = !!(kb.positions||[]).length || !!(kb.education||[]).length || !!kb.resumeText;
  const msg = kb.messages || null;
  const hasArchive = !!(kb.positions||[]).length || !!(kb.education||[]).length;
  const hasResume  = !!clean(kb.resumeText||'');
  /* settings.goal is the free-text elaboration, not the goal itself - picking
     a goal type (what onboarding's Goal step actually requires) can leave
     that sentence blank, which read as "Goal: Not set yet" here even while
     Today and every other surface showed "RAISE INVESTMENT" front and
     center. hasIntent below is the same check the app already uses to decide
     whether onboarding has ever been completed at all. */
  const hasIntent = !!settings.goalType || !!(settings.goalTypes||[]).length;
  const hasGoal    = hasIntent || !!clean(settings.goal||'');
  const completion = Math.round(([hasArchive,hasResume,hasGoal].filter(Boolean).length/3)*100);
  /* The three real inputs, each on its own schedule - a LinkedIn export from
     a week ago and a resume from six months ago are not equally fresh, so
     they get their own dates instead of one "read 4 days ago" covering
     both. "Correct this" used to be the only door back in, and it opened
     onto the whole five-step wizard even to fix one thing; each source now
     jumps straight to its own step (OB_STEPS: History=1, Resume=2). */
  const sources = [
    {label:'LinkedIn export', done:hasArchive,
      status: hasArchive ? 'Read '+ago(kb.capturedAt) : 'Not added yet',
      cta: hasArchive?'Update':'Add', onClick:()=>onEdit(1)},
    {label:'Resume', done:hasResume,
      status: hasResume ? 'Read '+ago(kb.resumeUpdatedAt||kb.capturedAt) : 'Not added yet',
      cta: hasResume?'Update':'Add', onClick:()=>onEdit(2)},
    {label:'Goal', done:hasGoal,
      status: hasGoal ? goalLine(settings).slice(0,64) : 'Not set yet',
      cta: hasGoal?'Update':'Set', onClick:()=>go && go({screen:'you', tab:'goal'})},
  ];

  /* Gaps, in the order they actually cost the user something. Archive and
     resume already have their own status above, so listing them again here
     would say the same thing twice. */
  const gaps = [
    has && !(msg && msg.styleSamples && msg.styleSamples.length) &&
      'a sample of how you write, so drafts sound like you rather than like a product',
    !(kb.answers||[]).length && 'anything you have told it in your own words',
    !(settings.targetRoles||[]).length && !(settings.targetCompanies||[]).length &&
      'who specifically you are trying to reach, which is why the ranking stays vague',
    'which people have already said no, so it stops suggesting them',
  ].filter(Boolean);

  const counts = [
    (kb.positions||[]).length     && [(kb.positions||[]).length, 'roles'],
    (kb.education||[]).length     && [(kb.education||[]).length, 'schools'],
    (kb.skills||[]).length        && [(kb.skills||[]).length, 'skills'],
    (kb.honors||[]).length        && [(kb.honors||[]).length, 'honours'],
    (kb.publications||[]).length  && [(kb.publications||[]).length, 'publications'],
    kb.connectionCount            && [kb.connectionCount, 'connections'],
    (msg && msg.styleSamples||[]).length && [(msg.styleSamples||[]).length, 'writing samples'],
    (kb.answers||[]).length       && [(kb.answers||[]).length, 'answers you gave'],
  ].filter(Boolean);

  return (
    <div className="fade">
      <div className="card" style={{marginTop:26,padding:'22px 26px'}}>
        <div className="row" style={{justifyContent:'space-between',alignItems:'baseline',gap:14,flexWrap:'wrap'}}>
          <div className="h4">Profile {completion}% complete</div>
        </div>
        <div style={{height:8,borderRadius:999,background:'var(--line2)',marginTop:12,overflow:'hidden'}}>
          <div style={{height:'100%',width:completion+'%',background:'var(--brand)',borderRadius:999}}/>
        </div>
        <div className="stack" style={{gap:0,marginTop:16}}>
          {sources.map((s,i)=>(
            <div key={s.label} className="row" style={{justifyContent:'space-between',alignItems:'center',gap:14,
              padding:'14px 0',borderTop: i>0 ? '1px solid var(--line2)' : 'none'}}>
              <div className="row" style={{gap:11,alignItems:'center',minWidth:0}}>
                <span className="dot" style={{background:s.done?'var(--green)':'var(--line)',flex:'none'}}/>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:14.5,fontWeight:700}}>{s.label}</div>
                  <div className="sub" style={{fontSize:13,marginTop:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.status}</div>
                </div>
              </div>
              <button className="btn g sm" style={{flex:'none'}} onClick={s.onClick}>{s.cta}</button>
            </div>))}
        </div>
      </div>

      {has && <F>
        {counts.length>0 &&
          <div className="card" style={{marginTop:16,padding:'20px 24px 8px',
            background:'linear-gradient(135deg,var(--brand-soft2) 0%,#F7F1F4 55%,#FBEFE9 100%)',border:'1px solid #E4E0F7'}}>
            <KbBubbles counts={counts} capturedAt={kb.capturedAt}/>
          </div>}

        {((kb.positions||[]).length>0 || (kb.education||[]).length>0) &&
          <div className="card" style={{marginTop:16,padding:'20px 24px 18px',
            background:'linear-gradient(135deg,var(--brand-soft2) 0%,#F7F1F4 55%,#FBEFE9 100%)',border:'1px solid #E4E0F7'}}>
            <KbTimeline positions={kb.positions} education={kb.education}/>
          </div>}

        {msg && msg.identified===false && msg.received>0 &&
          <div className="hint" style={{marginTop:14}}>
            Your messages were read, but your name could not be matched to the sender, so no writing samples
            were kept. Better than storing someone else's words as yours.
          </div>}
      </F>}

      <div className="eyebrow b" style={{margin:'30px 0 12px'}}>What it still does not know</div>
      <div className="card" style={{padding:'20px 26px'}}>
        <div className="stack" style={{gap:10}}>
          {gaps.map((g,i)=>(
            <div key={i} className="row" style={{gap:10,alignItems:'flex-start'}}>
              <span className="dot" style={{background:'var(--amber)',marginTop:7}}/>
              <span style={{fontSize:14.5,color:'var(--body)',lineHeight:1.5}}>{g}</span>
            </div>))}
        </div>
        <div className="hint" style={{marginTop:14,maxWidth:'58ch'}}>
          Mighty would rather tell you what it is missing than guess.
        </div>
      </div>
    </div>
  );
}

/* ===================== Today ===================== */
/* Actions are derived from real relationship data. Nothing is invented - if
   there is nothing real to do, Today says so and points at Discover. */
function buildPlan(people, events, tasks){
  const byLog = {};
  events.forEach(e=>{ (byLog[e.log_id] = byLog[e.log_id]||[]).push(e); });
  const lastOf = (r, types)=>{
    const list = (byLog[r.id]||[]).filter(e=>!types || types.indexOf(e.event_type)>=0);
    return list.length ? list[list.length-1] : null;
  };
  const out = [];

  people.filter(r=>r.status==='replied').forEach(r=>{
    const reply = lastOf(r,['reply']);
    const mine  = lastOf(r,['first_message','note']);
    const stale = !mine || !reply || new Date(reply.occurred_at) > new Date(mine.occurred_at);
    if(stale) out.push({id:'reply-'+r.id, tone:'red', title:'Reply to '+(r.name||'them'),
      sub: reply ? 'They replied '+ago(reply.occurred_at)+'.' : 'They are waiting on you.',
      min:5, cta:'Reply', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  /* Capped like the brief- block below, so a long backlog in any one
     category cannot fill all 5 slots and crowd out the others - Today is
     meant to show a few things of different kinds, not the most numerous
     kind. */
  people.filter(r=>r.status==='ready_to_contact').slice(0,2).forEach(r=>{
    out.push({id:'send-'+r.id, tone:'amber',
      title:(r.ai_draft?'Send your first message to ':'Write to ')+(r.name||'them'),
      sub: r.ai_draft ? 'Draft is written and waiting for your review.' : 'You marked them ready. Mighty can draft it.',
      min: r.ai_draft?4:8, cta: r.ai_draft?'Review & send':'Draft it', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  /* Matches the "gone quiet" count buildSnapshot shows in Today's summary
     sentence and the "Follow up" cta nextAction() already uses elsewhere -
     without this, the summary could say "3 gone quiet" with zero matching
     cards below it. */
  people.filter(r=>r.status==='contacted' && days(r.contacted_at)>=10).slice(0,2).forEach(r=>{
    out.push({id:'quiet-'+r.id, tone:'amber', title:'Follow up with '+(r.name||'them'),
      sub:'You reached out '+(ago(r.contacted_at)||'a while ago')+' with nothing back yet.',
      min:5, cta:'Follow up', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  tasks.filter(t=>!t.done).forEach(t=>{
    const overdue = t.due_date && new Date(t.due_date).getTime() < Date.now()-DAY;
    const person = people.find(p=>p.id===t.log_id);
    out.push({id:'task-'+t.id, tone:overdue?'red':'amber', title:t.label,
      sub:(t.sub || (person? person.name : '')) + (t.due_date? (overdue?' · overdue':' · due '+dateShort(t.due_date)) : ''),
      min:5, cta:'Open', taskId:t.id,
      go: person ? {screen:'profile', id:person.id, tab:'notes'} : {screen:'relationships'}});
  });

  people.filter(r=>['coffee_chat','replied'].indexOf(r.status)>=0).forEach(r=>{
    const met = lastOf(r,['coffee_chat']);
    const note = lastOf(r,['note']);
    if(met && (!note || new Date(note.occurred_at) < new Date(met.occurred_at)) && days(met.occurred_at)<=5)
      out.push({id:'cap-'+r.id, tone:'green', title:'Capture your conversation with '+(r.name||'them'),
        sub:'You met '+ago(met.occurred_at)+' and nothing is written down yet.', min:5, cta:'Add notes',
        go:{screen:'profile', id:r.id, tab:'notes'}});
  });

  people.filter(r=>r.status==='prospect' && !(r.briefing&&r.briefing.careerSummary)).slice(0,2).forEach(r=>{
    out.push({id:'brief-'+r.id, tone:'purple', title:'Understand '+(r.name||'them')+' before you reach out',
      sub:(r.context&&r.context.whySaved) ? r.context.whySaved.slice(0,90) : 'Saved '+(ago(r.shortlisted_at)||'recently')+'. No brief yet.',
      min:6, cta:'Prepare me', go:{screen:'profile', id:r.id, tab:'brief'}});
  });

  const rank = {red:0, amber:1, green:2, purple:3, grey:4};
  out.sort((a,b)=>(rank[a.tone]-rank[b.tone]));
  const plan = out.slice(0,5);
  if(plan.length<5) plan.push({id:'discover', tone:'grey', title:'Find one person worth knowing',
    sub:'Five good people beat fifty saved profiles.', min:3, cta:'Find someone', go:{screen:'relationships'}});
  return plan;
}
const TONE = {red:'#C75B33', amber:'#E3A23C', green:'#2E8B5F', purple:'#5B4FE9', grey:'#C9C6BF'};
/* A flat white card with only a small colored dot reads as one undifferentiated
   list - the dot is easy to miss entirely at a glance. A soft wash of the same
   tone across the whole card makes urgency visible before you've read a word. */
const TONE_BG = {red:'#FBEFE9', amber:'#FDF3E4', green:'#EDF6EF', purple:'var(--brand-soft)', grey:'var(--card2)'};

/* Does r need a reply from the user right now? Same test buildPlan uses for
   its 'reply-' item: the last thing that happened was them, not us. */
function needsReply(r, byLog){
  if(r.status!=='replied') return false;
  const list = byLog[r.id]||[];
  const reply = list.filter(e=>e.event_type==='reply').slice(-1)[0];
  const mine  = list.filter(e=>e.event_type==='first_message'||e.event_type==='note').slice(-1)[0];
  return !mine || !reply || new Date(reply.occurred_at) > new Date(mine.occurred_at);
}

/* What an executive gets in the morning: a few sentences that vary with what
   is actually true today, not a fixed panel of numbers repeated forever.
   Every clause here is a real count, and a clause is dropped entirely rather
   than shown at zero - that is the whole difference between this and a
   dashboard. No bar, no percentage, no score: see docs on the product's one
   hard rule. */
function buildSnapshot(people, events, tasks, settings, plan){
  const byLog = {};
  events.forEach(e=>{ (byLog[e.log_id] = byLog[e.log_id]||[]).push(e); });
  const added = people.length;
  const contactedOrBeyond = people.filter(r=>REACHED.includes(r.status)).length;
  const talking = people.filter(r=>['replied','coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length;
  const met = people.filter(r=>['coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length;
  const waiting = people.filter(r=>needsReply(r, byLog)).length;
  const quiet = people.filter(r=>r.status==='contacted' && days(r.contacted_at)>=10).length;

  const cap = PLAN_CAPS[(plan)||'trial'] || 50;
  const nearCap = added >= cap*0.8;

  const prev = settings.todaySnapshot;
  const prevAgeDays = prev && prev.at ? Math.floor((Date.now()-new Date(prev.at).getTime())/DAY) : null;
  let delta = null;
  if(prev && prevAgeDays!=null && prevAgeDays>=6){
    const addedSince = added - (prev.added||0);
    const metSince = met - (prev.met||0);
    const bits = [];
    if(addedSince>0) bits.push(addedSince+' new since last week');
    if(metSince>0) bits.push(metSince+' met since then');
    if(bits.length) delta = bits.join(', ');
  }
  const shouldResnapshot = !prev || prevAgeDays==null || prevAgeDays>=6;

  return {added, contactedOrBeyond, talking, met, waiting, quiet, nearCap, cap, delta, shouldResnapshot};
}

function Today({people, events, tasks, settings, email, go, onToggleTask, doneToday, onSaveSettings, plan:aiPlan,
  pendingActivity, onResolveActivity}){
  const plan = useMemo(()=>buildPlan(people, events, tasks), [people, events, tasks]);
  const mins = plan.reduce((a,t)=>a+(t.min||0),0);
  /* preferredName is read here but nothing anywhere ever sets it - this
     always fell through to guessing a name from the email's local part,
     which reads fine for "jane.smith@..." but produces exactly the kind of
     nonsense "Rmohans" turned into for an initial-plus-surname handle.
     The LinkedIn archive's real first name is honest, captured data and
     should be tried before guessing from an email address at all. */
  const name = firstName((settings.knowledge||{}).identity?.firstName || settings.preferredName || '')
    || firstName((email||'').split('@')[0].replace(/[._]/g,' '));
  const nextMeeting = useMemo(()=>{
    const t = tasks.filter(x=>!x.done && x.due_date && new Date(x.due_date).getTime()>=Date.now()-DAY)
      .sort((a,b)=>new Date(a.due_date)-new Date(b.due_date));
    return t[0]||null;
  },[tasks]);
  const allDone = plan.length===1 && plan[0].id==='discover' && people.length>0;

  const snap = useMemo(()=>buildSnapshot(people, events, tasks, settings, aiPlan), [people, events, tasks, settings, aiPlan]);
  useEffect(()=>{
    if(!snap.shouldResnapshot || !onSaveSettings) return;
    onSaveSettings({todaySnapshot:{at:new Date().toISOString(), added:snap.added, met:snap.met}});
    // eslint-disable-next-line
  },[snap.shouldResnapshot, snap.added, snap.met]);

  const [ask,setAsk] = useState('');
  /* These used to just be the plan's own task titles restated - "Reply to
     Mridul Arora" appearing as both a chip above and a card below said
     nothing twice. A chip should suggest something to ask that the cards
     don't already say, so these are phrased as real questions, grounded in
     the same plan data (never generic/canned), leading with one
     goal-oriented prompt and following with per-person ones drawn from
     today's actual names. */
  const askPrompts = useMemo(()=>{
    const named = plan.filter(t=>t.go && t.go.screen==='profile' && t.go.id).map(t=>{
      const person = people.find(p=>p.id===t.go.id);
      const first = person ? firstName(person.name||'') : '';
      if(!first) return null;
      if(t.cta==='Reply') return 'Draft my reply to '+first;
      if(t.cta==='Prepare me') return 'Prep me for '+first;
      if(t.cta==='Draft it' || t.cta==='Review & send') return 'Draft my note to '+first;
      if(t.cta==='Follow up') return 'Draft a follow-up to '+first;
      return 'Tell me about '+first;
    }).filter(Boolean);
    const seen = new Set();
    const uniq = named.filter(p=>{ const k=p.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
    return ['Who should I talk to first?', ...uniq].slice(0,3);
  },[plan, people]);

  return (

      <div className="pad" style={{maxWidth:860,paddingTop:30}}>
        {people.length>0 &&
          <div className="sub" style={{fontSize:15,lineHeight:1.65,maxWidth:'62ch'}}>

        {pendingActivity && pendingActivity.length>0 &&

              return (

        {nextMeeting &&

                <div className="h4">{nextMeeting.label}</div>
                <div className="sub" style={{fontSize:14,marginTop:3}}>{dateShort(nextMeeting.due_date)}</div>
              </div>
              <button className="btn g sm" onClick={()=>{
                const p = people.find(x=>x.id===nextMeeting.log_id);
                go(p ? {screen:'profile', id:p.id, tab:'brief'} : {screen:'relationships'});
