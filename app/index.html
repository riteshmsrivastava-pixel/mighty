                                style={{fontSize:13,fontWeight:600,marginTop:4,display:'inline-block'}}>View on LinkedIn</a>
                            </div>
                            <div style={{display:'flex',gap:8,flex:'none'}}>
                              {savedRow && reasonPrompt && reasonPrompt.kind==='save' && reasonPrompt.rowId===savedRow.id
                                ? null
                                : savedRow
                                ? <button className="btn g sm" onClick={()=>onOpen(savedRow.id)}>Open</button>
                                : reasonPrompt && reasonPrompt.kind==='skip' && reasonPrompt.profileUrl===r.profileUrl
                                ? null
                                : <F>
                                    <button className="btn q" style={{fontSize:13}}
                                      onClick={()=>setReasonPrompt({kind:'skip', profileUrl:r.profileUrl})}>Ignore</button>
                                    <button className="btn g sm" disabled={atCap || savingUrls.has(r.profileUrl)}
                                      onClick={async()=>{ startSaving(r.profileUrl); try{ const row=await onSave(r, lastQuery); if(row) onOpen(row.id); }finally{ stopSaving(r.profileUrl); } }}>
                                      Prepare</button>
                                    <button className="btn sm" disabled={atCap || savingUrls.has(r.profileUrl)}
                                      onClick={async()=>{ startSaving(r.profileUrl); try{ const row=await onSave(r, lastQuery); if(row) setReasonPrompt({kind:'save', profileUrl:r.profileUrl, rowId:row.id}); }finally{ stopSaving(r.profileUrl); } }}>
                                      {savingUrls.has(r.profileUrl) ? <span><span className="spin"/> Saving</span> : 'Save'}
                                    </button>
                                  </F>}
                            </div>
                          </div>
                          {reasonPrompt && reasonPrompt.kind==='save' && savedRow && reasonPrompt.rowId===savedRow.id &&
                            <div style={{marginTop:10}}>
                              <ReasonChips prompt="Why did you save them?" options={SAVE_REASONS}
                                onPick={(id)=>finishSaveReason(savedRow, id)} onDismiss={()=>setReasonPrompt(null)}/>
                            </div>}
                          {reasonPrompt && reasonPrompt.kind==='skip' && reasonPrompt.profileUrl===r.profileUrl &&
                            <div style={{marginTop:10}}>
                              <ReasonChips prompt="Why pass?" options={SKIP_REASONS}
                                onPick={(id)=>finishSkip(r.profileUrl, id)} onDismiss={()=>finishSkip(r.profileUrl, null)}/>
                            </div>}
                          {r.why &&
                            <div className="why" style={{marginTop:12,padding:'14px 16px'}}>
                              <div className="eyebrow b">Why Mighty picked them</div>
                              <div style={{fontSize:14.5,lineHeight:1.55,color:'var(--body)',marginTop:6,textWrap:'pretty'}}>{r.why}</div>
                            </div>}
                        </div>);
                    })}
                  </div>
                </div>}
            </div>
          ) : (
            <F>
              {worthAdding}
              {webSearchPanel}
            </F>
          )}
        </div>
      ) : people.length===0 ? (
        <div className="fade" style={{marginTop:22}}>
          <Empty title="No one here yet."
            body="Everyone you add lands here, however you found them. Switch to Discover to search who you know, or see who Mighty thinks is worth adding."
            cta="Go to Discover" onCta={()=>setView('explore')}/>
        </div>
      ) : view==='board' ? (
        <div className="fade" style={{marginTop:20}}>
          {!boardOK && <F>
            <div className="hint">{UNLOCKS.board.hint}</div>
            {pipelineList}
          </F>}
          {boardOK &&
            /* Six columns, only 3-4 fit before scrolling on a laptop-width
               screen. An opaque overlay used to hint at the rest, but it drew
               a hard rectangle over whatever card sat at the edge, so a
               rounded card looked sliced in half instead of hinted-at. A mask
               on the scroll container itself fades the card's actual pixels
               - corners, shadow and all - so a partial card tapers away
               instead of getting cut off. */
            <div style={{display:'flex',gap:14,overflowX:'auto',paddingBottom:12,paddingRight:28,
              WebkitMaskImage:'linear-gradient(90deg,#000 calc(100% - 28px),transparent 100%)',
              maskImage:'linear-gradient(90deg,#000 calc(100% - 28px),transparent 100%)'}}>
                {COLUMNS.map(col=>{
                const items = people.filter(r=>col.statuses.indexOf(r.status)>=0);
                const meta = STAGE[col.statuses[0]];
                return (
                  <div key={col.key} style={{width:250,flex:'none'}}
                    onDragOver={e=>{ e.preventDefault(); setOver(col.key); }}
                    onDragLeave={()=>setOver(o=>o===col.key?null:o)}
                    onDrop={e=>{ e.preventDefault(); setOver(null);
                      const person = dragId!=null ? people.find(r=>r.id===dragId) : null;
                      /* Active merges replied/coffee_chat/referral/interview/offer into one
                         column. Dropping a card that already belongs there must not force
                         it back to statuses[0] - that silently downgraded a later stage
                         like offer back to replied on any imprecise click the browser
                         read as a drag. */
                      if(person && col.statuses.indexOf(person.status)<0) onStage(person, col.statuses[0]);
                      setDrag(null); }}>
                    <div className="row" style={{gap:8,padding:'0 4px 10px'}}>
                      <span className="dot" style={{background:meta.dot}}/>
                      <span style={{fontSize:13,fontWeight:700}}>{col.label||meta.label}</span>
                      <span className="meta">{items.length}</span>
                    </div>
                    <div className={'stack'+(overCol===col.key?' drop':'')} style={{gap:10,minHeight:60}}>
                      {items.length===0 &&
                        <div className="meta" style={{padding:'14px 10px',textAlign:'center',border:'1px dashed var(--line)',borderRadius:'var(--rsm)'}}>Nobody here yet.</div>}
                      {items.map(r=>(
                        <div key={r.id} className="colcard" draggable
                          onDragStart={()=>setDrag(r.id)} onDragEnd={()=>setDrag(null)}
                          onClick={()=>onOpen(r.id)}>
                          <div className="row" style={{gap:10}}>
                            <Avatar name={r.name} size={28} src={r.avatar_url} hover={r}/>
                            <div style={{minWidth:0}}>
                              <div className="row" style={{gap:6}}>
                                <div style={{fontSize:14.5,fontWeight:700,letterSpacing:'-.01em',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.name||'Unnamed'}</div>
                                <ConnectedBadge r={r} size="sm"/>
                              </div>
                              <div style={{fontSize:12.5,color:'var(--mute)',marginTop:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.title||''}</div>
                            </div>
                          </div>
                          <div style={{fontSize:13,fontWeight:700,color:'var(--brand-ink)',marginTop:11}}>{nextAction(r)}</div>
                        </div>))}
                    </div>
                  </div>);
                })}
              </div>}
        </div>
      ) : view==='timeline' ? (
        <div className="fade" style={{marginTop:20}}>
          {!timeOK && <F>
            <div className="hint">{UNLOCKS.timeline.hint}</div>
            {pipelineList}
          </F>}
          {timeOK && <F>
            <div className="seg" style={{width:'fit-content'}}>
              {TIME_CATS.map(c=>(
                <button key={c.key} className={feedCat===c.key?'on':''} onClick={()=>setFeedCat(c.key)}>
                  {c.label} · {rawFeed.filter(c.test).length}
                </button>))}
            </div>

            {feedGroups.length===0 &&
              <div className="meta" style={{marginTop:20}}>Nothing in this filter yet.</div>}

            <div style={{marginTop:24,maxWidth:760}}>
              {feedGroups.map((g,gi)=>(
                <div key={g.label} style={{marginBottom:28}}>
                  <div className="eyebrow" style={{marginBottom:12}}>{g.label}</div>
                  <div>
                    {g.items.map((item,i)=>{
                      const entry = feedEntry(item);
                      const dot = ({reply:'var(--green)', stage_change:'var(--brand)', note:'var(--amber)',
                        saved:'var(--mute)', first_message:'var(--brand)'})[item.kind] || 'var(--mute)';
                      /* Rows used to sit inside one bordered, shadowed card per day -
                         tidy, but it boxed in what is meant to read as a single
                         continuous line of things happening, not a table. Open rows
                         on the page background, with the connector line and dots
                         doing the organizing, reads more like an actual timeline. */
                      const person = item.kind==='saved'
                        ? (item.people.length===1 ? item.people[0] : null)
                        : personOf(item.personId);
                      const avatarName = person ? person.name : nameOf(item.personId);
                      const multiSaved = item.kind==='saved' && item.people.length>1;
                      return (
                        <div key={item.id} className="row" style={{gap:14,padding:'14px 4px',alignItems:'stretch',
                          borderBottom:i===g.items.length-1?'none':'1px solid var(--line3)'}}>
                          <div style={{fontSize:12.5,color:'var(--mute)',flex:'none',width:56,paddingTop:22}}>
                            {timeOfDay(item.occurred_at)}
                          </div>
                          <div style={{flex:'none',width:16,position:'relative',display:'flex',justifyContent:'center'}}>
                            {i>0 &&
                              <span style={{position:'absolute',top:0,height:'calc(50% + 4px)',width:2,background:'var(--line2)'}}/>}
                            {i<g.items.length-1 &&
                              <span style={{position:'absolute',bottom:0,height:'calc(50% + 4px)',width:2,background:'var(--line2)'}}/>}
                            <span style={{position:'relative',zIndex:1,width:9,height:9,marginTop:26,flex:'none',
                              borderRadius:'50%',background:dot,boxShadow:'0 0 0 3px var(--paper)'}}/>
                          </div>
                          <div style={{flex:'none',paddingTop:16}}>
                            {multiSaved
                              ? <div className="av" style={{width:30,height:30,fontSize:11}}>{'+'+item.people.length}</div>
                              : <Avatar name={avatarName} size={30} src={person&&person.avatar_url} hover={person}/>}
                          </div>
                          <div style={{flex:1,minWidth:0,paddingTop:16}}>
                            <div style={{fontSize:15,fontWeight:700,letterSpacing:'-.01em'}}>{entry.title}</div>
                            {entry.sub && <div className="sub" style={{fontSize:13.5,marginTop:2,textWrap:'pretty'}}>{entry.sub}</div>}
                          </div>
                          {entry.cta &&
                            <button className="btn g sm" style={{flex:'none',alignSelf:'center'}} onClick={entry.onCta}>{entry.cta}</button>}
                        </div>);
                    })}
                  </div>
                </div>))}
            </div>
          </F>}
        </div>
      ) : pipelineList}
    </div>
  );
}

/* ===================== Profile ===================== */
/* 'warm' used to promise a shared connection in its own label ("Warm
   introduction") even when draftContext has no real one to write about -
   the model then had to write an honest "no mutual connection here" opening
   under a label that said the opposite. This is always a direct message to
   the person, never an actual ask routed through a known intermediary, so
   the label now says what it is instead of a warmth it cannot guarantee. */
const APPROACHES = [
  {id:'warm',      label:'Introduce yourself', brief:'a direct, personal opening - mention real shared ground only if it actually appears in the context above'},
  {id:'curiosity', label:'Curiosity',         brief:'asks about something specific in their work'},
  {id:'shared',    label:'Shared experience', brief:'built on common background'},
  {id:'value',     label:'Value first',       brief:'offers something useful before asking'},
  {id:'coffee',    label:'Coffee chat',       brief:'a short, concrete request to talk'},
];
function Profile({sb, row, events, tasks, settings, people, onBack, onUpdate, onStage, onEvent, onTask, tab, setTab, go}){
  const ctx = row.context||{};
  /* Do I already know someone at their company? A real, specific opening -
     "ask Jane for an intro" beats any AI-inferred "shared interest in tech" -
     computed once at archive import (decodedCompanyIndex) and just looked up
     here, never re-derived from anything the model says. */
  const companyIndex = settings.knowledge && settings.knowledge.decoded
    && settings.knowledge.decoded.chapters && settings.knowledge.decoded.chapters.companyIndex;
  const warmIntro = row.company ? companyOverlap(companyIndex, row.company) : null;
  /* Bridge re-ranks the same overlap by real tie strength - see
     bridgeIntroducers() for why this stops at one hop rather than drawing
     the multi-hop path graph the Prism concept shows. */
  const bridge = row.company ? bridgeIntroducers(companyIndex, row.company, settings.knowledge||{}) : {overlap:null, candidates:[]};
  const CONNECTORS = [
    {key:'linkedin', label:'LinkedIn archive', on: !!(settings.knowledge && settings.knowledge.connectionCount),
      detail: (settings.knowledge && settings.knowledge.connectionCount)
        ? settings.knowledge.connectionCount.toLocaleString()+' connections, career history'
        : 'Not imported yet'},
    {key:'mail', label:'Email', on: !!(settings.knowledge && settings.knowledge.mail && settings.knowledge.mail.messagesRead),
      detail: (settings.knowledge && settings.knowledge.mail && settings.knowledge.mail.messagesRead)
        ? (settings.knowledge.mail.twoWayCount||0).toLocaleString()+' real contacts, who you actually talk to'
        : 'Not imported yet'},
    /* Written this session, not yet deployed - see the tech plan tab. Shown
       here rather than hidden so "what Bridge could see" stays honest about
       what is coming, not just what is live. available:false means there is
       no setup to offer yet - do not present a Connect action for this row. */
    {key:'google', label:'Google contacts and calendar', on:false, available:false, detail:''},
  ];
  /* An exchange is one outbound conversation: the brief, the draft, and every
     take of that draft. It costs one assist. When they reply, answering them is
     a new exchange and a new assist, because it is new work. The counter lives
     in context so it survives a reload and needs no schema change. */
  const exchangeNo = Math.max(1, Number(ctx.exchange || 1));
  const exchangeKey = 'ex:' + row.id + ':' + exchangeNo;
  const takes = Math.max(0, Number(ctx.takes || 0));
  const TAKE_LIMIT = 10;
  const takesLeft = Math.max(0, TAKE_LIMIT - takes);

  /* Has anyone actually read this person's profile?
     A search result is a name and a headline. A connection row out of the
     archive is a name, an employer and a date. Neither is enough to brief on,
     and briefing anyway produces the confident-sounding paragraph that makes
     people stop trusting a product. The extension fills these fields in the
     first time the profile is opened, so their presence is the evidence. */
  const profileRead = !!(clean(ctx.aboutText) || clean(ctx.education) || clean(ctx.location)
    || clean(ctx.skillsText) || (Array.isArray(ctx.timingSignals) && ctx.timingSignals.length));
  /* Older briefs (built before profile_briefing's prompt told the model to
     return an empty array instead, and before careerSummary/whyMatters were
     replaced by the insights bullet list) can still carry a "no headline or
     background information is provided, so there is nothing to assess"
     sentence - a failed assessment, not real content. Strip it on read so a
     stale one never renders as if it were a brief, whichever old or new
     field it landed in. A brief saved in the old shape (real content, but no
     insights array) just falls back to the empty state - regenerating is one
     free click, not worth carrying the old fields forward for. */
  const isMissingDataExcuse = (s)=> /\b(no|not|nothing)\b[\s\S]{0,40}\b(headline|background information|profile (text|information)|to assess)\b/i.test(s||'');
  const rawBr = row.briefing||{};
  const rawInsightText = (rawBr.insights||[]).join(' ') || rawBr.careerSummary || rawBr.whyMatters || '';
  const br = isMissingDataExcuse(rawInsightText) ? {...rawBr, insights:[], careerSummary:'', whyMatters:''} : rawBr;
  const st  = stageOf(row);
  const [busy,setBusy]   = useState(null);
  const [toast,setToast] = useState(null);
  const [err,setErr]     = useState(null);
  /* One angle used to mean one API call, so seeing a different approach cost a
     full Claude round-trip and only ever showed one message at a time. All
     five now come back in a single call - one assist, same as before - and
     switching chips is a local state change, free and instant. lastApproach
     on ctx remembers which one was actually sent, so a later reply can be
     attributed back to it (see markReplied). */
  /* Always Warm introduction - the first chip in APPROACHES, and the safer
     opener for a first message to a stranger.

     This deliberately does NOT restore ctx.lastApproach. That field is written
     in two places: when a draft is copied to send (a real choice) and when
     drafts are generated (just whichever chip happened to be selected at the
     time). Because of the second one it is polluted - every person drafted
     before today carries 'curiosity' purely because that used to be the
     default, not because anyone picked it. Reopening on a stored value that
     may mean nothing is worse than opening somewhere predictable, so the
     landing chip is fixed and lastApproach stays what it is actually good
     for: attributing a reply to what was sent (see markReplied). */
  const initialApproach = 'warm';
  const [approach,setApproach] = useState(initialApproach);
  const [drafts,setDrafts] = useState(()=> row.ai_draft
    ? {[initialApproach]: {message:row.ai_draft, original:row.ai_draft, subject:''}} : {});
  const [noteS,setNoteS] = useState(''); const [noteC,setNoteC] = useState(''); const [noteP,setNoteP] = useState('');
  const [justReplied,setJustReplied] = useState(false);
  /* A reply's own event and the stage_change it automatically triggers land
     within seconds of each other and describe one thing, not two - showing
     both is the duplicate history entry the copy review flagged. Drop the
     redundant stage_change and note the merge on the reply event itself. */
  const mineRaw = events.filter(e=>e.log_id===row.id);
  const mergedStage = (e)=> e.event_type==='reply' && mineRaw.find(o=>o.event_type==='stage_change'
    && o.extracted && o.extracted.to==='replied' && Math.abs(new Date(o.occurred_at)-new Date(e.occurred_at))<60000);
  const mine = mineRaw.filter(e=>{
    if(e.event_type!=='stage_change' || !e.extracted || e.extracted.to!=='replied') return true;
    return !mineRaw.some(o=>o.event_type==='reply' && Math.abs(new Date(o.occurred_at)-new Date(e.occurred_at))<60000);
  }).map(e=> mergedStage(e) ? {...e, stageNote:'Stage updated after the recorded reply.'} : e);
  const memories = Array.isArray(ctx.memories)?ctx.memories:[];
  const myTasks = tasks.filter(t=>t.log_id===row.id && !t.done);

  /* Resets when you switch to a different person, because this component is
     reused rather than remounted - without it, person B would inherit person
     A's selected chip and drafts. It must use the SAME default as
     initialApproach above: it runs on mount too, so any disagreement between
     the two silently wins here and makes the useState default dead code. That
     is exactly what happened - useState said 'warm', this said 'curiosity',
     and every profile still opened on Curiosity. */
  useEffect(()=>{
    setApproach(initialApproach);
    setDrafts(row.ai_draft ? {[initialApproach]: {message:row.ai_draft, original:row.ai_draft, subject:''}} : {});
    // eslint-disable-next-line
  }, [row.id]);

  /* A chip click used to just switch which single draft was visible - now it
     is also the first, cheapest signal in the behavioral graph: which angle
     someone actually reaches for, before any edit or send. */
  function selectApproach(id){
    if(id===approach) return;
    setApproach(id);
    track('approach_chosen', {approach:id, has_draft: !!drafts[id]});
    if(drafts[id]) onUpdate(row, {ai_draft: drafts[id].message, context:{...ctx, lastApproach:id}});
  }
  const flash = (m)=>{ setToast(m); setTimeout(()=>setToast(null), 2600); };

  /* Everything the extension read off the rendered profile, in one place so the
     brief and the draft cannot disagree about it. timingSignals matters most:
     "just moved into this role" changes what is worth writing more than any
     other single fact, and it exists nowhere else. */
  const captured = [
    ctx.skillsText && ('Skills listed: '+clean(ctx.skillsText).slice(0,300)),
    ctx.certificationsText && ('Certifications: '+clean(ctx.certificationsText).slice(0,200)),
    ctx.languagesText && ('Languages: '+clean(ctx.languagesText).slice(0,120)),
    (Array.isArray(ctx.timingSignals)&&ctx.timingSignals.length) && ('Timing: '+ctx.timingSignals.join('; ')),
    /* Unverified by construction - a name search can surface someone else
       entirely who shares it - so it is labeled that way both here (in the
       brief prompt) and again wherever it is shown on screen, same
       discipline settings.knowledge.selfResearch already follows. */
    ctx.research && clean(ctx.research.text) &&
      ('Unverified web mentions (color only, may be about someone else with the same name - never state as settled fact): '+clean(ctx.research.text).slice(0,900)),
  ].filter(Boolean).join('\n');

  /* Same idiom as the account-level selfResearch effect at the App level -
     one plain web search through the extension, raw text kept as-is, never
     asserted as fact. That effect already runs this automatically once a
     person's status moves past "prospect" (see its own comment for why);
     this is the same action available on demand - for a saved-but-not-yet-
     contacted person worth researching sooner, or to refresh a stale
     result before writing to someone. */
  const [researching,setResearching] = useState(false);
  async function runResearch(){
    if(researching) return;
    const query = clean([row.name, row.company||row.title||''].filter(Boolean).join(' '));
    if(!query) return;
    setResearching(true);
    try{
      const r = await extBridge.webSearch(query);
      const text = clean(r&&r.text);
      if(r && r.ok && text && !isUnusableResearchText(text)){
        const research = {query, text:text.slice(0,1200), lastRunAt:new Date().toISOString()};
        await onUpdate(row, {context:{...ctx, research}});
        flash('Research updated');
      } else {
        setErr('No usable result. Try again.');
      }
    }catch(e){ setErr(e.message||'Could not research them right now.'); }
    setResearching(false);
  }

  async function makeBrief(){
    if(busy) return;
    if(!profileRead){
      setErr('Mighty has not read this profile yet, so a brief would be guesswork dressed up as research. '
        + 'Open their LinkedIn profile once with the extension running, then come back.');
      return;
    }
    setBusy('brief'); setErr(null);
    try{
      const out = await llmJSON(sb, 'profile_briefing',
        /* Used to ask for careerSummary/whyMatters as prose paragraphs. Real
           feedback: too much text to actually decide anything from - a brief
           should let someone tell in a few seconds whether reaching out is
           worth it, not be read start to finish like a bio. insights
           replaces both fields: short, specific, individually true bullets,
           the single most decision-relevant one first, same discipline as
           shared/starters already had. */
        'You prepare someone for a first conversation, to help them decide quickly whether it is worth reaching out. Use ONLY the facts given - never invent employers, dates, achievements or posts. If you do not know something, leave it out rather than guessing. Write 3 to 4 short, specific, scannable insights, never a paragraph - each one is a single concrete fact or reason on its own, ordered with the single most decision-relevant one first. If the headline, company and captured profile text are all unknown, return an empty insights array instead of a sentence explaining there is nothing to assess - an empty field is the honest answer, not a sentence about the absence. Plain language, no scores, no flattery. Address the reader directly as "you" and "your" throughout every field - never write "the user" or "the user\'s goal" in third person. Never use em dashes; write a spaced hyphen instead.',
        `About the person doing the outreach (this is you, the reader):\n${strategyBrief(settings)}\n\nThe person they want to understand:\nName: ${row.name||''}\nHeadline: ${row.title||''}\nCompany: ${row.company||''}\nLocation: ${ctx.location||'unknown'}\nEducation: ${ctx.education||'unknown'}\nProfile text captured: ${clean(ctx.aboutText||ctx.snippet||'').slice(0,900)}\n${captured||''}\nWhy they were saved: ${ctx.whySaved||'unknown'}\nShared ground noted at save time: ${(ctx.common||[]).join('; ')||'none noted'}\n\nReturn JSON {"insights":["most decision-relevant fact or reason first - short, specific, scannable, why this person matters to your goal or what stands out about them, written directly to you as 'you'"],"shared":["real overlap - literal (same company, school, city) AND domain-level (both have worked in the same or a comparable industry, e.g. fintech, healthcare/pharma, deep tech - reason this out from each person's actual career history above, do not just restate their titles)"],"starters":["specific opening, grounded in the facts above"],"avoid":"one thing not to lead with, or omit"}`,
        /* 1000 was not enough headroom once the sender preamble grew: four
           JSON fields, several of them arrays of full sentences, on a person
           with a rich profile ran past it and came back truncated mid-string,
           which surfaces to the user as "did not come back in the right
           shape". The preamble is capped now too, but the ceiling should not
           be the thing that decides whether a brief parses. */
        1600, exchangeKey);
      const briefing = {...br, insights:Array.isArray(out.insights)?out.insights.map(clean).filter(Boolean):[],
        careerSummary:'', whyMatters:'',
        shared:Array.isArray(out.shared)?out.shared:[], conversationStarters:Array.isArray(out.starters)?out.starters:[],
        avoid:clean(out.avoid), builtAt:new Date().toISOString()};
      await onUpdate(row, {briefing});
      track('brief_built', {insights:(briefing.insights||[]).length, shared:(briefing.shared||[]).length, starters:(briefing.conversationStarters||[]).length});
      flash('Brief ready');
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(null);
  }

  /* Verbatim samples of how this user actually writes, from their own sent
     messages in the archive. Six is enough to establish a voice and few enough
     to keep the prompt honest about length. Without this, reading the message
     archive would be the fourth time in this codebase that data was fetched,
     parsed and then dropped at the last step. */
  /* Email first. A LinkedIn DM is short, transactional and often years old;
     a sent-mail sample is the same person writing at length to someone who
     matters, which is much closer to what a draft has to sound like. Both
     pools feed the fingerprint, but the six verbatim examples handed to the
     model come off the top of the combined list, so mail wins when there is
     mail and nothing changes for an account that only ever imported LinkedIn. */
  const kbVoice = settings.knowledge || {};
  const allSamples = ((kbVoice.mail||{}).styleSamples||[])
    .concat((kbVoice.messages||{}).styleSamples||[]);
  const voice = allSamples.slice(0, 6);
  const fp = styleFingerprint(allSamples);


  const DRAFT_SYSTEM_ONE = "You write a real first outreach message for a professional. Ground it ONLY in the given context - never invent shared history, mutual friends, articles or events. Sound like a person, not a template. No flattery, no buzzwords, no 'I hope this finds you well', no generic greeting line before the real content ('Greeting for the day', 'Hope you're doing well', or similar - go straight from the salutation into the actual reason for writing). Under 110 words. Ask for one specific, easy thing. Never use em dashes; write a spaced hyphen instead.";
  const draftContext = ()=>
    `The sender:\n${strategyBrief(settings)}\n\nThe recipient:\nName: ${row.name||''}\nHeadline: ${row.title||''}\nCompany: ${row.company||''}\nWhy the sender saved them: ${ctx.whySaved||'unknown'}\nShared ground: ${((br.shared&&br.shared.length?br.shared:ctx.common)||[]).join('; ')||'none confirmed'}\nBrief: ${(br.insights&&br.insights.length)?br.insights.join('. '):'none'}\nThings the sender has learned about them: ${memories.map(m=>m.value).join('; ')||'nothing captured yet'}\n${captured||''}${voice.length ? '\n\nHOW THIS SENDER ACTUALLY WRITES.'
      + (fp ? ' Measured across all '+fp.sampleCount+' of their sent messages on file, they '+styleFingerprintLine(fp)+'.' : '')
      + ' Below are verbatim messages they have sent before. Match their rhythm, sentence length, level of formality and habits of greeting and sign-off. Do not copy phrases from them and do not reuse their content:\n' + voice.map((v,i)=>(i+1)+'. '+v).join('\n') : ''}`;

  /* One call, all five angles, so the model sees every approach at once and
     can actually make them distinct from each other - the old one-at-a-time
     flow gave it no reason not to write the same message five different
     times. Counts as a single take, same as the old single-message call. */
  async function makeDrafts(){
    if(busy) return;
    if(takesLeft <= 0){
      setErr('Ten takes is the limit on one Assist. Send one, or edit the last one yourself.');
      return;
    }
    setBusy('draft'); setErr(null);
    try{
      const out = await llmJSON(sb, 'draft_message',
        DRAFT_SYSTEM_ONE + " You are asked for several messages at once, one per approach listed below, each using the exact approach id given. Make the messages genuinely distinct in angle and opening line, not five versions of the same message with different greetings.",
        `${draftContext()}\n\nWrite one message for EACH of these approaches, using its exact id:\n${APPROACHES.map(a=>'- '+a.id+': '+a.label+' - '+a.brief).join('\n')}\n\nReturn JSON {"drafts":[{"approach":"(one of the ids above)","subject":"short subject line for email use","message":"the message body"}, ... one entry per approach listed, same order]}`,
        3000, exchangeKey);
      const next = {};
      (Array.isArray(out.drafts)?out.drafts:[]).forEach(d=>{
        const id = d && APPROACHES.some(a=>a.id===d.approach) ? d.approach : null;
        if(id && clean(d.message)) next[id] = {message:clean(d.message), original:clean(d.message), subject:clean(d.subject||'')};
      });
      if(!Object.keys(next).length) throw new Error('That did not come back in the right shape - try again.');
      setDrafts(next);
      const first = next[approach] ? approach : Object.keys(next)[0];
      if(first!==approach) setApproach(first);
      await onUpdate(row, {ai_draft: next[first].message,
        status: row.status==='prospect'?'ready_to_contact':row.status,
        context: {...ctx, exchange: exchangeNo, takes: takes + 1, lastApproach: first, draftExchange: exchangeNo}});
      track('drafts_generated', {count: Object.keys(next).length, take: takes + 1, exchange: exchangeNo});
      flash(takes === 0 ? 'Five drafts ready. One Assist covers all ten takes.'
                        : 'Take ' + (takes+1) + ' of ' + TAKE_LIMIT + '. Same Assist.');
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(null);
  }

  /* Rewriting one angle after the first five exist is still the same feature
     and the same exchange - just scoped to whichever chip is selected, so
     regenerating Curiosity does not throw away the other four. */
  async function regenerateOne(){
    if(busy) return;
    if(takesLeft <= 0){
      setErr('Ten takes is the limit on one Assist. Send one, or edit the last one yourself.');
      return;
    }
    setBusy('draft'); setErr(null);
    const a = APPROACHES.find(x=>x.id===approach)||APPROACHES[1];
    try{
      const out = await llmJSON(sb, 'draft_message', DRAFT_SYSTEM_ONE,
        `${draftContext()}\n\nApproach: ${a.label} - ${a.brief}.\n\nReturn JSON {"subject":"short subject line for email use","message":"the message body"}`,
        800, exchangeKey);
      setDrafts(d=>({...d, [approach]: {message:clean(out.message), original:clean(out.message), subject:clean(out.subject||'')}}));
      await onUpdate(row, {ai_draft:clean(out.message),
        status: row.status==='prospect'?'ready_to_contact':row.status,
        context: {...ctx, exchange: exchangeNo, takes: takes + 1, lastApproach: approach, draftExchange: exchangeNo}});
      track('draft_rewritten', {approach, take: takes + 1, exchange: exchangeNo});
      flash('Take ' + (takes+1) + ' of ' + TAKE_LIMIT + '. Same Assist.');
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(null);
  }

  async function copyAndOpen(){
    const cur = drafts[approach] || {};
    const text = cur.message || '';
    /* Whether this was sent unedited or heavily rewritten is exactly the
       signal the behavioral graph needs - not to judge the message, but so a
       later reply (markReplied) can be attributed to what was actually sent,
       edited or not, rather than to whatever the model first proposed. */
    const edited = !!cur.original && text.trim() !== cur.original.trim();
    try{ await navigator.clipboard.writeText(text); }catch(e){}
    window.open(row.profile_url, '_blank', 'noopener');
    /* Only the very first outreach auto-transitions the stage. But every send
       needs its own event logged, not just the first - buildPlan's "Reply to
       X" Today task only clears once a first_message/note lands after the
       last reply, and that never happened for anyone already past the first
       message, so the task could never be cleared by actually replying. */
    if(row.status!=='contacted' && REACHED.indexOf(row.status)<0){
      await onStage(row, 'contacted');
      await onEvent(row, 'first_message', text.slice(0,400));
    } else {
      await onEvent(row, 'note', 'Sent: '+text.slice(0,380));
    }
    await onUpdate(row, {context:{...ctx, lastApproach:approach, lastEdited:edited}});
    track('draft_copied', {stage: row.status, approach, edited});
    flash('Copied. Paste it, read it once more, then click Send yourself.');
  }

  async function saveCapture(){
    if(busy) return;
    const text = [noteS && noteS, noteC && ('Promises: '+noteC), noteP && ('Worth remembering: '+noteP)]
      .filter(Boolean).join('\n');
    if(!clean(text)) return;
    setBusy('note'); setErr(null);
    try{
      await onEvent(row, 'note', text);
      // Extract memories and promises so capture pays off later. Best effort:
      // a failed extraction must never lose the user's words.
      try{
        /* Distinct from the draft flow's exchangeKey above (different feature,
           different charge) but still needed - without one, llmJSON's own
           retry-on-malformed-JSON is billed as a second, full-price call
           instead of a free retry of the same exchange. */
        const out = await llmJSON(sb, 'coffee_extract',
          'You turn a short note about a professional conversation into structured memory. Extract only what the note actually says. No inference beyond the text.',
          `Note about a conversation with ${row.name||'them'}:\n${text}\n\nReturn JSON {"memories":[{"type":"interest"|"personal"|"fact"|"preference"|"event"|"context"|"shared","value":"short phrase"}],"promises":["something the user owes them"],"followUpDays":number}`,
          800, 'ex:'+row.id+':'+Date.now());
        const add = (Array.isArray(out.memories)?out.memories:[]).filter(m=>m&&clean(m.value)).map(m=>({
          id:'m'+Math.random().toString(36).slice(2,9)+Date.now().toString(36),
          type:m.type||'personal', value:clean(m.value), confidence:0.8, status:'confirmed',
          sourceLabel:'Your notes', sourceKind:'user', createdAt:Date.now(), updatedAt:Date.now()}));
        if(add.length) await onUpdate(row, {context:{...ctx, memories:memories.concat(add)}});
        const promises = (Array.isArray(out.promises)?out.promises:[]).filter(Boolean).slice(0,3);
        const dueDays = Number(out.followUpDays)>0 ? Number(out.followUpDays) : 7;
        for(const p of promises)
          await onTask({label:clean(p), sub:'You promised '+(row.name||'them'), log_id:row.id,
            due_date:new Date(Date.now()+dueDays*DAY).toISOString().slice(0,10)});
      }catch(e){}
      track('capture_saved', {after_reply: justReplied, fields:[noteS,noteC,noteP].filter(x=>clean(x)).length});
      setNoteS(''); setNoteC(''); setNoteP('');
      setJustReplied(false);
      flash('Captured');
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(null);
  }

  /* The reply signal. Two things happen and only the first one is required:
     the stage moves and a real 'reply' event lands, which is what Today,
     buildPlan and every later pattern read. Then capture is offered, because
     a reply just arrived is the one moment the words are still to hand. If she
     ignores the capture the signal is already saved - never make the cheap,
     valuable half wait on the expensive, optional half. */
  async function markReplied(){
    setBusy('reply'); setErr(null);
    try{
      await onEvent(row, 'reply', null);
      if(row.status!=='replied') await onStage(row, 'replied');
      /* Their answer starts a new exchange: writing back is new work, so the
         take counter resets and the next draft costs a fresh assist. The event
         is written first, above, so a failure here cannot lose the signal. */
      await onUpdate(row, {context: {...ctx, exchange: exchangeNo + 1, takes: 0}});
      /* approach/edited close the loop this exchange started at send time
         (see copyAndOpen) - the one join that turns "someone replied" into
         "curiosity openings replied X of Y times," the actual behavioral
         signal, not just an activity count. */
      track('reply_logged', {days_since_sent: Math.max(0, Math.round(days(row.contacted_at)||0)),
        exchange: exchangeNo + 1, approach: ctx.lastApproach || 'unknown', edited: !!ctx.lastEdited});
      setJustReplied(true);
      setTab('notes');
      flash('Logged. What did they say?');
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(null);
  }

  /* Overview used to be its own tab, one click away from the two cards that
     actually answer "why am I looking at this person" - why they matter to
     your goal, and why you saved them in the first place. Those now sit
     above the tabs, visible no matter which tab is open, matching the
     handoff. What Overview also held (the raw profile-facts table, shared
     context tags) moved into Prepare, next to the brief that already reads
     them; memories and open commitments moved into Notes, next to the rest
     of what you've captured about this person. */
  const TABS = [['brief','Prepare'],['draft','Draft'],['bridge','Bridge'],['notes','Notes'],['timeline','History']];
  /* Only asked once a message has actually gone out, and only until they answer. */
  const askedReplied = row.status==='contacted';

  return (
    <div className="pad fade" style={{maxWidth:1200,paddingTop:28}}>
      <button className="btn q" style={{padding:'6px 0',display:'flex',alignItems:'center',gap:7}} onClick={onBack}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
        <span>Back to Constellation</span>
      </button>

      <div style={{marginTop:18,display:'flex',alignItems:'flex-start',gap:16,flexWrap:'wrap'}}>
        <Avatar name={row.name} size={52} src={row.avatar_url}/>
        <div style={{flex:'1 1 200px',minWidth:0}}>
          <div className="row" style={{gap:10,flexWrap:'wrap',alignItems:'center'}}>
            <h2 className="h2">{row.name||'Unnamed'}</h2>
            <ConnectedBadge r={row}/>
            {/* Write first message / Prepare me / LinkedIn used to sit here as
               three buttons, directly duplicating the Draft/Prepare tabs one
               scroll down and the LinkedIn link inside Prepare - three ways
               in for two destinations. LinkedIn earns a permanent spot (it's
               the one action nothing below replaces) as an icon by the name;
               Draft and Prepare are one click away as the tabs' own default
               view, so the redundant buttons are gone. */}
            <a href={row.profile_url} target="_blank" rel="noopener noreferrer" title="Open on LinkedIn"
              style={{display:'flex',alignItems:'center',justifyContent:'center',width:26,height:26,
                borderRadius:'50%',background:'var(--card2)',color:'var(--sub)',flex:'none'}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
            </a>
          </div>
          <div className="sub" style={{marginTop:2}}>{row.title||'No headline captured'}</div>
        </div>
        {/* A quiet "Move to X ->" link below the header used to be the only
           way to change stage from here, and it only ever offered the next
           forward step - no way back, no way to jump. The pill already shows
           the current stage; making it the control itself (a native select,
           styled to still read as a pill) means one element does both jobs,
           anywhere in the pipeline, not just forward. */}
        <div style={{position:'relative',flex:'none'}}>
          <select value={row.status} disabled={!!busy}
            onChange={e=>{ const v=e.target.value; if(v===row.status) return;
              setBusy('stage'); Promise.resolve(onStage(row, v)).finally(()=>setBusy(null)); }}
            style={{appearance:'none',WebkitAppearance:'none',MozAppearance:'none',fontFamily:'inherit',
              background:st.bg,color:st.fg,padding:'11px 42px 11px 20px',fontSize:15,fontWeight:700,
              borderRadius:999,border:'1.5px solid '+st.fg+'40',cursor:'pointer'}}>
            {STAGE_OPTIONS.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={st.fg} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
            style={{position:'absolute',right:16,top:'50%',marginTop:-6,pointerEvents:'none'}}><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      {toast && <div style={{marginTop:14,fontSize:13.5,fontWeight:600,color:'var(--green)'}}>{toast}</div>}
      {err && <div className="banner err" style={{marginTop:14}}>{err}</div>}

      {askedReplied &&
        <div className="card" style={{marginTop:16,padding:'16px 20px',display:'flex',gap:14,
             alignItems:'center',flexWrap:'wrap',background:'var(--brand-soft)',borderColor:'var(--brand-line)'}}>
          <div style={{flex:'1 1 260px',minWidth:0}}>
            <div style={{fontSize:15,fontWeight:700,color:'var(--ink)'}}>Record a reply</div>
            <div className="sub" style={{fontSize:13.5,marginTop:2}}>
              Add their reply to this history.
            </div>
          </div>
          <button className="btn sm" onClick={markReplied} disabled={busy==='reply'}>
            {busy==='reply' ? <span><span className="spin"/> Saving</span> : 'Record reply'}
          </button>
        </div>}

      {/* "Why they matter to you" used to also live here, but it repeats the
         Prepare tab word for word once a brief exists - one copy, in the tab
         that already owns that content, is enough. "Why you saved them" has
         nowhere else it appears, so it stays - folded into one caption
         line instead of its own card, since a full card was disproportionate
         to how little space one line of text actually needs. */}
      {Array.isArray(ctx.timingSignals) && ctx.timingSignals.length>0 &&
        <div className="card" style={{marginTop:16,padding:'16px 20px',background:'var(--brand-soft)',borderColor:'var(--brand-line)'}}>
          <div className="eyebrow" style={{color:'var(--brand-ink)'}}>Worth knowing now</div>
          <div style={{fontSize:15,fontWeight:600,color:'var(--ink2)',marginTop:5}}>
            {ctx.timingSignals.join(' · ')}
          </div>
        </div>}
      <div className="sub" style={{marginTop:14,fontSize:13.5,lineHeight:1.5}}>
        {ctx.whySaved && <>{ctx.whySaved}{' · '}</>}
        {savedFromLabel(ctx)}
        {' · saved '}{dateShort(row.shortlisted_at)||'recently'}
      </div>

      <div className="seg" style={{marginTop:26,overflowX:'auto',maxWidth:'100%'}}>
        {TABS.map(([k,l])=><button key={k} className={tab===k?'on':''} onClick={()=>setTab(k)}>{l}</button>)}
      </div>

      {tab==='brief' &&
        <div className="stack fade" style={{gap:16,marginTop:24}}>
          {!(br.insights&&br.insights.length) && !profileRead &&
            <div className="card" style={{padding:'26px 26px 24px',position:'relative',overflow:'hidden'}}>
              <div aria-hidden="true" style={{position:'absolute',top:-140,left:-70,width:380,height:300,
                borderRadius:'50%',background:'radial-gradient(circle,rgba(160,120,255,.14),transparent 70%)',
                filter:'blur(10px)',pointerEvents:'none'}}/>
              <div style={{position:'relative'}}>
                <div className="h4">Open their profile once first.</div>
                <div className="sub" style={{marginTop:8,lineHeight:1.55,maxWidth:'58ch'}}>
                  All Mighty has is a name{row.company ? ' and an employer' : ''}. A brief from that would sound
                  confident and be hollow. Open their profile once with the extension running and Mighty reads
                  what is actually there: location, education, skills, and whether they just changed roles.
                </div>
                <div className="row" style={{gap:10,marginTop:18,flexWrap:'wrap'}}>
                  <a className="btn" href={row.profile_url} target="_blank" rel="noopener noreferrer">
                    Open their profile
                  </a>
                  <button className="btn g" onClick={()=>go({screen:'extension'})}>Extension setup</button>
                </div>
                <div className="hint" style={{marginTop:14}}>
                  It reads the page you are looking at. Mighty never opens LinkedIn for you.
                </div>
              </div>
            </div>}

          {!(br.insights&&br.insights.length) && profileRead &&
            <div className="card" style={{padding:'28px 30px',position:'relative',overflow:'hidden'}}>
              <div aria-hidden="true" style={{position:'absolute',top:-140,left:-70,width:380,height:300,
                borderRadius:'50%',background:'radial-gradient(circle,rgba(160,120,255,.14),transparent 70%)',
                filter:'blur(10px)',pointerEvents:'none'}}/>
              <div style={{position:'relative',display:'flex',alignItems:'center',gap:12}}>
                <span style={{color:'var(--brand-ink)'}}>&#10022;</span>
                <span style={{fontFamily:'var(--f-head)',fontSize:22,fontWeight:700,letterSpacing:'-.02em'}}>Brief</span>
              </div>
              <div className="sub" style={{position:'relative',marginTop:14,lineHeight:1.55,maxWidth:'58ch'}}>
                A brief based on their profile and your goal.
              </div>
              <button className="btn" style={{position:'relative',marginTop:18}} onClick={makeBrief} disabled={!!busy && busy!=='brief'}>
                {busy==='brief'?<span><span className="spin"/> Preparing</span>:'Create brief'}
              </button>
              {/* Free on purpose - no Assist charge for this action. */}
              <div className="hint" style={{position:'relative',marginTop:12}}>
                Free.
              </div>
            </div>}

          {/* One panel, one story - Insights/Conversation starters/Don't lead
             with/Shared context used to be five separate cards with no shared
             frame. Insights used to be two prose fields (whyMatters, a
             career-summary paragraph) - real feedback was that it read as a
             biography to get through, not something to decide from, so both
             became one bulleted list: the single most decision-relevant fact
             first (styled a touch larger, the one thing worth reading even at
             a glance), the rest plain bullets underneath. Matches Draft's
             glow-card language (Mighty Prism.dc.html's own Brief card does
             the same: one card, sub-labelled sections, not a stack). */}
          {br.insights && br.insights.length>0 &&
            <div className="card" style={{padding:'28px 30px',position:'relative',overflow:'hidden'}}>
              <div aria-hidden="true" style={{position:'absolute',top:-140,left:-70,width:380,height:300,
                borderRadius:'50%',background:'radial-gradient(circle,rgba(160,120,255,.14),transparent 70%)',
                filter:'blur(10px)',pointerEvents:'none'}}/>
              <div style={{position:'relative',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
                <span style={{color:'var(--brand-ink)'}}>&#10022;</span>
                <span style={{fontFamily:'var(--f-head)',fontSize:22,fontWeight:700,letterSpacing:'-.02em'}}>Brief</span>
              </div>

              <div className="stack" style={{position:'relative',gap:12,marginTop:18}}>
                {br.insights.map((s,i)=>(
                  i===0 ? (
                    <div key={i} style={{fontSize:17,lineHeight:1.5,color:'var(--ink2)',fontWeight:600,textWrap:'pretty'}}>{s}</div>
                  ) : (
                    <div key={i} className="row" style={{gap:10,alignItems:'flex-start'}}>
                      <span className="dot" style={{background:'var(--brand-ink)',marginTop:7}}/>
                      <span style={{fontSize:15,color:'var(--body)',lineHeight:1.5}}>{s}</span>
                    </div>
                  )
                ))}
              </div>

              {((br.shared&&br.shared.length) || (ctx.common&&ctx.common.length)) &&
                <F>
                  <div className="eyebrow" style={{position:'relative',marginTop:22}}>Shared ground</div>
                  <div className="stack" style={{position:'relative',gap:10,marginTop:10}}>
                    {((br.shared&&br.shared.length?br.shared:ctx.common)||[]).map((s,i)=>(
                      <div key={i} className="row" style={{gap:10,alignItems:'flex-start'}}>
                        <span className="dot" style={{background:'var(--brand-ink)',marginTop:7}}/>
                        <span style={{fontSize:15,color:'var(--body)',lineHeight:1.5}}>{s}</span>
                      </div>))}
                  </div>
                </F>}

              {br.conversationStarters && br.conversationStarters.length>0 &&
                <F>
                  <div className="eyebrow" style={{position:'relative',marginTop:22}}>Conversation starters</div>
                  <div className="stack" style={{position:'relative',gap:10,marginTop:10}}>
                    {br.conversationStarters.map((s,i)=>(
                      <div key={i} className="row" style={{gap:10,alignItems:'flex-start'}}>
                        <span className="dot" style={{background:'var(--brand)',marginTop:7}}/>
                        <span style={{fontSize:15,color:'var(--body)',lineHeight:1.5}}>{s}</span>
                      </div>))}
                  </div>
                </F>}

              {br.avoid &&
                <F>
                  <div className="eyebrow" style={{position:'relative',marginTop:22}}>Don't lead with</div>
                  <div style={{position:'relative',fontSize:15,lineHeight:1.6,color:'var(--body)',marginTop:8}}>{br.avoid}</div>
                </F>}

              <div className="row" style={{position:'relative',gap:10,marginTop:26,flexWrap:'wrap'}}>
                <button className="btn" onClick={()=>setTab('draft')}>Draft a message</button>
                <button className="btn g" onClick={makeBrief} disabled={busy==='brief'}>
                  {busy==='brief'?<span><span className="spin"/> Refreshing</span>:'Rebuild brief'}
                </button>
              </div>
            </div>}

          {warmIntro &&
            <div className="card" style={{padding:'22px 24px',background:'var(--brand-soft)',borderColor:'var(--brand-line)'}}>
              <div className="eyebrow b">Warm intro</div>
              <div style={{fontSize:15,lineHeight:1.6,color:'var(--body)',marginTop:8}}>
                You already know {warmIntro.count} {warmIntro.count===1?'person':'people'} at {warmIntro.label}
                {warmIntro.sample.length ? ': '+warmIntro.sample.map(s=>s.name).filter(Boolean).join(', ') : ''}.
                Worth asking one of them for an intro before cold-messaging.
              </div>
            </div>}

      {tab==='timeline' &&

            <div style={{fontSize:15,color:'var(--ink2)',fontWeight:600}}>Saved to Mighty</div>

              <div><div className="lbl">Did either of you promise anything?</div>

            <button className="btn sm" style={{marginTop:18}} onClick={saveCapture}
              disabled={(!!busy && busy!=='note')||!clean(noteS+noteC+noteP)}>

            </button>
          </div>
          {mine.filter(e=>e.event_type==='note').slice().reverse().map(e=>(
            <div key={e.id} className="card" style={{padding:'20px 24px'}}>
              <div style={{fontSize:12.5,fontWeight:700,color:'var(--mute)'}}>{dateShort(e.occurred_at)}</div>
              <div style={{fontSize:15,lineHeight:1.6,color:'var(--ink2)',marginTop:7,whiteSpace:'pre-line',textWrap:'pretty'}}>{e.note}</div>

    </div>
