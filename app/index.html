            <div style={{fontSize:14.5,lineHeight:1.6}}>{t}</div>
          </div>))}
      </div>
    </GridCard>
  );
}
function CardThisWeek({people, events, tasks, sinceVisit}){
  const items = [];
  const recentReply = (events||[]).filter(e=>e.event_type==='stage_change' && e.extracted && e.extracted.to==='replied' && days(e.occurred_at)<=7)
    .sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at))[0];
  if(recentReply){
    const person = people.find(p=>p.id===recentReply.log_id);
    if(person) items.push({up:true, text:`${person.name||'Someone'} replied. Keep the thread moving.`});
  }
  if(sinceVisit){
    if(sinceVisit.added>0) items.push({up:true, text:`${sinceVisit.added} new ${sinceVisit.added===1?'person':'people'} saved since your last visit.`});
    if(sinceVisit.reached>0) items.push({up:true, text:`${sinceVisit.reached} more reached out to.`});
  }
  const openOverdue = (tasks||[]).filter(t=>!t.done && t.due_date && new Date(t.due_date) < new Date());
  if(openOverdue.length>0) items.push({up:false, text:`${openOverdue.length} open ${openOverdue.length===1?'commitment is':'commitments are'} past due.`});
  const doneRecently = (tasks||[]).filter(t=>t.done && t.completed_at && days(t.completed_at)<=7);
  if(doneRecently.length>0) items.push({up:true, text:`You followed through on ${doneRecently.length} ${doneRecently.length===1?'commitment':'commitments'} this week.`});
  if(!items.length) return null;
  return (
    <GridCard span="full" tint>
      <div className="eyebrow b" style={{color:'var(--brand-ink)',fontSize:11.5}}>THIS WEEK</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:'10px 28px',marginTop:14}}>
        {items.map((it,i)=>(
          <div key={i} className="row" style={{gap:10,alignItems:'flex-start'}}>
            <span style={{color: it.up?'var(--green)':'var(--red)',fontWeight:800,flex:'none',fontSize:13}}>{it.up?'▲':'▼'}</span>
            <span style={{fontSize:13.5,lineHeight:1.5}}>{it.text}</span>
          </div>))}
      </div>
    </GridCard>
  );
}
function CardToDo({dormancy, settings, people, go}){
  const goal = goalTypeList(settings)[0] || 'networking';
  const cfg = DECODED_GOAL_SEARCH[goal] || DECODED_GOAL_SEARCH.networking;
  const bucket = dormancy && cfg.functionKey && dormancy[cfg.functionKey];
  const reached = people.filter(r=>REACHED.includes(r.status)).length;
  const talked = people.filter(r=>['replied','coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length;
  const items = [];
  if(bucket && bucket.sample.length>0)
    items.push({text:`Wake the ${bucket.sample.length} ${(DECODED_FUNCTION_LABEL[cfg.functionKey]||'contact').toLowerCase()} ${bucket.sample.length===1?'contact':'contacts'} already surfaced.`,
      cta:'Open Relationships', onClick:()=>go({screen:'relationships'})});
  /* Matches CardApproaches' MIN_TOTAL - below that, a reply count from a
     different population (all pipeline stages here, vs logged drafts there)
     reads as a rate claim with no comparable denominator. */
  if(reached>=15){
    items.push({text:`${talked} of ${reached} you reached out to have replied.`,
      cta:'Find someone', onClick:()=>go({screen:'relationships', view:'explore'})});
  }
  if(!items.length) return null;
  return (
    <GridCard span="full">
      <div className="eyebrow b" style={{color:'var(--brand-ink)',fontSize:11.5}}>WHAT TO DO ABOUT IT</div>
      <div className="stack" style={{gap:0,marginTop:14}}>
        {items.map((it,i)=>(
          <div key={i} className="row" style={{justifyContent:'space-between',padding:'13px 0',gap:16,
            borderTop:i?'1px solid var(--line4)':'none'}}>
            <span style={{fontSize:14.5,fontWeight:600}}>{it.text}</span>
            <button className="btn q" style={{fontSize:13.5,fontWeight:700,color:'var(--brand-ink)',flex:'none'}} onClick={it.onClick}>{it.cta}</button>
          </div>))}
      </div>
    </GridCard>
  );
}
function CardGaps({settings, people, onEdit}){
  const gaps = [];
  if(!people.some(p=>p.status==='do_not_contact')) gaps.push('No one is marked as already declined, so ranking cannot learn to avoid a repeat ask.');
  /* Roles/companies/locations are the "specific roles or people" a goal can
     name - check those fields directly rather than the free-text elaboration,
     which says nothing about whether that detail was ever filled in. */
  const hasDetail = (settings.targetRoles||[]).length || (settings.targetCompanies||[]).length || (settings.targetLocations||[]).length;
  if(!hasDetail) gaps.push('Review your goal');
  gaps.push('Add a target and deadline to track progress.');
  if(!gaps.length) return null;
  return (
    <GridCard span="full" tint>
      <div className="eyebrow b" style={{color:'var(--brand-ink)',fontSize:11.5}}>WHAT IT STILL DOES NOT KNOW</div>
      <div className="stack" style={{gap:0,marginTop:14}}>
        {gaps.map((g,i)=>(
          <div key={i} className="row" style={{gap:14,padding:'11px 0',borderTop:i?'1px solid var(--line4)':'none'}}>
            <span style={{fontWeight:800,color:'var(--brand-ink)',flex:'none',fontVariantNumeric:'tabular-nums'}}>{String(i+1).padStart(2,'0')}</span>
            <span style={{fontSize:13.5,lineHeight:1.55}}>{g}</span>
          </div>))}
      </div>
      {onEdit && <button className="btn sm" style={{marginTop:16}} onClick={()=>onEdit(OB.goal)}>Correct this</button>}
    </GridCard>
  );
}

/* ===================== Patterns (Your relationship profile) =====================
   Owns the empty/rebuild state and the outer grid; every card above is a
   pure function of decoded/kb/people/events/tasks and renders itself or
   nothing. A snapshot of pipeline counts at the last visit lives in the
   user's own settings (patternsSnapshot) - no server table, one write per
   visit through the same saveSettings path everything else already uses. */
function Patterns({sb, settings, people, events, tasks, appEvents, onSaveSettings, onSave, onOpen, onEdit, onRebuild, go}){
  const decoded = (settings.knowledge||{}).decoded || null;
  const kb = settings.knowledge || {};
  const [rebuilding,setRebuilding] = useState(false);
  const [rebuildErr,setRebuildErr] = useState(null);
  const [replayKey,setReplayKey] = useState(0);

  const reached = people.filter(r=>REACHED.includes(r.status)).length;
  const talked  = people.filter(r=>['replied','coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length;
  const prev = settings.patternsSnapshot;
  const sinceVisit = (prev && prev.at) ? {
    added:   people.length - (prev.added||0),
    reached: reached - (prev.reached||0),
    talked:  talked - (prev.talked||0),
  } : null;

  useEffect(()=>{
    if(!onSaveSettings) return;
    onSaveSettings({patternsSnapshot:{at:new Date().toISOString(), added:people.length, reached, talked}});
    // eslint-disable-next-line
  },[]);
  useEffect(()=>{
    if(decoded && !settings.decodedSeen && onSaveSettings) onSaveSettings({decodedSeen:true});
    // eslint-disable-next-line
  },[!!decoded]);

  const savedMap = (()=>{
    const byUrl={}, byName={};
    people.forEach(r=>{
      if(r.profile_url) byUrl[r.profile_url.replace(/\/$/,'').toLowerCase()] = r;
      if(r.name) byName[r.name.toLowerCase()] = r;
    });
    return {byUrl, byName};
  })();

  const hasArchive = !!(kb.positions||[]).length || !!kb.connectionCount;
  const doRebuild = async()=>{
    if(!onRebuild) return onEdit(OB.linkedin);
    setRebuilding(true); setRebuildErr(null);
    try{ await onRebuild(); }
    catch(e){
      if(e && e.code==='no_archive'){ onEdit(OB.linkedin); return; }
      setRebuildErr((e&&e.message)||'Could not rebuild - try again.');
    }
    finally{ setRebuilding(false); }
  };

  return (
    <div>
      <div className="row" style={{justifyContent:'space-between',alignItems:'baseline',flexWrap:'wrap',gap:12}}>
        <div>
          <h1 className="h1">Your relationship profile</h1>
        </div>
        {decoded && <button className="btn sm" onClick={()=>setReplayKey(k=>k+1)}>Read it again</button>}
      </div>

      {!decoded &&
        <div className="card" style={{padding:'34px 30px',marginTop:24}}>
          <div className="h3">Your Network, Decoded</div>
          <div className="sub" style={{marginTop:7,lineHeight:1.55,maxWidth:520}}>
            {hasArchive
              ? 'Mighty already has your archive, but this reading was never built from it - rebuilding reads the same file back from storage, without losing anything else already saved.'
              : 'Import your LinkedIn export in Mirror, and Mighty reads back the shape of everything you have built - told honestly, once.'}
          </div>
          {rebuildErr && <div className="sub" style={{marginTop:8,color:'var(--red)'}}>{rebuildErr}</div>}
          <button className="btn sm" style={{marginTop:16}} disabled={rebuilding} onClick={hasArchive ? doRebuild : ()=>onEdit(OB.linkedin)}>
            {rebuilding ? <span><span className="spin"/> Rebuilding…</span> : (hasArchive ? 'Rebuild from my archive' : 'Import my history')}
          </button>
        </div>}

      {decoded &&
        <div key={replayKey} className="fade" style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(360px,1fr))',
          gap:16,marginTop:24,alignItems:'start'}}>
          <CardThreeThings decoded={decoded}/>
          <CardThisWeek people={people} events={events} tasks={tasks} sinceVisit={sinceVisit}/>
          <CardFrame data={decoded.chapters.frame}/>
          <CardSleep data={decoded.chapters.sleep} messagesPresent={decoded.messagesPresent}/>
          <CardEras data={decoded.chapters.eras}/>
          <CardShowUp data={decoded.chapters.showUp}/>
          <CardCircle data={decoded.chapters.circle} savedMap={savedMap} onOpen={onOpen} onSave={onSave}/>
          <CardCompared yoy={decoded.chapters.yoy}/>
          <CardCompanies data={decoded.chapters.shape} settings={settings}/>
          <CardTurn dormancy={decoded.chapters.dormancy} settings={settings}/>
          <CardHolds kb={kb} decoded={decoded}/>
          <CardDoors data={decoded.chapters.doors}/>
          <CardHabits showUp={decoded.chapters.showUp} tasks={tasks}/>
          <CardApproaches appEvents={appEvents}/>
          <CardToDo dormancy={decoded.chapters.dormancy} settings={settings} people={people} go={go}/>
          <CardGaps settings={settings} people={people} onEdit={onEdit}/>
        </div>}
    </div>
  );
}

/* Mirror and Patterns used to be two tabs answering two halves of the same
   question - what Mighty has read, and what it has noticed - split apart
   for no reason a reader could tell. The handoff merges them into one
   scrollable "Profile": patterns first (what changed, what it means), then
   the raw holdings (what it actually has) after. Account becomes Settings,
   with Extension folded in as one of its "Connected" cards instead of a
   separate rail item. */
/* Labelled "Account", not "Settings" - the sidebar footer below already says
   "Account" and links here (see Shell), and having the tab call itself
   something else was the exact split that made this feel like two features
   instead of one. The routing key stays 'settings' everywhere else in the
   app; only the word shown to the user changes. */
const YOU_TABS = [['profile','Profile'],['goal','Goal'],['settings','Account']];

/* ===================== You =====================
   Strategy and Settings used to be two surfaces answering two different
   questions, but both are really the same question: how does this work for
   me. Four sub-tabs under one roof. Mirror is what Mighty has read. Patterns
   is what it has noticed. Goal is what the user told it. Account is the

function You({sb, email, settings, people, events, tasks, appEvents, tab, setTab, editGoal, setEditGoal, busySave, onSaveSettings, onSignOut, onDeleteAccount, onReimport, onRebuildDecoded, onSave, onOpen, go, aiMeta, theme, onSetTheme}){
  // Profile has no maxWidth cap - the old 1180px ceiling left a dead margin

      <div className="seg">

              onSaveSettings={onSaveSettings} onSave={onSave} onOpen={onOpen} onEdit={onReimport} onRebuild={onRebuildDecoded} go={go}/>
            <div style={{marginTop:36}}>
              <div className="eyebrow b">Your sources</div>
              <KnowledgeBase settings={settings} onEdit={onReimport} go={go} onSave={onSave} people={people}/>
            </div>
          </div>}
        {tab==='goal' && !editGoal &&
          <F>
            <StrategyView settings={settings} people={people} onEdit={()=>setEditGoal(true)}/>
            <SecondaryGoals settings={settings} onSaveSettings={onSaveSettings}/>
          </F>}
        {tab==='goal' && editGoal &&
          <StrategyForm settings={settings} busy={busySave} go={go}
            onSave={async(p)=>{ await onSaveSettings(p); setEditGoal(false); }}
            onCancel={()=>setEditGoal(false)}/>}

/* ===================== auth ===================== */
function Gate({sb}){
  const [mode,setMode] = useState('in');   // 'in' | 'reset' - see go() for why 'up' is gone
  const [email,setEmail] = useState(''); const [pw,setPw] = useState('');
  const [busy,setBusy] = useState(false); const [msg,setMsg] = useState(null); const [err,setErr] = useState(null);
  /* "Continue with MIT" renders only once the server says the OIDC client is
     actually configured - a visible button that errors is worse than no
     button, and the function ships before the oidc.mit.edu registration
     exists. The probe is unauthenticated by design (nobody is signed in on
     this screen; the function is deployed without JWT verification). */
  const [mit,setMit] = useState(false);
  useEffect(()=>{
    let dead=false;
    fetch(SUPABASE_URL+'/functions/v1/mit-auth?action=status')
      .then(r=>r.json()).then(d=>{ if(!dead) setMit(!!(d&&d.configured)); })
      .catch(()=>{});
    /* A failed Touchstone round lands back here as ?mit_error= so it reads as
       a sentence instead of stranding the browser on a JSON blob. Shown once,
       then cleared so a reload does not re-accuse. */
    const p = new URLSearchParams(window.location.search);
    const me = p.get('mit_error');
    if(me){ setErr(me); p.delete('mit_error');
      window.history.replaceState({},'',window.location.pathname+(p.toString()?'?'+p.toString():'')); }
    return ()=>{ dead=true; };
  },[]);
  async function goMit(){
    if(busy) return;
    setBusy(true); setErr(null); setMsg(null);
    try{
      const r = await fetch(SUPABASE_URL+'/functions/v1/mit-auth?action=start');
      const d = await r.json();
      if(!d || !d.url) throw new Error((d&&d.error)||'MIT sign-in did not answer.');
      window.location.href = d.url;     // Touchstone + Duo, then back here signed in
    }catch(e){ setErr(e.message||String(e)); setBusy(false); }
  }
  async function go(){
    setErr(null); setMsg(null);
    /* Self-serve signup is gone on purpose, not just unreachable from the UI -
       nobody types their way to an account here anymore. /request/ is the only
       door in; an account only exists once it has been created by hand and its
       temporary password sent directly to the person. This form now only ever
       signs an already-provisioned person in, or resets a password. */
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(clean(email))){ setErr('That does not look like an email address.'); return; }
    setBusy(true);
    try{
      if(mode==='reset'){
        const {error} = await sb.auth.resetPasswordForEmail(clean(email), {redirectTo:location.href});
        if(error) throw error; setMsg('Password reset link sent.');
      } else {
        const {error} = await sb.auth.signInWithPassword({email:clean(email), password:pw});
        if(error) throw error;
      }
    }catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{width:'100%',maxWidth:400}}>
        <div className="row" style={{gap:10,marginBottom:26}}>
          <Logo/><span style={{fontSize:20,fontWeight:700,letterSpacing:'-.02em'}}>Mighty</span>
        </div>
        <h2 className="h2">{mode==='in'?'Welcome back':'Reset your password'}</h2>
        <div className="sub" style={{marginTop:6}}>Intentional, intelligent networking.</div>
        <div className="card" style={{marginTop:22,padding:'22px 24px'}}>
          <div className="lbl">Email</div>
          <input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)}
            placeholder="you@work.com" autoComplete="email"/>
          {mode!=='reset' &&
            <div style={{marginTop:14}}>
              <div className="lbl">Password</div>
              <input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter') go(); }}
                autoComplete="current-password"/>
            </div>}
          {err && <div className="banner err" style={{marginTop:14}}>{err}</div>}
          {msg && <div className="banner ok" style={{marginTop:14}}>{msg}</div>}
          <button className="btn" style={{width:'100%',marginTop:18}} onClick={go} disabled={busy}>
            {busy?<span><span className="spin"/> Working…</span>:mode==='in'?'Sign in':'Send reset link'}
          </button>
          {/* MIT Touchstone signed itself up to the same rule this form now
             follows everywhere else: nobody provisions their own account.
             goMit()/the mit-auth edge function still exist untouched (its own
             admin.createUser call is exactly the self-serve path being turned
             off here) - just not reachable from this screen while every new
             account is meant to be hand-created and sent out. Restore this
             block to bring it back. */}
          {/* One door in now: /request/. Nobody signs themselves up here
             anymore - an account only exists once it has been created by
             hand and its temporary password sent directly to the person, so
             this screen only ever signs an existing account in or resets its
             password. */}
          <div className="row" style={{justifyContent:'space-between',marginTop:14}}>
            {mode==='reset'
              ? <button className="btn q" style={{fontSize:13.5,padding:0}}
                  onClick={()=>{ setMode('in'); setErr(null); setMsg(null); }}>Back to sign in</button>
              : <span/>}
            {mode==='in' &&
              <button className="btn q" style={{fontSize:13.5,padding:0}} onClick={()=>{ setMode('reset'); setErr(null); }}>Forgot password</button>}
          </div>
          {mode!=='reset' &&
            <div className="sub" style={{marginTop:12,fontSize:12.5}}>
              Don't have an account? <a href="/request/" style={{color:'var(--brand)',fontWeight:600}}>Join the waitlist</a> - we'll set it up and send it to you.
            </div>}
        </div>
      </div>
    </div>
  );
}
function Logo({small, dark}){
  const d = small ? 18 : 21;
  return (
    <div style={{position:'relative',width:small?26:31,height:d,flex:'none'}}>
      <div style={{position:'absolute',left:0,top:0,width:d,height:d,borderRadius:'50%',background:'var(--brand)'}}/>
      <div style={{position:'absolute',left:small?8:10,top:0,width:d,height:d,borderRadius:'50%',
        /* 'multiply' darkened the overlap toward the cream page behind it;
           the Prism repaint puts this mark on a dark ground everywhere it
           appears now, where the two circles need to lighten where they
           cross instead - 'screen' is the blend mode for that. The `dark`

}

/* ===================== shell ===================== */

  {key:'explore', label:'Discover', explore:true, icon:

  {key:'rooms', label:'Rooms', icon:

  /* Organiser Hub's nav entry is removed, not the screen/route itself (still
     defined below) - hidden, not deleted, so it costs nothing to bring back
     and nothing currently linked to 'organiser' breaks. */
];
const QUESTION = {ask:'What should I do?', extension:'Save people while you browse.'};

function Shell({screen, relView, youTab, boardOK, timelineOK, go, savedCount, email, selfLinkedInUrl, selfAvatarUrl, onSignOut, aiMeta, askOpen, onToggleAsk, children}){
  /* Today does not exist until there is something to be doing.
     An empty Today on day one teaches a new user that Mighty has nothing for

     appears the moment one person is added, and never goes away again. */
  const nav = NAV.filter(n=> n.key!=='today' || savedCount>0);
  /* Explore has no screen of its own - it is still view:'explore' inside
     Relationships underneath - so its rail row is "on" precisely when
     Relationships' is not, and vice versa, rather than both lighting up
     together the moment you're anywhere inside Relationships. */
  const parentOn = (k)=> k==='explore' ? (screen==='relationships' && relView==='explore')
    : k==='relationships' ? (screen==='profile' || (screen==='relationships' && relView!=='explore'))

    if(parent==='relationships') return screen==='relationships' && relView===child.view;

    return false;

    background:on?'var(--brand-nav)':'transparent', color:on?'var(--brand-ink)':(sub?'var(--sub)':'var(--mute)')});

     printed inline, rather than doing nothing. A click that produces no
     visible change reads as broken, not as "not yet". */
  const childClick = (parent, child)=>{
    if(child.extension) go({screen:'extension'});
    else if(parent==='relationships') go({screen:'relationships', view:child.view});
    else if(parent==='you') go({screen:'you', tab:child.tab});
  };
  /* Landing on the parent row lands on that surface's default view - List for
     Relationships, Mirror for You - rather than whatever was left over from a

  const topClick = (k)=> k==='explore' ? go({screen:'relationships', view:'explore'}) :
    go(k==='you' ? {screen:'you', tab:'profile'} : k==='relationships' ? {screen:'relationships', view:'list'} : {screen:k});
  return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--paper)'}}>

            <F key={n.key}>

                {n.icon}<span style={{flex:1}}>{n.label}</span>
                {n.badge && savedCount>0 && <span className="meta" style={{fontWeight:600}}>{savedCount}</span>}
              </button>
              {/* Always expanded, not just the active section - the rail is
                 meant to read as a full map of the product at a glance, not
                 something that rearranges itself as you click around. */}
              {n.children && n.children.map(c=>{
                const locked = c.lock && !(c.lock==='board'?boardOK:timelineOK);
                return (
                  <button key={c.key} onClick={()=>childClick(n.key, c)}
                    title={locked ? UNLOCKS[c.lock].hint : undefined}
                    style={{...navBtn(childOn(n.key,c), true, c.gap), opacity:locked?.6:1}}>
                    <span style={{flex:1}}>{c.label}</span>
                  </button>);
              })}
            </F>))}
        </nav>
        <div style={{flex:1}}/>
        {/* A floating action, not a nav row - Ask Mighty is not a place you go,
           it is a question you ask from wherever you already are, so it reads

        {/* Identity only - Sign out has one home, the Account tab this links

        <button className="row" style={{gap:11,padding:'16px 22px 20px',
          borderTop:'1px solid var(--line3)',borderLeft:'none',borderRight:'none',borderBottom:'none',
          background:'none',cursor:'pointer',textAlign:'left',width:'100%'}}

          {/* Only shown once the proxy has actually told us a number. Guessing

            (aiMeta.assistsLeftMonth===0 ? (

                </span>

            ) : (
              <span className="pill" title={'Plan: '+(aiMeta.plan||'unknown')}

              </span>

                onClick={()=>topClick(n.key)}>{n.label}</button>))}
          </div>
        </header>
        <div style={{flex:1}}>{children}</div>
      </main>
    </div>
  );
}

/* ===================== The Mighty Knowledge Base =====================
   Everything Mighty holds about one user, in one place, appended to rather than
   replaced. The LinkedIn archive is the first deposit; captures, replies,
   extension reads and later goals all land in the same store.

   Two names, one boundary, worth keeping straight:
     - the Knowledge Base is the USER's. It never leaves their account.
     - Mighty Brain is the intelligence. It learns categorical patterns and
       never sees content.

   Parsing happens in the browser because it is faster and needs no edge
   function, and the raw archive is ALSO stored, because the parser will improve
   and re-deriving from a kept file costs nothing while asking someone to export
   again costs their goodwill. */

/* A CSV parser that survives LinkedIn's files: quoted fields containing commas,
   escaped quotes, CRLF, and the multi-line preamble Connections.csv opens with. */
function parseCsv(text){
  const rows = []; let row = [], field = '', q = false;
  const t = String(text || '').replace(/^﻿/, '');
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){
      if(c === '"'){ if(t[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += c;
    } else if(c === '"') q = true;
    else if(c === ','){ row.push(field); field = ''; }
    else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else if(c !== '\r') field += c;
  }
  if(field || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => (v || '').trim()));
}
/* Postgres text/jsonb rejects raw C0 control bytes outright ("unsupported Unicode
   escape sequence", tab/newline excepted) - LinkedIn's export can carry them in
   free-text fields (Summary, position Description) same as a pasted PDF resume
   can. Shared by every CSV field below and by the resume reader, so the whole
   class closes in one place instead of per-field. */
const stripControl = (s)=> String(s||'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
/* LinkedIn puts a notes block above the header in some files, so find the header
   by looking for the row that actually contains the columns we need. */
function csvObjects(text, mustHave){
  const rows = parseCsv(text);
  if(!rows.length) return [];
  let h = 0;
  if(mustHave) for(let i = 0; i < Math.min(rows.length, 12); i++){
    if(mustHave.every(k => rows[i].includes(k))){ h = i; break; }
  }
  const hdr = rows[h].map(x => x.trim());
  return rows.slice(h+1).map(r => {
    const o = {}; hdr.forEach((k, i) => o[k] = stripControl((r[i] || '').trim())); return o;
  });
}

/* Bring-your-own-contact-list import (CSV, Excel, or pasted rows), shared
   between the Relationships toolbar and the sources list in Setup. Same
   alias map OrganiserHub uses for event attendee files - kept as its own
   copy there rather than refactored to share this one, so a change here
   can't move Rooms' import out from under it. */
const PEOPLE_COLMAP = {
  name: ['name','full name','fullname','contact','contact name'],
  first: ['first name','firstname','given name'],
  last: ['last name','lastname','surname','family name'],
  title: ['title','role','job title','position','headline'],
  company: ['company','organization','organisation','employer','company name'],
  profileUrl: ['linkedin','linkedin url','profile','profile url','linkedin profile','url'],
  email: ['email','email address','e-mail'],
  location: ['location','city','geography'],
};
function mapPeopleRow(row){
  const keys = Object.keys(row);
  const find = (aliases)=>{ const k = keys.find(k=>aliases.includes(k.trim().toLowerCase())); return k?clean(row[k]):''; };
  let nm = find(PEOPLE_COLMAP.name);
  if(!nm) nm = [find(PEOPLE_COLMAP.first), find(PEOPLE_COLMAP.last)].filter(Boolean).join(' ');
  return {name:nm, title:find(PEOPLE_COLMAP.title)||null, company:find(PEOPLE_COLMAP.company)||null,
    profileUrl:find(PEOPLE_COLMAP.profileUrl)||null, email:find(PEOPLE_COLMAP.email)||null,
    location:find(PEOPLE_COLMAP.location)||null};
}
/* A pasted block has no filename to go by, so the delimiter is guessed from
   the text itself: copying rows out of Excel/Sheets/a Word table puts tabs
   between cells, not commas, and parseCsv only understands commas. Falling
   back to comma-splitting a tab-free paste is what makes a plain
   comma-separated paste (no spreadsheet involved) work the same way. */
function rowsFromPastedText(text){
  const t = String(text||'');
  const delim = t.includes('\t') ? '\t' : ',';
  const csvText = delim === '\t' ? t.split('\n').map(l=>l.split('\t').map(c=>'"'+c.replace(/"/g,'""')+'"').join(',')).join('\n') : t;
  return csvObjects(csvText).map(mapPeopleRow).filter(r=>r.name);
}
async function rowsFromFile(file){
  const isXlsx = /\.xlsx?$/i.test(file.name);
  const isCsv  = /\.csv$/i.test(file.name);
  if(!isXlsx && !isCsv){
    throw new Error('CSV or Excel (.xlsx) only for now. For anything else, open it and paste the rows in below.');
  }
  if(isCsv){
    const text = await file.text();
    return csvObjects(text).map(mapPeopleRow).filter(r=>r.name);
  }
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, {type:'array'});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const text = window.XLSX.utils.sheet_to_csv(sheet);
  return csvObjects(text).map(mapPeopleRow).filter(r=>r.name);
}

/* LinkedIn's export writes message dates as "2020-04-11 14:22:07 UTC" -
   parseable directly by Date in every real browser, but wrapped so a change
   in export format degrades to "unknown date" instead of a thrown error. */
function msgDate(s){
  const d = new Date(String(s||'').trim());
  return isNaN(d.getTime()) ? null : d;
}
const median = (nums)=>{
  const a = nums.filter(n=>n!=null).sort((x,y)=>x-y);
  return a.length ? a[Math.floor(a.length/2)] : null;
};

/* What the message archive is worth, and what it is not.
   LinkedIn's messages.csv has FROM / SENDER PROFILE URL / TO / DATE / SUBJECT
   / CONTENT / CONVERSATION ID. Matching the user's own name against FROM is
   how we tell which half is theirs; if the name cannot be matched at all we
   keep nothing rather than guess, because guessing wrong here means storing
   someone else's words as if they were the user's own.

   Grew from messageStyle() into messageGraph(): still returns every field the
   voice-sample feature already depends on (sent/received/identified/
   medianSentLength/styleSamples), and additionally groups by CONVERSATION ID
   into per-thread aggregates - who the thread is with, how many messages each
   way, when it started and last moved, whether they wrote first, and the
   reply-time gap each time the sender alternates. This is the one parsing
   pass "Your Network, Decoded" chapters 3-5 are built from; nothing else
   reads messages.csv content, so this only ever runs once per import. */
function messageGraph(rows, profile, connections){
  const first = clean((profile||{})['First Name']).toLowerCase();
  const last  = clean((profile||{})['Last Name']).toLowerCase();
  const me    = clean(first + ' ' + last).toLowerCase();
  const isMe = (name)=>{
    const n = clean(name).toLowerCase();
    return !!n && me && (n === me || (first && last && n.indexOf(first)>=0 && n.indexOf(last)>=0));
  };
  const mine = [], theirs = [];
  /* SENDER PROFILE URL is populated on every row regardless of direction -
     on a row the account holder sent, it's their own profile URL, which is
     otherwise nowhere in the archive (Profile.csv has no URL column at all).
     Read once here, off the first sent row that has it - virtually everyone
     who has ever sent a LinkedIn message carries this, unlike a resume
     mentioning the URL in plain text, which most people's resumes don't. */
  let ownProfileUrl = null;
  const byThread = {};
  (rows||[]).forEach(r=>{
    const from = clean(r['FROM']);
    if(!from) return;
    const mineRow = isMe(from);
    (mineRow ? mine : theirs).push(r);
    if(mineRow && !ownProfileUrl){ const u = clean(r['SENDER PROFILE URL']); if(u) ownProfileUrl = u.replace(/\/+$/,''); }
    /* No CONVERSATION ID in some exports - fall back to grouping by the
       other party's name, which is what a thread means in a 1:1 DM export. */
    const key = clean(r['CONVERSATION ID']) || 'name:'+clean(mineRow ? r['TO'] : from).toLowerCase();
    (byThread[key] = byThread[key]||[]).push({...r, _mine: mineRow, _date: msgDate(r['DATE'])});
  });

  const identified = !!me && mine.length > 0;
  const lens = mine.map(r=>clean(r['CONTENT']).length).filter(n=>n>0);
  const samples = identified
    ? mine.map(r=>clean(r['CONTENT'])).filter(t=>t.length>=40 && t.length<=1200).slice(-60)
    : [];

  /* Per-thread aggregates, and the two global "how you show up" pools this
     only makes sense computed once across every thread at once. */
  const counterparts = [];
  const myReplyGaps = [], theirReplyGaps = [];
  let threadsWhereTheyWroteFirst = 0, threadsIStartedWithReply = 0, threadsIStarted = 0, datedThreads = 0;
  /* Best-time-to-send: day-of-week and time-of-day of the first message in
     every thread I opened, split by whether it ever got a reply. Two
     independent single-dimension buckets rather than one 7x4 grid - with a
     few hundred threads at most, a cross-tab would be mostly empty cells
     dressed up as a pattern. Local time of the browser that ran this import,
     same as every other date already read out of the export. */
  const DOW_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const TOD_BUCKETS = [
    {key:'morning',   label:'Morning (5am–noon)',  test:h=>h>=5&&h<12},
    {key:'afternoon', label:'Afternoon (noon–5pm)', test:h=>h>=12&&h<17},
    {key:'evening',   label:'Evening (5–9pm)',      test:h=>h>=17&&h<21},
    {key:'night',     label:'Night (9pm–5am)',      test:h=>h>=21||h<5},
  ];
  const byDow = DOW_NAMES.map(label=>({label, sent:0, replied:0}));
  const byTod = {}; TOD_BUCKETS.forEach(b=>{ byTod[b.key] = {label:b.label, sent:0, replied:0}; });
  if(identified) Object.keys(byThread).forEach(key=>{
    const msgs = byThread[key].filter(m=>m._date).sort((a,b)=>a._date-b._date);
    if(!msgs.length) return;
    datedThreads++;
    const theirMsg = msgs.find(m=>!m._mine);
    const name = clean(theirMsg && theirMsg['FROM']) || 'Unknown';
    const profileUrl = clean(theirMsg && theirMsg['SENDER PROFILE URL']) || null;
    const sentCount = msgs.filter(m=>m._mine).length;
    const receivedCount = msgs.length - sentCount;
    const theyWroteFirst = !msgs[0]._mine;
    if(theyWroteFirst) threadsWhereTheyWroteFirst++;
    else {
      threadsIStarted++;
      if(receivedCount>0) threadsIStartedWithReply++;
      const opened = msgs[0]._date, gotReply = receivedCount>0;
      byDow[opened.getDay()].sent++;
      if(gotReply) byDow[opened.getDay()].replied++;
      const tb = TOD_BUCKETS.find(b=>b.test(opened.getHours()));
      if(tb){ byTod[tb.key].sent++; if(gotReply) byTod[tb.key].replied++; }
    }
    for(let i=1;i<msgs.length;i++){
      if(msgs[i]._mine === msgs[i-1]._mine) continue;
      const gap = msgs[i]._date - msgs[i-1]._date;
      if(gap<0) continue;
      (msgs[i]._mine ? myReplyGaps : theirReplyGaps).push(gap);
    }
    if(sentCount>0 || receivedCount>0) counterparts.push({
      name, profileUrl, msgCount:msgs.length, sentCount, receivedCount,
      firstAt: msgs[0]._date.toISOString(), lastAt: msgs[msgs.length-1]._date.toISOString(),
      theyWroteFirst,
    });
  });
  /* Ranked by the plain tuple the spec calls for - total messages, then span,
     then recency - explained in words wherever it renders, never as a score. */
  counterparts.sort((a,b)=> b.msgCount-a.msgCount
    || (new Date(b.lastAt)-new Date(b.firstAt))-(new Date(a.lastAt)-new Date(a.firstAt))
    || new Date(b.lastAt)-new Date(a.lastAt));

  /* "The sleep" (Decoded chapter 3) needs a per-CONNECTION verdict - never
     messaged, messaged-then-quiet, still active - across the whole 1,928-row
     Connections.csv, not just the top 50 kept for display. So this join runs
     here, against the full counterparts list, before anything gets sliced.
     Matched by profile URL first (LinkedIn's own identifier); by exact
     full-name second, since group DMs and some exports omit SENDER PROFILE
     URL. Coverage of the URL match is tracked so a low-coverage archive can
     say "at least" instead of an exact count - the one rule in the spec. */
  let sleep = null;
  if(identified && connections && connections.length){
    const byUrl = {}, byName = {};
    counterparts.forEach(cp=>{
      if(cp.profileUrl) byUrl[cp.profileUrl.replace(/\/$/,'').toLowerCase()] = cp;
      const nk = cp.name.toLowerCase();
      if(nk && !byName[nk]) byName[nk] = cp;
    });
    let never=0, quiet=0, active=0, urlMatched=0, nameMatched=0;
    const quietDays = [];
    const TWO_YEARS = 2*365*DAY;
    connections.forEach(c=>{
      const urlKey = (c.profile_url||'').replace(/\/$/,'').toLowerCase();
      let cp = urlKey ? byUrl[urlKey] : null;
      const viaUrl = !!cp;
      if(!cp){
        const nameKey = clean((c.first_name||'')+' '+(c.last_name||'')).toLowerCase();
        cp = nameKey ? byName[nameKey] : null;
      }
      if(!cp){ never++; return; }
      if(viaUrl) urlMatched++; else nameMatched++;
      const ageMs = Date.now() - new Date(cp.lastAt).getTime();
      if(ageMs >= TWO_YEARS){ quiet++; quietDays.push(Math.round(ageMs/DAY)); }
      else active++;
    });
    const matchedTotal = urlMatched + nameMatched;
    const urlCoverage = matchedTotal ? urlMatched/matchedTotal : null;
    sleep = {
      total: connections.length, never, quiet, active,
      medianQuietDays: median(quietDays),
      urlCoverage, approx: urlCoverage!=null && urlCoverage<0.6,
    };
  }

  return {
    sent: mine.length,
    received: theirs.length,
    identified,
    medianSentLength: lens.length ? lens.slice().sort((a,b)=>a-b)[Math.floor(lens.length/2)] : 0,
    /* Capped hard. This is a writing sample, not a mail archive, and the raw
       zip is already stored if we ever need more. */
    styleSamples: samples.slice(0, 40).map(t=>t.slice(0, 600)),
    /* Everything below is new, for the Decoded reading. counterparts capped -
       size discipline per the spec, not a real limit on what happened. */
    counterparts: counterparts.slice(0, 50),
    showUp: identified && datedThreads>0 ? {
      totalThreads: datedThreads,
      theyWroteFirstPct: Math.round(threadsWhereTheyWroteFirst/datedThreads*100),
      iWroteFirstCount: threadsIStarted,
      iWroteFirstReplyPct: threadsIStarted>0 ? Math.round(threadsIStartedWithReply/threadsIStarted*100) : null,
      myMedianReplyMs: median(myReplyGaps),
      theirMedianReplyMs: median(theirReplyGaps),
      /* A per-bucket rate only ever reports once that bucket alone has 5+
         opened threads, and a "best" pick only ever surfaces once 20+ threads
         were opened in total - the same "counts only until it's real" rule
         CardApproaches already applies to approach angles, applied here too. */
      sendTiming: (()=>{
        const MIN_BUCKET = 5;
        const rate = b => b.sent>=MIN_BUCKET ? Math.round(b.replied/b.sent*100) : null;
        const byDowRated = byDow.map(b=>({...b, pct:rate(b)}));
        const byTodRated = TOD_BUCKETS.map(b=>({key:b.key, ...byTod[b.key], pct:rate(byTod[b.key])}));
        const enoughData = threadsIStarted>=20;
        const best = list => enoughData ? (list.filter(b=>b.pct!=null).sort((a,b)=>b.pct-a.pct)[0]||null) : null;
        return {enoughData, byDow:byDowRated, byTod:byTodRated, bestDow:best(byDowRated), bestTod:best(byTodRated)};
      })(),
    } : null,
    sleep,
    selfProfileUrl: ownProfileUrl,
  };
}
const liDate = (s)=>{                       // "26 Jul 2026" -> "2026-07-26"
  const m = String(s||'').trim().match(/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})$/);
  if(!m) return null;
  const mi = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec']
    .indexOf(m[2].toLowerCase());
  if(mi < 0) return null;
  return m[3] + '-' + String(mi+1).padStart(2,'0') + '-' + m[1].padStart(2,'0');
};
/* Invitations.csv writes "Sent At" as "9/14/16 2:11 PM" (M/D/YY, not the "26
   Jul 2026" format Connected On uses) - a second parser rather than
   stretching liDate to guess between two genuinely different formats. */
const invDate = (s)=>{
  const m = String(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(!m) return null;
  let yr = parseInt(m[3],10); if(yr<100) yr += yr<70 ? 2000 : 1900;
  const mo = parseInt(m[1],10), day = parseInt(m[2],10);
  if(mo<1||mo>12||day<1||day>31) return null;
  return yr + '-' + String(mo).padStart(2,'0') + '-' + String(day).padStart(2,'0');
};

/* ===================== Your Network, Decoded =====================
   buildDecoded() turns one parsed archive into the seven stored chapters
   (decoded-spec.md's "the eight chapters" minus chapter 8, which is computed
   live from goalTypes + connections_match and never stored). Pure and
   $0.00 - no AI call, every number traceable to a row in the export. Runs
   once at import/reimport time inside Onboarding.finish(); the reading in
   Patterns only ever reads kb.decoded back out, never the raw archive. */
const MONTHS3 = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
/* Positions.csv writes "Started On"/"Finished On" as "Jul 2025". Education's
   Start/End Date format is not confirmed by any real export we have on hand,
   so this tries the same month-year shape first and falls back to a bare
   4-digit year (Jan 1 for a start, Dec 31 for an end) rather than dropping
   the era - a rough era beats no era. */
function eraDateMs(s, endOfYear){
  const m = String(s||'').trim().match(/^([A-Za-z]{3,9})\s+(\d{4})$/);
  if(m){
    const mi = MONTHS3.indexOf(m[1].slice(0,3).toLowerCase());
    if(mi>=0) return Date.UTC(parseInt(m[2],10), mi, 1);
  }
  const y = String(s||'').trim().match(/(\d{4})/);
  if(!y) return null;
  return Date.UTC(parseInt(y[1],10), endOfYear?11:0, endOfYear?31:1);
}
function monthYearLabel(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00Z');
  if(isNaN(d.getTime())) return null;
  return d.toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'});
}
/* One "era" per employer or school, stints at the same place merged into one
   span, so two Stripe titles read as one Stripe era the way a person would
   actually describe it. */
function decodedEraList(positions, education){
  const raw = [];
  (positions||[]).forEach(p=>{
    const start = eraDateMs(p.from, false);
    if(start==null) return;
    const end = p.to ? eraDateMs(p.to, true) : Date.now();
    if(clean(p.company)) raw.push({label:clean(p.company), kind:'work', start, end: end==null?Date.now():end});
  });
  (education||[]).forEach(e=>{
    const start = eraDateMs(e.from, false);
    if(start==null) return;
    const end = e.to ? eraDateMs(e.to, true) : start;
    if(clean(e.school)) raw.push({label:clean(e.school), kind:'school', start, end: end==null?start:end});
  });
  const merged = {};
  raw.forEach(r=>{
    const k = r.kind+':'+r.label.toLowerCase();
    if(!merged[k]) merged[k] = {...r};
    else{ merged[k].start = Math.min(merged[k].start, r.start); merged[k].end = Math.max(merged[k].end, r.end); }
  });
  return Object.values(merged).sort((a,b)=>a.start-b.start);
}
function decodedEraFor(eras, ms){
  const matches = eras.filter(e=>ms>=e.start && ms<=e.end);
  if(!matches.length) return null;
  const work = matches.filter(e=>e.kind==='work');
  const pool = work.length ? work : matches;
  return pool.reduce((a,b)=> b.start>a.start ? b : a);
}

/* Chapter 1 - the opening frame. */
function decodedFrame(connections){
  const dated = connections.map(c=>c.connected_on).filter(Boolean).sort();
  const companies = new Set(connections.map(c=>clean(c.company)).filter(Boolean));
  const positions = new Set(connections.map(c=>clean(c.position)).filter(Boolean));
  const startDate = dated[0] || null;
  return {
    total: connections.length,
    startDate, startLabel: monthYearLabel(startDate),
    companyCount: companies.size, positionCount: positions.size,
  };
}

/* Chapter 2 - the eras, told by who arrived. */
function decodedEras(connections, positions, education){
  const eras = decodedEraList(positions, education);
  const byYear = {}, eraCounts = {};
  let minYear=null, maxYear=null;
  connections.forEach(c=>{
    if(!c.connected_on) return;
    const y = parseInt(c.connected_on.slice(0,4),10);
    if(!y) return;
    byYear[y] = (byYear[y]||0)+1;
    minYear = minYear==null ? y : Math.min(minYear,y);
    maxYear = maxYear==null ? y : Math.max(maxYear,y);
    if(eras.length){
      const era = decodedEraFor(eras, new Date(c.connected_on+'T00:00:00Z').getTime());
      if(era) eraCounts[era.label] = (eraCounts[era.label]||0)+1;
    }
  });
  const years = [];
  if(minYear!=null) for(let y=minYear;y<=maxYear;y++) years.push({year:y, count:byYear[y]||0});
  const nonZero = years.filter(y=>y.count>0);
  const fastestYear = nonZero.length ? nonZero.reduce((a,b)=>b.count>a.count?b:a) : null;
  const quietestYear = nonZero.length ? nonZero.reduce((a,b)=>b.count<a.count?b:a) : null;
  const eraList = Object.keys(eraCounts).map(label=>({label, count:eraCounts[label]}))
    .sort((a,b)=>b.count-a.count);
  return {
    hasEras: eras.length>0, years, fastestYear, quietestYear,
    topEra: eraList[0]||null, eras: eraList.slice(0,6),
  };
}

/* Chapter 5 - the ones who kept showing up. Ranking already happened inside
   messageGraph(); this just takes the top five and phrases the share. */
function decodedCircle(messages){
  if(!messages || !messages.identified || !(messages.counterparts||[]).length) return null;
  const top = messages.counterparts.slice(0,5);
  const topSent = top.reduce((s,c)=>s+c.sentCount,0);
  return {
    top: top.map(c=>({name:c.name, profileUrl:c.profileUrl, msgCount:c.msgCount,
      sentCount:c.sentCount, receivedCount:c.receivedCount, firstAt:c.firstAt, lastAt:c.lastAt})),
    shareOfWordsPct: messages.sent ? Math.round(topSent/messages.sent*100) : null,
  };
}

/* Chapter 6 - the shape of the room. Every label is read straight off a
   title string and says so; nothing here is inferred from outside the
   export (no geography - Connections.csv carries no location column). */
const DECODED_FUNCTIONS = [
  {key:'founder',     words:['founder','co-founder']},
  {key:'engineering', words:['engineer','developer','software','devops','architect','swe']},
  {key:'product',     words:['product manager','product lead','product owner']},
  {key:'design',      words:['designer','design lead',' ux',' ui ']},
  {key:'sales',       words:['sales','account executive','business development']},
  {key:'marketing',   words:['marketing','growth marketing','brand']},
  {key:'investing',   words:['investor','venture partner','venture capital',' vc ','angel investor']},
  {key:'clinical',    words:['clinical','physician',' md ','nurse','pharmacist','regulatory affairs']},
  {key:'operations',  words:['operations','supply chain','logistics']},
  {key:'finance',     words:['finance','accounting','controller','treasury',' cfo']},
  {key:'legal',       words:['legal counsel','attorney','compliance']},
  {key:'talent',      words:['recruiter','talent acquisition','human resources','people ops']},
];
const DECODED_SENIOR_WORDS = ['founder','co-founder','ceo','cto','coo','cfo','chief',
  'partner','vp ','vice president','svp','evp','director','head of'];
function decodedShape(connections, positions){
  if(!connections.length) return null;
  const companyCounts = {};
  connections.forEach(c=>{
    const co = clean(c.company);
    if(!co) return;
    const k = co.toLowerCase();
    (companyCounts[k] = companyCounts[k] || {label:co, count:0}).count++;
  });
  const topCompanies = Object.values(companyCounts).sort((a,b)=>b.count-a.count).slice(0,8);

  const titled = connections.filter(c=>clean(c.position));
  const funcCounts = {};
  titled.forEach(c=>{
    const t = ' '+clean(c.position).toLowerCase()+' ';
    const hit = DECODED_FUNCTIONS.find(f=>f.words.some(w=>t.indexOf(w)>=0));
    if(hit) funcCounts[hit.key] = (funcCounts[hit.key]||0)+1;
  });
  const functions = Object.keys(funcCounts).map(key=>({key, count:funcCounts[key]}))
    .sort((a,b)=>b.count-a.count).slice(0,6);

  const seniorCount = titled.filter(c=>{
    const t = ' '+clean(c.position).toLowerCase()+' ';
    return DECODED_SENIOR_WORDS.some(w=>t.indexOf(w)>=0);
  }).length;

  const ownCompanies = new Set((positions||[]).map(p=>clean(p.company).toLowerCase()).filter(Boolean));
  const alumniCount = ownCompanies.size
    ? connections.filter(c=>ownCompanies.has(clean(c.company).toLowerCase())).length : 0;

  return {
    total: connections.length, topCompanies, functions,
    seniorCount, seniorFraction: connections.length ? seniorCount/connections.length : 0,
    alumniCount,
  };
}

/* "The turn" card needs a per-function dormancy count - of the people who
   hold a title in each function bucket, how many have gone quiet - so the
   live goal can be crossed against real per-connection message recency
   instead of just the all-time aggregate sleep chapter gives. Computed once
   here (goal-agnostic, every function bucket at once) rather than at render
   time, since per-connection message dates only ever exist transiently
   inside this parse - nothing else stores them. Someone never messaged at
   all still counts as dormant (not active), matching "gone quiet" plainly. */
function decodedDormancy(connections, messages){
  const byUrl = {}, byName = {};
  if(messages && messages.identified) (messages.counterparts||[]).forEach(cp=>{
    if(cp.profileUrl) byUrl[cp.profileUrl.replace(/\/$/,'').toLowerCase()] = cp;
    const nk = cp.name.toLowerCase();
    if(nk && !byName[nk]) byName[nk] = cp;
  });
  const TWO_YEARS = 2*365*DAY;
  const byFunction = {};
  connections.forEach(c=>{
    const t = ' '+clean(c.position).toLowerCase()+' ';
    const hit = DECODED_FUNCTIONS.find(f=>f.words.some(w=>t.indexOf(w)>=0));
    if(!hit) return;
    const urlKey = (c.profile_url||'').replace(/\/$/,'').toLowerCase();
    let cp = urlKey ? byUrl[urlKey] : null;
    if(!cp){ const nameKey = clean((c.first_name||'')+' '+(c.last_name||'')).toLowerCase(); cp = nameKey ? byName[nameKey] : null; }
    const isActive = cp && (Date.now()-new Date(cp.lastAt).getTime()) < TWO_YEARS;
    const bucket = byFunction[hit.key] = byFunction[hit.key] || {key:hit.key, total:0, dormant:0, sample:[]};
    bucket.total++;
    if(!isActive){
      bucket.dormant++;
      bucket.sample.push({
        name: clean((c.first_name||'')+' '+(c.last_name||''))||(cp&&cp.name)||'',
        profileUrl: c.profile_url||(cp&&cp.profileUrl)||null,
        company: clean(c.company), position: clean(c.position),
        msgCount: cp ? cp.msgCount : 0,
      });
    }
  });
  Object.values(byFunction).forEach(b=>{ b.sample.sort((x,y)=>y.msgCount-x.msgCount); b.sample = b.sample.slice(0,5); });
  return byFunction;
}

/* "Compared to last year" - the only two comparisons the raw export can back
   without geography or per-year message buckets: how the founder share of
   new connections moved, and how much the network grew. Null (card hidden)
   with under two dated years on file. */
function decodedYoY(connections){
  const years = {};
  connections.forEach(c=>{
    if(!c.connected_on) return;
    const y = parseInt(c.connected_on.slice(0,4),10);
    if(!y) return;
    const t = ' '+clean(c.position).toLowerCase()+' ';
    const bucket = years[y] = years[y] || {year:y, total:0, founders:0};
    bucket.total++;
    if(/\bco-founder\b|\bfounder\b/.test(t)) bucket.founders++;
  });
  const sorted = Object.values(years).sort((a,b)=>b.year-a.year);
  if(sorted.length<2) return null;
  const [cur, prev] = sorted;
  return {
    curYear:cur.year, prevYear:prev.year, curTotal:cur.total, prevTotal:prev.total,
    curYearToDate: cur.year===new Date().getFullYear(),
    curFounderPct: cur.total ? Math.round(cur.founders/cur.total*100) : 0,
    prevFounderPct: prev.total ? Math.round(prev.founders/prev.total*100) : 0,
  };
}

/* Chapter 7 - the doors you knocked on. Acceptance is joined by name against
   Connections.csv, so it is always phrased "at least" - a name match
   undercounts (remarried surnames, nicknames, non-Latin transliteration). */
function decodedDoors(invitations, connections){
  if(!invitations || !(invitations.rows||[]).length) return null;
  const rows = invitations.rows;
  const sent = rows.filter(r=>r.direction==='OUTGOING');
  const nameSet = new Set((connections||[])
    .map(c=>clean((c.first_name||'')+' '+(c.last_name||'')).toLowerCase()).filter(Boolean));
  const accepted = sent.filter(r=>r.to && nameSet.has(r.to.toLowerCase())).length;
  const byYear = {};
  sent.forEach(r=>{ if(r.sentAt){ const y=r.sentAt.slice(0,4); byYear[y]=(byYear[y]||0)+1; } });
  const years = Object.keys(byYear).map(y=>({year:parseInt(y,10), count:byYear[y]})).sort((a,b)=>a.year-b.year);
  const busiestYear = years.length ? years.reduce((a,b)=>b.count>a.count?b:a) : null;
  return {
    sentTotal: invitations.outgoing, receivedTotal: invitations.incoming,
    acceptedAtLeast: accepted,
    acceptancePct: invitations.outgoing ? Math.round(accepted/invitations.outgoing*100) : null,
    busiestYear, years,
  };
}

/* The whole reading, computed once. Null when there is no archive to read at
   all - Patterns shows the single import-prompt card the spec calls for
   rather than seven empty chapters. Individual chapters are null on their
   own narrower gaps (no messages.csv, no positions, no invitations) so each
   one can show its own honest one-liner instead of silently vanishing. */
/* Which companies you actually know people at, for a "you already know N
   people at [company]" lookup when a new person gets saved. Bounded to
   companies with 2+ connections, top 500 by count - the long tail (a single
   connection at some company) would blow this up to a multi-megabyte add on
   something re-saved whole on every settings write, for a hit that's marginal
   anyway. Same size discipline as topCompanies/counterparts/styleSamples
   above, just a bigger cap since this one exists to be looked up by company
   name later, not read top-to-bottom. */
function decodedCompanyIndex(connections){
  if(!connections || !connections.length) return null;
  const byKey = {};
  connections.forEach(c=>{
    const co = clean(c.company);
    if(!co) return;
    const k = co.toLowerCase();
    const entry = byKey[k] = byKey[k] || {label:co, count:0, sample:[]};
    entry.count++;
    if(entry.sample.length<3){
      const name = clean((c.first_name||'')+' '+(c.last_name||''));
      if(name) entry.sample.push({name, profileUrl:c.profile_url||null, title:clean(c.position)});
    }
  });
  return Object.values(byKey).filter(e=>e.count>=2).sort((a,b)=>b.count-a.count).slice(0,500);
}
/* Looks up a target company against the bounded index above. Exact match on
   the cleaned, lowercased name only - the index is already a "the big,
   obvious overlaps" list, not a fuzzy company-resolution engine, and a wrong
   match here would put a stranger's name in front of the user as a warm
   intro, which is worse than no match at all. */
function companyOverlap(companyIndex, companyName){
  const k = clean(companyName).toLowerCase();
  if(!k || !companyIndex) return null;
  return companyIndex.find(e=>e.label.toLowerCase()===k) || null;
}
/* Bridge's "who can introduce you" - the same companyOverlap sample the
   Prepare tab has always shown as one sentence ("worth asking one of them"),
   ranked by real evidence of a relationship rather than left in the order
   the archive happened to list them.

   This is deliberately NOT the multi-hop pathfinding graph the Prism concept
   draws (a scored route through two named intermediaries to the target).
   Mighty only ever has the user's own one-hop connections - never the
   target's - so "Priyanka knows Dana, who is one step from Amrita" is not a
   fact this data can produce; it would be a confident-looking invention,
   exactly the kind of thing this codebase's other AI surfaces are written
   not to do (never invent shared history; label web findings unverified;
   "neither" over a guessed identity match). What real signal exists - who
   the user already knows at the target's company, and how well they
   actually know that person - is what gets shown, ranked, and it says so
   plainly when there is nothing.

   Tie strength is real evidence only, checked in order and stopping at the
   first that matches: LinkedIn DM history (exact profile URL, from the
   archive's own messages.counterparts), then mail (exact full name only -
   mail carries no profile URL to match on, same limitation
   mailConnectionOverlap already has). No messages or mail on file reads as
   "no evidence of a relationship", not zero - the user may know them fine
   in person; Mighty just cannot see it. */
function bridgeIntroducers(companyIndex, companyName, kb){
  const overlap = companyOverlap(companyIndex, companyName);
  if(!overlap) return {overlap:null, candidates:[]};
  const counterparts = (kb.messages && kb.messages.counterparts) || [];
  const byUrl = {};
  counterparts.forEach(c=>{ if(c.profileUrl) byUrl[c.profileUrl.replace(/\/+$/,'').toLowerCase()] = c; });
  const mailByName = {};
  ((kb.mail && kb.mail.correspondents) || []).forEach(c=>{
    const k = clean(c.name).toLowerCase();
    if(k && k.indexOf(' ')>0 && !mailByName[k]) mailByName[k] = c;
  });
  const candidates = overlap.sample.map(s=>{
    const viaLinkedIn = s.profileUrl ? byUrl[s.profileUrl.replace(/\/+$/,'').toLowerCase()] : null;
    const viaMail = !viaLinkedIn ? mailByName[clean(s.name).toLowerCase()] : null;
    const tie = viaLinkedIn
      ? {via:'linkedin', count:viaLinkedIn.msgCount, lastAt:viaLinkedIn.lastAt}
      : viaMail && (viaMail.sent>0 || viaMail.received>0)
      ? {via:'mail', count:viaMail.sent+viaMail.received, lastAt:viaMail.lastAt}
      : null;
    return {...s, tie};
  }).sort((a,b)=> (b.tie?b.tie.count:-1) - (a.tie?a.tie.count:-1));
  return {overlap, candidates};
}
function buildDecoded(archive){
  if(!archive || !(archive.connections||[]).length) return null;
  const messages = archive.messages;
  return {
    computedAt: new Date().toISOString(),
    messagesPresent: !!archive.messagesPresent,
    chapters: {
      frame: decodedFrame(archive.connections),
      eras: decodedEras(archive.connections, archive.positions, archive.education),
      sleep: messages ? messages.sleep : null,
      showUp: messages ? messages.showUp : null,
      circle: decodedCircle(messages),
      shape: decodedShape(archive.connections, archive.positions),
      dormancy: decodedDormancy(archive.connections, messages),
      yoy: decodedYoY(archive.connections),
      doors: decodedDoors(archive.invitations, archive.connections),
      companyIndex: decodedCompanyIndex(archive.connections),
    },
  };
}

/* Read the archive. Returns what it found and what it could not find, because
   "no posts in this export" is information the user should see rather than a
   silently missing section. */
async function readArchive(file){
  if(!window.JSZip) throw new Error('The archive reader did not load. Reload the page and try again.');
  const zip = await window.JSZip.loadAsync(file);
  const find = (name)=>{
    const hit = Object.keys(zip.files).find(k =>
      k.toLowerCase().endsWith(name.toLowerCase()) && !k.includes('__MACOSX'));
    return hit ? zip.files[hit] : null;
  };
  const grab = async (name, mustHave)=>{
    const f = find(name); if(!f) return null;
    return csvObjects(await f.async('string'), mustHave);
  };

  const profile   = await grab('Profile.csv', ['First Name','Headline']);
  const positions = await grab('Positions.csv', ['Company Name','Title']);
  const education = await grab('Education.csv', ['School Name']);
  const skills    = await grab('Skills.csv', ['Name']);
  const langs     = await grab('Languages.csv', ['Name']);
  const honors    = await grab('Honors.csv', ['Title']);
  const pubs      = await grab('Publications.csv', ['Name']);
  const recs      = await grab('Recommendations_Received.csv', ['First Name']);
  const invites   = await grab('Invitations.csv', ['From','Direction']);
  const conns     = await grab('Connections.csv', ['First Name','URL','Connected On']);
  const msgs      = await grab('messages.csv', ['FROM','TO','CONTENT']);

  const p = (profile && profile[0]) || {};
  const pos = (positions || []).map(r => ({
    title: r['Title'], company: r['Company Name'], location: r['Location'] || '',
    from: r['Started On'] || '', to: r['Finished On'] || '',
    description: (r['Description'] || '').slice(0, 900),
  })).filter(x => x.title || x.company);

  const connections = (conns || []).map(r => ({
    profile_url: (r['URL'] || '').trim().replace(/\/$/, ''),
    first_name: r['First Name'], last_name: r['Last Name'],
    company: r['Company'], position: r['Position'],
    connected_on: liDate(r['Connected On']),
  })).filter(c => c.profile_url);

  /* Computed before identity below so identity.profileUrl can read it -
     Profile.csv itself carries no URL column for the account holder, and
     messages.csv's SENDER PROFILE URL on the account holder's own sent rows
     is the one place in the whole archive that reliably has it. */
  const messagesResult = msgs ? messageGraph(msgs, p, connections) : null;

  return {
    identity: {
      firstName: p['First Name'] || '', lastName: p['Last Name'] || '',
      headline: p['Headline'] || '', location: p['Geo Location'] || '',
      industry: p['Industry'] || '', summary: (p['Summary'] || '').slice(0, 2500),
      profileUrl: (messagesResult && messagesResult.selfProfileUrl) || '',
    },
    positions: pos,
    education: (education || []).map(r => ({
      school: r['School Name'], degree: r['Degree Name'] || '',
      from: r['Start Date'] || '', to: r['End Date'] || '',
    })).filter(e => e.school),
    skills: (skills || []).map(r => r['Name']).filter(Boolean),
    languages: (langs || []).map(r => r['Name'] + (r['Proficiency'] ? ' (' + r['Proficiency'] + ')' : '')).filter(Boolean),
    honors: (honors || []).map(r => r['Title']).filter(Boolean),
    publications: (pubs || []).map(r => r['Name']).filter(Boolean),
    recommendationCount: (recs || []).length,
    invitations: {
      total: (invites || []).length,
      incoming: (invites || []).filter(r => (r['Direction'] || '').toUpperCase() === 'INCOMING').length,
      outgoing: (invites || []).filter(r => (r['Direction'] || '').toUpperCase() === 'OUTGOING').length,
      /* For chapter 7 ("the doors you knocked on") - the acceptance estimate
         needs which year and who, not just a total. Capped like everything
         else that goes into kb.decoded. */
      rows: (invites || []).slice(0, 4000).map(r => ({
        from: clean(r['From']), to: clean(r['To']),
        sentAt: invDate(r['Sent At']) || null,
        direction: (r['Direction']||'').toUpperCase(),
      })).filter(r => r.from || r.to),
    },
    connections,
    /* Read, with the consent screen saying so.
       The line is not "do we open this file" - it is whose words we keep. The
       user's own sent messages are the only place their actual writing voice
       exists, and a product that drafts in your voice without ever having seen
       it is guessing. So the sent half is sampled and kept.
       The received half is deliberately not: those are someone else's words,
       written to one person, and they teach Mighty nothing about how the user
       writes. Counting them is enough. */
    messages: messagesResult,
    messagesPresent: !!msgs,
    missing: [
      !find('Shares.csv') && 'your posts',
      !find('Comments.csv') && 'your comments',
      !profile && 'your profile summary',
    ].filter(Boolean),
  };
}

/* ===================== Gmail, via Google Takeout =====================
   Why an mbox upload and not OAuth: the two Gmail scopes that carry anything
   useful (gmail.metadata, gmail.readonly) are both "restricted", which means a
   Google security assessment before the app may serve more than 100 test
   users. A Takeout export needs none of that, runs through the same
   read-it-here-and-keep-only-what-matters shape the LinkedIn import already
   uses, and gives message bodies as well as headers - which metadata scope
   would not have.

   What this is worth that the LinkedIn export is not:
     1. Real relationship strength. LinkedIn says you are connected. Mail says
        you exchanged 14 messages, they replied inside an hour, and it went
        quiet in March.
     2. A second channel. An email address means a draft can be an email, not
        only a LinkedIn DM.
     3. A far bigger voice corpus. styleSamples from LinkedIn top out at a few
        dozen short DMs; a sent-mail folder is usually orders of magnitude more
        of the user actually writing to people who matter.

   Same line on whose words get kept as readArchive draws: the user's own sent
   bodies are sampled, because that is the only place their writing voice
   exists. Received bodies are never decoded at all - only the headers are
   read, to know that an exchange happened and when. */

const FREEMAIL = {'gmail.com':1,'googlemail.com':1,'yahoo.com':1,'yahoo.co.in':1,'hotmail.com':1,
  'outlook.com':1,'live.com':1,'msn.com':1,'icloud.com':1,'me.com':1,'aol.com':1,'protonmail.com':1,
  'proton.me':1,'rediffmail.com':1,'zoho.com':1,'gmx.com':1,'mail.com':1,'yandex.com':1};

/* Gmail treats dots and any +tag in a gmail.com local part as noise, and the
   same human turns up spelled both ways across a decade of mail. Without this
   the same person appears three times in the correspondent list. */
function normEmail(e){
  const s = String(e||'').toLowerCase().trim();
  const at = s.lastIndexOf('@');
  if(at < 1) return '';
  let local = s.slice(0,at), dom = s.slice(at+1);
  local = local.split('+')[0];
  if(dom === 'googlemail.com') dom = 'gmail.com';
  if(dom === 'gmail.com') local = local.replace(/\./g,'');
  return (local && dom) ? local + '@' + dom : '';
}

/* TextDecoder throws RangeError on a label it does not know, and mail headers
   carry plenty it does not ("unknown-8bit", vendor charsets, RFC 2231 language
   tags). Anything unrecognised falls back to utf-8 rather than losing the
   whole message. */
function mimeCharset(cs){
  const c = String(cs||'').toLowerCase().replace(/\*.*$/,'').replace(/^["']|["']$/g,'');
  if(!c || c==='us-ascii' || c==='ascii' || c==='unknown-8bit' || c==='x-unknown') return 'utf-8';
  return c;
}
function decodeBytes(bytes, cs){
  try{ return new TextDecoder(mimeCharset(cs), {fatal:false}).decode(bytes); }
  catch(e){ return new TextDecoder('utf-8', {fatal:false}).decode(bytes); }
}
function bytesFromLatin1(str){
  const out = new Uint8Array(str.length);
  for(let i=0;i<str.length;i++) out[i] = str.charCodeAt(i) & 0xFF;
  return out;
}

/* RFC 2047 encoded words - "=?UTF-8?B?SGVsbG8=?=". Every From and Subject
   header is full of these the moment a name has an accent in it, and leaving
   them raw means storing "=?UTF-8?B?4KSw?=" as somebody's name. */
function decodeMimeWords(s){
  const str = String(s||'');
  if(str.indexOf('=?') < 0) return str;
  return str.replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g, (m, cs, enc, txt)=>{
    try{
      if(enc.toUpperCase()==='B') return decodeBytes(bytesFromLatin1(atob(txt.replace(/\s+/g,''))), cs);
      /* Q encoding: underscore means space, =XX means one byte. */
      const out = [];
      for(let i=0;i<txt.length;i++){
        const c = txt[i];
        if(c === '_') out.push(32);
        else if(c === '=' && /^[0-9A-Fa-f]{2}$/.test(txt.substr(i+1,2))){ out.push(parseInt(txt.substr(i+1,2),16)); i += 2; }
        else out.push(txt.charCodeAt(i) & 0xFF);
      }
      return decodeBytes(new Uint8Array(out), cs);
    }catch(e){ return m; }
  }).replace(/\?=\s+=\?/g,'?==?');
}

function decodeQuotedPrintable(s, cs){
  const text = String(s||'').replace(/=\r?\n/g,'');       // soft line breaks
  const out = [];
  for(let i=0;i<text.length;i++){
    if(text[i]==='=' && /^[0-9A-Fa-f]{2}$/.test(text.substr(i+1,2))){ out.push(parseInt(text.substr(i+1,2),16)); i += 2; }
    else out.push(text.charCodeAt(i) & 0xFF);
  }
  return decodeBytes(new Uint8Array(out), cs);
}
function decodeBase64Text(s, cs){
  try{ return decodeBytes(bytesFromLatin1(atob(String(s||'').replace(/[^A-Za-z0-9+/=]/g,''))), cs); }
  catch(e){ return ''; }
}

/* Unfold first (a header continues for as long as the next line starts with
   whitespace), then split on the first colon. A repeated header keeps the
   first occurrence - none of the headers read here are legitimately plural. */
function parseMailHeaders(raw){
  const h = {};
  const lines = String(raw||'').split(/\r?\n/);
  let cur = null;
  for(let i=0;i<lines.length;i++){
    const ln = lines[i];
    if(/^[ \t]/.test(ln)){ if(cur) h[cur] += ' ' + ln.trim(); continue; }
    const m = ln.match(/^([!-9;-~]+)[ \t]*:[ \t]*(.*)$/);
    if(!m){ cur = null; continue; }
    const k = m[1].toLowerCase();
    if(k in h){ cur = null; continue; }
    h[k] = m[2]; cur = k;
  }
  return h;
}

/* "Ritesh Srivastava" <r@x.com>, r2@y.com  ->  [{name, email}]
   Split by hand rather than on /,/ because a quoted display name ("Srivastava,
   Ritesh") legitimately contains the separator, and splitting first puts half
   a name on one address and half on the next. */
function parseAddresses(s){
  const raw = decodeMimeWords(String(s||''));
  if(!raw) return [];
  const parts = []; let buf = '', inQ = false, depth = 0;
  for(let i=0;i<raw.length;i++){
    const c = raw[i];
    if(c === '"') inQ = !inQ;
    else if(c === '<') depth++;
    else if(c === '>') depth--;
    else if(c === ',' && !inQ && depth <= 0){ parts.push(buf); buf = ''; continue; }
    buf += c;
  }
  if(buf.trim()) parts.push(buf);
  const out = [];
  parts.forEach(p=>{
    const t = p.trim();
    const m = t.match(/^([\s\S]*?)<([^>]+)>\s*$/);
    let name = '', email = '';
    if(m){ name = m[1].trim().replace(/^"([\s\S]*)"$/,'$1').trim(); email = m[2].trim(); }
    else email = t.replace(/^<|>$/g,'').trim();
    email = email.toLowerCase();
    if(!/^[^@\s,]+@[^@\s,]+\.[^@\s,]+$/.test(email)) return;
    /* "Srivastava, Ritesh" is how Outlook writes it. Stored the way a human
       would say it, since this name is what a draft will address them by. */
    if(/^[^,]+,\s*[^,]+$/.test(name) && !/\bltd\b|\binc\b/i.test(name)){
      const bits = name.split(','); name = (bits[1]||'').trim() + ' ' + (bits[0]||'').trim();
    }
    out.push({name: clean(name).slice(0,80), email});
  });
  return out;
}

function stripHtml(s){
  return String(s||'')
    .replace(/<(script|style)[\s\S]*?<\/\1>/gi,' ')
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<\/(p|div|tr|li|h[1-6]|blockquote)>/gi,'\n')
    .replace(/<[^>]+>/g,' ')
    .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<')
    .replace(/&gt;/gi,'>').replace(/&quot;/gi,'"').replace(/&#0?39;/gi,"'").replace(/&#8217;/gi,'’')
    .replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n');
}

/* Walk down to the first text/plain part. Nested multiparts (an alternative
   inside a mixed, which is what most clients send once there is an
   attachment) recurse. text/html is a last resort with the tags stripped,
   because the plain-text alternative is missing often enough to matter and an
   HTML-only mail still carries the words. */
function mimePart(headers, body, depth){
  depth = depth || 0;
  const ct  = String(headers['content-type'] || 'text/plain');
  const cte = String(headers['content-transfer-encoding'] || '').toLowerCase().trim();
  const csM = ct.match(/charset\s*=\s*"?([^";\s]+)"?/i);
  const cs  = csM ? csM[1] : 'utf-8';

  if(/^\s*multipart\//i.test(ct)){
    if(depth >= 4) return {kind:'other', text:''};
    const bm = ct.match(/boundary\s*=\s*"([^"]+)"/i) || ct.match(/boundary\s*=\s*([^";\s]+)/i);
    if(bm){
      const chunks = body.split('--' + bm[1]);
      let html = '';
      for(let i=1;i<chunks.length;i++){
        if(/^--/.test(chunks[i])) break;                     // closing delimiter
        const sub = chunks[i].replace(/^\r?\n/,'');
        const sep = sub.search(/\r?\n\r?\n/);
        if(sep < 0) continue;
        const inner = mimePart(parseMailHeaders(sub.slice(0,sep)), sub.slice(sep).replace(/^\r?\n\r?\n/,''), depth+1);
        if(inner.kind === 'text' && clean(inner.text)) return inner;
        if(inner.kind === 'html' && !html) html = inner.text;
      }
      return {kind:'html', text:html};
    }
  }
  const decoded = cte === 'base64' ? decodeBase64Text(body, cs)
    : cte === 'quoted-printable' ? decodeQuotedPrintable(body, cs)
    : body;
  if(/^\s*text\/html/i.test(ct)) return {kind:'html', text:stripHtml(decoded)};
  if(/^\s*text\//i.test(ct) || !headers['content-type']) return {kind:'text', text:decoded};
  return {kind:'other', text:''};
}

/* What the user actually wrote, with the thread they were replying to and
   their sign-off removed. Without this every sample taken from a reply is
   mostly somebody else's words quoted back, which is worse than having no
   sample: it teaches the draft prompt the wrong voice. */
function ownWords(text){
  let t = String(text||'').replace(/\r/g,'');
  [ /\n[ \t]*On\s[\s\S]{0,160}?\swrote:/,
    /\n[ \t]*-{2,}\s*Original Message\s*-{2,}/i,
    /\n[ \t]*-{2,}\s*Forwarded message\s*-{2,}/i,
    /\n[ \t]*_{10,}/,
    /\nFrom:[ \t]*\S[\s\S]{0,200}?\nSent:[ \t]/i,
    /\n[ \t]*>{1,}[ \t]?\S/,
  ].forEach(re=>{ const m = t.match(re); if(m && m.index > 40) t = t.slice(0, m.index); });
  const sig = t.search(/\n--[ \t]*\n/);
  if(sig > 40) t = t.slice(0, sig);
  t = t.replace(/\n[ \t]*(Sent from my [\w ]+|Get Outlook for \w+)[\s\S]{0,40}$/i,'');
  /* Postgres text and jsonb reject a null byte outright, and it does not throw
     on the way in - it comes back as res.error, which is how a resume upload
     once looked successful and was never actually saved. Stripping C0 controls
     generally closes the class rather than the one byte that got caught. */
  return t.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}

/* Mail addressed to a list is not a relationship. Counting it per recipient
   would put every all-hands alias at the top of "people you actually talk
   to", and the automated half of any inbox outnumbers the human half. */
const NOREPLY = /^(no-?reply|do-?not-?reply|noreply|donotreply|notifications?|notify|alerts?|support|info|admin|billing|receipts?|invoice|news|newsletter|updates?|mailer|postmaster|bounce|automated|robot|jobs-listings|team|hello|contact)([._-]|@|$)/i;
const BULK_HEADERS = ['list-id','list-unsubscribe','precedence','x-campaign-id','x-mailer-id','feedback-id','x-autoreply'];

function mailAccumulator(myEmails){
  const mine = Object.create(null);
  (myEmails||[]).forEach(e=>{ const n = normEmail(e); if(n) mine[n] = 1; });

  const byPerson = Object.create(null), threads = Object.create(null), domains = Object.create(null);
  let samples = [], subjects = [];
  let count=0, sent=0, received=0, skippedBulk=0, labelled=0, dated=0, threadCount=0;
  let firstAt=null, lastAt=null, truncated=false;

  const touch = (addr, dir, t)=>{
    const key = normEmail(addr.email);
    if(!key || mine[key]) return;
    if(NOREPLY.test(key.split('@')[0])) return;
    let r = byPerson[key];
    if(!r) r = byPerson[key] = {email:key, name:'', sent:0, received:0, firstAt:null, lastAt:null};
    /* Keep the fullest spelling seen. Some senders put only a first name on
       some mails and the full name on others. */
    if(addr.name && addr.name.length > r.name.length) r.name = addr.name;
    r[dir]++;
    if(t){ if(!r.firstAt || t < r.firstAt) r.firstAt = t; if(!r.lastAt || t > r.lastAt) r.lastAt = t; }
    const dom = key.split('@')[1];
    if(dom && !FREEMAIL[dom]) domains[dom] = (domains[dom]||0) + 1;
  };

  /* Bodies are decoded lazily and only for messages the user wrote, and only
     when the message is recent enough to survive into the 40 that get kept -
     decoding base64 for 20,000 sent messages to then throw away 19,960 of
     them is minutes of the main thread for nothing. */
  const SAMPLE_POOL = 400;
  let minSampleT = 0;
  const pushSample = (t, body)=>{
    samples.push({t: t || 0, text: body.slice(0,900)});
    if(samples.length >= SAMPLE_POOL * 2){
      samples.sort((a,b)=>a.t-b.t);
      samples = samples.slice(-SAMPLE_POOL);
      minSampleT = samples[0].t;
    }
  };

  function add(raw){
    count++;
    const sep = raw.search(/\r?\n\r?\n/);
    if(sep < 0) return;
    const H = parseMailHeaders(raw.slice(0, sep));

    const labels = String(H['x-gmail-labels'] || '');
    if(labels) labelled++;
    /* Chats, drafts, spam and trash are not correspondence. Drafts especially:
       they would count as messages the user sent that nobody ever received. */
    if(/(^|,)\s*(Chat|Draft|Spam|Trash)\s*(,|$)/i.test(labels)) return;

    const from = parseAddresses(H['from'])[0];
    if(!from) return;
    const to = parseAddresses(H['to']).concat(parseAddresses(H['cc']));

    /* Direction. Takeout stamps X-Gmail-Labels on every message and "Sent" is
       on exactly the ones the account holder wrote, so this is read rather
       than guessed - unlike messageGraph, which has to match a display name
       against LinkedIn's FROM column and keeps nothing at all when it cannot.
       The address check is the fallback for a plain mbox with no labels, and
       also catches mail sent from an alias. */
    const isSent = /(^|,)\s*Sent\s*(,|$)/i.test(labels) || !!mine[normEmail(from.email)];

    if(!isSent){
      const bulk = BULK_HEADERS.some(k=>k in H) || NOREPLY.test(normEmail(from.email).split('@')[0]);
      if(bulk){ skippedBulk++; return; }
    }

    const d = new Date(String(H['date']||'').replace(/\s*\([^)]*\)\s*$/,''));
    const t = isNaN(d.getTime()) ? null : d.getTime();
    if(t){
      dated++;
      if(!firstAt || t < firstAt) firstAt = t;
      if(!lastAt  || t > lastAt)  lastAt  = t;
    }

    const broadcast = to.length > 8;

    if(isSent){
      sent++;
      if(!broadcast) to.forEach(a=>touch(a,'sent',t));
      if(!broadcast && to.length && (samples.length < SAMPLE_POOL || (t||0) > minSampleT)){
        const part = mimePart(H, raw.slice(sep).replace(/^\r?\n\r?\n/,''), 0);
        const body = ownWords(part.text);
        if(body.length >= 60 && body.length <= 1400) pushSample(t, body);
      }
      const s = clean(decodeMimeWords(H['subject']||''));
      if(s && subjects.length < 220 && !/^(re|fwd?)\s*:/i.test(s)) subjects.push(s);
    }else{
      received++;
      if(!broadcast) touch(from,'received',t);
    }

    /* X-GM-THRID is Gmail's own thread id, so threading is exact rather than
       inferred from a normalised subject line. The subject fallback is for a
       non-Takeout mbox. */
    if(t){
      const thr = clean(H['x-gm-thrid'])
        || ('s:' + clean(decodeMimeWords(H['subject']||'')).toLowerCase().replace(/^(re|fwd?)\s*:\s*/i,'').slice(0,90));
      if(thr && thr !== 's:'){
        let th = threads[thr];
        /* Threads is the one accumulator that grows with the size of the
           mailbox rather than with the number of people in it, and a
           half-million-message export would hold a quarter of a million of
           these at once. Past the cap, threads already open keep being
