<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIghTy · Networking copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f2f2; --bg2:#eae9e9; --card:#FFFFFF; --card2:#f8f4f4; --line:color-mix(in srgb, #201e1d 16%, transparent); --line2:color-mix(in srgb, #201e1d 9%, transparent); --inp:#FFFFFF; --chip:#eae7e7;
  --ink:#201e1d; --sub:#444141; --sub2:#605d5d; --mute:#7d7979; --mute2:#9b9797;
  --brand:#ec3013; --brand2:#dd2b0f; --bsoft:#fff2ef;
  --green:#444141; --green2:#201e1d; --gsoft:#eae7e7;
  --terra:#ec3013; --terra2:#ae1800; --tsoft:#fff2ef;
  --amber:#7d7979; --asoft:#eae7e7;
  --fh:'Archivo',system-ui,-apple-system,sans-serif; --fb:'Archivo',system-ui,-apple-system,sans-serif; --fm:ui-monospace,'SF Mono',Menlo,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.08); --shadowL:0 24px 80px rgba(0,0,0,.24);
  --radius:0px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--fb);color:var(--ink);-webkit-font-smoothing:antialiased;background:var(--bg);}
::selection{background:var(--brand);color:#fff;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#DDDAD3;border-radius:99px;}
h1,h2,h3{font-family:var(--fh);letter-spacing:-.015em;margin:0;}
.mono{font-family:var(--fm);}
button{font-family:var(--fb);cursor:pointer;}
input,textarea,select{font-family:var(--fb);color:var(--ink);}
textarea{resize:vertical;}
a{color:var(--brand);text-decoration:none;} a:hover{text-decoration:underline;}

.app{display:flex;height:100vh;overflow:hidden;}
.rail{width:224px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg2);padding:16px 10px 12px;}
.rail-brand{display:flex;align-items:center;gap:8px;padding:4px 10px 18px;}
.rail-logo{width:24px;height:24px;border-radius:0;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;}
.rail-name{font-weight:700;font-size:15px;letter-spacing:-.01em;}
.rail-nav{display:flex;flex-direction:column;gap:2px;}
.rail-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:0;cursor:pointer;color:var(--sub);font-weight:500;font-size:13.5px;}
.rail-item:hover{background:#EFEDE8;}
.rail-item.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow);}
.rail-sp{flex:1;}
.rail-acct{display:flex;align-items:center;gap:9px;padding:12px 10px 4px;margin-top:8px;border-top:1px solid var(--line);}
.rail-avatar{width:28px;height:28px;border-radius:99px;background:var(--bsoft);color:var(--brand2);display:grid;place-items:center;font-weight:600;font-size:11px;flex:none;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:1px solid var(--line);}
.topbar h2{font-size:15px;font-weight:600;}
.content{flex:1;overflow-y:auto;position:relative;}
.page{max-width:1100px;margin:0 auto;padding:28px 30px 60px;}
.page.wide{max-width:1280px;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.pad{padding:20px 22px;}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.ph h2{font-size:17px;} .ph .sub{font-size:12.5px;color:var(--sub);margin-top:3px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}

label.fld{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 6px;}
.inp,textarea.inp,select.inp{width:100%;padding:9px 13px;border-radius:0;border:1px solid rgba(0,0,0,.12);background:var(--inp);font-size:13.5px;outline:none;}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--bsoft);}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:9px 15px;border-radius:0;border:none;background:var(--brand);color:#fff;font-weight:600;font-size:13px;}
.btn:hover{filter:brightness(1.06);} .btn:disabled{opacity:.5;cursor:not-allowed;filter:none;}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid rgba(0,0,0,.13);}
.btn.ghost:hover{background:var(--bg2);}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:0;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:0;background:var(--chip);font-size:11.5px;font-weight:600;color:var(--sub);}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:0;white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:99px;flex:none;display:inline-block;}
.tag{font-family:var(--fm);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);}
.kpi .k{font-size:11.5px;color:var(--sub);font-weight:500;margin-bottom:5px;}
.kpi .v{font-family:var(--fh);font-weight:700;font-size:24px;line-height:1;}
.kpi .v small{font-size:12.5px;color:var(--mute);font-weight:500;font-family:var(--fb);}
.kpi .d{font-size:11.5px;color:var(--mute);margin-top:6px;}

.empty{text-align:center;padding:34px 18px;color:var(--mute);}
.empty .big{font-size:28px;margin-bottom:8px;}

.typing{display:inline-flex;gap:4px;align-items:center;}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:bl 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
@keyframes bl{0%,60%,100%{opacity:.25;}30%{opacity:1;}}

.scorebar{height:8px;border-radius:0;background:var(--chip);overflow:hidden;}
.scorebar i{display:block;height:100%;border-radius:0;background:var(--brand);}

.list{display:flex;flex-direction:column;gap:8px;}
.row{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:0;background:var(--card2);}
.row .grow{flex:1;min-width:0;}
.row .t{font-weight:600;font-size:13.5px;}
.row .m{font-size:12px;color:var(--sub);margin-top:2px;}
.iconbtn{border:1px solid rgba(0,0,0,.1);background:var(--card);border-radius:0;padding:6px 9px;font-size:11.5px;color:var(--sub);}
.iconbtn:hover{background:var(--bg2);color:var(--ink);}
.iconbtn:disabled{opacity:.4;cursor:not-allowed;}
.divider{height:1px;background:var(--line);margin:16px 0;}
.note{font-size:12px;color:var(--sub);line-height:1.5;}
.warnbox{background:var(--tsoft);border:1px solid rgba(236,48,19,.3);border-radius:0;padding:11px 13px;font-size:12.5px;color:var(--terra2);line-height:1.5;}
.okbox{background:var(--gsoft);border:1px solid rgba(32,30,29,.18);border-radius:0;padding:11px 13px;font-size:12.5px;color:var(--green2);line-height:1.5;}
.bluebox{background:var(--bsoft);border:1px solid rgba(236,48,19,.22);border-radius:0;padding:11px 13px;font-size:12.5px;color:var(--brand2);line-height:1.5;}
.foot{text-align:center;font-size:11px;color:var(--mute2);margin:22px 0 4px;line-height:1.6;}
.seg{display:inline-flex;background:var(--chip);border-radius:0;padding:3px;gap:2px;flex-wrap:wrap;}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:0;font-weight:600;font-size:12px;color:var(--sub);}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}

.avatar{border-radius:99px;display:grid;place-items:center;font-weight:600;flex:none;}
.linkurl{font-size:11.5px;color:var(--brand);word-break:break-all;text-decoration:none;}

/* People table */
.ptable{width:100%;border-collapse:collapse;font-size:13px;}
.ptable th{text-align:left;font-size:10.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--card2);}
.ptable td{padding:10px;border-top:1px solid var(--line2);vertical-align:middle;}
.ptable tr.body-row{cursor:pointer;}
.ptable tr.body-row:hover td{background:var(--bg2);}

/* Pipeline */
.pipeline-wrap{flex:1;display:flex;gap:11px;overflow-x:auto;padding-bottom:8px;min-height:0;}
.pcol{width:230px;flex:none;background:var(--bg2);border-radius:0;padding:9px;display:flex;flex-direction:column;gap:8px;max-height:100%;}
.pcol-head{display:flex;align-items:center;gap:7px;padding:2px 4px;}
.pcol-cards{display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:50px;}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:0;padding:11px;cursor:grab;box-shadow:var(--shadow);}
.pcard:hover{border-color:rgba(0,0,0,.16);}
.pcard.drag-over{outline:2px dashed var(--brand);}
.pdrop{border:1.5px dashed rgba(0,0,0,.14);border-radius:0;padding:14px 8px;text-align:center;color:var(--mute2);font-size:11.5px;}

/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(20,18,15,.32);z-index:40;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:92vw;background:var(--card);z-index:41;box-shadow:var(--shadowL);display:flex;flex-direction:column;}
.drawer-tabs{display:flex;border-bottom:1px solid var(--line);margin-top:16px;}
.drawer-tab{padding:9px 2px;margin-right:22px;font-weight:600;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mute);}
.drawer-tab.on{color:var(--ink);border-color:var(--brand);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(20,18,15,.4);z-index:50;display:grid;place-items:center;padding:24px;}
.modal{width:640px;max-width:100%;background:var(--card);border-radius:0;box-shadow:var(--shadowL);display:flex;flex-direction:column;overflow:hidden;}

/* Extension preview */
.browser-frame{border-radius:10px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.3);background:#2b2d30;}
.browser-bar{height:38px;display:flex;align-items:center;gap:7px;padding:0 12px;background:#2b2d30;}
.browser-dot{width:11px;height:11px;border-radius:50%;}
.browser-url{flex:1;height:24px;border-radius:12px;background:#3c3e42;margin-left:10px;display:flex;align-items:center;padding:0 12px;color:#c9c9c9;font-size:11.5px;font-family:var(--fm);}
.browser-body{background:#F4F2EF;min-height:420px;}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script>
  // Classic JSX runtime (React.createElement) — the automatic runtime emits an ES import that fails without a bundler.
  Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] });
</script>
<script type="text/babel" data-presets="react-classic">
const {useState,useEffect,useRef,useMemo} = React;

/* ============================ deployer config ============================
   Filled in ONCE by whoever deploys MIghTy (see SETUP.md) — students never
   see or touch this. Anon keys are safe to ship in client code; row-level
   security is what actually protects the data. */
const SUPABASE_URL = 'https://hplyyywdftnvjajyncvj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_e_oCwuz3Qlko5N3Xl8ZwxA_zQijz_u8';

/* ============================ persistence ============================ */
const DB_KEY = 'mighty_v2'; // synced app data — templates + settings only
const DEFAULT = {
  templates: [
    { id:'starter', name:'Intro — Sloan Fellow', body:"Hi {{firstName}}, I'm an MIT Sloan Fellow exploring {{company}} and would love to hear about your path there. Would you be open to a quick chat?" },
  ],
  settings: {
    sheets: { sheetId:'', tabName:'MIghTy Outreach', lastSyncedAt:null, lastError:null },
    // ---- AI Context Profile — what MIghTy needs to give great advice ----
    goal: '',               // ⭐ what you want to accomplish in the next 6-12 months (the lens for everything)
    networkingReasons: [],  // why you're networking (job, funding, mentors, …)
    targetCompanies: [],
    targetRoles: [],
    homeLocation: '',       // your city — resolves "near me" in Find-people
    targetLocations: [],    // places you're interested in
    schools: [],
    industries: [],
    skills: [],             // extracted from resume; strong match-score terms
    interests: [],          // personal — fuels authentic conversation starters
    networkingStyle: [],    // cold outreach / warm intros / coffee chats / events / email / linkedin
    communicationStyle: '', // how your messages should sound (e.g. warm, concise)
    hardestPart: '',        // the networking problem MIghTy should solve for you
    currentRole: '', currentCompany: '', yearsExperience: '', linkedinUrl: '',
    followUpDays: 7,
    communityOptIn: false,
    onboardedAt: null,      // set once the first-run setup is finished/skipped
  },
};
function shape(d){
  d = d||{};
  const sd = (d.settings||{});
  const arr = (v,def)=>Array.isArray(v)?v:def;
  return { ...JSON.parse(JSON.stringify(DEFAULT)), ...d,
    templates: Array.isArray(d.templates) ? d.templates : DEFAULT.templates,
    settings: { ...DEFAULT.settings, ...sd,
      sheets:{ ...DEFAULT.settings.sheets, ...(sd.sheets||{}) },
      targetCompanies: arr(sd.targetCompanies, DEFAULT.settings.targetCompanies),
      targetRoles: arr(sd.targetRoles, DEFAULT.settings.targetRoles),
      networkingReasons: arr(sd.networkingReasons, []),
      targetLocations: arr(sd.targetLocations, []),
      schools: arr(sd.schools, []),
      industries: arr(sd.industries, []),
      skills: arr(sd.skills, []),
      interests: arr(sd.interests, []),
      networkingStyle: arr(sd.networkingStyle, []) } };
}
function loadDB(){ try{ return shape(JSON.parse(localStorage.getItem(DB_KEY))); }catch(e){ return shape(); } }

const uid = () => Math.random().toString(36).slice(2,10);
const now = () => Date.now();
const fmtDate = ts => new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const rel = ts => { if(!ts) return 'never'; const s=(now()-ts)/1000;
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; };
const MIT_RE = /@([a-z0-9-]+\.)*mit\.edu$/i;

// LinkedIn vanity slugs are usually firstname-lastname-<id>, so when the
// extension couldn't scrape a name we can still show something readable
// instead of the raw URL — never shown once a real name is set.
function nameFromUrl(url){
  const m = (url||'').match(/linkedin\.com\/in\/([^/?#]+)/i);
  if(!m) return '';
  const words = m[1].split('-').filter(w => w && !/\d/.test(w));
  if(!words.length) return '';
  return words.map(w => w[0].toUpperCase()+w.slice(1)).join(' ');
}
function displayName(row){
  return (row.name||'').trim() || nameFromUrl(row.profile_url) || 'Unnamed contact';
}

function weekStartUTC(ts = now()){
  const d = new Date(ts);
  const day = d.getUTCDay();
  const diff = day===0 ? -6 : 1-day;
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()+diff);
}
function contactedThisWeek(log){
  const ws = weekStartUTC();
  return (log||[]).filter(r=>r.contacted_at && new Date(r.contacted_at).getTime()>=ws).length;
}
function addOffset(ts, amount, unit){
  const ms = unit==='weeks' ? 7*864e5 : unit==='months' ? 30*864e5 : 864e5;
  return new Date(ts + (amount||0)*ms).toISOString();
}
function bucketCount(n){
  n = n||0;
  if(n<=0) return '0'; if(n<=2) return '1-2'; if(n<=5) return '3-5'; if(n<=10) return '6-10'; return '10+';
}
function renderTemplate(body, row){
  const firstName = (row.name||'').trim().split(/\s+/)[0] || 'there';
  return (body||'').replaceAll('{{firstName}}', firstName).replaceAll('{{company}}', row.company||'your company');
}

/* ============================ pipeline model ============================ */
const PIPELINE_STAGES = ['prospect','ready_to_contact','contacted','replied','coffee_chat','referral','interview','offer'];
const STAGE_META = {
  prospect:{label:'Prospects', bg:'#f8f4f4', fg:'#7d7979', dot:'#bab6b6'},
  ready_to_contact:{label:'Ready to Contact', bg:'#eae7e7', fg:'#605d5d', dot:'#9b9797'},
  contacted:{label:'Contacted', bg:'#d7d3d3', fg:'#444141', dot:'#7d7979'},
  replied:{label:'Replied', bg:'#fff2ef', fg:'#ae1800', dot:'#ff9783'},
  coffee_chat:{label:'Coffee Chat', bg:'#ffe0d9', fg:'#ae1800', dot:'#ff563c'},
  referral:{label:'Referral', bg:'#ffc4b8', fg:'#7c1405', dot:'#dd2b0f'},
  interview:{label:'Interview', bg:'#444141', fg:'#f8f4f4', dot:'#ec3013'},
  offer:{label:'Offer', bg:'#ec3013', fg:'#fff2ef', dot:'#fff2ef'},
  do_not_contact:{label:'Do Not Contact', bg:'#eae7e7', fg:'#bab6b6', dot:'#d7d3d3'},
};
const PRIORITY_META = { high:{label:'High', dot:'#ec3013'}, medium:{label:'Medium', dot:'#7d7979'}, low:{label:'Low', dot:'#bab6b6'} };
const AVATAR_PALETTE = [['#eae7e7','#444141'],['#d7d3d3','#2d2b2b'],['#f8f4f4','#605d5d'],['#ffe0d9','#ae1800'],['#eae7e7','#7c1405'],['#d7d3d3','#444141']];
function avatarFor(row){
  const [bg,fg] = AVATAR_PALETTE[(row.id||0)%6];
  const init = displayName(row).trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return {bg,fg,init};
}

// Transparent, client-side relevance scoring for ranking who to contact next —
// every term is explainable, nothing is a fabricated probability.
// Meaningful keywords from the user's free-text goal — drops stopwords/short
// words so "break into climate VC in Europe" → ["climate","europe"] (VC too
// short is kept via the whitelist). Used to score goal-relevance transparently.
const GOAL_STOPWORDS = new Set(['the','a','an','to','in','into','at','for','of','and','or','with','on','my','me','get','got','want','looking','look','find','people','person','someone','who','that','this','break','move','role','job','work','working','company','companies','around','near','new']);
function goalKeywords(goal){
  return [...new Set((goal||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/)
    .filter(w=>w && !GOAL_STOPWORDS.has(w) && (w.length>=3 || ['vc','ai','pm','ux','hr'].includes(w))))].slice(0,8);
}
// The terms the match score looks for in a person — drawn from the whole context
// profile (goal + roles + industries + schools), not just the goal sentence.
function profileKeywords(settings){
  const s = settings||{};
  const extra = [...(s.targetRoles||[]), ...(s.industries||[]), ...(s.schools||[]), ...(s.skills||[])]
    .join(' ').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/)
    .filter(w=>w && !GOAL_STOPWORDS.has(w) && (w.length>=3 || ['vc','ai','pm','ux','hr'].includes(w)));
  return [...new Set([...goalKeywords(s.goal), ...extra])].slice(0,14);
}
// Compact profile summary injected into AI prompts so drafts + advice reflect
// who the student is and what they're going for.
function profileContext(settings){
  const s = settings||{}; const bits = [];
  if(s.goal) bits.push(`The student's goal (next 6-12 months): ${s.goal}`);
  if((s.networkingReasons||[]).length) bits.push(`They're networking to: ${s.networkingReasons.join(', ')}`);
  if((s.targetCompanies||[]).length) bits.push(`Target companies: ${s.targetCompanies.join(', ')}`);
  if((s.targetRoles||[]).length) bits.push(`Target roles: ${s.targetRoles.join(', ')}`);
  if(s.communicationStyle) bits.push(`Their messages should sound: ${s.communicationStyle}`);
  if((s.networkingStyle||[]).length) bits.push(`Preferred networking style: ${s.networkingStyle.join(', ')}`);
  return bits.length ? 'About the student:\n'+bits.join('\n') : '';
}
function computeScore(row, targetCompanies, terms){
  const reasons = []; let score = 0;
  const ctx = row.context || {};
  if(row.company && (targetCompanies||[]).some(c=>c.trim().toLowerCase()===row.company.trim().toLowerCase())){
    score += 40; reasons.push(`Target company: ${row.company}`);
  }
  // Goal relevance — does this person's title/company/profile match what you're
  // trying to achieve? Transparent keyword match, never a black-box AI number.
  const kws = Array.isArray(terms) ? terms : goalKeywords(terms);
  if(kws.length){
    const hay = `${row.title||''} ${row.company||''} ${ctx.aboutText||''} ${ctx.experienceText||''} ${ctx.educationText||''}`.toLowerCase();
    const hits = kws.filter(k=>hay.includes(k));
    if(hits.length){ score += Math.min(30, 12*hits.length); reasons.push(`Fits your goal: ${hits.slice(0,3).join(', ')}`); }
  }
  const mutualMatch = (ctx.mutualConnectionsRaw||'').match(/(\d+)\s*mutual/i);
  if(mutualMatch){
    const n = Math.min(parseInt(mutualMatch[1],10)||0, 3);
    if(n>0){ score += 15*(n/3); reasons.push(`${mutualMatch[1]} mutual connection${mutualMatch[1]==='1'?'':'s'}`); }
  }
  if(/sloan|\bmit\b/i.test(`${ctx.educationText||''} ${ctx.aboutText||''}`)){ score += 15; reasons.push('MIT / Sloan connection'); }
  if(row.priority==='high'){ score += 10; reasons.push('High priority'); }
  const daysAgo = Math.max(0, (now()-new Date(row.shortlisted_at).getTime())/864e5);
  const recency = Math.max(0, 1-daysAgo/30);
  score += 10*recency;
  if(daysAgo<3) reasons.push(`Added ${daysAgo<1?'today':Math.round(daysAgo)+'d ago'}`);
  if(row.context){ score += 10; reasons.push('Profile context captured'); }
  return { score: Math.round(score), reasons: reasons.slice(0,4) };
}

// Honest relationship strength — recency decay + interaction count + reciprocity.
function computeStrength(row, rowEvents){
  const ts = [row.contacted_at, row.shortlisted_at, ...rowEvents.map(e=>e.occurred_at)].filter(Boolean).map(t=>new Date(t).getTime());
  const lastContact = ts.length ? Math.max(...ts) : null;
  const daysSince = lastContact!=null ? Math.max(0,(now()-lastContact)/864e5) : null;
  const recency = lastContact!=null ? Math.pow(0.5, daysSince/45) : 0;
  const interactionScore = Math.min(rowEvents.length,6)/6;
  const reciprocated = row.status!=='prospect' && row.status!=='ready_to_contact' && row.status!=='contacted' || rowEvents.some(e=>e.event_type==='reply');
  const score = 50*recency + 30*interactionScore + (reciprocated?20:0);
  const pips = Math.max(0, Math.min(5, Math.round(score/20)));
  const reasons = [lastContact!=null?`Last spoke ${Math.round(daysSince)}d ago`:'No contact yet',
    `${rowEvents.length} interaction${rowEvents.length===1?'':'s'}`, ...(reciprocated?['They replied']:[])];
  return { score, pips, reasons };
}

// Single "what's next" label per contact — feeds Dashboard priorities, People's
// Next-action column, and the Drawer callout. Nothing fabricated: every branch
// is a plain rule over real status/timing data.
function suggestedNextAction(row, rowEvents, followUpDays){
  followUpDays = followUpDays||7;
  switch(row.status){
    case 'prospect': case 'ready_to_contact':
      return { label:'Message for the first time', urgent:false, action:'contact' };
    case 'contacted': {
      const replied = rowEvents.some(e=>e.event_type==='reply');
      if(replied) return { label:'Propose a coffee chat', urgent:false, action:'coffee' };
      const days = row.contacted_at ? Math.round((now()-new Date(row.contacted_at).getTime())/864e5) : 0;
      if(days > followUpDays) return { label:`Follow up — no reply in ${days}d`, urgent:true, action:'followup' };
      return { label:'Waiting for reply', urgent:false, action:null };
    }
    case 'replied':
      return { label:'Propose a coffee chat', urgent:false, action:'coffee' };
    case 'coffee_chat': {
      const chats = rowEvents.filter(e=>e.event_type==='coffee_chat').sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at));
      const last = chats[0];
      if(last?.suggested_next_touch && new Date(last.suggested_next_touch).getTime()<now())
        return { label:'Send a thank-you / next touch', urgent:true, action:'thanks' };
      return { label:'Send a thank-you note', urgent:false, action:'thanks' };
    }
    case 'referral': return { label:'Check in on referral status', urgent:false, action:null };
    case 'interview': return { label:'Prep for interview / check in', urgent:false, action:null };
    case 'offer': return { label:'Say thank you', urgent:false, action:'thanks' };
    default: return null;
  }
}

/* ============================ AI layer — shared backend proxy ============================
   Every student's AI calls route through the ai-proxy Edge Function, authenticated
   by their own Supabase session — no one ever sees or manages an API key.
   Running as a Claude artifact (window.claude.complete) is the one exception,
   used for the builder's own testing, not the deployed student experience. */
const inArtifact = () => typeof window!=='undefined' && window.claude && typeof window.claude.complete==='function';
function llmMode(sb, auth){ if(inArtifact()) return 'artifact'; if(sb && auth && auth.status==='in') return 'proxy'; return 'none'; }
// `feature` names the workload (draft_message, profile_briefing, coffee_extract,
// daily_plan, …) — the AI Gateway routes it to the right model, caches it, and
// bills it against the budgets. See edge-ai-proxy.ts FEATURES for the registry.
async function llm(sb, auth, feature, system, user, maxTokens=700){
  if(inArtifact()) return await window.claude.complete(`${system}\n\n———\n${user}`);
  if(!sb || !auth || auth.status!=='in') throw new Error('Sign in to use AI features.');
  const {data,error} = await sb.functions.invoke('ai-proxy', {body:{feature,system,user,maxTokens}});
  if(error) throw error;
  if(!data || data.ok===false) throw new Error((data&&(data.message||data.error))||'AI request failed.');
  return data.text;
}
async function llmJSON(sb, auth, feature, system, user, maxTokens=900){
  const text = await llm(sb, auth, feature, system+'\n\nRespond with ONLY valid JSON, no prose, no markdown fences.', user, maxTokens);
  return JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}')+1));
}

function App(){
  const [db,setDb] = useState(loadDB);

  const [draftFor,setDraftFor] = useState(null); // row id, or null
  const lastSync = useRef(null);
  const saveTimer = useRef(null);

  const patch = (slice, val) => setDb(d=>({...d,[slice]: typeof val==='function'? val(d[slice]):{...d[slice],...val}}));

  useEffect(()=>{
    if(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase){
      try{ setSb(window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)); }catch(e){ setSb(null); }
    }
  },[]);

  useEffect(()=>{
    if(!sb){ setAuth({status:'unconfigured',user:null}); return; }
    let sub;
    const onUser = (u)=>{ setAuth({status:u?'in':'out', user:u}); if(u) pull(sb,u); else { setLog([]); setEvents([]); setTasks([]); } };
    sb.auth.getSession().then(({data})=>onUser(data.session?.user||null));
    const r = sb.auth.onAuthStateChange((_e,session)=>onUser(session?.user||null));
    sub = r.data?.subscription;
    return ()=>{ sub&&sub.unsubscribe(); };
  },[sb]);

  useEffect(()=>{
    if(!sb) { setCommunityStats([]); return; }
    sb.from('community_stats').select('*').order('outreach_count',{ascending:false}).then(({data})=>setCommunityStats(data||[]),()=>{});
  },[sb]);

  async function pull(client, u){
    try{
      const {data} = await client.from('user_data').select('data').eq('user_id',u.id).maybeSingle();
      if(data && data.data){ const s=shape(data.data); lastSync.current=JSON.stringify(s); setDb(s); }
      else { const s=loadDB(); lastSync.current=JSON.stringify(s);
        await client.from('user_data').upsert({user_id:u.id, data:s, updated_at:new Date().toISOString()}); }
    }catch(e){}
    await ingest(client,u);
    await refreshLog(client,u);
    await refreshEvents(client,u);
    await refreshTasks(client,u);
  }
  async function refreshLog(client,u){ try{ const {data} = await client.from('outreach_log').select('*').eq('user_id',u.id).order('updated_at',{ascending:false}); setLog(data||[]); }catch(e){} }
  async function refreshEvents(client,u){ try{ const {data} = await client.from('outreach_events').select('*').eq('user_id',u.id).order('occurred_at',{ascending:true}); setEvents(data||[]); }catch(e){} }
  async function refreshTasks(client,u){ try{ const {data} = await client.from('tasks').select('*').eq('user_id',u.id).order('created_at',{ascending:false}); setTasks(data||[]); }catch(e){} }

  // Drain whatever the extension pushed. profile_context is discarded unless a
  // matching row already exists — the privacy boundary: nothing is retained
  // for a profile the student didn't deliberately shortlist.
  async function ingest(client, u){
    try{
      const {data,error} = await client.from('outreach_inbox').select('id,kind,payload').eq('user_id',u.id).order('created_at',{ascending:true});
      if(error || !data || !data.length) return 0;
      const consumed=[];
      for(const row of data){
        const p = row.payload || {};
        if(!p.profileUrl){ consumed.push(row.id); continue; }
        try{
          if(row.kind==='sent_confirmation'){
            const {data:existing} = await client.from('outreach_log').select('id,status').eq('user_id',u.id).eq('profile_url',p.profileUrl).maybeSingle();
            const nowIso = new Date().toISOString();
            if(existing){
              await client.from('outreach_log').update({status:'contacted', contacted_at:nowIso, updated_at:nowIso}).eq('id',existing.id);
              await client.from('outreach_events').insert({user_id:u.id, log_id:existing.id, event_type:'stage_change', note:`Moved from ${existing.status} to contacted`, extracted:{from:existing.status,to:'contacted'}});
            } else {
              await client.from('outreach_log').upsert({user_id:u.id, profile_url:p.profileUrl, status:'contacted', contacted_at:nowIso, updated_at:nowIso}, {onConflict:'user_id,profile_url'});
            }
          } else if(row.kind==='profile_context'){
            const {data:existing} = await client.from('outreach_log').select('id').eq('user_id',u.id).eq('profile_url',p.profileUrl).maybeSingle();
            if(existing){
              await client.from('outreach_log').update({
                context: { aboutText:p.aboutText||'', experienceText:p.experienceText||'', educationText:p.educationText||'', mutualConnectionsRaw:p.mutualConnectionsRaw||'', capturedAt:new Date().toISOString() },
                updated_at:new Date().toISOString(),
              }).eq('id', existing.id);
            }
          } else {
            await client.from('outreach_log').upsert({
              user_id:u.id, profile_url:p.profileUrl, name:p.name||null, title:p.title||null, company:p.company||null, avatar_url:p.avatarUrl||null, updated_at:new Date().toISOString(),
            }, {onConflict:'user_id,profile_url'});
          }
          consumed.push(row.id);
        }catch(e){ /* likely the weekly-cap trigger — leave unconsumed, retried next ingest */ }
      }
      if(consumed.length) await client.from('outreach_inbox').delete().in('id', consumed);
      return consumed.length;
    }catch(e){ return 0; }
  }
  const doIngest = async () => { if(auth.status==='in' && sb){ await ingest(sb, auth.user); await refreshLog(sb, auth.user); } };

  async function updateRow(row, fields){
    if(!sb || auth.status!=='in') return {ok:false, error:'Not signed in'};
    try{ await sb.from('outreach_log').update({...fields, updated_at:new Date().toISOString()}).eq('id',row.id); await refreshLog(sb, auth.user); return {ok:true}; }
    catch(e){ return {ok:false, error:e.message||String(e)}; }

  // Import people discovered via web search straight into the pipeline as
  // prospects (upsert, so re-importing someone is a no-op). RLS scopes to the user.
  async function addPeople(people){
    if(!sb || auth.status!=='in' || !people || !people.length) return {added:0};
    let added=0;
    for(const p of people){
      try{
        await sb.from('outreach_log').upsert({ user_id:auth.user.id, profile_url:p.profileUrl, name:p.name||null, title:p.title||null, company:p.company||null, updated_at:new Date().toISOString() }, {onConflict:'user_id,profile_url'});
        added++;
      }catch(e){ /* likely the weekly-cap trigger or a dup — skip */ }
    }
    await refreshLog(sb, auth.user);
    return {added};
  }
  async function logEvent(row, eventType, note, extra={}){
    if(!sb || auth.status!=='in') return {ok:false, error:'Not signed in'};
    try{
      await sb.from('outreach_events').insert({user_id:auth.user.id, log_id:row.id, event_type:eventType, note:note||null, ...extra});
      if(eventType==='reply') await updateRow(row, {status:'replied'});
      await refreshEvents(sb, auth.user);
      return {ok:true};
    }catch(e){ return {ok:false, error:e.message||String(e)}; }
  }
  async function changeStage(row, toStatus){
    const fields = {status:toStatus};
    if(toStatus==='contacted' && !row.contacted_at) fields.contacted_at = new Date().toISOString();
    const r = await updateRow(row, fields);
    if(r.ok) await logEvent(row, 'stage_change', `Moved from ${row.status} to ${toStatus}`, {extracted:{from:row.status,to:toStatus}});
    return r;
  }
  async function addTask(label, due_date, log_id){
    if(!sb || auth.status!=='in') return;
    await sb.from('tasks').insert({user_id:auth.user.id, label, due_date:due_date||null, log_id:log_id||null});
    await refreshTasks(sb, auth.user);
  }
  async function toggleTask(t){
    if(!sb || auth.status!=='in') return;
    await sb.from('tasks').update({done:!t.done, completed_at: !t.done? new Date().toISOString(): null}).eq('id',t.id);
    await refreshTasks(sb, auth.user);
  }
  async function deleteTask(t){
    if(!sb || auth.status!=='in') return;
    await sb.from('tasks').delete().eq('id',t.id);
    await refreshTasks(sb, auth.user);
  }

  useEffect(()=>{
    const s = JSON.stringify(db);
    localStorage.setItem(DB_KEY, s);
    if(auth.status==='in' && sb && s!==lastSync.current){
      lastSync.current = s;

  async function signOut(){ if(sb){ await sb.auth.signOut(); } window.location.href = '../'; }

  const RAIL = [
    ['dashboard','⬜','Dashboard'],['people','◔','People'],['pipeline','▤','Pipeline'],
    ['tasks','☑','Tasks'],['insights','▲','Insights'],['settings','⚙','Settings'],

  const TITLES = {dashboard:'Dashboard',people:'People',pipeline:'Pipeline',tasks:'Tasks',insights:'Insights',settings:'Settings',templates:'Templates',extpreview:'Extension preview'};
  const drawerRow = drawerId!=null ? log.find(r=>r.id===drawerId) : null;
  const draftRow = draftFor!=null ? log.find(r=>r.id===draftFor) : null;

  if(auth.status==='loading') return <div style={{display:'grid',placeItems:'center',height:'100vh'}}><div className="empty"><div className="big">⏳</div>Loading…</div></div>;
  if(auth.status==='unconfigured') return <div style={{display:'grid',placeItems:'center',height:'100vh',padding:24}}>
    <div className="panel pad" style={{maxWidth:420,textAlign:'center'}}><h2>MIghTy isn't set up yet</h2>
      <p className="note" style={{marginTop:10}}>The deployer needs to add a Supabase project URL + anon key to <span className="mono">index.html</span> — see SETUP.md.</p></div></div>;
  if(auth.status!=='in') return <Gate sb={sb}/>;

/* ============================ Login gate ============================ */
function Gate({sb}){
  const [mode,setMode]=useState('in');
  const [email,setEmail]=useState(''); const [pw,setPw]=useState('');
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState(null); const [err,setErr]=useState(null);
  async function go(){
    setErr(null); setMsg(null);
    if(!MIT_RE.test(email.trim())){ setErr('Use your @mit.edu email address.'); return; }
    setBusy(true);
    try{
      if(mode==='up'){
        const {error}=await sb.auth.signUp({email:email.trim(),password:pw});
        if(error) throw error;
        setMsg('Account created. Check your @mit.edu inbox for a confirmation link, then sign in.'); setMode('in');
      } else if(mode==='in'){
        const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
        if(error) throw error;
      } else {
        const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.href});
        if(error) throw error; setMsg('Password reset link sent to your inbox.');
      }
    }catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  return <div style={{display:'grid',placeItems:'center',height:'100vh',background:'var(--bg)',padding:24}}>
    <div className="panel pad" style={{width:400,maxWidth:'100%'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16}}>
        <img src="../assets/logo-icon.png" alt="" style={{width:24,height:24,display:'block'}}/><div style={{fontWeight:700,fontSize:17}}>MIghTy</div>
      </div>
      <h2 style={{fontSize:18,marginBottom:4}}>{mode==='up'?'Create account':mode==='reset'?'Reset password':'Sign in'}</h2>
      <div className="note" style={{marginBottom:14}}>Your MIT Sloan Fellows networking copilot. Sign in with your <span className="mono">@mit.edu</span> email.</div>
      <label className="fld">MIT email</label>
      <input className="inp" value={email} onChange={e=>setEmail(e.target.value)} placeholder="kerberos@mit.edu" autoFocus/>
      {mode!=='reset' && <><div style={{height:10}}/><label className="fld">Password</label>
        <input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')go();}} placeholder="••••••••"/></>}
      <div style={{marginTop:16}}><button className="btn" style={{width:'100%'}} onClick={go} disabled={busy}>
        {busy?<Dots/>:mode==='up'?'Create account':mode==='reset'?'Send reset link':'Sign in'}</button></div>
      {msg && <div className="okbox" style={{marginTop:12}}>{msg}</div>}
      {err && <div className="warnbox" style={{marginTop:12}}>{err}</div>}
      <div className="divider"/>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5}}>
        {mode==='in' ? <><a style={{cursor:'pointer'}} onClick={()=>setMode('up')}>Create account</a><a style={{cursor:'pointer'}} onClick={()=>setMode('reset')}>Forgot password?</a></>
          : <a style={{cursor:'pointer'}} onClick={()=>setMode('in')}>← Back to sign in</a>}
      </div>
    </div>
  </div>;
}

    <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
      {options.map(o=>{ const on=(value||[]).includes(o); return <span key={o} onClick={()=>toggle(o)} style={{cursor:'pointer',padding:'7px 12px',fontSize:12.5,fontWeight:600,background:on?'var(--brand)':'var(--card)',color:on?'#fff':'var(--sub)',border:'1px solid '+(on?'var(--brand)':'var(--line)')}}>{on?'✓ ':''}{o}</span>; })}
    </div>
  </div>;
}
function RadioSelect({label, options, value, onChange}){
  return <div>
    {label && <label className="fld">{label}</label>}
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      {options.map(o=>{ const on=value===o; return <div key={o} onClick={()=>onChange(o)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',border:'1px solid '+(on?'var(--brand)':'var(--line)'),background:on?'var(--bsoft)':'var(--card2)',cursor:'pointer'}}>

        <span style={{fontSize:13.5,fontWeight:on?600:400}}>{o}</span></div>; })}

  </div>;
}
function ChipInput({label, hint, placeholder, value, onChange, suggestions}){
  const [text,setText]=useState('');
  const add=(v)=>{ v=(v||'').trim(); if(!v) return; if(!value.some(x=>x.toLowerCase()===v.toLowerCase())) onChange([...value,v]); setText(''); };
  const remove=(v)=>onChange(value.filter(x=>x!==v));
  return <div>
    <label className="fld">{label}</label>
    {hint && <div className="note" style={{margin:'-2px 0 8px'}}>{hint}</div>}
    <div style={{display:'flex',gap:8}}>
      <input className="inp" value={text} placeholder={placeholder}
        onChange={e=>setText(e.target.value)}
        onKeyDown={e=>{ if(e.key==='Enter'){e.preventDefault(); add(text);} if(e.key==='Backspace'&&!text&&value.length) remove(value[value.length-1]); }}/>
      <button className="btn ghost" type="button" onClick={()=>add(text)}>Add</button>
    </div>
    {value.length>0 && <div style={{display:'flex',flexWrap:'wrap',gap:7,marginTop:10}}>
      {value.map(v=><span key={v} className="chip" style={{gap:7}}>{v}<span onClick={()=>remove(v)} style={{cursor:'pointer',fontWeight:700,color:'var(--mute)'}}>✕</span></span>)}
    </div>}
    {suggestions && suggestions.length>0 && <div style={{marginTop:10}}>
      <div className="tag" style={{marginBottom:6}}>Popular</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
        {suggestions.filter(s=>!value.some(x=>x.toLowerCase()===s.toLowerCase())).map(s=>
          <span key={s} onClick={()=>add(s)} className="chip" style={{cursor:'pointer',background:'var(--card)',border:'1px solid var(--line)'}}>+ {s}</span>)}
      </div>
    </div>}
  </div>;
}

/* ============================ Daily Copilot ============================
   The "if I had 30 minutes today, what should I do?" feature. Reasons only over
   the student's real pipeline (never invents), routed through the AI Gateway's
   daily_plan feature (Sonnet, cached, budget-governed). We assemble a compact,
   factual digest client-side — SQL/JS does the counting; Claude does the
   prioritising (Rule #1: AI thinks, it doesn't calculate). */
function buildDailyDigest(log, events, tasks, settings){
  const followUpDays = settings.followUpDays||7;
  const repliedIds = new Set(events.filter(e=>e.event_type==='reply').map(e=>e.log_id));
  const lines = [];
  const push = (h, arr) => { if(arr.length) lines.push(`${h}: ${arr.slice(0,8).join('; ')}`); };
  const nm = r => `${displayName(r)}${r.company?` (${r.company})`:''}`;

  const waitingReply = log.filter(r=>r.status==='contacted' && !repliedIds.has(r.id) && r.contacted_at)
    .map(r=>({r, days:Math.round((now()-new Date(r.contacted_at).getTime())/864e5)}));
  push('Overdue follow-ups (no reply)', waitingReply.filter(x=>x.days>followUpDays).map(x=>`${nm(x.r)} ${x.days}d`));
  push('Recently contacted, still waiting', waitingReply.filter(x=>x.days<=followUpDays).map(x=>`${nm(x.r)} ${x.days}d`));
  push('Replied — propose a coffee chat', log.filter(r=>r.status==='replied').map(nm));
  push('Coffee chat done — send thanks / next touch', log.filter(r=>r.status==='coffee_chat').map(nm));
  push('Referral / interview in progress', log.filter(r=>r.status==='referral'||r.status==='interview').map(r=>`${nm(r)} [${r.status}]`));
  const fresh = log.filter(r=>r.status==='prospect'||r.status==='ready_to_contact')
    .map(r=>({r, ...computeScore(r, settings.targetCompanies, profileKeywords(settings))})).sort((a,b)=>b.score-a.score);
  push('Top new people to message first', fresh.slice(0,6).map(x=>`${nm(x.r)} score ${x.score}`));
  const todayStr = new Date().toISOString().slice(0,10);
  push('Tasks due', (tasks||[]).filter(t=>!t.done && t.due_date && t.due_date<=todayStr).map(t=>t.label));
  if((settings.targetCompanies||[]).length) lines.push(`Target companies: ${settings.targetCompanies.join(', ')}`);
  if((settings.targetRoles||[]).length) lines.push(`Target roles: ${settings.targetRoles.join(', ')}`);
  return lines.join('\n');
}
function DailyCopilot({db, log, events, tasks, sb, auth, setDrawerId}){
  const [plan,setPlan]=useState(null); const [busy,setBusy]=useState(false); const [err,setErr]=useState(null);
  const mode = llmMode(sb,auth);
  const digest = buildDailyDigest(log, events, tasks, db.settings);
  const hasWork = digest.trim().length>0 && log.length>0;
  async function generate(){
    setBusy(true); setErr(null);
    try{
      const pctx = profileContext(db.settings);
      const r = await llmJSON(sb, auth, 'daily_plan',
        `You are MIghTy's daily networking copilot for an MIT Sloan Fellows MBA student. Given their real outreach pipeline below, recommend the best use of about 30 minutes today. Use ONLY the people and facts provided — never invent anyone. Prioritise time-sensitive, high-leverage moves (overdue follow-ups, replies waiting, coffee-chat thank-yous, warm high-score intros) AND moves that advance the student's stated goal. Be specific and concise.`,
        `${pctx?pctx+'\n\n':''}Pipeline:\n${digest}\n\nReturn JSON: {"headline": string (one short motivating line, reference the goal if relevant), "actions": [{"title": string (imperative, <8 words), "who": string (person name or "—"), "why": string (<15 words, tie to the goal when it applies), "minutes": number}]}. 3 to 4 actions, ordered by priority, total ~30 minutes.`,
        900);
      setPlan(r);
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(false);
  }
  const findRow = who => log.find(r=>who && displayName(r).toLowerCase()===String(who).toLowerCase().replace(/\s*\(.*\)$/,'').trim());

  return <div className="panel pad" style={{background:'var(--ink)',color:'#fff',border:'none'}}>
    <div style={{display:'flex',alignItems:'center',gap:10}}>
      <div style={{fontWeight:700,fontSize:15}}>⚡ Your 30 minutes today</div>
      <div style={{flex:1}}/>
      {mode!=='none' && <button className="btn sm" onClick={generate} disabled={busy||!hasWork}
        style={{background:'#fff',color:'var(--ink)'}}>{busy?'Thinking…':plan?'Re-plan':'Plan my 30 minutes'}</button>}
    </div>
    {mode==='none'
      ? <div style={{fontSize:13,opacity:.85,marginTop:8}}>Sign in to get an AI plan for your day.</div>
      : !hasWork
        ? <div style={{fontSize:13,opacity:.85,marginTop:8}}>Save a few people first, then MIghTy can plan your day around them.</div>
        : busy
          ? <div style={{marginTop:12}}><Dots/></div>
          : err
            ? <div style={{fontSize:12.5,marginTop:10,color:'#ffb3a6'}}>{err}</div>
            : plan
              ? <div style={{marginTop:12}}>
                  {plan.headline && <div style={{fontSize:13.5,opacity:.9,marginBottom:12}}>{plan.headline}</div>}
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    {(plan.actions||[]).map((a,i)=>{ const row=findRow(a.who);
                      return <div key={i} style={{display:'flex',gap:12,alignItems:'flex-start',paddingBottom:10,borderBottom:i<plan.actions.length-1?'1px solid rgba(255,255,255,.14)':'none'}}>
                        <div style={{width:24,height:24,flex:'none',background:'var(--brand)',color:'#fff',display:'grid',placeItems:'center',fontWeight:700,fontSize:12}}>{i+1}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:600,fontSize:14}}>{a.title}{a.minutes?<span style={{opacity:.6,fontWeight:400}}> · {a.minutes} min</span>:null}</div>
                          <div style={{fontSize:12.5,opacity:.82,marginTop:2}}>{a.who&&a.who!=='—'?`${a.who} — `:''}{a.why}</div>
                        </div>
                        {row && <button className="btn ghost sm" onClick={()=>setDrawerId(row.id)} style={{background:'transparent',color:'#fff',borderColor:'rgba(255,255,255,.3)'}}>Open</button>}
                      </div>; })}
                  </div>
                </div>
              : <div style={{fontSize:13,opacity:.85,marginTop:8}}>Ask MIghTy what's worth doing in the next half hour.</div>}
  </div>;
}

/* ============================ Find people (Discover) ============================
   You type a natural request ("strategy tech companies near me"); MIghTy resolves
   "near me" to your city, rewrites it into tight keywords via the AI gateway, and
   runs an official Google Programmable Search (server-side, quota'd, never HTML
   scraping) scoped to public LinkedIn profiles. Results come back INTO the app as
   a selectable list you import into your pipeline with one click. If web search
   isn't configured, it falls back to opening Google for the extension to capture. */
function FindPeople({sb, auth, db, patch, addPeople, setTab}){
  const [q,setQ]=useState(''); const [busy,setBusy]=useState(false);
  const [results,setResults]=useState(null); const [sel,setSel]=useState(new Set());
  const [msg,setMsg]=useState(null); const [lastKw,setLastKw]=useState('');
  const mode = llmMode(sb,auth);
  const EX=['strategy tech companies near me','MIT Sloan alumni in AI','healthcare VCs in New York','product managers at Stripe','climate startup founders in Europe'];
  const NEARME=/\b(near|around|close to)\s+me\b|\bnearby\b|\bmy area\b/i;
  const tracked = new Set(); // filled from db? we compare on import
  function localClean(query){ const kw=goalKeywords(query); return kw.length ? kw.join(' ') : query; }
  function resolveLocation(query){
    if(!NEARME.test(query)) return query;
    let loc = (db && db.settings.homeLocation || '').trim();
    if(!loc && patch){
      loc = (window.prompt('Which city are you based in? Leave blank to search across the USA.')||'').trim();
      if(loc) patch('settings', s=>({...s, homeLocation:loc}));
    }
    if(!loc) loc = 'United States';
    return query.replace(NEARME,'').replace(/\s+/g,' ').trim()+' '+loc;
  }
  async function keywords(raw){
    const located = resolveLocation(raw);
    if(mode==='none') return localClean(located);
    try{
      const kw = await llm(sb, auth, 'tagging',
        'You turn a natural-language request to find people into a short set of LinkedIn profile search keywords: role/title, company, industry, and location. Keep real company and place names exactly. Convert phrases like "tech companies" to "technology". Output ONLY the keywords on one line - no punctuation, quotes, or explanation.',
        located, 60);
      const clean=(kw||'').trim().replace(/[\n"]/g,' ').replace(/\s+/g,' ');
      return clean.length>1 ? clean : localClean(located);
    }catch(e){ return localClean(located); }
  }
  // Open Google for the extension to capture — the free path (a normal Google
  // search in the student's own browser; the MIghTy extension reads the page).
  function openForExtension(kw){
    window.open('https://www.google.com/search?q='+encodeURIComponent('site:linkedin.com/in '+kw),'_blank','noopener');
    setMsg({t:'Opened your search in a new tab - tick the profiles in the MIghTy panel there and hit Import. They\'ll land in your People list.'});
  }
  async function go(){
    const raw=q.trim(); if(!raw || busy) return;
    setBusy(true); setMsg(null); setResults(null); setSel(new Set());
    const kw = await keywords(raw); setLastKw(kw);
    try{
      // Try the optional in-app search API; if it isn't set up, use the free
      // extension flow rather than treating it as an error.
      const {data,error} = await sb.functions.invoke('people-search', {body:{query:kw}});
      if(error){ openForExtension(kw); }
      else if(data && data.ok){
        setResults(data.people||[]);
        setSel(new Set((data.people||[]).map(p=>p.profileUrl)));
      } else if(data && data.error==='not_configured'){
        openForExtension(kw);
      } else { setMsg({t:(data&&data.message)||'Search failed.', err:true}); }
    }catch(e){ openForExtension(kw); }
    setBusy(false);
  }
  const toggle=url=>setSel(s=>{ const n=new Set(s); n.has(url)?n.delete(url):n.add(url); return n; });
  async function importSel(){
    if(!results) return;
    const chosen=results.filter(p=>sel.has(p.profileUrl));
    if(!chosen.length) return;
    setBusy(true);
    const {added}=await addPeople(chosen);
    setBusy(false); setResults(null); setSel(new Set());
    setMsg({t:`Added ${added} ${added===1?'person':'people'} to your pipeline.`, go:true});
  }

  return <div className="panel pad">
    <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>🔎 Find people anywhere</div>
    <div className="note" style={{marginBottom:12,fontSize:12.5,lineHeight:1.5}}>Describe who you're looking for in plain words. MIghTy turns it into a smart search and finds matching LinkedIn profiles for you to add.</div>
    <div style={{display:'flex',gap:8}}>
      <input className="inp" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') go(); }} placeholder="e.g. strategy people at tech companies near me"/>
      <button className="btn" onClick={go} disabled={busy||!q.trim()}>{busy?<Dots/>:'✨ Search'}</button>
    </div>

    {msg && <div className={msg.err?'warnbox':'okbox'} style={{marginTop:10}}>{msg.t}{msg.go && <> <a style={{cursor:'pointer',fontWeight:700}} onClick={()=>setTab('people')}>View in People →</a></>}</div>}

    {results && <div style={{marginTop:12}}>
      {lastKw && <div className="note" style={{fontSize:12,marginBottom:8}}>Results for <b style={{color:'var(--ink)'}}>{lastKw}</b></div>}
      {results.length===0
        ? <div className="note">No LinkedIn profiles matched. Try different words.</div>
        : <>
          <div className="list">{results.map(p=>{ const on=sel.has(p.profileUrl);
            return <label key={p.profileUrl} className="row" style={{cursor:'pointer',alignItems:'flex-start'}}>
              <input type="checkbox" checked={on} onChange={()=>toggle(p.profileUrl)} style={{marginTop:3}}/>
              <div className="grow"><div className="t">{p.name}</div><div className="m">{p.title||p.company||'LinkedIn profile'}</div></div>
              <a className="linkurl" href={p.profileUrl} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()}>↗</a>
            </label>; })}</div>
          <div style={{display:'flex',gap:10,marginTop:12,alignItems:'center'}}>
            <button className="btn" onClick={importSel} disabled={busy||sel.size===0}>{busy?<Dots/>:`Add ${sel.size} to People`}</button>
            <a className="note" style={{cursor:'pointer'}} onClick={()=>{setResults(null);setSel(new Set());}}>Clear</a>
          </div>
        </>}
    </div>}

    {!results && <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:10}}>
      {EX.map(ex=><span key={ex} onClick={()=>setQ(ex)} className="chip" style={{cursor:'pointer',background:'var(--card)',border:'1px solid var(--line)'}}>{ex}</span>)}
    </div>}
  </div>;
}

/* ============================ Dashboard ============================ */
function Dashboard({db,patch,log,events,tasks,communityStats,sb,auth,addPeople,setTab,setDrawerId,setDraftFor}){
  const candidates = log.filter(r=>r.status==='prospect'||r.status==='ready_to_contact');
  const scored = candidates.map(r=>({row:r, kind:'contact', label:'Message for the first time', ...computeScore(r, db.settings.targetCompanies, profileKeywords(db.settings))}));
  const followUpDays = db.settings.followUpDays||7;
  const repliedIds = new Set(events.filter(e=>e.event_type==='reply').map(e=>e.log_id));
  const overdue = log.filter(r=>r.status==='contacted' && !repliedIds.has(r.id) && r.contacted_at && (now()-new Date(r.contacted_at).getTime())>followUpDays*864e5)
    .map(r=>{ const days=Math.round((now()-new Date(r.contacted_at).getTime())/864e5);
      return {row:r, kind:'followup', label:`Follow up — no reply in ${days}d`, score:Math.min(100,50+(days-followUpDays)*3), reasons:[`Sent ${days}d ago`]}; });
  const priorities = [...scored, ...overdue].sort((a,b)=>b.score-a.score).slice(0,3);

  const buckets = ['prospect','ready_to_contact','contacted','replied','coffee_chat','referral','interview','offer'];
  const reach = st => log.filter(r=>{
    if(r.status==='do_not_contact') return false;
    const i=buckets.indexOf(r.status), j=buckets.indexOf(st);
    return i>=j;
  }).length;
  const funnel = [
    ['Saved', log.filter(r=>r.status!=='do_not_contact').length],
    ['Contacted', reach('contacted')],['Replied', reach('replied')],['Coffee chats', reach('coffee_chat')],
    ['Referrals', reach('referral')],['Interviews', reach('interview')],['Offers', reach('offer')],
  ];
  const maxFunnel = Math.max(1, funnel[0][1]);

  const weekContacted = contactedThisWeek(log);
  const weekReplies = events.filter(e=>e.event_type==='reply' && new Date(e.occurred_at).getTime()>=weekStartUTC()).length;
  const weekChats = events.filter(e=>e.event_type==='coffee_chat' && new Date(e.occurred_at).getTime()>=weekStartUTC()).length;
  const weekRate = weekContacted ? Math.round(100*weekReplies/weekContacted) : 0;

  const hour = new Date().getHours(), tod = hour<12?'morning':hour<18?'afternoon':'evening';
  const first = (auth.user.email||'').split('@')[0];

  return <div className="page">
    <div style={{fontSize:24,fontWeight:700,letterSpacing:'-.02em'}}>Good {tod}{first?`, ${first}`:''}</div>
    <div className="note" style={{marginTop:4,fontSize:13.5}}>{priorities.length ? `${priorities.length} thing${priorities.length!==1?'s':''} worth doing today.` : 'Nothing urgent — check People to shortlist more contacts.'}</div>

    <div style={{marginTop:20}}><DailyCopilot db={db} log={log} events={events} tasks={tasks} sb={sb} auth={auth} setDrawerId={setDrawerId}/></div>

    <div style={{marginTop:14}}><FindPeople sb={sb} auth={auth} db={db} patch={patch} addPeople={addPeople} setTab={setTab}/></div>

    <div className="tag" style={{margin:'28px 0 10px'}}>Today's priorities</div>
    {priorities.length===0
      ? <div className="panel pad"><div className="empty" style={{padding:'20px'}}><div className="big">✓</div>All caught up.</div></div>
      : <div className="grid3">{priorities.map((p,i)=><div key={p.row.id+p.kind} className="panel pad" style={{display:'flex',flexDirection:'column',gap:7}}>
          <span className="chip" style={{alignSelf:'flex-start',background:p.kind==='followup'?'var(--tsoft)':'var(--bsoft)',color:p.kind==='followup'?'var(--terra2)':'var(--brand2)'}}>{p.kind==='followup'?'Follow-up due':'New contact'}</span>
          <div style={{fontWeight:600,fontSize:14.5}}>{displayName(p.row)}</div>
          <div className="note">{p.label}</div>
          <div style={{flex:1}}/>
          <button className="btn ghost sm" style={{alignSelf:'flex-start'}} onClick={()=>p.kind==='followup'?setDraftFor(p.row.id):setDrawerId(p.row.id)}>{p.kind==='followup'?'Draft follow-up':'Open profile'}</button>
        </div>)}</div>}

    <div className="grid2" style={{marginTop:30,alignItems:'start'}}>
      <div>
        <div className="tag" style={{marginBottom:10}}>Networking progress</div>
        <div className="panel pad">
          {funnel.map(([label,val])=><div key={label} style={{display:'grid',gridTemplateColumns:'96px 1fr 36px',gap:12,alignItems:'center',padding:'6px 0'}}>
            <div className="note">{label}</div>
            <div style={{height:16,borderRadius:0,background:'var(--chip)',overflow:'hidden'}}><div style={{height:'100%',width:`${Math.max(3,Math.round(100*val/maxFunnel))}%`,background:'var(--brand)',borderRadius:0}}></div></div>
            <div style={{fontWeight:700,textAlign:'right',fontSize:13}}>{val}</div>
          </div>)}
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div>
          <div className="tag" style={{marginBottom:10}}>This week</div>
          <div className="panel pad">
            {[['Contacted',weekContacted],['Replies',weekReplies],['Response rate',weekRate+'%'],['Coffee chats',weekChats]].map(([l,v])=>
              <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--line2)'}}><span className="note">{l}</span><span style={{fontWeight:700,fontSize:14}}>{v}</span></div>)}
          </div>
        </div>
        <div>
          <div className="tag" style={{marginBottom:10}}>Quick actions</div>
          <div className="panel pad" style={{padding:6}}>
            {[['Search alumni',()=>setTab('people')],['Open the extension',()=>setTab('extpreview')],['Review pipeline',()=>setTab('pipeline')],['Add a task',()=>setTab('tasks')]].map(([l,go])=>
              <div key={l} className="row" style={{border:'none',background:'transparent',padding:'9px 10px',cursor:'pointer'}} onClick={go}><span style={{fontSize:13.5,fontWeight:500}}>{l}</span><span style={{marginLeft:'auto',color:'var(--mute)'}}>→</span></div>)}
          </div>
        </div>
      </div>
    </div>
  </div>;
}

/* ============================ People ============================ */
function People({db,log,events,doIngest,setDrawerId,sb,auth}){
  const [q,setQ]=useState(''); const [checking,setChecking]=useState(false);
  const [ai,setAi]=useState(null); const [aiBusy,setAiBusy]=useState(false); const [aiErr,setAiErr]=useState(null);
  const mode = llmMode(sb,auth);
  const ql = q.toLowerCase();
  // When an AI answer is showing, the query is a question (not a name filter),
  // so keep the full table below instead of filtering it to nothing.
  const rows = ai ? log : log.filter(r=>!ql || `${r.name} ${r.company} ${r.title}`.toLowerCase().includes(ql));

  // Semantic "ask your network" — Claude reasons over a compact index of the
  // student's own contacts (name/role/company/notes/briefing/profile snippets)
  // and returns which ones match a natural-language question, with why. Grounded
  // strictly in the index; no fabricated people. Routed through the gateway's
  // network_search feature.
  async function askNetwork(){
    if(mode==='none' || !q.trim()) return;
    setAiBusy(true); setAiErr(null); setAi(null);
    try{
      const index = log.slice(0,120).map(r=>{
        const ctx=r.context||{}, br=r.briefing||{};
        const bits=[`#${r.id} ${displayName(r)}`, r.title, r.company, r.status];
        if(br.careerSummary) bits.push('brief:'+String(br.careerSummary).slice(0,160));
        if(r.notes) bits.push('notes:'+String(r.notes).slice(0,160));
        if(ctx.aboutText) bits.push('profile:'+String(ctx.aboutText).slice(0,220));
        return bits.filter(Boolean).join(' | ');
      }).join('\n');
      const r = await llmJSON(sb, auth, 'network_search',
        'You are a semantic search over an MIT Sloan Fellows MBA student\'s own saved contacts. Given a question and an indexed list of contacts, return the contacts that genuinely match. Use ONLY the provided index — never invent people or facts. If nothing matches, return an empty list.',
        `Question: ${q.trim()}\n\nContacts (one per line, prefixed with #id):\n${index}\n\nReturn JSON: {"matches": [{"id": number, "why": string (under 15 words)}]}. Ranked best-first, at most 12.`);
      setAi(r.matches||[]);
    }catch(e){ setAiErr(e.message||String(e)); }
    setAiBusy(false);
  }
  const aiRows = ai ? ai.map(m=>({m, r:log.find(x=>x.id===m.id)})).filter(x=>x.r) : null;

  return <div className="page wide">
    <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:12}}>
      <input className="inp" style={{width:360}} value={q} onChange={e=>setQ(e.target.value)}
        onKeyDown={e=>{ if(e.key==='Enter' && mode!=='none') askNetwork(); }}
        placeholder="Search names, or ask: who works in healthcare?"/>
      {mode!=='none' && <button className="btn sm" onClick={askNetwork} disabled={aiBusy||!q.trim()}>{aiBusy?<Dots/>:'✨ Ask'}</button>}
      <div className="note">{rows.length} of {log.length} people</div>
      <div style={{flex:1}}/>
      <button className="btn ghost sm" onClick={async()=>{setChecking(true); await doIngest(); setChecking(false);}} disabled={checking}>{checking?<Dots/>:'↻ Check for new profiles'}</button>
    </div>

    {aiErr && <div className="warnbox" style={{marginBottom:12}}>{aiErr}</div>}
    {aiRows && <div className="panel pad" style={{marginBottom:14}}>
      <div className="ph" style={{marginBottom:aiRows.length?12:0}}>
        <div><h2 style={{fontSize:15}}>✨ Answering: "{q.trim()}"</h2><div className="sub">{aiRows.length} match{aiRows.length===1?'':'es'} from your network</div></div>
        <button className="btn ghost sm" onClick={()=>{setAi(null);}}>Clear</button>
      </div>
      {aiRows.length===0
        ? <div className="note">No one in your saved contacts matches that. Try saving more people, or rephrasing.</div>
        : <div className="list">{aiRows.map(({m,r})=><div key={r.id} className="row" style={{cursor:'pointer'}} onClick={()=>setDrawerId(r.id)}>
            <Avatar row={r} size={34}/>
            <div className="grow"><div className="t">{displayName(r)}</div><div className="m">{r.title||''}{r.company?` · ${r.company}`:''}</div></div>
            <div style={{maxWidth:260,textAlign:'right',fontSize:12.5,color:'var(--brand2)'}}>{m.why}</div>
          </div>)}</div>}
    </div>}

    <div className="panel" style={{overflow:'auto'}}>
      {log.length===0
        ? <div className="empty"><div className="big">◔</div>Nobody yet. Shortlist profiles with the extension, then hit "Check for new profiles."</div>
        : <table className="ptable"><thead><tr><th>Name</th><th>Company</th><th>Role</th><th>Status</th><th>Priority</th><th>Last activity</th><th>Next action</th></tr></thead>
          <tbody>{rows.map(r=>{
            const na = suggestedNextAction(r, events.filter(e=>e.log_id===r.id), db.settings.followUpDays);
            return <tr key={r.id} className="body-row" onClick={()=>setDrawerId(r.id)}>
              <td><div style={{display:'flex',alignItems:'center',gap:9}}><Avatar row={r}/><div style={{minWidth:0}}><div style={{fontWeight:600,fontSize:13,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{displayName(r)}</div></div></div></td>
              <td>{r.company||''}</td>
              <td style={{color:'var(--sub)'}}>{r.title||''}</td>
              <td><StagePill status={r.status}/></td>
              <td><PriorityDot priority={r.priority}/></td>
              <td className="note">{rel(new Date(r.updated_at).getTime())}</td>
              <td style={{color:'var(--brand)',fontWeight:500,fontSize:12.5}}>{na?na.label:'—'}</td>
            </tr>;
          })}</tbody>
        </table>}
    </div>
  </div>;
}

/* ============================ Pipeline ============================ */
function Pipeline({log,changeStage}){
  const [filter,setFilter]=useState('All');
  const [dragId,setDragId]=useState(null);
  const companies = ['All', ...Array.from(new Set(log.map(r=>r.company).filter(Boolean)))];
  const pool = filter==='All' ? log : log.filter(r=>r.company===filter);
  return <div className="page wide" style={{height:'100%',display:'flex',flexDirection:'column'}}>
    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:14}}>
      {companies.map(c=><button key={c} className="btn sm" style={{background:filter===c?'var(--ink)':'var(--card)',color:filter===c?'#fff':'var(--sub)',border:'1px solid '+(filter===c?'var(--ink)':'rgba(0,0,0,.12)')}} onClick={()=>setFilter(c)}>{c}</button>)}
      <div style={{flex:1}}/>
      <div className="note">Drag cards as relationships progress</div>
    </div>
    <div className="pipeline-wrap">
      {PIPELINE_STAGES.map(st=>{
        const meta = STAGE_META[st];
        const cards = pool.filter(r=>r.status===st);
        return <div key={st} className="pcol" onDragOver={e=>e.preventDefault()} onDrop={()=>{ if(dragId!=null){ const row=log.find(r=>r.id===dragId); if(row && row.status!==st) changeStage(row, st); setDragId(null); } }}>
          <div className="pcol-head"><span className="dot" style={{background:meta.dot}}></span><span style={{fontWeight:600,fontSize:13}}>{meta.label}</span><span className="note">{cards.length}</span></div>
          <div className="pcol-cards">
            {cards.map(r=><div key={r.id} className="pcard" draggable onDragStart={()=>setDragId(r.id)}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <Avatar row={r} size={24}/>
                <div style={{fontWeight:600,fontSize:12.5,flex:1,minWidth:0,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{displayName(r)}</div>
                <span className="dot" style={{background:PRIORITY_META[r.priority]?.dot}}></span>
              </div>
              <div className="note" style={{marginTop:5}}>{r.title||''}{r.company?` · ${r.company}`:''}</div>
            </div>)}
            {cards.length===0 && <div className="pdrop">Drop here</div>}
          </div>
        </div>;
      })}
    </div>
  </div>;
}

/* ============================ Tasks ============================ */
function Tasks({tasks,log,addTask,toggleTask,deleteTask,setDrawerId}){
  const [newTask,setNewTask]=useState('');
  const todayStr = new Date().toISOString().slice(0,10);
  function submit(e){
    if(e.key==='Enter' && newTask.trim()){ addTask(newTask.trim(), todayStr, null); setNewTask(''); }
  }
  const groups = [
    ['Today', tasks.filter(t=>!t.done && t.due_date===todayStr)],
    ['This week', tasks.filter(t=>!t.done && t.due_date && t.due_date!==todayStr)],
    ['No due date', tasks.filter(t=>!t.done && !t.due_date)],
    ['Done', tasks.filter(t=>t.done)],
  ].filter(([,items])=>items.length>0);
  return <div className="page" style={{maxWidth:660}}>
    <input className="inp" value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={submit} placeholder='Add a task and press Enter — e.g. "Thank-you note to Priya"'/>
    {groups.length===0 && <div className="empty" style={{marginTop:20}}><div className="big">☑</div>No tasks yet.</div>}
    {groups.map(([name,items])=><div key={name} style={{marginTop:26}}>
      <div className="tag" style={{marginBottom:8}}>{name}</div>
      <div className="list">{items.map(t=>{ const person = t.log_id ? log.find(r=>r.id===t.log_id) : null;
        return <div key={t.id} className="row">
          <div onClick={()=>toggleTask(t)} style={{width:18,height:18,flex:'none',borderRadius:0,border:'1.5px solid '+(t.done?'var(--brand)':'rgba(0,0,0,.25)'),background:t.done?'var(--brand)':'transparent',display:'grid',placeItems:'center',cursor:'pointer',color:'#fff',fontSize:11}}>{t.done?'✓':''}</div>
          <div className="grow"><div style={{fontWeight:500,fontSize:13.5,color:t.done?'var(--mute)':'var(--ink)',textDecoration:t.done?'line-through':'none'}}>{t.label}</div>
            {t.sub && <div className="note">{t.sub}</div>}</div>
          {person && <div className="chip" style={{cursor:'pointer'}} onClick={()=>setDrawerId(person.id)}>{displayName(person)}</div>}
          <button className="iconbtn" onClick={()=>deleteTask(t)}>✕</button>
        </div>; })}</div>
    </div>)}
  </div>;
}

/* ============================ Insights ============================ */
function Insights({log,events,communityStats}){
  const everContacted = log.filter(r=>r.status!=='prospect'&&r.status!=='ready_to_contact'&&r.status!=='do_not_contact').length;
  const replied = log.filter(r=>['replied','coffee_chat','referral','interview','offer'].includes(r.status)).length;
  const responseRate = everContacted ? Math.round(100*replied/everContacted) : 0;
  const coffeeChats = events.filter(e=>e.event_type==='coffee_chat').length;
  const referrals = log.filter(r=>['referral','interview','offer'].includes(r.status)).length;
  const interviews = log.filter(r=>['interview','offer'].includes(r.status)).length;
  const stats = [
    {v:responseRate+'%', l:'Response rate', n:`${replied} of ${everContacted} replied`},
    {v:coffeeChats, l:'Coffee chats', n:'Logged in Timeline'},
    {v:referrals, l:'Referrals', n:'Reached referral stage or beyond'},
    {v:interviews, l:'Interviews', n:'Reached interview stage or beyond'},
  ];
  const companyMap = {};
  log.forEach(r=>{ if(!r.company) return; const c=companyMap[r.company]=companyMap[r.company]||{contacts:0,replies:0}; c.contacts++; if(['replied','coffee_chat','referral','interview','offer'].includes(r.status)) c.replies++; });
  const coBars = Object.entries(companyMap).sort((a,b)=>b[1].contacts-a[1].contacts).slice(0,6);
  const maxCo = Math.max(1, ...coBars.map(([,c])=>c.contacts));
  const weekBuckets = Array.from({length:8},(_,i)=>{ const start = weekStartUTC(now()-((7-i))*7*864e5); return log.filter(r=>r.contacted_at && weekStartUTC(new Date(r.contacted_at).getTime())===start).length; });
  const maxWeek = Math.max(1, ...weekBuckets);

  return <div className="page">
    <div className="grid3" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
      {stats.map(s=><div key={s.l} className="panel pad"><div style={{fontSize:22,fontWeight:700}}>{s.v}</div><div className="note" style={{fontWeight:500,marginTop:3}}>{s.l}</div><div className="note" style={{marginTop:5}}>{s.n}</div></div>)}
    </div>
    <div className="grid2" style={{marginTop:14}}>
      <div className="panel pad">
        <div style={{fontWeight:600,fontSize:14}}>Networking by company</div>
        <div style={{marginTop:12}}>{coBars.length===0 && <div className="note">No company data yet.</div>}
          {coBars.map(([name,c])=><div key={name} style={{display:'grid',gridTemplateColumns:'76px 1fr',gap:10,alignItems:'center',padding:'6px 0'}}>
            <div className="note">{name}</div>
            <div><div style={{height:12,borderRadius:0,background:'var(--chip)',overflow:'hidden'}}><div style={{height:'100%',width:`${Math.round(100*c.contacts/maxCo)}%`,background:'var(--brand)',borderRadius:0}}></div></div>
              <div className="note" style={{marginTop:3}}>{c.contacts} contacts · {c.replies} replies</div></div>
          </div>)}</div>
      </div>
      <div className="panel pad" style={{display:'flex',flexDirection:'column'}}>
        <div style={{fontWeight:600,fontSize:14}}>Weekly activity</div>
        <div className="note">Contacted per week</div>
        <div style={{flex:1,display:'flex',alignItems:'flex-end',gap:9,paddingTop:16,minHeight:130}}>
          {weekBuckets.map((v,i)=><div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5,justifyContent:'flex-end'}}>
            <div style={{fontSize:11,fontWeight:600}}>{v}</div>
            <div style={{width:'100%',maxWidth:28,height:Math.round(v/maxWeek*90)+6,borderRadius:0,background:i===7?'var(--brand)':'var(--chip)'}}></div>
            <div style={{fontSize:10,color:'var(--mute)'}}>W{i+1}</div>
          </div>)}
        </div>
      </div>
    </div>
    <div style={{marginTop:14}}><CommunityInsights communityStats={communityStats}/></div>
  </div>;
}
function CommunityInsights({communityStats}){
  return <div className="panel pad">
    <div className="ph"><div><h2>Community insights</h2><div className="sub">Opt-in, anonymous, aggregated across Sloan Fellows — never names or messages.</div></div></div>
    {communityStats.length===0
      ? <div className="empty"><div className="big">🌐</div>No company has reached 3 contributing students yet, or you haven't opted in (Settings).</div>
      : <div className="list">{communityStats.slice(0,8).map(c=><div key={c.company} className="row">
          <div className="grow"><div className="t">{c.company}</div>
            <div className="m">{bucketCount(c.contributor_count)} students · {bucketCount(c.outreach_count)} outreach · {bucketCount(c.reply_count)} replies · {bucketCount(c.coffee_chat_count)} coffee chats · {bucketCount(c.interview_count)} interviews</div></div>

// Reads the AI Gateway's own ledger (RLS-scoped to the signed-in user) to show
// how many assists they've used today/this month and the estimated spend. All
// queries fail soft — if the gateway tables aren't deployed yet, it just shows
// a hint instead of an error.
// Loads pdf.js on demand (only when the student picks a PDF) so the app stays
// light for everyone else.
function loadPdfJs(){
  return new Promise((resolve,reject)=>{
    if(window.pdfjsLib) return resolve(window.pdfjsLib);
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; resolve(window.pdfjsLib); }catch(e){ reject(e); } };
    sc.onerror=()=>reject(new Error('Could not load the PDF reader.'));
    document.head.appendChild(sc);
  });
}
async function pdfToText(file){
  const lib=await loadPdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:buf}).promise;
  let out='';
  for(let i=1;i<=Math.min(pdf.numPages,8);i++){
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    out += tc.items.map(it=>it.str).join(' ')+'\n';
  }
  return out;
}
const mergeArr=(a,b)=>{ const seen=new Set((a||[]).map(x=>x.toLowerCase())); return [...(a||[]), ...(b||[]).filter(x=>x&&!seen.has(x.toLowerCase()))]; };

// Fills most of the profile from a resume. Reads the text (PDF via pdf.js, or a
// pasted paste), asks the gateway to extract structured facts, shows them for
// the student to confirm, then MERGES into settings — never overwriting what's
// already there. This is the "AI extracts, you confirm" step.
function ResumeImport({sb, auth, db, patch, onApply}){
  const [text,setText]=useState(''); const [busy,setBusy]=useState(false);
  const [ex,setEx]=useState(null); const [err,setErr]=useState(null); const [done,setDone]=useState(false);
  const mode=llmMode(sb,auth);
  async function onFile(e){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    setErr(null); setDone(false);
    try{
      if(/pdf$/i.test(f.name)||f.type==='application/pdf'){ setBusy(true); setText(await pdfToText(f)); setBusy(false); }
      else { setText(await f.text()); }
    }catch(e2){ setBusy(false); setErr('Could not read that file. Paste the text below instead.'); }
  }
  async function extract(){
    if(!text.trim()||mode==='none'||busy) return;
    setBusy(true); setErr(null); setDone(false);
    try{
      const r=await llmJSON(sb, auth, 'resume_extract',
        'Extract structured facts from this resume for a professional-networking app. Use ONLY what the resume states - never infer or invent. Keep list items short (a few words each).',
        `Resume text:\n${text.slice(0,9000)}\n\nReturn JSON: {"currentRole":string,"currentCompany":string,"yearsExperience":string,"skills":string[],"schools":string[],"industries":string[]}. Use "" or [] when unknown.`);
      setEx({ currentRole:r.currentRole||'', currentCompany:r.currentCompany||'', yearsExperience:r.yearsExperience||'',
        skills:(r.skills||[]).slice(0,12), schools:(r.schools||[]).slice(0,6), industries:(r.industries||[]).slice(0,6) });
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(false);
  }
  function apply(){
    const e=ex; if(!e) return;
    if(onApply){ onApply(e); }
    else patch('settings', s=>({...s,
      currentRole: s.currentRole||e.currentRole,
      currentCompany: s.currentCompany||e.currentCompany,
      yearsExperience: s.yearsExperience||e.yearsExperience,
      skills: mergeArr(s.skills, e.skills),
      schools: mergeArr(s.schools, e.schools),
      industries: mergeArr(s.industries, e.industries) }));
    setEx(null); setText(''); setDone(true);
  }
  if(mode==='none') return <div className="panel pad"><div className="note">Sign in to import your resume.</div></div>;
  return <div className="panel pad">
    <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
