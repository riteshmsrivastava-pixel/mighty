<title>Mighty</title>
<!-- ============================================================
     Mighty v2 — the relationship operating system.
     Governed by docs/PRODUCT-BIBLE-v2.md. Visual spec: the Claude Design
     bundle (app-redesign-with-new-principles).

     Navigation is the user's questions, not features:
       Today        — what deserves my attention?
       Strategy     — why am I networking?
       Discover     — who should I know?
       Relationships— where am I with everyone?
       Ask Mighty   — what should I do?
       Settings     — how does Mighty work for me?

     Permanent rules enforced here:
       · You always click Send. Nothing is ever sent automatically.
       · Explain before you score — no numeric match scores in the UI.
       · Save is the only way a person enters Mighty; 'prospect' IS Saved.
       · Navigation is always visible; only depth unlocks, on data not time.
       · Never "Mighty knows" — always "Things you've learned".
       · No empty dashboards: every panel hides until it has real data.

     Same Supabase project, tables and settings keys as app/v1.html, so both
     apps read and write one account.
     ============================================================ -->

  .pill{display:inline-block;padding:5px 12px;border-radius:var(--pill);font-size:12.5px;font-weight:700;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .row{display:flex;align-items:center;gap:16px}
  .stack{display:flex;flex-direction:column}

  .tabs button.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:700}

  .spin{width:15px;height:15px;border:2px solid #DED8F7;border-top-color:var(--brand);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .fade{animation:fi .22s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .banner{border-radius:12px;padding:13px 16px;font-size:14px;font-weight:500;line-height:1.5}
  .banner.warn{background:var(--amber-soft);color:#6E5F3D;border:1px solid #F0E4C6}
  .banner.err{background:var(--red-soft);color:#8E4238;border:1px solid #F6D9D4}
  .banner.ok{background:var(--green-soft);color:var(--green);border:1px solid #CFE5D8}
  .hint{font-size:13px;color:var(--mute2);line-height:1.5}
  .lift:hover{background:var(--card2)}
  .colcard{background:#fff;border:1px solid var(--line);border-radius:var(--rsm);padding:15px 16px;cursor:pointer}
  .colcard:hover{border-color:#D6CFF8}
  .drop{outline:2px dashed #CFC4F9;outline-offset:-4px;border-radius:12px}

  @media (max-width:900px){
    .h1{font-size:26px} .h2{font-size:22px}

<script type="text/babel" data-presets="react-classic">
const {useState, useEffect, useRef, useMemo} = React;
const F = React.Fragment;

/* ===================== platform config (same project as app/v1.html) ===================== */
const SUPABASE_URL      = 'https://hplyyywdftnvjajyncvj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_e_oCwuz3Qlko5N3Xl8ZwxA_zQijz_u8';
const MIT_RE  = /@([a-z0-9-]+\.)*mit\.edu$/i;

/* Primary-goal vocabulary is v1's goalType enum so both apps score alike. */
const GOALS = [
  {id:'job_search',    label:'Find a new job',         hint:'Hiring managers, alumni, people already in the role'},
  {id:'raise_funding', label:'Raise investment',       hint:'Investors, angels, founders who have raised'},
  {id:'sales',         label:'Find customers',         hint:'Buyers, executives, decision makers'},
  {id:'mentors',       label:'Find mentors & advisors', hint:'Operators and experts a step ahead of you'},
  {id:'networking',    label:'Build my network',       hint:'Broad, deliberate, long-term relationships'},
];
const GOAL_LABEL = GOALS.reduce((a,g)=>{a[g.id]=g.label;return a;},{});

/* outreach_log.status is the ONE stage field. 'prospect' IS Saved. */
const STAGE = {
  prospect:        {label:'Saved',              bg:'#F4F2EE', fg:'#5B554D', dot:'#C4BDB2'},
  ready_to_contact:{label:'Ready to reach out', bg:'#EFEBFE', fg:'#5540D8', dot:'#5B46E5'},
  contacted:       {label:'First message sent', bg:'#FBF3E2', fg:'#6E5F3D', dot:'#D9971C'},
  replied:         {label:'Conversation started',bg:'#E9F1EC', fg:'#14805A', dot:'#22916A'},
  coffee_chat:     {label:'Met',                bg:'#E9F1EC', fg:'#14805A', dot:'#22916A'},
  referral:        {label:'Referral',           bg:'#E9F1EC', fg:'#14805A', dot:'#22916A'},
  interview:       {label:'Interview',          bg:'#E9F1EC', fg:'#14805A', dot:'#22916A'},
  offer:           {label:'Offer',              bg:'#E9F1EC', fg:'#14805A', dot:'#22916A'},
  do_not_contact:  {label:'Not interested',     bg:'#F4F2EE', fg:'#948E85', dot:'#D6D0C7'},
};
const stageOf = (r)=>STAGE[(r||{}).status] || STAGE.prospect;
/* Board columns follow the Bible's default pipeline; the late statuses share
   one "Growing" column so the board stays readable. */
const COLUMNS = [
  {key:'prospect',         statuses:['prospect']},
  {key:'ready_to_contact', statuses:['ready_to_contact']},
  {key:'contacted',        statuses:['contacted']},
  {key:'replied',          statuses:['replied']},
  {key:'coffee_chat',      statuses:['coffee_chat']},
  {key:'growing',          statuses:['referral','interview','offer'], label:'Growing'},
];
const ORDER = ['prospect','ready_to_contact','contacted','replied','coffee_chat','referral','interview','offer'];
const REACHED = ['contacted','replied','coffee_chat','referral','interview','offer'];
const EVENT_LABEL = {connection_request:'Connection request', first_message:'First message sent',
  reply:'They replied', coffee_chat:'Met', note:'Note captured', referral:'Referral',
  interview:'Interview', stage_change:'Stage changed'};

/* ===================== progressive disclosure =====================
   Navigation is always visible. Only depth unlocks, and only on data. */
const UNLOCKS = {
  board:    {test:(p)=>p.length>=5,       hint:'The board opens once five people are saved — before that a list says more.'},
  timeline: {test:(p,e)=>e.length>=3,     hint:'The timeline fills in once three things have happened.'},
  health:   {test:(p)=>p.filter(r=>REACHED.includes(r.status)).length>=3,
             hint:'Reach out to three people and Mighty can start showing what is working.'},
  progress: {test:(p)=>p.length>=3,       hint:'Progress appears once you have saved three people.'},
};
const canSee = (k,p,e)=>{ try{ return !!UNLOCKS[k].test(p,e); }catch(err){ return false; } };

/* ===================== helpers ===================== */
const clean = (s)=>String(s==null?'':s).trim();
const initials = (n)=>clean(n).split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
const firstName = (n)=>clean(n).split(/\s+/)[0] || '';
const DAY = 86400000;
const days = (iso)=> iso ? Math.floor((Date.now()-new Date(iso).getTime())/DAY) : null;
const ago = (iso)=>{ const d=days(iso); if(d==null) return ''; return d<=0?'today':d===1?'yesterday':d<30?d+' days ago':d<365?Math.round(d/30)+' months ago':Math.round(d/365)+'y ago'; };
const dateShort = (iso)=>{ if(!iso) return ''; const d=new Date(iso);
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); };
const greetWord = ()=>{ const h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; };

function Avatar({name, size}){
  const s = size||38;
  return <div className="av" style={{width:s,height:s,fontSize:Math.round(s*0.36)}}>{initials(name)}</div>;
}
function Empty({title, body, cta, onCta}){
  return (
    <div className="card" style={{padding:'34px 30px'}}>
      <div className="h3">{title}</div>
      <div className="sub" style={{marginTop:7,lineHeight:1.55,maxWidth:520,textWrap:'pretty'}}>{body}</div>
      {cta && <button className="btn" style={{marginTop:20}} onClick={onCta}>{cta}</button>}
    </div>
  );
}
function ChipInput({value, onChange, placeholder}){
  const [t,setT] = useState('');
  const add = ()=>{
    const parts = t.split(',').map(clean).filter(Boolean);
    if(!parts.length) return;
    const next = value.slice();
    parts.forEach(p=>{ if(!next.some(v=>v.toLowerCase()===p.toLowerCase())) next.push(p); });
    onChange(next); setT('');
  };
  return (
    <div>
      {value.length>0 &&
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:10}}>
          {value.map((v,i)=>(
            <span key={v+i} className="tagx">{v}
              <button onClick={()=>onChange(value.filter((_,j)=>j!==i))} aria-label={'Remove '+v}>×</button>
            </span>))}
        </div>}
      <input className="inp" value={t} placeholder={placeholder}
        onChange={e=>setT(e.target.value)}
        onKeyDown={e=>{ if(e.key==='Enter'||e.key===','){ e.preventDefault(); add(); } }}
        onBlur={add}/>
    </div>
  );
}

/* ===================== AI (shared ai-proxy — no key ever reaches the client) ===================== */
async function llm(sb, feature, system, user, maxTokens){
  const {data, error} = await sb.functions.invoke('ai-proxy', {body:{feature, system, user, maxTokens:maxTokens||700}});
  if(error) throw error;
  if(!data || data.ok===false) throw new Error((data && (data.message||data.error)) || 'AI request failed.');
  return data.text;
}
async function llmJSON(sb, feature, system, user, maxTokens){
  const text = await llm(sb, feature, system+'\n\nRespond with ONLY valid JSON, no prose, no markdown fences.', user, maxTokens||900);
  return JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}')+1));
}
function strategyBrief(st){
  return [
    'Primary goal: ' + (GOAL_LABEL[st.goalType] || 'building a professional network'),
    st.goal ? 'In their words: ' + st.goal : '',
    (st.targetRoles||[]).length ? 'Wants to meet: ' + st.targetRoles.join(', ') : '',
    (st.targetCompanies||[]).length ? 'Target organizations: ' + st.targetCompanies.join(', ') : '',
    (st.targetLocations||[]).length ? 'Places that matter: ' + st.targetLocations.join(', ') : '',
    (st.currentRole||st.currentCompany) ? 'Currently: ' + [st.currentRole, st.currentCompany].filter(Boolean).join(' at ') : '',
    (st.schools||[]).length ? 'Schools: ' + st.schools.join(', ') : '',
    (st.successMetrics||[]).length ? 'Success looks like: ' + st.successMetrics.join(', ') : '',
    (st.networkingStyle||[]).length ? 'Prefers: ' + st.networkingStyle.join(', ') : '',
  ].filter(Boolean).join('\n');
}
function localKeywords(sentence, st){
  const stop = /\b(find|show|me|people|person|who|that|which|are|is|a|an|the|and|or|of|in|at|to|for|with|from|working|works|based|i|want|meet|looking|like|some)\b/gi;
  let s = clean(sentence).replace(stop,' ').replace(/\s+/g,' ').trim();
  if(!s) s = [(st.targetRoles||[])[0], (st.targetCompanies||[])[0], (st.targetLocations||[])[0]].filter(Boolean).join(' ');
  return s.slice(0,180);
}
async function toKeywords(sb, sentence, st){
  const home = (st.targetLocations||[])[0] || st.homeLocation;
  const near = /\bnear me\b/i.test(sentence) && home ? clean(sentence).replace(/\bnear me\b/i, home) : clean(sentence);
  try{
    const out = await llm(sb, 'tagging',
      'You turn a sentence describing people someone wants to meet into a short keyword query for a LinkedIn profile search. Output ONLY the keywords, space separated, no punctuation, no explanation, no quotes. Keep job titles, companies, schools, industries and places. Drop filler words. Maximum 12 words.',
      near, 60);
    const k = clean(out).replace(/^["']|["']$/g,'').replace(/\s+/g,' ');
    return k || localKeywords(near, st);
  }catch(e){ return localKeywords(near, st); }
}
const VERDICT = {strong:{label:'Strong match'}, good:{label:'Good match'}, weak:{label:'Weak match'}};
async function evaluate(sb, people, st){
  const list = people.map((p,i)=>`${i+1}. ${p.name} — ${p.title||'(no headline)'}${p.company?' — '+p.company:''}`).join('\n');
  const out = await llmJSON(sb, 'profile_briefing',
    'You help a professional decide who is worth building a relationship with. For each candidate, judge relevance to THEIR stated goal and explain it in plain language. Never output a numeric score. Ground every claim only in the given headline text — if the headline does not support a claim, do not make it. Be honest: say when someone is a weak match. Common ground must be real overlap between the two people; "both in tech" is not common ground.',
    `The person doing the networking:\n${strategyBrief(st)}\n\nCandidates:\n${list}\n\nReturn JSON exactly like {"matches":[{"n":1,"verdict":"strong"|"good"|"weak","why":"one or two sentences, starts with the reason, no score","common":["short shared-ground phrase"]}]}. Include every candidate by its number n. "common" may be empty.`,
    1500);
  const byN = {};
  (out.matches||[]).forEach(m=>{ if(m && m.n) byN[Number(m.n)]=m; });
  return people.map((p,i)=>{
    const m = byN[i+1]||{};
    const v = ['strong','good','weak'].indexOf(String(m.verdict||'').toLowerCase())>=0 ? String(m.verdict).toLowerCase() : 'good';
    return {...p, verdict:v, why:clean(m.why), common:Array.isArray(m.common)?m.common.filter(Boolean).slice(0,4):[]};
  });
}

/* ===================== Strategy (Slice 0 first run + the living surface) ===================== */
function StrategyForm({settings, onSave, busy, onCancel, firstRun}){
  const [goalType,setGoalType] = useState(settings.goalType||'');
  const [goal,setGoal]     = useState(settings.goal||'');
  const [roles,setRoles]   = useState(settings.targetRoles||[]);
  const [cos,setCos]       = useState(settings.targetCompanies||[]);
  const [locs,setLocs]     = useState(settings.targetLocations||[]);
  const [more,setMore]     = useState(!firstRun);
  const [role,setRole]     = useState(settings.currentRole||'');
  const [co,setCo]         = useState(settings.currentCompany||'');
  const [schools,setSchools] = useState(settings.schools||[]);
  const [style,setStyle]   = useState(settings.networkingStyle||[]);
  const [metrics,setMetrics] = useState(settings.successMetrics||[]);
  const STYLES = ['Coffee chats','Warm introductions','LinkedIn','Email','Conferences','Alumni events'];
  const ready = !!goalType;

  const submit = ()=>onSave({
    goalType, goal:clean(goal), targetRoles:roles, targetCompanies:cos, targetLocations:locs,
    homeLocation: locs[0] || settings.homeLocation || '',
    currentRole:clean(role), currentCompany:clean(co), schools, networkingStyle:style,
    successMetrics:metrics, strategyUpdatedAt:new Date().toISOString(),
  });

  return (
    <div className="pad fade" style={{maxWidth:720,margin:firstRun?'0 auto':'0',paddingTop:firstRun?56:36}}>
      <div className="eyebrow b">Your relationship strategy</div>
      <h1 className="h1" style={{marginTop:10}}>
        {firstRun ? "Let's build your relationship strategy." : 'Why are you networking?'}
      </h1>
      <p className="sub" style={{marginTop:8,lineHeight:1.55,textWrap:'pretty'}}>
        {firstRun
          ? 'Four questions, about a minute. This drives every recommendation Mighty makes — from your very first search.'
          : 'This is a living strategy, not a settings page. Change it whenever your goals change and everything downstream follows.'}
      </p>

      <div className="card" style={{marginTop:30,padding:'24px 26px'}}>
        <div className="h4">Why are you here?</div>
        <div className="sub" style={{marginTop:4,fontSize:14}}>The most important question in the product. Pick one.</div>
        <div className="stack" style={{gap:8,marginTop:16}}>
          {GOALS.map(g=>{
            const on = goalType===g.id;
            return (
              <button key={g.id} onClick={()=>setGoalType(g.id)} style={{textAlign:'left',padding:'14px 16px',borderRadius:12,
                border:'1px solid '+(on?'#CFC4F9':'var(--line)'), background:on?'var(--brand-soft2)':'var(--card2)'}}>
                <div style={{fontSize:15.5,fontWeight:700,letterSpacing:'-.01em',color:on?'var(--brand-ink)':'var(--ink)'}}>{g.label}</div>
                <div style={{fontSize:13.5,color:on?'#6F5FD6':'var(--sub)',marginTop:2}}>{g.hint}</div>
              </button>);

/* Actions are derived from real relationship data. Nothing is invented — if
   there is nothing real to do, Today says so and points at Discover. */
function buildPlan(people, events, tasks){
  const byLog = {};
  events.forEach(e=>{ (byLog[e.log_id] = byLog[e.log_id]||[]).push(e); });
  const lastOf = (r, types)=>{
    const list = (byLog[r.id]||[]).filter(e=>!types || types.indexOf(e.event_type)>=0);
    return list.length ? list[list.length-1] : null;
  };
  const out = [];

  people.filter(r=>r.status==='replied').forEach(r=>{
    const reply = lastOf(r,['reply']);
    const mine  = lastOf(r,['first_message','note']);
    const stale = !mine || !reply || new Date(reply.occurred_at) > new Date(mine.occurred_at);
    if(stale) out.push({id:'reply-'+r.id, tone:'red', title:'Reply to '+(r.name||'them'),
      sub: reply ? 'They replied '+ago(reply.occurred_at)+'.' : 'They are waiting on you.',
      min:5, cta:'Reply', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  people.filter(r=>r.status==='ready_to_contact').forEach(r=>{
    out.push({id:'send-'+r.id, tone:'amber',
      title:(r.ai_draft?'Send your first message to ':'Write to ')+(r.name||'them'),
      sub: r.ai_draft ? 'Draft is written and waiting for your review.' : 'You marked them ready. Mighty can draft it.',
      min: r.ai_draft?4:8, cta: r.ai_draft?'Review & send':'Draft it', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  tasks.filter(t=>!t.done).forEach(t=>{
    const overdue = t.due_date && new Date(t.due_date).getTime() < Date.now()-DAY;
    const person = people.find(p=>p.id===t.log_id);
    out.push({id:'task-'+t.id, tone:overdue?'red':'amber', title:t.label,
      sub:(t.sub || (person? person.name : '')) + (t.due_date? (overdue?' · overdue':' · due '+dateShort(t.due_date)) : ''),
      min:5, cta:'Open', taskId:t.id,
      go: person ? {screen:'profile', id:person.id, tab:'notes'} : {screen:'people'}});
  });

  people.filter(r=>['coffee_chat','replied'].indexOf(r.status)>=0).forEach(r=>{
    const met = lastOf(r,['coffee_chat']);
    const note = lastOf(r,['note']);
    if(met && (!note || new Date(note.occurred_at) < new Date(met.occurred_at)) && days(met.occurred_at)<=5)
      out.push({id:'cap-'+r.id, tone:'green', title:'Capture your conversation with '+(r.name||'them'),
        sub:'You met '+ago(met.occurred_at)+' and nothing is written down yet.', min:5, cta:'Add notes',
        go:{screen:'profile', id:r.id, tab:'notes'}});
  });

  people.filter(r=>r.status==='prospect' && !(r.briefing&&r.briefing.careerSummary)).slice(0,2).forEach(r=>{
    out.push({id:'brief-'+r.id, tone:'purple', title:'Understand '+(r.name||'them')+' before you reach out',
      sub:(r.context&&r.context.whySaved) ? r.context.whySaved.slice(0,90) : 'Saved '+(ago(r.shortlisted_at)||'recently')+'. No brief yet.',
      min:6, cta:'Prepare me', go:{screen:'profile', id:r.id, tab:'brief'}});
  });

  const rank = {red:0, amber:1, green:2, purple:3, grey:4};
  out.sort((a,b)=>(rank[a.tone]-rank[b.tone]));
  const plan = out.slice(0,5);
  if(plan.length<5) plan.push({id:'discover', tone:'grey', title:'Find one person worth knowing',
    sub:'Five good people beat fifty saved profiles.', min:3, cta:'Discover', go:{screen:'discover'}});
  return plan;
}
const TONE = {red:'#B5675A', amber:'#D9971C', green:'#22916A', purple:'#5B46E5', grey:'#C4BDB2'};

function Today({people, events, tasks, settings, email, go, onToggleTask, doneToday}){

  const nextMeeting = useMemo(()=>{
    const t = tasks.filter(x=>!x.done && x.due_date && new Date(x.due_date).getTime()>=Date.now()-DAY)
      .sort((a,b)=>new Date(a.due_date)-new Date(b.due_date));
    return t[0]||null;

            <span className="dot" style={{background:TONE[t.tone]}}/>

function Discover({sb, settings, people, onSave, onOpen, go}){
  const [q,setQ]         = useState('');
  const [phase,setPhase] = useState('idle');
  const [results,setRes] = useState([]);
  const [err,setErr]     = useState(null);
  const [notice,setNote] = useState(null);
  const [skipped,setSkip]= useState({});
  const [savingUrl,setSaving] = useState(null);
  const [lastQuery,setLastQ]  = useState('');

  const savedUrls = useMemo(()=>{
    const m = {}; people.forEach(r=>{ m[r.profile_url]=r; }); return m;
  },[people]);
  const examples = useMemo(()=>{
    const role=(settings.targetRoles||[])[0], co=(settings.targetCompanies||[])[0], loc=(settings.targetLocations||[])[0];
    return [
      role&&loc ? role+'s in '+loc : 'Product leaders building AI infrastructure in Boston',
      co&&role  ? role+'s at '+co  : 'Founders who recently raised a seed round',
      loc       ? 'MIT alumni working in '+loc : 'MIT alumni working in venture capital',
    ];
  },[settings]);

  async function run(text){
    const sentence = clean(text!=null?text:q);
    if(!sentence || phase==='searching' || phase==='thinking') return;
    setErr(null); setNote(null); setRes([]); setSkip({}); setPhase('searching'); setLastQ(sentence);
    try{
      const kw = await toKeywords(sb, sentence, settings);
      const {data, error} = await sb.functions.invoke('people-search', {body:{query:kw}});
      if(error) throw error;
      if(!data || data.ok===false){
        if(data && data.error==='not_configured')
          setNote("Web search isn't switched on for this deployment yet, so Discover has nothing to search. The Chrome extension still works: open a LinkedIn profile and save from there.");
        else setErr((data && (data.message||data.error)) || 'Search failed.');
        setPhase('idle'); return;
      }
      const found = (data.people||[]).filter(p=>p && p.profileUrl);
      if(!found.length){
        setNote('Nothing came back for that one. Naming a role and a place works best — "product leaders in Boston" beats "smart people in AI".');
        setPhase('idle'); return;
      }
      setRes(found); setPhase('thinking');
      try{ setRes(await evaluate(sb, found, settings)); }
      catch(e){ setNote('Found these, but Mighty could not explain the matches just now: '+(e.message||'AI unavailable')+'.'); }
      setPhase('done');
    }catch(e){ setErr(e.message||String(e)); setPhase('idle'); }
  }

  const visible = results.filter(r=>!skipped[r.profileUrl]);
  const busy = phase==='searching' || phase==='thinking';

  return (
    <div className="pad fade" style={{maxWidth:860}}>
      <div className="row" style={{gap:12,flexWrap:'wrap'}}>
        <span className="eyebrow b">Your focus</span>
        <span style={{fontSize:15,fontWeight:600,color:'var(--ink2)'}}>
          {settings.goal || GOAL_LABEL[settings.goalType] || 'Build your network'}
        </span>
        <button className="btn q" style={{fontSize:13,padding:0}} onClick={()=>go({screen:'strategy'})}>Edit</button>
      </div>

      <div className="card" style={{marginTop:26,padding:'32px 30px'}}>
        <h2 className="h2">Describe who you want to meet.</h2>
        <div className="sub" style={{marginTop:6}}>One sentence. That's all.</div>
        <div style={{display:'flex',gap:12,marginTop:22,alignItems:'stretch',flexWrap:'wrap'}}>
          <input className="inp" style={{flex:'1 1 240px',minWidth:0}} value={q} placeholder={examples[0]}
            onChange={e=>setQ(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') run(); }}/>
          <button className="btn" style={{flex:'none',padding:'0 30px',borderRadius:'var(--rsm)'}}
            onClick={()=>run()} disabled={busy||!clean(q)}>
            {phase==='searching' ? <span><span className="spin"/> Searching</span>
              : phase==='thinking' ? <span><span className="spin"/> Reading</span> : 'Discover'}
          </button>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:9,marginTop:18}}>
          {examples.map(x=><button key={x} className="chip" onClick={()=>{ setQ(x); run(x); }} disabled={busy}>{x}</button>)}
        </div>
      </div>

      {err && <div className="banner err" style={{marginTop:18}}>{err}</div>}
      {notice && <div className="banner warn" style={{marginTop:18}}>{notice}</div>}

      {results.length>0 &&
        <div>
          <div className="row" style={{marginTop:34,alignItems:'baseline',justifyContent:'space-between',gap:16}}>
            <div className="h4">{visible.length} {visible.length===1?'person':'people'} for "{lastQuery}"</div>
            <div className="meta">Save now, decide later</div>
          </div>
          {phase==='thinking' &&
            <div className="meta" style={{marginTop:10}}><span className="spin"/> Working out why each of these matters to you…</div>}

          {visible.map(r=>{
            const savedRow = savedUrls[r.profileUrl];
            const v = VERDICT[r.verdict]||VERDICT.good;
            return (
              <div key={r.profileUrl} className="card fade" style={{marginTop:14,padding:'22px 24px'}}>
                <div style={{display:'flex',alignItems:'flex-start',gap:14,flexWrap:'wrap'}}>
                  <Avatar name={r.name}/>
                  <div style={{flex:'1 1 200px',minWidth:0}}>
                    <div style={{fontSize:17,fontWeight:700,letterSpacing:'-.015em'}}>{r.name}</div>
                    <div className="sub" style={{fontSize:14,marginTop:2}}>{r.title||'No headline on the profile'}</div>
                    <a href={r.profileUrl} target="_blank" rel="noopener noreferrer"
                      style={{fontSize:13,fontWeight:600,marginTop:4,display:'inline-block'}}>View on LinkedIn</a>
                  </div>
                  <div style={{display:'flex',gap:9,flex:'none'}}>
                    {savedRow
                      ? <button className="btn g sm" onClick={()=>onOpen(savedRow.id)}>Open profile</button>
                      : <F>
                          <button className="btn g sm" style={{color:'var(--sub)'}}
                            onClick={()=>setSkip(s=>({...s,[r.profileUrl]:true}))}>Skip</button>
                          <button className="btn sm" disabled={savingUrl===r.profileUrl}
                            onClick={async()=>{ setSaving(r.profileUrl); await onSave(r, lastQuery); setSaving(null); }}>
                            {savingUrl===r.profileUrl ? <span><span className="spin"/> Saving</span> : 'Save'}
                          </button>
                        </F>}
                  </div>
                </div>
                {r.why &&
                  <div className="why" style={{marginTop:16,padding:'14px 16px'}}>
                    <div className="eyebrow b">{v.label}</div>
                    <div style={{fontSize:14.5,lineHeight:1.55,color:'var(--body)',marginTop:6,textWrap:'pretty'}}>{r.why}</div>
                  </div>}
                {r.common && r.common.length>0 &&
                  <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:14}}>
                    {r.common.map((c,i)=><span key={i} className="tag">{c}</span>)}
                  </div>}
              </div>);
          })}

          {visible.length===0 &&
            <div style={{marginTop:14}}>
              <Empty title="Nothing left in this batch."
                body="Describe another kind of person, or come back tomorrow. Discovery works best a few people at a time."/>
            </div>}
        </div>}
    </div>
  );
}

/* ===================== Relationships ===================== */
function nextAction(r){
  switch(r.status){
    case 'prospect':         return (r.briefing&&r.briefing.careerSummary) ? 'Draft a message' : 'Prepare me';
    case 'ready_to_contact': return r.ai_draft ? 'Review draft' : 'Draft a message';
    case 'contacted':        return days(r.contacted_at)>=7 ? 'Follow up' : 'Waiting on them';
    case 'replied':          return 'Reply';
    case 'coffee_chat':      return 'Capture notes';
    case 'do_not_contact':   return '—';
    default:                 return 'Keep in touch';
  }
}
function Relationships({people, events, view, setView, onOpen, onStage, go}){
  const boardOK = canSee('board', people, events);
  const timeOK  = canSee('timeline', people, events);
  const [dragId,setDrag] = useState(null);
  const [overCol,setOver] = useState(null);

  if(!people.length)
    return <div className="pad fade" style={{maxWidth:720}}>
      <Empty title="No one here yet."
        body="Everyone you save lands here, however you found them — search, the extension, a conference, a referral. Start with one person you genuinely want to know."
        cta="Discover someone" onCta={()=>go({screen:'discover'})}/>
    </div>;

  const feed = events.slice().sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at)).slice(0,60);
  const nameOf = (id)=>{ const p=people.find(x=>x.id===id); return p?(p.name||'Unnamed'):'—'; };

  return (
    <div className="pad fade" style={{maxWidth:1120,paddingTop:34}}>
      <div className="row" style={{justifyContent:'space-between',gap:16,flexWrap:'wrap'}}>
        <div className="seg">
          <button className={view==='list'?'on':''} onClick={()=>setView('list')}>List</button>
          <button className={view==='board'&&boardOK?'on':''} onClick={()=>boardOK&&setView('board')}
            style={boardOK?null:{opacity:.45,cursor:'not-allowed'}} title={boardOK?'':UNLOCKS.board.hint}>Board</button>
          <button className={view==='timeline'&&timeOK?'on':''} onClick={()=>timeOK&&setView('timeline')}
            style={timeOK?null:{opacity:.45,cursor:'not-allowed'}} title={timeOK?'':UNLOCKS.timeline.hint}>Timeline</button>
        </div>
        <div className="sub" style={{fontSize:14}}>{people.length} {people.length===1?'relationship':'relationships'}</div>
      </div>

      {view==='board' && !boardOK && <div className="hint" style={{marginTop:12}}>{UNLOCKS.board.hint}</div>}
      {view==='timeline' && !timeOK && <div className="hint" style={{marginTop:12}}>{UNLOCKS.timeline.hint}</div>}

      {(view==='list' || (view==='board'&&!boardOK) || (view==='timeline'&&!timeOK)) &&
        <div className="card" style={{marginTop:20,overflow:'hidden'}}>
          <div style={{display:'grid',gridTemplateColumns:'1.5fr 1fr .9fr 1fr',gap:20,padding:'14px 24px',
            borderBottom:'1px solid var(--line4)',background:'var(--card2)'}}>
            {['Person','Stage','Last activity','Next best action'].map(h=><div key={h} className="eyebrow">{h}</div>)}
          </div>
          {people.map(r=>{
            const st = stageOf(r);
            return (
              <div key={r.id} onClick={()=>onOpen(r.id)} className="lift"
                style={{display:'grid',gridTemplateColumns:'1.5fr 1fr .9fr 1fr',gap:20,alignItems:'center',
                  padding:'16px 24px',borderBottom:'1px solid var(--line2)',cursor:'pointer'}}>
                <div className="row" style={{gap:12,minWidth:0}}>
                  <Avatar name={r.name} size={34}/>
                  <div style={{minWidth:0}}>
                    <div style={{fontSize:15.5,fontWeight:700,letterSpacing:'-.01em',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.name||'Unnamed'}</div>
                    <div style={{fontSize:13,color:'var(--mute)',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.title||(r.context||{}).whySaved||'Saved profile'}</div>
                  </div>
                </div>
                <div><span className="pill" style={{background:st.bg,color:st.fg}}>{st.label}</span></div>
                <div className="meta">{ago(r.updated_at||r.shortlisted_at)}</div>
                <div style={{fontSize:14,fontWeight:700,color:'var(--brand-ink)'}}>{nextAction(r)}</div>
              </div>);
          })}
        </div>}

      {view==='board' && boardOK &&
        <div style={{marginTop:20,display:'flex',gap:14,overflowX:'auto',paddingBottom:12}}>
          {COLUMNS.map(col=>{
            const items = people.filter(r=>col.statuses.indexOf(r.status)>=0);
            const meta = STAGE[col.statuses[0]];
            return (
              <div key={col.key} style={{width:250,flex:'none'}}
                onDragOver={e=>{ e.preventDefault(); setOver(col.key); }}
                onDragLeave={()=>setOver(o=>o===col.key?null:o)}
                onDrop={e=>{ e.preventDefault(); setOver(null);
                  if(dragId!=null) onStage(people.find(r=>r.id===dragId), col.statuses[0]); setDrag(null); }}>
                <div className="row" style={{gap:8,padding:'0 4px 10px'}}>
                  <span className="dot" style={{background:meta.dot}}/>
                  <span style={{fontSize:13,fontWeight:700}}>{col.label||meta.label}</span>
                  <span className="meta">{items.length}</span>
                </div>
                <div className={'stack'+(overCol===col.key?' drop':'')} style={{gap:10,minHeight:60}}>
                  {items.map(r=>(
                    <div key={r.id} className="colcard" draggable
                      onDragStart={()=>setDrag(r.id)} onDragEnd={()=>setDrag(null)}
                      onClick={()=>onOpen(r.id)}>
                      <div className="row" style={{gap:10}}>
                        <Avatar name={r.name} size={28}/>
                        <div style={{minWidth:0}}>
                          <div style={{fontSize:14.5,fontWeight:700,letterSpacing:'-.01em',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.name||'Unnamed'}</div>
                          <div style={{fontSize:12.5,color:'var(--mute)',marginTop:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.title||''}</div>
                        </div>
                      </div>
                      <div style={{fontSize:13,fontWeight:700,color:'var(--brand-ink)',marginTop:11}}>{nextAction(r)}</div>
                    </div>))}
                </div>
              </div>);
          })}
        </div>}

      {view==='timeline' && timeOK &&
        <div className="card" style={{marginTop:20,padding:'8px 26px 22px',maxWidth:720}}>
          {feed.map(e=>(
            <div key={e.id} style={{display:'grid',gridTemplateColumns:'78px 1fr',gap:18,padding:'16px 0',borderBottom:'1px solid var(--line2)'}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--mute)',paddingTop:1}}>{dateShort(e.occurred_at)}</div>
              <div>
                <div style={{fontSize:15,fontWeight:600,color:'var(--ink2)'}}>
                  {EVENT_LABEL[e.event_type]||e.event_type}
                  {e.event_type==='stage_change' && e.extracted && e.extracted.to
                    ? ' → '+(STAGE[e.extracted.to]||{label:e.extracted.to}).label : ''}
                </div>
                <div className="meta" style={{marginTop:2}}>{nameOf(e.log_id)}{e.note?' · '+e.note.slice(0,90):''}</div>
              </div>
            </div>))}
        </div>}
    </div>
  );
}

/* ===================== Profile ===================== */
const APPROACHES = [
  {id:'warm',      label:'Warm introduction', brief:'built around a shared connection'},
  {id:'curiosity', label:'Curiosity',         brief:'asks about something specific in their work'},
  {id:'shared',    label:'Shared experience', brief:'built on common background'},
  {id:'value',     label:'Value first',       brief:'offers something useful before asking'},
  {id:'coffee',    label:'Coffee chat',       brief:'a short, concrete request to talk'},
];
function Profile({sb, row, events, tasks, settings, people, onBack, onUpdate, onStage, onEvent, onTask, tab, setTab}){
  const ctx = row.context||{};
  const br  = row.briefing||{};
  const st  = stageOf(row);
  const [busy,setBusy]   = useState(null);
  const [toast,setToast] = useState(null);
  const [err,setErr]     = useState(null);
  const [approach,setApproach] = useState('curiosity');
  const [draft,setDraft] = useState(row.ai_draft||'');
  const [noteS,setNoteS] = useState(''); const [noteC,setNoteC] = useState(''); const [noteP,setNoteP] = useState('');
  const mine = events.filter(e=>e.log_id===row.id);
  const memories = Array.isArray(ctx.memories)?ctx.memories:[];
  const myTasks = tasks.filter(t=>t.log_id===row.id && !t.done);

  useEffect(()=>{ setDraft(row.ai_draft||''); }, [row.id]);
  const flash = (m)=>{ setToast(m); setTimeout(()=>setToast(null), 2600); };

  async function makeBrief(){
    setBusy('brief'); setErr(null);
    try{
      const out = await llmJSON(sb, 'profile_briefing',
        'You prepare someone for a first conversation. Use ONLY the facts given — never invent employers, dates, achievements or posts. If you do not know something, leave that field out. Plain language, no scores, no flattery.',
        `About the person doing the outreach:\n${strategyBrief(settings)}\n\nThe person they want to understand:\nName: ${row.name||''}\nHeadline: ${row.title||''}\nCompany: ${row.company||''}\nLocation: ${ctx.location||'unknown'}\nEducation: ${ctx.education||'unknown'}\nProfile text captured: ${clean(ctx.aboutText||ctx.snippet||'').slice(0,900)}\nWhy they were saved: ${ctx.whySaved||'unknown'}\nShared ground noted at save time: ${(ctx.common||[]).join('; ')||'none noted'}\n\nReturn JSON {"careerSummary":"2-3 sentences","whyMatters":"1-2 sentences on why this person matters to THIS user's goal","shared":["real overlap"],"starters":["specific opening, grounded in the facts above"],"avoid":"one thing not to lead with, or omit"}`,
        1000);
      const briefing = {...br, careerSummary:clean(out.careerSummary), whyMatters:clean(out.whyMatters),
        shared:Array.isArray(out.shared)?out.shared:[], conversationStarters:Array.isArray(out.starters)?out.starters:[],
        avoid:clean(out.avoid), builtAt:new Date().toISOString()};
      await onUpdate(row, {briefing});
      flash('Brief ready');
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(null);
  }

  async function makeDraft(){
    setBusy('draft'); setErr(null);
    const a = APPROACHES.find(x=>x.id===approach)||APPROACHES[1];
    try{
      const out = await llmJSON(sb, 'draft_message',
        "You write a real first outreach message for a professional. Ground it ONLY in the given context — never invent shared history, mutual friends, articles or events. Sound like a person, not a template. No flattery, no buzzwords, no 'I hope this finds you well'. Under 110 words. Ask for one specific, easy thing.",
        `The sender:\n${strategyBrief(settings)}\n\nThe recipient:\nName: ${row.name||''}\nHeadline: ${row.title||''}\nCompany: ${row.company||''}\nWhy the sender saved them: ${ctx.whySaved||'unknown'}\nShared ground: ${((br.shared&&br.shared.length?br.shared:ctx.common)||[]).join('; ')||'none confirmed'}\nBrief: ${br.careerSummary||'none'}\nThings the sender has learned about them: ${memories.map(m=>m.value).join('; ')||'nothing captured yet'}\n\nApproach: ${a.label} — ${a.brief}.\n\nReturn JSON {"subject":"short subject line for email use","message":"the message body"}`,
        800);
      setDraft(clean(out.message));
      await onUpdate(row, {ai_draft:clean(out.message), status: row.status==='prospect'?'ready_to_contact':row.status});
      flash('Draft written — you always click send');
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(null);
  }

  async function copyAndOpen(){
    try{ await navigator.clipboard.writeText(draft); }catch(e){}
    window.open(row.profile_url, '_blank', 'noopener');
    if(row.status!=='contacted' && REACHED.indexOf(row.status)<0){
      await onStage(row, 'contacted');
      await onEvent(row, 'first_message', draft.slice(0,400));
    }
    flash('Copied. Paste it, read it once more, then click Send yourself.');
  }

  async function saveCapture(){
    const text = [noteS && noteS, noteC && ('Promises: '+noteC), noteP && ('Worth remembering: '+noteP)]
      .filter(Boolean).join('\n');
    if(!clean(text)) return;
    setBusy('note'); setErr(null);
    try{
      await onEvent(row, 'note', text);
      // Extract memories and promises so capture pays off later. Best effort:
      // a failed extraction must never lose the user's words.
      try{
        const out = await llmJSON(sb, 'coffee_extract',
          'You turn a short note about a professional conversation into structured memory. Extract only what the note actually says. No inference beyond the text.',
          `Note about a conversation with ${row.name||'them'}:\n${text}\n\nReturn JSON {"memories":[{"type":"interest"|"personal"|"fact"|"preference"|"event"|"context"|"shared","value":"short phrase"}],"promises":["something the user owes them"],"followUpDays":number}`,
          800);
        const add = (Array.isArray(out.memories)?out.memories:[]).filter(m=>m&&clean(m.value)).map(m=>({
          id:'m'+Math.random().toString(36).slice(2,9)+Date.now().toString(36),
          type:m.type||'personal', value:clean(m.value), confidence:0.8, status:'confirmed',
          sourceLabel:'Your notes', sourceKind:'user', createdAt:Date.now(), updatedAt:Date.now()}));
        if(add.length) await onUpdate(row, {context:{...ctx, memories:memories.concat(add)}});
        const promises = (Array.isArray(out.promises)?out.promises:[]).filter(Boolean).slice(0,3);
        const dueDays = Number(out.followUpDays)>0 ? Number(out.followUpDays) : 7;
        for(const p of promises)
          await onTask({label:clean(p), sub:'You promised '+(row.name||'them'), log_id:row.id,
            due_date:new Date(Date.now()+dueDays*DAY).toISOString().slice(0,10)});
      }catch(e){}
      setNoteS(''); setNoteC(''); setNoteP('');
      flash('Captured');
    }catch(e){ setErr(e.message||String(e)); }
    setBusy(null);
  }

  const TABS = [['overview','Overview'],['brief','AI Brief'],['draft','Draft message'],['timeline','Timeline'],['notes','Notes']];
  const nextStage = ORDER[Math.min(ORDER.indexOf(row.status)+1, ORDER.length-1)];

  return (
    <div className="pad fade" style={{maxWidth:820,paddingTop:28}}>
      <button className="btn q" style={{padding:'6px 0',display:'flex',alignItems:'center',gap:7}} onClick={onBack}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
        <span>Relationships</span>
      </button>

      <div style={{marginTop:18,display:'flex',alignItems:'flex-start',gap:16,flexWrap:'wrap'}}>
        <Avatar name={row.name} size={52}/>
        <div style={{flex:'1 1 200px',minWidth:0}}>
          <h2 className="h2">{row.name||'Unnamed'}</h2>
          <div className="sub" style={{marginTop:2}}>{row.title||'No headline captured'}</div>
        </div>
        <span className="pill" style={{background:st.bg,color:st.fg,padding:'7px 15px',fontSize:13}}>{st.label}</span>
      </div>

      <div className="row" style={{marginTop:18,gap:10,flexWrap:'wrap'}}>
        <button className="btn sm" onClick={()=>setTab('draft')}>Draft a message</button>
        <button className="btn g sm" onClick={()=>{ setTab('brief'); if(!br.careerSummary) makeBrief(); }}>
          {busy==='brief' ? <span><span className="spin"/> Preparing</span> : 'Prepare me'}
        </button>
        <a className="btn g sm" href={row.profile_url} target="_blank" rel="noopener noreferrer">LinkedIn</a>
        {row.status!=='offer' && row.status!=='do_not_contact' &&
          <button className="btn g sm" onClick={()=>onStage(row, nextStage)}>
            Move to {(STAGE[nextStage]||{}).label}
          </button>}
        {toast && <span style={{fontSize:13.5,fontWeight:600,color:'#0F6B49'}}>{toast}</span>}
      </div>
      {err && <div className="banner err" style={{marginTop:14}}>{err}</div>}

      <div className="tabs" style={{marginTop:26}}>
        {TABS.map(([k,l])=><button key={k} className={tab===k?'on':''} onClick={()=>setTab(k)}>{l}</button>)}
      </div>

      {tab==='overview' &&
        <div className="stack fade" style={{gap:16,marginTop:24}}>
          <div className="card" style={{padding:'22px 24px'}}>
            <div className="eyebrow">Why you saved them</div>
            <div style={{fontSize:16,fontWeight:700,marginTop:7,letterSpacing:'-.01em',textWrap:'pretty'}}>
              {ctx.whySaved || 'Saved from discovery.'}
            </div>
            <div className="sub" style={{fontSize:14,marginTop:4}}>
              {[ctx.savedFrom ? 'Found by searching "'+ctx.savedFrom+'"' : (ctx.source==='search'?'Found through search':'Saved from the extension'),
                'Saved '+(ago(row.shortlisted_at)||'recently')].filter(Boolean).join(' · ')}
            </div>
          </div>

          {[['Company',row.company],['Location',ctx.location],['Education',ctx.education],['Headline',row.title]]
            .filter(x=>x[1]).length>0 &&
            <div className="card" style={{padding:'22px 24px'}}>
              <div className="eyebrow">Professional overview</div>
              <div className="stack" style={{gap:1,marginTop:12}}>
                {[['Company',row.company],['Location',ctx.location],['Education',ctx.education],['Headline',row.title]]
                  .filter(x=>x[1]).map(([k,v],i)=>(
                  <div key={k} style={{display:'grid',gridTemplateColumns:'150px 1fr',gap:18,padding:'9px 0',
                    borderTop:i===0?'none':'1px solid var(--line2)'}}>
                    <div style={{fontSize:13.5,color:'var(--sub)'}}>{k}</div>
                    <div style={{fontSize:14.5,fontWeight:600,color:'var(--ink2)',textWrap:'pretty'}}>{v}</div>
                  </div>))}
              </div>
            </div>}

          {((br.shared&&br.shared.length) || (ctx.common&&ctx.common.length)) &&
            <div className="card" style={{padding:'22px 24px'}}>
              <div className="eyebrow">Shared context</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:12}}>
                {((br.shared&&br.shared.length?br.shared:ctx.common)||[]).map((c,i)=>
                  <span key={i} className="tag" style={{padding:'7px 13px',fontSize:13}}>{c}</span>)}
              </div>
            </div>}

          {memories.length>0 &&
            <div className="card" style={{padding:'22px 24px'}}>
              <div className="eyebrow">Things you've learned</div>
              <div className="stack" style={{gap:9,marginTop:12}}>
                {memories.map(m=>(
                  <div key={m.id} className="row" style={{gap:10,alignItems:'flex-start'}}>
                    <span className="dot" style={{background:'var(--brand)',marginTop:7}}/>
                    <span style={{fontSize:15,color:'var(--body)',lineHeight:1.5}}>{m.value}</span>
                  </div>))}
              </div>
              <div className="hint" style={{marginTop:12}}>Captured by you. Mighty only remembers it.</div>
            </div>}

          {myTasks.length>0 &&
            <div className="card" style={{padding:'22px 24px'}}>
              <div className="eyebrow">Open commitments</div>
              <div className="stack" style={{gap:10,marginTop:12}}>
                {myTasks.map(t=>(
                  <div key={t.id} className="row" style={{gap:12}}>
                    <div style={{flex:1,minWidth:0,fontSize:15,fontWeight:600}}>{t.label}</div>
                    <div className="meta">{t.due_date?dateShort(t.due_date):''}</div>
                  </div>))}
              </div>
            </div>}
        </div>}

      {tab==='brief' &&
        <div className="stack fade" style={{gap:16,marginTop:24}}>
          {!br.careerSummary &&
            <Empty title="No brief yet."
              body="Mighty assembles what it can from the profile and your strategy: why this person matters to your goal, what you have in common, and how to open the conversation. It never invents facts."
              cta={busy==='brief'?'Preparing…':'Prepare me'} onCta={makeBrief}/>}
          {br.whyMatters &&
            <div className="why" style={{padding:'22px 24px'}}>
              <div className="eyebrow b">Why this person matters to you</div>
              <div style={{fontSize:16,lineHeight:1.6,color:'var(--ink2)',marginTop:8,fontWeight:500,textWrap:'pretty'}}>{br.whyMatters}</div>
            </div>}
          {br.careerSummary &&
            <div className="card" style={{padding:'22px 24px'}}>
              <div className="eyebrow">Professional overview</div>
              <div style={{fontSize:15,lineHeight:1.6,color:'var(--body)',marginTop:8,textWrap:'pretty'}}>{br.careerSummary}</div>
            </div>}
          {br.conversationStarters && br.conversationStarters.length>0 &&
            <div className="card" style={{padding:'22px 24px'}}>
              <div className="eyebrow">Conversation starters</div>
              <div className="stack" style={{gap:10,marginTop:12}}>
                {br.conversationStarters.map((s,i)=>(
                  <div key={i} className="row" style={{gap:10,alignItems:'flex-start'}}>
                    <span className="dot" style={{background:'var(--brand)',marginTop:7}}/>
                    <span style={{fontSize:15,color:'var(--body)',lineHeight:1.5}}>{s}</span>
                  </div>))}
              </div>
            </div>}
          {br.avoid &&
            <div className="card" style={{padding:'22px 24px'}}>
              <div className="eyebrow">Don't lead with</div>
              <div style={{fontSize:15,lineHeight:1.6,color:'var(--body)',marginTop:8}}>{br.avoid}</div>
            </div>}
          {br.careerSummary &&
            <div className="row" style={{gap:10,flexWrap:'wrap'}}>
              <button className="btn sm" onClick={()=>setTab('draft')}>Draft a message</button>
              <button className="btn g sm" onClick={makeBrief} disabled={busy==='brief'}>
                {busy==='brief'?<span><span className="spin"/> Refreshing</span>:'Rebuild brief'}
              </button>
              <span className="meta">Built {ago(br.builtAt)||'just now'}</span>
            </div>}
        </div>}

      {tab==='draft' &&
        <div className="fade" style={{marginTop:24}}>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {APPROACHES.map(a=>(
              <button key={a.id} className={'chip'+(approach===a.id?' on':'')} onClick={()=>setApproach(a.id)}>{a.label}</button>))}
          </div>
          <div className="card" style={{marginTop:16,padding:'22px 24px'}}>
            <div className="row" style={{alignItems:'baseline',justifyContent:'space-between',gap:14}}>
              <div className="eyebrow b">Draft · {(APPROACHES.find(a=>a.id===approach)||{}).label}</div>
              <div className="meta">You always click send</div>
            </div>
            {!draft &&
              <div className="stack" style={{gap:14,marginTop:14}}>
                <div className="sub" style={{fontSize:14.5,lineHeight:1.55,textWrap:'pretty'}}>
                  Mighty writes from your strategy, this person's profile, and anything you've captured. Then you edit it,
                  and you send it.
                </div>
                <button className="btn" style={{alignSelf:'flex-start'}} onClick={makeDraft} disabled={busy==='draft'}>
                  {busy==='draft'?<span><span className="spin"/> Writing</span>:'Write the draft'}
                </button>
              </div>}
            {draft &&
              <F>
                <textarea className="inp" style={{marginTop:14,minHeight:180,fontSize:15.5,lineHeight:1.65}}
                  value={draft} onChange={e=>setDraft(e.target.value)}/>
                <div className="row" style={{gap:10,marginTop:16,flexWrap:'wrap'}}>
                  <button className="btn sm" onClick={copyAndOpen}>Copy &amp; open LinkedIn</button>
                  <button className="btn g sm" onClick={()=>onUpdate(row,{ai_draft:draft}).then(()=>flash('Saved'))}>Save draft</button>
                  <button className="btn g sm" onClick={makeDraft} disabled={busy==='draft'}>
                    {busy==='draft'?<span><span className="spin"/> Rewriting</span>:'Rewrite'}
                  </button>
                </div>
                <div className="hint" style={{marginTop:12}}>
                  Copy &amp; open puts the message on your clipboard and opens their profile. Mighty never sends it,
                  and never clicks Connect.
                </div>
              </F>}
          </div>
        </div>}

      {tab==='timeline' &&
        <div className="card fade" style={{marginTop:24,padding:'8px 26px 20px'}}>
          {mine.length===0 &&
            <div style={{padding:'22px 0'}} className="sub">Nothing has happened yet. Saving them was step one.</div>}
          {mine.slice().reverse().map(e=>(
            <div key={e.id} style={{display:'grid',gridTemplateColumns:'76px 1fr',gap:18,padding:'15px 0',borderBottom:'1px solid var(--line2)'}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--mute)'}}>{dateShort(e.occurred_at)}</div>
              <div>
                <div style={{fontSize:15,color:'var(--ink2)',fontWeight:600}}>
                  {EVENT_LABEL[e.event_type]||e.event_type}
                  {e.event_type==='stage_change' && e.extracted && e.extracted.to
                    ? ' → '+(STAGE[e.extracted.to]||{label:e.extracted.to}).label : ''}
                </div>
                {e.note && <div className="sub" style={{fontSize:14,marginTop:3,whiteSpace:'pre-line',textWrap:'pretty'}}>{e.note}</div>}
              </div>
            </div>))}
          <div style={{display:'grid',gridTemplateColumns:'76px 1fr',gap:18,padding:'15px 0'}}>

/* ===================== Ask Mighty ===================== */
function Ask({sb, people, events, tasks, settings, onOpen}){
  const [q,setQ] = useState('');
  const [log,setLog] = useState([]);
  const [busy,setBusy] = useState(false);
  const PROMPTS = ['Who should I reach out to today?','Who have I forgotten?',
    'Which follow-ups are due?','Who is worth a coffee chat?'];

  function digest(){
    const byLog = {};
    events.forEach(e=>{ (byLog[e.log_id]=byLog[e.log_id]||[]).push(e); });
    return people.slice(0,60).map((r,i)=>{
      const ev = byLog[r.id]||[];
      const last = ev.length?ev[ev.length-1]:null;
      const mem = (Array.isArray((r.context||{}).memories)?r.context.memories:[]).map(m=>m.value).slice(0,4);
      return [
        `${i+1}. ${r.name||'Unnamed'} — ${r.title||'no headline'}${r.company?' at '+r.company:''}`,
        `   stage: ${stageOf(r).label}; saved ${ago(r.shortlisted_at)||'recently'}${r.contacted_at?'; contacted '+ago(r.contacted_at):''}`,
        `   why saved: ${(r.context||{}).whySaved || 'not recorded'}`,
        last ? `   last activity: ${EVENT_LABEL[last.event_type]||last.event_type} ${ago(last.occurred_at)}` : '   last activity: nothing yet',
        mem.length ? `   things learned: ${mem.join('; ')}` : '',
      ].filter(Boolean).join('\n');
    }).join('\n');
  }

  async function run(text){
    const question = clean(text!=null?text:q);
    if(!question || busy) return;
    setQ(''); setBusy(true);
    const entry = {q:question, a:null, people:[]};
    setLog(l=>l.concat([entry]));
    const settle = (a, ppl)=>setLog(l=>l.map(x=>x===entry?{...x, a, people:ppl||[]}:x));

    if(!people.length){
      settle("I don't know yet — there's nobody in your network here. Save a few relationships and I'll start recognizing patterns: who has gone quiet, who to reach out to, who to prepare for.");
      setBusy(false); return;
    }
    try{
      const openTasks = tasks.filter(t=>!t.done).map(t=>`- ${t.label}${t.due_date?' (due '+t.due_date+')':''}`).join('\n');
      const out = await llmJSON(sb, 'network_search',
        "You are the user's relationship strategist. Answer ONLY from the network data provided. Never invent people, facts or events. If the data cannot answer the question, say so plainly and say what would make it answerable. Be specific and brief — 2 to 4 sentences. Refer to people by name. Never suggest sending anything automatically; the user always writes and sends.",
        `The user's strategy:\n${strategyBrief(settings)}\n\nToday: ${new Date().toDateString()}\n\nTheir network (${people.length} people):\n${digest()}\n\nOpen commitments:\n${openTasks||'(none)'}\n\nQuestion: ${question}\n\nReturn JSON {"answer":"your answer","people":[{"n":number,"note":"why you named them","action":"the next best action, 2-4 words"}]}. Include people only when naming them helps; at most 5.`,
        1100);
      const refs = (Array.isArray(out.people)?out.people:[]).map(p=>{
        const r = people[Number(p.n)-1];
        return r ? {row:r, note:clean(p.note), action:clean(p.action)} : null;
      }).filter(Boolean);
      settle(clean(out.answer) || "I could not put that into words. Try asking it another way.", refs);
    }catch(e){
      settle('I could not answer that just now: ' + (e.message||String(e)));
    }
    setBusy(false);
  }

  return (
    <div className="pad fade" style={{maxWidth:780,display:'flex',flexDirection:'column',minHeight:'calc(100vh - 66px)',paddingBottom:24}}>
      {log.length===0 &&
        <div>
          <h2 className="h2">Ask anything about your network.</h2>
          <div className="sub" style={{marginTop:6}}>Every answer uses what you've captured about your relationships. Nothing else.</div>
          {people.length===0 &&
            <div className="banner warn" style={{marginTop:20}}>
              There's nobody here yet, so there's nothing honest to answer from. Save a few people first.
            </div>}
        </div>}

      <div className="stack" style={{flex:1,gap:26,marginTop:26}}>
        {log.map((m,i)=>(
          <div key={i} className="fade">
            <div style={{fontSize:18,fontWeight:700,letterSpacing:'-.015em',textWrap:'pretty'}}>{m.q}</div>
            <div className="card" style={{marginTop:12,padding:'20px 22px'}}>
              {m.a===null
                ? <div className="sub"><span className="spin"/> Reading your network…</div>
                : <div style={{fontSize:15.5,lineHeight:1.6,color:'var(--ink2)',textWrap:'pretty'}}>{m.a}</div>}
              {m.people && m.people.length>0 &&
                <div className="stack" style={{gap:2,marginTop:14}}>
                  {m.people.map((p,j)=>(
                    <div key={j} onClick={()=>onOpen(p.row.id)} className="row"
                      style={{gap:13,padding:'11px 0',borderTop:'1px solid var(--line4)',cursor:'pointer'}}>
                      <Avatar name={p.row.name} size={32}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:14.5,fontWeight:700}}>{p.row.name||'Unnamed'}</div>
                        <div className="sub" style={{fontSize:13}}>{p.note}</div>
                      </div>
                      <span style={{fontSize:13.5,fontWeight:700,color:'var(--brand-ink)',flex:'none'}}>{p.action}</span>
                    </div>))}
                </div>}
            </div>
          </div>))}
      </div>

      <div style={{position:'sticky',bottom:0,padding:'20px 0 4px',
        background:'linear-gradient(180deg,rgba(250,249,247,0) 0%,#FAF9F7 26%)'}}>
        <div style={{display:'flex',gap:10}}>
          <input className="inp" style={{flex:1,minWidth:0,background:'#fff'}} value={q}
            placeholder="Who should I reconnect with?"
            onChange={e=>setQ(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') run(); }}/>
          <button className="btn" style={{flex:'none',padding:'0 24px',borderRadius:'var(--rsm)'}}
            onClick={()=>run()} disabled={busy||!clean(q)}>Ask</button>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:12}}>
          {PROMPTS.map(p=><button key={p} className="chip" onClick={()=>run(p)} disabled={busy}>{p}</button>)}
        </div>
      </div>
    </div>
  );
}

/* ===================== auth ===================== */
function Gate({sb}){
  const [mode,setMode] = useState('in');
  const [email,setEmail] = useState(''); const [pw,setPw] = useState('');
  const [busy,setBusy] = useState(false); const [msg,setMsg] = useState(null); const [err,setErr] = useState(null);
  async function go(){
    setErr(null); setMsg(null);
    if(!MIT_RE.test(clean(email))){ setErr('Use your @mit.edu email address.'); return; }
    setBusy(true);
    try{
      if(mode==='up'){
        const {error} = await sb.auth.signUp({email:clean(email), password:pw});
        if(error) throw error;
        setMsg('Account created. Check your @mit.edu inbox for the confirmation link, then sign in.'); setMode('in');
      } else if(mode==='in'){
        const {error} = await sb.auth.signInWithPassword({email:clean(email), password:pw});
        if(error) throw error;
      } else {
        const {error} = await sb.auth.resetPasswordForEmail(clean(email), {redirectTo:location.href});
        if(error) throw error; setMsg('Password reset link sent.');
      }
    }catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{width:'100%',maxWidth:400}}>
        <div className="row" style={{gap:10,marginBottom:26}}>
          <Logo/><span style={{fontSize:20,fontWeight:700,letterSpacing:'-.02em'}}>Mighty</span>
        </div>
        <h2 className="h2">{mode==='up'?'Create your account':mode==='in'?'Welcome back':'Reset your password'}</h2>
        <div className="sub" style={{marginTop:6}}>The operating system for professional relationships.</div>
        <div className="card" style={{marginTop:22,padding:'22px 24px'}}>
          <div className="lbl">MIT email</div>
          <input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)}
            placeholder="you@mit.edu" autoComplete="email"/>
          {mode!=='reset' &&
            <div style={{marginTop:14}}>
              <div className="lbl">Password</div>
              <input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter') go(); }}
                autoComplete={mode==='up'?'new-password':'current-password'}/>
            </div>}
          {err && <div className="banner err" style={{marginTop:14}}>{err}</div>}
          {msg && <div className="banner ok" style={{marginTop:14}}>{msg}</div>}
          <button className="btn" style={{width:'100%',marginTop:18}} onClick={go} disabled={busy}>
            {busy?<span><span className="spin"/> Working…</span>:mode==='up'?'Create account':mode==='in'?'Sign in':'Send reset link'}
          </button>
          <div className="row" style={{justifyContent:'space-between',marginTop:14}}>
            <button className="btn q" style={{fontSize:13.5,padding:0}}
              onClick={()=>{ setMode(mode==='in'?'up':'in'); setErr(null); setMsg(null); }}>
              {mode==='in'?'Create an account':'I already have an account'}
            </button>
            {mode!=='reset' &&
              <button className="btn q" style={{fontSize:13.5,padding:0}} onClick={()=>{ setMode('reset'); setErr(null); }}>Forgot password</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

              <button key={k} className={'chip'+(active(k)?' on':'')} onClick={()=>go({screen:k})}>{label}</button>))}
          </div>
        </header>
        <div style={{flex:1}}>{children}</div>
      </main>
    </div>
  );
}

/* ===================== app ===================== */
function App(){
  const [sb,setSb] = useState(null);
  const [auth,setAuth] = useState({status:'loading', user:null});
  const [blob,setBlob] = useState(null);
  const [people,setPeople] = useState([]);
  const [events,setEvents] = useState([]);
  const [tasks,setTasks] = useState([]);
  const [screen,setScreen] = useState('today');
  const [personId,setPersonId] = useState(null);
  const [tab,setTab] = useState('overview');
  const [relView,setRelView] = useState('list');
  const [editStrategy,setEditStrategy] = useState(false);
  const [busySave,setBusySave] = useState(false);
  const [err,setErr] = useState(null);
  const pulled = useRef(false);

  useEffect(()=>{
    if(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase){
      try{ setSb(window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)); }
      catch(e){ setAuth({status:'unconfigured', user:null}); }
    } else setAuth({status:'unconfigured', user:null});
  },[]);

  useEffect(()=>{
    if(!sb) return;
    let sub;
    const onUser = (u)=>{
      setAuth({status:u?'in':'out', user:u});
      if(u){ if(!pulled.current){ pulled.current=true; pull(u); } }
      else { pulled.current=false; setBlob(null); setPeople([]); setEvents([]); setTasks([]); }
    };
    sb.auth.getSession().then(({data})=>onUser(data.session?.user||null));
    const r = sb.auth.onAuthStateChange((_e,s)=>onUser(s?.user||null));
    sub = r.data?.subscription;
    return ()=>{ sub && sub.unsubscribe(); };
  },[sb]);

  async function pull(u){
    try{
      const {data} = await sb.from('user_data').select('data').eq('user_id',u.id).maybeSingle();
      setBlob((data && data.data) ? data.data : {});
    }catch(e){ setBlob({}); setErr('Could not load your strategy. Working from a blank one.'); }
    await ingest(u);
    await Promise.all([refreshPeople(u), refreshEvents(u), refreshTasks(u)]);
  }

  /* Drain whatever the extension pushed into outreach_inbox. profile_context is
     discarded unless a matching row already exists — the privacy boundary:
     nothing is retained for a profile the user did not deliberately save. */
  async function ingest(u){
    try{
      const {data, error} = await sb.from('outreach_inbox').select('id,kind,payload')
        .eq('user_id',u.id).order('created_at',{ascending:true});
      if(error || !data || !data.length) return 0;
      const consumed = [];
      for(const row of data){
        const p = row.payload||{};
        if(!p.profileUrl){ consumed.push(row.id); continue; }
        try{
          const nowIso = new Date().toISOString();
          if(row.kind==='sent_confirmation'){
            const {data:existing} = await sb.from('outreach_log').select('id,status')
              .eq('user_id',u.id).eq('profile_url',p.profileUrl).maybeSingle();
            if(existing){
              await sb.from('outreach_log').update({status:'contacted', contacted_at:nowIso, updated_at:nowIso}).eq('id',existing.id);
              await sb.from('outreach_events').insert({user_id:u.id, log_id:existing.id, event_type:'stage_change',
                note:null, extracted:{from:existing.status, to:'contacted'}});
            } else {
              await sb.from('outreach_log').upsert({user_id:u.id, profile_url:p.profileUrl, status:'contacted',
                contacted_at:nowIso, updated_at:nowIso}, {onConflict:'user_id,profile_url'});
            }
          } else if(row.kind==='profile_context'){
            const {data:existing} = await sb.from('outreach_log').select('id,context')
              .eq('user_id',u.id).eq('profile_url',p.profileUrl).maybeSingle();
            if(existing){
              // Merge, never replace — the row may already carry location, education
              // and the reason it was saved, and a blind overwrite would lose them.
              const prev = existing.context||{};
              const next = {...prev,
                aboutText:p.aboutText||prev.aboutText||'',
                experienceText:p.experienceText||prev.experienceText||'',
                educationText:p.educationText||prev.educationText||'',
                mutualConnectionsRaw:p.mutualConnectionsRaw||prev.mutualConnectionsRaw||'',
                capturedAt:nowIso};
              if(p.location) next.location = p.location;
              await sb.from('outreach_log').update({context:next, updated_at:nowIso}).eq('id',existing.id);
            }
          } else {
            const ctx = {source:'extension'};
            if(p.why) ctx.whySaved = p.why;
            if(p.location) ctx.location = p.location;
            await sb.from('outreach_log').upsert({user_id:u.id, profile_url:p.profileUrl,
              name:p.name||null, title:p.title||null, company:p.company||null,
              avatar_url:p.avatarUrl||null, context:ctx, updated_at:nowIso}, {onConflict:'user_id,profile_url'});
          }
          consumed.push(row.id);
        }catch(e){ /* likely the weekly-cap trigger — leave it, retried next ingest */ }
      }
      if(consumed.length) await sb.from('outreach_inbox').delete().in('id', consumed);
      return consumed.length;
    }catch(e){ return 0; }
  }
  async function refreshPeople(u){
    try{ const {data} = await sb.from('outreach_log').select('*').eq('user_id',u.id)
      .order('shortlisted_at',{ascending:false}); setPeople(data||[]); }catch(e){}
  }
  async function refreshEvents(u){
    try{ const {data} = await sb.from('outreach_events').select('*').eq('user_id',u.id)
      .order('occurred_at',{ascending:true}); setEvents(data||[]); }catch(e){}
  }
  async function refreshTasks(u){
    try{ const {data} = await sb.from('tasks').select('*').eq('user_id',u.id)
      .order('created_at',{ascending:false}); setTasks(data||[]); }catch(e){}
  }

  const settings = (blob && blob.settings) || {};
  const hasIntent = !!settings.goalType;

  /* Merge-write so keys this app doesn't know (templates, sheets, voiceSamples)
     survive — app/v1.html owns those and both apps share the row. */
  async function saveSettings(patch){
    if(!sb || auth.status!=='in') return;
    setBusySave(true);
    const next = {...(blob||{}), settings:{...settings, ...patch}};
    setBlob(next);
    try{ await sb.from('user_data').upsert({user_id:auth.user.id, data:next, updated_at:new Date().toISOString()}); }
    catch(e){ setErr('Saved on this device, but syncing failed: '+(e.message||'unknown error')); }
    setBusySave(false);
  }

  async function savePerson(p, query){
    if(!sb || auth.status!=='in') return;
    const ctx = {source:'search', savedFrom:query||'', whySaved:p.why||'', common:p.common||[]};
    if(p.verdict) ctx.verdictLabel = (VERDICT[p.verdict]||VERDICT.good).label;
    ['location','education','experience','followers','connections','snippet'].forEach(k=>{ if(p[k]) ctx[k]=p[k]; });
    try{
      await sb.from('outreach_log').upsert({user_id:auth.user.id, profile_url:p.profileUrl,
        name:p.name||null, title:p.title||null, company:p.company||null, context:ctx,
        updated_at:new Date().toISOString()}, {onConflict:'user_id,profile_url'});
      await refreshPeople(auth.user);
    }catch(e){ setErr('Could not save that person: '+(e.message||'unknown error')); }
  }

  async function updateRow(row, fields){
    try{
      await sb.from('outreach_log').update({...fields, updated_at:new Date().toISOString()}).eq('id',row.id);
      await refreshPeople(auth.user);
    }catch(e){ setErr('Could not save that change: '+(e.message||'unknown error')); }
  }
  async function logEvent(row, type, note, extra){
    try{
      await sb.from('outreach_events').insert({user_id:auth.user.id, log_id:row.id, event_type:type,
        note:note||null, ...(extra||{})});
      await refreshEvents(auth.user);
    }catch(e){ setErr('Could not write to the timeline: '+(e.message||'unknown error')); }
  }
  async function changeStage(row, to){
    if(!row || !to || row.status===to) return;
    const fields = {status:to};
    if(to==='contacted' && !row.contacted_at) fields.contacted_at = new Date().toISOString();
    await updateRow(row, fields);
    await logEvent(row, 'stage_change', null, {extracted:{from:row.status, to}});
  }
  async function addTask(t){
    try{
      await sb.from('tasks').insert({user_id:auth.user.id, ...t});
      await refreshTasks(auth.user);
    }catch(e){}
  }
  async function toggleTask(t, done){
    try{
      await sb.from('tasks').update({done, completed_at: done?new Date().toISOString():null}).eq('id',t.id);
      await refreshTasks(auth.user);
    }catch(e){}
  }

  /* The extension deep-links here as /app/?open=<log id>. Honour it once the
     people are loaded, then clear the query so a refresh doesn't re-trigger. */
  const deepLinked = useRef(false);
  useEffect(()=>{
    if(deepLinked.current || !people.length) return;
    const want = new URLSearchParams(window.location.search).get('open');
    if(!want) { deepLinked.current = true; return; }
    const hit = people.find(r=>String(r.id)===String(want));
    deepLinked.current = true;
    if(hit){
      setPersonId(hit.id); setTab('overview'); setScreen('profile');
      window.history.replaceState({}, '', window.location.pathname);
    }
  },[people]);

  /* Coming back from LinkedIn is the moment new extension saves should appear. */
  useEffect(()=>{
    if(auth.status!=='in' || !sb) return;
    const onFocus = ()=>{ pull(auth.user); };
    window.addEventListener('focus', onFocus);
    return ()=>window.removeEventListener('focus', onFocus);
  },[auth.status, sb]);

  const person = useMemo(()=>people.find(r=>r.id===personId)||null, [people, personId]);
  const doneToday = useMemo(()=>tasks.filter(t=>t.done && t.completed_at && days(t.completed_at)<=0), [tasks]);

  function go(target){
    if(!target) return;
    if(target.screen==='profile' && target.id!=null){ setPersonId(target.id); setTab(target.tab||'overview'); }
    if(target.screen==='strategy') setEditStrategy(false);
    if(target.screen!=='profile') setPersonId(null);
    setScreen(target.screen);
    window.scrollTo({top:0});
  }
  const openPerson = (id, t)=>go({screen:'profile', id, tab:t||'overview'});

  if(auth.status==='loading')
    return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><span className="spin"/></div>;
  if(auth.status==='unconfigured')
    return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div className="card" style={{padding:'30px 32px',maxWidth:420}}>
        <div className="h3">Mighty isn't set up yet.</div>
        <div className="sub" style={{marginTop:6}}>The Supabase project details are missing from this build.</div>
      </div></div>;
  if(auth.status!=='in') return <Gate sb={sb}/>;
  if(blob===null)
    return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><span className="spin"/></div>;

  /* No strategy, no product. Strategy is the first thing, before anything can be personal. */
  if(!hasIntent)
    return <StrategyForm settings={settings} busy={busySave} firstRun
      onSave={async(p)=>{ await saveSettings(p); go({screen:'discover'}); }}/>;

  const signOut = async()=>{ await sb.auth.signOut(); window.location.href='../'; };

  return (
    <Shell screen={screen} go={go} savedCount={people.length} email={auth.user.email} onSignOut={signOut}>
      {err && <div className="banner warn" style={{margin:'20px 48px 0'}}>{err}</div>}

      {screen==='today' &&
        <Today people={people} events={events} tasks={tasks} settings={settings} email={auth.user.email}
          go={go} onToggleTask={toggleTask} doneToday={doneToday}/>}

      {screen==='strategy' && !editStrategy &&
        <StrategyView settings={settings} people={people} onEdit={()=>setEditStrategy(true)}/>}
      {screen==='strategy' && editStrategy &&
        <StrategyForm settings={settings} busy={busySave}
          onSave={async(p)=>{ await saveSettings(p); setEditStrategy(false); }}
          onCancel={()=>setEditStrategy(false)}/>}

      {screen==='discover' &&
        <Discover sb={sb} settings={settings} people={people} onSave={savePerson} onOpen={openPerson} go={go}/>}

      {screen==='people' &&
        <Relationships people={people} events={events} view={relView} setView={setRelView}
          onOpen={openPerson} onStage={changeStage} go={go}/>}

      {screen==='profile' && person &&
        <Profile sb={sb} row={person} events={events} tasks={tasks} settings={settings} people={people}
          onBack={()=>go({screen:'people'})} onUpdate={updateRow} onStage={changeStage}
          onEvent={logEvent} onTask={addTask} tab={tab} setTab={setTab}/>}
      {screen==='profile' && !person &&
        <Relationships people={people} events={events} view={relView} setView={setRelView}
          onOpen={openPerson} onStage={changeStage} go={go}/>}

      {screen==='ask' &&
        <Ask sb={sb} people={people} events={events} tasks={tasks} settings={settings} onOpen={openPerson}/>}

      {screen==='extension' && <Extension/>}

      {screen==='settings' &&
        <Settings email={auth.user.email} settings={settings} people={people} events={events} tasks={tasks}
          go={go} onSignOut={signOut}/>}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
