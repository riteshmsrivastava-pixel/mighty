              <Avatar name={hero.title.replace(/^(Reply to|Send your first message to|Write to|Follow up with|Capture your conversation with|Understand)\s*/,'').replace(/ before you reach out$/,'')}
                size={40} src={people.find(p=>hero.go&&p.id===hero.go.id)&&people.find(p=>hero.go&&p.id===hero.go.id).avatar_url}/>
              <div style={{flex:'1 1 240px',minWidth:0}}>
                <div className="eyebrow" style={{color:'var(--green)'}}>Start here</div>
                <div style={{fontSize:19,fontWeight:800,letterSpacing:'-.015em',marginTop:2,fontFamily:'var(--f-head)'}}>{hero.title}</div>
                <div className="sub" style={{fontSize:13.5,marginTop:2}}>{hero.sub} · {hero.min} min</div>
              </div>
              <button className="btn" style={{flex:'none'}} onClick={()=>go(hero.go)}>{HERO_VERB[hero.cta]||hero.cta}</button>
            </div>}

          {askPrompts.length>0 &&
            <div className="row" style={{gap:10,flexWrap:'wrap',alignItems:'center',marginTop:20}}>
              <span className="sub" style={{fontSize:13.5,fontWeight:600}}>What do you need?</span>
              {askPrompts.map(s=>(
                <button key={s} className="chip" onClick={()=>go({screen:'ask', ask:s})}>{s}</button>))}
            </div>}
        </div>
      </div>

      <div className="pad" style={{maxWidth:1280,paddingTop:30}}>
        {/* Ambiguous reply/accept matches ingest() deliberately did not guess at - two or more
           saved people share the name the extension read off LinkedIn. Small, time-boxed, easy
           to skip, per the spec: this is the one new UI surface passive detection needed. */}
        {pendingActivity && pendingActivity.length>0 &&
          <div className="stack" style={{gap:10,marginBottom:20}}>
            {pendingActivity.map(row=>{
              const p = row.payload||{};
              const candidates = (p.candidates||[]).map(url=>people.find(x=>x.profile_url===url)).filter(Boolean);
              if(!candidates.length) return null;
              const verb = row.kind==='reply_detected' ? 'replied to you' : 'accepted your invitation to connect';
              return (
                <div key={row.id} className="card" style={{padding:'16px 20px',display:'flex',gap:14,
                  alignItems:'center',flexWrap:'wrap',background:'var(--brand-soft)',borderColor:'var(--brand-line)'}}>
                  <div style={{flex:'1 1 240px',minWidth:0}}>
                    <div style={{fontSize:14.5,fontWeight:700,color:'var(--ink)'}}>
                      Someone named {p.name||'a saved connection'} {verb} on LinkedIn - which one?
                    </div>
                    <div className="sub" style={{fontSize:13,marginTop:2}}>
                      More than one saved person shares that name.
                    </div>
                  </div>
                  <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                    {candidates.map(c=>(
                      <button key={c.id} className="btn sm" onClick={()=>onResolveActivity(row, c.profile_url)}>

                  </div>

        {rest.length>0 &&
          <F>
            <div className="eyebrow b">Then</div>
            <div className="card" style={{marginTop:10,overflow:'hidden'}}>
              {rest.map(t=>(

                    color: isHighImpact(t)?'var(--red)':'var(--brand-ink)'}}>{isHighImpact(t)?'HIGH IMPACT':'GOOD NEXT'}</span>

                  </div>
                  <span className="meta" style={{flex:'none'}}>{t.min} min</span>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--mute)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flex:'none'}}><path d="M9 6l6 6-6 6"/></svg>
                </div>))}
            </div>
          </F>}

        {people.length>0 &&
          <div style={{marginTop:rest.length>0?22:0}}><GoalStrip people={people} events={events} settings={settings}/></div>}

        {allDone &&
          <div className="card" style={{marginTop:14,padding:'34px 26px 38px'}}>
            <div className="h3">You are all caught up.</div>
            <div className="sub" style={{marginTop:6}}>You have done today's recommended actions.</div>
            <button className="btn" style={{marginTop:20}} onClick={()=>go({screen:'relationships'})}>Find someone new</button>
          </div>}

        {doneToday.length>0 &&
          <div className="card" style={{marginTop:14,overflow:'hidden'}}>
            {doneToday.map(t=>(
              <div key={'d'+t.id} className="row" style={{gap:16,padding:'15px 26px',borderBottom:'1px solid var(--line2)',background:'var(--card2)'}}>

                <div className="meta">Completed {ago(t.completed_at)||'today'}</div>
                <button className="btn q" style={{fontSize:13,padding:0}} onClick={()=>onToggleTask(t,false)}>Undo</button>

          </div>}

        {nextMeeting &&
          <div className="fade" style={{marginTop:32}}>
            <div className="eyebrow">Upcoming</div>
            <div className="card row" style={{marginTop:12,padding:'18px 22px',gap:16}}>
              <div style={{flex:1,minWidth:0}}>
                <div className="h4">{nextMeeting.label}</div>
                <div className="sub" style={{fontSize:14,marginTop:3}}>{dateShort(nextMeeting.due_date)}</div>
              </div>
              <button className="btn g sm" onClick={()=>{
                const p = people.find(x=>x.id===nextMeeting.log_id);
                go(p ? {screen:'profile', id:p.id, tab:'brief'} : {screen:'relationships'});
              }}>Open brief</button>
            </div>
          </div>}
      </div>
    </div>
  );
}

/* ===================== Relationships =====================
   One list, one question: where am I with everyone. It used to be two
   screens - Discover for people not yet saved, Relationships for people who
   were - and that split forced a user to decide which kind of person they
   were thinking about before they could even look. They rarely know; a name
   that comes to mind is just a name, saved or not.

   So one search box now does both jobs. Empty, it groups everyone already
   saved by what is true about them right now - reply needed first, because
   nothing else is more urgent than a person who took the time to answer -
   and closes with the people Mighty thinks are worth adding, ranked the same
   way Discover used to rank them. Typed into, it filters the saved list AND
   searches the user's own connections at once, because "who is Priya" should
   not care whether Priya was already added.

   Three ways in, in the order they are actually useful, survive from the old
   Discover:
   1. An open box over the user's OWN connections - no keyword extraction, no
      model call, because the answer is already in the database.
   2. LinkedIn, for people the user is not connected to - the expensive path,
      and the explicit second choice, offered only once the first comes up
      empty.
   3. The ranking nobody asked for: dormancy, goal fit, shared history. */

/* Words that carry no retrieval signal.
   Two-letter terms are KEPT, because AI, VC, ML and PM are the shortest and most
   important words anyone will type here. That means the stop list has to carry
   the short function words itself rather than leaning on a length cut-off: an
   earlier version filtered anything under three characters, which threw away AI
   and VC while happily keeping "and". */
const Q_STOP = new Set([
  // function words, including the short ones a length filter used to catch
  'a','an','the','and','or','of','in','on','at','to','is','it','as','by','be','if','so','do','my','me',
  'we','us','he','so','no','up','all','any','are','was','has','had','can','not','but','for','you','your',
  'yours','who','whom','what','when','where','which','while','with','from','that','this','these','those',
  'they','them','their','there','then','than','been','into','also','over','under','after','before','more',
  'most','much','many','some','such','only','just','very','ever','even','same','other','others','would',
  'could','should','will','here','out','how','why','get','got','give','given','take','taken','make','made',
  'use','used','using','per','via','yet','far','now','off','own','see','say','set','due','one','two',
  // words about the search rather than the person
  'anyone','anybody','people','folks','person','someone','somebody','looking','look','find','found',
  'about','like','want','wants','need','needs','know','knows','help','helps','best','good','ones',
  'companies','company','working','works','work','worked']);

function queryTerms(text){
  /* Alphanumeric only, deliberately. Terms go into a Postgres regex on the other
     side, and a stray + or * there is either a syntax error or a silent wrong
     match. Stripping the characters here is safer than escaping them there. */
  const seen = {}, out = [];
  String(text||'').toLowerCase().split(/[^a-z0-9]+/).forEach(w=>{
    if(w.length < 2 || Q_STOP.has(w) || seen[w]) return;
    seen[w] = 1; out.push(w);
  });
  return out.slice(0, 10);
}

/* The terms the ranking searches on when the user has not asked anything. Roles
   and companies and places the user named in their strategy come first because
   they were stated rather than inferred; words from the goal sentence fill in. */
function goalTerms(settings){
  const s = settings || {};
  const named = [].concat(s.targetRoles||[], s.targetCompanies||[], s.targetLocations||[])
    .join(' ');
  return queryTerms(named + ' ' + (s.goal||''));
}

/* Every employer the user has had, so "was there while you were" is checkable.
   Reads the Knowledge Base the archive filled in, and falls back to whatever the
   strategy form knows if there is no archive. */
function ownCompanies(settings){
  const s = settings || {}, kb = s.knowledge || {};
  const fromKb = (kb.positions||[]).map(p=>p && p.company).filter(Boolean);
  const all = fromKb.concat([s.currentCompany].filter(Boolean));
  const seen = {}, out = [];
  all.forEach(c=>{ const k = String(c).toLowerCase().trim();
    if(k && !seen[k]){ seen[k]=1; out.push(String(c).trim()); } });
  return out.slice(0, 25);
}

function connName(c){
  return clean([c.first_name, c.last_name].filter(Boolean).join(' ')) || 'Unnamed connection';
}

/* Why this person is in front of you, in words, from the three signals the
   database can actually support. Never more than two clauses: a reason nobody
   reads is the same as no reason. */
function connReason(c){
  const bits = [];
  if(c.shared_company) bits.push('Was at ' + c.shared_company + ' while you were');
  if(c.hits && c.hits.length) bits.push('Matched on ' + c.hits.slice(0,3).join(', '));
  const yrs = Number(c.years_silent || 0);
  if(bits.length < 2 && c.connected_on && yrs >= 2){
    bits.push('Connected ' + String(c.connected_on).slice(0,4) + ', nothing since');
  }
  return bits.slice(0,2).join('. ') + (bits.length ? '.' : '');
}

/* Turn a connections row into the shape savePerson already understands, so
   adding from your own network and adding from a search write the same row. */
function connToPerson(c){
  return {
    profileUrl: c.profile_url,
    name: connName(c),
    title: clean(c.position) || null,
    company: clean(c.company) || null,
    why: connReason(c),
    common: (c.hits||[]).slice(0,4),
    connectedOn: c.connected_on || null,
    avatarUrl: c.avatar_url || null,
  };
}

/* Relationship caps per plan. The database is authoritative (ai_config), these
   are the same defaults so the number can be shown without a round trip. */
const PLAN_CAPS = {trial:50, starter:100, plus:200, pro:500, explorer:100, builder:200, leader:500};

async function matchConnections(sb, terms, ownCos, limit){
  const {data, error} = await sb.rpc('connections_match', {
    p_terms: terms || [], p_own_companies: ownCos || [], p_limit: limit || 12});
  if(error) throw error;
  return data || [];
}

function nextAction(r){
  switch(r.status){
    case 'prospect':         return (r.briefing&&r.briefing.careerSummary) ? 'Draft a message' : 'Prepare me';
    case 'ready_to_contact': return r.ai_draft ? 'Review draft' : 'Draft a message';
    case 'contacted':        return days(r.contacted_at)>=10 ? 'Follow up' : 'Waiting on them';
    case 'replied':          return 'Reply';
    case 'coffee_chat':      return 'Capture notes';
    /* referral/interview/offer are merged into one Board column ("Growing")
       but fell through to the same 'Keep in touch' default as a dormant
       contact, making an active interview or open offer visually
       indistinguishable from someone gone quiet. Capture notes is a real
       action that already exists (the Notes tab), not an invented one. */
    case 'referral': case 'interview': case 'offer': return 'Capture notes';
    case 'do_not_contact':   return ' - ';
    default:                 return 'Keep in touch';
  }
}

/* Decision Memory: the reason behind a save or a pass is worth more than the
   save or pass itself - it is judgment, not activity. Kept deliberately
   optional (a dismissible chip row, never a gate in front of the action) and
   deliberately small (one enum choice, no free text) so it costs nothing to
   answer and nothing to skip. */
const SAVE_REASONS = [
  {id:'customer',   label:'Potential customer'},
  {id:'investor',   label:'Investor'},
  {id:'mentor',     label:'Mentor'},
  {id:'recruiter',  label:'Recruiter'},
  {id:'partner',    label:'Partner'},
  {id:'friend',     label:'Friend'},
  {id:'other',      label:'Other'},
];
const SKIP_REASONS = [
  {id:'too_junior',      label:'Too junior'},
  {id:'wrong_industry',  label:'Wrong industry'},
  {id:'no_overlap',      label:'No overlap'},
  {id:'not_now',         label:'Not now'},
  {id:'already_know',    label:'Already know them'},
];
function ReasonChips({prompt, options, onPick, onDismiss}){
  return (
    <div className="row" style={{gap:6,flexWrap:'wrap',alignItems:'center'}}>
      <span className="meta" style={{marginRight:2,flex:'none'}}>{prompt}</span>
      {options.map(o=>(
        <button key={o.id} className="chip" style={{fontSize:12,padding:'4px 10px'}} onClick={()=>onPick(o.id)}>{o.label}</button>))}
      <button className="btn q" style={{fontSize:12,padding:0,color:'var(--mute)'}} onClick={onDismiss}>Skip this</button>
    </div>
  );
}
function Relationships({sb, settings, people, events, tasks, view, setView, plan, onSave, onOpen, onStage, onDelete, onUpdate, go}){
  const boardOK = canSee('board', people, events);
  const timeOK  = canSee('timeline', people, events);
  const [dragId,setDrag] = useState(null);
  const [overCol,setOver] = useState(null);
  /* List's select/delete - a Set so toggling one row's checkbox never has to
     rebuild an array, and membership checks (is this row selected) stay O(1)
     while the list re-renders on every keystroke of the search box above. */
  const [selected,setSelected] = useState(()=>new Set());
  const toggleSelect = (id)=>setSelected(s=>{ const n=new Set(s); if(n.has(id)) n.delete(id); else n.add(id); return n; });

  /* ---- the search box: filters who is saved, and finds who is not ---- */
  const [q,setQ]           = useState('');
  const [total,setTotal]   = useState(null);
  const [sugg,setSugg]     = useState(null);
  const [suggBusy,setSB]   = useState(true);
  const [mine,setMine]     = useState(null);
  const [mineBusy,setMB]   = useState(false);
  /* One box, three destinations - see classifyAsk(). Settled on the same
     380ms debounce the local-network match already waits on below, so
     typing "who" while working toward "who should I follow up with" does
     not flash into question-mode and back on every keystroke. */
  const [intent,setIntent] = useState({type:'search'});
  /* A Set, not a single value - saving is a shared state across every row
     on screen (worth-adding + web search results can both be visible at
     once), and one scalar meant starting a second save cleared the first
     row's in-flight flag early, re-enabling its Add button mid-request. */
  const [savingUrls,setSavingUrls] = useState(()=>new Set());
  const startSaving = (url)=>setSavingUrls(s=>new Set(s).add(url));
  const stopSaving = (url)=>setSavingUrls(s=>{ const n=new Set(s); n.delete(url); return n; });

  /* ---- LinkedIn, the fallback for someone not in the user's own network ---- */
  const [webOpen,setWebOpen] = useState(false);
  const [webQ,setWebQ]     = useState('');
  const [phase,setPhase]   = useState('idle');
  const [results,setRes]   = useState([]);
  const [webErr,setWebErr] = useState(null);
  const [notice,setNote]   = useState(null);
  const [skipped,setSkip]  = useState({});
  /* {profileUrl, kind:'save'|'skip', rowId} of whichever row is currently
     showing its optional reason chips - one at a time is plenty, and it
     collapses to null (no prompt shown) the moment a choice is made or
     dismissed. */
  const [reasonPrompt,setReasonPrompt] = useState(null);
  function finishSkip(profileUrl, reasonId){
    if(reasonId) track('candidate_skipped', {reason:reasonId});
    setSkip(s=>({...s,[profileUrl]:true}));
    setReasonPrompt(null);
  }
  async function finishSaveReason(row, reasonId){
    if(row && reasonId){
      try{ await onUpdate(row, {context:{...(row.context||{}), saveReason:reasonId}}); }catch(e){}
      track('save_reason_picked', {reason:reasonId});
    }
    setReasonPrompt(null);
  }
  const [lastQuery,setLastQ] = useState('');
  const [noExt,setNoExt]   = useState(false);

  const savedUrls = useMemo(()=>{
    const m = {}; people.forEach(r=>{ if(r.profile_url) m[r.profile_url.toLowerCase()]=r; }); return m;
  },[people]);
  const cap = PLAN_CAPS[plan||'trial'] || 50;
  const atCap = people.length >= cap;
  const terms = useMemo(()=>goalTerms(settings),[settings]);
  const ownCos = useMemo(()=>ownCompanies(settings),[settings]);
  const byLog = useMemo(()=>{
    const m = {}; events.forEach(e=>{ (m[e.log_id]=m[e.log_id]||[]).push(e); }); return m;
  },[events]);

  /* The ranking loads on arrival, because a screen that asks you to press a
     button before it shows you anything has not answered its own question. */
  useEffect(()=>{
    let dead = false;
    (async()=>{
      setSB(true);
      try{
        const {data:n} = await sb.rpc('connections_count');
        if(!dead) setTotal(Number(n||0));
        const rows = await matchConnections(sb, terms, ownCos, 8);
        if(!dead){ setSugg(rows); track('discover_ranked', {returned:rows.length, terms:terms.length}); }
      }catch(e){ if(!dead) setSugg([]); }
      if(!dead) setSB(false);
    })();
    return ()=>{ dead = true; };
  },[sb, terms.join(' '), ownCos.join(' ')]);

  /* Typing searches the user's own connections as they go, debounced so every
     keystroke does not round-trip. */
  useEffect(()=>{
    const sentence = clean(q);
    if(sentence.length<2){ setMine(null); setIntent({type:'search'}); return; }
    let dead = false; setMB(true);
    const t = setTimeout(async()=>{
      const cl = classifyAsk(sentence);
      if(!dead) setIntent({...cl, text:sentence});
      /* A question or an event query is not a person to look up - Ask has its
         own network read, and event search has no local-match story yet, so
         neither one needs (or should trigger) this lookup. */
      if(cl.type!=='search'){ if(!dead){ setMine(null); setMB(false); } return; }
      try{
        const qt = queryTerms(sentence);
        const rows = await matchConnections(sb, qt, [], 8);
        if(!dead){
          setMine({q:sentence, terms:qt, rows}); track('discover_own_search', {terms:qt.length, results:rows.length});
          /* The LinkedIn export this table is built from has no photo column
             at all, so every connection starts as initials - not just the
             ones surfaced by a search. Same fill-in as the wider search
             results below: one profile read per person, through the
             extension's own globally-throttled queue (3s apart, capped at
             25/session), patched in as each resolves. */
          rows.forEach(c=>{
            extBridge.photo(c.profile_url).then(r=>{
              if(dead || !r || !r.ok || !r.dataUrl) return;
              setMine(prev=>prev && prev.q===sentence
                ? {...prev, rows:prev.rows.map(x=>x.profile_url===c.profile_url?{...x, avatar_url:r.dataUrl}:x)}
                : prev);
            }).catch(()=>{});
          });
        }
      }catch(e){ if(!dead) setMine({q:sentence, terms:[], rows:[]}); }
      if(!dead) setMB(false);
    }, 380);
    return ()=>{ dead = true; clearTimeout(t); };
  },[q, sb]);

  /* "Who do I already know" and "who don't I know yet" used to be two
     separate questions - the second only ran if you noticed a button and
     clicked it again. They are one question with two answers, so once the
     sentence settles, both run. A longer pause than the local match above
     (900ms vs 380ms) keeps a sentence that is still being typed from firing
     three overlapping Google searches. autoRun tracks the exact sentence
     already sent, so re-settling on an unchanged query does not search
     twice, and so an explicit click on "Search LinkedIn for this" is not
     redone by this effect a moment later. */
  const autoRun = useRef('');
  useEffect(()=>{
    const sentence = clean(q);
    if(sentence.length<3) return;
    /* A question or an event query never reaches LinkedIn - see classifyAsk.
       Ask has its own network read; event search has nothing to search yet. */
    if(classifyAsk(sentence).type!=='search') return;
    const t = setTimeout(()=>{
      if(autoRun.current===sentence) return;
      if(phase==='searching' || phase==='thinking') return;
      autoRun.current = sentence;
      run(sentence);
    }, 900);
    return ()=>clearTimeout(t);
  },[q]);

  async function run(text){
    const sentence = clean(text!=null?text:webQ);
    if(!sentence || phase==='searching' || phase==='thinking') return;
    setWebErr(null); setNote(null); setNoExt(false); setRes([]); setSkip({});
    setPhase('searching'); setLastQ(sentence); setWebQ(sentence); setWebOpen(true);
    try{
      const kw = await toKeywords(sb, sentence, settings);

      /* Ask the extension first. It reads the results page itself, so it comes
         back with location, education, experience and follower counts - the API
         path returns a title and a link and nothing else. Fall back to the edge
         function only when the extension is not installed. */
      let found = [], via = 'ext';
      const bridged = await extBridge.search(kw);
      if(bridged && bridged.ok){
        found = (bridged.people||[]).filter(p=>p && p.profileUrl);
      } else if(bridged && bridged.error==='blocked'){
        track('search_blocked', {});
        setWebErr('Search is rate limited right now, so results would be incomplete. Try again in a few minutes.');
        setPhase('idle'); return;
      } else {
        const {data, error} = await sb.functions.invoke('people-search', {body:{query:kw}});
        if(error) throw error;
        if(!data || data.ok===false){
          if(data && data.error==='not_configured') setNoExt(true);
          else setWebErr((data && (data.message||data.error)) || 'Search failed.');
          setPhase('idle'); return;
        }
        found = (data.people||[]).filter(p=>p && p.profileUrl);
        via = 'api';
      }
      track('search_run', {via, results:found.length,
        with_facts: found.filter(p=>p.location||p.education).length});

      if(!found.length){
        setNote('Nothing for that one. A role and a place works best: "product leaders in Boston" beats "smart people in AI".');
        setPhase('idle'); return;
      }
      setRes(found); setPhase('thinking');
      try{ setRes(await evaluate(sb, found, settings)); }
      catch(e){ setNote('Found these, but Mighty could not explain the matches just now: '+(e.message||'AI unavailable')+'.'); }
      setPhase('done');

      /* Google never returns a photo for a site:linkedin.com/in query - only
         a name and a link - so every fresh result starts as initials. Filling
         them in means reading each profile once, which is exactly what the
         extension's photo fetch already exists for. It is fired here for the
         whole batch, but it queues through the extension's own single global
         chain (fetchProfilePhotoInner in background.js), so this is still one
         photo every 3 seconds and still capped at 25 for the session - the
         same guard that already protects the Profile page's manual button,
         just aimed at a batch instead of one click at a time. Started only
         after evaluate() above has already settled results, so an early
         photo cannot be wiped out by evaluate()'s own setRes(...) landing
         later. Best-effort and silent: a slow or missing photo just stays
         initials, never an error the person has to see. */
      found.forEach(person=>{
        extBridge.photo(person.profileUrl).then(r=>{
          if(r && r.ok && r.dataUrl){
            setRes(prev=>prev.map(x=>x.profileUrl===person.profileUrl?{...x, avatarUrl:r.dataUrl}:x));
          }
        }).catch(()=>{});
      });
    }catch(e){ setWebErr(e.message||String(e)); setPhase('idle'); }
  }

  const visible = results.filter(r=>!skipped[r.profileUrl]);
  const webBusy = phase==='searching' || phase==='thinking';

  /* One row, used by the search results and the ranking, so a person you
     found and a person Mighty suggested cannot drift apart visually. */
  function ConnRow({c}){
    const saved = savedUrls[(c.profile_url||'').toLowerCase()];
    const reason = connReason(c);
    return (
      <div className="row" style={{alignItems:'flex-start',gap:13,padding:'14px 0',borderBottom:'1px solid var(--line2)'}}>
        <Avatar name={connName(c)} size={34} src={c.avatar_url} hover={c}/>
        <div style={{flex:'1 1 200px',minWidth:0}}>
          <div style={{fontSize:15,fontWeight:700}}>{connName(c)}</div>
          <div className="sub" style={{fontSize:13.5,marginTop:1}}>
            {[clean(c.position), clean(c.company)].filter(Boolean).join(' · ') || 'No role on the export'}
          </div>
          {reason && <div style={{fontSize:13,color:'var(--brand-ink)',marginTop:4,lineHeight:1.5}}>{reason}</div>}
        </div>
        <div style={{display:'flex',gap:8,flex:'none',alignItems:'center'}}>
          {saved
            ? <button className="btn g sm" onClick={()=>onOpen(saved.id)}>Open</button>
            : <F>
                <button className="btn sm" disabled={atCap || savingUrls.has(c.profile_url)}
                  onClick={async()=>{ startSaving(c.profile_url); try{ await onSave(connToPerson(c), 'own_network'); }finally{ stopSaving(c.profile_url); } }}>
                  {savingUrls.has(c.profile_url) ? <span><span className="spin"/> Adding</span> : 'Add'}
                </button>
                <button className="btn q" style={{fontSize:13}}
                  onClick={()=>setSugg(s=>(s||[]).filter(x=>x.profile_url!==c.profile_url))}>Skip</button>
              </F>}
        </div>
      </div>
    );
  }

  /* One row for someone already saved, used by every stage group below. Reply
     needed is the one case that gets a warmer background - the whole point of
     grouping is that this row should never be mistaken for a quiet one. */
  function Row({r, hot}){
    const label = nextAction(r);
    const statusOnly = label==='Waiting on them' || label==='Keep in touch' || label===' - ';
    const checked = selected.has(r.id);
    return (
      <div onClick={()=>onOpen(r.id)} className="lift"
        style={{display:'flex',alignItems:'center',gap:16,padding:'15px 24px',
          borderBottom:'1px solid var(--line2)',cursor:'pointer',
          background: checked ? 'var(--brand-soft)' : (hot ? 'var(--red-soft)' : 'none')}}>
        <input type="checkbox" checked={checked} onClick={e=>e.stopPropagation()}
          onChange={()=>toggleSelect(r.id)} style={{flex:'none',width:16,height:16,cursor:'pointer'}}/>
        <Avatar name={r.name} size={34} src={r.avatar_url} hover={r}/>
        <div style={{flex:'1 1 220px',minWidth:0}}>
          <div className="row" style={{gap:7}}>
            <div style={{fontSize:15.5,fontWeight:700,letterSpacing:'-.01em',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.name||'Unnamed'}</div>
            <ConnectedBadge r={r} size="sm"/>
          </div>
          <div style={{fontSize:13,color:'var(--mute)',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.title||(r.context||{}).whySaved||'Saved profile'}</div>
        </div>
        <div className="meta" style={{flex:'none'}}>{ago(r.updated_at||r.shortlisted_at)}</div>
        <span style={{fontSize:12.5,fontWeight:700,flex:'none',borderRadius:999,whiteSpace:'nowrap',
          padding: statusOnly ? '5px 12px' : '6px 13px',
          color: statusOnly ? 'var(--mute)' : '#fff',
          background: statusOnly ? 'var(--line2)' : (hot?'#C75B33':'var(--brand)')}}>{label}</span>
      </div>);
  }

  const searching = clean(q).length>=2;
  const needle = clean(q).toLowerCase();
  const filtered = useMemo(()=>{
    if(!searching) return people;
    return people.filter(r=>[r.name,r.title,r.company].filter(Boolean).join(' ').toLowerCase().indexOf(needle)>=0);
  },[people, searching, needle]);

  /* Three tiers, not six stage-groups: one single top recommendation (the
     same ranking Today's hero uses), everyone who needs a reply from you
     right now, and everything else in one flat list. A person appears in
     exactly one tier - top pick first, then reply-needed, then the rest -
     so nobody is counted twice. */
  const todayPlan = useMemo(()=>buildPlan(people, events, tasks||[]), [people, events, tasks]);
  const topPick = todayPlan[0] && todayPlan[0].id!=='discover' ? todayPlan[0] : null;
  const topPickId = topPick && topPick.go && topPick.go.screen==='profile' ? topPick.go.id : null;
  const closed = filtered.filter(r=>r.status==='do_not_contact').length;
  const replyRows = filtered.filter(r=>r.status!=='do_not_contact' && r.id!==topPickId && needsReply(r, byLog));
  const restRows  = filtered.filter(r=>r.status!=='do_not_contact' && r.id!==topPickId && !needsReply(r, byLog));

  const nameOf = (id)=>{ const p=people.find(x=>x.id===id); return p?(p.name||'Unnamed'):' - '; };
  const personOf = (id)=>people.find(x=>x.id===id)||null;

  /* One honest description per stage transition, since the from/to pair is
     all a stage_change event actually carries - no invented narrative, just
     the plain reason each transition happens in this product. */
  const STAGE_WHY = {
    contacted: 'You reviewed the draft and sent it', replied: 'Updated automatically from their reply',
    ready_to_contact: 'Marked ready to reach out', coffee_chat: 'Logged after you met',
    do_not_contact: 'Closed out', prospect: 'Saved',
  };
  const sameDay = (a,b)=> a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const dateGroupLabel = (iso)=>{
    const d = new Date(iso), now = new Date();
    const y = new Date(now); y.setDate(now.getDate()-1);
    const long = d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
    if(sameDay(d,now)) return 'TODAY · '+long.toUpperCase();
    if(sameDay(d,y)) return 'YESTERDAY · '+long.toUpperCase();
    return long.toUpperCase();
  };
  /* hour12 forced explicitly - without it, toLocaleTimeString's 12-vs-24-hour
     choice follows the viewer's browser locale rather than a deliberate
     design decision, so the same row read "2:48 PM" for one visitor and
     "14:48" for another. */
  const timeOfDay = (iso)=> new Date(iso).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',hour12:true});

  /* The feed merges two kinds of history: real outreach_events, and a
     synthetic "saved" entry per day - shortlisted_at is real data, it just
     never got written to outreach_events, so it is grouped here at display
     time rather than invented. */
  const rawFeed = useMemo(()=>{
    const evItems = events.map(e=>({
      id:'e'+e.id, kind: e.event_type==='stage_change' ? 'stage_change' : e.event_type,
      occurred_at:e.occurred_at, personId:e.log_id, extracted:e.extracted, note:e.note,
    }));
    const byDay = {};
    people.forEach(r=>{
      if(!r.shortlisted_at) return;
      const key = new Date(r.shortlisted_at).toDateString();
      (byDay[key]=byDay[key]||[]).push(r);
    });
    const savedItems = Object.keys(byDay).map(key=>{
      const rows = byDay[key];
      const latest = rows.reduce((a,r)=>new Date(r.shortlisted_at)>new Date(a.shortlisted_at)?r:a, rows[0]);
      return {id:'saved-'+key, kind:'saved', occurred_at:latest.shortlisted_at, people:rows};
    });
    return evItems.concat(savedItems).sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at)).slice(0,80);
  },[events, people]);

  const TIME_CATS = [
    {key:'all',   label:'All',            test:()=>true},
    {key:'stage', label:'Stage changes',  test:e=>e.kind==='stage_change'},
    {key:'reply', label:'Replies',        test:e=>e.kind==='reply'},
    {key:'note',  label:'Notes',          test:e=>e.kind==='note'},
    {key:'saved', label:'Saved',          test:e=>e.kind==='saved'},
  ].filter(c=>c.key==='all' || rawFeed.some(c.test));
  const [feedCat,setFeedCat] = useState('all');
  const activeCat = TIME_CATS.find(c=>c.key===feedCat) || TIME_CATS[0];
  const feed = rawFeed.filter(activeCat.test);

  const feedGroups = [];
  feed.forEach(item=>{
    const label = dateGroupLabel(item.occurred_at);
    let g = feedGroups.find(x=>x.label===label);
    if(!g){ g = {label, items:[]}; feedGroups.push(g); }
    g.items.push(item);
  });

  function feedEntry(item){
    if(item.kind==='saved'){
      const names = item.people.map(r=>firstName(r.name)||'Unnamed');
      const shown = names.length<=8 ? names : names.slice(0,7).concat(['+'+(names.length-7)+' more']);
      const label = item.people.length===1 ? 'You saved '+item.people[0].name
        : 'You saved '+item.people.length+' people';
      return {title:label,
        sub: shown.length>1 ? shown.slice(0,-1).join(', ')+' and '+shown.slice(-1) : shown[0],
        cta:'See list', onCta:()=>go({screen:'relationships', view:'list'})};
    }
    const person = personOf(item.personId);
    const name = person ? person.name||'Unnamed' : nameOf(item.personId);
    if(item.kind==='stage_change'){
      const to = item.extracted && item.extracted.to;
      return {title:name+' moved to '+((STAGE[to]||{label:to||''}).label),
        sub: STAGE_WHY[to] || 'Stage updated',
        cta:'Open profile', onCta:()=>person&&onOpen(person.id)};
    }
    if(item.kind==='reply')
      return {title:name+' replied', sub:(person&&person.title)||'They wrote back',
        cta:'Open profile', onCta:()=>person&&onOpen(person.id)};
    if(item.kind==='first_message')
      return {title:'You reached out to '+name, sub:item.note?item.note.slice(0,90):'Message sent',
        cta:'View message', onCta:()=>person&&onOpen(person.id,'draft')};
    if(item.kind==='note')
      return {title:'You captured notes on '+name, sub:item.note?item.note.slice(0,90):'',
        cta:'Open profile', onCta:()=>person&&onOpen(person.id,'notes')};
    return {title:(EVENT_LABEL[item.kind]||item.kind)+' · '+name, sub:item.note?item.note.slice(0,90):'',
      cta:'Open profile', onCta:()=>person&&onOpen(person.id)};
  }

  /* Everyone Mighty thinks is worth adding, ranked against the goal. Shared by
     the empty state and the bottom of the populated list, so a new user and a
     returning one see the same section in the same place. */
  const worthAdding = (
    <div style={{marginTop:22}}>
      <div className="eyebrow b">Worth adding · ranked against your goal</div>
      <div className="sub" style={{marginTop:6,maxWidth:'62ch'}}>
        From your own history: how long you have been silent, whether their work matches yours, and where
        you overlap.
      </div>
      {suggBusy &&
        <div className="meta" style={{marginTop:16}}><span className="spin"/> Reading your history…</div>}
      {!suggBusy && sugg && sugg.length>0 &&
        <div className="card" style={{marginTop:14,padding:'6px 22px'}}>
          {sugg.map(c=><ConnRow key={c.profile_url} c={c}/>)}
        </div>}
      {!suggBusy && sugg && sugg.length===0 &&
        <div style={{marginTop:16}}>
          <div className="sub" style={{maxWidth:'60ch'}}>
            {total ? <F>Nothing in your {total.toLocaleString()} connections lines up with your goal well enough
              to be worth interrupting you over, which usually means the goal is written too broadly to match
              on.</F>
            : <F>There is nothing to rank until your LinkedIn history is imported.</F>}
          </div>
          <button className="btn sm" style={{marginTop:14}} onClick={()=>go({screen:'you', tab:'goal'})}>
            {total ? 'Sharpen my goal' : 'Import my history'}
          </button>
        </div>}
    </div>);

  const webSearchPanel = (
    <div className="card" style={{marginTop:16,padding:'24px 26px'}}>
      <div className="row" style={{justifyContent:'space-between',alignItems:'baseline',gap:14,flexWrap:'wrap'}}>
        <div className="h3">Someone not in your network</div>
        {!webOpen &&
          <button className="btn g sm" onClick={()=>setWebOpen(true)}>Search LinkedIn</button>}
      </div>
      <div className="sub" style={{marginTop:6,maxWidth:'62ch'}}>
        Five people per search, through the extension. Open a profile once and Mighty can brief you on them.
      </div>

      {webOpen && <F>
        <div style={{display:'flex',gap:12,marginTop:18,alignItems:'stretch',flexWrap:'wrap'}}>
          <input className="inp" style={{flex:'1 1 240px',minWidth:0}} value={webQ}
            placeholder="Investors in Boston backing idea-stage companies"
            onChange={e=>setWebQ(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') run(); }}/>
          <button className="btn" style={{flex:'none',padding:'0 26px',borderRadius:'var(--rsm)'}}
            onClick={()=>run()} disabled={webBusy||!clean(webQ)}>
            {phase==='searching' ? <span><span className="spin"/> Searching</span>
              : phase==='thinking' ? <span><span className="spin"/> Reading</span> : 'Search'}
          </button>
        </div>

        {webErr && <div className="banner err" style={{marginTop:16}}>{webErr}</div>}
        {notice && <div className="banner warn" style={{marginTop:16}}>{notice}</div>}

        {noExt &&
          <div className="fade" style={{marginTop:16,paddingTop:16,borderTop:'1px solid var(--line)'}}>
            <div className="h4">Search is not switched on for this account yet.</div>
            <div className="sub" style={{marginTop:7,lineHeight:1.55,maxWidth:560}}>
              Searching outside your network needs either the extension or the web-search backend.
              Browsing LinkedIn and saving from the extension panel works today.
            </div>
            <div className="row" style={{gap:10,marginTop:16,flexWrap:'wrap'}}>
              <button className="btn sm" onClick={()=>go({screen:'extension'})}>Set up the extension</button>
              <a className="btn g sm" href="https://www.linkedin.com/search/results/people/" target="_blank" rel="noopener noreferrer">
                Open LinkedIn search
              </a>
            </div>
          </div>}

        {results.length>0 &&
          <div>
            <div className="row" style={{marginTop:22,alignItems:'baseline',justifyContent:'space-between',gap:16}}>
              <div className="h4">{visible.length} {visible.length===1?'person':'people'} for "{lastQuery}"</div>
              <div className="meta">Save now, decide later</div>
            </div>
            {phase==='thinking' &&
              <div className="meta" style={{marginTop:10}}><span className="spin"/> Working out why each of these matters to you…</div>}

            {visible.map(r=>{
              const savedRow = savedUrls[(r.profileUrl||'').toLowerCase()];
              return (
                <div key={r.profileUrl} className="fade" style={{marginTop:14,paddingTop:14,borderTop:'1px solid var(--line2)'}}>
                  <div style={{display:'flex',alignItems:'flex-start',gap:14,flexWrap:'wrap'}}>
                    <Avatar name={r.name} src={savedRow ? savedRow.avatar_url : r.avatarUrl} hover={savedRow||r}/>
                    <div style={{flex:'1 1 200px',minWidth:0}}>
                      <div style={{fontSize:17,fontWeight:700,letterSpacing:'-.015em'}}>{r.name}</div>
                      <div className="sub" style={{fontSize:14,marginTop:2}}>{r.title||'No headline on the profile'}</div>
                      {[r.location, r.education, r.followers && r.followers+' followers'].filter(Boolean).length>0 &&
                        <div className="meta" style={{marginTop:4}}>
                          {[r.location, r.education, r.followers && r.followers+' followers'].filter(Boolean).join(' · ')}
                        </div>}
                      <a href={r.profileUrl} target="_blank" rel="noopener noreferrer"
                        style={{fontSize:13,fontWeight:600,marginTop:4,display:'inline-block'}}>View on LinkedIn</a>
                    </div>
                    <div style={{display:'flex',gap:9,flex:'none'}}>
                      {savedRow
                        ? <button className="btn g sm" onClick={()=>onOpen(savedRow.id)}>Open profile</button>
                        : <F>
                            <button className="btn g sm" style={{color:'var(--sub)'}}
                              onClick={()=>setSkip(s=>({...s,[r.profileUrl]:true}))}>Skip</button>
                            <button className="btn sm" disabled={atCap || savingUrls.has(r.profileUrl)}
                              onClick={async()=>{ startSaving(r.profileUrl); try{ await onSave(r, lastQuery); }finally{ stopSaving(r.profileUrl); } }}>
                              {savingUrls.has(r.profileUrl) ? <span><span className="spin"/> Adding</span> : 'Add'}
                            </button>
                          </F>}
                    </div>
                  </div>
                  {r.why &&
                    /* Used to badge each result "Strong fit"/"Outside your goal" -
                       four confident-sounding tiers built off a headline and a
                       snippet, which is not enough to actually stand behind a
                       verdict. The reasoning underneath is still worth reading;
                       it just should not wear a rating it hasn't earned. One
                       label for all of them, the same honest thing every time. */
                    <div className="why" style={{marginTop:14,padding:'14px 16px'}}>
                      <div className="eyebrow b">Insight</div>
                      <div style={{fontSize:14.5,lineHeight:1.55,color:'var(--body)',marginTop:6,textWrap:'pretty'}}>{r.why}</div>
                    </div>}
                  {(r.warmIntro || (r.common && r.common.length>0)) &&
                    <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:12}}>
                      {r.warmIntro &&
                        <span className="tag" style={{background:'var(--brand-soft2)',borderColor:'var(--brand-line)',color:'var(--brand-ink)',fontWeight:700}}>
                          You know {r.warmIntro.count} at {r.warmIntro.label}
                        </span>}
                      {r.common && r.common.map((c,i)=><span key={i} className="tag">{c}</span>)}
                    </div>}
                </div>);
            })}

            {visible.length===0 &&
              <div className="meta" style={{marginTop:14}}>Nothing left in this batch. Try another description.</div>}
          </div>}
      </F>}
    </div>);

  /* Pipeline (your saved people, however tracked) and Explore (finding
     someone, saved or not) are two different jobs and now read as two
     segments rather than one long page - a search box sitting above a
     stage-grouped list made it look like part of the same task. */
  /* Select/delete works against exactly what's rendered below - the same
     filtered, still-open set grouped.map draws from - so "select all" can
     never silently grab a closed-out or search-hidden row the user cannot
     currently see. */
  const selectableIds = filtered.filter(r=>r.status!=='do_not_contact' && r.id!==topPickId).map(r=>r.id);
  const allSelected = selectableIds.length>0 && selectableIds.every(id=>selected.has(id));
  const toggleSelectAll = ()=> setSelected(allSelected ? new Set() : new Set(selectableIds));

  const pipelineList = (
    <div className="fade" style={{marginTop:22}}>
      {selectableIds.length>0 &&
        <div className="row" style={{justifyContent:'space-between',alignItems:'center',gap:14,marginBottom:16,flexWrap:'wrap'}}>
          <label className="row" style={{gap:9,alignItems:'center',cursor:'pointer'}}>
            <input type="checkbox" checked={allSelected} onChange={toggleSelectAll} style={{width:16,height:16,cursor:'pointer'}}/>
            <span className="sub" style={{fontSize:13}}>Select all ({selectableIds.length})</span>
          </label>
          {selected.size>0 &&
            <div className="row" style={{gap:10,alignItems:'center'}}>
              <span style={{fontSize:13.5,fontWeight:600,color:'var(--brand-ink)'}}>{selected.size} selected</span>
              <button className="btn q" style={{fontSize:13}} onClick={()=>setSelected(new Set())}>Clear</button>
              <button className="btn sm" style={{background:'var(--red)',color:'#450A05'}}
                onClick={async()=>{
                  const n = selected.size;
                  if(!window.confirm('Permanently remove '+n+' '+(n===1?'person':'people')
                    +' from Mighty? Their notes, drafts and timeline go with them. This cannot be undone.')) return;
                  await onDelete([...selected]);
                  setSelected(new Set());
                }}>Delete</button>
            </div>}
        </div>}
      {topPick &&
        <div style={{marginBottom:22}}>
          <div className="eyebrow b" style={{marginBottom:8}}>Top recommendation</div>
          <div className="card" style={{padding:'20px 24px',display:'flex',alignItems:'center',gap:16,flexWrap:'wrap',cursor:'pointer'}}
            onClick={()=>go(topPick.go)}>
            <Avatar name={topPick.title.replace(/^(Reply to|Send your first message to|Write to|Follow up with|Capture your conversation with|Understand)\s*/,'').replace(/ before you reach out$/,'')}
              size={38} src={people.find(p=>p.id===topPickId)&&people.find(p=>p.id===topPickId).avatar_url}/>
            <div style={{flex:'1 1 240px',minWidth:0}}>
              <div style={{fontSize:16.5,fontWeight:800,letterSpacing:'-.015em'}}>{topPick.title}</div>
              <div className="sub" style={{fontSize:13.5,marginTop:2}}>{topPick.sub}</div>
            </div>
            <button className="btn" style={{flex:'none'}} onClick={e=>{ e.stopPropagation(); go(topPick.go); }}>
              {HERO_VERB[topPick.cta]||topPick.cta}
            </button>
          </div>
        </div>}

      {replyRows.length>0 &&
        <div style={{marginBottom:22}}>
          <div className="eyebrow b" style={{marginBottom:8}}>Needs your reply · {replyRows.length}</div>
          <div className="card" style={{overflow:'hidden'}}>
            {replyRows.map(r=><Row key={r.id} r={r} hot={true}/>)}
          </div>
        </div>}

      {restRows.length>0 &&
        <div style={{marginBottom:22}}>
          <div className="eyebrow b" style={{marginBottom:8}}>Everything else · {restRows.length}</div>
          <div className="card" style={{overflow:'hidden'}}>
            {restRows.map(r=><Row key={r.id} r={r} hot={false}/>)}
          </div>
        </div>}

      {closed>0 &&
        <div className="meta" style={{marginTop:8}}>{closed} closed out, hidden from this list.</div>}
    </div>);

  /* Same three numbers as Today's GoalStrip, as a plain line here rather than
     a card - this header is shared by every Relationships view, so it is the
     one place "where do things stand" is always visible regardless of which
     tab you're on. */
  const relStats = useMemo(()=>{
    const byLog = {};
    events.forEach(e=>{ (byLog[e.log_id]=byLog[e.log_id]||[]).push(e); });
    const f = goalFunnel(people);
    const waiting = people.filter(r=>needsReply(r, byLog)).length;
    const target = settings.weeklyMeetingTarget || 3;
    const metThisWeek = events.filter(e=>e.event_type==='stage_change' &&
      ['coffee_chat','referral','interview','offer'].indexOf((e.extracted||{}).to)>=0 && days(e.occurred_at)<=7).length;
    return {saved:f.saved, waiting, target, metCapped:Math.min(metThisWeek, target)};
  },[people, events, settings.weeklyMeetingTarget]);

  return (
    <div className="pad fade" style={{maxWidth:1120,paddingTop:34}}>
      <div className="row" style={{justifyContent:'space-between',gap:16,flexWrap:'wrap'}}>
        <div>
          {/* Explore flips the header's own emphasis - "Who should I know?" is
             literally the question that surface answers, so it gets to be the
             headline there; List/Board/Timeline are about managing who's
             already in motion, so the goal itself stays the headline for
             those three. */}
          {view==='explore' ? (
            <F>
              <div className="eyebrow b">Toward · {goalLine(settings).toUpperCase()}</div>
              <h1 className="h1" style={{marginTop:6}}>Who should I know?</h1>
            </F>
          ) : (
            <F>
              <div className="eyebrow b">Toward</div>
              <h1 className="h1" style={{marginTop:6}}>{goalLine(settings)}</h1>
            </F>
          )}
          {canSee('progress', people) &&
            <div className="sub" style={{fontSize:13.5,marginTop:8,fontWeight:600}}>
              {relStats.saved} identified · {relStats.waiting} replied, waiting on you · {relStats.metCapped} of {relStats.target} meetings this week
            </div>}
        </div>
        <div className="row" style={{gap:10,flexWrap:'wrap',alignItems:'center'}}>
          <div className="seg">
            <button className={view==='list'?'on':''} onClick={()=>setView('list')}>List</button>
            <button className={view==='board'?'on':''} onClick={()=>setView('board')}
              style={boardOK?null:{opacity:.5}} title={boardOK?'':UNLOCKS.board.hint}>Board</button>
            <button className={view==='timeline'?'on':''} onClick={()=>setView('timeline')}
              style={timeOK?null:{opacity:.5}} title={timeOK?'':UNLOCKS.timeline.hint}>Timeline</button>
          </div>
          <div className="seg">
            <button className={view==='explore'?'on':''} onClick={()=>setView('explore')}>Explore</button>
          </div>
        </div>
      </div>

      {view==='explore' ? (
        <div className="fade" style={{marginTop:22}}>
          <div className="row" style={{gap:12,alignItems:'stretch',flexWrap:'wrap'}}>
            <input className="inp" style={{flex:'1 1 320px',minWidth:0,fontSize:15.5}} value={q}
              placeholder="Search who you know, ask a question, or describe someone new"
              onChange={e=>setQ(e.target.value)}
              onKeyDown={e=>{
                /* Enter means "I'm done, search now" - it should not wait out
                   the 900ms auto-search pause above, and it should work
                   regardless of what your own network turned up. autoRun is
                   marked here too, so the debounced effect above does not
                   also fire once its own timer catches up. */
                const sentence = clean(q);
                if(e.key==='Enter' && sentence && !webBusy){ autoRun.current = sentence; run(sentence); }
              }}/>
            {atCap &&
              <span className="banner warn" style={{flex:'none',padding:'11px 16px',fontSize:13}}>
                At {cap}, the cap on your plan.
              </span>}
          </div>

          {searching && intent.type==='question' ? (
            /* One box, and a question about your own pipeline goes to the
               exact same engine the "Ask Mighty" drawer already uses - not a
               reimplementation, the same component, just reached without
               ever having to know a drawer was the other way in. */
            <div className="card fade" style={{marginTop:20,minHeight:320}}>
              <Ask sb={sb} people={people} events={events} tasks={tasks} settings={settings}
                onOpen={onOpen} onSave={onSave} initialQuestion={intent.text} onConsumed={()=>{}}/>
            </div>
          ) : searching && intent.type==='event' ? (
            <div className="card fade" style={{marginTop:20,padding:'28px 30px'}}>
              <div className="eyebrow b">Events</div>
              <div className="h4" style={{marginTop:10}}>Event search is not built yet.</div>
              <div className="sub" style={{marginTop:8,lineHeight:1.6,maxWidth:'56ch'}}>
                Finding rooms worth being in - and who in them matters to your goal - is coming. For now this
                box searches the people you already know and the wider LinkedIn network.
              </div>
            </div>
          ) : searching ? (
            <div className="fade" style={{marginTop:20}}>
              {filtered.length>0 &&
                <div className="card" style={{overflow:'hidden',marginBottom:16}}>
                  <div className="eyebrow" style={{padding:'12px 24px',background:'var(--card2)',borderBottom:'1px solid var(--line4)'}}>
                    Already saved · {filtered.length}
                  </div>
                  {filtered.map(r=><Row key={r.id} r={r} hot={needsReply(r, byLog)}/>)}
                </div>}

              {mineBusy &&
                <div className="meta" style={{marginTop:filtered.length?0:16}}><span className="spin"/> Looking in your network…</div>}

              {/* Two side-by-side answers to one question: who do you already
                 know, and who is genuinely new. Someone already connected to
                 you gets Message, not Add - "Add" reads like connecting, and
                 you already are; the real next step with someone you know is
                 reaching out, not filing them away. Someone new keeps
                 Add/Skip, because saving them - not messaging a stranger - is
                 the actual next step. */}
              {!mineBusy && mine &&
                <div className="fade" style={{marginTop:filtered.length?0:16,display:'grid',
                  gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))',gap:18,alignItems:'start'}}>
                  <div className="card" style={{padding:'8px 22px 18px',overflow:'hidden'}}>
                    <div style={{padding:'14px 0 4px'}}>
                      <div className="eyebrow b" style={{color:'var(--brand-ink)'}}>Already in your network</div>
                      <div className="meta" style={{marginTop:2}}>
                        {mine.rows.filter(c=>!savedUrls[(c.profile_url||'').toLowerCase()]).length} · you connected, then nothing
                      </div>
                    </div>
                    {mine.rows.filter(c=>!savedUrls[(c.profile_url||'').toLowerCase()]).length===0 &&
                      <div className="meta" style={{padding:'16px 0'}}>Nobody in your network matches that.</div>}
                    {mine.rows.filter(c=>!savedUrls[(c.profile_url||'').toLowerCase()]).map(c=>{
                      const reason = connReason(c);
                      const tags = [c.hits && c.hits.length && ('Matched on '+c.hits.slice(0,3).join(', ')),
                        c.connected_on && ('Connected '+String(c.connected_on).slice(0,4))].filter(Boolean);
                      return (
                        <div key={c.profile_url} style={{padding:'16px 0',borderTop:'1px solid var(--line2)'}}>
                          <div className="row" style={{alignItems:'flex-start',gap:13,flexWrap:'wrap'}}>
                            <Avatar name={connName(c)} size={34} src={c.avatar_url} hover={c}/>
                            <div style={{flex:'1 1 160px',minWidth:0}}>
                              <div style={{fontSize:15,fontWeight:700}}>{connName(c)}</div>
                              <div className="sub" style={{fontSize:13.5,marginTop:1}}>
                                {[clean(c.position), clean(c.company)].filter(Boolean).join(' · ') || 'No role on the export'}
                              </div>
                            </div>
                            <div style={{display:'flex',gap:8,flex:'none',alignItems:'center'}}>
                              <button className="btn q" style={{fontSize:13}}
                                onClick={()=>setMine(prev=>prev && ({...prev, rows:prev.rows.filter(x=>x.profile_url!==c.profile_url)}))}>
                                Ignore
                              </button>
                              <button className="btn g sm" disabled={savingUrls.has(c.profile_url)}
                                onClick={async()=>{
                                  startSaving(c.profile_url);
                                  try{ const row = await onSave(connToPerson(c), 'own_network'); if(row) onOpen(row.id); }
                                  finally{ stopSaving(c.profile_url); }
                                }}>Prepare</button>
                              <button className="btn sm" disabled={savingUrls.has(c.profile_url)}
                                onClick={async()=>{
                                  startSaving(c.profile_url);
                                  try{ await onSave(connToPerson(c), 'own_network'); }
                                  finally{ stopSaving(c.profile_url); }
                                }}>
                                {savingUrls.has(c.profile_url) ? <span><span className="spin"/> Saving</span> : 'Save'}
                              </button>
                            </div>
                          </div>
                          {tags.length>0 &&
                            <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:10}}>
                              {tags.map((t,i)=><span key={i} className="tag">{t}</span>)}
                            </div>}
                          {reason &&
                            <div className="why" style={{marginTop:12,padding:'14px 16px'}}>
                              <div className="eyebrow b">Why Mighty picked them</div>
                              <div style={{fontSize:14.5,lineHeight:1.55,color:'var(--body)',marginTop:6,textWrap:'pretty'}}>{reason}</div>
                            </div>}
                        </div>);
                    })}
                  </div>

                  <div className="card" style={{padding:'8px 22px 18px',overflow:'hidden'}}>
                    <div style={{padding:'14px 0 4px'}}>
                      <div className="eyebrow b" style={{color:'var(--peach)'}}>Not in your network yet</div>
                      <div className="meta" style={{marginTop:2}}>
                        {webOpen ? visible.length+' · open a profile once and Mighty can brief you' : 'Search LinkedIn to see who else fits'}
                      </div>
                    </div>
                    {!webOpen &&
                      <button className="btn g sm" style={{margin:'12px 0'}}
                        onClick={()=>{ autoRun.current=clean(q); run(q); }} disabled={webBusy}>
                        {webBusy ? <span><span className="spin"/> Searching</span> : 'Search LinkedIn for this'}
                      </button>}
                    {webOpen && webErr && <div className="banner err" style={{margin:'12px 0'}}>{webErr}</div>}
                    {webOpen && notice && <div className="banner warn" style={{margin:'12px 0'}}>{notice}</div>}
                    {webOpen && noExt &&
                      <div style={{padding:'16px 0'}}>
                        <div className="sub" style={{lineHeight:1.55}}>
                          Searching outside your network needs either the extension or the web-search backend.
                        </div>
                        <div className="row" style={{gap:10,marginTop:12,flexWrap:'wrap'}}>
                          <button className="btn sm" onClick={()=>go({screen:'extension'})}>Set up the extension</button>
                          <a className="btn g sm" href="https://www.linkedin.com/search/results/people/" target="_blank" rel="noopener noreferrer">Open LinkedIn search</a>
                        </div>
                      </div>}
                    {webOpen && phase==='searching' &&
                      <div className="meta" style={{padding:'16px 0'}}><span className="spin"/> Searching LinkedIn…</div>}
                    {webOpen && phase!=='searching' && !noExt && !webErr && visible.length===0 &&
                      <div className="meta" style={{padding:'16px 0'}}>Nothing left in this batch. Try another description.</div>}
                    {webOpen && visible.map(r=>{
                      const savedRow = savedUrls[(r.profileUrl||'').toLowerCase()];
                      return (
                        <div key={r.profileUrl} style={{padding:'16px 0',borderTop:'1px solid var(--line2)'}}>
                          <div className="row" style={{alignItems:'flex-start',gap:13,flexWrap:'wrap'}}>
                            <Avatar name={r.name} src={savedRow ? savedRow.avatar_url : r.avatarUrl} hover={savedRow||r}/>
                            <div style={{flex:'1 1 160px',minWidth:0}}>
                              <div style={{fontSize:15,fontWeight:700}}>{r.name}</div>
                              <div className="sub" style={{fontSize:13.5,marginTop:1}}>{r.title||'No headline on the profile'}</div>
                              {[r.location, r.followers && r.followers+' followers'].filter(Boolean).length>0 &&
                                <div className="meta" style={{marginTop:2}}>
                                  {[r.location, r.followers && r.followers+' followers'].filter(Boolean).join(' · ')}
                                </div>}
                              <a href={r.profileUrl} target="_blank" rel="noopener noreferrer"
                                style={{fontSize:13,fontWeight:600,marginTop:4,display:'inline-block'}}>View on LinkedIn</a>
                            </div>
                            <div style={{display:'flex',gap:8,flex:'none'}}>
                              {savedRow && reasonPrompt && reasonPrompt.kind==='save' && reasonPrompt.rowId===savedRow.id
                                ? null
                                : savedRow
                                ? <button className="btn g sm" onClick={()=>onOpen(savedRow.id)}>Open</button>
                                : reasonPrompt && reasonPrompt.kind==='skip' && reasonPrompt.profileUrl===r.profileUrl
                                ? null
                                : <F>
                                    <button className="btn q" style={{fontSize:13}}
                                      onClick={()=>setReasonPrompt({kind:'skip', profileUrl:r.profileUrl})}>Ignore</button>
                                    <button className="btn g sm" disabled={atCap || savingUrls.has(r.profileUrl)}
                                      onClick={async()=>{ startSaving(r.profileUrl); try{ const row=await onSave(r, lastQuery); if(row) onOpen(row.id); }finally{ stopSaving(r.profileUrl); } }}>
                                      Prepare</button>
                                    <button className="btn sm" disabled={atCap || savingUrls.has(r.profileUrl)}
                                      onClick={async()=>{ startSaving(r.profileUrl); try{ const row=await onSave(r, lastQuery); if(row) setReasonPrompt({kind:'save', profileUrl:r.profileUrl, rowId:row.id}); }finally{ stopSaving(r.profileUrl); } }}>
                                      {savingUrls.has(r.profileUrl) ? <span><span className="spin"/> Saving</span> : 'Save'}
                                    </button>
                                  </F>}
                            </div>
                          </div>
                          {reasonPrompt && reasonPrompt.kind==='save' && savedRow && reasonPrompt.rowId===savedRow.id &&
                            <div style={{marginTop:10}}>
                              <ReasonChips prompt="Why did you save them?" options={SAVE_REASONS}
                                onPick={(id)=>finishSaveReason(savedRow, id)} onDismiss={()=>setReasonPrompt(null)}/>
                            </div>}
                          {reasonPrompt && reasonPrompt.kind==='skip' && reasonPrompt.profileUrl===r.profileUrl &&
                            <div style={{marginTop:10}}>
                              <ReasonChips prompt="Why pass?" options={SKIP_REASONS}
                                onPick={(id)=>finishSkip(r.profileUrl, id)} onDismiss={()=>finishSkip(r.profileUrl, null)}/>
                            </div>}
                          {r.why &&
                            <div className="why" style={{marginTop:12,padding:'14px 16px'}}>
                              <div className="eyebrow b">Why Mighty picked them</div>
                              <div style={{fontSize:14.5,lineHeight:1.55,color:'var(--body)',marginTop:6,textWrap:'pretty'}}>{r.why}</div>
                            </div>}
                        </div>);
                    })}
                  </div>
                </div>}
            </div>
          ) : (
            <F>
              {worthAdding}
              {webSearchPanel}
            </F>
          )}
        </div>
      ) : people.length===0 ? (
        <div className="fade" style={{marginTop:22}}>
          <Empty title="No one here yet."
            body="Everyone you add lands here, however you found them. Switch to Explore to search who you know, or see who Mighty thinks is worth adding."
            cta="Go to Explore" onCta={()=>setView('explore')}/>
        </div>
      ) : view==='board' ? (
        <div className="fade" style={{marginTop:20}}>
          {!boardOK && <F>
            <div className="hint">{UNLOCKS.board.hint}</div>
            {pipelineList}
          </F>}
          {boardOK &&
            /* Six columns, only 3-4 fit before scrolling on a laptop-width
               screen. An opaque overlay used to hint at the rest, but it drew
               a hard rectangle over whatever card sat at the edge, so a
               rounded card looked sliced in half instead of hinted-at. A mask
               on the scroll container itself fades the card's actual pixels
               - corners, shadow and all - so a partial card tapers away
               instead of getting cut off. */
            <div style={{display:'flex',gap:14,overflowX:'auto',paddingBottom:12,paddingRight:28,
              WebkitMaskImage:'linear-gradient(90deg,#000 calc(100% - 28px),transparent 100%)',
              maskImage:'linear-gradient(90deg,#000 calc(100% - 28px),transparent 100%)'}}>
                {COLUMNS.map(col=>{
                const items = people.filter(r=>col.statuses.indexOf(r.status)>=0);
                const meta = STAGE[col.statuses[0]];
                return (
                  <div key={col.key} style={{width:250,flex:'none'}}
                    onDragOver={e=>{ e.preventDefault(); setOver(col.key); }}
                    onDragLeave={()=>setOver(o=>o===col.key?null:o)}
                    onDrop={e=>{ e.preventDefault(); setOver(null);
                      const person = dragId!=null ? people.find(r=>r.id===dragId) : null;
                      /* Active merges replied/coffee_chat/referral/interview/offer into one
                         column. Dropping a card that already belongs there must not force
                         it back to statuses[0] - that silently downgraded a later stage
                         like offer back to replied on any imprecise click the browser
                         read as a drag. */
                      if(person && col.statuses.indexOf(person.status)<0) onStage(person, col.statuses[0]);
                      setDrag(null); }}>
                    <div className="row" style={{gap:8,padding:'0 4px 10px'}}>
                      <span className="dot" style={{background:meta.dot}}/>
                      <span style={{fontSize:13,fontWeight:700}}>{col.label||meta.label}</span>
                      <span className="meta">{items.length}</span>
                    </div>
                    <div className={'stack'+(overCol===col.key?' drop':'')} style={{gap:10,minHeight:60}}>
                      {items.length===0 &&
                        <div className="meta" style={{padding:'14px 10px',textAlign:'center',border:'1px dashed var(--line)',borderRadius:'var(--rsm)'}}>Nobody here yet.</div>}
                      {items.map(r=>(
                        <div key={r.id} className="colcard" draggable
                          onDragStart={()=>setDrag(r.id)} onDragEnd={()=>setDrag(null)}
                          onClick={()=>onOpen(r.id)}>
                          <div className="row" style={{gap:10}}>
                            <Avatar name={r.name} size={28} src={r.avatar_url} hover={r}/>
                            <div style={{minWidth:0}}>
                              <div className="row" style={{gap:6}}>
                                <div style={{fontSize:14.5,fontWeight:700,letterSpacing:'-.01em',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.name||'Unnamed'}</div>
                                <ConnectedBadge r={r} size="sm"/>
                              </div>
                              <div style={{fontSize:12.5,color:'var(--mute)',marginTop:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.title||''}</div>
                            </div>
                          </div>
                          <div style={{fontSize:13,fontWeight:700,color:'var(--brand-ink)',marginTop:11}}>{nextAction(r)}</div>
                        </div>))}
                    </div>
                  </div>);
                })}
              </div>}
        </div>
      ) : view==='timeline' ? (
        <div className="fade" style={{marginTop:20}}>
          {!timeOK && <F>
            <div className="hint">{UNLOCKS.timeline.hint}</div>
            {pipelineList}
          </F>}
          {timeOK && <F>
            <div className="sub" style={{fontSize:14.5}}>Everything that moved. The newest is at the top.</div>
            <div className="seg" style={{marginTop:14,width:'fit-content'}}>
              {TIME_CATS.map(c=>(
                <button key={c.key} className={feedCat===c.key?'on':''} onClick={()=>setFeedCat(c.key)}>
                  {c.label} · {rawFeed.filter(c.test).length}
                </button>))}
            </div>

            {feedGroups.length===0 &&
              <div className="meta" style={{marginTop:20}}>Nothing in this filter yet.</div>}

            <div style={{marginTop:24,maxWidth:760}}>
              {feedGroups.map((g,gi)=>(
                <div key={g.label} style={{marginBottom:28}}>
                  <div className="eyebrow" style={{marginBottom:12}}>{g.label}</div>
                  <div>
                    {g.items.map((item,i)=>{
                      const entry = feedEntry(item);
                      const dot = ({reply:'var(--green)', stage_change:'var(--brand)', note:'#E3A23C',
                        saved:'var(--mute)', first_message:'var(--brand)'})[item.kind] || 'var(--mute)';
                      /* Rows used to sit inside one bordered, shadowed card per day -
                         tidy, but it boxed in what is meant to read as a single
                         continuous line of things happening, not a table. Open rows
                         on the page background, with the connector line and dots
                         doing the organizing, reads more like an actual timeline. */
                      const person = item.kind==='saved'
                        ? (item.people.length===1 ? item.people[0] : null)
                        : personOf(item.personId);
                      const avatarName = person ? person.name : nameOf(item.personId);
                      const multiSaved = item.kind==='saved' && item.people.length>1;
                      return (
                        <div key={item.id} className="row" style={{gap:14,padding:'14px 4px',alignItems:'stretch',
                          borderBottom:i===g.items.length-1?'none':'1px solid var(--line3)'}}>
                          <div style={{fontSize:12.5,color:'var(--mute)',flex:'none',width:56,paddingTop:22}}>
                            {timeOfDay(item.occurred_at)}
                          </div>
                          <div style={{flex:'none',width:16,position:'relative',display:'flex',justifyContent:'center'}}>
                            {i>0 &&
                              <span style={{position:'absolute',top:0,height:'calc(50% + 4px)',width:2,background:'var(--line2)'}}/>}
                            {i<g.items.length-1 &&
                              <span style={{position:'absolute',bottom:0,height:'calc(50% + 4px)',width:2,background:'var(--line2)'}}/>}
                            <span style={{position:'relative',zIndex:1,width:9,height:9,marginTop:26,flex:'none',
                              borderRadius:'50%',background:dot,boxShadow:'0 0 0 3px var(--paper)'}}/>
                          </div>
                          <div style={{flex:'none',paddingTop:16}}>
                            {multiSaved
                              ? <div className="av" style={{width:30,height:30,fontSize:11}}>{'+'+item.people.length}</div>
                              : <Avatar name={avatarName} size={30} src={person&&person.avatar_url} hover={person}/>}
                          </div>
                          <div style={{flex:1,minWidth:0,paddingTop:16}}>
                            <div style={{fontSize:15,fontWeight:700,letterSpacing:'-.01em'}}>{entry.title}</div>
                            {entry.sub && <div className="sub" style={{fontSize:13.5,marginTop:2,textWrap:'pretty'}}>{entry.sub}</div>}
                          </div>
                          {entry.cta &&
                            <button className="btn g sm" style={{flex:'none',alignSelf:'center'}} onClick={entry.onCta}>{entry.cta}</button>}
                        </div>);
                    })}
                  </div>
                </div>))}
              {feedGroups.length>0 &&
                <div className="meta" style={{textAlign:'center'}}>That's everything so far.</div>}
            </div>
          </F>}
        </div>
      ) : pipelineList}
    </div>
  );
}

/* ===================== Profile ===================== */
const APPROACHES = [
  {id:'warm',      label:'Warm introduction', brief:'built around a shared connection'},
  {id:'curiosity', label:'Curiosity',         brief:'asks about something specific in their work'},
  {id:'shared',    label:'Shared experience', brief:'built on common background'},
  {id:'value',     label:'Value first',       brief:'offers something useful before asking'},
  {id:'coffee',    label:'Coffee chat',       brief:'a short, concrete request to talk'},
];
function Profile({sb, row, events, tasks, settings, people, onBack, onUpdate, onStage, onEvent, onTask, tab, setTab, go}){
  const ctx = row.context||{};
  /* Do I already know someone at their company? A real, specific opening -
     "ask Jane for an intro" beats any AI-inferred "shared interest in tech" -
     computed once at archive import (decodedCompanyIndex) and just looked up
     here, never re-derived from anything the model says. */
  const companyIndex = settings.knowledge && settings.knowledge.decoded
    && settings.knowledge.decoded.chapters && settings.knowledge.decoded.chapters.companyIndex;
  const warmIntro = row.company ? companyOverlap(companyIndex, row.company) : null;
  /* Bridge re-ranks the same overlap by real tie strength - see
     bridgeIntroducers() for why this stops at one hop rather than drawing
     the multi-hop path graph the Prism concept shows. */
  const bridge = row.company ? bridgeIntroducers(companyIndex, row.company, settings.knowledge||{}) : {overlap:null, candidates:[]};
  const CONNECTORS = [
    {key:'linkedin', label:'LinkedIn', on: !!(settings.knowledge && settings.knowledge.connectionCount),
      detail: (settings.knowledge && settings.knowledge.connectionCount)
        ? settings.knowledge.connectionCount.toLocaleString()+' connections, career history'
        : 'Not imported yet'},
    {key:'mail', label:'Email', on: !!(settings.knowledge && settings.knowledge.mail && settings.knowledge.mail.messagesRead),
      detail: (settings.knowledge && settings.knowledge.mail && settings.knowledge.mail.messagesRead)
        ? (settings.knowledge.mail.twoWayCount||0).toLocaleString()+' real contacts, who you actually talk to'
        : 'Not imported yet'},
    /* Written this session, not yet deployed - see the tech plan tab. Shown
       here rather than hidden so "what Bridge could see" stays honest about
       what is coming, not just what is live. */
    {key:'google', label:'Google', on:false, detail:'Contacts and calendar - connector built, awaiting setup'},
  ];
  /* An exchange is one outbound conversation: the brief, the draft, and every
     take of that draft. It costs one assist. When they reply, answering them is
     a new exchange and a new assist, because it is new work. The counter lives
     in context so it survives a reload and needs no schema change. */
  const exchangeNo = Math.max(1, Number(ctx.exchange || 1));
  const exchangeKey = 'ex:' + row.id + ':' + exchangeNo;
  const takes = Math.max(0, Number(ctx.takes || 0));
  const TAKE_LIMIT = 10;
  const takesLeft = Math.max(0, TAKE_LIMIT - takes);

  /* Has anyone actually read this person's profile?
     A search result is a name and a headline. A connection row out of the
     archive is a name, an employer and a date. Neither is enough to brief on,
     and briefing anyway produces the confident-sounding paragraph that makes
     people stop trusting a product. The extension fills these fields in the
     first time the profile is opened, so their presence is the evidence. */
  const profileRead = !!(clean(ctx.aboutText) || clean(ctx.education) || clean(ctx.location)
    || clean(ctx.skillsText) || (Array.isArray(ctx.timingSignals) && ctx.timingSignals.length));
  const br  = row.briefing||{};
  const st  = stageOf(row);
  const [busy,setBusy]   = useState(null);
  const [toast,setToast] = useState(null);
  const [err,setErr]     = useState(null);
  /* One angle used to mean one API call, so seeing a different approach cost a
     full Claude round-trip and only ever showed one message at a time. All
     five now come back in a single call - one assist, same as before - and
     switching chips is a local state change, free and instant. lastApproach
     on ctx remembers which one was actually sent, so a later reply can be
     attributed back to it (see markReplied). */
  /* Always Warm introduction - the first chip in APPROACHES, and the safer
     opener for a first message to a stranger.

     This deliberately does NOT restore ctx.lastApproach. That field is written
