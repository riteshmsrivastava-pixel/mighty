/* ===================== The Mighty Knowledge Base =====================
   Everything Mighty holds about one user, in one place, appended to rather than
   replaced. The LinkedIn archive is the first deposit; captures, replies,
   extension reads and later goals all land in the same store.

   Two names, one boundary, worth keeping straight:
     - the Knowledge Base is the USER's. It never leaves their account.
     - Mighty Brain is the intelligence. It learns categorical patterns and
       never sees content.

   Parsing happens in the browser because it is faster and needs no edge
   function, and the raw archive is ALSO stored, because the parser will improve
   and re-deriving from a kept file costs nothing while asking someone to export
   again costs their goodwill. */

/* A CSV parser that survives LinkedIn's files: quoted fields containing commas,
   escaped quotes, CRLF, and the multi-line preamble Connections.csv opens with. */
function parseCsv(text){
  const rows = []; let row = [], field = '', q = false;
  const t = String(text || '').replace(/^﻿/, '');
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){
      if(c === '"'){ if(t[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += c;
    } else if(c === '"') q = true;
    else if(c === ','){ row.push(field); field = ''; }
    else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else if(c !== '\r') field += c;
  }
  if(field || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => (v || '').trim()));
}
/* LinkedIn puts a notes block above the header in some files, so find the header
   by looking for the row that actually contains the columns we need. */
function csvObjects(text, mustHave){
  const rows = parseCsv(text);
  if(!rows.length) return [];
  let h = 0;
  if(mustHave) for(let i = 0; i < Math.min(rows.length, 12); i++){
    if(mustHave.every(k => rows[i].includes(k))){ h = i; break; }
  }
  const hdr = rows[h].map(x => x.trim());
  return rows.slice(h+1).map(r => {
    const o = {}; hdr.forEach((k, i) => o[k] = (r[i] || '').trim()); return o;
  });
}
/* LinkedIn's export writes message dates as "2020-04-11 14:22:07 UTC" -
   parseable directly by Date in every real browser, but wrapped so a change
   in export format degrades to "unknown date" instead of a thrown error. */
function msgDate(s){
  const d = new Date(String(s||'').trim());
  return isNaN(d.getTime()) ? null : d;
}
const median = (nums)=>{
  const a = nums.filter(n=>n!=null).sort((x,y)=>x-y);
  return a.length ? a[Math.floor(a.length/2)] : null;
};

/* What the message archive is worth, and what it is not.
   LinkedIn's messages.csv has FROM / SENDER PROFILE URL / TO / DATE / SUBJECT
   / CONTENT / CONVERSATION ID. Matching the user's own name against FROM is
   how we tell which half is theirs; if the name cannot be matched at all we
   keep nothing rather than guess, because guessing wrong here means storing
   someone else's words as if they were the user's own.

   Grew from messageStyle() into messageGraph(): still returns every field the
   voice-sample feature already depends on (sent/received/identified/
   medianSentLength/styleSamples), and additionally groups by CONVERSATION ID
   into per-thread aggregates - who the thread is with, how many messages each
   way, when it started and last moved, whether they wrote first, and the
   reply-time gap each time the sender alternates. This is the one parsing
   pass "Your Network, Decoded" chapters 3-5 are built from; nothing else
   reads messages.csv content, so this only ever runs once per import. */
function messageGraph(rows, profile, connections){
  const first = clean((profile||{})['First Name']).toLowerCase();
  const last  = clean((profile||{})['Last Name']).toLowerCase();
  const me    = clean(first + ' ' + last).toLowerCase();
  const isMe = (name)=>{
    const n = clean(name).toLowerCase();
    return !!n && me && (n === me || (first && last && n.indexOf(first)>=0 && n.indexOf(last)>=0));
  };
  const mine = [], theirs = [];
  const byThread = {};
  (rows||[]).forEach(r=>{
    const from = clean(r['FROM']);
    if(!from) return;
    const mineRow = isMe(from);
    (mineRow ? mine : theirs).push(r);
    /* No CONVERSATION ID in some exports - fall back to grouping by the
       other party's name, which is what a thread means in a 1:1 DM export. */
    const key = clean(r['CONVERSATION ID']) || 'name:'+clean(mineRow ? r['TO'] : from).toLowerCase();
    (byThread[key] = byThread[key]||[]).push({...r, _mine: mineRow, _date: msgDate(r['DATE'])});
  });

  const identified = !!me && mine.length > 0;
  const lens = mine.map(r=>clean(r['CONTENT']).length).filter(n=>n>0);
  const samples = identified
    ? mine.map(r=>clean(r['CONTENT'])).filter(t=>t.length>=40 && t.length<=1200).slice(-60)
    : [];

  /* Per-thread aggregates, and the two global "how you show up" pools this
     only makes sense computed once across every thread at once. */
  const counterparts = [];
  const myReplyGaps = [], theirReplyGaps = [];
  let threadsWhereTheyWroteFirst = 0, threadsIStartedWithReply = 0, threadsIStarted = 0, datedThreads = 0;
  if(identified) Object.keys(byThread).forEach(key=>{
    const msgs = byThread[key].filter(m=>m._date).sort((a,b)=>a._date-b._date);
    if(!msgs.length) return;
    datedThreads++;
    const theirMsg = msgs.find(m=>!m._mine);
    const name = clean(theirMsg && theirMsg['FROM']) || 'Unknown';
    const profileUrl = clean(theirMsg && theirMsg['SENDER PROFILE URL']) || null;
    const sentCount = msgs.filter(m=>m._mine).length;
    const receivedCount = msgs.length - sentCount;
    const theyWroteFirst = !msgs[0]._mine;
    if(theyWroteFirst) threadsWhereTheyWroteFirst++;
    else {
      threadsIStarted++;
      if(receivedCount>0) threadsIStartedWithReply++;
    }
    for(let i=1;i<msgs.length;i++){
      if(msgs[i]._mine === msgs[i-1]._mine) continue;
      const gap = msgs[i]._date - msgs[i-1]._date;
      if(gap<0) continue;
      (msgs[i]._mine ? myReplyGaps : theirReplyGaps).push(gap);
    }
    if(sentCount>0 || receivedCount>0) counterparts.push({
      name, profileUrl, msgCount:msgs.length, sentCount, receivedCount,
      firstAt: msgs[0]._date.toISOString(), lastAt: msgs[msgs.length-1]._date.toISOString(),
      theyWroteFirst,
    });
  });
  /* Ranked by the plain tuple the spec calls for - total messages, then span,
     then recency - explained in words wherever it renders, never as a score. */
  counterparts.sort((a,b)=> b.msgCount-a.msgCount
    || (new Date(b.lastAt)-new Date(b.firstAt))-(new Date(a.lastAt)-new Date(a.firstAt))
    || new Date(b.lastAt)-new Date(a.lastAt));

  /* "The sleep" (Decoded chapter 3) needs a per-CONNECTION verdict - never
     messaged, messaged-then-quiet, still active - across the whole 1,928-row
     Connections.csv, not just the top 50 kept for display. So this join runs
     here, against the full counterparts list, before anything gets sliced.
     Matched by profile URL first (LinkedIn's own identifier); by exact
     full-name second, since group DMs and some exports omit SENDER PROFILE
     URL. Coverage of the URL match is tracked so a low-coverage archive can
     say "at least" instead of an exact count - the one rule in the spec. */
  let sleep = null;
  if(identified && connections && connections.length){
    const byUrl = {}, byName = {};
    counterparts.forEach(cp=>{
      if(cp.profileUrl) byUrl[cp.profileUrl.replace(/\/$/,'').toLowerCase()] = cp;
      const nk = cp.name.toLowerCase();
      if(nk && !byName[nk]) byName[nk] = cp;
    });
    let never=0, quiet=0, active=0, urlMatched=0, nameMatched=0;
    const quietDays = [];
    const TWO_YEARS = 2*365*DAY;
    connections.forEach(c=>{
      const urlKey = (c.profile_url||'').replace(/\/$/,'').toLowerCase();
      let cp = urlKey ? byUrl[urlKey] : null;
      const viaUrl = !!cp;
      if(!cp){
        const nameKey = clean((c.first_name||'')+' '+(c.last_name||'')).toLowerCase();
        cp = nameKey ? byName[nameKey] : null;
      }
      if(!cp){ never++; return; }
      if(viaUrl) urlMatched++; else nameMatched++;
      const ageMs = Date.now() - new Date(cp.lastAt).getTime();
      if(ageMs >= TWO_YEARS){ quiet++; quietDays.push(Math.round(ageMs/DAY)); }
      else active++;
    });
    const matchedTotal = urlMatched + nameMatched;
    const urlCoverage = matchedTotal ? urlMatched/matchedTotal : null;
    sleep = {
      total: connections.length, never, quiet, active,
      medianQuietDays: median(quietDays),
      urlCoverage, approx: urlCoverage!=null && urlCoverage<0.6,
    };
  }

  return {
    sent: mine.length,
    received: theirs.length,
    identified,
    medianSentLength: lens.length ? lens.slice().sort((a,b)=>a-b)[Math.floor(lens.length/2)] : 0,
    /* Capped hard. This is a writing sample, not a mail archive, and the raw
       zip is already stored if we ever need more. */
    styleSamples: samples.slice(0, 40).map(t=>t.slice(0, 600)),
    /* Everything below is new, for the Decoded reading. counterparts capped -
       size discipline per the spec, not a real limit on what happened. */
    counterparts: counterparts.slice(0, 50),
    showUp: identified && datedThreads>0 ? {
      totalThreads: datedThreads,
      theyWroteFirstPct: Math.round(threadsWhereTheyWroteFirst/datedThreads*100),
      iWroteFirstCount: threadsIStarted,
      iWroteFirstReplyPct: threadsIStarted>0 ? Math.round(threadsIStartedWithReply/threadsIStarted*100) : null,
      myMedianReplyMs: median(myReplyGaps),
      theirMedianReplyMs: median(theirReplyGaps),
    } : null,
    sleep,
  };
}
const liDate = (s)=>{                       // "26 Jul 2026" -> "2026-07-26"
  const m = String(s||'').trim().match(/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})$/);
  if(!m) return null;
  const mi = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec']
    .indexOf(m[2].toLowerCase());
  if(mi < 0) return null;
  return m[3] + '-' + String(mi+1).padStart(2,'0') + '-' + m[1].padStart(2,'0');
};
/* Invitations.csv writes "Sent At" as "9/14/16 2:11 PM" (M/D/YY, not the "26
   Jul 2026" format Connected On uses) - a second parser rather than
   stretching liDate to guess between two genuinely different formats. */
const invDate = (s)=>{
  const m = String(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(!m) return null;
  let yr = parseInt(m[3],10); if(yr<100) yr += yr<70 ? 2000 : 1900;
  const mo = parseInt(m[1],10), day = parseInt(m[2],10);
  if(mo<1||mo>12||day<1||day>31) return null;
  return yr + '-' + String(mo).padStart(2,'0') + '-' + String(day).padStart(2,'0');
};

/* ===================== Your Network, Decoded =====================
   buildDecoded() turns one parsed archive into the seven stored chapters
   (decoded-spec.md's "the eight chapters" minus chapter 8, which is computed
   live from goalTypes + connections_match and never stored). Pure and
   $0.00 - no AI call, every number traceable to a row in the export. Runs
   once at import/reimport time inside Onboarding.finish(); the reading in
   Patterns only ever reads kb.decoded back out, never the raw archive. */
const MONTHS3 = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
/* Positions.csv writes "Started On"/"Finished On" as "Jul 2025". Education's
   Start/End Date format is not confirmed by any real export we have on hand,
   so this tries the same month-year shape first and falls back to a bare
   4-digit year (Jan 1 for a start, Dec 31 for an end) rather than dropping
   the era - a rough era beats no era. */
function eraDateMs(s, endOfYear){
  const m = String(s||'').trim().match(/^([A-Za-z]{3,9})\s+(\d{4})$/);
  if(m){
    const mi = MONTHS3.indexOf(m[1].slice(0,3).toLowerCase());
    if(mi>=0) return Date.UTC(parseInt(m[2],10), mi, 1);
  }
  const y = String(s||'').trim().match(/(\d{4})/);
  if(!y) return null;
  return Date.UTC(parseInt(y[1],10), endOfYear?11:0, endOfYear?31:1);
}
function monthYearLabel(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00Z');
  if(isNaN(d.getTime())) return null;
  return d.toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'});
}
/* One "era" per employer or school, stints at the same place merged into one
   span, so two Stripe titles read as one Stripe era the way a person would
   actually describe it. */
function decodedEraList(positions, education){
  const raw = [];
  (positions||[]).forEach(p=>{
    const start = eraDateMs(p.from, false);
    if(start==null) return;
    const end = p.to ? eraDateMs(p.to, true) : Date.now();
    if(clean(p.company)) raw.push({label:clean(p.company), kind:'work', start, end: end==null?Date.now():end});
  });
  (education||[]).forEach(e=>{
    const start = eraDateMs(e.from, false);
    if(start==null) return;
    const end = e.to ? eraDateMs(e.to, true) : start;
    if(clean(e.school)) raw.push({label:clean(e.school), kind:'school', start, end: end==null?start:end});
  });
  const merged = {};
  raw.forEach(r=>{
    const k = r.kind+':'+r.label.toLowerCase();
    if(!merged[k]) merged[k] = {...r};
    else{ merged[k].start = Math.min(merged[k].start, r.start); merged[k].end = Math.max(merged[k].end, r.end); }
  });
  return Object.values(merged).sort((a,b)=>a.start-b.start);
}
function decodedEraFor(eras, ms){
  const matches = eras.filter(e=>ms>=e.start && ms<=e.end);
  if(!matches.length) return null;
  const work = matches.filter(e=>e.kind==='work');
  const pool = work.length ? work : matches;
  return pool.reduce((a,b)=> b.start>a.start ? b : a);
}

/* Chapter 1 - the opening frame. */
function decodedFrame(connections){
  const dated = connections.map(c=>c.connected_on).filter(Boolean).sort();
  const companies = new Set(connections.map(c=>clean(c.company)).filter(Boolean));
  const positions = new Set(connections.map(c=>clean(c.position)).filter(Boolean));
  const startDate = dated[0] || null;
  return {
    total: connections.length,
    startDate, startLabel: monthYearLabel(startDate),
    companyCount: companies.size, positionCount: positions.size,
  };
}

/* Chapter 2 - the eras, told by who arrived. */
function decodedEras(connections, positions, education){
  const eras = decodedEraList(positions, education);
  const byYear = {}, eraCounts = {};
  let minYear=null, maxYear=null;
  connections.forEach(c=>{
    if(!c.connected_on) return;
    const y = parseInt(c.connected_on.slice(0,4),10);
    if(!y) return;
    byYear[y] = (byYear[y]||0)+1;
    minYear = minYear==null ? y : Math.min(minYear,y);
    maxYear = maxYear==null ? y : Math.max(maxYear,y);
    if(eras.length){
      const era = decodedEraFor(eras, new Date(c.connected_on+'T00:00:00Z').getTime());
      if(era) eraCounts[era.label] = (eraCounts[era.label]||0)+1;
    }
  });
  const years = [];
  if(minYear!=null) for(let y=minYear;y<=maxYear;y++) years.push({year:y, count:byYear[y]||0});
  const nonZero = years.filter(y=>y.count>0);
  const fastestYear = nonZero.length ? nonZero.reduce((a,b)=>b.count>a.count?b:a) : null;
  const quietestYear = nonZero.length ? nonZero.reduce((a,b)=>b.count<a.count?b:a) : null;
  const eraList = Object.keys(eraCounts).map(label=>({label, count:eraCounts[label]}))
    .sort((a,b)=>b.count-a.count);
  return {
    hasEras: eras.length>0, years, fastestYear, quietestYear,
    topEra: eraList[0]||null, eras: eraList.slice(0,6),
  };
}

/* Chapter 5 - the ones who kept showing up. Ranking already happened inside
   messageGraph(); this just takes the top five and phrases the share. */
function decodedCircle(messages){
  if(!messages || !messages.identified || !(messages.counterparts||[]).length) return null;
  const top = messages.counterparts.slice(0,5);
  const topSent = top.reduce((s,c)=>s+c.sentCount,0);
  return {
    top: top.map(c=>({name:c.name, profileUrl:c.profileUrl, msgCount:c.msgCount,
      sentCount:c.sentCount, receivedCount:c.receivedCount, firstAt:c.firstAt, lastAt:c.lastAt})),
    shareOfWordsPct: messages.sent ? Math.round(topSent/messages.sent*100) : null,
  };
}

/* Chapter 6 - the shape of the room. Every label is read straight off a
   title string and says so; nothing here is inferred from outside the
   export (no geography - Connections.csv carries no location column). */
const DECODED_FUNCTIONS = [
  {key:'founder',     words:['founder','co-founder']},
  {key:'engineering', words:['engineer','developer','software','devops','architect','swe']},
  {key:'product',     words:['product manager','product lead','product owner']},
  {key:'design',      words:['designer','design lead',' ux',' ui ']},
  {key:'sales',       words:['sales','account executive','business development']},
  {key:'marketing',   words:['marketing','growth marketing','brand']},
  {key:'investing',   words:['investor','venture partner','venture capital',' vc ','angel investor']},
  {key:'clinical',    words:['clinical','physician',' md ','nurse','pharmacist','regulatory affairs']},
  {key:'operations',  words:['operations','supply chain','logistics']},
  {key:'finance',     words:['finance','accounting','controller','treasury',' cfo']},
  {key:'legal',       words:['legal counsel','attorney','compliance']},
  {key:'talent',      words:['recruiter','talent acquisition','human resources','people ops']},
];
const DECODED_SENIOR_WORDS = ['founder','co-founder','ceo','cto','coo','cfo','chief',
  'partner','vp ','vice president','svp','evp','director','head of'];
function decodedShape(connections, positions){
  if(!connections.length) return null;
  const companyCounts = {};
  connections.forEach(c=>{
    const co = clean(c.company);
    if(!co) return;
    const k = co.toLowerCase();
    (companyCounts[k] = companyCounts[k] || {label:co, count:0}).count++;
  });
  const topCompanies = Object.values(companyCounts).sort((a,b)=>b.count-a.count).slice(0,8);

  const titled = connections.filter(c=>clean(c.position));
  const funcCounts = {};
  titled.forEach(c=>{
    const t = ' '+clean(c.position).toLowerCase()+' ';
    const hit = DECODED_FUNCTIONS.find(f=>f.words.some(w=>t.indexOf(w)>=0));
    if(hit) funcCounts[hit.key] = (funcCounts[hit.key]||0)+1;
  });
  const functions = Object.keys(funcCounts).map(key=>({key, count:funcCounts[key]}))
    .sort((a,b)=>b.count-a.count).slice(0,6);

  const seniorCount = titled.filter(c=>{
    const t = ' '+clean(c.position).toLowerCase()+' ';
    return DECODED_SENIOR_WORDS.some(w=>t.indexOf(w)>=0);
  }).length;

  const ownCompanies = new Set((positions||[]).map(p=>clean(p.company).toLowerCase()).filter(Boolean));
  const alumniCount = ownCompanies.size
    ? connections.filter(c=>ownCompanies.has(clean(c.company).toLowerCase())).length : 0;

  return {
    total: connections.length, topCompanies, functions,
    seniorCount, seniorFraction: connections.length ? seniorCount/connections.length : 0,
    alumniCount,
  };
}

/* Chapter 7 - the doors you knocked on. Acceptance is joined by name against
   Connections.csv, so it is always phrased "at least" - a name match
   undercounts (remarried surnames, nicknames, non-Latin transliteration). */
function decodedDoors(invitations, connections){
  if(!invitations || !(invitations.rows||[]).length) return null;
  const rows = invitations.rows;
  const sent = rows.filter(r=>r.direction==='OUTGOING');
  const nameSet = new Set((connections||[])
    .map(c=>clean((c.first_name||'')+' '+(c.last_name||'')).toLowerCase()).filter(Boolean));
  const accepted = sent.filter(r=>r.to && nameSet.has(r.to.toLowerCase())).length;
  const byYear = {};
  sent.forEach(r=>{ if(r.sentAt){ const y=r.sentAt.slice(0,4); byYear[y]=(byYear[y]||0)+1; } });
  const years = Object.keys(byYear).map(y=>({year:parseInt(y,10), count:byYear[y]})).sort((a,b)=>a.year-b.year);
  const busiestYear = years.length ? years.reduce((a,b)=>b.count>a.count?b:a) : null;
  return {
    sentTotal: invitations.outgoing, receivedTotal: invitations.incoming,
    acceptedAtLeast: accepted,
    acceptancePct: invitations.outgoing ? Math.round(accepted/invitations.outgoing*100) : null,
    busiestYear, years,
  };
}

/* The whole reading, computed once. Null when there is no archive to read at
   all - Patterns shows the single import-prompt card the spec calls for
   rather than seven empty chapters. Individual chapters are null on their
   own narrower gaps (no messages.csv, no positions, no invitations) so each
   one can show its own honest one-liner instead of silently vanishing. */
function buildDecoded(archive){
  if(!archive || !(archive.connections||[]).length) return null;
  const messages = archive.messages;
  return {
    computedAt: new Date().toISOString(),
    messagesPresent: !!archive.messagesPresent,
    chapters: {
      frame: decodedFrame(archive.connections),
      eras: decodedEras(archive.connections, archive.positions, archive.education),
      sleep: messages ? messages.sleep : null,
      showUp: messages ? messages.showUp : null,
      circle: decodedCircle(messages),
      shape: decodedShape(archive.connections, archive.positions),
      doors: decodedDoors(archive.invitations, archive.connections),
    },
  };
}

/* Read the archive. Returns what it found and what it could not find, because
   "no posts in this export" is information the user should see rather than a
   silently missing section. */
async function readArchive(file){
  if(!window.JSZip) throw new Error('The archive reader did not load. Reload the page and try again.');
  const zip = await window.JSZip.loadAsync(file);
  const find = (name)=>{
    const hit = Object.keys(zip.files).find(k =>
      k.toLowerCase().endsWith(name.toLowerCase()) && !k.includes('__MACOSX'));
    return hit ? zip.files[hit] : null;
  };
  const grab = async (name, mustHave)=>{
    const f = find(name); if(!f) return null;
    return csvObjects(await f.async('string'), mustHave);
  };

  const profile   = await grab('Profile.csv', ['First Name','Headline']);
  const positions = await grab('Positions.csv', ['Company Name','Title']);
  const education = await grab('Education.csv', ['School Name']);
  const skills    = await grab('Skills.csv', ['Name']);
  const langs     = await grab('Languages.csv', ['Name']);
  const honors    = await grab('Honors.csv', ['Title']);
  const pubs      = await grab('Publications.csv', ['Name']);
  const recs      = await grab('Recommendations_Received.csv', ['First Name']);
  const invites   = await grab('Invitations.csv', ['From','Direction']);
  const conns     = await grab('Connections.csv', ['First Name','URL','Connected On']);
  const msgs      = await grab('messages.csv', ['FROM','TO','CONTENT']);

  const p = (profile && profile[0]) || {};
  const pos = (positions || []).map(r => ({
    title: r['Title'], company: r['Company Name'], location: r['Location'] || '',
    from: r['Started On'] || '', to: r['Finished On'] || '',
    description: (r['Description'] || '').slice(0, 900),
  })).filter(x => x.title || x.company);

  const connections = (conns || []).map(r => ({
    profile_url: (r['URL'] || '').trim().replace(/\/$/, ''),
    first_name: r['First Name'], last_name: r['Last Name'],
    company: r['Company'], position: r['Position'],
    connected_on: liDate(r['Connected On']),
  })).filter(c => c.profile_url);

  return {
    identity: {
      firstName: p['First Name'] || '', lastName: p['Last Name'] || '',
      headline: p['Headline'] || '', location: p['Geo Location'] || '',
      industry: p['Industry'] || '', summary: (p['Summary'] || '').slice(0, 2500),
    },
    positions: pos,
    education: (education || []).map(r => ({
      school: r['School Name'], degree: r['Degree Name'] || '',
      from: r['Start Date'] || '', to: r['End Date'] || '',
    })).filter(e => e.school),
    skills: (skills || []).map(r => r['Name']).filter(Boolean),
    languages: (langs || []).map(r => r['Name'] + (r['Proficiency'] ? ' (' + r['Proficiency'] + ')' : '')).filter(Boolean),
    honors: (honors || []).map(r => r['Title']).filter(Boolean),
    publications: (pubs || []).map(r => r['Name']).filter(Boolean),
    recommendationCount: (recs || []).length,
    invitations: {
      total: (invites || []).length,
      incoming: (invites || []).filter(r => (r['Direction'] || '').toUpperCase() === 'INCOMING').length,
      outgoing: (invites || []).filter(r => (r['Direction'] || '').toUpperCase() === 'OUTGOING').length,
      /* For chapter 7 ("the doors you knocked on") - the acceptance estimate
         needs which year and who, not just a total. Capped like everything
         else that goes into kb.decoded. */
      rows: (invites || []).slice(0, 4000).map(r => ({
        from: clean(r['From']), to: clean(r['To']),
        sentAt: invDate(r['Sent At']) || null,
        direction: (r['Direction']||'').toUpperCase(),
      })).filter(r => r.from || r.to),
    },
    connections,
    /* Read, with the consent screen saying so.
       The line is not "do we open this file" - it is whose words we keep. The
       user's own sent messages are the only place their actual writing voice
       exists, and a product that drafts in your voice without ever having seen
       it is guessing. So the sent half is sampled and kept.
       The received half is deliberately not: those are someone else's words,
       written to one person, and they teach Mighty nothing about how the user
       writes. Counting them is enough. */
    messages: msgs ? messageGraph(msgs, p, connections) : null,
    messagesPresent: !!msgs,
    missing: [
      !find('Shares.csv') && 'your posts',
      !find('Comments.csv') && 'your comments',
      !profile && 'your profile summary',
    ].filter(Boolean),
  };
}

/* Resume. The archive already gives dated positions and education far more
   cleanly than any PDF, so this is here for the parts only a resume carries:
   the summary, and achievements with numbers attached. */
async function readResumePdf(file){
  const lib = window.pdfjsLib;
  if(!lib) throw new Error('pdf');
  lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const doc = await lib.getDocument({data: buf}).promise;
  let out = '';
  for(let i = 1; i <= doc.numPages; i++){
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    out += tc.items.map(x => x.str).join(' ') + '\n';
  }
  return out.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
}

const OB_STEPS = ['Privacy','History','Resume','Goal','Questions'];

/* How complete is this profile, and what would move it.
   Five equal slices. Creating the account is one of them, which is why someone
   who skips everything still sees 20 rather than 0 - they did do something. Skip
   to the end after setting a goal and it reads 40, which is the honest number:
   Mighty has your goal and your account and nothing else. */
function completion(st){
  const kb = (st && st.knowledge) || {};
  const items = [
    {key:'account',   label:'Account created',        done:true,
     hint:'Done the moment you signed up.'},
    {key:'goal',      label:'A goal',                 done:!!(clean(st&&st.goal) || (st&&st.goalTypes||[]).length),
     hint:'Decides who Mighty recommends. Nothing works well without it.'},
    {key:'history',   label:'LinkedIn history',       done:!!kb.connectionCount,
     hint:'The pool Discover ranks. The single biggest jump in quality.'},
    {key:'resume',    label:'Resume',                 done:!!clean(kb.resumeText),
     hint:'Where the achievements with numbers on them live.'},
    {key:'questions', label:'The things only you know', done:!!((kb.answers||[]).length),
     hint:'Three answers Mighty cannot read off any file.'},
  ];
  const done = items.filter(x=>x.done).length;
  return {pct: Math.round(done/items.length*100), items, done, total: items.length};
}

function Onboarding({sb, user, settings, onSave, onDone, startStep}){
  /* Re-entering to fix one specific thing (a stale resume, a wrong role) used
     to always restart at Privacy, a re-consent screen for something already
     agreed to once. startStep lets "Update resume" and "Correct this" land
     on the step that is actually relevant, not the front of a five-step
     wizard. Brand-new accounts still start at 0 - only re-entry ever passes
     a later step. */
  const [step,setStep]   = useState(startStep||0);
  /* Rule 4: mechanics go behind a link, anything we do with the user's data stays
     on the surface. This is the link. */
  const [detail,setDetail] = useState(false);
  const [busy,setBusy]   = useState(null);
  const [err,setErr]     = useState(null);
  const [prog,setProg]   = useState(null);
  const [agreed,setAgreed] = useState(false);
  const [arch,setArch]   = useState(null);          // parsed archive
  /* Onboarding is now re-enterable from "Correct this" on an account that
     already has a Knowledge Base, not just on a brand-new account. Seeding
     these from the existing settings/knowledge means finishing WITHOUT
     re-uploading a file keeps what was already there instead of finish()
     writing back empty defaults over it. */
  const kbExisting = settings.knowledge || {};
  const [resume,setResume] = useState(kbExisting.resumeText || '');
  const [ident,setIdent] = useState({
    headline: (kbExisting.identity||{}).headline || '',
    location: settings.homeLocation || (kbExisting.identity||{}).location || '',
    currentRole: settings.currentRole || '', currentCompany: settings.currentCompany || '',
  });
  const [goal,setGoal]   = useState(settings.goal || '');
  /* Plural. Someone raising a round is usually also hiring, and forcing one
     answer made the ranking worse for the honest case. goalType survives as the
     first choice so everything downstream keeps working unchanged. */
  const [goalTypes,setGoalTypes] = useState(
    settings.goalTypes || (settings.goalType ? [settings.goalType] : []));
  const toggleGoal = (id)=>setGoalTypes(g => g.includes(id) ? g.filter(x=>x!==id) : g.concat(id));
  const [qs,setQs]       = useState([]);
  const [answers,setAnswers] = useState({});
  const archRef = useRef(null); const cvRef = useRef(null);

  const next = ()=>{ setErr(null); setStep(s => Math.min(s+1, OB_STEPS.length-1)); window.scrollTo({top:0}); };
  const back = ()=>{ setErr(null); setStep(s => Math.max(s-1, 0)); window.scrollTo({top:0}); };

  /* ---- archive ---- */
  async function onArchive(file){
    if(!file || busy) return;
    setBusy('arch'); setErr(null); setProg('Opening the archive…');
    try{
      const d = await readArchive(file);
      /* A zip with none of LinkedIn's expected CSVs still parses "successfully"
         - every array just comes back empty. Without this check that showed a
         green "0 connections, 0 roles read" checkmark, indistinguishable from
         actually reading an empty export, instead of telling the user they
         picked the wrong file. */
      const empty = !d.connections.length && !d.positions.length && !d.education.length &&
        !d.skills.length && !d.identity.headline && !clean(d.identity.summary||'');
      if(empty) throw new Error("That did not look like a LinkedIn export - none of the expected files were inside. "
        + "It should be the .zip LinkedIn emailed you, unzipped folder renamed back to .zip if needed.");
      setArch(d);
      const p0 = d.positions[0] || {};
      setIdent({ headline: d.identity.headline, location: d.identity.location,
                 currentRole: p0.title || '', currentCompany: p0.company || '' });
      track('kb_archive_parsed', {connections:d.connections.length, positions:d.positions.length,
                                 skills:d.skills.length, messages:d.messagesPresent,
                                 style_samples: d.messages ? d.messages.styleSamples.length : 0,
                                 style_identified: d.messages ? d.messages.identified : false});

      /* Keep the file. The parser will improve and re-deriving beats asking
         someone to export again. Failure here must not lose the parse. */
      setProg('Saving what we read…');
      let path = null;
      try{
        path = user.id + '/linkedin-' + Date.now() + '.zip';
        const up = await sb.storage.from('archives').upload(path, file, {upsert:true, contentType:'application/zip'});
        if(up.error) throw up.error;
      }catch(e){ path = null; }

      setProg('Adding ' + d.connections.length.toLocaleString() + ' connections…');
      let done = 0;
      for(let i = 0; i < d.connections.length; i += 400){
        const chunk = d.connections.slice(i, i+400).map(c => ({...c, user_id:user.id}));
        const {error} = await sb.from('connections').upsert(chunk, {onConflict:'user_id,profile_url'});
        if(error) throw error;
        done += chunk.length;
        setProg('Adding connections… ' + done.toLocaleString() + ' of ' + d.connections.length.toLocaleString());
      }
      try{
        await sb.from('imports').insert({user_id:user.id, kind:'linkedin_archive', storage_path:path,
          file_name:file.name, file_bytes:file.size,
          derived:{connections:d.connections.length, positions:d.positions.length,
                   skills:d.skills.length, messagesPresent:d.messagesPresent}});
      }catch(e){}
      setProg(null); setBusy(null); next();
    }catch(e){
      setProg(null); setBusy(null);
      setErr((e && e.message) || 'That file could not be read. It should be the .zip LinkedIn emailed you.');
    }
  }

  /* ---- resume ---- */
  async function onResume(file){
    if(!file || busy) return;
    setBusy('cv'); setErr(null);
    try{
      const t = await readResumePdf(file);
      if(t.length < 200) throw new Error('short');
      setResume(t); setBusy(null);
      track('kb_resume_parsed', {chars:t.length});
    }catch(e){
      setBusy(null);
      setErr('That PDF would not give up its text. Paste it below instead.');
    }
  }

  /* ---- questions Mighty could not answer itself ---- */
  async function makeQuestions(){
    setBusy('qs'); setErr(null);
    try{
      const known = [
        ident.headline && ('Headline: ' + ident.headline),
        arch && arch.positions.slice(0,6).map(p => p.title + ' at ' + p.company + ' (' + p.from + ' to ' + (p.to||'now') + ')').join('; '),
        arch && arch.education.map(e => (e.degree||'') + ' ' + e.school).join('; '),
        arch && arch.skills.length && ('Skills: ' + arch.skills.slice(0,25).join(', ')),
        arch && arch.honors.length && ('Recognition: ' + arch.honors.join('; ')),
        resume && ('From their resume: ' + resume.slice(0, 2200)),
        goal && ('Their stated goal: ' + goal),
      ].filter(Boolean).join('\n');
      const out = await llmJSON(sb, 'tagging',
        'You are helping a relationship tool understand a new user. You will be given everything it already knows. Ask ONLY what cannot be inferred from it. Never ask something the text already answers. Never ask for a job title, employer, school or skill that is listed. Aim at intent, constraints, and what "success" means to them. Short, direct, one sentence each. No preamble. Never use em dashes; write a spaced hyphen instead.',
        'Everything already known:\n' + known + '\n\nReturn JSON {"questions":["...","...","..."]} with exactly 3 questions, each under 20 words.',
        500, 'ex:0:'+Date.now());
      const list = (out.questions || []).filter(x => clean(x)).slice(0,3);
      setQs(list.length ? list : [
        'What would make the next twelve months a success, in one sentence?',
        'Who do you most need to meet that you have no route to today?',
        'What is the hardest part of keeping a professional relationship alive for you?',
      ]);
      setBusy(null);
    }catch(e){
      setQs([
        'What would make the next twelve months a success, in one sentence?',
        'Who do you most need to meet that you have no route to today?',
        'What is the hardest part of keeping a professional relationship alive for you?',
      ]);
      setBusy(null);
    }
  }

  /* ---- finish ---- */
  async function finish(){
    if(busy) return;
    setBusy('save'); setErr(null);
    try{
      /* Onboarding is re-enterable ("Correct this") on an account that already
         has a Knowledge Base. Finishing without re-uploading a file must keep
         what was already there, not overwrite it with these fields' empty
         defaults - that silently erased an existing KB (including voice
         samples makeDraft() depends on) on every re-entry that skipped the
         upload step. Every arch-less fallback below reads the existing value
         instead of a hardcoded empty one. */
      const newAnswers = Object.keys(answers).map(k => ({q:k, a:clean(answers[k])})).filter(x => x.a);
      const kb = {
        source: 'linkedin_archive',
        capturedAt: arch ? new Date().toISOString() : (kbExisting.capturedAt || new Date().toISOString()),
        identity: arch ? arch.identity : (kbExisting.identity || {headline: ident.headline, location: ident.location}),
        positions: arch ? arch.positions : (kbExisting.positions || []),
        education: arch ? arch.education : (kbExisting.education || []),
        skills: arch ? arch.skills : (kbExisting.skills || []),
        languages: arch ? arch.languages : (kbExisting.languages || []),
        honors: arch ? arch.honors : (kbExisting.honors || []),
        publications: arch ? arch.publications : (kbExisting.publications || []),
        recommendationCount: arch ? arch.recommendationCount : (kbExisting.recommendationCount || 0),
        invitations: arch ? arch.invitations : (kbExisting.invitations || null),
        connectionCount: arch ? arch.connections.length : (kbExisting.connectionCount || 0),
        messagesPresent: arch ? arch.messagesPresent : (kbExisting.messagesPresent || false),
        messages: arch ? arch.messages : (kbExisting.messages || null),
        /* "Your Network, Decoded" - computed once here (first run and every
           reimport), read many times in Patterns. Never recomputed from raw
           messages/connections at render time. */
        decoded: arch ? buildDecoded(arch) : (kbExisting.decoded || null),
        resumeText: resume ? resume.slice(0, 12000) : (kbExisting.resumeText || ''),
        /* Stamped only when the resume text actually changed, not on every
           re-save - re-entering onboarding to fix an unrelated field should
           not make an untouched resume look freshly updated. */
        resumeUpdatedAt: resume && resume!==kbExisting.resumeText ? new Date().toISOString() : (kbExisting.resumeUpdatedAt || null),
        answers: newAnswers.length ? newAnswers : (kbExisting.answers || []),
      };
      await onSave({
        goalType: goalTypes[0] || 'networking',
        goalTypes,
        goal: clean(goal),
        currentRole: clean(ident.currentRole) || settings.currentRole || '',
        currentCompany: clean(ident.currentCompany) || settings.currentCompany || '',
        homeLocation: clean(ident.location) || settings.homeLocation || '',
        schools: arch ? arch.education.map(e => e.school).filter(Boolean).slice(0,6) : (settings.schools||[]),
        skills: arch ? arch.skills.slice(0,40) : (settings.skills||[]),
        knowledge: kb,
        strategyUpdatedAt: new Date().toISOString(),
      });
      track('kb_onboarding_done', {had_archive:!!arch, had_resume:!!resume,
        answered:kb.answers.length, connections:kb.connectionCount});
      onDone();
    }catch(e){ setErr((e && e.message) || 'Could not save.'); setBusy(null); }
  }

  const H = ({children})=>
    <h1 style={{fontSize:'clamp(34px,4.6vw,54px)',lineHeight:1.02,letterSpacing:'-.04em',
      fontWeight:800,margin:0,maxWidth:'15ch'}}>{children}</h1>;
  const Sub = ({children})=>
    <div style={{marginTop:16,fontSize:17,lineHeight:1.55,color:'var(--sub)',maxWidth:'52ch'}}>{children}</div>;
  /* Every step can be left for later. The bar on Strategy then says what is
     missing, so skipping is a deferral rather than a hole nobody mentions again. */
  /* Disabled for ANY in-flight busy state, not just 'save' - clicking this
     while a resume was still parsing (busy==='cv') discarded the parse the
     moment finish() ran with resume still empty, and clicking it mid-archive
     upload (busy==='arch') left that upload running with no UI anywhere
     left to show its progress. */
  const Later = ()=>
    <button className="btn q" style={{fontSize:13.5}} onClick={finish} disabled={!!busy}>
      {busy==='save' ? 'Saving…' : busy ? 'One moment…' : 'Do it later'}
    </button>;
  const Actions = ({label, onNext, disabled})=>
    <div className="row" style={{gap:14,marginTop:38,flexWrap:'wrap',alignItems:'center'}}>
      <button className="btn" style={{padding:'13px 30px',fontSize:15}} onClick={onNext} disabled={disabled}>{label}</button>
      {step>0 && <button className="btn q" style={{fontSize:12.5,letterSpacing:'.1em',textTransform:'uppercase'}} onClick={back} disabled={!!busy}>Back</button>}
      <div style={{flex:1}}/>
      <Later/>
    </div>;

  return (
    <div className="fade" style={{display:'flex',minHeight:'100vh',alignItems:'stretch'}}>

      {/* the rail: where you are, and what is still ahead */}
      <aside style={{width:300,flex:'none',padding:'46px 0 46px 44px',borderRight:'1px solid var(--line2)',
        display:'flex',flexDirection:'column',gap:38}}>
        <div className="row" style={{gap:10}}>
          <Logo/><span style={{fontSize:19,fontWeight:700,letterSpacing:'-.02em'}}>Mighty</span>
        </div>
        <div className="stack" style={{gap:0,paddingRight:44}}>
          {OB_STEPS.map((label,i)=>{
            const on = i===step, past = i<step;
            return (
              <button key={label} onClick={()=>i<step && !busy && setStep(i)}
                style={{display:'flex',alignItems:'center',gap:18,padding:'17px 0',textAlign:'left',
                  borderTop:'1px solid var(--line2)',
                  borderBottom: i===OB_STEPS.length-1?'1px solid var(--line2)':'none',
                  cursor:past?'pointer':'default',background:'none'}}>
                <span style={{fontFamily:'ui-monospace,Menlo,monospace',fontSize:12,
                  color:on?'var(--brand)':'var(--mute)'}}>{String(i+1).padStart(2,'0')}</span>
                <span style={{fontSize:13.5,letterSpacing:'.12em',textTransform:'uppercase',
                  fontWeight:on?700:500,color:on?'var(--ink)':(past?'var(--ink2)':'var(--mute)')}}>{label}</span>
              </button>
            );
          })}
        </div>
        <div style={{flex:1}}/>
        <div className="meta" style={{paddingRight:44,lineHeight:1.5}}>
          Everything here is optional except the goal, and even that can wait.
        </div>
      </aside>

      {/* the step itself */}
      <main style={{flex:1,minWidth:0,padding:'46px 52px 80px',maxWidth:980}}>
        <div style={{fontFamily:'ui-monospace,Menlo,monospace',fontSize:12,letterSpacing:'.14em',
          textTransform:'uppercase',color:'var(--brand)'}}>
          {String(step+1).padStart(2,'0')} &middot; {OB_STEPS[step]}
        </div>

        {err && <div className="banner err" style={{marginTop:20,borderRadius:16}}>{err}</div>}

        {/* ---------- 0. privacy ---------- */}
        {step===0 &&
          <div style={{marginTop:14}}>
            <H>Before we begin.</H>
            <Sub>Mighty only works if it reads a little about you. Here is exactly what, in full,
              before you agree to anything.</Sub>
            <div className="stack" style={{gap:0,marginTop:34,maxWidth:'62ch'}}>
              {[['Mighty reads the messages you sent and keeps forty of them, so it can write in your voice rather than a template\u2019s.'],
                ['It reads your connections to see who you already know. It never contacts any of them.'],
                ['Nothing is shared, sold, or used to train a model. Delete it all in one click, whenever.']
              ].map((t,i)=>(
                <div key={i} style={{padding:'20px 0',borderTop:'1px solid var(--line2)',
                  fontSize:16.5,lineHeight:1.55,color:'var(--ink2)'}}>{t[0]}</div>
              ))}
              <label className="row" style={{gap:13,padding:'22px 0',borderTop:'1px solid var(--line2)',
                borderBottom:'1px solid var(--line2)',cursor:'pointer',alignItems:'flex-start'}}>
                <input type="checkbox" checked={agreed} onChange={e=>setAgreed(e.target.checked)}
                  style={{marginTop:3,width:17,height:17,accentColor:'var(--brand)',borderRadius:6}}/>
                <span style={{fontSize:16,color:'var(--ink2)'}}>
                  I understand what Mighty reads, and that it never sends anything for me.
                </span>
              </label>
            </div>
            <Actions label="I understand, continue" onNext={next} disabled={!agreed}/>
          </div>}

        {/* ---------- 1. history ---------- */}
        {step===1 &&
          <div style={{marginTop:14}}>
            <H>Import your LinkedIn history.</H>
            <Sub>Your LinkedIn history shows Mighty who you already know.</Sub>
            <input ref={archRef} type="file" accept=".zip" style={{display:'none'}}
              onChange={e=>onArchive(e.target.files && e.target.files[0])}/>
            <div onClick={()=>archRef.current && archRef.current.click()}
              style={{marginTop:32,border:'1.5px dashed var(--line)',borderRadius:22,padding:'40px 36px',
                cursor:'pointer',maxWidth:640,background:'var(--card2)'}}>
              <div className="eyebrow">Drop the .zip here</div>
              <div style={{fontSize:16.5,lineHeight:1.55,color:'var(--ink2)',marginTop:12}}>
                Request your data from LinkedIn, choosing the archive that includes connections.
              </div>
              <a href="https://www.linkedin.com/mypreferences/d/download-my-data" target="_blank"
                rel="noopener noreferrer" onClick={e=>e.stopPropagation()}
                style={{display:'inline-block',marginTop:16,fontSize:12.5,letterSpacing:'.1em',
                  textTransform:'uppercase',fontWeight:700}}>How to request it</a>
            </div>
            {arch &&
              <div className="row" style={{gap:9,marginTop:16,color:'var(--green)',fontWeight:700,fontSize:14.5}}>
                &#10003; {arch.connections.length.toLocaleString()} connections, {arch.positions.length} roles read.
              </div>}
            {prog && <div className="meta" style={{marginTop:16}}><span className="spin"/> {prog}</div>}
            <div className="meta" style={{marginTop:18}}>Read on this machine. The archive never leaves it.</div>
            <Actions label={busy==='arch' ? 'Reading…' : 'Continue'} onNext={next} disabled={busy==='arch'}/>
          </div>}

        {/* ---------- 2. resume ---------- */}
        {step===2 &&
          <div style={{marginTop:14}}>
            <H>Complete your profile.</H>
            <Sub>Your biggest achievements usually are not on LinkedIn. Your resume fills them in.</Sub>
            <input ref={cvRef} type="file" accept=".pdf" style={{display:'none'}}
              onChange={e=>onResume(e.target.files && e.target.files[0])}/>
            <div onClick={()=>cvRef.current && cvRef.current.click()}
              style={{marginTop:32,border:'1.5px dashed var(--line)',borderRadius:22,padding:'36px 34px',
                cursor:'pointer',maxWidth:520,background:'var(--card2)'}}>
              <div className="eyebrow">Upload</div>
              <div style={{fontSize:17,fontWeight:700,marginTop:10}}>Drop your resume</div>
              <div style={{fontSize:15,color:'var(--sub)',marginTop:6,lineHeight:1.5}}>
                PDF. Read once, then stored as text.
              </div>
            </div>
            {resume &&
              <div style={{marginTop:16,color:'var(--green)',fontWeight:700,fontSize:14.5}}>
                &#10003; Read, {resume.length.toLocaleString()} characters.
              </div>}
            <div style={{marginTop:26,maxWidth:640}}>
              <div className="lbl">Or paste it</div>
              <textarea className="inp" style={{minHeight:120,borderRadius:18}} value={resume}
                onChange={e=>setResume(e.target.value)} placeholder="Paste the text here."/>
            </div>
            <Actions label={busy==='cv' ? 'Reading…' : 'Continue'} onNext={next} disabled={busy==='cv'}/>
          </div>}

        {/* ---------- 3. goal ---------- */}
        {step===3 &&
          <div style={{marginTop:14}}>
            <H>What are you building toward?</H>
            <Sub>Your goal decides who Mighty recommends. Pick as many as are true.</Sub>
            <div className="row" style={{gap:10,flexWrap:'wrap',marginTop:30,maxWidth:760}}>
              {GOALS.map(g=>(
                <button key={g.id} className={'chip'+(goalTypes.includes(g.id)?' on':'')}
                  style={{padding:'12px 22px',fontSize:15,borderRadius:99}}
                  onClick={()=>toggleGoal(g.id)}>{g.label}</button>))}
            </div>
            <div style={{marginTop:30,maxWidth:760}}>
              <div className="lbl">Say it in one sentence</div>
              <textarea className="inp" style={{minHeight:92,borderRadius:18,fontSize:16}} value={goal}
                onChange={e=>setGoal(e.target.value)}
                placeholder="Raise a seed round from investors who understand enterprise AI, and hire two engineers."/>
            </div>
            <Actions label="Continue" onNext={()=>{ next(); if(!qs.length) makeQuestions(); }}
              disabled={!clean(goal) && !goalTypes.length}/>
          </div>}

        {/* ---------- 4. questions ---------- */}
        {step===4 &&
          <div style={{marginTop:14}}>
            <H>A few things only you can tell us.</H>
            <Sub>Chosen after reading everything above, so none of them repeat what your files already said.</Sub>
            {busy==='qs' &&
              <div className="meta" style={{marginTop:26}}><span className="spin"/> Working out what is still missing…</div>}
            <div className="stack" style={{gap:0,marginTop:26,maxWidth:760}}>
              {qs.map((q,i)=>(
                <div key={i} style={{padding:'22px 0',borderTop:'1px solid var(--line2)'}}>
                  <div style={{fontSize:16.5,fontWeight:700,marginBottom:10}}>{q}</div>
                  <textarea className="inp" style={{minHeight:56,borderRadius:16}} value={answers[q]||''}
                    onChange={e=>setAnswers({...answers,[q]:e.target.value})}
                    placeholder={i===0?'Type it plainly':i===1?'A name is enough':'Mighty will start there'}/>
                </div>))}
            </div>
            <Actions label={busy==='save' ? 'Saving…' : 'Enter Mighty'} onNext={finish} disabled={!!busy}/>
          </div>}
      </main>
    </div>
  );
}

/* ===================== app ===================== */
function App(){
  const [sb,setSb] = useState(null);
  const [auth,setAuth] = useState({status:'loading', user:null});
  const [blob,setBlob] = useState(null);
  const [people,setPeople] = useState([]);
  const [events,setEvents] = useState([]);
  const [tasks,setTasks] = useState([]);
  /* Ambiguous reply_detected / connection_accepted rows ingest() deliberately left in
     outreach_inbox rather than guessing - see the comment in ingest() itself. */
  const [pendingActivity,setPendingActivity] = useState([]);
  const [screen,setScreen] = useState('today');
  const [personId,setPersonId] = useState(null);
  const [tab,setTab] = useState('overview');
  const [relView,setRelView] = useState('list');
  const [youTab,setYouTab] = useState('mirror');
  const [askDraft,setAskDraft] = useState(null);
  const [askOpen,setAskOpen] = useState(false);
  const [editGoal,setEditGoal] = useState(false);
  /* null when not reimporting; otherwise the OB_STEPS index to open straight
     to, so "Update resume" does not first make someone click through
     Privacy and History again to get there. */
  const [reimport,setReimport] = useState(null);
  const [busySave,setBusySave] = useState(false);
  const [aiMeta,setAiMeta] = useState(null);
  const [err,setErr] = useState(null);
  const pulled = useRef(false);

  useEffect(()=>{
    if(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase){
      try{ setSb(window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)); }
      catch(e){ setAuth({status:'unconfigured', user:null}); }
    } else setAuth({status:'unconfigured', user:null});
  },[]);

  useEffect(()=>{
    if(!sb) return;
    let sub;
    const onUser = (u)=>{
      setAuth({status:u?'in':'out', user:u});
      if(u){ if(!pulled.current){ pulled.current=true; pull(u); } }
      else { pulled.current=false; setBlob(null); setPeople([]); setEvents([]); setTasks([]); }
    };
    sb.auth.getSession().then(({data})=>onUser(data.session?.user||null));
    const r = sb.auth.onAuthStateChange((_e,s)=>onUser(s?.user||null));
    sub = r.data?.subscription;
    return ()=>{ sub && sub.unsubscribe(); };
  },[sb]);

  async function pull(u){
    try{
      const {data} = await sb.from('user_data').select('data').eq('user_id',u.id).maybeSingle();
      setBlob((data && data.data) ? data.data : {});
    }catch(e){ setBlob({}); setErr('Could not load your strategy. Working from a blank one.'); }
    await ingest(u);
    await Promise.all([refreshPeople(u), refreshEvents(u), refreshTasks(u), refreshPendingActivity(u)]);
  }

  /* Drain whatever the extension pushed into outreach_inbox. profile_context is
     discarded unless a matching row already exists - the privacy boundary:
     nothing is retained for a profile the user did not deliberately save. */
  async function ingest(u){
    try{
      const {data, error} = await sb.from('outreach_inbox').select('id,kind,payload')
        .eq('user_id',u.id).order('created_at',{ascending:true});
      if(error || !data || !data.length) return 0;
      const consumed = [];
      /* reply_detected and connection_accepted carry a resolved profileUrl only when the
         extension's own match was certain - an ambiguous one has no single profileUrl, only a
         list of candidates, and is exactly the case that should NOT be discarded here. Everything
         else keeps the old "no profileUrl, nothing to do" shortcut. */
      const ACTIVITY_KINDS = ['reply_detected','connection_accepted','profile_viewed'];
      for(const row of data){
        const p = row.payload||{};
        if(!p.profileUrl && ACTIVITY_KINDS.indexOf(row.kind)<0){ consumed.push(row.id); continue; }
        try{
          const nowIso = new Date().toISOString();
          if(row.kind==='sent_confirmation'){
            const {data:existing} = await sb.from('outreach_log').select('id,status')
              .eq('user_id',u.id).eq('profile_url',p.profileUrl).maybeSingle();
            if(existing){
              await sb.from('outreach_log').update({status:'contacted', contacted_at:nowIso, updated_at:nowIso}).eq('id',existing.id);
              await sb.from('outreach_events').insert({user_id:u.id, log_id:existing.id, event_type:'stage_change',
                note:null, extracted:{from:existing.status, to:'contacted'}});
            } else {
              await sb.from('outreach_log').upsert({user_id:u.id, profile_url:p.profileUrl, status:'contacted',
                contacted_at:nowIso, updated_at:nowIso}, {onConflict:'user_id,profile_url'});
            }
          } else if(row.kind==='profile_context'){
            const {data:existing} = await sb.from('outreach_log').select('id,context')
              .eq('user_id',u.id).eq('profile_url',p.profileUrl).maybeSingle();
            if(existing){
              // Merge, never replace - the row may already carry location, education
              // and the reason it was saved, and a blind overwrite would lose them.
              const prev = existing.context||{};
              /* The extension sends more than this used to keep. skillsText,
                 languagesText, certificationsText and timingSignals were all
                 parsed off the rendered profile and then dropped on the floor
                 here, so the work was being done and thrown away. Skills feed
                 the extension's own shared-ground scoring, and timingSignals is
                 the only source of "just moved into this role", which is the
                 single most useful thing to know before writing to someone. */
              const next = {...prev,
                aboutText:p.aboutText||prev.aboutText||'',
                experienceText:p.experienceText||prev.experienceText||'',
                educationText:p.educationText||prev.educationText||'',
                skillsText:p.skillsText||prev.skillsText||'',
                languagesText:p.languagesText||prev.languagesText||'',
                certificationsText:p.certificationsText||prev.certificationsText||'',
                mutualConnectionsRaw:p.mutualConnectionsRaw||prev.mutualConnectionsRaw||'',
                capturedAt:nowIso};
              if(p.location) next.location = p.location;
              if(Array.isArray(p.timingSignals) && p.timingSignals.length) next.timingSignals = p.timingSignals;
              await sb.from('outreach_log').update({context:next, updated_at:nowIso}).eq('id',existing.id);
            }
          } else if(row.kind==='reply_detected' || row.kind==='connection_accepted'){
            /* The extension already did the matching (it has the same outreach_log cached for
               its own sidebar scoring) - certain ships with matchedProfileUrl, ambiguous ships
               candidates and nothing else. A certain match here is exactly what markReplied()
               already does by hand; an ambiguous one is left in outreach_inbox on purpose - not
               pushed to consumed - so it survives as a pending prompt for resolveAmbiguousActivity
               to answer, instead of being silently guessed at or silently dropped. */
            if(p.confidence==='certain' && p.matchedProfileUrl){
              const {data:existing} = await sb.from('outreach_log').select('id,status,context')
                .eq('user_id',u.id).eq('profile_url',p.matchedProfileUrl).maybeSingle();
              if(existing){
                if(row.kind==='reply_detected'){
                  const cutoff = new Date(Date.now()-60*60*1000).toISOString();
                  const {data:recent} = await sb.from('outreach_events').select('id')
                    .eq('log_id',existing.id).eq('event_type','reply').gte('occurred_at',cutoff).limit(1);
                  if(!recent || !recent.length){
                    await sb.from('outreach_events').insert({user_id:u.id, log_id:existing.id, event_type:'reply',
                      note:null, extracted:{source:p.source||'detected', detected:true}});
                    if(existing.status!=='replied') await sb.from('outreach_log')
                      .update({status:'replied', updated_at:nowIso}).eq('id',existing.id);
                  }
                } else if(!(existing.context||{}).connectionAccepted){
                  await sb.from('outreach_log').update({
                    context:{...(existing.context||{}), connectionAccepted:{at:nowIso}}, updated_at:nowIso,
                  }).eq('id',existing.id);
                }
              }
            } else if(p.confidence==='ambiguous' && Array.isArray(p.candidates) && p.candidates.length){
              continue; // left in outreach_inbox - see comment above
            }
          } else if(row.kind==='profile_viewed'){
            /* Soft context, never an event, never a stage change - the spec draws this line
               deliberately: a profile view is ambient, not pipeline progress. */
            const {data:existing} = await sb.from('outreach_log').select('id,context')
              .eq('user_id',u.id).eq('profile_url',p.profileUrl).maybeSingle();
            if(existing){
              const prevCtx = existing.context||{};
              const label = 'Viewed your profile '+(p.viewedAt||'recently');
              const prevSignals = Array.isArray(prevCtx.timingSignals) ? prevCtx.timingSignals : [];
              if(prevSignals.indexOf(label)<0){
                await sb.from('outreach_log').update({
                  context:{...prevCtx, timingSignals:[label, ...prevSignals].slice(0,5)}, updated_at:nowIso,
                }).eq('id',existing.id);
              }
            }
          } else {
            const ctx = {source:'extension'};
            if(p.why) ctx.whySaved = p.why;
            if(p.location) ctx.location = p.location;
            await sb.from('outreach_log').upsert({user_id:u.id, profile_url:p.profileUrl,
              name:p.name||null, title:p.title||null, company:p.company||null,
              avatar_url:p.avatarUrl||null, context:ctx, updated_at:nowIso}, {onConflict:'user_id,profile_url'});
          }
          consumed.push(row.id);
        }catch(e){ /* likely the weekly-cap trigger - leave it, retried next ingest */ }
      }
      if(consumed.length) await sb.from('outreach_inbox').delete().in('id', consumed);
      return consumed.length;
    }catch(e){ return 0; }
  }
  async function refreshPeople(u){
    try{ const {data} = await sb.from('outreach_log').select('*').eq('user_id',u.id)
      .order('shortlisted_at',{ascending:false}); setPeople(data||[]); }catch(e){}
  }
  async function refreshEvents(u){
    try{ const {data} = await sb.from('outreach_events').select('*').eq('user_id',u.id)
      .order('occurred_at',{ascending:true}); setEvents(data||[]); }catch(e){}
  }
  async function refreshTasks(u){
    try{ const {data} = await sb.from('tasks').select('*').eq('user_id',u.id)
      .order('created_at',{ascending:false}); setTasks(data||[]); }catch(e){}
  }
  async function refreshPendingActivity(u){
    try{ const {data} = await sb.from('outreach_inbox').select('id,kind,payload,created_at')
      .eq('user_id',u.id).in('kind',['reply_detected','connection_accepted'])
      .order('created_at',{ascending:false}); setPendingActivity(data||[]); }catch(e){}
  }
  /* An ambiguous match ingest() left behind, answered. profileUrl null means "neither of
     these" - discarded, not re-asked next time the extension sees the same unread item. */
  async function resolveAmbiguousActivity(row, profileUrl){
    try{
      if(profileUrl){
        const person = people.find(x=>x.profile_url===profileUrl);
        if(person){
          if(row.kind==='reply_detected'){
            await logEvent(person, 'reply', null,
              {extracted:{source:(row.payload||{}).source||'detected', detected:true, resolvedAmbiguous:true}});
            if(person.status!=='replied') await updateRow(person, {status:'replied'});
          } else if(!(person.context||{}).connectionAccepted){
            await updateRow(person, {context:{...(person.context||{}), connectionAccepted:{at:new Date().toISOString()}}});
          }
        }
      }
      await sb.from('outreach_inbox').delete().eq('id', row.id);
      setPendingActivity(pa=>pa.filter(r=>r.id!==row.id));
    }catch(e){ setErr('Could not resolve that: '+(e.message||'unknown error')); }
  }

  const settings = (blob && blob.settings) || {};
  const hasIntent = !!settings.goalType;

  /* Merge-write so keys this app doesn't know (templates, sheets, voiceSamples)
     survive - app/v1.html owns those and both apps share the row. */
  async function saveSettings(patch){
    if(!sb || auth.status!=='in') return;
    setBusySave(true);
    const firstRun = !settings.goalType;
    const next = {...(blob||{}), settings:{...settings, ...patch}};
    setBlob(next);
    try{ await sb.from('user_data').upsert({user_id:auth.user.id, data:next, updated_at:new Date().toISOString()}); }
    catch(e){ setErr('Saved on this device, but syncing failed: '+(e.message||'unknown error')); }
    /* Counts only: which goal, how many targets named, whether this was the
       first time. Never the goal text itself, which is free prose. */
    track(firstRun?'strategy_first_saved':'strategy_updated', {
      goal_type: next.settings.goalType || 'none',
      roles: (next.settings.targetRoles||[]).length,
      companies: (next.settings.targetCompanies||[]).length,
      schools: (next.settings.schools||[]).length,
    });
    setBusySave(false);
  }

  async function savePerson(p, query){
    if(!sb || auth.status!=='in') return;
    const ctx = {source:'search', savedFrom:query||'', whySaved:p.why||'', common:p.common||[]};
    if(p.verdict) ctx.verdictLabel = (VERDICT[p.verdict]||VERDICT.potential).label;
    ['location','education','experience','followers','connections','snippet'].forEach(k=>{ if(p[k]) ctx[k]=p[k]; });
    try{
      const {data:row} = await sb.from('outreach_log').upsert({user_id:auth.user.id, profile_url:p.profileUrl,
        name:p.name||null, title:p.title||null, company:p.company||null, context:ctx,
        avatar_url:p.avatarUrl||null,
        updated_at:new Date().toISOString()}, {onConflict:'user_id,profile_url'}).select().single();
      track('person_saved', {source:'search', verdict:p.verdict||'none', facts:[p.location,p.education,p.followers].filter(Boolean).length});
      await refreshPeople(auth.user);
      /* Explore's own photo fill-in (see run() and the mine effect above)
         usually already has a photo in hand by the time someone clicks Add,
         and that one is saved straight into the row above. This is only the
         fallback for whoever clicks fast enough to beat it, or whose photo
         fetch failed the first time - one more try, same throttled call the
         Profile page's manual button uses, capped the same way. Best-effort:
         no photo is not an error. */
      if(row && !row.avatar_url){
        extBridge.photo(p.profileUrl).then(r=>{
          if(r && r.ok && r.dataUrl) updateRow(row, {avatar_url:r.dataUrl});
        }).catch(()=>{});
      }
      return row;
    }catch(e){ setErr('Could not save that person: '+(e.message||'unknown error')); }
  }

  async function updateRow(row, fields){
    try{
      await sb.from('outreach_log').update({...fields, updated_at:new Date().toISOString()}).eq('id',row.id);
      await refreshPeople(auth.user);
    }catch(e){ setErr('Could not save that change: '+(e.message||'unknown error')); }
  }
  /* outreach_events cascades on delete (schema: log_id ... on delete cascade),
     so a person's timeline goes with them in the same statement - nothing left
     pointing at a row that no longer exists. tasks.log_id is on delete set
     null instead, so an open commitment tied to them survives, unlinked. */
  async function deletePeople(ids){
    if(!ids || !ids.length) return;
    try{
      await sb.from('outreach_log').delete().in('id', ids);
      await refreshPeople(auth.user);
      await refreshEvents(auth.user);
    }catch(e){ setErr('Could not delete: '+(e.message||'unknown error')); }
  }
  async function logEvent(row, type, note, extra){
    try{
      await sb.from('outreach_events').insert({user_id:auth.user.id, log_id:row.id, event_type:type,
        note:note||null, ...(extra||{})});
      await refreshEvents(auth.user);
    }catch(e){ setErr('Could not write to the timeline: '+(e.message||'unknown error')); }
  }
  async function changeStage(row, to){
    if(!row || !to || row.status===to) return;
    const fields = {status:to};
    if(to==='contacted' && !row.contacted_at) fields.contacted_at = new Date().toISOString();
    await updateRow(row, fields);
    await logEvent(row, 'stage_change', null, {extracted:{from:row.status, to}});
    track('stage_changed', {to, from:row.status});
  }
  async function addTask(t){
    try{
      await sb.from('tasks').insert({user_id:auth.user.id, ...t});
      await refreshTasks(auth.user);
    }catch(e){}
  }
  async function toggleTask(t, done){
    try{
      await sb.from('tasks').update({done, completed_at: done?new Date().toISOString():null}).eq('id',t.id);
      await refreshTasks(auth.user);
    }catch(e){}
  }

  /* The extension deep-links here as /app/?open=<log id>. Honour it once the
     people are loaded, then clear the query so a refresh doesn't re-trigger. */
  const deepLinked = useRef(false);
  useEffect(()=>{
    if(deepLinked.current || !people.length) return;
    const want = new URLSearchParams(window.location.search).get('open');
    if(!want) { deepLinked.current = true; return; }
    const hit = people.find(r=>String(r.id)===String(want));
    deepLinked.current = true;
    if(hit){
      setPersonId(hit.id); setTab('overview'); setScreen('profile');
      window.history.replaceState({}, '', window.location.pathname);
    }
  },[people]);

  /* Bind instrumentation once, and note whether the extension answered. That
     one flag is how we learn in production whether the search bridge works,
     which is otherwise only testable by hand in a real browser. */
  useEffect(()=>{
    if(auth.status!=='in' || !sb || !auth.user) return;
    bindTracking(sb, auth.user);
    onAiMeta(setAiMeta);
    const t = setTimeout(()=>track('session_start', {extension: extBridge.isReady()}), 1500);
    return ()=>clearTimeout(t);
  },[auth.status, sb, auth.user]);

  /* Coming back from LinkedIn is the moment new extension saves should appear. */
  useEffect(()=>{
    if(auth.status!=='in' || !sb) return;
    const onFocus = ()=>{ pull(auth.user); };
    window.addEventListener('focus', onFocus);
    return ()=>window.removeEventListener('focus', onFocus);
  },[auth.status, sb]);

  const person = useMemo(()=>people.find(r=>r.id===personId)||null, [people, personId]);
  const doneToday = useMemo(()=>tasks.filter(t=>t.done && t.completed_at && days(t.completed_at)<=0), [tasks]);

  function go(target){
    if(!target) return;
    if(target.screen==='ask'){
      /* Ask Mighty is a slide-out panel, not a full-screen destination -
         opening it (from the sidebar, or from a "Reply to X" style suggestion
         chip elsewhere) should not replace whatever the user was looking at
         underneath. */
      setAskOpen(true);
      if(target.ask) setAskDraft(target.ask);
      return;
    }
    if(target.screen==='profile' && target.id!=null){ setPersonId(target.id); setTab(target.tab||'overview'); }
    if(target.screen==='you'){
      const t = target.tab||'mirror';
      /* Re-clicking "Goal" in the sidebar while mid-edit used to silently
         discard whatever was typed and not yet saved. Only reset edit mode
         when actually leaving the goal tab, not when landing on it again. */
      if(!(t==='goal' && youTab==='goal' && editGoal)) setEditGoal(false);
      setYouTab(t);
    }
    if(target.screen==='relationships' && target.view){ setRelView(target.view); }
    if(target.screen!=='profile') setPersonId(null);
    setScreen(target.screen);
    window.scrollTo({top:0});
  }
  const openPerson = (id, t)=>go({screen:'profile', id, tab:t||'overview'});

  if(auth.status==='loading')
    return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><span className="spin"/></div>;
  if(auth.status==='unconfigured')
    return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div className="card" style={{padding:'30px 32px',maxWidth:420}}>
        <div className="h3">Mighty is not set up yet.</div>
        <div className="sub" style={{marginTop:6}}>The Supabase project details are missing from this build.</div>
      </div></div>;
  if(auth.status!=='in') return <Gate sb={sb}/>;
  if(blob===null)
    return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><span className="spin"/></div>;

  /* Nothing can be personal before Mighty knows the person. Onboarding builds the
     Knowledge Base first: read the archive and the resume, show back what was
     understood, then ask only what no file could answer. StrategyForm remains the
     edit surface for everything after the first run. */
  /* "Import my history" / "Correct this" on the Mirror tab used to open the
     Goal-edit form, which has no field anywhere related to the archive or
     resume Mirror is showing - two buttons explicitly promising re-import
     or correction that neither could do. Onboarding already pre-fills from
     existing settings, so re-entering it here is the real fix rather than
     building a second upload UI. */
  if(!hasIntent || reimport!=null)
    return <Onboarding sb={sb} user={auth.user} settings={settings}
      startStep={hasIntent ? reimport : 0}
      onSave={saveSettings} onDone={()=>{ setReimport(null); go({screen:'you', tab:'mirror'}); }}/>;

  const signOut = async()=>{
    try{ await sb.auth.signOut(); }
    catch(e){ /* local session is what matters for leaving the app - a failed
      server-side signOut call should not strand the user on a click that
      visibly did nothing. */ }
    window.location.href='../';
  };

  return (
    <F>
    <Shell screen={screen} relView={relView} youTab={youTab} boardOK={canSee('board',people,events)}
      timelineOK={canSee('timeline',people,events)} go={go} savedCount={people.length}
      email={auth.user.email} onSignOut={signOut} aiMeta={aiMeta}
      askOpen={askOpen} onToggleAsk={()=>setAskOpen(o=>!o)}>
      {err &&
        <div className="banner warn" style={{margin:'20px 48px 0',display:'flex',gap:14,alignItems:'flex-start',justifyContent:'space-between'}}>
          <span>{err}</span>
          <button onClick={()=>setErr(null)} aria-label="Dismiss"
            style={{flex:'none',background:'none',border:'none',cursor:'pointer',fontSize:16,lineHeight:1,color:'inherit',padding:0}}>&times;</button>
        </div>}

      {/* Guard, not just a hidden tab: a reload can restore screen='today' from
          before the last person was deleted, and a screen with no nav entry is
          a dead end. */}
      {screen==='today' && people.length===0 &&
        <Relationships sb={sb} settings={settings} people={people} events={events} view={relView} setView={setRelView}
          plan={aiMeta&&aiMeta.plan} onSave={savePerson} onOpen={openPerson} onStage={changeStage} onDelete={deletePeople} go={go}/>}
      {screen==='today' && people.length>0 &&
        <Today people={people} events={events} tasks={tasks} settings={settings} email={auth.user.email}
          go={go} onToggleTask={toggleTask} doneToday={doneToday} onSaveSettings={saveSettings} plan={aiMeta&&aiMeta.plan}
          pendingActivity={pendingActivity} onResolveActivity={resolveAmbiguousActivity}/>}

      {screen==='relationships' &&
        <Relationships sb={sb} settings={settings} people={people} events={events} view={relView} setView={setRelView}
          plan={aiMeta&&aiMeta.plan} onSave={savePerson} onOpen={openPerson} onStage={changeStage} onDelete={deletePeople} go={go}/>}

      {screen==='profile' && person &&
        <Profile sb={sb} row={person} events={events} tasks={tasks} settings={settings} people={people}
          onBack={()=>go({screen:'relationships'})} onUpdate={updateRow} onStage={changeStage}
          onEvent={logEvent} onTask={addTask} tab={tab} setTab={setTab} go={go}/>}
      {screen==='profile' && !person &&
        <Relationships sb={sb} settings={settings} people={people} events={events} view={relView} setView={setRelView}
          plan={aiMeta&&aiMeta.plan} onSave={savePerson} onOpen={openPerson} onStage={changeStage} onDelete={deletePeople} go={go}/>}

      {screen==='you' &&
        <You sb={sb} email={auth.user.email} settings={settings} people={people} events={events} tasks={tasks}
          tab={youTab} setTab={setYouTab} editGoal={editGoal} setEditGoal={setEditGoal} busySave={busySave}
          onSaveSettings={saveSettings} onSignOut={signOut} onReimport={(step)=>setReimport(step==null?1:step)}
          onSave={savePerson} onOpen={openPerson} go={go} aiMeta={aiMeta}/>}

      {screen==='extension' && <Extension/>}
    </Shell>

    {/* A slide-out panel, not a full-screen destination - asking a question
        used to mean losing whatever you were looking at underneath it, which
        fights the whole point of "ask a quick thing without leaving what
        you're doing." Always mounted so its conversation history survives
        closing and reopening; only its visibility and the backdrop change. */}
    {askOpen &&
      <div onClick={()=>setAskOpen(false)}
        style={{position:'fixed',inset:0,background:'rgba(29,27,38,.28)',zIndex:299}}/>}
    <div style={{position:'fixed',top:0,right:0,height:'100vh',width:'min(460px,100vw)',
      background:'var(--paper)',boxShadow:'-16px 0 40px rgba(29,27,38,.16)',zIndex:300,
      transform:askOpen?'translateX(0)':'translateX(100%)',transition:'transform .28s cubic-bezier(.2,.8,.3,1)',
      display:'flex',flexDirection:'column'}}>
      <div className="row" style={{gap:12,padding:'18px 20px',borderBottom:'1px solid var(--line3)',flex:'none'}}>
        <span style={{fontWeight:700,fontSize:15}}>Ask Mighty</span>
        <div style={{flex:1}}/>
        <button onClick={()=>setAskOpen(false)} aria-label="Close"
          style={{background:'none',border:'none',cursor:'pointer',fontSize:20,lineHeight:1,color:'var(--sub)',padding:4}}>&times;</button>
      </div>
      <div style={{flex:1,overflowY:'auto'}}>
        <Ask sb={sb} people={people} events={events} tasks={tasks} settings={settings} onOpen={(id)=>{ setAskOpen(false); openPerson(id); }}
          onSave={savePerson} initialQuestion={askDraft} onConsumed={()=>setAskDraft(null)}/>
      </div>
    </div>
    </F>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
