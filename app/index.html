<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mighty · Networking copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F7; --bg2:#F4F2EF; --card:#FFFFFF; --card2:#FCFBFA; --line:rgba(27,26,31,.09); --line2:rgba(27,26,31,.055); --inp:#FCFBFA; --chip:#F4F3F1;
  --ink:#1B1A1F; --sub:#4A4751; --sub2:#615E6B; --mute:#7B7787; --mute2:#A29EAC;
  --brand:#5B4BC4; --brand2:#4C3EB0; --bsoft:#EDEAFE;
  --peach:#F2A69B; --psoft:#FDEDEB;
  --green:#4B7A5E; --green2:#3E6B52; --gsoft:#E9F1EC;
  --terra:#B5675A; --terra2:#96504A; --tsoft:#FDEDEB;
  --amber:#8C7A50; --asoft:#FBF3E2;
  --fh:'Figtree',system-ui,-apple-system,sans-serif; --fb:'Instrument Sans',system-ui,-apple-system,sans-serif; --fm:ui-monospace,'SF Mono',Menlo,monospace;
  --shadow:0 1px 2px rgba(27,26,31,.04); --shadowL:0 30px 70px -34px rgba(27,26,31,.24);
  --radius:20px; --rsm:13px; --rpill:999px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--fb);color:var(--ink);-webkit-font-smoothing:antialiased;background:var(--bg);}
::selection{background:var(--bsoft);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#DED9E4;border-radius:99px;}
h1,h2,h3{font-family:var(--fh);font-weight:600;letter-spacing:-.03em;margin:0;}
.mono{font-family:var(--fm);}
button{font-family:var(--fb);cursor:pointer;}
input,textarea,select{font-family:var(--fb);color:var(--ink);}
textarea{resize:vertical;}
a{color:var(--brand);text-decoration:none;} a:hover{color:var(--brand2);}

.app{display:flex;height:100vh;overflow:hidden;}
.rail{width:252px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--card);padding:22px 16px 18px;}
.rail-brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;}
.rail-logo{width:24px;height:24px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;}
.rail-name{font-family:var(--fh);font-weight:600;font-size:18px;letter-spacing:-.03em;}
.rail-nav{display:flex;flex-direction:column;gap:3px;}
.rail-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--rsm);cursor:pointer;color:var(--sub);font-weight:400;font-size:15px;}
.rail-item:hover{background:color-mix(in srgb, var(--ink) 4%, transparent);}
.rail-item.on{background:var(--bsoft);color:var(--brand2);font-weight:500;}
.rail-sp{flex:1;}
.rail-acct{display:flex;align-items:center;gap:11px;padding:14px 10px 4px;margin-top:8px;border-top:1px solid var(--line);}
.rail-avatar{width:32px;height:32px;border-radius:99px;background:var(--bsoft);color:var(--brand2);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 34px;border-bottom:1px solid var(--line2);background:rgba(250,249,247,.82);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);}
.topbar h2{font-family:var(--fh);font-weight:600;font-size:21px;letter-spacing:-.03em;}
.content{flex:1;overflow-y:auto;position:relative;}
.page{max-width:1180px;margin:0 auto;padding:32px 34px 60px;}
.page.wide{max-width:1280px;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);}
.pad{padding:24px 26px;}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.ph h2{font-size:20px;} .ph .sub{font-size:13.5px;color:var(--sub2);margin-top:3px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}

label.fld{display:block;font-size:12.5px;font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--mute);margin:0 0 7px;}
.inp,textarea.inp,select.inp{width:100%;padding:12px 15px;border-radius:var(--rsm);border:1px solid rgba(27,26,31,.12);background:var(--inp);font-size:15px;outline:none;}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:12px 22px;border-radius:var(--rpill);border:none;background:var(--brand);color:#fff;font-weight:500;font-size:15px;}
.btn:hover{background:var(--brand2);color:#fff;} .btn:disabled{opacity:.5;cursor:not-allowed;background:var(--brand);}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid rgba(27,26,31,.1);}
.btn.ghost:hover{background:var(--card);border-color:var(--brand);}
.btn.dark{background:var(--ink);color:#fff;} .btn.dark:hover{background:#000;color:#fff;}
.btn.sm{padding:9px 16px;font-size:14px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--rpill);background:var(--chip);font-size:12.5px;font-weight:500;color:var(--sub);}
.pill{font-size:12.5px;font-weight:500;padding:5px 12px;border-radius:var(--rpill);white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:99px;flex:none;display:inline-block;}
.tag{font-family:var(--fb);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--brand2);}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 24px;}
.kpi .k{font-size:15px;color:var(--ink);font-weight:500;margin-bottom:5px;}
.kpi .v{font-family:var(--fh);font-weight:600;font-size:36px;line-height:1;letter-spacing:-.04em;}
.kpi .v small{font-size:14px;color:var(--mute);font-weight:500;font-family:var(--fb);}
.kpi .d{font-size:13.5px;color:var(--mute);margin-top:6px;}

.empty{text-align:center;padding:44px 18px;color:var(--mute);}
.empty .big{font-size:28px;margin-bottom:8px;}

.typing{display:inline-flex;gap:4px;align-items:center;}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:bl 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
@keyframes bl{0%,60%,100%{opacity:.25;}30%{opacity:1;}}

.scorebar{height:10px;border-radius:var(--rpill);background:#F1EFEC;overflow:hidden;}
.scorebar i{display:block;height:100%;border-radius:var(--rpill);background:var(--brand);}

.list{display:flex;flex-direction:column;gap:10px;}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card2);}
.row .grow{flex:1;min-width:0;}
.row .t{font-weight:500;font-size:14.5px;}
.row .m{font-size:13px;color:var(--sub2);margin-top:2px;}
.iconbtn{border:1px solid rgba(27,26,31,.1);background:var(--card);border-radius:var(--rpill);padding:7px 13px;font-size:13px;color:var(--sub);}
.iconbtn:hover{background:var(--card);border-color:var(--brand);color:var(--ink);}
.iconbtn:disabled{opacity:.4;cursor:not-allowed;}
.divider{height:1px;background:var(--line);margin:18px 0;}
.note{font-size:13.5px;color:var(--sub2);line-height:1.55;}
.warnbox{background:var(--tsoft);border:1px solid rgba(27,26,31,.06);border-radius:14px;padding:13px 15px;font-size:13.5px;color:var(--terra2);line-height:1.55;}
.okbox{background:var(--gsoft);border:1px solid rgba(27,26,31,.05);border-radius:14px;padding:13px 15px;font-size:13.5px;color:var(--green2);line-height:1.55;}
.bluebox{background:var(--bsoft);border:1px solid rgba(27,26,31,.04);border-radius:14px;padding:13px 15px;font-size:13.5px;color:var(--brand2);line-height:1.55;}
.foot{text-align:center;font-size:12px;color:var(--mute2);margin:22px 0 4px;line-height:1.6;}
.seg{display:inline-flex;background:#F1EFEC;border-radius:var(--rpill);padding:4px;gap:2px;flex-wrap:wrap;}
.seg button{border:none;background:transparent;padding:8px 16px;border-radius:var(--rpill);font-weight:500;font-size:13.5px;color:var(--sub);}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(27,26,31,.12);}

.avatar{border-radius:99px;display:grid;place-items:center;font-weight:600;flex:none;}
.linkurl{font-size:13px;color:var(--brand);word-break:break-all;text-decoration:none;}

/* People table */
.ptable{width:100%;border-collapse:collapse;font-size:14px;}
.ptable th{text-align:left;font-size:11.5px;font-weight:500;color:var(--mute2);text-transform:uppercase;letter-spacing:.1em;padding:16px 14px;border-bottom:1px solid var(--line2);background:var(--bg);}
.ptable td{padding:16px 14px;border-top:1px solid var(--line2);vertical-align:middle;}
.ptable tr.body-row{cursor:pointer;}
.ptable tr.body-row:hover td{background:var(--card2);}

/* Pipeline */
.pipeline-wrap{flex:1;display:flex;align-items:flex-start;gap:16px;overflow-x:auto;padding-bottom:8px;min-height:0;}
.pcol{width:246px;flex:none;background:var(--bg2);border-radius:var(--radius);padding:16px 14px;display:flex;flex-direction:column;gap:12px;min-height:150px;max-height:calc(100vh - 190px);}
.pcol-head{display:flex;align-items:center;gap:8px;padding:0 4px;}
.pcol-cards{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:40px;}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:grab;box-shadow:0 4px 12px -10px rgba(27,26,31,.3);}
.pcard:hover{border-color:var(--brand);}
.pcard.drag-over{outline:2px dashed var(--brand);}
.pdrop{border:1.5px dashed rgba(27,26,31,.15);border-radius:16px;padding:20px 12px;text-align:center;color:var(--mute2);font-size:13px;}

/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(27,26,31,.3);z-index:40;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:94vw;background:var(--card);z-index:41;box-shadow:var(--shadowL);border-radius:24px 0 0 24px;display:flex;flex-direction:column;overflow:hidden;}
.drawer-tabs{display:flex;border-bottom:1px solid var(--line);margin-top:16px;}
.drawer-tab{padding:11px 2px;margin-right:24px;font-weight:500;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mute);}
.drawer-tab.on{color:var(--ink);border-color:var(--brand);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(27,26,31,.4);z-index:50;display:grid;place-items:center;padding:24px;}
.modal{width:640px;max-width:100%;background:var(--card);border-radius:24px;box-shadow:var(--shadowL);display:flex;flex-direction:column;overflow:hidden;}

/* Extension preview */
.browser-frame{border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 70px -40px rgba(27,26,31,.3);background:#F1EFEC;}
.browser-bar{height:44px;display:flex;align-items:center;gap:8px;padding:0 18px;background:#F1EFEC;border-bottom:1px solid var(--line);}
.browser-dot{width:10px;height:10px;border-radius:50%;}
.browser-url{flex:1;max-width:340px;height:28px;border-radius:var(--rpill);background:#fff;margin-left:10px;display:flex;align-items:center;padding:0 14px;color:var(--mute);font-size:13px;}
.browser-body{background:var(--card2);min-height:420px;}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script>
  // Classic JSX runtime (React.createElement) — the automatic runtime emits an ES import that fails without a bundler.
  Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] });
</script>
<script type="text/babel" data-presets="react-classic">
const {useState,useEffect,useRef,useMemo} = React;

/* ============================ deployer config ============================
   Filled in ONCE by whoever deploys Mighty (see SETUP.md) — students never
   see or touch this. Anon keys are safe to ship in client code; row-level
   security is what actually protects the data. */
const SUPABASE_URL = 'https://hplyyywdftnvjajyncvj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_e_oCwuz3Qlko5N3Xl8ZwxA_zQijz_u8';

/* ============================ persistence ============================ */
const DB_KEY = 'mighty_v2'; // synced app data — templates + settings only
const DEFAULT = {
  templates: [
    { id:'starter', name:'Intro — Sloan Fellow', body:"Hi {{firstName}}, I'm an MIT Sloan Fellow exploring {{company}} and would love to hear about your path there. Would you be open to a quick chat?" },
  ],
  settings: {
    sheets: { sheetId:'', tabName:'MIghTy Outreach', lastSyncedAt:null, lastError:null },
    // ---- AI Context Profile — what MIghTy needs to give great advice ----
    goal: '',               // ⭐ what you want to accomplish in the next 6-12 months (the lens for everything)
    networkingReasons: [],  // why you're networking (job, funding, mentors, …)
    targetCompanies: [],
    targetRoles: [],
    homeLocation: '',       // your city — resolves "near me" in Find-people
    targetLocations: [],    // places you're interested in
    schools: [],
    industries: [],
    skills: [],             // extracted from resume; strong match-score terms
    interests: [],          // personal — fuels authentic conversation starters
    networkingStyle: [],    // cold outreach / warm intros / coffee chats / events / email / linkedin
    communicationStyle: '', // how your messages should sound (e.g. warm, concise)
    hardestPart: '',        // the networking problem Mighty should solve for you
    currentRole: '', currentCompany: '', yearsExperience: '', linkedinUrl: '',
    followUpDays: 7,
    communityOptIn: false,
    pipeline: 'job_search', // which stage vocabulary the funnel uses
    stageLabels: {},        // optional per-stage label overrides
    onboardedAt: null,      // set once the first-run setup is finished/skipped
  },
};
function shape(d){
  d = d||{};
  const sd = (d.settings||{});
  const arr = (v,def)=>Array.isArray(v)?v:def;
  return { ...JSON.parse(JSON.stringify(DEFAULT)), ...d,
    templates: Array.isArray(d.templates) ? d.templates : DEFAULT.templates,
    settings: { ...DEFAULT.settings, ...sd,
      sheets:{ ...DEFAULT.settings.sheets, ...(sd.sheets||{}) },
      targetCompanies: arr(sd.targetCompanies, DEFAULT.settings.targetCompanies),
      targetRoles: arr(sd.targetRoles, DEFAULT.settings.targetRoles),
      networkingReasons: arr(sd.networkingReasons, []),
      targetLocations: arr(sd.targetLocations, []),
      schools: arr(sd.schools, []),
      industries: arr(sd.industries, []),
      skills: arr(sd.skills, []),
      interests: arr(sd.interests, []),
      networkingStyle: arr(sd.networkingStyle, []),
      stageLabels: (sd.stageLabels && typeof sd.stageLabels==='object') ? sd.stageLabels : {} } };
}
function loadDB(){ try{ return shape(JSON.parse(localStorage.getItem(DB_KEY))); }catch(e){ return shape(); } }

const uid = () => Math.random().toString(36).slice(2,10);
const now = () => Date.now();
const fmtDate = ts => new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const rel = ts => { if(!ts) return 'never'; const s=(now()-ts)/1000;
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; };
const MIT_RE = /@([a-z0-9-]+\.)*mit\.edu$/i;

// LinkedIn vanity slugs are usually firstname-lastname-<id>, so when the
// extension couldn't scrape a name we can still show something readable
// instead of the raw URL — never shown once a real name is set.
function nameFromUrl(url){
  const m = (url||'').match(/linkedin\.com\/in\/([^/?#]+)/i);
  if(!m) return '';
  const words = m[1].split('-').filter(w => w && !/\d/.test(w));
  if(!words.length) return '';
  return words.map(w => w[0].toUpperCase()+w.slice(1)).join(' ');
}
function displayName(row){
  return (row.name||'').trim() || nameFromUrl(row.profile_url) || 'Unnamed contact';
}

function weekStartUTC(ts = now()){
  const d = new Date(ts);
  const day = d.getUTCDay();
  const diff = day===0 ? -6 : 1-day;
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()+diff);
}
function contactedThisWeek(log){
  const ws = weekStartUTC();
  return (log||[]).filter(r=>r.contacted_at && new Date(r.contacted_at).getTime()>=ws).length;
}
function addOffset(ts, amount, unit){
  const ms = unit==='weeks' ? 7*864e5 : unit==='months' ? 30*864e5 : 864e5;
  return new Date(ts + (amount||0)*ms).toISOString();
}
function bucketCount(n){
  n = n||0;
  if(n<=0) return '0'; if(n<=2) return '1-2'; if(n<=5) return '3-5'; if(n<=10) return '6-10'; return '10+';
}
function renderTemplate(body, row){
  const firstName = (row.name||'').trim().split(/\s+/)[0] || 'there';
  return (body||'').replaceAll('{{firstName}}', firstName).replaceAll('{{company}}', row.company||'your company');
}

/* ============================ pipeline model ============================ */
const PIPELINE_STAGES = ['prospect','ready_to_contact','contacted','replied','coffee_chat','referral','interview','offer'];
const STAGE_META = {
  prospect:{label:'Prospects', bg:'#F4F3F1', fg:'#7B7787', dot:'#BAB6BC'},
  ready_to_contact:{label:'Ready to Contact', bg:'#F0EEF9', fg:'#6B5FB0', dot:'#B8AEE6'},
  contacted:{label:'Contacted', bg:'#EDEAFE', fg:'#4C3EB0', dot:'#5B4BC4'},
  replied:{label:'Replied', bg:'#FDEDEB', fg:'#96504A', dot:'#F2A69B'},
  coffee_chat:{label:'Coffee Chat', bg:'#E9F1EC', fg:'#3E6B52', dot:'#4B7A5E'},
  referral:{label:'Referral', bg:'#E6EAF2', fg:'#4A5B7A', dot:'#6E82AC'},
  interview:{label:'Interview', bg:'#EDEAFE', fg:'#4C3EB0', dot:'#5B4BC4'},
  offer:{label:'Offer', bg:'#5B4BC4', fg:'#FFFFFF', dot:'#EDEAFE'},
  do_not_contact:{label:'Do Not Contact', bg:'#F4F3F1', fg:'#A29EAC', dot:'#D7D3D3'},
};
/* ---- Pipeline templates ----------------------------------------------------
   A relationship funnel is the same eight ordered steps whichever game you're
   playing — only the vocabulary changes. So a template RELABELS the existing
   stages instead of forking the schema: no migration, no risk to saved data,
   and switching templates can never strand a contact in a stage that stopped
   existing. Any single label can also be overridden. */
const PIPELINE_TEMPLATES = {
  job_search:  { label:'Job search',  hint:'Prospect → Coffee chat → Interview → Offer',
    stages:{prospect:'Prospects', ready_to_contact:'Ready to Contact', contacted:'Contacted', replied:'Replied', coffee_chat:'Coffee Chat', referral:'Referral', interview:'Interview', offer:'Offer'} },
  sales:       { label:'Sales',       hint:'Lead → Discovery → Proposal → Customer',
    stages:{prospect:'Leads', ready_to_contact:'Qualified', contacted:'Contacted', replied:'Engaged', coffee_chat:'Discovery', referral:'Proposal', interview:'Negotiation', offer:'Customer'} },
  fundraising: { label:'Fundraising', hint:'Research → Warm intro → Partner meeting → Investment',
    stages:{prospect:'Research', ready_to_contact:'Ready to Reach', contacted:'Warm Intro', replied:'Responded', coffee_chat:'Meeting', referral:'Partner Meeting', interview:'Diligence', offer:'Investment'} },
  networking:  { label:'Networking',  hint:'Saved → Conversation → Relationship → Advocate',
    stages:{prospect:'Saved', ready_to_contact:'Ready to Reach', contacted:'Contacted', replied:'Conversation', coffee_chat:'Coffee Chat', referral:'Relationship', interview:'Champion', offer:'Advocate'} },
};
// Mirrored from settings by App so any component can label a stage without
// threading settings through props.
let ACTIVE_PIPELINE = 'job_search';
let STAGE_OVERRIDES = {};
function setActivePipeline(p, overrides){ ACTIVE_PIPELINE = PIPELINE_TEMPLATES[p] ? p : 'job_search'; STAGE_OVERRIDES = overrides || {}; }
function stageLabel(status){
  if(STAGE_OVERRIDES && STAGE_OVERRIDES[status]) return STAGE_OVERRIDES[status];
  if(status==='do_not_contact') return 'Do Not Contact';
  const t = PIPELINE_TEMPLATES[ACTIVE_PIPELINE];
  return (t && t.stages[status]) || (STAGE_META[status]||{}).label || status;
}
const PRIORITY_META = { high:{label:'High', dot:'#5B4BC4'}, medium:{label:'Medium', dot:'#8C8898'}, low:{label:'Low', dot:'#BAB6BC'} };
const AVATAR_PALETTE = [['#EDEAFE','#4C3EB0'],['#FDEDEB','#B5675A'],['#E9F1EC','#4B7A5E'],['#E6EAF2','#4A5B7A'],['#F0EEF9','#6B5FB0'],['#FBF3E2','#8C7A50']];
function avatarFor(row){
  const [bg,fg] = AVATAR_PALETTE[(row.id||0)%6];
  const init = displayName(row).trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return {bg,fg,init};
}
// Brand mark — two overlapping circles (lilac + peach). Scales to any size.
function Logo({size=24}){
  return <svg width={size} height={size} viewBox="0 0 26 26" fill="none" aria-hidden="true" style={{display:'block',flex:'none'}}>

// Transparent, client-side relevance scoring for ranking who to contact next —
// every term is explainable, nothing is a fabricated probability.
// Meaningful keywords from the user's free-text goal — drops stopwords/short
// words so "break into climate VC in Europe" → ["climate","europe"] (VC too
// short is kept via the whitelist). Used to score goal-relevance transparently.
const GOAL_STOPWORDS = new Set(['the','a','an','to','in','into','at','for','of','and','or','with','on','my','me','get','got','want','looking','look','find','people','person','someone','who','that','this','break','move','role','job','work','working','company','companies','around','near','new']);
function goalKeywords(goal){
  return [...new Set((goal||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/)
    .filter(w=>w && !GOAL_STOPWORDS.has(w) && (w.length>=3 || ['vc','ai','pm','ux','hr'].includes(w))))].slice(0,8);
}
// The terms the match score looks for in a person — drawn from the whole context
// profile (goal + roles + industries + schools), not just the goal sentence.
function profileKeywords(settings){
  const s = settings||{};
  const extra = [...(s.targetRoles||[]), ...(s.industries||[]), ...(s.schools||[]), ...(s.skills||[])]
    .join(' ').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/)
    .filter(w=>w && !GOAL_STOPWORDS.has(w) && (w.length>=3 || ['vc','ai','pm','ux','hr'].includes(w)));
  return [...new Set([...goalKeywords(s.goal), ...extra])].slice(0,14);
}
// Compact profile summary injected into AI prompts so drafts + advice reflect
// who the student is and what they're going for.
function profileContext(settings){
  const s = settings||{}; const bits = [];
  if(s.goal) bits.push(`The student's goal (next 6-12 months): ${s.goal}`);
  if((s.networkingReasons||[]).length) bits.push(`They're networking to: ${s.networkingReasons.join(', ')}`);
  if((s.targetCompanies||[]).length) bits.push(`Target companies: ${s.targetCompanies.join(', ')}`);
  if((s.targetRoles||[]).length) bits.push(`Target roles: ${s.targetRoles.join(', ')}`);
  if(s.communicationStyle) bits.push(`Their messages should sound: ${s.communicationStyle}`);
  if((s.networkingStyle||[]).length) bits.push(`Preferred networking style: ${s.networkingStyle.join(', ')}`);
  return bits.length ? 'About the student:\n'+bits.join('\n') : '';
}
function computeScore(row, targetCompanies, terms){
  const reasons = []; let score = 0;
  const ctx = row.context || {};
  if(row.company && (targetCompanies||[]).some(c=>c.trim().toLowerCase()===row.company.trim().toLowerCase())){
    score += 40; reasons.push(`Target company: ${row.company}`);
  }
  // Goal relevance — does this person's title/company/profile match what you're
  // trying to achieve? Transparent keyword match, never a black-box AI number.
  const kws = Array.isArray(terms) ? terms : goalKeywords(terms);
  if(kws.length){
    const hay = `${row.title||''} ${row.company||''} ${ctx.aboutText||''} ${ctx.experienceText||''} ${ctx.educationText||''}`.toLowerCase();
    const hits = kws.filter(k=>hay.includes(k));
    if(hits.length){ score += Math.min(30, 12*hits.length); reasons.push(`Fits your goal: ${hits.slice(0,3).join(', ')}`); }
  }
  const mutualMatch = (ctx.mutualConnectionsRaw||'').match(/(\d+)\s*mutual/i);
  if(mutualMatch){
    const n = Math.min(parseInt(mutualMatch[1],10)||0, 3);
    if(n>0){ score += 15*(n/3); reasons.push(`${mutualMatch[1]} mutual connection${mutualMatch[1]==='1'?'':'s'}`); }
  }
  if(/sloan|\bmit\b/i.test(`${ctx.educationText||''} ${ctx.aboutText||''}`)){ score += 15; reasons.push('MIT / Sloan connection'); }
  if(row.priority==='high'){ score += 10; reasons.push('High priority'); }
  const daysAgo = Math.max(0, (now()-new Date(row.shortlisted_at).getTime())/864e5);
  const recency = Math.max(0, 1-daysAgo/30);
  score += 10*recency;
  if(daysAgo<3) reasons.push(`Added ${daysAgo<1?'today':Math.round(daysAgo)+'d ago'}`);
  if(row.context){ score += 10; reasons.push('Profile context captured'); }
  return { score: Math.round(score), reasons: reasons.slice(0,4) };
}

// Honest relationship strength — recency decay + interaction count + reciprocity.
function computeStrength(row, rowEvents){
  const ts = [row.contacted_at, row.shortlisted_at, ...rowEvents.map(e=>e.occurred_at)].filter(Boolean).map(t=>new Date(t).getTime());
  const lastContact = ts.length ? Math.max(...ts) : null;
  const daysSince = lastContact!=null ? Math.max(0,(now()-lastContact)/864e5) : null;
  const recency = lastContact!=null ? Math.pow(0.5, daysSince/45) : 0;
  const interactionScore = Math.min(rowEvents.length,6)/6;
  const reciprocated = row.status!=='prospect' && row.status!=='ready_to_contact' && row.status!=='contacted' || rowEvents.some(e=>e.event_type==='reply');
  const score = 50*recency + 30*interactionScore + (reciprocated?20:0);
  const pips = Math.max(0, Math.min(5, Math.round(score/20)));
  const reasons = [lastContact!=null?`Last spoke ${Math.round(daysSince)}d ago`:'No contact yet',
    `${rowEvents.length} interaction${rowEvents.length===1?'':'s'}`, ...(reciprocated?['They replied']:[])];
  return { score, pips, reasons };
}

// Single "what's next" label per contact — feeds Dashboard priorities, People's
// Next-action column, and the Drawer callout. Nothing fabricated: every branch
// is a plain rule over real status/timing data.
function suggestedNextAction(row, rowEvents, followUpDays){
  followUpDays = followUpDays||7;
  switch(row.status){
    case 'prospect': case 'ready_to_contact':
      return { label:'Send the first message', urgent:false, action:'contact' };
    case 'contacted': {
      const replied = rowEvents.some(e=>e.event_type==='reply');
      if(replied) return { label:`Move to ${stageLabel('coffee_chat')}`, urgent:false, action:'coffee' };
      const days = row.contacted_at ? Math.round((now()-new Date(row.contacted_at).getTime())/864e5) : 0;
      if(days > followUpDays) return { label:`Follow up — no reply in ${days}d`, urgent:true, action:'followup' };
      return { label:'Waiting for reply', urgent:false, action:null };
    }
    case 'replied':
      return { label:`Move to ${stageLabel('coffee_chat')}`, urgent:false, action:'coffee' };
    case 'coffee_chat': {
      const chats = rowEvents.filter(e=>e.event_type==='coffee_chat').sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at));
      const last = chats[0];
      if(last?.suggested_next_touch && new Date(last.suggested_next_touch).getTime()<now())
        return { label:'Send a thank-you / next touch', urgent:true, action:'thanks' };
      return { label:'Send a thank-you note', urgent:false, action:'thanks' };
    }
    case 'referral': return { label:`Check in on ${stageLabel('referral').toLowerCase()}`, urgent:false, action:null };
    case 'interview': return { label:`Prep for ${stageLabel('interview').toLowerCase()}`, urgent:false, action:null };
    case 'offer': return { label:'Say thank you', urgent:false, action:'thanks' };
    default: return null;
  }
}

/* ============================ AI layer — shared backend proxy ============================
   Every student's AI calls route through the ai-proxy Edge Function, authenticated
   by their own Supabase session — no one ever sees or manages an API key.
   Running as a Claude artifact (window.claude.complete) is the one exception,
   used for the builder's own testing, not the deployed student experience. */
const inArtifact = () => typeof window!=='undefined' && window.claude && typeof window.claude.complete==='function';
function llmMode(sb, auth){ if(inArtifact()) return 'artifact'; if(sb && auth && auth.status==='in') return 'proxy'; return 'none'; }
// `feature` names the workload (draft_message, profile_briefing, coffee_extract,
// daily_plan, …) — the AI Gateway routes it to the right model, caches it, and
// bills it against the budgets. See edge-ai-proxy.ts FEATURES for the registry.
async function llm(sb, auth, feature, system, user, maxTokens=700){
  if(inArtifact()) return await window.claude.complete(`${system}\n\n———\n${user}`);
  if(!sb || !auth || auth.status!=='in') throw new Error('Sign in to use AI features.');
  const {data,error} = await sb.functions.invoke('ai-proxy', {body:{feature,system,user,maxTokens}});
  if(error) throw error;
  if(!data || data.ok===false) throw new Error((data&&(data.message||data.error))||'AI request failed.');
  return data.text;
}
async function llmJSON(sb, auth, feature, system, user, maxTokens=900){
  const text = await llm(sb, auth, feature, system+'\n\nRespond with ONLY valid JSON, no prose, no markdown fences.', user, maxTokens);
  return JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}')+1));
}
