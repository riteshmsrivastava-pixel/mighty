<!DOCTYPE html>

<title>Mighty · Intentional, intelligent networking</title>
<!-- ============================================================
     Mighty v2 - the relationship operating system.
     Governed by docs/PRODUCT-BIBLE-v2.md. Visual spec: the Claude Design
     bundle (app-redesign-with-new-principles).

     Navigation is the user's questions, not features:
       Today - what deserves my attention?
       Relationships - where am I with everyone, and who is worth adding?
       You - how does this work for me? (Mirror, Patterns, Goal, Account)
       Ask Mighty - what should I do?

     Permanent rules enforced here:
       · You always click Send. Nothing is ever sent automatically.
       · Explain before you score - no numeric match scores in the UI.
       · Save is the only way a person enters Mighty; 'prospect' IS Saved.
       · Navigation is always visible; only depth unlocks, on data not time.
       · Never "Mighty knows" - always "Things you have learned".
       · No empty dashboards: every panel hides until it has real data.

     Same Supabase project, tables and settings keys as app/v1.html, so both
     apps read and write one account.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=2">

<style>
  /* ============================================================
     THE PRISM - Mighty's design system as of 11 Aug 2026.
     Source: Claude Design handoff "Mighty Product Page Concepts", DESIGN.md
     ("Ambient Intelligence" / Midnight High-Fidelity Glassmorphism) plus the
     built Mighty Prism.dc.html prototype.

     Every token below KEEPS ITS OLD NAME and takes a new value. That is
     deliberate: every var(--x) reference across this 7,000+ line file - in
     this stylesheet and in hundreds of inline React style objects - picks up
     the new palette automatically, with no risk to any of the logic that
     reads them. Only the values change; nothing that touches routing,
     state, or data does.

     One resolved conflict, stated rather than buried: DESIGN.md's own
     tokens, and both "orphan" concept screens (Organiser Hub, Node Capacity
     Management), all agree the page background is #131313. Only the single
     built Prism.dc.html prototype's outer <style> uses a lighter #221F2E.
     Going with the majority (#131313) as --paper, and reserving something
     close to that outlier as the elevated rail/header tone below - it
     wasn't wrong, it was a level up the elevation scale. ============= */
  :root{
 --paper:#131313; --rail:#1A1A1E; --card:rgba(255,255,255,.04); --card2:rgba(255,255,255,.03);
 --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.06); --line3:rgba(255,255,255,.08); --line4:rgba(255,255,255,.06);
 --ink:#E5E2E1; --ink2:#DAD7E0; --body:#CBC3D7; --sub:#958EA0; --mute:#6B6575; --mute2:#7A7488;
 --brand:#A078FF; --brand-h:#B48EFF; --brand-ink:#D0BCFF;
 --brand-soft:rgba(160,120,255,.12); --brand-soft2:rgba(160,120,255,.18); --brand-line:rgba(208,188,255,.35); --brand-nav:rgba(160,120,255,.15);
 --peach:#4CD7F6;
 --green:#4EDEA3; --green2:#4EDEA3; --green-soft:rgba(78,222,163,.12);
 --amber:#E0BE63; --amber-soft:rgba(224,190,99,.12); --amber-dot:#E0BE63;
 --red:#FFB4AB; --red-soft:rgba(255,180,171,.12);
 --f:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
 --f-head:'Sora',var(--f); --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
 --r:8px; --rsm:6px; --pill:4px; --sh:0 4px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
  a{color:var(--brand-ink);text-decoration:none}
  a:hover{color:var(--brand-h)}
  button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
  input,textarea,select{font-family:inherit;color:inherit}
  input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}
  ::selection{background:rgba(208,188,255,.28)}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#3A3842;border-radius:99px;border:3px solid var(--paper)}
  ::-webkit-scrollbar-track{background:transparent}

  .h1{font-family:var(--f-head);font-size:32px;font-weight:700;letter-spacing:-.03em;text-wrap:pretty;margin:0}
  .h2{font-family:var(--f-head);font-size:26px;font-weight:700;letter-spacing:-.03em;text-wrap:pretty;margin:0}
  .h3{font-family:var(--f-head);font-size:19px;font-weight:600;letter-spacing:-.02em}
  .h4{font-family:var(--f-head);font-size:16px;font-weight:600;letter-spacing:-.01em}
  .eyebrow{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--sub)}
  .eyebrow.b{color:var(--peach)}
  .sub{font-size:15px;color:var(--sub)}
  .meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--mute2)}
  .pad{padding:40px 48px 90px}

  /* "Refractive Cards" (DESIGN.md Level 1): translucent white over the
     obsidian ground, blurred so whatever sits behind still reads through it,
     with a hairline border rather than a shadow doing the separating. */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .why{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:12px}

  /* "Spectral Buttons": the primary action is the violet-to-cyan flow, and a
     hover brightens the gradient rather than swapping to a flat darker fill -
     the one rule DESIGN.md is explicit about ("increase luminance, don't
     change the color"). rounded-md per spec: sharp small-radius rectangles,
     not the pill shape the cream theme used. */
  .btn{padding:11px 20px;border-radius:var(--pill);background:linear-gradient(90deg,var(--brand),var(--peach));color:#0B0620;font-size:14.5px;font-weight:700;transition:filter .15s;white-space:nowrap}
  .btn:hover:not(:disabled){filter:brightness(1.15)}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn.g{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
  .btn.g:hover:not(:disabled){border-color:var(--brand-line);color:var(--brand-ink);background:transparent}
  .btn.sm{padding:9px 17px;font-size:14px}
  .btn.xs{padding:7px 14px;font-size:13px}
  .btn.q{background:none;color:var(--sub);font-weight:600;padding:12px 8px}
  /* Restating the background is not redundant: .btn:hover above matches these
     too and would otherwise paint a brand-coloured pill behind what is meant to
     read as plain text. .btn.g:hover does the same thing for the same reason. */
  .btn.q:hover:not(:disabled){color:var(--ink);background:rgba(255,255,255,.05)}
  .btn.soft{background:rgba(255,255,255,.06);color:var(--body);font-weight:600}
  .btn.soft:hover{background:rgba(255,255,255,.09)}

  /* "Intelligence Inputs": no filled background, a hairline that glows cyan
     on focus rather than a border that just changes colour. */
  .inp{width:100%;padding:14px 16px;border-radius:var(--rsm);border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);color:var(--ink);font-size:15.5px}
  .inp:focus{background:rgba(0,0,0,.35);border-color:var(--peach);box-shadow:0 0 0 3px rgba(76,215,246,.15)}
  .inp::placeholder{color:var(--mute)}
  textarea.inp{min-height:74px;resize:vertical;line-height:1.55;padding:13px 15px;border-radius:8px;font-size:15px}
  .lbl{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin-bottom:8px}

  /* "Monospace Chips": low-profile dark chips with mono text and a thin
     border - used everywhere the old cream theme used a soft lavender pill. */
  .chip{font-family:var(--f-mono);padding:7px 14px;border-radius:var(--pill);border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12.5px;letter-spacing:.03em;color:var(--body);font-weight:500;white-space:nowrap}
  .chip:hover:not(:disabled){border-color:var(--brand-line);color:var(--brand-ink)}
  .chip.on{background:var(--brand-soft2);border-color:var(--brand-line);color:var(--brand-ink);font-weight:700}
  .tag{font-family:var(--f-mono);padding:5px 11px;border-radius:var(--pill);background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:11px;letter-spacing:.03em;color:var(--body);font-weight:500;white-space:nowrap}
  .tagx{display:inline-flex;align-items:center;gap:7px;padding:6px 8px 6px 13px;border-radius:var(--pill);background:var(--brand-soft2);color:var(--brand-ink);font-size:13px;font-weight:600}
  .tagx button{color:var(--brand-ink);font-size:15px;line-height:1;padding:0 4px;opacity:.7}
  .tagx button:hover{opacity:1}
  .seg{display:flex;gap:3px;padding:3px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;width:fit-content}
  .seg button{padding:8px 16px;border-radius:5px;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap}
  .seg button.on{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none}

  .av{border-radius:50%;background:linear-gradient(135deg,var(--peach),var(--brand));color:#0B0620;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-family:var(--f-mono)}
  .pill{display:inline-block;font-family:var(--f-mono);padding:4px 11px;border-radius:var(--pill);font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
  /* Status LEDs (DESIGN.md "Glow States"): a coloured dot with a matching
     bloom, not a flat circle - .dot's own box-shadow is set per-instance
     from the same colour already passed in as background, everywhere it's
     used, so no other rule needs to change for this. */
  .dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
  .row{display:flex;align-items:center;gap:16px}
  .stack{display:flex;flex-direction:column}
  .tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs button{padding:11px 0;font-size:14.5px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--brand-ink);font-weight:700}

  .spin{width:15px;height:15px;border:2px solid rgba(208,188,255,.25);border-top-color:var(--brand-ink);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .fade{animation:fi .22s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .banner{border-radius:8px;padding:13px 16px;font-size:14px;font-weight:500;line-height:1.5}
  .banner.warn{background:var(--amber-soft);color:var(--amber);border:1px solid rgba(224,190,99,.3)}
  .banner.err{background:var(--red-soft);color:var(--red);border:1px solid rgba(255,180,171,.3)}
  .banner.ok{background:var(--green-soft);color:var(--green);border:1px solid rgba(78,222,163,.3)}
  .hint{font-size:13px;color:var(--mute2);line-height:1.5}
  .lift:hover{background:var(--card2)}
  /* Today's cards carry a status-tinted background (see TONE_BG), which as an
     inline style outranks .lift:hover's plain background swap - this keeps a
     hover cue (a lift + soft shadow, neither set inline) instead of losing it. */
  .todaycard{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .todaycard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4);border-color:rgba(255,255,255,.14)}
  .colcard{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--rsm);padding:15px 16px;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .colcard:hover{border-color:var(--brand-line);transform:translateY(-2px);box-shadow:0 8px 24px rgba(160,120,255,.14)}
  .drop{outline:2px dashed var(--brand-line);outline-offset:-4px;border-radius:12px}

  @media (max-width:900px){
    .h1{font-size:26px} .h2{font-size:22px}
    .pad{padding:26px 20px 90px!important}
    /* the rail carries an inline display:flex, so this needs to win */
    .railwrap{display:none!important}
    .mobnav{display:flex!important}
    .hdr{padding:14px 20px!important}
    .hdr h1{font-size:17px!important}
  }
  .mobnav{display:none}
</style>
</head>

<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
  // Classic JSX runtime - the automatic runtime emits an ES import that fails without a bundler.
  Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] });
</script>
<script type="text/babel" data-presets="react-classic">
const {useState, useEffect, useRef, useMemo} = React;
const F = React.Fragment;

/* ===================== platform config (same project as app/v1.html) ===================== */
const SUPABASE_URL      = 'https://hplyyywdftnvjajyncvj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_e_oCwuz3Qlko5N3Xl8ZwxA_zQijz_u8';


/* Primary-goal vocabulary is v1's goalType enum so both apps score alike. */
const GOALS = [
  {id:'job_search',    label:'Find a new job',         hint:'Hiring managers, alumni, people already in the role'},
  {id:'raise_funding', label:'Raise investment',       hint:'Investors, angels, founders who have raised'},
  {id:'sales',         label:'Find customers',         hint:'Buyers, executives, decision makers'},
  {id:'mentors',       label:'Find mentors & advisors', hint:'Operators and experts a step ahead of you'},
  {id:'networking',    label:'Build my network',       hint:'Broad, deliberate, long-term relationships'},
];
const GOAL_LABEL = GOALS.reduce((a,g)=>{a[g.id]=g.label;return a;},{});
/* One goal can now be several. goalTypes is the source of truth when it
   exists; goalType (singular) survives on old accounts that saved before
   this changed. */
const goalTypeList = (st)=>{
  const s = st||{};
  return (s.goalTypes&&s.goalTypes.length) ? s.goalTypes : (s.goalType ? [s.goalType] : []);
};
const goalLine = (st)=>{
  const s = st||{};
  if(clean(s.goal)) return s.goal;
  const labels = goalTypeList(s).map(t=>GOAL_LABEL[t]).filter(Boolean);
  return labels.join(' and ') || 'Build your network';
};
/* A two-or-three-word version of the goal, for the one place a full sentence
   would not fit - "One step closer to funding," not "...to Raise a seed
   round for an AI-native venture studio, from investors who..." */
const GOAL_SHORT = {job_search:'a new job', raise_funding:'funding', sales:'new customers',
  mentors:'the right mentors', networking:'a stronger network'};
const goalShort = (st)=> GOAL_SHORT[goalTypeList(st)[0]] || 'your goal';
/* What to call a saved person, in the goal's own words - "12 investors" says
   more than "12 people" the moment the goal is raising money. */
const GOAL_NOUN = {job_search:'contacts', raise_funding:'investors', sales:'prospects',
  mentors:'mentors', networking:'people'};
const goalNoun = (st)=> GOAL_NOUN[goalTypeList(st)[0]] || 'people';

/* The funnel a goal actually moves through, in real counts only - never a
   fabricated "68% there," which nothing here can honestly know. Do-not-contact
   is excluded throughout: someone you closed out is not still in play toward
   anything. */
function goalFunnel(people){
  const active = people.filter(r=>r.status!=='do_not_contact');
  return {
    saved:     active.length,
    reachedOut:active.filter(r=>REACHED.includes(r.status)).length,
    talking:   active.filter(r=>['replied','coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length,
    advanced:  active.filter(r=>['referral','interview','offer'].indexOf(r.status)>=0).length,
  };
}

/* outreach_log.status is the ONE stage field. 'prospect' IS Saved.
   bg/fg are supplied as a pair for a filled, opaque pill, so a light-cream
   bg with dark-ink fg was never actually unreadable the way Today's hero or
   the Goal chips were - both colours travelled together. What it was is
   wrong for Prism: a bright opaque pill sitting on an obsidian glass card
   reads as a mistake, not a colour choice. These are translucent-on-dark
   "Monospace Chip" pairs instead, one per semantic family (neutral / brand
   / waiting-amber / active-green), matching how every other status pill in
   the app has been restyled. */
const STAGE = {
  prospect:        {label:'Saved',              bg:'rgba(255,255,255,.06)', fg:'var(--sub)', dot:'var(--mute)'},
  ready_to_contact:{label:'Ready to reach out', bg:'var(--brand-soft2)', fg:'var(--brand-ink)', dot:'var(--brand)'},
  contacted:       {label:'Reached out', bg:'var(--amber-soft)', fg:'var(--amber)', dot:'var(--amber)'},
  replied:         {label:'In conversation',bg:'var(--green-soft)', fg:'var(--green)', dot:'var(--green)'},
  coffee_chat:     {label:'Met',                bg:'var(--green-soft)', fg:'var(--green)', dot:'var(--green)'},
  referral:        {label:'Opportunity in motion',bg:'var(--green-soft)', fg:'var(--green)', dot:'var(--green)'},
  interview:       {label:'Opportunity in motion',bg:'var(--green-soft)', fg:'var(--green)', dot:'var(--green)'},
  offer:           {label:'Growing',              bg:'var(--green-soft)', fg:'var(--green)', dot:'var(--green)'},
  do_not_contact:  {label:'Closed out',     bg:'rgba(255,255,255,.06)', fg:'var(--mute)', dot:'var(--mute)'},
};
const stageOf = (r)=>STAGE[(r||{}).status] || STAGE.prospect;
/* Board columns follow the Bible's default pipeline; the late statuses share
   one "Growing" column so the board stays readable. */
/* Four columns, not six - the handoff merges everything from a first reply
   onward (replied/coffee_chat/referral/interview/offer) into one "Active"
   column, since past that point the meaningful question is just "is this
   relationship moving," not which of five sub-stages it is technically in. */
const COLUMNS = [
  {key:'prospect',         statuses:['prospect'],         label:'Potential'},
  {key:'ready_to_contact', statuses:['ready_to_contact'], label:'Prepared'},
  {key:'contacted',        statuses:['contacted'],        label:'Waiting'},
  {key:'active',           statuses:['replied','coffee_chat','referral','interview','offer'], label:'Active'},
];
const ORDER = ['prospect','ready_to_contact','contacted','replied','coffee_chat','referral','interview','offer'];
/* For the status dropdown on the profile page: ORDER has 8 raw statuses, but
   several intentionally share one label (referral/interview both read
   "Opportunity in motion") - the Board already collapses them the same way
   into one "Active" column. Keeping every raw value in a picker would show
   that label twice with no visible difference; the first status carrying
   each label is the one a pick actually sets. do_not_contact is appended
   since it is a real, reachable status the dropdown should be able to set
   too, not just the forward path. */
const STAGE_OPTIONS = (()=>{
  const seen = new Set(); const out = [];
  [...ORDER, 'do_not_contact'].forEach(s=>{
    const label = STAGE[s].label;
    if(seen.has(label)) return;
    seen.add(label); out.push({value:s, label});
  });
  return out;
})();
const REACHED = ['contacted','replied','coffee_chat','referral','interview','offer'];
const EVENT_LABEL = {connection_request:'Connection request', first_message:'Reached out',
  reply:'They replied', coffee_chat:'Met', note:'Note captured', referral:'Introduction made',
  interview:'Meeting', stage_change:'Stage changed'};

/* ===================== progressive disclosure =====================
   Navigation is always visible. Only depth unlocks, and only on data. */
const UNLOCKS = {
  board:    {test:(p)=>p.length>=5,       hint:'The board opens once five people are saved. Before that, a list says more.'},
  timeline: {test:(p,e)=>e.length>=3,     hint:'The timeline fills in once three things have happened.'},
  health:   {test:(p)=>p.filter(r=>REACHED.includes(r.status)).length>=3,
             hint:'Reach out to three people and Mighty can start showing what is working.'},
  progress: {test:(p)=>p.length>=3,       hint:'Progress appears once you have saved three people.'},
};
const canSee = (k,p,e)=>{ try{ return !!UNLOCKS[k].test(p,e); }catch(err){ return false; } };

/* ===================== helpers ===================== */
const clean = (s)=>String(s==null?'':s).trim();
const initials = (n)=>clean(n).split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
const firstName = (n)=>clean(n).split(/\s+/)[0] || '';
const DAY = 86400000;
const days = (iso)=> iso ? Math.floor((Date.now()-new Date(iso).getTime())/DAY) : null;
const ago = (iso)=>{ const d=days(iso); if(d==null) return ''; return d<=0?'today':d===1?'yesterday':d<30?d+' days ago':d<365?Math.round(d/30)+' months ago':Math.round(d/365)+'y ago'; };
const dateShort = (iso)=>{ if(!iso) return ''; const d=new Date(iso);
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); };
const greetWord = ()=>{ const h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; };

/* Real photo when one exists - the extension captures it the moment someone
   is saved from a search result or from their own profile - falling back to
   initials the moment the image 404s (a stale or since-privated LinkedIn
   photo URL) rather than showing a broken-image icon. */
/* One shape out of the several a "person" arrives in across the app - a
   saved outreach_log row, a connections_match row, a raw search result -
   read for whatever it actually has, so the hover preview works the same
   everywhere instead of needing a different card per source. */
function personPreview(p){
  if(!p) return null;
  const name = clean(p.name) || (p.first_name!=null ? connName(p) : '');
  if(!name) return null;
  const ctx = p.context || {};
  const why = clean(ctx.whySaved) || clean(p.why) || connReason(p);
  const common = (p.briefing && p.briefing.shared && p.briefing.shared.length) ? p.briefing.shared
    : (ctx.common || p.common || []);
  return {
    name, title: p.title || p.position || '', company: p.company || '',
    location: ctx.location || p.location || '', education: ctx.education || p.education || '',

/* Module-level, not component state - every Avatar on screen for the same

   same profileUrl elsewhere on the page never re-fetches. */
const _photoCache = new Map();
const _photoInFlight = new Set();
function Avatar({name, size, src, hover}){
  const s = size||38;
  const [broken,setBroken] = useState(false);
  const [show,setShow] = useState(false);
  const [rect,setRect] = useState(null);
  const ref = useRef(null);
  /* Wherever a person appears with enough identity to look them up (which is
     everywhere `hover` is already passed, for the preview card), also try
     for their real photo - no separate wiring needed per screen. Never
     overrides a photo that already came back with the row (src wins), and
     never re-fetches something already cached or already in flight. */
  const profileUrl = hover && (hover.profile_url || hover.profileUrl);
  const [fetched,setFetched] = useState(()=> profileUrl ? _photoCache.get(profileUrl) : null);
  useEffect(()=>{
    if(src || !profileUrl) return;
    if(_photoCache.has(profileUrl)){ setFetched(_photoCache.get(profileUrl)); return; }
    if(_photoInFlight.has(profileUrl) || !extBridge.isReady()) return;
    _photoInFlight.add(profileUrl);
    extBridge.photo(profileUrl).then(r=>{
      _photoInFlight.delete(profileUrl);
      if(r && r.ok && r.dataUrl){ _photoCache.set(profileUrl, r.dataUrl); setFetched(r.dataUrl); }
    });
  },[src, profileUrl]);
  const effectiveSrc = src || fetched;

    ? <img ref={ref} src={effectiveSrc} alt="" width={s} height={s} onError={()=>setBroken(true)}
        style={{width:s,height:s,borderRadius:'50%',objectFit:'cover',flex:'none',background:'var(--card2)'}}/>
    : <div ref={ref} className="av" style={{width:s,height:s,fontSize:Math.round(s*0.36)}}>{initials(name)}</div>;

  if(!p) return core;
  const open = ()=>{ if(ref.current) setRect(ref.current.getBoundingClientRect()); setShow(true); };
  const close = ()=> setShow(false);
  const st = p.status ? stageOf({status:p.status}) : null;

     box, rather than an absolutely-positioned sibling, so it is never
     clipped by a card's overflow:hidden - which several of the lists this
     shows up in rely on for their own rounded corners. */

    <span onMouseEnter={open} onMouseLeave={close} style={{display:'inline-flex',flex:'none'}}>
      {core}

        /* Card height is content-dependent (location/education/summary/tags
           all vary), so clamping only the top edge left it rendering off the

           where hovering to preview is most likely. Flip above the avatar
           when there isn't enough room below, and cap height either way as
           a backstop. */

           chosen, not a flat 420px guess - a card that size could still
           clip past either edge whenever available space fell short of it
           but still passed the flip threshold above. */
        const room = openAbove ? rect.top - 20 : spaceBelow - 20;
        const cardMax = Math.max(120, Math.min(420, room));
        return ReactDOM.createPortal(
        <div onMouseEnter={open} onMouseLeave={close} className="fade"
          style={{position:'fixed', left:Math.max(12,Math.min(rect.left, window.innerWidth-308)),
            ...(openAbove ? {bottom:Math.max(12,window.innerHeight-rect.top+8)} : {top:rect.bottom+8}),
            maxHeight:cardMax, overflowY:'auto',
            zIndex:200, width:280,
            background:'var(--card)', backdropFilter:'blur(24px)', WebkitBackdropFilter:'blur(24px)',
            border:'1px solid rgba(255,255,255,.14)', borderRadius:'var(--r)',
            boxShadow:'0 20px 44px rgba(0,0,0,.5)', padding:18}}>
          <div className="row" style={{gap:12}}>
            {src && !broken
              ? <img src={src} alt="" width={40} height={40} style={{width:40,height:40,borderRadius:'50%',objectFit:'cover',flex:'none'}}/>
              : <div className="av" style={{width:40,height:40,fontSize:15}}>{initials(p.name)}</div>}
            <div style={{minWidth:0}}>
              <div style={{fontWeight:700,fontSize:15,letterSpacing:'-.01em'}}>{p.name}</div>
              <div className="sub" style={{fontSize:12.5,marginTop:1}}>{[p.title,p.company].filter(Boolean).join(' · ')||'No headline captured'}</div>
            </div>
          </div>
          {st && <div style={{marginTop:10}}><span className="pill" style={{background:st.bg,color:st.fg,fontSize:11,padding:'4px 11px'}}>{st.label}</span></div>}
          {(p.location||p.education) &&
            <div className="meta" style={{marginTop:10}}>{[p.location,p.education].filter(Boolean).join(' · ')}</div>}
          {p.summary &&
            <div style={{marginTop:10,fontSize:13,lineHeight:1.5,color:'var(--body)'}}>{p.summary}</div>}
          {!p.summary && p.why &&
            <div style={{marginTop:10,fontSize:13,lineHeight:1.5,color:'var(--brand-ink)'}}>{p.why}</div>}

              {p.common.slice(0,4).map((c,i)=><span key={i} className="tag" style={{fontSize:11,padding:'4px 10px'}}>{c}</span>)}
            </div>}

    </span>
  );
}
/* A guessed .com for a company name - stripping the legal-entity noise

    .replace(/\(.*?\)/g,'')

    .replace(/\b(inc|incorporated|ltd|limited|llc|llp|corp|corporation|co|company|companies|group|holdings|holding|pvt|private|plc|technologies|technology)\b/g,'')
    .trim().replace(/\s+/g,'');

/* ===================== AI (shared ai-proxy - no key ever reaches the client) ===================== */
/* ---- Instrumentation --------------------------------------------------------
   Our own table, not a third-party service, because we tell people that nothing
   they write about someone leaves their account. Sending behavioural data to a
   vendor a week after saying that would make it untrue in spirit.

   Counts and categories only. safeProps() enforces that structurally rather than
   by convention: a value survives only if it is a finite number, a boolean, or a
   short enum-shaped string. A name has a space and a capital, an email has an @,
   a URL has a colon and a slash - all three are dropped by the same rule, so a
   leak requires defeating the sanitizer rather than merely forgetting the rule.

   Fire and forget. Analytics must never break a feature or make the user wait,
   so every failure here is swallowed on purpose. */
const ENUMISH = /^[a-z0-9_]{1,32}$/;
/* Must agree with app_events.event's check constraint (2 to 40 chars). A name
   the client accepts and Postgres rejects is an event that vanishes silently. */
const EVENT_NAME = /^[a-z0-9_]{2,40}$/;
function safeProps(props){
  const out = {};
  if(!props || typeof props!=='object') return out;
  for(const k of Object.keys(props).slice(0,8)){
    if(!ENUMISH.test(k)) continue;
    const v = props[k];
    if(typeof v==='number' && Number.isFinite(v)) out[k] = v;
    else if(typeof v==='boolean') out[k] = v;
    else if(typeof v==='string' && ENUMISH.test(v)) out[k] = v;
    // anything else - names, emails, URLs, note text, objects - is dropped
  }
  return out;
}
/* App binds these once it has a client and a session. Kept module-level rather
   than threaded through six components as a prop: call sites stay readable, and
   an unbound tracker is a silent no-op rather than a crash. */
let _trkSb = null, _trkUser = null;
function bindTracking(sb, user){ _trkSb = sb; _trkUser = user; }
function track(event, props){
  try{
    if(!_trkSb || !_trkUser || !EVENT_NAME.test(String(event||''))) return;
    _trkSb.from('app_events').insert({user_id:_trkUser.id, event, props:safeProps(props)})
      .then(()=>{}, ()=>{});   // never surface an analytics failure
  }catch(e){}
}

/* ---- Extension bridge -------------------------------------------------------
   The extension can read a search results page that this page cannot: CORS
   blocks the app, but the background worker holds host permission. It parses
   location, education, experience and follower counts out of the same response,
   which the API path does not return at all. Ported from v1, which used it and
   which v2 stopped calling.

   Request/response over postMessage. With no extension installed every call
   times out and resolves {ok:false, error:'no_extension'}, so callers fall back
   rather than hang. Nothing here navigates or opens a tab. */
const extBridge = (()=>{
  let seq=0; const pending=new Map(); let ready=false;
  if(typeof window!=='undefined'){
    window.addEventListener('message', ev=>{
      if(ev.source!==window) return;
      const d=ev.data; if(!d || d.source!=='mighty-ext') return;
      ready = true;                              // any reply at all proves it's connected
      if(d.ready) return;
      const cb=pending.get(d.id); if(cb){ pending.delete(d.id); cb(d); }
    });
    /* bridge.js's content script runs at document_start and announces itself
       exactly once, synchronously, right then - which is routinely before
       this file (350kb of JSX the browser is still Babel-transforming) has
       reached this line and attached the listener above. Miss that single
       broadcast and isReady() reports false for the rest of the session even
       though the extension is fully installed and connected - which is
       exactly what made photos silently never fetch. Ping instead of only
       listening passively: bridge.js answers 'ping' any time, so a handful
       of retries over the first few seconds catches it whenever its own
       listener is actually up, no matter which side won the race. */
    let pingTries=0;
    const pingUntilReady = ()=>{
      if(ready || pingTries>=6) return;
      pingTries++;
      window.postMessage({source:'mighty-app', id:'boot-ping-'+pingTries, kind:'ping'}, window.location.origin);
      setTimeout(pingUntilReady, pingTries*600);
    };
    pingUntilReady();
  }
  function call(kind, extra, timeoutMs){
    return new Promise(resolve=>{
      const id='m'+(++seq)+'-'+Date.now();
      const t=setTimeout(()=>{ pending.delete(id); resolve({ok:false,error:'no_extension'}); }, timeoutMs||25000);
      pending.set(id, d=>{ clearTimeout(t); resolve(d); });
      window.postMessage({source:'mighty-app', id, kind, ...extra}, window.location.origin);
    });
  }
  return {
    isReady: ()=>ready,
    search: (query)=>call('search',{query}),
    photo: (profileUrl)=>call('photo',{profileUrl}, 30000),
    webSearch: (query)=>call('webSearch',{query}, 20000),
  };
})();

/* The proxy already tells us the plan and how much of the monthly allowance is
   left; llm() used to return data.text and throw the rest away, so the number the
   whole model is metered on was invisible in the app. It is reported here and the
   App renders it. Reported on refusal too - that is exactly when it matters. */
let _onAiMeta = null;
function onAiMeta(fn){ _onAiMeta = fn; }
function reportMeta(meta){ try{ if(_onAiMeta && meta) _onAiMeta(meta); }catch(e){} }

/* `exchangeKey` is how one assist buys ten takes. It identifies a single
   outbound conversation with one person - 'ex:<log_id>:<n>' - and the gateway
   charges the first call carrying it and nothing after. It contains no name and
   no profile URL, so the ledger stays free of anyone who is not a user. */
async function llm(sb, feature, system, user, maxTokens, exchangeKey){
  let data, error;
  try{
    ({data, error} = await sb.functions.invoke('ai-proxy',
      {body:{feature, system, user, maxTokens:maxTokens||700, exchangeKey:exchangeKey||null}}));
  }catch(e){
    /* A transport-level failure (offline, CORS, the function itself down) is
       not the same as ai-proxy answering with a real error - console.error
       keeps the raw detail for debugging without putting "Failed to fetch"
       or a stack trace in front of the user. */
    console.error('ai-proxy transport error', e);
    throw new Error("Could not reach Mighty's AI right now. Check your connection and try again.");
  }
  if(error){
    console.error('ai-proxy error', error);
    /* supabase-js throws FunctionsHttpError for any non-2xx response, whose
       own .message is a hardcoded "Edge Function returned a non-2xx status
       code" - the real, useful message ai-proxy sent (e.g. an expired
       session, or why the request failed server-side) lives in the actual
       response body on error.context, and was being discarded entirely. */
    let curated = null;
    try{
      if(error.context && typeof error.context.json==='function'){
        const body = await error.context.json();
        if(body && body.message) curated = body.message;
      }
    }catch(e2){ /* body wasn't readable JSON - fall through to the generic message */ }
    throw new Error(curated || "Could not reach Mighty's AI right now. Check your connection and try again.");
  }
  if(data && data.meta) reportMeta(data.meta);
  if(!data || data.ok===false){
    if(data && data.error==='rate_limited') reportMeta({plan:data.plan, assistsLeftMonth:0, exhausted:true});
    throw new Error((data && (data.message||data.error)) || 'AI request failed.');
  }
  return data.text;
}
/* A model reply that is empty, cut off mid-object, or wrapped in prose despite
   instructions is a real, occasional failure mode - not a bug in the caller.
   Surfacing JSON.parse's own error ("Unexpected end of JSON input") to the
   user reads as broken software, so it is retried once - free, since the
   exchange is already paid for by exchangeKey - before giving up with a
   message that says what actually happened. */
function extractJSON(text){
  const s = String(text||'').indexOf('{'), e = String(text||'').lastIndexOf('}');
  if(s===-1 || e===-1 || e<s) throw new Error('Mighty came back without an answer that parsed.');
  return JSON.parse(text.slice(s, e+1));
}
async function llmJSON(sb, feature, system, user, maxTokens, exchangeKey){
  const sys = system+'\n\nRespond with ONLY valid JSON, no prose, no markdown fences.';
  const text = await llm(sb, feature, sys, user, maxTokens||900, exchangeKey);
  try{ return extractJSON(text); }
  catch(e){
    const retryText = await llm(sb, feature,
      sys+' Keep the whole reply under '+(maxTokens||900)+' tokens so it is never cut off mid-object.',
      user, maxTokens||900, exchangeKey);
    try{ return extractJSON(retryText); }
    catch(e2){ throw new Error("Mighty's answer did not come back in the right shape. Try again in a moment."); }
  }
}
function strategyBrief(st){

  const education = (kb.education||[]).slice(0,3).map(e=>[e.degree,e.school].filter(Boolean).join(', ')).filter(Boolean);
  return [
    'Goal: ' + (goalTypeList(st).map(t=>GOAL_LABEL[t]).filter(Boolean).join(' and ') || 'building a professional network'),

    (st.targetRoles||[]).length ? 'Wants to meet: ' + st.targetRoles.join(', ') : '',
    (st.targetCompanies||[]).length ? 'Target organizations: ' + st.targetCompanies.join(', ') : '',
    (st.targetLocations||[]).length ? 'Places that matter: ' + st.targetLocations.join(', ') : '',
    (st.currentRole||st.currentCompany) ? 'Currently: ' + [st.currentRole, st.currentCompany].filter(Boolean).join(' at ') : '',
    (kb.identity&&kb.identity.headline) ? 'LinkedIn headline: ' + kb.identity.headline : '',
    positions.length ? 'Career history: ' + positions.join('; ') : '',
    education.length ? 'Education: ' + education.join('; ') : '',
    (st.schools||[]).length ? 'Schools: ' + st.schools.join(', ') : '',
    (kb.identity&&clean(kb.identity.summary)) ? 'About: ' + clean(kb.identity.summary).slice(0,400) : '',
    clean(kb.resumeText) ? 'Resume: ' + clean(kb.resumeText).slice(0,600) : '',
    (st.successMetrics||[]).length ? 'Success looks like: ' + st.successMetrics.join(', ') : '',
    (st.networkingStyle||[]).length ? 'Prefers: ' + st.networkingStyle.join(', ') : '',

    (kb.mail && (kb.mail.domains||[]).length)

      ? 'They are in real two-way email contact with ' + kb.mail.twoWayCount + ' people.' : '',

      ? 'Keywords: ' + kb.synthesis.keywords.slice(0,18).join(', ') : '',
    (kb.synthesis && (kb.synthesis.themes||[]).length)
      ? 'Career themes: ' + kb.synthesis.themes.slice(0,4).map(t=>t.title).join('; ') : '',
    (kb.synthesis && (kb.synthesis.insights||[]).length)
      ? 'Specific differentiators to draw on: ' + kb.synthesis.insights.slice(0,4).join('; ').slice(0,600) : '',

      ? 'Reusable proof points (pull the one that fits): '

/* Cheap fingerprint of the fields synthesizeKnowledge() actually reads, so the
   background effect that runs it can tell "nothing changed" from "resume just

   worst case is one skipped recompute, caught next time something real changes. */
function kbFingerprint(kb){
  const parts = [
    kb.resumeText||'',
    (kb.identity&&kb.identity.headline)||'',
    (kb.identity&&kb.identity.summary)||'',
    (kb.positions||[]).map(p=>[p.title,p.company].join('@')).join('|'),
    (kb.education||[]).map(e=>[e.degree,e.school].join('@')).join('|'),
    (kb.skills||[]).join(','),
    (kb.selfResearch&&kb.selfResearch.lastRunAt)||'',
    (kb.mail&&kb.mail.capturedAt)||'',

  for(let i=0;i<parts.length;i++) h = (h*31 + parts.charCodeAt(i)) | 0;

   never asked for this call and shouldn't pay assists for upkeep they can't

   data, so without this an account whose data hasn't changed since an
   earlier version would keep serving the old, narrower shape forever. */
const SYNTHESIS_SCHEMA_VERSION = 2;
async function synthesizeKnowledge(sb, st){
  const raw = strategyBrief(st);
  if(!raw.trim()) return null;
  const out = await llmJSON(sb, 'profile_briefing',
    'You read a professional profile (career history, education, resume, self-description) and extract a structured knowledge base from it, for use later in personalized outreach messages. '+
    'Return JSON: {"keywords":[...], "themes":[{"title":"...","summary":"..."}], "insights":[...], "proofPoints":[{"claim":"...","pitch":"fundraising"|"hiring"|"advisory"|"partnership"|"general"}], "questionBank":[{"industry":"...","questions":["...","...","..."]}]}. '+
    'keywords: 12-25 specific, searchable terms - skills, technologies, industries, functions, methodologies. No generic buzzwords like "hard worker" or "team player". '+
    'themes: 3-5 real throughlines in the career, e.g. "built and scaled data/AI orgs from zero" or "operates at the boardroom/regulator level, not just technical" - each with a one-sentence summary. '+
    'insights: 4-6 specific, concrete differentiators or achievements with numbers where available - the kind of detail that makes a message sound like it came from someone with real, evidenced experience, not a vague bio. '+
    'proofPoints: 4-8 standalone, reusable claims mined from the numbers already in the profile (budgets owned, headcount, users, revenue, awards, years) - each tagged with which kind of conversation it actually supports, so the right one gets pulled up rather than always leading with the same fact. '+
    'questionBank: for every distinct industry this person has real, direct experience in (not aspirational, not adjacent), 3 specific questions worth asking someone else in that same industry - grounded in what this person has actually done there, not generic interview questions.',
    raw, 1900);
  return {
    keywords: Array.isArray(out.keywords) ? out.keywords.filter(Boolean).slice(0,25) : [],
    themes: Array.isArray(out.themes) ? out.themes.filter(t=>t&&t.title).slice(0,6) : [],
    insights: Array.isArray(out.insights) ? out.insights.filter(Boolean).slice(0,8) : [],
    proofPoints: Array.isArray(out.proofPoints) ? out.proofPoints.filter(p=>p&&p.claim).slice(0,8)
      .map(p=>({claim:clean(p.claim), pitch:['fundraising','hiring','advisory','partnership','general'].indexOf(p.pitch)>=0?p.pitch:'general'})) : [],
    questionBank: Array.isArray(out.questionBank) ? out.questionBank.filter(q=>q&&q.industry&&Array.isArray(q.questions)&&q.questions.length)
      .slice(0,8).map(q=>({industry:clean(q.industry), questions:q.questions.filter(Boolean).slice(0,3)})) : [],
  };
}
/* Deterministic reading of how someone actually writes, from their own sent
   messages - length, question habit, formality, whether they open/close with
   a greeting - so the draft prompt can state these as measured facts instead
   of leaving the model to infer "sound like me" from a handful of raw
   examples alone. Pure and instant, no AI call, recomputed fresh from
   whatever styleSamples already holds - never persisted, since it's cheap
   enough to just derive at draft time. */
function styleFingerprint(samples){
  if(!samples || samples.length<4) return null;
  const clean1 = s=>clean(s);
  const words = samples.map(s=>clean1(s).split(/\s+/).filter(Boolean).length);
  const avgWords = Math.round(words.reduce((a,b)=>a+b,0)/words.length);
  const pct = test => Math.round(samples.filter(s=>test(clean1(s))).length/samples.length*100);
  return {
    sampleCount: samples.length,
    avgWords,
    questionPct: pct(s=>/\?/.test(s)),
    exclaimPct: pct(s=>/!/.test(s)),
    contractionPct: pct(s=>/\b(don't|i'm|it's|that's|you're|we're|can't|won't|didn't|isn't)\b/i.test(s)),
    opensWithGreetingPct: pct(s=>/^(hi|hey|hello)\b/i.test(s)),
    signsOffPct: pct(s=>/\b(thanks|best|cheers|regards)[,!.]?\s*$/i.test(s)),
  };
}
function styleFingerprintLine(fp){
  if(!fp) return '';
  return [
    `averages about ${fp.avgWords} words`,
    fp.questionPct>=40 ? 'often asks a direct question' : fp.questionPct<=10 ? 'rarely asks questions, mostly states things' : 'sometimes asks a question',
    fp.contractionPct>=50 ? 'writes casually, with contractions' : fp.contractionPct<=15 ? 'writes formally, few contractions' : 'a mix of formal and casual',
    fp.opensWithGreetingPct>=50 ? 'usually opens with a greeting like "Hi"' : 'usually skips a greeting and goes straight into it',
    fp.signsOffPct>=40 ? 'usually signs off with something like "Thanks" or "Best"' : 'usually ends without a formal sign-off',
  ].join('; ');
}
/* LinkedIn's own Profile.csv export carries no public-profile-URL column for
   the account holder - only headline/location/industry/summary - which is
   why the account's own photo was never fetched anywhere the "other people"
   Avatar/hover pipeline already handles it. messages.csv's SENDER PROFILE URL
   on the account holder's own sent rows is the reliable source - parsed once
   at archive import into identity.profileUrl (see messageGraph/readArchive) -
   and covers anyone who has ever sent a LinkedIn message, not just people
   whose resume happens to mention the URL in plain text. The regex against
   resumeText is only a fallback for an account with a resume but no message
   archive. Null when neither source has it - the Avatar simply falls back to
   initials, same as any other missing field. */
function selfProfileUrl(kb){
  const k = kb||{};
  if(k.identity && k.identity.profileUrl) return k.identity.profileUrl;
  const m = String(k.resumeText||'').match(/https?:\/\/(?:www\.)?linkedin\.com\/in\/[a-zA-Z0-9\-_%]+/i);
  return m ? m[0].replace(/\/+$/,'') : null;
}
/* One box for everything Explore/Ask can answer, instead of a person
   deciding themselves whether they want the search screen or the question
   drawer - a distinction the product has never actually needed a user to
   make. Cheap, local, no AI call, because classifying which of two already-
   built engines should answer a query should not cost an Assist or a round
   trip before either one even starts working.

   Deliberately conservative: the two real engines underneath (Explore's
   local-plus-LinkedIn search, and Ask's digest-based Q&A) are both good at
   what they do and were not rewritten to build this - this only decides
   which one a given sentence goes to. A wrong guess between those two costs
   nothing; both read the same network, they just answer differently. The
   one bucket worth splitting off first is a question about your OWN
   activity ("who have I forgotten") - Explore's search would silently
   return nothing for that, since it's not describing a person to find. */
function classifyAsk(text){
  const s = clean(text).toLowerCase();
  if(!s) return {type:'search'};
  if(/\b(event|conference|summit|meetup|meet-?up|workshop|webinar|near me|this week|this month|happening)\b/.test(s))
    return {type:'event'};
  /* A question about the user's own pipeline, not a description of someone
     to find - "who should I follow up with" has no company/role/location to
     search on, it is asking Mighty to look at what is already saved. */
  if(/^(who|what|which|how)\b/.test(s) && /\b(i|i've|ive|my|me)\b/.test(s)) return {type:'question'};
  if(s.endsWith('?') && /\b(i|my|me)\b/.test(s)) return {type:'question'};
  return {type:'search'};
}
function localKeywords(sentence, st){
  const stop = /\b(find|show|me|people|person|who|that|which|are|is|a|an|the|and|or|of|in|at|to|for|with|from|working|works|based|i|want|meet|looking|like|some)\b/gi;
  let s = clean(sentence).replace(stop,' ').replace(/\s+/g,' ').trim();
  if(!s) s = [(st.targetRoles||[])[0], (st.targetCompanies||[])[0], (st.targetLocations||[])[0]].filter(Boolean).join(' ');
  return s.slice(0,180);
}
async function toKeywords(sb, sentence, st){
  const home = (st.targetLocations||[])[0] || st.homeLocation;
  const near = /\bnear me\b/i.test(sentence) && home ? clean(sentence).replace(/\bnear me\b/i, home) : clean(sentence);
  try{
    const out = await llm(sb, 'tagging',
      'You turn a sentence describing people someone wants to meet into a short keyword query for a LinkedIn profile search. Output ONLY the keywords, space separated, no punctuation, no explanation, no quotes. Keep job titles, companies, schools, industries and places. Drop filler words. Maximum 12 words.',
      near, 60);
    const k = clean(out).replace(/^["']|["']$/g,'').replace(/\s+/g,' ');
    return k || localKeywords(near, st);
  }catch(e){ return localKeywords(near, st); }
}
/* One match ladder across the whole product - app, extension panel and
   marketing all say the same three things. Keep in sync with
   mightyMatchLabel() in extension/scoring.js. */
const VERDICT = {
  excellent:{label:'Strong fit for your goal', dot:'#5B4FE9'},
  strong:   {label:'Good fit',    dot:'#2E8B5F'},
  potential:{label:'Worth a look', dot:'#E3A23C'},
  low:      {label:'Outside your goal',   dot:'#B4B1BC'},
};
const VERDICT_KEYS = ['excellent','strong','potential','low'];
async function evaluate(sb, people, st){
  /* Deterministic, not AI-inferred: does the user already know people at this
     candidate's company (decodedCompanyIndex, computed once at archive
     import). Handed to the model as a fact per candidate so its "common"
     reasoning is grounded in something real instead of guessing from a
     headline alone, and also returned untouched on each result so the UI can
     show it even when the model doesn't mention it. */
  const companyIndex = st.knowledge && st.knowledge.decoded
    && st.knowledge.decoded.chapters && st.knowledge.decoded.chapters.companyIndex;
  const overlaps = people.map(p => p.company ? companyOverlap(companyIndex, p.company) : null);
  const list = people.map((p,i)=>{
    const ov = overlaps[i];
    return `${i+1}. ${p.name} - ${p.title||'(no headline)'}${p.company?' - '+p.company:''}`
      + (ov ? ` [you already know ${ov.count} ${ov.count===1?'person':'people'} there]` : '');
  }).join('\n');
  const out = await llmJSON(sb, 'profile_briefing',
    'You help a professional decide who is worth building a relationship with. For each candidate, judge relevance to THEIR stated goal and explain it in plain language. Never output a numeric score. Ground every claim only in the given headline text (and the bracketed fact when present) - if nothing supports a claim, do not make it. Be honest: never inflate a weak fit, and when nothing about someone matches the goal, say so outright rather than implying promise that is not there. Common ground must be real overlap: literal (same company, school, city) or domain-level (a genuinely comparable industry to the sender\'s own career history, e.g. both fintech, both pharma - reasoned from their actual background, not restated titles); "both in tech" alone is not common ground. Never use em dashes; write a spaced hyphen instead.',
    `The person doing the networking:\n${strategyBrief(st)}\n\nCandidates:\n${list}\n\nReturn JSON exactly like {"matches":[{"n":1,"verdict":"excellent"|"strong"|"potential"|"low","why":"one or two sentences, starts with the reason, no score","common":["short shared-ground phrase"]}]}. Use "excellent" only when they match the goal squarely, "strong" for a clear fit, "potential" when the connection is real but loose, and "low" when nothing about them lines up with the goal. Include every candidate by its number n. "common" may be empty.`,
    1500);
  const byN = {};
  (out.matches||[]).forEach(m=>{ if(m && m.n) byN[Number(m.n)]=m; });
  return people.map((p,i)=>{
    const m = byN[i+1]||{};
    const raw = String(m.verdict||'').toLowerCase();
    const v = VERDICT_KEYS.indexOf(raw)>=0 ? raw : 'potential';
    return {...p, verdict:v, why:clean(m.why), common:Array.isArray(m.common)?m.common.filter(Boolean).slice(0,4):[], warmIntro:overlaps[i]};
  });
}

/* ===================== The Knowledge Base, on screen =====================
   Everything Mighty holds about the user, in the place where they can correct
   it. Two things earn their space here.

   First, it is auditable. "Where did Mighty learn that" has an answer, and the
   answer is a row you can look at and change.

   Second, and rarer: it states what it does NOT know. That is close to free to
   build and almost nobody ships it, and it is the difference between a product
   that gets corrected and one that gets quietly distrusted. */
function yearOf(s){
  const m = String(s||'').match(/(\d{4})/);
  return m ? parseInt(m[1],10) : null;
}

/* One color per employer/school, cycled in order of first appearance, reused
   for both its pills and its legend dot - the only way to tell two
   same-width pills apart once the label itself is too clipped to read. */
const TIMELINE_PALETTE = ['#5B4FE9','#C75B33','#2E8B57','#B9862F','#3E7CB1','#8A4FA6','#4A9B8E','#B0507A'];
function KbTimeline({positions, education}){
  const rows = [
    ...(positions||[]).map((p,i)=>({key:'p'+i, kind:'role', title:p.title||'Role', co:p.company||'', from:p.from, to:p.to})),
    ...(education||[]).map((e,i)=>({key:'e'+i, kind:'edu', title:e.degree||'Education', co:e.school||'', from:e.from, to:e.to})),
  ].map(r=>({...r, fy:yearOf(r.from), ty: r.to ? (yearOf(r.to)||new Date().getFullYear()) : new Date().getFullYear()}))
   .filter(r=>r.fy).sort((a,b)=>a.fy-b.fy);
  if(!rows.length) return null;
  const minY = Math.min(...rows.map(r=>r.fy));
  const maxY = Math.max(new Date().getFullYear(), ...rows.map(r=>r.ty));
  const span = Math.max(1, maxY-minY);
  const pct = y => Math.min(100, Math.max(0, ((y-minY)/span)*100));

  const colorOf = (()=>{ const map={}; let n=0;
    return (name)=>{ const k=name||'—'; if(!(k in map)){ map[k]=TIMELINE_PALETTE[n%TIMELINE_PALETTE.length]; n++; } return map[k]; };
  })();

  /* Two roles that overlap in time cannot share one lane without their pills
     colliding - greedily push each into the first lane whose last pill has
     already ended, opening a new lane only when every existing one is still
     occupied. Ordinary non-overlapping careers stay on a single lane. */
  const laneEnds = [];
  const placed = rows.map(r=>{
    const startPct = pct(r.fy), widthPct = Math.min(100-startPct, Math.max(9, pct(r.ty)-pct(r.fy)));
    let lane = laneEnds.findIndex(end=>startPct >= end);
    if(lane===-1){ lane = laneEnds.length; laneEnds.push(0); }
    laneEnds[lane] = startPct+widthPct+2;
    return {...r, startPct, widthPct, lane, color:colorOf(r.co)};
  });
  const laneCount = Math.max(1, ...placed.map(r=>r.lane+1));
  const rowH = 24;

  const step = Math.max(1, Math.round(span/5));
  const gridYears = []; for(let y=minY; y<maxY; y+=step) gridYears.push(y);
  if(gridYears.length && maxY-gridYears[gridYears.length-1] < step/2) gridYears.pop();
  gridYears.push(maxY);

  const legend = []; const seen = new Set();
  placed.forEach(r=>{ if(!seen.has(r.co)){ seen.add(r.co); legend.push({name:r.co||'—', color:r.color, kind:r.kind}); } });

  return (
    <div>
      <div className="row" style={{gap:10,flexWrap:'wrap',alignItems:'baseline'}}>
        <span className="eyebrow b">The career as read</span>
        <span className="meta">{(positions||[]).length} role{(positions||[]).length===1?'':'s'}, {(education||[]).length} school{(education||[]).length===1?'':'s'}</span>
      </div>
      <div style={{marginTop:12,position:'relative',height:laneCount*rowH+2}}>
        {placed.map(r=>{
          const tip = [r.title,r.co].filter(Boolean).join(', ')+' · '+(r.from||'?')+' - '+(r.to||'now');
          return (
            <div key={r.key} title={tip} style={{position:'absolute',left:r.startPct+'%',
              width:r.widthPct+'%', top:r.lane*rowH, height:19, borderRadius:5,
              boxSizing:'border-box',display:'flex',alignItems:'center',padding:'0 8px',
              fontSize:10.5,fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',
              background: r.kind==='edu' ? 'transparent' : r.color+'1f',
              border: r.kind==='edu' ? '1.5px dashed '+r.color : '1px solid '+r.color+'55',
              color:r.color}}>
              {r.title}
            </div>);
        })}
      </div>
      <div style={{position:'relative',height:14,marginTop:4}}>
        {gridYears.map(y=>(
          <span key={y} style={{position:'absolute',left:pct(y)+'%',fontSize:10.5,color:'var(--mute)',
            transform: y===minY?'none':(y===maxY?'translateX(-100%)':'translateX(-50%)')}}>{y}</span>))}
      </div>
      <div style={{display:'flex',flexWrap:'wrap',rowGap:10,columnGap:16,marginTop:12}}>
        {legend.map((l,i)=>(
          <div key={i} className="row" style={{gap:7,alignItems:'center'}}>
            <CompanyLogo name={l.name} size={18} color={l.color}/>
            <span className="meta">{l.name}</span>
          </div>))}
      </div>
    </div>
  );
}

function KnowledgeBase({settings, onEdit, go}){
  const kb = settings.knowledge || {};
  const has = !!(kb.positions||[]).length || !!(kb.education||[]).length || !!kb.resumeText;
  const msg = kb.messages || null;
  const hasArchive = !!(kb.positions||[]).length || !!(kb.education||[]).length;
  const hasResume  = !!clean(kb.resumeText||'');
  const hasMail    = !!(kb.mail && kb.mail.messagesRead);
  /* settings.goal is the free-text elaboration, not the goal itself - picking
     a goal type (what onboarding's Goal step actually requires) can leave
     that sentence blank, which read as "Goal: Not set yet" here even while
     Today and every other surface showed "RAISE INVESTMENT" front and
     center. hasIntent below is the same check the app already uses to decide
     whether onboarding has ever been completed at all. */
  const hasIntent = !!settings.goalType || !!(settings.goalTypes||[]).length;
  const hasGoal    = hasIntent || !!clean(settings.goal||'');
  const completion = Math.round(([hasArchive,hasMail,hasResume,hasGoal].filter(Boolean).length/4)*100);
  /* The four real inputs, each on its own schedule - a LinkedIn export from
     a week ago and a resume from six months ago are not equally fresh, so
     they get their own dates instead of one "read 4 days ago" covering
     both. "Correct this" used to be the only door back in, and it opened
     onto the whole five-step wizard even to fix one thing; each source now
     jumps straight to its own step (see OB). */
  const sources = [
    {label:'LinkedIn export', done:hasArchive,
      status: hasArchive ? 'Read '+ago(kb.capturedAt) : 'Not added yet',
      cta: hasArchive?'Update':'Add', onClick:()=>onEdit(OB.linkedin)},
    {label:'Email history', done:hasMail,
      status: hasMail
        ? (kb.mail.twoWayCount||0).toLocaleString() + ' real contacts, read ' + ago(kb.mail.capturedAt)
        : 'Not added yet',
      cta: hasMail?'Update':'Add', onClick:()=>onEdit(OB.email)},
    {label:'Resume', done:hasResume,
      status: hasResume ? 'Read '+ago(kb.resumeUpdatedAt||kb.capturedAt) : 'Not added yet',
      cta: hasResume?'Update':'Add', onClick:()=>onEdit(OB.resume)},
    {label:'Goal', done:hasGoal,
      status: hasGoal ? goalLine(settings).slice(0,64) : 'Not set yet',
      cta: hasGoal?'Update':'Set', onClick:()=>go && go({screen:'you', tab:'goal'})},
  ];

  return (
    <div className="fade">
      <div className="card" style={{marginTop:26,padding:'22px 26px'}}>
        <div className="row" style={{justifyContent:'space-between',alignItems:'baseline',gap:14,flexWrap:'wrap'}}>
          <div className="h4">Setup {completion}% complete</div>
        </div>
        <div style={{height:8,borderRadius:999,background:'var(--line2)',marginTop:12,overflow:'hidden'}}>
          <div style={{height:'100%',width:completion+'%',background:'var(--brand)',borderRadius:999}}/>
        </div>
        <div className="stack" style={{gap:0,marginTop:16}}>
          {sources.map((s,i)=>(
            <div key={s.label} className="row" style={{justifyContent:'space-between',alignItems:'center',gap:14,
              padding:'14px 0',borderTop: i>0 ? '1px solid var(--line2)' : 'none'}}>
              <div className="row" style={{gap:11,alignItems:'center',minWidth:0}}>
                <span className="dot" style={{background:s.done?'var(--green)':'var(--line)',flex:'none'}}/>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:14.5,fontWeight:700}}>{s.label}</div>
                  <div className="sub" style={{fontSize:13,marginTop:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.status}</div>
                </div>
              </div>
              <button className="btn g sm" style={{flex:'none'}} onClick={s.onClick}>{s.cta}</button>
            </div>))}
        </div>
      </div>

      {has && <F>
        {((kb.positions||[]).length>0 || (kb.education||[]).length>0) &&
          <div className="card" style={{marginTop:16,padding:'20px 24px 18px'}}>
            <KbTimeline positions={kb.positions} education={kb.education}/>
          </div>}

        {msg && msg.identified===false && msg.received>0 &&
          <div className="hint" style={{marginTop:14}}>
            Your messages were read, but your name could not be matched to the sender, so no writing samples
            were kept. Better than storing someone else's words as yours.
          </div>}
      </F>}
    </div>
  );
}

/* ===================== Today ===================== */
/* Actions are derived from real relationship data. Nothing is invented - if
   there is nothing real to do, Today says so and points at Discover. */
function buildPlan(people, events, tasks){
  const byLog = {};
  events.forEach(e=>{ (byLog[e.log_id] = byLog[e.log_id]||[]).push(e); });
  const lastOf = (r, types)=>{
    const list = (byLog[r.id]||[]).filter(e=>!types || types.indexOf(e.event_type)>=0);
    return list.length ? list[list.length-1] : null;
  };
  const out = [];

  people.filter(r=>r.status==='replied').forEach(r=>{
    const reply = lastOf(r,['reply']);
    const mine  = lastOf(r,['first_message','note']);
    const stale = !mine || !reply || new Date(reply.occurred_at) > new Date(mine.occurred_at);
    if(stale) out.push({id:'reply-'+r.id, tone:'red', title:'Reply to '+(r.name||'them'),
      sub: reply ? 'They replied '+ago(reply.occurred_at)+'.' : 'They are waiting on you.',
      min:5, cta:'Reply', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  /* Capped like the brief- block below, so a long backlog in any one
     category cannot fill all 5 slots and crowd out the others - Today is
     meant to show a few things of different kinds, not the most numerous
     kind. */
  people.filter(r=>r.status==='ready_to_contact').slice(0,2).forEach(r=>{
    out.push({id:'send-'+r.id, tone:'amber',
      title:(r.ai_draft?'Send your first message to ':'Write to ')+(r.name||'them'),
      sub: r.ai_draft ? 'Draft is written and waiting for your review.' : 'You marked them ready. Mighty can draft it.',
      min: r.ai_draft?4:8, cta: r.ai_draft?'Review & send':'Draft it', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  /* Matches the "gone quiet" count buildSnapshot shows in Today's summary
     sentence and the "Follow up" cta nextAction() already uses elsewhere -
     without this, the summary could say "3 gone quiet" with zero matching
     cards below it. */
  people.filter(r=>r.status==='contacted' && days(r.contacted_at)>=10).slice(0,2).forEach(r=>{
    out.push({id:'quiet-'+r.id, tone:'amber', title:'Follow up with '+(r.name||'them'),
      sub:'You reached out '+(ago(r.contacted_at)||'a while ago')+' with nothing back yet.',
      min:5, cta:'Follow up', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  tasks.filter(t=>!t.done).forEach(t=>{
    const overdue = t.due_date && new Date(t.due_date).getTime() < Date.now()-DAY;
    const person = people.find(p=>p.id===t.log_id);
    out.push({id:'task-'+t.id, tone:overdue?'red':'amber', title:t.label,
      sub:(t.sub || (person? person.name : '')) + (t.due_date? (overdue?' · overdue':' · due '+dateShort(t.due_date)) : ''),
      min:5, cta:'Open', taskId:t.id,
      go: person ? {screen:'profile', id:person.id, tab:'notes'} : {screen:'relationships'}});
  });

  people.filter(r=>['coffee_chat','replied'].indexOf(r.status)>=0).forEach(r=>{
    const met = lastOf(r,['coffee_chat']);
    const note = lastOf(r,['note']);
    if(met && (!note || new Date(note.occurred_at) < new Date(met.occurred_at)) && days(met.occurred_at)<=5)
      out.push({id:'cap-'+r.id, tone:'green', title:'Capture your conversation with '+(r.name||'them'),
        sub:'You met '+ago(met.occurred_at)+' and nothing is written down yet.', min:5, cta:'Add notes',
        go:{screen:'profile', id:r.id, tab:'notes'}});
  });

  /* The 'quiet-' rule above only watches 'contacted' - a relationship that
     already got a reply, a coffee chat, or a referral and then had no event
     of any kind for three weeks goes cold in a way that rule never catches.
     Capped like every other rule here so a long backlog can't crowd out the
     rest of Today. Excludes anyone the 'cap-' rule above already covers this
     week (a fresh coffee chat isn't cold, it's just uncaptured yet). */
  /* 'offer' belongs here too - it was omitted, which meant the one stage you
     least want going silent was the only active stage this rule ignored. */
  people.filter(r=>['replied','coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).slice(0,2).forEach(r=>{
    const last = lastOf(r);
    const lastAt = (last && last.occurred_at) || r.updated_at || r.shortlisted_at;
    if(lastAt && days(lastAt)>=21)
      out.push({id:'cold-'+r.id, tone:'amber', title:(r.name||'They')+' is going quiet',
        sub:'Nothing since '+ago(lastAt)+'. A short nudge keeps the thread alive.',
        min:5, cta:'Follow up', go:{screen:'profile', id:r.id, tab:'draft'}});
  });

  people.filter(r=>r.status==='prospect' && !(r.briefing&&r.briefing.careerSummary)).slice(0,2).forEach(r=>{
    out.push({id:'brief-'+r.id, tone:'purple', title:'Understand '+(r.name||'them')+' before you reach out',
      sub:(r.context&&r.context.whySaved) ? r.context.whySaved.slice(0,90) : 'Saved '+(ago(r.shortlisted_at)||'recently')+'. No brief yet.',
      min:6, cta:'Prepare me', go:{screen:'profile', id:r.id, tab:'brief'}});
  });

  const rank = {red:0, amber:1, green:2, purple:3, grey:4};
  out.sort((a,b)=>(rank[a.tone]-rank[b.tone]));
  const plan = out.slice(0,5);
  if(plan.length<5) plan.push({id:'discover', tone:'grey', title:'Find one person worth knowing',
    sub:'Five good people beat fifty saved profiles.', min:3, cta:'Find someone', go:{screen:'relationships'}});
  return plan;
}
/* The single sentence under the greeting - built from the exact literal
   templates buildPlan itself writes (title/sub), so this is string surgery
   on text this same file already produced, not free-floating fabrication.
   Never invents a fact buildPlan did not already compute. */
function heroLine(t, peopleLen){
  if(!t) return peopleLen>0 ? "Nothing urgent right now. A good day to find someone new."
    : "Nothing real to act on yet. Save someone and this fills in.";
  if(t.id.startsWith('reply-')){
    const name = t.title.replace(/^Reply to /,'');
    const when = t.sub.replace('They replied ','').replace(/\.$/,'');
    return name+' replied '+when+". Momentum is back, don't let it stall.";
  }
  if(t.id.startsWith('send-')){
    const name = t.title.replace(/^(Send your first message to |Write to )/,'');
    return t.cta==='Review & send' ? name+"'s draft is ready. Sending it keeps things moving."
      : 'Time to reach out to '+name+'.';
  }
  if(t.id.startsWith('quiet-')){
    const name = t.title.replace(/^Follow up with /,'');
    return name+' has gone quiet. A short nudge beats losing the thread.';
  }
  if(t.id.startsWith('cap-')){
    const name = t.title.replace(/^Capture your conversation with /,'');
    return 'You met '+name+' recently. Write it down before it fades.';
  }
  if(t.id.startsWith('brief-')){
    const name = t.title.replace(/ before you reach out$/,'').replace(/^Understand /,'');
    return name+' is saved and ready for a closer look before you reach out.';
  }
  if(t.id.startsWith('task-')) return t.title+'.';
  return "Five good people beat fifty saved profiles - worth a look today.";
}
const HERO_VERB = {Reply:'Reply now', 'Review & send':'Review & send', 'Draft it':'Draft it',
  'Follow up':'Follow up', 'Add notes':'Add notes', 'Prepare me':'Prepare me',
  'Find someone':'Find someone', 'Open':'Open'};
/* Only a real signal earns HIGH IMPACT - urgent by tone, or a draft that is
   already written and one click from sending. Everything else is GOOD NEXT,
   never invented per-item drama the underlying data cannot back. */
const isHighImpact = (t)=> t.tone==='red' || t.cta==='Review & send';

/* Real counts, not a fabricated "68% there" - see GoalFunnel's own note on
   why. This is the compact, goal-specific version for Today: identified,
   waiting-on-you, and a weekly meeting target with a dot tracker. The Goal
   tab shows the fuller stage-by-stage funnel instead. */
function GoalStrip({people, events, settings}){
  if(!canSee('progress', people)) return null;
  const byLog = {};
  events.forEach(e=>{ (byLog[e.log_id]=byLog[e.log_id]||[]).push(e); });
  const f = goalFunnel(people);
  const waiting = people.filter(r=>needsReply(r, byLog)).length;
  const target = settings.weeklyMeetingTarget || 3;
  const metThisWeek = events.filter(e=>e.event_type==='stage_change' &&
    ['coffee_chat','referral','interview','offer'].indexOf((e.extracted||{}).to)>=0 && days(e.occurred_at)<=7).length;
  const metCapped = Math.min(metThisWeek, target);
  return (
    <div className="card" style={{padding:'18px 22px',display:'flex',justifyContent:'space-between',
      alignItems:'center',gap:16,flexWrap:'wrap'}}>
      <div>
        <div className="eyebrow b">Toward</div>
        <div style={{fontSize:15.5,fontWeight:800,marginTop:3,lineHeight:1.3,letterSpacing:'-.01em'}}>{goalLine(settings)}</div>
        <div className="sub" style={{fontSize:13.5,marginTop:6}}>
          {f.saved} identified · {waiting} replied, waiting on you · {metCapped} of {target} meetings
        </div>
      </div>
      <div style={{textAlign:'right'}}>
        <div style={{fontSize:14,fontWeight:700,color:'#C75B33'}}>Need {target} meetings this week</div>
        <div className="row" style={{gap:6,marginTop:8,justifyContent:'flex-end'}}>
          {Array.from({length:target}).map((_,i)=>(
            <span key={i} style={{width:13,height:13,borderRadius:999,boxSizing:'border-box',
              border:'2px solid '+(i<metCapped?'var(--brand)':'var(--line)'),
              background:i<metCapped?'var(--brand)':'transparent'}}/>))}
        </div>
      </div>
    </div>
  );
}

/* Both maps route through the same tokens the rest of the app repainted for
   Prism in one pass, rather than a second independent set of hex that could
   drift from it - a literal '#C75B33' here would have been exactly the kind
   of hardcoded escape that went invisible-on-dark everywhere else it showed
   up before this file got audited for it. */
const TONE = {red:'var(--red)', amber:'var(--amber)', green:'var(--green)', purple:'var(--brand-ink)', grey:'var(--mute)'};
/* A flat card with only a small colored dot reads as one undifferentiated
   list - the dot is easy to miss entirely at a glance. A soft wash of the same
   tone across the whole card makes urgency visible before you've read a word. */
const TONE_BG = {red:'var(--red-soft)', amber:'var(--amber-soft)', green:'var(--green-soft)', purple:'var(--brand-soft)', grey:'var(--card2)'};

/* Does r need a reply from the user right now? Same test buildPlan uses for
   its 'reply-' item: the last thing that happened was them, not us. */
function needsReply(r, byLog){
  if(r.status!=='replied') return false;
  const list = byLog[r.id]||[];
  const reply = list.filter(e=>e.event_type==='reply').slice(-1)[0];
  const mine  = list.filter(e=>e.event_type==='first_message'||e.event_type==='note').slice(-1)[0];
  return !mine || !reply || new Date(reply.occurred_at) > new Date(mine.occurred_at);
}

/* What an executive gets in the morning: a few sentences that vary with what
   is actually true today, not a fixed panel of numbers repeated forever.
   Every clause here is a real count, and a clause is dropped entirely rather
   than shown at zero - that is the whole difference between this and a
   dashboard. No bar, no percentage, no score: see docs on the product's one
   hard rule. */
function buildSnapshot(people, events, tasks, settings, plan){
  const byLog = {};
  events.forEach(e=>{ (byLog[e.log_id] = byLog[e.log_id]||[]).push(e); });
  const added = people.length;
  const contactedOrBeyond = people.filter(r=>REACHED.includes(r.status)).length;
  const talking = people.filter(r=>['replied','coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length;
  const met = people.filter(r=>['coffee_chat','referral','interview','offer'].indexOf(r.status)>=0).length;
  const waiting = people.filter(r=>needsReply(r, byLog)).length;
  const quiet = people.filter(r=>r.status==='contacted' && days(r.contacted_at)>=10).length;

  const cap = PLAN_CAPS[(plan)||'trial'] || 50;
  const nearCap = added >= cap*0.8;

  const prev = settings.todaySnapshot;
  const prevAgeDays = prev && prev.at ? Math.floor((Date.now()-new Date(prev.at).getTime())/DAY) : null;
  let delta = null;
  if(prev && prevAgeDays!=null && prevAgeDays>=6){
    const addedSince = added - (prev.added||0);
    const metSince = met - (prev.met||0);
    const bits = [];
    if(addedSince>0) bits.push(addedSince+' new since last week');
    if(metSince>0) bits.push(metSince+' met since then');
    if(bits.length) delta = bits.join(', ');
  }
  const shouldResnapshot = !prev || prevAgeDays==null || prevAgeDays>=6;

  return {added, contactedOrBeyond, talking, met, waiting, quiet, nearCap, cap, delta, shouldResnapshot};
}

function Today({people, events, tasks, settings, email, go, onToggleTask, doneToday, onSaveSettings, plan:aiPlan,
  pendingActivity, onResolveActivity}){
  const plan = useMemo(()=>buildPlan(people, events, tasks), [people, events, tasks]);
  /* preferredName is read here but nothing anywhere ever sets it - this
     always fell through to guessing a name from the email's local part,
     which reads fine for "jane.smith@..." but produces exactly the kind of
     nonsense "Rmohans" turned into for an initial-plus-surname handle.
     The LinkedIn archive's real first name is honest, captured data and
     should be tried before guessing from an email address at all. */
  const name = firstName((settings.knowledge||{}).identity?.firstName || settings.preferredName || '')
    || firstName((email||'').split('@')[0].replace(/[._]/g,' '));
  const nextMeeting = useMemo(()=>{
    const t = tasks.filter(x=>!x.done && x.due_date && new Date(x.due_date).getTime()>=Date.now()-DAY)
      .sort((a,b)=>new Date(a.due_date)-new Date(b.due_date));
    return t[0]||null;
  },[tasks]);
  const allDone = plan.length===1 && plan[0].id==='discover' && people.length>0;

  const snap = useMemo(()=>buildSnapshot(people, events, tasks, settings, aiPlan), [people, events, tasks, settings, aiPlan]);
  useEffect(()=>{
    if(!snap.shouldResnapshot || !onSaveSettings) return;
    onSaveSettings({todaySnapshot:{at:new Date().toISOString(), added:snap.added, met:snap.met}});
    // eslint-disable-next-line
  },[snap.shouldResnapshot, snap.added, snap.met]);

  /* These used to just be the plan's own task titles restated - "Reply to
     Mridul Arora" appearing as both a chip above and a card below said
     nothing twice. A chip should suggest something to ask that the cards
     don't already say, so these are phrased as real questions, grounded in
     the same plan data (never generic/canned), leading with one
     goal-oriented prompt and following with per-person ones drawn from
     today's actual names. */
  const askPrompts = useMemo(()=>{
    const named = plan.filter(t=>t.go && t.go.screen==='profile' && t.go.id).map(t=>{
      const person = people.find(p=>p.id===t.go.id);
      const first = person ? firstName(person.name||'') : '';
      if(!first) return null;
      if(t.cta==='Reply') return 'Draft my reply to '+first;
      if(t.cta==='Prepare me') return 'Prep me for '+first;
      if(t.cta==='Draft it' || t.cta==='Review & send') return 'Draft my note to '+first;
      if(t.cta==='Follow up') return 'Draft a follow-up to '+first;
      return 'Tell me about '+first;
    }).filter(Boolean);
    const seen = new Set();
    const uniq = named.filter(p=>{ const k=p.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
    return ['Who should I talk to first?', ...uniq].slice(0,3);
  },[plan, people]);

  const hero = plan[0] && plan[0].id!=='discover' ? plan[0] : null;

  return (
    <div className="fade">
      {/* DESIGN.md "Light Leaks": a large, soft radial wash of the spectral

      <div style={{padding:'40px 48px 30px',position:'relative',overflow:'hidden',

        <div aria-hidden="true" style={{position:'absolute',top:-220,left:-80,width:640,height:460,
          borderRadius:'50%',background:'radial-gradient(circle,rgba(160,120,255,.16),transparent 70%)',

        <div aria-hidden="true" style={{position:'absolute',top:-160,right:-40,width:520,height:400,

        <div style={{maxWidth:1280,position:'relative'}}>
          <h1 className="h1" style={{fontSize:'clamp(28px,3.4vw,36px)'}}>{greetWord()}{name?', '+name.charAt(0).toUpperCase()+name.slice(1):''}.</h1>
          <div style={{marginTop:6,fontSize:'clamp(18px,2.3vw,24px)',fontWeight:700,letterSpacing:'-.02em',color:'var(--sub)',lineHeight:1.35}}>

          {hero &&
