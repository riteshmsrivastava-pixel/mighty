/* One honest description per stage transition, since the from/to pair is
   all a stage_change event actually carries - no invented narrative, just
   the plain reason each transition happens in this product. Shared by the
   Timeline screen and the person profile's own History tab, so the same
   transition reads the same explanation in both places. */
const STAGE_WHY = {
  contacted: 'Marked as reached out.', replied: 'Stage updated after the recorded reply.',
  ready_to_contact: 'Marked ready to reach out', coffee_chat: 'Logged after you met',
  do_not_contact: 'Closed out', prospect: 'Saved',
};
function Relationships({sb, settings, people, events, tasks, view, setView, plan, onSave, onOpen, onStage, onDelete, onUpdate, go, onOpenCapacity}){
  const boardOK = canSee('board', people, events);
  const timeOK  = canSee('timeline', people, events);
  const [dragId,setDrag] = useState(null);
  const [overCol,setOver] = useState(null);
  /* List's select/delete - a Set so toggling one row's checkbox never has to
     rebuild an array, and membership checks (is this row selected) stay O(1)
     while the list re-renders on every keystroke of the search box above. */
  const [selected,setSelected] = useState(()=>new Set());
  const toggleSelect = (id)=>setSelected(s=>{ const n=new Set(s); if(n.has(id)) n.delete(id); else n.add(id); return n; });
  const [importing,setImporting] = useState(false);

  /* ---- the search box: filters who is saved, and finds who is not ---- */
  const [q,setQ]           = useState('');
  const [total,setTotal]   = useState(null);
  const [sugg,setSugg]     = useState(null);
  const [suggBusy,setSB]   = useState(true);
  const [mine,setMine]     = useState(null);
  const [mineBusy,setMB]   = useState(false);
  /* One box, three destinations - see classifyAsk(). Settled on the same
     380ms debounce the local-network match already waits on below, so
     typing "who" while working toward "who should I follow up with" does
     not flash into question-mode and back on every keystroke. */
  const [intent,setIntent] = useState({type:'search'});
  /* A Set, not a single value - saving is a shared state across every row
     on screen (worth-adding + web search results can both be visible at
     once), and one scalar meant starting a second save cleared the first
     row's in-flight flag early, re-enabling its Add button mid-request. */
  const [savingUrls,setSavingUrls] = useState(()=>new Set());
  const startSaving = (url)=>setSavingUrls(s=>new Set(s).add(url));
  const stopSaving = (url)=>setSavingUrls(s=>{ const n=new Set(s); n.delete(url); return n; });

  /* ---- LinkedIn, the fallback for someone not in the user's own network ---- */
  const [webOpen,setWebOpen] = useState(false);
  const [webQ,setWebQ]     = useState('');
  const [phase,setPhase]   = useState('idle');
  const [results,setRes]   = useState([]);
  const [webErr,setWebErr] = useState(null);
  const [notice,setNote]   = useState(null);
  const [skipped,setSkip]  = useState({});
  /* Events reuses the same "phase" shape as the LinkedIn search above -
     idle/searching/done - but its own state, since it is a genuinely
     different result type (a web link, not a person) with its own render. */
  const [eventPhase,setEventPhase] = useState('idle');
  const [eventResults,setEventRes] = useState([]);
  const [eventErr,setEventErr]     = useState(null);
  const [eventQ,setEventQ]         = useState('');
  /* {profileUrl, kind:'save'|'skip', rowId} of whichever row is currently
     showing its optional reason chips - one at a time is plenty, and it
     collapses to null (no prompt shown) the moment a choice is made or
     dismissed. */
  const [reasonPrompt,setReasonPrompt] = useState(null);
  function finishSkip(profileUrl, reasonId){
    if(reasonId) track('candidate_skipped', {reason:reasonId});
    setSkip(s=>({...s,[profileUrl]:true}));
    setReasonPrompt(null);
  }
  async function finishSaveReason(row, reasonId){
    if(row && reasonId){
      try{ await onUpdate(row, {context:{...(row.context||{}), saveReason:reasonId}}); }catch(e){}
      track('save_reason_picked', {reason:reasonId});
    }
    setReasonPrompt(null);
  }
  const [lastQuery,setLastQ] = useState('');
  const [noExt,setNoExt]   = useState(false);

  const savedUrls = useMemo(()=>{
    const m = {}; people.forEach(r=>{ if(r.profile_url) m[r.profile_url.toLowerCase()]=r; }); return m;
  },[people]);
  const cap = PLAN_CAPS[plan||'trial'] || 50;
  const atCap = people.length >= cap;
  const terms = useMemo(()=>goalTerms(settings),[settings]);
  const ownCos = useMemo(()=>ownCompanies(settings),[settings]);
  const byLog = useMemo(()=>{
    const m = {}; events.forEach(e=>{ (m[e.log_id]=m[e.log_id]||[]).push(e); }); return m;
  },[events]);

  /* The ranking loads on arrival, because a screen that asks you to press a
     button before it shows you anything has not answered its own question. */
  useEffect(()=>{
    let dead = false;
    (async()=>{
      setSB(true);
      try{
        const {data:n} = await sb.rpc('connections_count');
        if(!dead) setTotal(Number(n||0));
        const rows = await matchConnections(sb, terms, ownCos, 8);
        if(!dead){ setSugg(rows); track('discover_ranked', {returned:rows.length, terms:terms.length}); }
      }catch(e){ if(!dead) setSugg([]); }
      if(!dead) setSB(false);
    })();
    return ()=>{ dead = true; };
  },[sb, terms.join(' '), ownCos.join(' ')]);

  /* Typing searches the user's own connections as they go, debounced so every
     keystroke does not round-trip. */
  useEffect(()=>{
    const sentence = clean(q);
    if(sentence.length<2){ setMine(null); setIntent({type:'search'}); return; }
    let dead = false; setMB(true);
    const t = setTimeout(async()=>{
      const cl = classifyAsk(sentence);
      if(!dead) setIntent({...cl, text:sentence});
      /* A question or an event query is not a person to look up - Ask has its
         own network read, and event search has no local-match story yet, so
         neither one needs (or should trigger) this lookup. */
      if(cl.type!=='search'){ if(!dead){ setMine(null); setMB(false); } return; }
      try{
        const qt = queryTerms(sentence);
        const rows = await matchConnections(sb, qt, [], 8);
        if(!dead){
          setMine({q:sentence, terms:qt, rows}); track('discover_own_search', {terms:qt.length, results:rows.length});
          /* The LinkedIn export this table is built from has no photo column
             at all, so every connection starts as initials - not just the
             ones surfaced by a search. Same fill-in as the wider search
             results below: one profile read per person, through the
             extension's own globally-throttled queue (3s apart, capped at
             25/session), patched in as each resolves. */
          rows.forEach(c=>{
            extBridge.photo(c.profile_url).then(r=>{
              if(dead || !r || !r.ok || !r.dataUrl) return;
              setMine(prev=>prev && prev.q===sentence
                ? {...prev, rows:prev.rows.map(x=>x.profile_url===c.profile_url?{...x, avatar_url:r.dataUrl}:x)}
                : prev);
            }).catch(()=>{});
          });
        }
      }catch(e){ if(!dead) setMine({q:sentence, terms:[], rows:[]}); }
      if(!dead) setMB(false);
    }, 380);
    return ()=>{ dead = true; clearTimeout(t); };
  },[q, sb]);

  /* "Who do I already know" and "who don't I know yet" used to be two
     separate questions - the second only ran if you noticed a button and
     clicked it again. They are one question with two answers, so once the
     sentence settles, both run. A longer pause than the local match above
     (900ms vs 380ms) keeps a sentence that is still being typed from firing
     three overlapping Google searches. autoRun tracks the exact sentence
     already sent, so re-settling on an unchanged query does not search
     twice, and so an explicit click on "Search LinkedIn for this" is not
     redone by this effect a moment later. */
  const autoRun = useRef('');
  useEffect(()=>{
    const sentence = clean(q);
    if(sentence.length<3) return;
    /* A question or an event query never reaches LinkedIn - see classifyAsk.
       Ask has its own network read; event search has nothing to search yet. */
    if(classifyAsk(sentence).type!=='search') return;
    const t = setTimeout(()=>{
      if(autoRun.current===sentence) return;
      if(phase==='searching' || phase==='thinking') return;
      autoRun.current = sentence;
      run(sentence);
    }, 900);
    return ()=>clearTimeout(t);
  },[q]);

  /* Mirrors the LinkedIn autoRun above exactly - same 900ms settle, same
     "don't refire on the identical sentence" guard - for the other kind of
     thing this one box can mean: not a person, a place worth being in. */
  const autoRunEvent = useRef('');
  useEffect(()=>{
    const sentence = clean(q);
    if(sentence.length<3) return;
    if(classifyAsk(sentence).type!=='event') return;
    const t = setTimeout(()=>{
      if(autoRunEvent.current===sentence) return;
      if(eventPhase==='searching') return;
      autoRunEvent.current = sentence;
      runEvents(sentence);
    }, 900);
    return ()=>clearTimeout(t);
  },[q]);

  async function runEvents(text){
    const sentence = clean(text);
    if(!sentence || eventPhase==='searching') return;
    setEventErr(null); setEventRes([]); setEventQ(sentence); setEventPhase('searching');
    try{
      const home = (settings.targetLocations||[])[0] || settings.homeLocation;
      const base = /\bnear me\b/i.test(sentence) && home ? sentence.replace(/\bnear me\b/i, home) : sentence;
      /* A bare "events" or "events near me" carries no topic at all, so
         Google falls back to its own generic sense of "event" - ticketed
         sports and entertainment, not anything relevant to what this
         account is actually networking toward (confirmed live: "events
         near me" alone surfaced Ticketmaster and WWE-adjacent wrestling
         tickets). Only append a goal qualifier when the sentence is still
         just the bare trigger words classifyAsk matched on - a sentence
         that already names a real topic ("AI conference in Boston") is
         specific enough on its own, and diluting it with goal terms would
         only hurt. */
      const BARE = /^(events?|conferences?|meetups?|meet-?ups?|workshops?|webinars?|near me|this week|this month|happening)$/i;
      const meaningful = base.split(/\s+/).filter(w=>w && !BARE.test(w.replace(/[.,!?]+$/,'')));
      const goalQuery = (types, roles)=>{
        const label = (types||[]).map(t=>GOAL_LABEL[t]).filter(Boolean).join(' ');
        const qualifier = [label, (roles||[])[0]||''].filter(Boolean).join(' ');
        return qualifier ? base+' '+qualifier : null;
      };
      /* One search per goal, not one search stuffed with every goal's terms
         at once - confirmed live that a single primary-only qualifier
         starved out a real secondary goal entirely ("events near me" for an
         account with Find a new job + Raise investment came back HR/hiring
         events only, nothing about funding). Each goal gets its own query
         and its own slice of the results; running them in parallel keeps
         this no slower than the single-query version was. */
      let queries = [base];
      if(meaningful.length<=2){
        const extras = secondaryGoals(settings);
        const qs = [goalQuery(goalTypeList(settings), settings.targetRoles), ...extras.map(g=>goalQuery(g.types, g.targetRoles))].filter(Boolean);
        if(qs.length) queries = qs;
      }
      const batches = await Promise.all(queries.slice(0,3).map(q=>extBridge.eventSearch(q)));
      if(batches.every(b=>!b || !b.ok)){
        const r = batches[0];
        if(r && r.error==='blocked') setEventErr('Search is rate limited right now. Try again in a few minutes.');
        else if(r && r.error==='no_extension') setEventErr('Event search needs the Mighty extension installed - it reads the results page the same way LinkedIn search does.');
        else setEventErr('Could not search for events right now.');
        setEventPhase('idle'); return;
      }
      const lists = batches.filter(b=>b && b.ok).map(b=>b.results||[]);
      const seen = new Set(), merged = [];
      for(let i=0; merged.length<12 && lists.some(l=>i<l.length); i++){
        for(const l of lists){ const item=l[i]; if(item && !seen.has(item.url)){ seen.add(item.url); merged.push(item); } }
      }
      setEventRes(merged);
      track('event_search_run', {results:merged.length, queries:queries.length});
    }catch(e){ setEventErr(e.message||'Could not search for events right now.'); }
    setEventPhase('idle');
  }

  async function run(text){
    const sentence = clean(text!=null?text:webQ);
    if(!sentence || phase==='searching' || phase==='thinking') return;
    setWebErr(null); setNote(null); setNoExt(false); setRes([]); setSkip({});
    setPhase('searching'); setLastQ(sentence); setWebQ(sentence); setWebOpen(true);
    try{
      const kw = await toKeywords(sb, sentence, settings);

      /* Ask the extension first. It reads the results page itself, so it comes
         back with location, education, experience and follower counts - the API
         path returns a title and a link and nothing else. Fall back to the edge
         function when the extension is not installed, or - just as often now -
         when it IS installed but found nothing: Google hides every profile link
         behind an opaque /goto?url=<token> redirector these days, which the
         extension's HTML scrape cannot resolve into a real URL, so a genuine
         search comes back ok:true with zero people and no error at all. That
         is indistinguishable from "nothing matched" unless it is also retried
         against the API path below, which reads Google's official Custom
         Search API instead of scraped HTML and is unaffected. */
      let found = [], via = 'ext';
      /* extBridge.search's own timeout is 25s - worth paying only when the
         extension has actually announced itself. Otherwise it is a known
         no-op, and waiting it out just leaves "Searching LinkedIn…" on
         screen for 25 seconds before the API fallback below ever gets a
         turn (see C34 in the copy review). */
      const bridged = extBridge.isReady() ? await extBridge.search(kw) : null;
      if(bridged && bridged.ok && (bridged.people||[]).length){
        found = (bridged.people||[]).filter(p=>p && p.profileUrl);
      } else if(bridged && bridged.error==='blocked'){
        track('search_blocked', {});
        setWebErr('Search is rate limited right now, so results would be incomplete. Try again in a few minutes.');
        setPhase('idle'); return;
      } else {
        const {data, error} = await sb.functions.invoke('people-search', {body:{query:kw}});
        if(error) throw error;
        if(!data || data.ok===false){
          if(data && data.error==='not_configured') setNoExt(true);
          else setWebErr((data && (data.message||data.error)) || 'LinkedIn search could not finish. Try again.');
          setPhase('idle'); return;
        }
        found = (data.people||[]).filter(p=>p && p.profileUrl);
        via = 'api';
      }
      track('search_run', {via, results:found.length,
        with_facts: found.filter(p=>p.location||p.education).length});

      if(!found.length){
        setNote('Nothing for that one. A role and a place works best: "product leaders in Boston" beats "smart people in AI".');
        setPhase('idle'); return;
      }
      setRes(found); setPhase('thinking');
      try{ setRes(await evaluate(sb, found, settings)); }
      catch(e){ setNote('Found these, but Mighty could not explain the matches just now: '+(e.message||'AI unavailable')+'.'); }
      setPhase('done');

      /* Google never returns a photo for a site:linkedin.com/in query - only
         a name and a link - so every fresh result starts as initials. Filling
         them in means reading each profile once, which is exactly what the
         extension's photo fetch already exists for. It is fired here for the
         whole batch, but it queues through the extension's own single global
         chain (fetchProfilePhotoInner in background.js), so this is still one
         photo every 3 seconds and still capped at 25 for the session - the
         same guard that already protects the Profile page's manual button,
         just aimed at a batch instead of one click at a time. Started only
         after evaluate() above has already settled results, so an early
         photo cannot be wiped out by evaluate()'s own setRes(...) landing
         later. Best-effort and silent: a slow or missing photo just stays
         initials, never an error the person has to see. */
      found.forEach(person=>{
        extBridge.photo(person.profileUrl).then(r=>{
          if(r && r.ok && r.dataUrl){
            setRes(prev=>prev.map(x=>x.profileUrl===person.profileUrl?{...x, avatarUrl:r.dataUrl}:x));
          }
        }).catch(()=>{});
      });
    }catch(e){ setWebErr('LinkedIn search could not finish. Try again.'); setPhase('idle'); }
  }

  const visible = results.filter(r=>!skipped[r.profileUrl]);
  const webBusy = phase==='searching' || phase==='thinking';

  /* One row, used by the search results and the ranking, so a person you
     found and a person Mighty suggested cannot drift apart visually. */
  function ConnRow({c}){
    const saved = savedUrls[(c.profile_url||'').toLowerCase()];
    const reason = connReason(c);
    return (
      <div className="row" style={{alignItems:'flex-start',gap:13,padding:'14px 0',borderBottom:'1px solid var(--line2)'}}>
        <Avatar name={connName(c)} size={34} src={c.avatar_url} hover={c}/>
        <div style={{flex:'1 1 200px',minWidth:0}}>
          <div style={{fontSize:15,fontWeight:700}}>{connName(c)}</div>
          <div className="sub" style={{fontSize:13.5,marginTop:1}}>
            {[clean(c.position), clean(c.company)].filter(Boolean).join(' · ') || 'No role on the export'}
          </div>
          {reason &&
            <div style={{marginTop:6}}>
              <div className="eyebrow" style={{fontSize:11}}>Why shown</div>
              <div style={{fontSize:13,color:'var(--brand-ink)',marginTop:2,lineHeight:1.5}}>{reason}</div>
            </div>}
        </div>
        <div style={{display:'flex',gap:8,flex:'none',alignItems:'center'}}>
          {saved
            ? <button className="btn g sm" onClick={()=>onOpen(saved.id)}>Open</button>
            : <F>
                <button className="btn sm" disabled={atCap || savingUrls.has(c.profile_url)}
                  onClick={async()=>{ startSaving(c.profile_url); try{ await onSave(connToPerson(c), null, 'own_network'); }finally{ stopSaving(c.profile_url); } }}>
                  {savingUrls.has(c.profile_url) ? <span><span className="spin"/> Saving</span> : 'Save to Mighty'}
                </button>
                <button className="btn q" style={{fontSize:13}}
                  onClick={()=>setSugg(s=>(s||[]).filter(x=>x.profile_url!==c.profile_url))}>Skip</button>
              </F>}
        </div>
      </div>
    );
  }

  /* One row for someone already saved, used by every stage group below. Reply
     needed is the one case that gets a warmer background - the whole point of
     grouping is that this row should never be mistaken for a quiet one. */
  function Row({r, hot}){
    const label = nextAction(r);
    const statusOnly = label==='Waiting on them' || label==='Keep in touch' || label===' - ';
    const checked = selected.has(r.id);
    return (
      <div onClick={()=>onOpen(r.id)} className="lift"
        style={{display:'flex',alignItems:'center',gap:16,padding:'15px 24px',
          borderBottom:'1px solid var(--line2)',cursor:'pointer',
          background: checked ? 'var(--brand-soft)' : (hot ? 'var(--red-soft)' : 'none')}}>
        <input type="checkbox" checked={checked} onClick={e=>e.stopPropagation()}
          onChange={()=>toggleSelect(r.id)} style={{flex:'none',width:16,height:16,cursor:'pointer'}}/>
        <Avatar name={r.name} size={34} src={r.avatar_url} hover={r}/>
        <div style={{flex:'1 1 220px',minWidth:0}}>
          <div className="row" style={{gap:7}}>
            <div style={{fontSize:15.5,fontWeight:700,letterSpacing:'-.01em',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{listName(r.name)||'Unnamed'}</div>
            <ConnectedBadge r={r} size="sm"/>
          </div>
          <div style={{fontSize:13,color:'var(--mute)',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.title||(r.context||{}).whySaved||'Saved profile'}</div>
        </div>
        <div className="meta" style={{flex:'none'}}>{ago(r.updated_at||r.shortlisted_at)}</div>
        <span style={{fontSize:12.5,fontWeight:700,flex:'none',borderRadius:999,whiteSpace:'nowrap',
          padding: statusOnly ? '5px 12px' : '6px 13px',
          /* Only a row that actually needs a reply from you gets the loud
             solid fill - that's the one true urgency signal in this list.
             Everything else was getting the same solid violet regardless of
             position, so thirty-six equally loud rows drowned out the one
             red one they were supposed to set off. */
          color: statusOnly ? 'var(--mute)' : (hot ? '#fff' : 'var(--brand-ink)'),
          background: statusOnly ? 'var(--line2)' : (hot ? '#C75B33' : 'var(--brand-soft2)')}}>{label}</span>
      </div>);
  }

  const searching = clean(q).length>=2;
  const needle = clean(q).toLowerCase();
  const filtered = useMemo(()=>{
    if(!searching) return people;
    return people.filter(r=>[r.name,r.title,r.company].filter(Boolean).join(' ').toLowerCase().indexOf(needle)>=0);
  },[people, searching, needle]);

  /* Three tiers, not six stage-groups: one single top recommendation (the
     same ranking Today's hero uses), everyone who needs a reply from you
     right now, and everything else in one flat list. A person appears in
     exactly one tier - top pick first, then reply-needed, then the rest -
     so nobody is counted twice. */
  const todayPlan = useMemo(()=>buildPlan(people, events, tasks||[]), [people, events, tasks]);
  const topPick = todayPlan[0] && todayPlan[0].id!=='discover' ? todayPlan[0] : null;
  const topPickId = topPick && topPick.go && topPick.go.screen==='profile' ? topPick.go.id : null;
  const closed = filtered.filter(r=>r.status==='do_not_contact').length;
  const replyRows = filtered.filter(r=>r.status!=='do_not_contact' && r.id!==topPickId && needsReply(r, byLog));
  const restRows  = filtered.filter(r=>r.status!=='do_not_contact' && r.id!==topPickId && !needsReply(r, byLog));

  const nameOf = (id)=>{ const p=people.find(x=>x.id===id); return p?(p.name||'Unnamed'):' - '; };
  const personOf = (id)=>people.find(x=>x.id===id)||null;

  const sameDay = (a,b)=> a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const dateGroupLabel = (iso)=>{
    const d = new Date(iso), now = new Date();
    const y = new Date(now); y.setDate(now.getDate()-1);
    const long = d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
    if(sameDay(d,now)) return 'TODAY · '+long.toUpperCase();
    if(sameDay(d,y)) return 'YESTERDAY · '+long.toUpperCase();
    return long.toUpperCase();
  };
  /* hour12 forced explicitly - without it, toLocaleTimeString's 12-vs-24-hour
     choice follows the viewer's browser locale rather than a deliberate
     design decision, so the same row read "2:48 PM" for one visitor and
     "14:48" for another. */
  const timeOfDay = (iso)=> new Date(iso).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',hour12:true});

  /* The feed merges two kinds of history: real outreach_events, and a
     synthetic "saved" entry per day - shortlisted_at is real data, it just
     never got written to outreach_events, so it is grouped here at display
     time rather than invented. */
  const rawFeed = useMemo(()=>{
    /* Same merge as the person History tab: a reply and the stage_change it
       automatically triggers land seconds apart and describe one action, so
       the timeline shows one compact entry with the stage change folded in
       as a secondary detail rather than two rows. */
    const mergedStageOf = (e)=> e.event_type==='reply' && events.find(o=>o.log_id===e.log_id
      && o.event_type==='stage_change' && o.extracted && o.extracted.to==='replied'
      && Math.abs(new Date(o.occurred_at)-new Date(e.occurred_at))<60000);
    const evItems = events.filter(e=>{
      if(e.event_type!=='stage_change' || !e.extracted || e.extracted.to!=='replied') return true;
      return !events.some(o=>o.log_id===e.log_id && o.event_type==='reply'
        && Math.abs(new Date(o.occurred_at)-new Date(e.occurred_at))<60000);
    }).map(e=>({
      id:'e'+e.id, kind: e.event_type==='stage_change' ? 'stage_change' : e.event_type,
      occurred_at:e.occurred_at, personId:e.log_id, extracted:e.extracted, note:e.note,
      stageNote: mergedStageOf(e) ? 'Stage updated after the recorded reply.' : null,
    }));
    const byDay = {};
    people.forEach(r=>{
      if(!r.shortlisted_at) return;
      const key = new Date(r.shortlisted_at).toDateString();
      (byDay[key]=byDay[key]||[]).push(r);
    });
    const savedItems = Object.keys(byDay).map(key=>{
      const rows = byDay[key];
      const latest = rows.reduce((a,r)=>new Date(r.shortlisted_at)>new Date(a.shortlisted_at)?r:a, rows[0]);
      return {id:'saved-'+key, kind:'saved', occurred_at:latest.shortlisted_at, people:rows};
    });
    return evItems.concat(savedItems).sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at)).slice(0,80);
  },[events, people]);

  const TIME_CATS = [
    {key:'all',   label:'All',            test:()=>true},
    {key:'stage', label:'Stage changes',  test:e=>e.kind==='stage_change'},
    {key:'reply', label:'Replies',        test:e=>e.kind==='reply'},
    {key:'note',  label:'Notes',          test:e=>e.kind==='note'},
    {key:'saved', label:'Saved',          test:e=>e.kind==='saved'},
  ].filter(c=>c.key==='all' || rawFeed.some(c.test));
  const [feedCat,setFeedCat] = useState('all');
  const activeCat = TIME_CATS.find(c=>c.key===feedCat) || TIME_CATS[0];
  const feed = rawFeed.filter(activeCat.test);

  const feedGroups = [];
  feed.forEach(item=>{
    const label = dateGroupLabel(item.occurred_at);
    let g = feedGroups.find(x=>x.label===label);
    if(!g){ g = {label, items:[]}; feedGroups.push(g); }
    g.items.push(item);
  });

  function feedEntry(item){
    if(item.kind==='saved'){
      const names = item.people.map(r=>firstName(r.name)||'Unnamed');
      const shown = names.length<=8 ? names : names.slice(0,7).concat(['+'+(names.length-7)+' more']);
      const label = item.people.length===1 ? 'You saved '+item.people[0].name
        : 'You saved '+item.people.length+' people';
      return {title:label,
        sub: shown.length>1 ? shown.slice(0,-1).join(', ')+' and '+shown.slice(-1) : shown[0],
        cta:'See list', onCta:()=>go({screen:'relationships', view:'list'})};
    }
    const person = personOf(item.personId);
    const name = person ? person.name||'Unnamed' : nameOf(item.personId);
    if(item.kind==='stage_change'){
      const to = item.extracted && item.extracted.to;
      return {title:name+' moved to '+((STAGE[to]||{label:to||''}).label),
        sub: STAGE_WHY[to] || 'Stage updated',
        cta:'Open profile', onCta:()=>person&&onOpen(person.id)};
    }
    if(item.kind==='reply')
      return {title:'Reply recorded · '+name, sub:item.stageNote || (person&&person.title) || 'They wrote back',
        cta:'Open profile', onCta:()=>person&&onOpen(person.id)};
    if(item.kind==='first_message')
      return {title:'You reached out to '+name, sub:item.note?item.note.slice(0,90):'Message sent',
        cta:'View message', onCta:()=>person&&onOpen(person.id,'draft')};
    if(item.kind==='note')
      return {title:'You captured notes on '+name, sub:item.note?item.note.slice(0,90):'',
        cta:'Open profile', onCta:()=>person&&onOpen(person.id,'notes')};
    return {title:(EVENT_LABEL[item.kind]||item.kind)+' · '+name, sub:item.note?item.note.slice(0,90):'',
      cta:'Open profile', onCta:()=>person&&onOpen(person.id)};
  }

  /* Everyone Mighty thinks is worth adding, ranked against the goal. Shared by
     the empty state and the bottom of the populated list, so a new user and a
     returning one see the same section in the same place. */
  const worthAdding = (
    <div style={{marginTop:22}}>
      <div className="eyebrow b">From your imported network</div>
      {suggBusy &&
        <div className="meta" style={{marginTop:16}}><span className="spin"/> Reading your history…</div>}
      {!suggBusy && sugg && sugg.length>0 &&
        <div className="card" style={{marginTop:14,padding:'6px 22px'}}>
          {sugg.map(c=><ConnRow key={c.profile_url} c={c}/>)}
        </div>}
      {!suggBusy && sugg && sugg.length===0 &&

  /* Pipeline (your saved people, however tracked) and Explore (finding
