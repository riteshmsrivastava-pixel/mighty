<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root{ --card:#FFFDF9; --line:#E7DECB; --card2:#FBF6EC; --ink:#2A2320; --sub:#73685B; --mute:#9A8E7E;
    --brand:#A31F34; --brand2:#8A1828; --green:#5F7A4E; --blue:#3A6B8A; --inp:#FCF8F0; }
  *{box-sizing:border-box;}
  body{ width:320px; margin:0; padding:0; font-family:-apple-system,system-ui,sans-serif; color:var(--ink);
    background:#EFE7D7; font-size:13px; }
  .wrap{ padding:14px; }
  .head{ display:flex; align-items:center; gap:9px; margin-bottom:12px; }
  .logo{ width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,#B83A30,#8A1828);color:#FFF6EC;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px; }
  .title{ font-weight:800; font-size:15px; } .title b{color:var(--brand);}
  .sub{ font-size:10.5px; color:var(--sub); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:13px; padding:11px; margin-bottom:10px; }
  button{ font-family:inherit; cursor:pointer; }
  .btn{ background:linear-gradient(150deg,#B83A30,#8A1828); color:#FFF6EC; border:1px solid var(--brand2);
    border-radius:9px; padding:8px 12px; font-weight:700; font-size:12.5px; width:100%; }
  .ghost{ background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; }
  .statrow{ display:flex; align-items:center; justify-content:space-between; }
  .kpi{ font-family:ui-monospace,monospace; font-weight:800; font-size:20px; }
  .dot{ width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px; }
  .ok{background:var(--green);} .warn{background:#C8703D;}
  label{ display:block; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); margin:8px 0 3px; }
  input{ width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--inp); font-size:12.5px; font-family:inherit; }
  .note{ font-size:10.5px; color:var(--sub); margin-top:6px; line-height:1.4; }
  .bluebox{ background:#E1EBF1;border:1px solid #C9DCE7;border-radius:9px;padding:8px 10px;font-size:10.5px;color:var(--blue);line-height:1.45;margin-bottom:8px; }
  a{ color:var(--blue); font-size:11px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">Mi</div>
    <div><div class="title"><b>MI</b>gh<b>T</b>y · Outreach</div><div class="sub">human-in-the-loop, always</div></div>
  </div>

  <div class="bluebox">This extension never clicks Connect/Message for you. It only reads pages you're already viewing and logs sends you make yourself.</div>

  <div class="card" id="statusCard">
    <div class="statrow"><span><span class="dot" id="statusDot"></span><span id="statusText">Not connected</span></span></div>
  </div>

  <div class="card" id="connectedCard" style="display:none;">
    <div class="statrow"><span>This week</span><span class="kpi" id="weekCount">–/–</span></div>
    <div class="note">Open your MIghTy web app (the URL you deployed it to) to shortlist, draft, and track.</div>
  </div>

  <details id="signinDetails">
    <summary style="cursor:pointer;font-weight:700;font-size:12.5px;">Sign in</summary>
    <div class="card" style="margin-top:8px;">
      <label>MIT email</label><input id="sbEmail" placeholder="kerberos@mit.edu"/>
      <label>Password</label><input id="sbPass" type="password" placeholder="••••••••"/>
      <button class="ghost" id="sbSignin" style="margin-top:9px;width:100%;">Sign in</button>
      <div class="note" id="sbStatus"></div>
    </div>
  </details>
</div>
<script src="popup.js"></script>
</body>
</html>
