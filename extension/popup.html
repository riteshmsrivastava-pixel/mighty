<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root{ --card:#FFFFFF; --line:rgba(29,27,38,.09); --card2:#FCFBFA; --ink:#1D1B26; --sub:#8A8896; --mute:#B4B1BC;
 --brand:#5B4FE9; --brand2:#4A3FD1; --green:#2E8B5F; --blue:#4A3FD1; --inp:#FCFBFA; }
  *{box-sizing:border-box;}
  body{ width:320px; margin:0; padding:0; font-family:'Instrument Sans',-apple-system,system-ui,sans-serif; color:var(--ink);
    background:#FBFAF8; font-size:14px; }
  .wrap{ padding:16px; }
  .head{ display:flex; align-items:center; gap:9px; margin-bottom:14px; }
  .logo{ width:26px;height:26px;flex:none;display:flex;align-items:center; }
  .title{ font-weight:600; font-size:16px; letter-spacing:-.02em; } .title b{color:inherit;font-weight:600;}
  .sub{ font-size:11px; color:var(--mute); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; }
  button{ font-family:inherit; cursor:pointer; }
  .btn{ background:var(--brand); color:#fff; border:none;
    border-radius:999px; padding:11px 14px; font-weight:500; font-size:14px; width:100%; }
  .btn:hover{ background:var(--brand2); }
  .ghost{ background:var(--card); color:var(--ink); border:1px solid rgba(27,26,31,.12); border-radius:999px; padding:9px 14px; font-size:13.5px; }
  .statrow{ display:flex; align-items:center; justify-content:space-between; }
  .kpi{ font-family:'Figtree',sans-serif; font-weight:600; font-size:22px; letter-spacing:-.03em; }
  .dot{ width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px; }
  .ok{background:var(--green);} .warn{background:#C08A5A;}
  label{ display:block; font-size:12px; font-weight:500; text-transform:none; letter-spacing:.02em; color:var(--mute); margin:10px 0 4px; }
  input{ width:100%; padding:10px 12px; border:1px solid rgba(27,26,31,.12); border-radius:12px; background:var(--inp); font-size:14px; font-family:inherit; }
  .note{ font-size:12px; color:var(--sub); margin-top:6px; line-height:1.5; }
  .bluebox{ background:#EFEDFD;border:1px solid rgba(29,27,38,.04);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--brand2);line-height:1.5;margin-bottom:8px; }
  a{ color:var(--brand); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="9.5" cy="13" r="7.5" fill="#5B4FE9"></circle><circle cx="16.5" cy="13" r="7.5" fill="#E87A56" fill-opacity="0.85"></circle></svg></div>
    <div><div class="title">Mighty · Outreach</div><div class="sub">human in the loop, always</div></div>
  </div>

  <div class="bluebox">Never clicks Connect or Message. Every send is your click.</div>

  <div class="card" id="statusCard">
    <div class="statrow"><span><span class="dot" id="statusDot"></span><span id="statusText">Not connected</span></span></div>
  </div>

  <div class="card" id="connectedCard" style="display:none;">
    <div class="statrow"><span>This week</span><span class="kpi" id="weekCount">–/–</span></div>
    <div class="note" id="planLine" style="display:none;margin-top:6px;font-weight:700;color:var(--brand);"></div>
    <div class="note" style="margin-top:6px;">Open Mighty to add people, draft, and track.</div>
    <button class="ghost" id="signOutBtn" style="margin-top:9px;width:100%;">Log off</button>
  </div>

  <details id="signinDetails">
    <summary style="cursor:pointer;font-weight:700;font-size:12.5px;">Sign in</summary>
    <div class="card" style="margin-top:8px;">
      <label>Email</label><input id="sbEmail" placeholder="you@work.com"/>
      <label>Password</label><input id="sbPass" type="password" placeholder="••••••••"/>
      <button class="ghost" id="sbSignin" style="margin-top:9px;width:100%;">Sign in</button>
      <div class="note" id="sbStatus"></div>
    </div>
  </details>
</div>
<script src="popup.js"></script>
</body>
</html>
