<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIghTy · study + survival agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --card:#FFFDF9; --card2:#FBF6EC; --line:#E7DECB; --line2:#EAE1CE; --grid:#F0E7D6; --inp:#FCF8F0; --seg:#EDE4D2; --chip:#F4EEE1;
  --ink:#2A2320; --sub:#73685B; --sub2:#8A7F72; --mute:#9A8E7E; --mute2:#A2978A;
  --brand:#A31F34; --brand2:#8A1828; --bsoft:#FBE6E2;
  --green:#5F7A4E; --green2:#4F6B3E; --gsoft:#E7EDDD;
  --terra:#C8703D; --terra2:#A05A26; --tsoft:#F2E7D4;
  --blue:#3A6B8A; --bluesoft:#E1EBF1;
  --fh:'Bricolage Grotesque',system-ui,sans-serif; --fb:'Hanken Grotesk',system-ui,sans-serif; --fm:'Space Mono',monospace;
  --shadow:0 2px 8px rgba(80,55,30,.06); --shadowL:0 12px 40px rgba(80,55,30,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--fb);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;
  background:radial-gradient(120% 90% at 100% 0%, #F3ECDC 0%, #EBE2D0 55%, #E7DDC9 100%);background-attachment:fixed;}
::selection{background:var(--brand);color:#fff;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D8CCB6;border-radius:99px;border:2px solid #EFE7D8;}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(12px,2.2vw,26px);}
h1,h2,h3{font-family:var(--fh);letter-spacing:-.015em;margin:0;}
.mono{font-family:var(--fm);}
button{font-family:var(--fb);cursor:pointer;}
input,textarea,select{font-family:var(--fb);color:var(--ink);}
textarea{resize:vertical;}

/* header */
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  padding:14px clamp(14px,2vw,22px);margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);}
.brandrow{display:flex;align-items:center;gap:13px;}
.logo{width:50px;height:50px;border-radius:15px;background:linear-gradient(150deg,#B83A30,#8A1828);display:flex;align-items:center;justify-content:center;
  font-family:var(--fh);font-weight:800;font-size:21px;color:#FFF6EC;box-shadow:0 4px 12px rgba(150,40,32,.32);}
.brand-name{font-family:var(--fh);font-weight:800;font-size:clamp(20px,2.6vw,26px);line-height:1;}
.brand-name b{color:var(--brand);}
.brand-sub{font-size:12px;color:var(--sub);margin-top:4px;}
.statusdot{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-weight:600;font-size:12px;}
.statusdot i{width:7px;height:7px;border-radius:50%;}
.st-ok{background:var(--gsoft);color:var(--green2);} .st-ok i{background:var(--green);box-shadow:0 0 0 3px rgba(95,122,78,.18);}
.st-warn{background:var(--tsoft);color:var(--terra2);} .st-warn i{background:var(--terra);box-shadow:0 0 0 3px rgba(200,112,61,.18);}

/* nav */
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.nav button{padding:9px 15px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--sub);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;}
.nav button:hover{background:var(--chip);color:var(--ink);}
.nav button.on{background:var(--card);color:var(--brand);border-color:var(--line);box-shadow:var(--shadow);}
.nav .em{font-size:15px;}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);}
.pad{padding:clamp(16px,2vw,24px);}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.ph h2{font-size:19px;} .ph .sub{font-size:12.5px;color:var(--sub);margin-top:3px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr;}}

/* controls */
label.fld{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 6px;}
.inp,textarea.inp,select.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--inp);font-size:14px;outline:none;}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--bsoft);}
textarea.inp{line-height:1.5;}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:11px 17px;border-radius:13px;border:1px solid var(--brand2);background:linear-gradient(150deg,#B83A30,#8A1828);color:#FFF6EC;font-weight:700;font-size:13.5px;box-shadow:0 3px 10px rgba(150,40,32,.22);}
.btn:hover{filter:brightness(1.05);} .btn:disabled{opacity:.5;cursor:not-allowed;filter:none;}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow);}
.btn.ghost:hover{background:#F8F2E6;}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:600;color:var(--sub);border:1px solid var(--line2);}
.chip.pick{cursor:pointer;} .chip.pick.on{background:var(--bsoft);color:var(--brand2);border-color:#F0CFC9;}
.tag{font-family:var(--fm);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute2);}

.kpi{background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:15px 16px;}
.kpi .k{font-family:var(--fm);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute2);margin-bottom:7px;}
.kpi .v{font-family:var(--fh);font-weight:800;font-size:30px;line-height:1;}
.kpi .v small{font-size:13px;color:var(--mute2);font-weight:600;font-family:var(--fb);}
.kpi .d{font-size:12px;color:var(--sub);margin-top:6px;}

.empty{text-align:center;padding:34px 18px;color:var(--mute);}
.empty .big{font-size:30px;margin-bottom:8px;}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;max-height:52vh;overflow:auto;padding:4px;}
.msg{max-width:88%;padding:12px 15px;border-radius:16px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;}
.msg.ai{align-self:flex-start;background:var(--card2);border:1px solid var(--line2);border-bottom-left-radius:5px;}
.msg.me{align-self:flex-end;background:var(--bsoft);border:1px solid #F0CFC9;border-bottom-right-radius:5px;color:#5A211D;}
.msg .who{font-family:var(--fm);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute2);margin-bottom:5px;}
.typing{display:inline-flex;gap:4px;align-items:center;}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:bl 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
@keyframes bl{0%,60%,100%{opacity:.25;}30%{opacity:1;}}

.grade{background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:15px;margin-top:6px;}
.scorebar{height:8px;border-radius:99px;background:var(--seg);overflow:hidden;margin:8px 0;}
.scorebar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C8703D,#5F7A4E);}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:10px;}
.dim{font-size:12.5px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;}
.dim b{font-family:var(--fm);color:var(--ink);}

.list{display:flex;flex-direction:column;gap:9px;}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--card2);}
.row .grow{flex:1;min-width:0;}
.row .t{font-weight:700;font-size:14px;}
.row .m{font-size:12px;color:var(--sub);margin-top:2px;}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 9px;font-size:12px;color:var(--sub);}
.iconbtn:hover{background:#F8F2E6;color:var(--ink);}
.bar{height:7px;border-radius:99px;background:var(--seg);overflow:hidden;}
.bar i{display:block;height:100%;}
.divider{height:1px;background:var(--line2);margin:16px 0;}
.note{font-size:12px;color:var(--sub);line-height:1.5;}
.warnbox{background:var(--tsoft);border:1px solid #E7C9A8;border-radius:13px;padding:12px 14px;font-size:12.5px;color:var(--terra2);line-height:1.5;}
.okbox{background:var(--gsoft);border:1px solid #C9D8B6;border-radius:13px;padding:12px 14px;font-size:12.5px;color:var(--green2);line-height:1.5;}
.foot{text-align:center;font-size:11.5px;color:var(--mute2);margin:22px 0 8px;line-height:1.6;}
a{color:var(--brand2);}
.seg{display:inline-flex;background:var(--seg);border-radius:11px;padding:3px;gap:3px;}
.seg button{border:none;background:transparent;padding:7px 13px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--sub);}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
  // Use the classic JSX runtime (React.createElement) — the automatic runtime emits
  // `import {jsx} from "react/jsx-runtime"`, which fails without a bundler/module loader.
  Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] });
</script>
<script type="text/babel" data-presets="react-classic">
const {useState,useEffect,useRef,useMemo} = React;

/* ============================ persistence ============================ */
const DB_KEY = 'mighty_v1';
const DEFAULT = {
  readings: [],
  cc: { sessions: [] },           // cold-call / simulator sessions
  quiz: { sessions: [], weak: {} },
  planner: { tasks: [] },
  opt: {},                         // F-1/OPT dates
  settings: { apiKey:'', model:'claude-sonnet-4-6' },
};
function loadDB(){
  try{ const s = JSON.parse(localStorage.getItem(DB_KEY)); if(s&&typeof s==='object') return {...DEFAULT,...s,
    cc:{...DEFAULT.cc,...(s.cc||{})}, quiz:{...DEFAULT.quiz,...(s.quiz||{})},
    planner:{...DEFAULT.planner,...(s.planner||{})}, settings:{...DEFAULT.settings,...(s.settings||{})}}; }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
const uid = () => Math.random().toString(36).slice(2,10);
const now = () => Date.now();
const fmtDate = ts => new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const daysBetween = (a,b) => Math.round((b-a)/864e5);

/* ============================ LLM layer ============================ */
// One file, two runtimes: Claude artifact (window.claude.complete) OR direct Anthropic API (BYO key).
const inArtifact = () => typeof window!=='undefined' && window.claude && typeof window.claude.complete==='function';
function llmMode(settings){
  if(inArtifact()) return 'artifact';
  if(settings && settings.apiKey) return 'api';
  return 'none';
}
async function llm(settings, system, user, maxTokens=1400){
  const mode = llmMode(settings);
  if(mode==='artifact'){
    const prompt = `${system}\n\n———\n${user}`;
    return await window.claude.complete(prompt);
  }
  if(mode==='api'){
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{ 'content-type':'application/json','x-api-key':settings.apiKey,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model: settings.model||'claude-sonnet-4-6', max_tokens:maxTokens, system,
        messages:[{role:'user',content:user}] })
    });
    if(!res.ok){ const t=await res.text(); throw new Error(`API ${res.status}: ${t.slice(0,300)}`); }
    const data = await res.json();
    return (data.content||[]).map(c=>c.text||'').join('');
  }
  throw new Error('No Claude connection. Open Settings and add your Anthropic API key, or run this file as a Claude artifact.');
}
function extractJSON(text){
  if(!text) throw new Error('Empty response');
  // strip code fences and grab the outermost object
  let t = text.replace(/```json/gi,'```').trim();
  const f = t.indexOf('```'); if(f>=0){ const e=t.indexOf('```',f+3); if(e>f) t=t.slice(f+3,e).trim(); }
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<a) throw new Error('No JSON found in response');
  return JSON.parse(t.slice(a,b+1));
}
async function llmJSON(settings, system, user, maxTokens=1600){
  const raw = await llm(settings, system+'\n\nRespond with ONLY valid minified JSON, no prose, no code fences.', user, maxTokens);
  return extractJSON(raw);
}

/* ============================ personas ============================ */
const PERSONAS = {
  professor: { emoji:'🎓', label:'Professor cold-call',
    desc:'Sloan-style cold call. Answer in a tight, speakable 3–4 sentences. Escalating follow-ups.',
    sys:(ctx)=>`You are a demanding but fair MIT Sloan professor running a Socratic cold call${ctx.subject?` in ${ctx.subject}`:''}. Reference the assigned reading. Ask ONE pointed question at a time. Expect a calibrated, speakable 3–4 sentence answer — not an essay. After each answer escalate: probe an assumption, push on a tradeoff, or apply it to a new situation. Be concise and a little intimidating, never cruel.`,
    rubric:'clarity, structure (claim→because→therefore), use of the reading/evidence, and concision/speakability (says it in ~3–4 sentences out loud)' },
  negotiation: { emoji:'🤝', label:'Negotiation counterpart',
    desc:'Salary, term sheets, equity, vendor deals. They push; you make moves; it critiques.',
    sys:(ctx)=>`You are a sharp negotiation counterpart in a role-play (${ctx.subject||'a salary / deal negotiation'}). Hold a firm but realistic position with hidden interests. Respond in character to the user's moves and occasionally make offers or apply pressure. Map to Power & Negotiation concepts (BATNA, anchoring, ZOPA, value creation vs claiming).`,
    rubric:'anchoring & framing, use of BATNA/leverage, value creation vs pure claiming, and composure/clarity under pressure' },
  behavioral: { emoji:'💼', label:'Behavioral interview',
    desc:'Mock interview tuned to a job lane. STAR stories, follow-ups, feedback.',
    sys:(ctx)=>`You are an experienced interviewer running a behavioral interview${ctx.subject?` for: ${ctx.subject}`:''}. Ask one behavioral question at a time and probe for specifics (situation, the user's actual actions, measurable results). Push politely when answers are vague or take undue credit.`,
    rubric:'STAR structure, specificity & ownership, measurable impact, and concision' },
  case: { emoji:'📊', label:'Case interview (MBB)',
    desc:'Timed MBB-style case. Structure, math, recommendation.',
    sys:(ctx)=>`You are an MBB consulting interviewer running a case${ctx.subject?` on: ${ctx.subject}`:''}. Present a business problem, then guide through it: expect the user to structure it (a clean framework), drive the analysis, do back-of-envelope math, and end with a crisp recommendation. Give data only when asked. Keep it moving.`,
    rubric:'structure (MECE), quantitative reasoning, business judgment, and synthesis/recommendation' },
};

/* ============================ tiny UI atoms ============================ */
function Dots(){ return <span className="typing"><i></i><i></i><i></i></span>; }
function Stat({k,v,sub,d}){ return <div className="kpi"><div className="k">{k}</div><div className="v">{v}{sub&&<small> {sub}</small>}</div>{d&&<div className="d">{d}</div>}</div>; }

/* ============================ App shell ============================ */
function App(){
  const [db,setDb] = useState(loadDB);
  const [tab,setTab] = useState('home');
  useEffect(()=>{ localStorage.setItem(DB_KEY, JSON.stringify(db)); },[db]);
  // helper: shallow-merge a slice
  const patch = (slice, val) => setDb(d=>({...d, [slice]: typeof val==='function'? val(d[slice]) : {...d[slice],...val}}));
  const mode = llmMode(db.settings);

  const TABS = [
    ['home','🏠','Home'],['library','📚','Library'],['sim','🎯','Simulator'],
    ['tutor','🧑‍🏫','Tutor'],['quiz','🃏','Quiz'],['planner','🗓️','Planner'],
    ['opt','🛂','OPT Clock'],['settings','⚙️','Settings'],
  ];

  return <div className="wrap">
    <div className="head">
      <div className="brandrow">
        <div className="logo">Mi</div>
        <div>
          <div className="brand-name"><b>MI</b>gh<b>T</b>y</div>
          <div className="brand-sub">study + survival agent · Sloan Fellows · v0</div>
        </div>
      </div>
      {mode==='none'
        ? <button className="statusdot st-warn" onClick={()=>setTab('settings')}><i></i>No Claude connection — set up</button>
        : <span className="statusdot st-ok"><i></i>{mode==='artifact'?'Claude artifact':'API connected'}</span>}
    </div>

    <div className="nav">
      {TABS.map(([id,em,lb])=>
        <button key={id} className={tab===id?'on':''} onClick={()=>setTab(id)}><span className="em">{em}</span>{lb}</button>)}
    </div>

    {tab==='home' && <Home db={db} setTab={setTab}/>}
    {tab==='library' && <Library db={db} patch={patch}/>}
    {tab==='sim' && <Simulator db={db} patch={patch} setTab={setTab}/>}
    {tab==='tutor' && <Tutor db={db}/>}
    {tab==='quiz' && <Quiz db={db} patch={patch} setTab={setTab}/>}
    {tab==='planner' && <Planner db={db} patch={patch}/>}
    {tab==='opt' && <OPT db={db} patch={patch}/>}
    {tab==='settings' && <Settings db={db} patch={patch}/>}

    <div className="foot">
      MIghTy v0 · no MIT login, no Canvas, no backend — only what you upload lives here, in this browser.<br/>
      Not affiliated with or endorsed by MIT. Visa/immigration items track dates only — for guidance see the ISO.
    </div>
  </div>;
}

/* ============================ Home ============================ */
function Home({db,setTab}){
  const ccDone = db.cc.sessions.length;
  const avg = ccDone ? Math.round(db.cc.sessions.reduce((s,x)=>s+(x.avgScore||0),0)/ccDone) : null;
  const weak = Object.entries(db.quiz.weak).map(([t,v])=>({t,...v}))
    .filter(w=>w.missed>0).sort((a,b)=>(b.missed/b.seen)-(a.missed/a.seen)).slice(0,4);
  const opt = db.opt.eadEnd ? daysBetween(now(), new Date(db.opt.eadEnd).getTime()) : null;
  const open = db.planner.tasks.filter(t=>!t.done);
  const nextTask = open.filter(t=>t.due).sort((a,b)=>new Date(a.due)-new Date(b.due))[0];

  return <div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div className="grid3">
      <Stat k="Cold-call reps" v={ccDone} d={avg!=null?`avg ${avg}/100`:'run your first sim →'}/>
      <Stat k="Readings in library" v={db.readings.length} d={db.readings.length?'tutor · quiz · cold-call ready':'upload one to start'}/>
      <Stat k="OPT runway" v={opt!=null?opt:'—'} sub={opt!=null?'days':''} d={opt!=null?'until EAD end':'set dates in OPT Clock'}/>
    </div>

    <div className="grid2">
      <div className="panel pad">
        <div className="ph"><div><h2>Start here</h2><div className="sub">The v0 core — fully offline-from-MIT, runs on your uploads.</div></div></div>
        <div className="list">
          <Quick em="🎯" t="Cold-call simulator" m="Get called on. 3–4 sentence answers, escalating follow-ups." on={()=>setTab('sim')}/>
          <Quick em="📚" t="Add a reading or case" m="Paste the text — everything else draws from your library." on={()=>setTab('library')}/>
          <Quick em="🧑‍🏫" t="Concept tutor" m="Socratic or direct, grounded in a reading." on={()=>setTab('tutor')}/>
          <Quick em="🃏" t="Self-quiz" m="Auto-generated questions with weak-spot tracking." on={()=>setTab('quiz')}/>
        </div>
      </div>
      <div className="panel pad">
        <div className="ph"><div><h2>Your radar</h2><div className="sub">What needs attention.</div></div></div>
        {nextTask && <div className="row" style={{marginBottom:9}}>
          <div className="grow"><div className="t">Next due · {nextTask.title}</div>
            <div className="m">{fmtDate(new Date(nextTask.due).getTime())} · weight {nextTask.weight||'—'}</div></div>
          <button className="iconbtn" onClick={()=>setTab('planner')}>open</button></div>}
        {weak.length>0 ? <>
          <div className="tag" style={{marginBottom:8}}>Weak spots (from quizzes)</div>
          <div className="list">{weak.map(w=><div key={w.t} className="row">
            <div className="grow"><div className="t">{w.t}</div>
              <div className="bar" style={{marginTop:6}}><i style={{width:`${Math.round(100*w.missed/w.seen)}%`,background:'var(--terra)'}}></i></div></div>
            <span className="tag">{w.missed}/{w.seen} missed</span></div>)}</div>
        </> : !nextTask && <div className="empty"><div className="big">🧭</div>No signals yet. Run a sim or a quiz and this fills in.</div>}
      </div>
    </div>
  </div>;
}
function Quick({em,t,m,on}){ return <div className="row" onClick={on} style={{cursor:'pointer'}}>
  <div style={{fontSize:22}}>{em}</div><div className="grow"><div className="t">{t}</div><div className="m">{m}</div></div>
  <span className="iconbtn">go →</span></div>; }

/* ============================ Library ============================ */
function Library({db,patch}){
  const [title,setTitle]=useState(''); const [text,setText]=useState('');
  const add=()=>{ if(!text.trim())return;
    const r={id:uid(),title:title.trim()||`Reading ${db.readings.length+1}`,text:text.trim(),addedAt:now()};
    patch('readings',rs=>[r,...rs]); setTitle(''); setText(''); };
  const del=id=>patch('readings',rs=>rs.filter(r=>r.id!==id));
  const onFile=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=()=>{ setText(String(rd.result||'')); if(!title) setTitle(f.name.replace(/\.[^.]+$/,'')); }; rd.readAsText(f); };
  return <div className="grid2">
    <div className="panel pad">
      <div className="ph"><div><h2>Add a reading or case</h2><div className="sub">Paste text or drop a .txt/.md file. Your own content only.</div></div></div>
      <label className="fld">Title</label>
      <input className="inp" value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Christensen — Disruptive Technologies"/>
      <div style={{height:12}}/>
      <label className="fld">Text</label>
      <textarea className="inp" rows={11} value={text} onChange={e=>setText(e.target.value)} placeholder="Paste the case / reading / your notes here…"/>
      <div style={{display:'flex',gap:10,marginTop:12,alignItems:'center'}}>
        <button className="btn" onClick={add} disabled={!text.trim()}>＋ Add to library</button>
        <label className="btn ghost sm" style={{cursor:'pointer'}}>Upload .txt/.md<input type="file" accept=".txt,.md,.markdown,text/plain" style={{display:'none'}} onChange={onFile}/></label>
        <span className="tag">{text.trim()? `${text.trim().split(/\s+/).length} words`:''}</span>
      </div>
      <div className="divider"/>
      <div className="warnbox">⚠️ Recording note: Massachusetts is all-party-consent. Don't paste secretly-recorded class audio. Use officially posted recordings or your own voice memos only.</div>
    </div>
    <div className="panel pad">
      <div className="ph"><div><h2>Library</h2><div className="sub">{db.readings.length} item{db.readings.length!==1?'s':''}</div></div></div>
      {db.readings.length===0
        ? <div className="empty"><div className="big">📚</div>Nothing yet. Add a reading and the Simulator, Tutor, and Quiz light up.</div>
        : <div className="list">{db.readings.map(r=><div key={r.id} className="row">
            <div className="grow"><div className="t">{r.title}</div>
              <div className="m">{r.text.split(/\s+/).length} words · {fmtDate(r.addedAt)}</div></div>
            <button className="iconbtn" onClick={()=>del(r.id)}>delete</button></div>)}</div>}
    </div>
  </div>;
}

/* reading picker */
function ReadingPick({db,value,onChange,allowNone}){
  return <select className="inp" value={value||''} onChange={e=>onChange(e.target.value||null)}>
    {allowNone && <option value="">— no reading (general) —</option>}
    {!allowNone && <option value="" disabled>Pick a reading…</option>}
    {db.readings.map(r=><option key={r.id} value={r.id}>{r.title}</option>)}
  </select>;
}
const readingCtx = (db,id,limit=6000) => {
  const r = db.readings.find(x=>x.id===id); if(!r) return '';
  return `\n\nASSIGNED READING — "${r.title}":\n${r.text.slice(0,limit)}${r.text.length>limit?'\n…[truncated]':''}`;
};

/* ============================ Simulator (cold-call + interview reuse) ============================ */
function Simulator({db,patch,setTab}){
  const [persona,setPersona]=useState('professor');
  const [readingId,setReadingId]=useState(db.readings[0]?.id||null);
  const [subject,setSubject]=useState('');
  const [turns,setTurns]=useState([]);   // {role:'ai'|'me', text, grade?}
  const [input,setInput]=useState('');
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [live,setLive]=useState(false);
  const [froze,setFroze]=useState(false);
  const scroller=useRef(null);
  const P = PERSONAS[persona];
  const needReading = persona==='professor';
  const ctx = { subject, reading: readingId };

  useEffect(()=>{ if(scroller.current) scroller.current.scrollTop=scroller.current.scrollHeight; },[turns,busy]);

  const sysBase = () => P.sys({subject}) + readingCtx(db,readingId) +
    `\nKeep your messages short — one question or one reaction. Address the candidate as "you".`;

  async function begin(){
    if(needReading && !readingId){ setErr('Pick a reading first (or add one in Library).'); return; }
    setErr(''); setBusy(true); setTurns([]); setLive(true); setFroze(false);
    try{
      const q = await llm(db.settings, sysBase(),
        `Open the session: greet briefly in character and ask your first question. One question only.`, 500);
      setTurns([{role:'ai',text:q.trim()}]);
    }catch(e){ setErr(e.message); setLive(false); } finally{ setBusy(false); }
  }

  async function answer(){
    const a=input.trim(); if(!a||busy) return; setInput('');
    const history = turns.map(t=>`${t.role==='ai'?'INTERVIEWER':'CANDIDATE'}: ${t.text}`).join('\n');
    const myTurn={role:'me',text:a}; setTurns(t=>[...t,myTurn]); setBusy(true); setErr('');
    try{
      const j = await llmJSON(db.settings,
        sysBase()+`\nYou grade each answer. Rubric dimensions: ${P.rubric}.`,
        `Conversation so far:\n${history}\nCANDIDATE: ${a}\n\nReturn JSON: {"score":0-100,"dims":{"<dim>":0-100,...4 keys},"model_answer":"a calibrated 3-4 sentence answer they could have said out loud","feedback":"2 sentences, direct","followup":"your next, escalating question in character"}`,
        1100);
      const grade={ score:Math.max(0,Math.min(100,+j.score||0)), dims:j.dims||{}, model:j.model_answer||'', feedback:j.feedback||'' };
      setTurns(t=>{ const c=[...t]; c[c.length-1]={...myTurn,grade}; return [...c,{role:'ai',text:(j.followup||'Continue.').trim()}]; });
    }catch(e){ setErr(e.message); } finally{ setBusy(false); }
  }

  function end(){
    const graded=turns.filter(t=>t.grade);
    if(graded.length){
      const avg=Math.round(graded.reduce((s,t)=>s+t.grade.score,0)/graded.length);
      const sess={ id:uid(), persona, personaLabel:P.label, readingId,
        readingTitle: db.readings.find(r=>r.id===readingId)?.title||subject||'general',
        questions:graded.length, avgScore:avg, froze, createdAt:now(),
        scores:graded.map(t=>t.grade.score) };
      patch('cc',cc=>({...cc,sessions:[sess,...cc.sessions]}));
    }
    setLive(false);
  }

  const lastGrade = [...turns].reverse().find(t=>t.grade)?.grade;

  return <div className="grid2">
    <div className="panel pad" style={{display:'flex',flexDirection:'column'}}>
      <div className="ph"><div><h2>{P.emoji} Simulator</h2><div className="sub">{live?'Session live — answer in 3–4 speakable sentences.':P.desc}</div></div>
        {live && <button className="btn ghost sm" onClick={end}>End & save</button>}</div>

      {!live && <>
        <label className="fld">Mode</label>
        <div style={{display:'flex',flexWrap:'wrap',gap:7,marginBottom:14}}>
          {Object.entries(PERSONAS).map(([k,v])=>
            <span key={k} className={'chip pick'+(persona===k?' on':'')} onClick={()=>setPersona(k)}>{v.emoji} {v.label}</span>)}
        </div>
        {needReading
          ? (db.readings.length
              ? <><label className="fld">Reading</label><ReadingPick db={db} value={readingId} onChange={setReadingId}/></>
              : <div className="warnbox">Add a reading in <a onClick={()=>setTab('library')} style={{cursor:'pointer'}}>Library</a> to run a professor cold-call.</div>)
          : <><label className="fld">Topic / role <span style={{textTransform:'none',color:'var(--mute)'}}>(optional)</span></label>
              <input className="inp" value={subject} onChange={e=>setSubject(e.target.value)}
                placeholder={persona==='negotiation'?'e.g. Series A term sheet, 2 cofounders':persona==='behavioral'?'e.g. Director of AI, pharma':persona==='case'?'e.g. declining margins, regional airline':'topic'}/></>}
        <div style={{marginTop:14}}><button className="btn" onClick={begin} disabled={busy||(needReading&&!db.readings.length)}>{busy?<Dots/>:'▶ Start session'}</button></div>
      </>}

      {live && <>
        <div className="chat" ref={scroller}>
          {turns.map((t,i)=><div key={i} className={'msg '+(t.role==='ai'?'ai':'me')}>
            <div className="who">{t.role==='ai'?P.label:'you'}</div>{t.text}</div>)}
          {busy && <div className="msg ai"><div className="who">{P.label}</div><Dots/></div>}
        </div>
        <div style={{marginTop:12}}>
          <textarea className="inp" rows={3} value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) answer(); }}
            placeholder="Your answer — out loud it should be ~3–4 sentences…  (⌘/Ctrl+Enter)"/>
          <div style={{display:'flex',gap:9,marginTop:9,alignItems:'center'}}>
            <button className="btn" onClick={answer} disabled={busy||!input.trim()}>Answer</button>
            <label className="chip pick" style={{cursor:'pointer'}}>
              <input type="checkbox" checked={froze} onChange={e=>setFroze(e.target.checked)} style={{marginRight:2}}/> I froze here
            </label>
            <span className="tag">{turns.filter(t=>t.grade).length} graded</span>
          </div>
        </div>
      </>}
      {err && <div className="warnbox" style={{marginTop:12}}>{err}</div>}
    </div>

    <div className="panel pad">
      <div className="ph"><div><h2>Feedback</h2><div className="sub">Latest grade + your reps.</div></div></div>
      {lastGrade ? <div className="grade">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
          <span className="tag">Last answer</span><span className="mono" style={{fontWeight:700,fontSize:18}}>{lastGrade.score}/100</span></div>
        <div className="scorebar"><i style={{width:`${lastGrade.score}%`}}></i></div>
        <div className="dims">{Object.entries(lastGrade.dims).slice(0,4).map(([k,v])=>
          <div key={k} className="dim"><span>{k}</span><b>{v}</b></div>)}</div>
        {lastGrade.feedback && <p className="note" style={{marginTop:10}}>{lastGrade.feedback}</p>}
        {lastGrade.model && <><div className="tag" style={{marginTop:8}}>Model answer (speakable)</div>
          <p className="note" style={{marginTop:4,fontStyle:'italic'}}>"{lastGrade.model}"</p></>}
      </div> : <div className="empty"><div className="big">🎯</div>Start a session and your first grade shows here.</div>}

      {db.cc.sessions.length>0 && <>
        <div className="divider"/>
        <div className="tag" style={{marginBottom:9}}>Recent reps</div>
        <div className="list">{db.cc.sessions.slice(0,6).map(s=><div key={s.id} className="row">
          <div className="grow"><div className="t">{PERSONAS[s.persona]?.emoji} {s.readingTitle}</div>
            <div className="m">{s.questions} Q · {s.personaLabel}{s.froze?' · froze':''} · {fmtDate(s.createdAt)}</div></div>
          <span className="mono" style={{fontWeight:700}}>{s.avgScore}</span></div>)}</div>
      </>}
    </div>
  </div>;
}

/* ============================ Tutor ============================ */
function Tutor({db}){
  const [readingId,setReadingId]=useState(db.readings[0]?.id||null);
  const [style,setStyle]=useState('socratic');
  const [turns,setTurns]=useState([]);
  const [input,setInput]=useState(''); const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  const scroller=useRef(null);
  useEffect(()=>{ if(scroller.current) scroller.current.scrollTop=scroller.current.scrollHeight; },[turns,busy]);
  const sys = () => `You are a patient expert tutor for an MIT Sloan Fellow. Mode: ${style==='socratic'
      ? 'SOCRATIC — guide with questions, hints, and one idea at a time; do not dump answers.'
      : 'DIRECT — explain clearly and concisely with concrete examples.'} Ground everything in the reading when present; if the user goes beyond it, say so. Keep replies tight.`+readingCtx(db,readingId);
  async function send(seed){
    const text = seed || input.trim(); if(!text||busy) return; if(!seed) setInput('');
    const mine={role:'me',text}; const next=[...turns,mine]; setTurns(next); setBusy(true); setErr('');
    try{
      const hist=next.map(t=>`${t.role==='me'?'STUDENT':'TUTOR'}: ${t.text}`).join('\n');
      const r=await llm(db.settings, sys(), hist+'\nTUTOR:', 1100);
      setTurns(t=>[...t,{role:'ai',text:r.trim()}]);
    }catch(e){ setErr(e.message); } finally{ setBusy(false); }
  }
  return <div className="panel pad">
    <div className="ph"><div><h2>🧑‍🏫 Concept tutor</h2><div className="sub">Learns from your reading. Ask anything; it teaches.</div></div>
      <div className="seg">
        <button className={style==='socratic'?'on':''} onClick={()=>setStyle('socratic')}>Socratic</button>
        <button className={style==='direct'?'on':''} onClick={()=>setStyle('direct')}>Direct</button>
      </div></div>
    <div className="grid2" style={{gridTemplateColumns:'1fr 2fr',gap:18}}>
      <div>
        <label className="fld">Grounding reading</label>
        <ReadingPick db={db} value={readingId} onChange={setReadingId} allowNone/>
        <div style={{height:14}}/>
        <div className="tag" style={{marginBottom:7}}>Quick starts</div>
        <div style={{display:'flex',flexDirection:'column',gap:7}}>
          {['Explain the core argument like I have 5 minutes before class','What would a professor cold-call me on here?','Give me the 3 things I must not miss','Where is this reading weakest or most contestable?'].map(s=>
            <button key={s} className="btn ghost sm" style={{justifyContent:'flex-start',textAlign:'left'}} onClick={()=>send(s)} disabled={busy}>{s}</button>)}
        </div>
      </div>
      <div>
        <div className="chat" ref={scroller} style={{maxHeight:'48vh'}}>
          {turns.length===0 && <div className="empty"><div className="big">🧠</div>Pick a mode, ask a question, or tap a quick-start.</div>}
          {turns.map((t,i)=><div key={i} className={'msg '+(t.role==='ai'?'ai':'me')}>
            <div className="who">{t.role==='ai'?'tutor':'you'}</div>{t.text}</div>)}
          {busy && <div className="msg ai"><div className="who">tutor</div><Dots/></div>}
        </div>
        <div style={{marginTop:12,display:'flex',gap:9}}>
          <textarea className="inp" rows={2} value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) send(); }} placeholder="Ask the tutor…  (⌘/Ctrl+Enter)"/>
          <button className="btn" onClick={()=>send()} disabled={busy||!input.trim()}>Send</button>
        </div>
        {err && <div className="warnbox" style={{marginTop:10}}>{err}</div>}
      </div>
    </div>
  </div>;
}

/* ============================ Quiz ============================ */
function Quiz({db,patch,setTab}){
  const [readingId,setReadingId]=useState(db.readings[0]?.id||null);
  const [n,setN]=useState(5);
  const [qs,setQs]=useState([]);        // {q, topic, answer, idx, picked?, correct?}
  const [busy,setBusy]=useState(false); const [err,setErr]=useState(''); const [done,setDone]=useState(false);
  async function gen(){
    if(!readingId){ setErr('Pick a reading.'); return; } setErr(''); setBusy(true); setQs([]); setDone(false);
    try{
      const r=db.readings.find(x=>x.id===readingId);
      const j=await llmJSON(db.settings,
        `You write exam-style self-quiz questions for an MIT Sloan Fellow from the reading. Mix recall and application. Each question has a short topic label (2-3 words) for weak-spot tracking.`,
        `From "${r.title}":\n${r.text.slice(0,7000)}\n\nWrite ${n} questions. JSON: {"questions":[{"q":"...","topic":"...","answer":"a 2-3 sentence model answer"}]}`,1800);
      setQs((j.questions||[]).map(x=>({...x,reveal:false,self:null})));
    }catch(e){ setErr(e.message); } finally{ setBusy(false); }
  }
  const mark=(i,ok)=>setQs(qs=>qs.map((q,j)=>j===i?{...q,self:ok}:q));
  const reveal=i=>setQs(qs=>qs.map((q,j)=>j===i?{...q,reveal:true}:q));
  function finish(){
    const answered=qs.filter(q=>q.self!=null); if(!answered.length){setDone(true);return;}
    const weak={...db.quiz.weak};
    answered.forEach(q=>{ const t=q.topic||'general'; const w=weak[t]||{seen:0,missed:0};
      w.seen++; if(q.self===false) w.missed++; weak[t]=w; });
    const sess={id:uid(),readingTitle:db.readings.find(r=>r.id===readingId)?.title,n:answered.length,
      correct:answered.filter(q=>q.self).length,createdAt:now()};
    patch('quiz',q=>({...q,weak,sessions:[sess,...q.sessions]})); setDone(true);
  }
  const score=qs.filter(q=>q.self).length, ans=qs.filter(q=>q.self!=null).length;
  return <div className="grid2" style={{gridTemplateColumns:'1fr 1.6fr'}}>
    <div className="panel pad">
      <div className="ph"><div><h2>🃏 Self-quiz</h2><div className="sub">Grade yourself honestly — it tracks your weak spots.</div></div></div>
      {db.readings.length===0
        ? <div className="warnbox">Add a reading in <a onClick={()=>setTab('library')} style={{cursor:'pointer'}}>Library</a> first.</div>
        : <>
          <label className="fld">Reading</label><ReadingPick db={db} value={readingId} onChange={setReadingId}/>
          <div style={{height:12}}/>
          <label className="fld">How many questions</label>
          <div className="seg">{[3,5,8].map(x=><button key={x} className={n===x?'on':''} onClick={()=>setN(x)}>{x}</button>)}</div>
          <div style={{marginTop:14}}><button className="btn" onClick={gen} disabled={busy}>{busy?<Dots/>:'Generate quiz'}</button></div>
        </>}
      {err && <div className="warnbox" style={{marginTop:12}}>{err}</div>}
      <div className="divider"/>
      <div className="tag" style={{marginBottom:9}}>Weak spots</div>
      {Object.keys(db.quiz.weak).length===0 ? <div className="note">No data yet — finish a quiz to build this.</div>
        : <div className="list">{Object.entries(db.quiz.weak).sort((a,b)=>(b[1].missed/b[1].seen)-(a[1].missed/a[1].seen)).slice(0,8).map(([t,w])=>
            <div key={t} className="row"><div className="grow"><div className="t" style={{fontSize:13}}>{t}</div>
              <div className="bar" style={{marginTop:6}}><i style={{width:`${Math.round(100*w.missed/w.seen)}%`,background:w.missed/w.seen>.4?'var(--brand)':'var(--terra)'}}></i></div></div>
            <span className="tag">{w.missed}/{w.seen}</span></div>)}</div>}
    </div>
    <div className="panel pad">
      <div className="ph"><div><h2>Questions</h2>{qs.length>0&&<div className="sub">{ans}/{qs.length} answered · {score} right</div>}</div>
        {qs.length>0&&!done&&<button className="btn ghost sm" onClick={finish}>Finish & save</button>}</div>
      {qs.length===0 ? <div className="empty"><div className="big">🃏</div>Generate a quiz to begin.</div>
        : <div className="list">{qs.map((q,i)=><div key={i} className="row" style={{flexDirection:'column',alignItems:'stretch',gap:10}}>
            <div><span className="tag">Q{i+1} · {q.topic}</span><div className="t" style={{marginTop:5,fontWeight:600}}>{q.q}</div></div>
            {!q.reveal ? <button className="btn ghost sm" style={{alignSelf:'flex-start'}} onClick={()=>reveal(i)}>Reveal model answer</button>
              : <><div className="okbox">{q.answer}</div>
                <div style={{display:'flex',gap:8}}>
                  <button className={'btn sm '+(q.self===true?'':'ghost')} onClick={()=>mark(i,true)}>✓ I had it</button>
                  <button className={'btn sm '+(q.self===false?'':'ghost')} onClick={()=>mark(i,false)}>✗ Missed it</button>
                </div></>}
          </div>)}</div>}
      {done && <div className="okbox" style={{marginTop:12}}>Saved. Weak spots updated — check the Simulator or Tutor to drill them.</div>}
    </div>
  </div>;
}

/* ============================ Planner ============================ */
function Planner({db,patch}){
  const [title,setTitle]=useState(''); const [due,setDue]=useState(''); const [weight,setWeight]=useState(20); const [est,setEst]=useState(2);
  const add=()=>{ if(!title.trim())return;
    patch('planner',p=>({...p,tasks:[...p.tasks,{id:uid(),title:title.trim(),due,weight:+weight,est:+est,done:false}]}));
    setTitle(''); setDue(''); };
  const toggle=id=>patch('planner',p=>({...p,tasks:p.tasks.map(t=>t.id===id?{...t,done:!t.done}:t)}));
  const del=id=>patch('planner',p=>({...p,tasks:p.tasks.filter(t=>t.id!==id)}));
  // priority = weight / days-left, clamped; higher = do sooner
  const scored=useMemo(()=>db.planner.tasks.filter(t=>!t.done).map(t=>{
    const d=t.due? Math.max(0.4, daysBetween(now(),new Date(t.due).getTime())) : 14;
    return {...t, urg:(t.weight||10)/d, daysLeft:t.due?daysBetween(now(),new Date(t.due).getTime()):null};
  }).sort((a,b)=>b.urg-a.urg),[db.planner.tasks]);
  const maxUrg=scored[0]?.urg||1;
  const totalHrs=scored.reduce((s,t)=>s+(t.est||0),0);
  return <div className="grid2">
    <div className="panel pad">
      <div className="ph"><div><h2>🗓️ Manual planner</h2><div className="sub">v0 fallback — no Canvas. Enter deadlines, get a weighted order.</div></div></div>
      <label className="fld">Task</label>
      <input className="inp" value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Finance pset 3"/>
      <div className="grid3" style={{marginTop:12,gap:10}}>
        <div><label className="fld">Due</label><input type="date" className="inp" value={due} onChange={e=>setDue(e.target.value)}/></div>
        <div><label className="fld">Weight</label><input type="number" className="inp" value={weight} onChange={e=>setWeight(e.target.value)} min={1} max={100}/></div>
        <div><label className="fld">Est hrs</label><input type="number" className="inp" value={est} onChange={e=>setEst(e.target.value)} min={0} step={.5}/></div>
      </div>
      <div style={{marginTop:14}}><button className="btn" onClick={add} disabled={!title.trim()}>＋ Add task</button></div>
      <div className="divider"/>
      <div className="note">Priority weighs grade-weight against days remaining. Higher bar = do it sooner. Open load: <b>{totalHrs}h</b> across {scored.length} task{scored.length!==1?'s':''}.</div>
    </div>
    <div className="panel pad">
      <div className="ph"><div><h2>Weighted plan</h2><div className="sub">Sorted by urgency.</div></div></div>
      {scored.length===0 ? <div className="empty"><div className="big">🗓️</div>No open tasks. Add one to see the plan.</div>
        : <div className="list">{scored.map(t=><div key={t.id} className="row">
            <input type="checkbox" checked={t.done} onChange={()=>toggle(t.id)}/>
            <div className="grow"><div className="t">{t.title}</div>
              <div className="m">{t.daysLeft!=null? (t.daysLeft<0?`${-t.daysLeft}d overdue`:t.daysLeft===0?'due today':`${t.daysLeft}d left`):'no date'} · w{t.weight} · {t.est}h</div>
              <div className="bar" style={{marginTop:6}}><i style={{width:`${Math.round(100*t.urg/maxUrg)}%`,background:t.daysLeft!=null&&t.daysLeft<2?'var(--brand)':'var(--green)'}}></i></div></div>
            <button className="iconbtn" onClick={()=>del(t.id)}>✕</button></div>)}</div>}
      {db.planner.tasks.some(t=>t.done) && <><div className="divider"/><div className="tag" style={{marginBottom:8}}>Done</div>
        <div className="list">{db.planner.tasks.filter(t=>t.done).map(t=><div key={t.id} className="row" style={{opacity:.55}}>
          <input type="checkbox" checked readOnly onChange={()=>toggle(t.id)}/>
          <div className="grow"><div className="t" style={{textDecoration:'line-through'}}>{t.title}</div></div>
          <button className="iconbtn" onClick={()=>del(t.id)}>✕</button></div>)}</div></>}
    </div>
  </div>;
}

/* ============================ OPT Clock ============================ */
function OPT({db,patch}){
  const o=db.opt; const set=(k,v)=>patch('opt',op=>({...op,[k]:v}));
  const D=s=>s?new Date(s).getTime():null;
  const milestones=[
    ['programEnd','Program end date','EAD applications open up to 90 days before this.'],
    ['eadStart','OPT / EAD start date','Your 12-month clock starts here.'],
    ['eadEnd','OPT / EAD end date','Authorization ends. STEM extension may apply.'],
  ];
  const eadStart=D(o.eadStart), eadEnd=D(o.eadEnd);
  const unemployedLimit=90; // F-1 OPT aggregate unemployment cap (date math only, not advice)
  const runway = eadEnd? daysBetween(now(),eadEnd):null;
  const elapsed = eadStart? Math.max(0,daysBetween(eadStart,now())):null;
  const total = eadStart&&eadEnd? daysBetween(eadStart,eadEnd):null;
  return <div className="grid2">
    <div className="panel pad">
      <div className="ph"><div><h2>🛂 OPT / F-1 clock</h2><div className="sub">Dates only. Tracks deadlines — never interprets visa rules.</div></div></div>
      <div className="warnbox" style={{marginBottom:14}}>⚠️ This tracks <b>your dates</b> and nothing else. It is not immigration advice. For any rule, eligibility, or filing question, talk to the <b>MIT International Students Office (ISO)</b>.</div>
      {milestones.map(([k,lbl,hint])=><div key={k} style={{marginBottom:12}}>
        <label className="fld">{lbl}</label>
        <input type="date" className="inp" value={o[k]||''} onChange={e=>set(k,e.target.value)}/>
        <div className="note" style={{marginTop:4}}>{hint}</div>
      </div>)}
      <label className="fld">Days of unemployment used <span style={{textTransform:'none',color:'var(--mute)'}}>(you track this)</span></label>
      <input type="number" className="inp" value={o.unemp||''} onChange={e=>set('unemp',e.target.value)} min={0} max={120} placeholder="0"/>
    </div>
    <div className="panel pad">
      <div className="ph"><div><h2>Countdown</h2></div></div>
      {!eadEnd ? <div className="empty"><div className="big">🛂</div>Enter your EAD end date to see runway.</div>
        : <>
          <div className="grid2" style={{gap:12}}>
            <Stat k="OPT runway" v={runway} sub="days" d="until EAD end"/>
            <Stat k="Unemployment left" v={Math.max(0,unemployedLimit-(+o.unemp||0))} sub={`of ${unemployedLimit}`} d="days (you-entered)"/>
          </div>
          {total&&elapsed!=null && <div style={{marginTop:14}}>
            <div className="tag" style={{marginBottom:6}}>OPT period · {Math.min(100,Math.round(100*elapsed/total))}% elapsed</div>
            <div className="scorebar"><i style={{width:`${Math.min(100,Math.round(100*elapsed/total))}%`}}></i></div>
          </div>}
          {o.programEnd && <div className="okbox" style={{marginTop:14}}>EAD filing window opened ~{fmtDate(D(o.programEnd)-90*864e5)} (90 days before program end). Confirm exact dates with ISO.</div>}
          {(+o.unemp||0)>=70 && <div className="warnbox" style={{marginTop:12}}>You've logged {o.unemp} unemployment days — close to the 90-day cap. Check with ISO.</div>}
        </>}
    </div>
  </div>;
}

/* ============================ Settings ============================ */
function Settings({db,patch}){
  const s=db.settings; const set=(k,v)=>patch('settings',{[k]:v});
  const art=inArtifact();
  const [show,setShow]=useState(false);
  function wipe(){ if(confirm('Erase ALL MIghTy data in this browser (readings, reps, quizzes, planner, OPT)? This cannot be undone.')){
    localStorage.removeItem(DB_KEY); location.reload(); } }
  function exportData(){ const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mighty-backup.json'; a.click(); }
  return <div className="grid2">
    <div className="panel pad">
      <div className="ph"><div><h2>⚙️ Connection</h2><div className="sub">How MIghTy reaches Claude.</div></div></div>
      {art ? <div className="okbox">✅ Running inside a Claude artifact — using <span className="mono">window.claude.complete</span>. No API key needed.</div>
        : <>
          <div className="note" style={{marginBottom:12}}>Standalone mode. Add your own Anthropic API key — it's stored only in this browser (localStorage) and sent directly to Anthropic, never to any other server.</div>
          <label className="fld">Anthropic API key</label>
          <div style={{display:'flex',gap:8}}>
            <input className="inp" type={show?'text':'password'} value={s.apiKey} onChange={e=>set('apiKey',e.target.value)} placeholder="sk-ant-…"/>
            <button className="btn ghost sm" onClick={()=>setShow(v=>!v)}>{show?'hide':'show'}</button>
          </div>
          <div style={{height:12}}/>
          <label className="fld">Model</label>
          <select className="inp" value={s.model} onChange={e=>set('model',e.target.value)}>
            <option value="claude-sonnet-4-6">Claude Sonnet 4.6 — fast, cheap (recommended)</option>
            <option value="claude-opus-4-8">Claude Opus 4.8 — sharpest grading</option>
            <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 — cheapest</option>
          </select>
          <div className="note" style={{marginTop:10}}>Get a key at <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a>. At cohort scale during finals this is a real bill — Sonnet keeps it modest.</div>
        </>}
    </div>
    <div className="panel pad">
      <div className="ph"><div><h2>Your data</h2><div className="sub">It all lives in this browser. No backend, ever, in v0.</div></div></div>
      <div className="grid2" style={{gap:12}}>
        <Stat k="Readings" v={db.readings.length}/>
        <Stat k="Cold-call reps" v={db.cc.sessions.length}/>
        <Stat k="Quiz sessions" v={db.quiz.sessions.length}/>
        <Stat k="Planner tasks" v={db.planner.tasks.length}/>
      </div>
      <div style={{display:'flex',gap:9,marginTop:16,flexWrap:'wrap'}}>
        <button className="btn ghost sm" onClick={exportData}>⤓ Export backup (.json)</button>
        <button className="btn ghost sm" onClick={wipe} style={{color:'var(--brand2)',borderColor:'#E7C2BD'}}>Erase all data</button>
      </div>
      <div className="divider"/>
      <div className="note"><b>v0 scope:</b> no MIT login, no Canvas, no email/calendar, no FERPA-protected records — only what you upload. The proactive layer (morning briefs, auto-reminders, OPT countdown that fires on its own) is v1, and needs per-user auth + institutional review. Don't ship that as a side project.</div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
