<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIghTy · LinkedIn outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --card:#FFFDF9; --card2:#FBF6EC; --line:#E7DECB; --line2:#EAE1CE; --grid:#F0E7D6; --inp:#FCF8F0; --seg:#EDE4D2; --chip:#F4EEE1;
  --ink:#2A2320; --sub:#73685B; --sub2:#8A7F72; --mute:#9A8E7E; --mute2:#A2978A;
  --brand:#A31F34; --brand2:#8A1828; --bsoft:#FBE6E2;
  --green:#5F7A4E; --green2:#4F6B3E; --gsoft:#E7EDDD;
  --terra:#C8703D; --terra2:#A05A26; --tsoft:#F2E7D4;
  --blue:#3A6B8A; --bluesoft:#E1EBF1;
  --fh:'Bricolage Grotesque',system-ui,sans-serif; --fb:'Hanken Grotesk',system-ui,sans-serif; --fm:'Space Mono',monospace;
  --shadow:0 2px 8px rgba(80,55,30,.06); --shadowL:0 12px 40px rgba(80,55,30,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--fb);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;
  background:radial-gradient(120% 90% at 100% 0%, #F3ECDC 0%, #EBE2D0 55%, #E7DDC9 100%);background-attachment:fixed;}
::selection{background:var(--brand);color:#fff;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D8CCB6;border-radius:99px;border:2px solid #EFE7D8;}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(12px,2.2vw,26px);}
h1,h2,h3{font-family:var(--fh);letter-spacing:-.015em;margin:0;}
.mono{font-family:var(--fm);}
button{font-family:var(--fb);cursor:pointer;}
input,textarea,select{font-family:var(--fb);color:var(--ink);}
textarea{resize:vertical;}
a{color:var(--brand2);}

.head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  padding:14px clamp(14px,2vw,22px);margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);}
.brandrow{display:flex;align-items:center;gap:13px;}
.logo{width:50px;height:50px;border-radius:15px;background:linear-gradient(150deg,#B83A30,#8A1828);display:flex;align-items:center;justify-content:center;
  font-family:var(--fh);font-weight:800;font-size:21px;color:#FFF6EC;box-shadow:0 4px 12px rgba(150,40,32,.32);}
.brand-name{font-family:var(--fh);font-weight:800;font-size:clamp(20px,2.6vw,26px);line-height:1;}
.brand-name b{color:var(--brand);}
.brand-sub{font-size:12px;color:var(--sub);margin-top:4px;}
.acct{display:flex;align-items:center;gap:10px;}
.statusdot{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-weight:600;font-size:12px;}
.statusdot i{width:7px;height:7px;border-radius:50%;}
.st-ok{background:var(--gsoft);color:var(--green2);} .st-ok i{background:var(--green);box-shadow:0 0 0 3px rgba(95,122,78,.18);}
.st-warn{background:var(--tsoft);color:var(--terra2);} .st-warn i{background:var(--terra);box-shadow:0 0 0 3px rgba(200,112,61,.18);}
.st-blue{background:var(--bluesoft);color:var(--blue);} .st-blue i{background:var(--blue);box-shadow:0 0 0 3px rgba(58,107,138,.18);}

.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.nav button{padding:9px 14px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--sub);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;}
.nav button:hover{background:var(--chip);color:var(--ink);}
.nav button.on{background:var(--card);color:var(--brand);border-color:var(--line);box-shadow:var(--shadow);}
.nav .em{font-size:15px;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);}
.pad{padding:clamp(16px,2vw,24px);}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.ph h2{font-size:19px;} .ph .sub{font-size:12.5px;color:var(--sub);margin-top:3px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr;}}

label.fld{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 6px;}
.inp,textarea.inp,select.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--inp);font-size:14px;outline:none;}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--bsoft);}
textarea.inp{line-height:1.5;}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:11px 17px;border-radius:13px;border:1px solid var(--brand2);background:linear-gradient(150deg,#B83A30,#8A1828);color:#FFF6EC;font-weight:700;font-size:13.5px;box-shadow:0 3px 10px rgba(150,40,32,.22);}
.btn:hover{filter:brightness(1.05);} .btn:disabled{opacity:.5;cursor:not-allowed;filter:none;}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow);}
.btn.ghost:hover{background:#F8F2E6;}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:600;color:var(--sub);border:1px solid var(--line2);}
.chip.pick{cursor:pointer;} .chip.pick.on{background:var(--bsoft);color:var(--brand2);border-color:#F0CFC9;}
.tag{font-family:var(--fm);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute2);}
.badge{font-family:var(--fm);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:7px;background:var(--chip);color:var(--sub2);border:1px solid var(--line2);}
.badge.login{background:var(--bluesoft);color:var(--blue);border-color:#C9DCE7;}

.kpi{background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:15px 16px;}
.kpi .k{font-family:var(--fm);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute2);margin-bottom:7px;}
.kpi .v{font-family:var(--fh);font-weight:800;font-size:30px;line-height:1;}
.kpi .v small{font-size:13px;color:var(--mute2);font-weight:600;font-family:var(--fb);}
.kpi .d{font-size:12px;color:var(--sub);margin-top:6px;}

.empty{text-align:center;padding:34px 18px;color:var(--mute);}
.empty .big{font-size:30px;margin-bottom:8px;}

.typing{display:inline-flex;gap:4px;align-items:center;}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:bl 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
@keyframes bl{0%,60%,100%{opacity:.25;}30%{opacity:1;}}

.scorebar{height:8px;border-radius:99px;background:var(--seg);overflow:hidden;margin:8px 0;}
.scorebar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C8703D,#5F7A4E);}

.list{display:flex;flex-direction:column;gap:9px;}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--card2);}
.row .grow{flex:1;min-width:0;}
.row .t{font-weight:700;font-size:14px;}
.row .m{font-size:12px;color:var(--sub);margin-top:2px;}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 9px;font-size:12px;color:var(--sub);}
.iconbtn:hover{background:#F8F2E6;color:var(--ink);}
.iconbtn:disabled{opacity:.4;cursor:not-allowed;}
.divider{height:1px;background:var(--line2);margin:16px 0;}
.note{font-size:12px;color:var(--sub);line-height:1.5;}
.warnbox{background:var(--tsoft);border:1px solid #E7C9A8;border-radius:13px;padding:12px 14px;font-size:12.5px;color:var(--terra2);line-height:1.5;}
.okbox{background:var(--gsoft);border:1px solid #C9D8B6;border-radius:13px;padding:12px 14px;font-size:12.5px;color:var(--green2);line-height:1.5;}
.bluebox{background:var(--bluesoft);border:1px solid #C9DCE7;border-radius:13px;padding:12px 14px;font-size:12.5px;color:var(--blue);line-height:1.5;}
.foot{text-align:center;font-size:11.5px;color:var(--mute2);margin:22px 0 8px;line-height:1.6;}
.seg{display:inline-flex;background:var(--seg);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap;}
.seg button{border:none;background:transparent;padding:7px 13px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--sub);}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}

.overlay{position:fixed;inset:0;background:rgba(60,45,25,.34);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px;}
.modal{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadowL);width:100%;max-width:430px;padding:24px;}
.linkurl{font-size:11.5px;color:var(--blue);word-break:break-all;text-decoration:none;}
.linkurl:hover{text-decoration:underline;}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script>
  // Classic JSX runtime (React.createElement) — the automatic runtime emits an ES import that fails without a bundler.
  Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] });
</script>
<script type="text/babel" data-presets="react-classic">
const {useState,useEffect,useRef,useMemo} = React;

/* ============================ persistence ============================ */
const DB_KEY  = 'mighty_v1';    // synced app data (cloud + local cache) — templates + settings only
const CFG_KEY = 'mighty_cfg';   // device-local config — NEVER synced (keys live here)
const DEFAULT = {
  templates: [
    { id:'starter', name:'Intro — Sloan Fellow', body:"Hi {{firstName}}, I'm an MIT Sloan Fellow exploring {{company}} and would love to hear about your path there. Would you be open to a quick chat?" },
  ],
  settings: { sheets: { sheetId:'', tabName:'MIghTy Outreach', lastSyncedAt:null, lastError:null } },
};
function shape(d){
  d = d||{};
  return { ...JSON.parse(JSON.stringify(DEFAULT)), ...d,
    templates: Array.isArray(d.templates) ? d.templates : DEFAULT.templates,
    settings: { ...DEFAULT.settings, ...(d.settings||{}), sheets:{ ...DEFAULT.settings.sheets, ...((d.settings||{}).sheets||{}) } } };
}
function loadDB(){ try{ return shape(JSON.parse(localStorage.getItem(DB_KEY))); }catch(e){ return shape(); } }

const CFG_DEFAULT = { apiKey:'', model:'claude-sonnet-4-6', supabaseUrl:'', supabaseKey:'' };
function loadCfg(){
  let c; try{ c = {...CFG_DEFAULT, ...(JSON.parse(localStorage.getItem(CFG_KEY))||{})}; }catch(e){ c={...CFG_DEFAULT}; }
  return c;
}
function saveCfg(c){ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }

const uid = () => Math.random().toString(36).slice(2,10);
const now = () => Date.now();
const fmtDate = ts => new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const rel = ts => { if(!ts) return 'never'; const s=(now()-ts)/1000;
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; };
const MIT_RE = /@([a-z0-9-]+\.)*mit\.edu$/i;

// Week = Monday 00:00 UTC through the next Monday 00:00 UTC, fixed for everyone.
// Must match the Postgres trigger's date_trunc('week', ...) definition exactly.
function weekStartUTC(ts = now()){
  const d = new Date(ts);
  const day = d.getUTCDay();
  const diff = day===0 ? -6 : 1-day;
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()+diff);
}
function sentThisWeek(log){
  const ws = weekStartUTC();
  return (log||[]).filter(r=>r.status==='sent' && r.sent_at && new Date(r.sent_at).getTime()>=ws).length;
}
function renderTemplate(body, row){
  const firstName = (row.name||'').trim().split(/\s+/)[0] || 'there';
  return (body||'').replaceAll('{{firstName}}', firstName).replaceAll('{{company}}', row.company||'your company');
}

/* ============================ LLM layer (optional — template polish only) ============================ */
const inArtifact = () => typeof window!=='undefined' && window.claude && typeof window.claude.complete==='function';
function llmMode(cfg){ if(inArtifact()) return 'artifact'; if(cfg && cfg.apiKey) return 'api'; return 'none'; }
async function llm(cfg, system, user, maxTokens=600){
  const mode = llmMode(cfg);
  if(mode==='artifact') return await window.claude.complete(`${system}\n\n———\n${user}`);
  if(mode==='api'){
    const res = await fetch('https://api.anthropic.com/v1/messages',{ method:'POST',
      headers:{ 'content-type':'application/json','x-api-key':cfg.apiKey,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model:cfg.model||'claude-sonnet-4-6', max_tokens:maxTokens, system, messages:[{role:'user',content:user}] }) });
    if(!res.ok){ const t=await res.text(); throw new Error(`API ${res.status}: ${t.slice(0,300)}`); }
    const data = await res.json(); return (data.content||[]).map(c=>c.text||'').join('');
  }
  throw new Error('No Claude connection. Add your Anthropic API key in Settings, or run this as a Claude artifact.');
}

/* ============================ atoms ============================ */
function Dots(){ return <span className="typing"><i></i><i></i><i></i></span>; }
function Stat({k,v,sub,d}){ return <div className="kpi"><div className="k">{k}</div><div className="v">{v}{sub&&<small> {sub}</small>}</div>{d&&<div className="d">{d}</div>}</div>; }

/* ============================ App shell ============================ */
function App(){
  const [db,setDb] = useState(loadDB);
  const [cfg,setCfgState] = useState(loadCfg);
  const [tab,setTab] = useState('home');
  const [sb,setSb] = useState(null);
  const [auth,setAuth] = useState({status:'loading', user:null});
  const [localOnly,setLocalOnly] = useState(false);
  const [log,setLog] = useState([]);
  const lastSync = useRef(null);
  const saveTimer = useRef(null);

  const setCfg = (p) => setCfgState(c=>{ const n={...c,...p}; saveCfg(n); return n; });
  const patch = (slice, val) => setDb(d=>({...d,[slice]: typeof val==='function'? val(d[slice]):{...d[slice],...val}}));

  // build supabase client when creds present
  useEffect(()=>{
    if(cfg.supabaseUrl && cfg.supabaseKey && window.supabase){
      try{ setSb(window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey)); }
      catch(e){ setSb(null); setAuth({status:'guest',user:null}); }
    } else { setSb(null); setAuth({status:'guest',user:null}); }
  },[cfg.supabaseUrl, cfg.supabaseKey]);

  // auth session + listener
  useEffect(()=>{
    if(!sb){ return; }
    let sub;
    const onUser = (u)=>{ setAuth({status:u?'in':'out', user:u}); if(u) pull(sb,u); else setLog([]); };
    sb.auth.getSession().then(({data})=>onUser(data.session?.user||null));
    const r = sb.auth.onAuthStateChange((_e,session)=>onUser(session?.user||null));
    sub = r.data?.subscription;
    return ()=>{ sub&&sub.unsubscribe(); };
  },[sb]);

  async function pull(client, u){
    try{
      const {data} = await client.from('user_data').select('data').eq('user_id',u.id).maybeSingle();
      if(data && data.data){ const s=shape(data.data); lastSync.current=JSON.stringify(s); setDb(s); }
      else { const s=loadDB(); lastSync.current=JSON.stringify(s);
        await client.from('user_data').upsert({user_id:u.id, data:s, updated_at:new Date().toISOString()}); }
    }catch(e){ /* stay on local cache */ }
    await ingest(client,u);
    await refreshLog(client,u);
  }

  async function refreshLog(client,u){
    try{
      const {data} = await client.from('outreach_log').select('*').eq('user_id',u.id).order('updated_at',{ascending:false});
      setLog(data||[]);
    }catch(e){ /* keep whatever we had */ }
  }

  // Pull whatever the extension pushed (shortlisted profiles / confirmed sends),
  // merge each into the permanent outreach_log, then clear the consumed inbox rows.
  async function ingest(client, u){
    try{
      const {data,error} = await client.from('outreach_inbox').select('id,kind,payload').eq('user_id',u.id).order('created_at',{ascending:true});
      if(error || !data || !data.length) return 0;
      const consumed=[];
      for(const row of data){
        const p = row.payload || {};
        if(!p.profileUrl){ consumed.push(row.id); continue; }
        try{
          if(row.kind==='sent_confirmation'){
            await client.from('outreach_log').upsert({
              user_id:u.id, profile_url:p.profileUrl, status:'sent',
              sent_at: p.ts ? new Date(p.ts).toISOString() : new Date().toISOString(),
              updated_at:new Date().toISOString(),
            }, {onConflict:'user_id,profile_url'});
          } else {
            await client.from('outreach_log').upsert({
              user_id:u.id, profile_url:p.profileUrl,
              name:p.name||null, title:p.title||null, company:p.company||null,
              updated_at:new Date().toISOString(),
            }, {onConflict:'user_id,profile_url'});
          }
          consumed.push(row.id);
        }catch(e){ /* likely the weekly-cap trigger — leave unconsumed, profile stays Shortlisted */ }
      }
      if(consumed.length) await client.from('outreach_inbox').delete().in('id', consumed);
      return consumed.length;
    }catch(e){ return 0; }
  }
  const doIngest = async () => { if(auth.status==='in' && sb){ await ingest(sb, auth.user); await refreshLog(sb, auth.user); } };

  async function setRowStatus(row, fields){
    if(!sb || auth.status!=='in') return {ok:false, error:'Not signed in'};
    try{
      await sb.from('outreach_log').update({...fields, updated_at:new Date().toISOString()}).eq('id',row.id);
      await refreshLog(sb, auth.user);
      return {ok:true};
    }catch(e){ return {ok:false, error:e.message||String(e)}; }
  }

  // persist locally always; push to cloud when signed in & changed
  useEffect(()=>{
    const s = JSON.stringify(db);
    localStorage.setItem(DB_KEY, s);
    if(auth.status==='in' && sb && s!==lastSync.current){
      lastSync.current = s;
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(()=>{
        sb.from('user_data').upsert({user_id:auth.user.id, data:db, updated_at:new Date().toISOString()})
          .then(()=>{},()=>{});
      },1200);
    }
  },[db]);

  // re-pull on window focus (cross-device freshness, and picks up anything the extension just pushed)
  useEffect(()=>{
    if(auth.status!=='in'||!sb) return;
    const f=()=>pull(sb,auth.user); window.addEventListener('focus',f); return ()=>window.removeEventListener('focus',f);
  },[auth.status, sb]);

  const mode = llmMode(cfg);
  const sbReady = !!sb;
  const TABS = [
    ['home','🏠','Home'],['shortlist','📋','Shortlist'],['templates','✉️','Templates'],
    ['log','📊','Log'],['settings','⚙️','Settings'],
  ];

  async function signOut(){ if(sb){ await sb.auth.signOut(); } }

  return <div className="wrap">
    <div className="head">
      <div className="brandrow">
        <div className="logo">Mi</div>
        <div><div className="brand-name"><b>MI</b>gh<b>T</b>y</div>
          <div className="brand-sub">LinkedIn outreach · Sloan Fellows</div></div>
      </div>
      <div className="acct">
        {mode==='none'
          ? <button className="statusdot st-warn" onClick={()=>setTab('settings')}><i></i>No Claude — optional</button>
          : <span className="statusdot st-ok"><i></i>{mode==='artifact'?'Artifact':'Claude on'}</span>}
        {auth.status==='in'
          ? <><span className="statusdot st-blue"><i></i>{auth.user.email}</span><button className="iconbtn" onClick={signOut}>sign out</button></>
          : localOnly
            ? <button className="btn sm" onClick={()=>setLocalOnly(false)}>Sign in</button>
            : null}
      </div>
    </div>

    {auth.status==='loading'
      ? <div className="panel pad"><div className="empty"><div className="big">⏳</div>Loading…</div></div>
      : (auth.status!=='in' && !localOnly)
        ? <Gate sb={sb} cfg={cfg} setCfg={setCfg} onLocal={()=>setLocalOnly(true)}/>
        : <>
            <div className="nav">
              {TABS.map(([id,em,lb])=><button key={id} className={tab===id?'on':''} onClick={()=>setTab(id)}><span className="em">{em}</span>{lb}</button>)}
            </div>
            {tab==='home' && <Home db={db} log={log} setTab={setTab} auth={auth} sbReady={sbReady} onSignIn={()=>setLocalOnly(false)}/>}
            {tab==='shortlist' && <Shortlist db={db} log={log} auth={auth} sbReady={sbReady} doIngest={doIngest} setRowStatus={setRowStatus} onSignIn={()=>setLocalOnly(false)}/>}
            {tab==='templates' && <Templates db={db} patch={patch} cfg={cfg}/>}
            {tab==='log' && <Log db={db} patch={patch} log={log} auth={auth} sb={sb}/>}
            {tab==='settings' && <Settings db={db} patch={patch} cfg={cfg} setCfg={setCfg} auth={auth} sb={sb} signOut={signOut}/>}
          </>}

    <div className="foot">

/* ============================ Login gate ============================ */
function Gate({sb,cfg,setCfg,onLocal}){
  return <div style={{display:'flex',justifyContent:'center',padding:'10px 0 4px'}}>
    <div style={{width:'100%',maxWidth:460}}>
      {sb ? <LoginCard sb={sb} onLocal={onLocal}/> : <SetupCard cfg={cfg} setCfg={setCfg} onLocal={onLocal}/>}
    </div>
  </div>;
}
function LoginCard({sb,onLocal}){
  const [mode,setMode]=useState('in');   // in | up | reset
  const [email,setEmail]=useState(''); const [pw,setPw]=useState('');
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState(null); const [err,setErr]=useState(null);
  async function go(){
    setErr(null); setMsg(null);
    if(!MIT_RE.test(email.trim())){ setErr('Use your @mit.edu email address.'); return; }
    setBusy(true);
    try{
      if(mode==='up'){
        const {error}=await sb.auth.signUp({email:email.trim(),password:pw});
        if(error) throw error;
        setMsg('Account created. Check your @mit.edu inbox for a confirmation link, then sign in.'); setMode('in');
      } else if(mode==='in'){
        const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
        if(error) throw error; /* auth listener flips the gate */
      } else {
        const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.href});
        if(error) throw error; setMsg('Password reset link sent to your inbox.');
      }
    }catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  }
  return <div className="modal">
    <div className="ph"><h2>{mode==='up'?'Create account':mode==='reset'?'Reset password':'Sign in to MIghTy'}</h2></div>
    <div className="bluebox" style={{marginBottom:14}}>Only <b>@mit.edu</b> email addresses can register. Your outreach log syncs privately to your account — isolated per user, and is what the weekly cap and Google Sheet sync are computed from.</div>
    <label className="fld">MIT email</label>
    <input className="inp" value={email} onChange={e=>setEmail(e.target.value)} placeholder="kerberos@mit.edu" autoFocus/>
    {mode!=='reset' && <><div style={{height:10}}/><label className="fld">Password</label>
      <input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')go();}} placeholder="••••••••"/></>}
    <div style={{marginTop:16}}><button className="btn" style={{width:'100%'}} onClick={go} disabled={busy}>
      {busy?<Dots/>:mode==='up'?'Create account':mode==='reset'?'Send reset link':'Sign in'}</button></div>
    {msg && <div className="okbox" style={{marginTop:12}}>{msg}</div>}
    {err && <div className="warnbox" style={{marginTop:12}}>{err}</div>}
    <div className="divider"/>
    <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5}}>
      {mode==='in' ? <>
        <a style={{cursor:'pointer'}} onClick={()=>setMode('up')}>Create account</a>
        <a style={{cursor:'pointer'}} onClick={()=>setMode('reset')}>Forgot password?</a></>
        : <a style={{cursor:'pointer'}} onClick={()=>setMode('in')}>← Back to sign in</a>}
    </div>
    {onLocal && <div style={{textAlign:'center',marginTop:14}}>
      <a style={{cursor:'pointer',fontSize:12,color:'var(--mute)'}} onClick={onLocal}>Use without an account (local only) →</a></div>}
  </div>;
}
function SetupCard({cfg,setCfg,onLocal}){
  const [show,setShow]=useState(false);
  return <div className="modal">
    <div className="ph"><h2>Set up MIghTy</h2></div>
    <div className="bluebox" style={{marginBottom:14}}>Connect a Supabase project to turn on <b>@mit.edu</b> sign-in, the outreach log, and the weekly cap. One-time, by whoever runs the app — steps in <span className="mono">SETUP.md</span>.</div>
    <label className="fld">Supabase project URL</label>
    <input className="inp" value={cfg.supabaseUrl} onChange={e=>setCfg({supabaseUrl:e.target.value})} placeholder="https://xxxx.supabase.co"/>

    <div style={{display:'flex',gap:8}}>

      <button className="btn ghost sm" onClick={()=>setShow(v=>!v)}>{show?'hide':'show'}</button></div>
    <div className="note" style={{marginTop:10}}>Public keys — safe in the browser; row-level security protects the data. As soon as these are valid, the sign-in screen appears.</div>

/* ============================ Home ============================ */
function Home({db,log,setTab,auth,sbReady,onSignIn}){
  const signedIn = auth.status==='in';
  const sentCount = sentThisWeek(log);
  const shortlisted = log.filter(r=>r.status==='shortlisted').length;
  const pct = Math.min(100, Math.round(100*sentCount/100));
  const nextReset = new Date(weekStartUTC()+7*864e5);
  return <div style={{display:'flex',flexDirection:'column',gap:16}}>
    {sbReady && !signedIn && <div className="panel pad" style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>

    <div className="grid3">
      <Stat k="Sent this week" v={sentCount} sub="/ 100" d={`resets ${fmtDate(nextReset.getTime())} 00:00 UTC`}/>
      <Stat k="Shortlisted" v={shortlisted} d="waiting for a message"/>
      <Stat k="Templates" v={db.templates.length} d="ready to use"/>

    <div className="panel pad">
      <div className="ph"><div><h2>Weekly cap</h2><div className="sub">100 sends per week, tracked from your outreach log.</div></div></div>
      <div className="scorebar"><i style={{width:`${pct}%`}}></i></div>
      <div className="note">{sentCount>=100 ? 'Cap reached — new sends resume after the reset. Shortlisted profiles stay put.' : `${100-sentCount} left this week.`}</div>
    </div>
    <div className="grid2">
      <div className="panel pad">
        <div className="ph"><div><h2>Start here</h2><div className="sub">The outreach workflow.</div></div></div>
        <div className="list">
          <Quick em="📋" t="Shortlist" m="Draft a message and open the profile for profiles the extension sent over." on={()=>setTab('shortlist')}/>
          <Quick em="✉️" t="Templates" m="Write reusable messages with {{firstName}}/{{company}}." on={()=>setTab('templates')}/>
          <Quick em="📊" t="Log" m="See every profile's status and sync it to your Google Sheet." on={()=>setTab('log')}/>

      </div>

        <div className="ph"><div><h2>Extension</h2><div className="sub">The other half of the workflow.</div></div></div>
        <div className="note" style={{marginBottom:10}}>Install the MIghTy LinkedIn Outreach extension (<span className="mono">extension/INSTALL.md</span>) to shortlist profiles as you browse and auto-log confirmed sends. It never clicks Connect/Message for you — you always do that yourself.</div>
        <div className="bluebox">Human-in-the-loop by design: LinkedIn's terms don't allow automating sends, and doing so risks your own account being restricted.</div>

function Quick({em,t,m,on}){ return <div className="row" onClick={on} style={{cursor:'pointer'}}>

/* ============================ Shortlist ============================ */
function Shortlist({db,log,auth,sbReady,doIngest,setRowStatus,onSignIn}){
  const [checking,setChecking]=useState(false);
  const signedIn = auth.status==='in';
  const rows = log.filter(r=>r.status==='shortlisted'||r.status==='deferred')
    .sort((a,b)=>new Date(a.shortlisted_at)-new Date(b.shortlisted_at));
  const capReached = sentThisWeek(log)>=100;

  if(!signedIn){
    return <div className="panel pad">
      <div className="empty"><div className="big">📋</div>Sign in with your @mit.edu email to see profiles the extension shortlists.
        {sbReady && <div style={{marginTop:12}}><button className="btn sm" onClick={onSignIn}>Sign in</button></div>}</div>
    </div>;
  }

  return <div style={{display:'flex',flexDirection:'column',gap:16}}>
    {capReached && <div className="warnbox">Weekly cap of 100 reached — "Mark Sent" is disabled until the reset. Everything below stays right where it is.</div>}
    <div className="panel pad">
      <div className="ph"><div><h2>📋 Shortlist</h2><div className="sub">{rows.length} waiting · pick a template, copy the message, open the profile.</div></div>
        <button className="btn ghost sm" onClick={async()=>{setChecking(true); await doIngest(); setChecking(false);}} disabled={checking}>{checking?<Dots/>:'↻ Check for new profiles'}</button></div>
      {rows.length===0
        ? <div className="empty"><div className="big">📋</div>Nothing shortlisted yet. Use the extension on a LinkedIn search-results page, then come back and hit "Check for new profiles."</div>
        : <div className="list">{rows.map(r=><ShortlistRow key={r.id} row={r} templates={db.templates} capReached={capReached} setRowStatus={setRowStatus}/>)}</div>}
    </div>
  </div>;
}
function ShortlistRow({row,templates,capReached,setRowStatus}){
  const [tplId,setTplId]=useState(templates[0]?.id||'');
  const [busy,setBusy]=useState(false); const [err,setErr]=useState(null);
  const tpl = templates.find(t=>t.id===tplId) || templates[0];
  async function copyAndOpen(){
    if(!tpl) return;
    const msg = renderTemplate(tpl.body, row);
    try{ await navigator.clipboard.writeText(msg); }catch(e){}
    window.open(row.profile_url,'_blank','noopener');
  }
  async function act(fields){
    setBusy(true); setErr(null);
    const r = await setRowStatus(row, fields);
    if(!r.ok) setErr(r.error);
    setBusy(false);
  }
  return <div className="row" style={{flexDirection:'column',alignItems:'stretch',gap:8}}>
    <div style={{display:'flex',alignItems:'center',gap:12}}>
      <div className="grow">
        <div className="t">{row.name || row.profile_url}{row.status==='deferred' && <span className="badge" style={{marginLeft:6}}>deferred</span>}</div>
        <div className="m">{row.title||''}{row.company?` · ${row.company}`:''}</div>
        <a className="linkurl" href={row.profile_url} target="_blank" rel="noopener">{row.profile_url}</a>
      </div>
      {templates.length>1 && <select className="inp" style={{width:'auto'}} value={tplId} onChange={e=>setTplId(e.target.value)}>
        {templates.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
      </select>}
      <button className="btn sm" onClick={copyAndOpen} disabled={!tpl}>Copy message + Open profile</button>
    </div>
    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
      <button className="iconbtn" onClick={()=>act({status:'sent',sent_at:new Date().toISOString()})} disabled={busy||capReached}>Mark Sent</button>
      <button className="iconbtn" onClick={()=>act({status:'deferred'})} disabled={busy}>Defer</button>
      <button className="iconbtn" onClick={()=>act({status:'do_not_contact'})} disabled={busy}>Do Not Contact</button>
    </div>
    {err && <div className="warnbox">{err}</div>}
  </div>;
}

/* ============================ Templates ============================ */
function Templates({db,patch,cfg}){
  const [editing,setEditing]=useState(null); // template id being edited, or 'new'
  const [name,setName]=useState(''); const [body,setBody]=useState('');
  const [polishing,setPolishing]=useState(false);
  const mode = llmMode(cfg);

  function startNew(){ setEditing('new'); setName(''); setBody(''); }
  function startEdit(t){ setEditing(t.id); setName(t.name); setBody(t.body); }
  function save(){
    if(!name.trim()||!body.trim()) return;
    patch('templates', list=>{
      if(editing==='new') return [...list, {id:uid(), name:name.trim(), body:body.trim()}];
      return list.map(t=>t.id===editing?{...t,name:name.trim(),body:body.trim()}:t);
    });
    setEditing(null);
  }
  function remove(id){ patch('templates', list=>list.filter(t=>t.id!==id)); }
  async function polish(){
    if(mode==='none'||!body.trim()) return;
    setPolishing(true);
    try{
      const out = await llm(cfg,
        'Tighten this LinkedIn outreach message: warm, specific, under 400 characters, keep any {{firstName}}/{{company}} placeholders exactly as written. Return only the revised message, no preamble.',
        body);
      setBody(out.trim());
    }catch(e){ /* leave body as-is */ }
    setPolishing(false);
  }

  return <div className="panel pad">
    <div className="ph"><div><h2>✉️ Templates</h2><div className="sub">Use <span className="mono">{'{{firstName}}'}</span> and <span className="mono">{'{{company}}'}</span> — filled in per profile.</div></div>
      {editing===null && <button className="btn sm" onClick={startNew}>＋ New template</button>}</div>

    {editing!==null && <div className="row" style={{flexDirection:'column',alignItems:'stretch',gap:10,marginBottom:14}}>
      <label className="fld">Name</label>
      <input className="inp" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Intro — alumni outreach"/>
      <label className="fld">Message</label>
      <textarea className="inp" rows={4} value={body} onChange={e=>setBody(e.target.value)} placeholder="Hi {{firstName}}, ..."/>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <button className="btn sm" onClick={save} disabled={!name.trim()||!body.trim()}>Save</button>
        <button className="btn ghost sm" onClick={()=>setEditing(null)}>Cancel</button>
        {mode!=='none' && <button className="iconbtn" onClick={polish} disabled={polishing||!body.trim()}>{polishing?<Dots/>:'✨ AI polish'}</button>}
      </div>
    </div>}

    {db.templates.length===0 && editing===null
      ? <div className="empty"><div className="big">✉️</div>No templates yet. Add one to start drafting.</div>
      : <div className="list">{db.templates.map(t=><div key={t.id} className="row">
          <div className="grow"><div className="t">{t.name}</div><div className="m">{t.body}</div></div>
          <button className="iconbtn" onClick={()=>startEdit(t)}>edit</button>
          <button className="iconbtn" onClick={()=>remove(t.id)}>✕</button>
        </div>)}</div>}
  </div>;
}

/* ============================ Log ============================ */
function Log({db,patch,log,auth,sb}){
  const [filter,setFilter]=useState('all');
  const [syncBusy,setSyncBusy]=useState(false); const [syncMsg,setSyncMsg]=useState(null);
  const signedIn = auth.status==='in';
  const FILTERS=[['all','All'],['shortlisted','Shortlisted'],['sent','Sent'],['replied','Replied'],['deferred','Deferred'],['do_not_contact','Do Not Contact']];
  const rows = log.filter(r=>filter==='all'||r.status===filter);

  async function syncNow(){
    if(!sb) return;
    setSyncBusy(true); setSyncMsg(null);
    try{
      const {data,error} = await sb.functions.invoke('sheets-sync', {body:{action:'sync', sheetId:db.settings.sheets.sheetId, tabName:db.settings.sheets.tabName}});
      if(error) throw error;
      if(data.ok){
        setSyncMsg({ok:true, text:`Synced — ${data.updated||0} updated, ${data.appended||0} added.`});
        patch('settings', s=>({...s, sheets:{...s.sheets, lastSyncedAt:now(), lastError:null}}));
      } else {
        setSyncMsg({ok:false, text:data.message||data.error});
        patch('settings', s=>({...s, sheets:{...s.sheets, lastError:data.message||data.error}}));
      }
    }catch(e){ setSyncMsg({ok:false, text:e.message||String(e)}); }
    setSyncBusy(false);
  }

  if(!signedIn) return <div className="panel pad"><div className="empty"><div className="big">📊</div>Sign in to see your outreach log.</div></div>;

  return <div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div className="panel pad">
      <div className="ph"><div><h2>📊 Log</h2><div className="sub">{log.length} profile{log.length!==1?'s':''} tracked{db.settings.sheets.lastSyncedAt?` · last synced ${rel(db.settings.sheets.lastSyncedAt)}`:''}</div></div>
        <button className="btn sm" onClick={syncNow} disabled={syncBusy||!db.settings.sheets.sheetId}>{syncBusy?<Dots/>:'⇪ Sync to Google Sheet'}</button></div>
      {!db.settings.sheets.sheetId && <div className="note" style={{marginBottom:10}}>Add your Google Sheet ID in Settings to enable sync.</div>}
      {syncMsg && <div className={syncMsg.ok?'okbox':'warnbox'} style={{marginBottom:12}}>{syncMsg.text}</div>}
      <div className="seg" style={{marginBottom:12}}>{FILTERS.map(([k,l])=><button key={k} className={filter===k?'on':''} onClick={()=>setFilter(k)}>{l}</button>)}</div>
      {rows.length===0
        ? <div className="empty"><div className="big">📊</div>Nothing here yet.</div>
        : <div className="list">{rows.map(r=><div key={r.id} className="row">
            <div className="grow">
              <div className="t">{r.name||r.profile_url}</div>
              <div className="m">{r.title||''}{r.company?` · ${r.company}`:''} · <span className="tag">{r.status}</span></div>
              <a className="linkurl" href={r.profile_url} target="_blank" rel="noopener">{r.profile_url}</a>
            </div>
            <span className="tag">{rel(new Date(r.updated_at).getTime())}</span>
          </div>)}</div>}
    </div>
  </div>;
}

        </div>
        {saErr && <div className="warnbox" style={{marginTop:10}}>{saErr}</div>}
        {db.settings.sheets.lastError && <div className="warnbox" style={{marginTop:10}}>Last sync error: {db.settings.sheets.lastError}</div>}
        <div className="note" style={{marginTop:10}}>Share your Sheet with that email (Editor access) before syncing — otherwise the sync will fail with "not_shared." Do the actual sync from the <b>Log</b> tab.</div>
      </>}
    </div>

    <div className="panel pad">
      <div className="ph"><div><h2>Extension</h2><div className="sub">Install once per device.</div></div></div>
      <div className="note">Load <span className="mono">extension/</span> unpacked at <span className="mono">chrome://extensions</span>, then connect it to this same Supabase project + your @mit.edu login. Full steps in <span className="mono">extension/INSTALL.md</span>.</div>
    </div>

    <div className="panel pad">
      <div className="ph"><div><h2>Your data</h2><div className="sub">{auth.status==='in'?'Templates/settings synced; outreach log lives server-side.':'In this browser only (guest mode).'}</div></div></div>
      <div className="grid3" style={{gap:12}}>
        <Stat k="Templates" v={db.templates.length}/>
        <Stat k="Logged profiles" v={auth.status==='in' ? '—' : 0} d={auth.status==='in' ? 'see the Log tab' : 'sign in to track'}/>
      </div>
      <div style={{display:'flex',gap:9,marginTop:16,flexWrap:'wrap'}}>
        <button className="btn ghost sm" onClick={exportData}>⤓ Export templates (.json)</button>
        <button className="btn ghost sm" onClick={wipeLocal} style={{color:'var(--brand2)',borderColor:'#E7C2BD'}}>Erase local copy</button>
      </div>
      <div className="divider"/>
      <div className="note"><b>Privacy:</b> MIghTy stores your templates, settings, and outreach log (profiles you shortlisted, messages sent, status). No LinkedIn password is ever stored — the extension acts only in your own logged-in browser session, and never clicks Connect/Message for you.</div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
