<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;background:#FBFAF8;font-family:'Schibsted Grotesk',system-ui,sans-serif;color:#1D1B26}
a{color:#4A3FD1}a:hover{color:#5B4FE9}
button{font-family:'Schibsted Grotesk',system-ui,sans-serif}
:focus-visible{outline:2px solid #5B4FE9;outline-offset:2px}
::selection{background:#EFEDFD}
@keyframes aurora{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:#FBFAF8" data-screen-label="Board">
<aside style="background:#FFFFFF;border-right:1px solid #EFEDE7;display:flex;flex-direction:column;padding:24px 14px 20px">
  <div style="display:flex;align-items:center;gap:10px;padding:0 10px 26px">
    <span style="position:relative;width:26px;height:22px;display:inline-block"><span style="position:absolute;left:0;top:0;width:22px;height:22px;border-radius:99px;background:#4A3FD1"></span><span style="position:absolute;left:9px;top:0;width:22px;height:22px;border-radius:99px;background:#E87A56;mix-blend-mode:multiply"></span></span>
    <span style="font-size:19px;font-weight:800;letter-spacing:-0.3px">Mighty</span>
  </div>
  <nav style="display:flex;flex-direction:column;gap:2px">
    <a href="Mighty Today.dc.html" style="display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;color:#1D1B26;font-weight:500;font-size:15px;text-decoration:none" style-hover="background:#F4F2EE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>Today</a>
    <a href="#" style="display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;color:#4A3FD1;font-weight:600;font-size:15px;text-decoration:none" style-hover="background:#F4F2EE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"></path><path d="M16 5.2a3.5 3.5 0 0 1 0 5.6"></path><path d="M18.5 15.5c1.6.9 2.7 2.4 3 4.5"></path></svg><span style="flex:1">Relationships</span><span style="font-size:12.5px;font-weight:600;color:#4A3FD1;background:#EFEDFD;border-radius:99px;padding:2px 8px">9</span></a>
    <div style="display:flex;flex-direction:column;gap:1px;padding:2px 0 4px 41px">
      <a href="Mighty List.dc.html" style="padding:7px 10px;border-radius:9px;color:#5A5766;font-weight:500;font-size:14px;text-decoration:none" style-hover="background:#F4F2EE;color:#1D1B26">List</a>
      <a href="#" style="padding:7px 10px;border-radius:9px;background:#EFEDFD;border:1.5px solid #D9D4F9;color:#4A3FD1;font-weight:600;font-size:14px;text-decoration:none">Board</a>
      <a href="Mighty Timeline.dc.html" style="padding:7px 10px;border-radius:9px;color:#5A5766;font-weight:500;font-size:14px;text-decoration:none" style-hover="background:#F4F2EE;color:#1D1B26">Timeline</a>
    </div>
    <a href="Mighty Explore.dc.html" style="display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;color:#1D1B26;font-weight:500;font-size:15px;text-decoration:none" style-hover="background:#F4F2EE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m16 8-2.5 5.5L8 16l2.5-5.5L16 8z"></path></svg>Explore</a>
    <a href="Mighty You.dc.html" style="display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;color:#1D1B26;font-weight:500;font-size:15px;text-decoration:none" style-hover="background:#F4F2EE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4.5"></circle><circle cx="12" cy="12" r="1" fill="currentColor"></circle></svg>Me</a>
  </nav>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:16px">
    <button style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:13px;border:none;background:linear-gradient(135deg,#5B4FE9,#4A3FD1);color:#fff;font-weight:600;font-size:14.5px;cursor:pointer;box-shadow:0 6px 18px rgba(91,79,233,.28)" style-hover="background:linear-gradient(135deg,#6A5FF2,#5B4FE9)"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2z"></path></svg>Ask Mighty</button>
    <div style="display:flex;align-items:center;gap:10px;padding:0 6px">
      <span style="width:32px;height:32px;border-radius:99px;background:#EFEDFD;color:#4A3FD1;font-weight:700;font-size:13px;display:grid;place-items:center">R</span>
      <div style="min-width:0"><div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">rmohans@mit.edu</div><a href="Mighty Website.dc.html" style="font-size:11.5px;color:#8A8896;text-decoration:none">Sign out</a></div>
    </div>
  </div>
</aside>
<main style="position:relative;overflow:hidden;min-width:0">
  <div style="position:absolute;top:-160px;left:22%;width:560px;height:560px;border-radius:99em;background:radial-gradient(circle,rgba(91,79,233,.10),transparent 65%);animation:aurora 14s ease-in-out infinite;pointer-events:none"></div>
  <div style="position:relative;max-width:1240px;margin:0 auto;padding:48px 40px 56px">
    <div style="display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap">
      <div style="flex:1;min-width:260px">
        <div style="font-size:12.5px;font-weight:700;letter-spacing:1.4px;color:#4A3FD1;text-transform:uppercase">Toward</div>
        <h1 style="margin:6px 0 0;font-size:36px;line-height:1.05;letter-spacing:-1px;font-weight:800">Raise investment</h1>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <div style="display:flex;gap:2px;background:#F1EFEA;border-radius:99px;padding:4px">
          <a href="Mighty List.dc.html" style="padding:8px 16px;border-radius:99px;color:#5A5766;font-weight:600;font-size:14px;text-decoration:none" style-hover="color:#1D1B26">List</a>
          <a href="#" style="padding:8px 16px;border-radius:99px;background:#FFFFFF;color:#1D1B26;font-weight:600;font-size:14px;text-decoration:none;box-shadow:0 1px 4px rgba(29,27,38,.08)">Board</a>
          <a href="Mighty Timeline.dc.html" style="padding:8px 16px;border-radius:99px;color:#5A5766;font-weight:600;font-size:14px;text-decoration:none" style-hover="color:#1D1B26">Timeline</a>
        </div>
        <a href="Mighty Explore.dc.html" style="padding:11px 18px;border-radius:99px;border:1.5px solid #E0DDD5;background:#fff;color:#1D1B26;font-weight:600;font-size:14px;text-decoration:none" style-hover="background:#F4F2EE">Explore</a>
      </div>
    </div>
    <div style="margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600"><a href="Mighty List.dc.html" style="color:#33313D;text-decoration:none">9 identified</a><span style="color:#E0DDD5">·</span><a href="Mighty Person.dc.html" style="color:#33313D;text-decoration:none">1 replied, waiting on you</a><span style="color:#E0DDD5">·</span><a href="Mighty Board.dc.html" style="color:#8A8896;text-decoration:none">0 of 3 meetings this week</a></div>
    <div style="margin-top:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;align-items:start">
      <sc-for list="{{cols}}" as="col" hint-placeholder-count="4">
        <div style="min-width:0;animation:riseIn .5s cubic-bezier(.2,.7,.3,1) both">
          <div style="display:flex;align-items:center;gap:9px;padding:0 4px 12px">
            <span style="width:9px;height:9px;border-radius:99px;background:{{col.dot}}"></span>
            <span style="font-size:15px;font-weight:700;letter-spacing:-0.2px">{{col.name}}</span>
            <span style="font-size:13px;font-weight:600;color:#B4B1BC">{{col.count}}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <sc-for list="{{col.cards}}" as="p" hint-placeholder-count="2">
              <div style="background:linear-gradient(135deg,#EFEDFD 0%,#F7F1F4 55%,#FBEFE9 100%);border:1px solid #E4E0F7;border-radius:15px;padding:15px 16px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease" style-hover="transform:translateY(-2px);border-color:#D9D4F9;box-shadow:0 8px 22px rgba(91,79,233,.09)">
                <div style="display:flex;align-items:center;gap:11px">
                  <span style="width:34px;height:34px;border-radius:99px;background:{{p.chipBg}};color:{{p.chipFg}};font-weight:700;font-size:12px;display:grid;place-items:center;flex:none">{{p.initials}}</span>
                  <div style="min-width:0">
                    <div style="font-size:14.5px;font-weight:700;letter-spacing:-0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{p.name}}</div>
                    <div style="margin-top:1px;font-size:12.5px;color:#8A8896;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{p.role}}</div>
                  </div>
                </div>
                <div style="margin-top:11px;font-size:13px;font-weight:600;color:{{p.ctaColor}}">{{p.cta}}</div>
              </div>
            </sc-for>
            <sc-if value="{{col.empty}}" hint-placeholder-val="{{ false }}">
              <div style="border:1.5px dashed #E0DDD5;border-radius:15px;padding:22px 16px;font-size:13.5px;color:#B4B1BC">Nobody here yet.</div>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const tints = [
      ['#EFEDFD', '#4A3FD1'], ['#FBEFE9', '#C75B33'], ['#E6F4EC', '#2E8B5F'],
      ['#FBF1E2', '#B0641F'], ['#F1EFEA', '#5A5766']
    ];
    const mk = (arr) => arr.map((p, i) => ({
      ...p, chipBg: tints[i % 5][0], chipFg: tints[i % 5][1],
      cta: p.cta || 'Prepare me', ctaColor: p.ctaColor || '#4A3FD1'
    }));
    const saved = mk([
      { initials: 'HH', name: 'Harshad Hirde', role: 'Product Manager · Building with AI', note: 'Second degree · AI-native SaaS' },
      { initials: 'EJ', name: 'Elena Jovanova', role: 'Country Manager, Oriflame', note: 'Was at Novartis while you were' },
      { initials: 'AT', name: 'Anshul Tibrewala', role: 'Antler India · investing $450K', note: 'Investing in AI-first B2B SaaS' },
      { initials: 'RS', name: 'Rajiv Srivatsa', role: 'Founding Partner, Antler India', note: 'Matched on health, seed' },
      { initials: 'JG', name: 'Jasnoor Gill', role: 'Helping founders at Antler India', note: 'Helps founders at Antler' },
      { initials: 'DL', name: 'Daohao Li', role: 'CEO, Garde', note: 'Overlapped at Stripe · talked once, 2023' },
      { initials: 'PP', name: 'Priyanka Paramita', role: 'Commercial Manager', note: 'Wipro overlap · connected 2013, quiet since' },
      { initials: 'AM', name: 'Amrita Misra', role: 'Associate Director, clinical PM', note: 'Was at Bain while you were' }
    ]);
    const active = [{ initials: 'MA', name: 'Mridul Arora', role: 'Partner at Elevation Capital', chipBg: '#FBEFE9', chipFg: '#C75B33', note: 'Replied 30 Jul', cta: 'Replied · waiting on you', ctaColor: '#C75B33' }];
    const cols = [
      { name: 'Potential', dot: '#C9C6BF', count: 8, cards: saved, empty: false },
      { name: 'Prepared', dot: '#5B4FE9', count: 0, cards: [], empty: true },
      { name: 'Waiting', dot: '#E3A23C', count: 0, cards: [], empty: true },
      { name: 'Active', dot: '#2E8B5F', count: 1, cards: active, empty: false }
    ].map(col => ({ ...col, dotArr: Array.from({ length: col.count }, () => ({ bg: col.dot })) }));
    return { cols };
  }
}
</script>
</body>
</html>
